初衷是吸引外国公司进入美国资本市场：很多外国公司不愿接受美国严格的注册和披露要求，干脆不来美国融资。144A 推出后，外国发行人只需面对美国的大机构，就能借到美元。今天，美国的高收益债市场和新兴市场美元债市场，都在很大程度上建立在 144A 之上。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>在美国向公众发售证券要在 SEC 注册，披露和法律责任都很重。<\/li>\n<li>144A 允许只卖给合格机构买家（QIB）而不注册；Reg S 覆盖完全在美国境外的发行。<\/li>\n<li>国际发行常同时用 144A/Reg S，两部分的买家和转让限制不同，交易时要分清。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家亚洲公司的美元债只按 Reg S 发行。一家美国的对冲基金能不能在发行时买入？为什么？<\/summary>\n<div><p>原则上不能。Reg S 部分只能卖给美国以外的投资者，美国的机构要买，需要有 144A 部分。限售期过后，Reg S 债券在二级市场的转让限制会放宽，但具体能否卖给美国投资者，要看合规部门对这只债券的规定。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-27\"><\/a><\/li>\n<li><a href=\"#L9-30\"><\/a><\/li>\n<li><a href=\"#L17-15\"><\/a><\/li>\n<\/ul><\/div>\n","9.32":"<div class=\"scene\">\n<p>美国财政部每个星期都要借钱，规模动辄几百亿美元。它不会挨个打电话问银行愿不愿意借，而是开一场拍卖：公布要卖多少、什么期限，大家报价，价高者得。全世界的债券交易员都会盯着这些拍卖的结果。<\/p>\n<\/div>\n\n<h2>国债怎样拍卖<\/h2>\n<p>多数国家的国债通过拍卖发行。以美国为例：<\/p>\n<ul>\n<li><strong>提前公布<\/strong>：财政部提前几天公布要发行的期限和金额。<\/li>\n<li><strong>报价<\/strong>：参与者报出想买的金额和能接受的最低收益率。也可以“非竞争性”报价，只说买多少、接受最终价格，主要给小投资者。<\/li>\n<li><strong>统一价格<\/strong>：从最低收益率开始往上分配，直到卖完。所有中标者都按同一个最高中标收益率成交，叫单一价格拍卖（single-price auction）。<\/li>\n<\/ul>\n\n<h2>一级交易商：必须到场的人<\/h2>\n<p>一级交易商（primary dealers）是央行指定的一批大银行和券商。它们有义务参加每一场国债拍卖，按一定比例报价，保证国债一定卖得出去；作为回报，它们可以直接和央行做交易，参与央行的公开市场操作。美国目前有二十多家，欧洲各国也有类似制度。<\/p>\n\n<h2>市场怎么看一场拍卖<\/h2>\n<ul>\n<li><strong>尾差（tail）<\/strong>：最终中标收益率比拍卖前市场预期的收益率高多少。高出很多，说明需求弱，政府要多付利息才卖得掉，叫“拍卖不佳”；低于预期，叫“抢购”。<\/li>\n<li><strong>认购倍数（bid-to-cover）<\/strong>：报价总额除以发行额，越高说明需求越旺。<\/li>\n<li><strong>谁买走了<\/strong>：间接投标人（主要是外国央行和基金）、直接投标人、一级交易商各拿了多少。一级交易商被迫接下的越多，说明真实需求越弱。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>大额长期国债拍卖前，交易员常提前卖出同期限的国债，为拍卖“腾地方”，拍卖后再买回，叫拍卖前的“让价”（concession）。一场糟糕的长期国债拍卖可以让整条曲线的长端上行好几个基点。<\/p>\n<p>拍卖日历、发行量的变化（财政部每季度公布的再融资计划，quarterly refunding）都是利率交易员的重要日程。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2023 年 11 月 9 日，美国 30 年期国债拍卖需求疲弱，中标收益率比拍卖前的市场水平高出约 5bp，是多年来最大的尾差之一，一级交易商被迫接下了比平时多得多的份额。消息一出，30 年期收益率当天大幅上升。这次拍卖被视为市场担心美国财政赤字和国债供给过多的一个信号。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>国债通过拍卖发行，美国采用所有中标者统一价格的单一价格拍卖。<\/li>\n<li>一级交易商有义务参加拍卖，保证国债卖得出去，换取与央行交易的资格。<\/li>\n<li>看拍卖结果主要看尾差、认购倍数和谁买走了；拍卖不佳会推高收益率。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一场 10 年期国债拍卖，认购倍数很高，但一级交易商拿走了 30% 的份额（平时约 15%）。需求到底好不好？<\/summary>\n<div><p>可能不太好。认购倍数高可能只是因为一级交易商按义务报了很多价；关键是最终买走的人。一级交易商拿走的比例翻倍，说明外国央行、基金这些真实的终端买家买得少，交易商只能自己接下，之后还要在市场上卖掉，可能给价格带来压力。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-2\"><\/a><\/li>\n<li><a href=\"#L9-33\"><\/a><\/li>\n<li><a href=\"#L9-9\"><\/a><\/li>\n<\/ul><\/div>\n","9.33":"<div class=\"scene\">\n<p>想买 100 股苹果股票，打开券商 App 点一下就成交。想买 500 万美元的一只公司债呢？没有一个统一的交易所，你得问几家银行：“这只债你们卖多少？”谁报价好就跟谁买。债券市场基本是这样运转的。<\/p>\n<\/div>\n\n<h2>债券主要在场外交易<\/h2>\n<p>股票集中在交易所交易，所有买单和卖单在一个订单簿里撮合。债券则主要是场外交易（over-the-counter，OTC）：投资者和交易商一对一成交。原因很简单：债券数量太多了。一家公司可能只有一只股票，却有几十只不同期限、不同条款的债券，每只每天成交寥寥，集中到交易所撮合不现实。<\/p>\n\n<h2>交易商：市场的中间人<\/h2>\n<p>交易商（dealers），主要是大银行的固定收益交易台，扮演做市商（market maker）的角色：随时报出买价（bid）和卖价（offer），用自己的资产负债表接下客户的买卖，再慢慢找对手平掉。买卖价差（bid-offer spread）就是它们的收入，也是承担库存风险的补偿。<\/p>\n<p>2008 年后，银行的资本和流动性要求大幅提高，持有债券库存变贵了，交易商做市的意愿下降。很多人担心这让债券市场在危机中更容易“卡住”。<\/p>\n\n<h2>电子平台：越来越多的交易搬到网上<\/h2>\n<p>过去债券交易主要靠电话。现在越来越多的交易在电子平台上完成：<\/p>\n<ul>\n<li><strong>交易商对客户平台<\/strong>：比如 Tradeweb、MarketAxess、Bloomberg。客户可以同时向几家交易商发出询价（request for quote，RFQ），选最好的价格成交。<\/li>\n<li><strong>交易商之间的市场<\/strong>：比如美国国债的 BrokerTec，是高度电子化、类似交易所的订单簿市场，高频交易公司也大量参与。<\/li>\n<li><strong>全对全交易<\/strong>（all-to-all）：投资者之间也可以直接成交，不一定经过交易商。<\/li>\n<\/ul>\n<p>流动性最好的国债，交易已经接近股票；冷门的公司债，仍然常常靠电话和交易员之间的关系。<\/p>\n\n<div class=\"desk\">\n<p>交易员说一只债“很活跃”或“很难交易”，看的是买卖价差和能成交的规模。风控评估流动性风险时，也会看这些：平掉一个仓位需要几天、要让出多少价差。<\/p>\n<p>美国有 TRACE 系统，要求公司债的成交在短时间内上报并公开，所以公司债的成交价格比以前透明得多；欧洲在 MiFID II 下也有类似的透明度要求。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2014 年 10 月 15 日，美国国债“闪电涨”。<\/strong>那天上午，10 年期美债收益率在大约 12 分钟内急跌约 16bp、又迅速回到原位，全天波动区间达到约 37bp。在没有重大新闻的情况下，这样的波动极为罕见。事后美国多家监管机构的联合报告指出，当时交易商之间的电子市场里，高频交易公司占了大部分交易量，订单簿的深度在关键时刻迅速变薄。这件事让人看到：电子化让平时的交易更便宜，但在压力下，流动性也可能瞬间蒸发。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>债券主要在场外一对一交易，因为债券品种太多、每只成交太少。<\/li>\n<li>交易商用自己的资产负债表做市，赚买卖价差；2008 年后做市能力有所下降。<\/li>\n<li>电子平台和询价机制让交易越来越透明、便宜，但压力下流动性仍可能突然变差。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同样是 1,000 万美元，买一只刚发行的 10 年期美国国债和一只 7 年前发行的小公司债，交易体验会有什么不同？<\/summary>\n<div><p>国债可以在电子平台上几秒钟成交，买卖价差极小。小公司债可能只有一两家交易商愿意报价，价差大，还可能需要分几天才能买够，价格也可能被你的买单推高。这就是两者流动性的差别，也是为什么风控要单独评估流动性风险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-32\"><\/a><\/li>\n<li><a href=\"#L17-2\"><\/a><\/li>\n<li><a href=\"#L17-3\"><\/a><\/li>\n<\/ul><\/div>\n","9.34":"<div class=\"scene\">\n<p>一个债券基金经理说：“我们今年赚了 5%。”这算好还是不好？要看和谁比。如果整个债券市场涨了 7%，5% 就是跑输了。用来代表“整个市场”的那把尺子，就是<strong>债券指数（bond index）<\/strong>。<\/p>\n<\/div>\n\n<h2>债券指数是什么<\/h2>\n<p>债券指数按一套规则，挑出一篮子债券，计算它们整体的表现。规则通常包括：<\/p>\n<ul>\n<li><strong>入选条件<\/strong>：币种、评级（比如只要投资级）、最低发行规模、剩余期限（比如一年以上）。<\/li>\n<li><strong>权重<\/strong>：大多按市值加权，发行越多的债券权重越大。<\/li>\n<li><strong>再平衡<\/strong>：通常每月调整一次，加入新发行的债券，剔除到期或不再符合条件的。<\/li>\n<\/ul>\n\n<h2>几个最常用的指数<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>指数<\/th><th>覆盖范围<\/th><\/tr>\n<tr><td>彭博美国综合债券指数（US Aggregate，“Agg”）<\/td><td>美国投资级债券：国债、公司债、MBS 等<\/td><\/tr>\n<tr><td>彭博全球综合债券指数（Global Aggregate）<\/td><td>全球投资级债券，多币种<\/td><\/tr>\n<tr><td>ICE 美银高收益指数<\/td><td>美国高收益公司债<\/td><\/tr>\n<tr><td>摩根大通 EMBI、GBI-EM<\/td><td>新兴市场美元债、本币债<\/td><\/tr>\n<tr><td>富时世界国债指数（WGBI）<\/td><td>主要国家的国债<\/td><\/tr>\n<\/table><\/div>\n<p>这些指数是全球数万亿美元资产的基准。中国国债在 2019 年到 2021 年间陆续被纳入彭博、摩根大通和富时的旗舰指数，带来了大量被动资金流入。<\/p>\n\n<h2>债券指数的一个怪现象<\/h2>\n<p>股票指数里，市值大的是“成功”的公司。债券指数里，权重大的是“借钱最多”的发行人。一家公司借得越多，在指数里的分量越重。跟踪指数的投资者，会被动地多借钱给最会借钱的人。这是债券指数常被批评的地方。<\/p>\n\n<div class=\"desk\">\n<p>基金经理和风控会把组合和基准（benchmark）比较：久期比基准长还是短、各行业和评级的权重高还是低、利差敞口差多少。这些差异叫主动风险（active risk），解释了组合为什么跑赢或跑输。衡量主动风险的常用指标是跟踪误差（tracking error）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年美国综合债券指数（Agg）全年下跌约 13%，是自 1976 年有数据以来最差的一年。这一年，几乎所有跟踪它的被动债券基金都录得大幅亏损，很多投资者第一次意识到：“债券指数”也可以跌得很深，尤其当它的久期已经被拉长到 6 年以上时。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>债券指数按规则挑选一篮子债券，衡量整个市场的表现，是基金的业绩基准。<\/li>\n<li>大多按市值加权，所以借钱越多的发行人，权重越大。<\/li>\n<li>组合和基准在久期、行业、评级上的差异，构成了主动风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家的国债被纳入一个大型全球债券指数。为什么它的国债收益率可能下降？<\/summary>\n<div><p>跟踪这个指数的被动基金必须按权重买入这个国家的国债，带来一大笔新的需求。买的人多了，价格上涨，收益率下降。很多资金在正式纳入前就会提前买入。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-48\"><\/a><\/li>\n<li><a href=\"#L9-49\"><\/a><\/li>\n<\/ul><\/div>\n","9.35":"<div class=\"scene\">\n<p>你用久期估算：一只 30 年期、票息 4% 的债券，久期约 17，利率涨 2% 应该跌约 35%。实际一算，只跌了 27% 左右。利率跌 2% 时，估算涨约 35%，实际却涨了 45% 左右。估算为什么总是“跌的时候说多了，涨的时候说少了”？因为价格和利率的关系是一条曲线，这条曲线的弯曲叫<strong>凸性（convexity）<\/strong>。<\/p>\n<\/div>\n\n<h2>久期是直线，现实是曲线<\/h2>\n<p>久期假设价格和利率的关系是一条直线：利率每动一点，价格按固定比例变。实际上，普通债券的价格-利率关系是一条向下弯的曲线：<\/p>\n<ul>\n<li>利率上升时，价格下跌的速度越来越慢。<\/li>\n<li>利率下降时，价格上涨的速度越来越快。<\/li>\n<\/ul>\n<p>小幅变动时，直线和曲线几乎重合，久期很准。大幅变动时，两者的差距就显现出来，差距的大小由凸性决定。<\/p>\n\n<h2>正凸性：对持有人有利<\/h2>\n<p>普通债券的凸性为正：涨的时候比久期估的多，跌的时候比久期估的少。对持有人来说，这是一种“白送的好处”。期限越长、票息越低，凸性越大，零息长债的凸性最大。<\/p>\n<p>当然，市场不会真的白送。凸性大的债券，在其他条件相同时，收益率通常略低一点，投资者为这份“好处”付了钱。<\/p>\n\n<h2>负凸性：可赎回债券和 MBS<\/h2>\n<p>可赎回债券和 MBS 正好相反：利率下降时，发行人会提前赎回，借款人会提前还贷，价格涨不上去；利率上升时，提前还款变少，期限反而变长，价格跌得更多。这种“涨得少、跌得多”的性质叫负凸性（negative convexity）。持有这类资产，相当于卖出了期权，平时多拿一点收益，大波动时吃亏。<\/p>\n\n<div class=\"desk\">\n<p>风险报告里，凸性有时单独列出，有时体现为“利率大幅变动时的损益”（比如 ±100bp 情景）。交易员会说一个仓位“long convexity”（正凸性，喜欢大波动）或“short convexity”（负凸性，怕大波动）。持有大量 MBS 的机构，在利率快速变动时要动态调整对冲，叫凸性对冲（convexity hedging），这种集中的对冲买卖有时会放大利率的波动。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美国 MBS 市场很大，投资者为对冲负凸性而进行的集中买卖，曾多次放大国债市场的波动。例如 2003 年夏天，美国 10 年期国债收益率在约两个月内从 3.1% 左右升到 4.6% 左右。利率上升使 MBS 的久期迅速变长，持有者纷纷卖出国债或支付固定利率互换来对冲，又进一步推高了利率。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>久期是直线近似，凸性描述价格-利率曲线的弯曲，大幅变动时不能忽略。<\/li>\n<li>普通债券是正凸性：涨得比估的多，跌得比估的少；长期、低票息债券凸性最大。<\/li>\n<li>可赎回债券和 MBS 是负凸性：涨得少、跌得多，持有人相当于卖出了期权。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两个组合久期相同，一个全是长期零息国债，一个全是 MBS。如果利率大幅波动（先大涨再大跌），哪个表现更好？<\/summary>\n<div><p>零息国债组合。它是正凸性，利率大涨时跌得比久期估的少，大跌时涨得比估的多，波动对它有利。MBS 组合是负凸性，两个方向都吃亏。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-12\"><\/a><\/li>\n<li><a href=\"#L9-41\"><\/a><\/li>\n<li><a href=\"#L11-16\"><\/a><\/li>\n<li><a href=\"#L24-25\"><\/a><\/li>\n<\/ul><\/div>\n","9.36":"<div class=\"scene\">\n<p>两个交易员的账户，总 DV01 都是零。一个手里全是 5 年期，另一个多了 2 年期、空了 10 年期。今天美联储释放鸽派信号，2 年期收益率跌了 15bp，10 年期只跌了 3bp。第一个人纹丝不动，第二个人赚了一大笔。总 DV01 一样，风险却完全不同。要看清这一点，需要<strong>关键期限 DV01（key rate DV01）<\/strong>。<\/p>\n<\/div>\n\n<h2>把 DV01 拆到每个期限上<\/h2>\n<p>关键期限 DV01（也叫分桶 DV01，bucketed DV01）的做法是：选一组期限点，比如 3 个月、1 年、2 年、5 年、10 年、30 年；每次只把其中一个点的利率移动 1bp，其他点不动，相邻期限之间平滑过渡，看仓位价值变化多少。<\/p>\n<p>结果是一排数字，告诉你风险集中在曲线的哪一段。各桶加起来，大致等于整条曲线平移 1bp 的总 DV01。<\/p>\n\n<h2>它能看出什么<\/h2>\n<ul>\n<li><strong>曲线风险<\/strong>：总 DV01 为零，各桶可能一正一负，曲线变陡或变平都会带来损益。<\/li>\n<li><strong>集中度<\/strong>：风险是不是都堆在某一个期限上。<\/li>\n<li><strong>对冲是否到位<\/strong>：用 10 年期期货对冲一只 7 年期债券，总 DV01 抵消了，但 7 年桶和 10 年桶各留下一块风险。<\/li>\n<li><strong>损益解释<\/strong>：当天各期限利率的变动 × 各桶 DV01，就是利率部分的损益。<\/li>\n<\/ul>\n\n<h2>移动的是什么曲线<\/h2>\n<p>分桶的结果取决于移动的是哪条曲线：零息利率、还是市场报价的平价利率（互换利率、期货价格）。交易员一般看平价曲线的分桶，因为对冲工具就是按平价利率交易的。两种分桶可以互相换算，但数字会不同。拿到一份分桶 DV01，先确认它是按什么曲线、什么期限点算的。<\/p>\n\n<div class=\"desk\">\n<p>利率台的风险报告，最核心的一张表就是按币种、按期限分桶的 DV01。限额也常按桶设：比如“10 年桶 DV01 不超过 5 万美元”，再加一个曲线限额，限制长短端之间的反向仓位。监管上，FRTB 标准法规定了一组固定的期限点（0.25、0.5、1、2、3、5、10、15、20、30 年），银行内部的分桶要映射到这些点上。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年美联储快速加息时，美国 2 年期国债收益率从年初约 0.7% 升到年底约 4.4%，10 年期从约 1.5% 升到约 3.9%，曲线从正常变成了深度倒挂。一个只看总 DV01、自认为利率风险已对冲的组合，如果是“多长端、空短端”，就会在这次熊平中遭受大额亏损。分桶 DV01 正是为了看清这类风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>关键期限 DV01 把利率风险拆到各个期限点，各桶加起来约等于总 DV01。<\/li>\n<li>它能看出曲线风险、集中度和对冲留下的残余风险，也是损益解释的基础。<\/li>\n<li>分桶结果取决于移动的曲线和期限点，使用前要先确认约定。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个组合的分桶 DV01：2 年桶 +3 万美元（多头）、10 年桶 −3 万美元（空头）。今天 2 年期收益率上升 10bp，10 年期上升 2bp。大约赚亏多少？<\/summary>\n<div><p>按“多头为正”记，利率上升时多头亏钱：2 年桶亏约 3 万 × 10 = 30 万，10 年桶空头赚约 3 万 × 2 = 6 万，合计亏约 24 万美元。曲线熊平，对这个“做陡”的组合不利。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-13\"><\/a><\/li>\n<li><a href=\"#L9-40\"><\/a><\/li>\n<li><a href=\"#L9-44\"><\/a><\/li>\n<li><a href=\"#L24-29\"><\/a><\/li>\n<\/ul><\/div>\n","9.37":"<div class=\"scene\">\n<p>两个人在讨论同一只公司债。一个说“它的利差是 135”，另一个说“不对，是 118”。两人都没算错，只是用了不同的“利差”。信用市场至少有五种常用的量法，每一种回答的问题略有不同。<\/p>\n<\/div>\n\n<h2>G-spread：和国债比<\/h2>\n<p>G-spread（government spread）= 债券的到期收益率 − 同期限国债的收益率。最简单直观，媒体和投资者报价最常用。<\/p>\n<p>问题是：同期限的国债不一定正好存在，常常要在两只国债之间插值；国债本身有时因为特殊需求（比如被大量借来交割）而收益率偏低，会让 G-spread 看起来偏大。<\/p>\n\n<h2>I-spread：和利率互换比<\/h2>\n<p>I-spread（interpolated spread）= 债券的到期收益率 − 同期限利率互换的利率（swap rate）。很多银行和投资者用互换来对冲利率风险，所以更关心债券相对互换的利差。欧洲市场尤其常用。<\/p>\n\n<h2>Z-spread：在整条曲线上加同一个利差<\/h2>\n<p>前两种都只用了一个期限的利率，相当于假设曲线是平的。Z-spread（zero-volatility spread）更精细：把整条零息曲线（通常是国债或互换曲线）上的每一个点都加上同一个利差，让所有现金流折现后的价值正好等于债券价格。这个利差就是 Z-spread。<\/p>\n<p>曲线越陡、现金流越分散，Z-spread 和 I-spread 的差别越大。风险系统和估值模型里，Z-spread 用得最多。<\/p>\n\n<h2>OAS：扣掉期权之后的利差<\/h2>\n<p>对于可赎回债券、MBS 这类含权债券，Z-spread 里混着两样东西：信用和流动性的补偿，以及投资者卖出期权得到的补偿。期权调整利差（option-adjusted spread，OAS）用利率模型模拟很多种利率路径，把期权的价值扣掉，剩下的才是“纯粹”的利差。<\/p>\n<p>对普通债券，OAS 和 Z-spread 几乎一样。对含权债券，OAS 低于 Z-spread，差额就是期权的价值。比较含权债券和普通债券谁更便宜，要用 OAS。<\/p>\n\n<h2>资产互换利差：换成浮息后多拿多少<\/h2>\n<p>资产互换（asset swap）是：买入一只固定利率债券，同时做一笔利率互换，把固定票息换成浮动利率。最终得到的是“基准浮动利率 + 某个利差”，这个利差就是资产互换利差（asset swap spread，ASW）。银行买债券常这样做，因为它们的资金成本是浮动的。<\/p>\n\n<div class=\"tbl\"><table>\n<tr><th>利差<\/th><th>和什么比<\/th><th>常用在<\/th><\/tr>\n<tr><td>G-spread<\/td><td>同期限国债收益率<\/td><td>报价、媒体、投资者沟通<\/td><\/tr>\n<tr><td>I-spread<\/td><td>同期限互换利率<\/td><td>欧洲市场、用互换对冲的投资者<\/td><\/tr>\n<tr><td>Z-spread<\/td><td>整条零息曲线 + 同一利差<\/td><td>估值、风险系统<\/td><\/tr>\n<tr><td>OAS<\/td><td>扣除期权价值后的利差<\/td><td>可赎回债、MBS<\/td><\/tr>\n<tr><td>ASW<\/td><td>换成浮息后相对基准利率的利差<\/td><td>银行、资产负债管理<\/td><\/tr>\n<\/table><\/div>\n\n<div class=\"desk\">\n<p>风险报告里的“利差”和 CS01，一定要写明是哪一种利差移动 1bp。Z-spread 移动 1bp 和 OAS 移动 1bp，对含权债券的影响不一样。不同系统、不同部门用的利差不同，把两边的数字放在一起比较前，先统一口径。<\/p>\n<p>交易员常说“这只债相对国债 +130，相对互换 +115”，两者之差大致就是那个期限的互换利差（swap spread）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机以后，美国 30 年期互换利差长期为负：30 年期利率互换的利率低于同期限国债收益率。原因包括国债供给大增、银行持有国债的资本成本上升、养老金通过互换获取长久期等。在这种环境下，同一只公司债的 I-spread 会明显大于 G-spread。只看其中一种利差，可能误判这只债相对历史是贵还是便宜。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>G-spread 对国债，I-spread 对互换，都只用一个期限的利率。<\/li>\n<li>Z-spread 在整条零息曲线上加同一个利差，是估值和风险系统最常用的口径。<\/li>\n<li>OAS 扣掉期权价值，用来比较含权债券；资产互换利差衡量换成浮息后的收益。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只可赎回公司债的 Z-spread 是 180bp，OAS 是 120bp。同一家公司一只期限相近的普通债券，Z-spread 是 140bp。哪只更便宜？<\/summary>\n<div><p>用 OAS 比较：可赎回债扣掉期权后只有 120bp，普通债券（没有期权，OAS 约等于 Z-spread）是 140bp。所以普通债券更便宜。可赎回债多出来的 60bp 只是对你卖出赎回权的补偿，不是额外的信用回报。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-14\"><\/a><\/li>\n<li><a href=\"#L9-38\"><\/a><\/li>\n<li><a href=\"#L9-41\"><\/a><\/li>\n<li><a href=\"#L16-6\"><\/a><\/li>\n<\/ul><\/div>\n","9.38":"<div class=\"scene\">\n<p>一个公司债组合，经理用国债期货把利率风险全部对冲掉了，DV01 接近零。他说：“现在我们只赚利差。”那么剩下的风险有多大？要看另一个数字：<strong>CS01<\/strong>。<\/p>\n<\/div>\n\n<h2>CS01：利差动 1bp，赚亏多少<\/h2>\n<p>CS01 是信用利差上升 1 个基点时，仓位价值的变化。它和 DV01 是一对：<\/p>\n<ul>\n<li>DV01：无风险利率（国债或互换曲线）动 1bp。<\/li>\n<li>CS01：信用利差动 1bp，无风险利率不动。<\/li>\n<\/ul>\n<p>对普通固定利率公司债，CS01 和 DV01 大小几乎一样，因为两种变化对价格的作用方式相同。但它们背后是两种完全不同的风险，会在不同的时候发作：利率风险跟着央行和通胀，利差风险跟着经济周期和市场恐慌。<\/p>\n\n<h2>为什么要分开管<\/h2>\n<p>一个组合可能完全对冲了利率风险，却承担着大量利差风险；也可能反过来，持有浮息债，利率风险很小，利差风险却很大。只看总的价格敏感度，会把两种风险混在一起，看不出组合真正押注的是什么。<\/p>\n<p>在危机里，两者常常朝相反方向走：恐慌时国债收益率下降（利好），公司债利差走阔（利空）。一个没有对冲利率的投资级组合，两者部分抵消；一个对冲了利率的组合，就要全额承受利差走阔的损失。<\/p>\n\n<h2>CS01 也要分维度看<\/h2>\n<ul>\n<li><strong>按发行人<\/strong>：单一公司的 CS01 不能太集中。<\/li>\n<li><strong>按行业和评级<\/strong>：避免整个组合押在一个行业或一个评级档。<\/li>\n<li><strong>按期限<\/strong>：短期和长期的利差变化幅度不同。<\/li>\n<li><strong>相对敏感度<\/strong>：高收益债的利差按比例变化更大，要配合相对冲击（比如利差同比扩大 1%）一起看。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>信用台的对冲工具主要是 CDS 和信用指数（比如 CDX、iTraxx）：买入保护可以对冲 CS01。用指数对冲整体利差，留下个别公司的选择，是常见的做法。剩下的风险叫基差风险：债券的利差和 CDS 的利差并不完全同步。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机期间，美国国债收益率大幅下降，投资级公司债利差却从 2007 年初的约 1 个百分点扩大到 2008 年底的 6 个百分点左右。一些用国债期货对冲了利率风险、专门“赚利差”的杠杆组合，承受了利差走阔的全部损失，同时还要面对融资收紧，被迫在最差的时点卖出。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>CS01 是信用利差动 1bp 的损益，和 DV01 一起把公司债的风险拆成两部分。<\/li>\n<li>普通公司债的 CS01 和 DV01 大小相近，但背后是不同的风险，危机中常常反向变动。<\/li>\n<li>CS01 要按发行人、行业、评级、期限分开看，并配合相对敏感度。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>市场恐慌时，国债收益率下降 30bp，公司债利差走阔 50bp。一只 DV01 和 CS01 都是 1 万美元的公司债，大约赚亏多少？如果用国债期货对冲了 DV01 呢？<\/summary>\n<div><p>没对冲：利率下降赚约 30 万美元，利差走阔亏约 50 万美元，净亏约 20 万美元。对冲了 DV01：利率部分的收益被期货亏损抵消，只剩利差走阔的亏损，约亏 50 万美元。对冲利率风险，等于把利差风险完全暴露出来。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-37\"><\/a><\/li>\n<li><a href=\"#L24-21\"><\/a><\/li>\n<li><a href=\"#L16-25\"><\/a><\/li>\n<\/ul><\/div>\n","9.39":"<div class=\"scene\">\n<p>一个公司债交易员早上买进了 2 亿美元的 7 年期公司债，准备慢慢卖给客户。在卖出之前，他不想承担利率风险，只想赚利差。他有两个选择：卖出国债期货，或者做一笔付固定的利率互换。两种对冲都能抵消 DV01，留下的风险却不一样。<\/p>\n<\/div>\n\n<h2>用国债期货对冲<\/h2>\n<p>国债期货流动性极好，交易成本低，几秒钟就能成交。对冲的做法是：卖出 DV01 相等的期货。<\/p>\n<ul>\n<li>期货的 DV01 跟着它的最便宜可交割券（cheapest-to-deliver，CTD）走，大约等于 CTD 的 DV01 除以转换因子。<\/li>\n<li>对冲后剩下的风险：公司债和国债之间的利差（信用利差），以及期货和现货之间的基差。<\/li>\n<li>CTD 可能会切换，期货的 DV01 随之跳动，需要调整对冲。<\/li>\n<\/ul>\n\n<h2>用利率互换对冲<\/h2>\n<p>做一笔付固定、收浮动的利率互换，名义本金按 DV01 相等来定。<\/p>\n<ul>\n<li>互换可以按需选择期限，正好对上 7 年期，曲线风险更小。<\/li>\n<li>对冲后剩下的风险：公司债相对互换的利差（资产互换利差），以及互换利差（swap spread）的变化。<\/li>\n<li>互换要占用资产负债表、需要交保证金，期货的保证金通常更低。<\/li>\n<\/ul>\n\n<h2>选哪个<\/h2>\n<p>短期、快进快出的对冲，多用期货；期限要精确匹配、持有时间长的对冲，多用互换。投资者习惯怎么衡量这只债的利差（相对国债还是相对互换），也会影响选择：如果市场按 I-spread 交易这只债，用互换对冲更“干净”。<\/p>\n\n<div class=\"desk\">\n<p>对冲之后，风险报告里的总 DV01 接近零，但分桶 DV01 可能不为零：用 10 年期期货对冲 7 年期债券，会在 7 年和 10 年两个桶各留一块。还要看对冲工具带来的新风险：期货的基差风险、互换的利差风险和交易对手风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年以后，美国长期互换利差变成负数，而且波动较大。很多用利率互换对冲公司债的投资者发现，即使信用利差没变，互换利差的变化也会带来明显的损益。在 2020 年 3 月，互换利差和国债期货基差都出现了剧烈波动，不同的对冲方式，结果差别很大。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>用期货对冲：流动性好、成本低，但有期货基差和 CTD 切换风险。<\/li>\n<li>用互换对冲：期限可以精确匹配，但有互换利差、资产负债表和交易对手的成本。<\/li>\n<li>对冲后总 DV01 为零，仍要看分桶残余、基差和利差风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个交易员用 10 年期国债期货对冲手里的 10 年期德国国债。这个对冲有什么问题？<\/summary>\n<div><p>如果用的是美国国债期货，那就是用美元利率对冲欧元利率，两者不会同步变动，基差风险很大，还多了汇率风险。应该用德国国债期货（Bund 期货）或者欧元利率互换来对冲。对冲工具和被对冲资产越接近，残余风险越小。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-4\"><\/a><\/li>\n<li><a href=\"#L9-43\"><\/a><\/li>\n<li><a href=\"#L9-37\"><\/a><\/li>\n<li><a href=\"#L16-6\"><\/a><\/li>\n<\/ul><\/div>\n","9.40":"<div class=\"scene\">\n<p>每天早上，银行的系统都要先做一件事：根据昨晚的市场报价，“画”出几十条利率曲线。没有这些曲线，系统里的几万笔债券和互换就没法估值，风险报告也算不出来。这一步叫<strong>曲线构建（curve building）<\/strong>。<\/p>\n<\/div>\n\n<h2>从市场报价出发<\/h2>\n<p>市场上能直接看到的，是一些流动性好的工具的报价：<\/p>\n<ul>\n<li>短端：隔夜利率、短期利率期货、短期 OIS。<\/li>\n<li>中长端：各期限的利率互换利率（平价利率），或者国债的价格和收益率。<\/li>\n<\/ul>\n<p>这些报价只在少数几个期限上有，而估值需要曲线上每一天的利率。曲线构建就是把这些零散的点，变成一条连续、合理的曲线。<\/p>\n\n<h2>剥离法：一步一步往后推<\/h2>\n<p>最常用的方法叫剥离法（bootstrapping）：<\/p>\n<ol>\n<li>先用最短期的工具，得到最短期的零息利率。<\/li>\n<li>再用下一个期限的工具：它的现金流中，前面期限的部分已经可以用已知的利率折现，剩下的那一部分就能解出新的零息利率。<\/li>\n<li>如此一步一步往后推，直到最长期限。<\/li>\n<\/ol>\n<p>相邻期限之间用插值方法（interpolation）填满。插值方法看似是技术细节，却会影响远期利率是否平滑，以及分桶 DV01 的形状。<\/p>\n\n<h2>一种货币不止一条曲线<\/h2>\n<p>2008 年以后，衍生品定价进入“多曲线”时代：<\/p>\n<ul>\n<li><strong>折现曲线<\/strong>：通常用 OIS 曲线，因为有抵押品的交易，抵押品按隔夜利率计息。<\/li>\n<li><strong>预测曲线<\/strong>：每种浮动利率（比如 3 个月 EURIBOR）各有一条，用来预测未来的浮动利息。<\/li>\n<li><strong>国债曲线<\/strong>：用来给国债估值、计算利差。<\/li>\n<li><strong>信用曲线<\/strong>：每个发行人一条，用 CDS 或债券价格构建。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>曲线构建是模型风险的重点：用哪些工具、选哪些期限点、用什么插值方法，都会影响估值和风险。产品控制会用独立数据重建曲线、核对前台的估值；模型验证团队会测试曲线在极端情况下（比如负利率、央行议息会议前后）是否合理。分桶 DV01 的期限点，通常就是曲线构建所用工具的期限。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2014 年到 2022 年间，欧元区出现负利率，€STR 和其前身 EONIA 长期低于零。很多早期的曲线构建和期权模型假设利率不会为负，遇到负利率时会出错或给出不合理的结果。银行不得不修改插值方法、改用能处理负利率的模型。这说明曲线构建里看似技术性的选择，在市场环境变化时会变成实际问题。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>曲线构建把少数期限的市场报价，变成连续的利率曲线，是所有估值和风险的起点。<\/li>\n<li>常用剥离法一步步推出零息利率，相邻期限用插值填满。<\/li>\n<li>一种货币有折现曲线、预测曲线、国债曲线和信用曲线，选择不同会影响估值和风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同一笔利率互换，前台系统和风控系统算出的估值差了 2 万美元。最可能是哪里不一样？<\/summary>\n<div><p>最可能是曲线构建的差别：用了不同的市场报价时间点（比如收盘价取的时刻不同）、不同的工具组合、不同的插值方法，或者折现曲线的选择不同（OIS 还是别的）。核对时先确认两边的输入数据和曲线设置是否一致。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-8\"><\/a><\/li>\n<li><a href=\"#L9-36\"><\/a><\/li>\n<li><a href=\"#L16-44\"><\/a><\/li>\n<\/ul><\/div>\n","9.41":"<div class=\"scene\">\n<p>你手里有一只 10 年期可赎回债券，计算普通久期得到 8。可是交易员告诉你：“这只债的有效久期只有 3。”为什么差这么多？因为它很可能两年后就被赎回，根本不会活到 10 年。对含权债券，普通的久期会误导，要用<strong>有效久期（effective duration）<\/strong>。<\/p>\n<\/div>\n\n<h2>含权债的现金流会变<\/h2>\n<p>普通久期假设现金流是固定的。可赎回债、可回售债、MBS 这类含权债券（bonds with embedded options），现金流会随利率变化：<\/p>\n<ul>\n<li>可赎回债：利率下降时可能被提前赎回，现金流提前结束。<\/li>\n<li>MBS：利率下降时借款人提前还款，本金更早回来；利率上升时提前还款变少，期限反而变长。<\/li>\n<li>可回售债：利率上升时投资者可能回售，期限缩短。<\/li>\n<\/ul>\n\n<h2>有效久期：用模型重新估值<\/h2>\n<p>有效久期的做法是：把整条收益率曲线上下各移动一点（比如 ±25bp），用一个能处理期权的模型（利率树或蒙特卡洛），分别重新估值，看价格变化了多少。因为模型会在利率变动时重新判断“会不会被赎回、会不会提前还款”，算出来的久期就把期权的影响考虑进去了。<\/p>\n<p>同样的方法也能算有效凸性（effective convexity）：可赎回债和 MBS 常常是负的。<\/p>\n\n<h2>期权调整利差<\/h2>\n<p>含权债的利差，也要用期权调整利差（OAS）来看：用同一个模型，找出一个利差，让模型价格等于市场价格。OAS 扣除了期权的价值，可以和普通债券的利差直接比较。<\/p>\n\n<div class=\"desk\">\n<p>风险系统里，含权债和 MBS 的 DV01 都应该是“有效”的，也就是用模型重估得到的，而不是按固定现金流算的。这让它们的风险数字依赖于模型假设：利率波动率、提前还款模型。模型验证团队会重点检查这些假设，风险报告也常把模型相关的不确定性单独说明。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年到 2021 年利率处在低位，美国机构 MBS 的提前还款大幅加快，有效久期缩短到 2 年左右。2022 年利率急升后，提前还款几乎停止，MBS 的有效久期迅速拉长到 6 年左右。持有大量 MBS 的银行和基金发现，自己的利率风险在利率上升的过程中自动变大了，这正是负凸性的体现，也是硅谷银行等机构利率风险快速膨胀的原因之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>含权债的现金流会随利率变化，普通久期会误导。<\/li>\n<li>有效久期用模型在利率上下移动时重新估值，把期权的影响计算在内；有效凸性同理。<\/li>\n<li>含权债要用 OAS 比较利差；它的风险数字依赖模型假设，需要验证。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只可赎回债券的价格远高于赎回价（比如 108，赎回价 100）。它的有效久期是更接近到期日的久期，还是更接近赎回日的久期？<\/summary>\n<div><p>更接近赎回日的久期。价格远高于赎回价，说明票息远高于市场利率，发行人很可能在第一个赎回日赎回。市场按“会被赎回”来定价，利率小幅变动时，价格主要受到赎回日之前那段现金流的影响，有效久期就短。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-20\"><\/a><\/li>\n<li><a href=\"#L9-35\"><\/a><\/li>\n<li><a href=\"#L9-37\"><\/a><\/li>\n<li><a href=\"#L11-16\"><\/a><\/li>\n<\/ul><\/div>\n","9.42":"<div class=\"scene\">\n<p>一个利率交易员认为，美联储降息的节奏会比市场预期的快。他可以直接买入国债，赌利率下降。但他更精确地判断：短端利率会比长端下降得多。于是他买入 2 年期、卖出 10 年期，两边的 DV01 相等。只要曲线变陡，他就赚钱，不管利率整体是涨是跌。这就是<strong>相对价值交易（relative value trade）<\/strong>。<\/p>\n<\/div>\n\n<h2>不赌方向，赌关系<\/h2>\n<p>相对价值交易的核心是：买入相对便宜的、卖出相对贵的，让大部分方向性风险互相抵消，只留下对“两者关系”的判断。在固定收益里最常见的几种：<\/p>\n<div class=\"tbl\"><table>\n<tr><th>交易<\/th><th>怎么做<\/th><th>押注<\/th><\/tr>\n<tr><td>曲线交易<\/td><td>做陡：买短卖长；做平：买长卖短（DV01 相等）<\/td><td>收益率曲线变陡或变平<\/td><\/tr>\n<tr><td>蝶式交易<\/td><td>买两翼（如 2 年和 10 年），卖腹部（如 5 年），或反过来<\/td><td>曲线的弯曲程度变化<\/td><\/tr>\n<tr><td>利差交易<\/td><td>买一只债、卖另一只债或互换<\/td><td>两者之间的利差回归<\/td><\/tr>\n<tr><td>新老券交易<\/td><td>卖新发行的基准券、买期限相近的老券<\/td><td>两者的收益率差距收窄<\/td><\/tr>\n<tr><td>跨市场交易<\/td><td>买一个国家的国债、卖另一个国家的<\/td><td>两国利差变化<\/td><\/tr>\n<\/table><\/div>\n\n<h2>怎么判断贵和便宜<\/h2>\n<p>交易员通常用模型拟合一条“公允”的曲线，看哪些债券的收益率高于（便宜）或低于（贵）这条曲线。也会看历史：某个利差现在处在历史区间的什么位置。还要看持有收益（carry）和骑乘效应：一笔交易即使判断对了，持有期间如果每天都在亏 carry，也不划算。<\/p>\n\n<h2>风险在哪里<\/h2>\n<p>相对价值交易每笔赚的钱通常很少，要用杠杆放大。风险在于：价差可能长时间不回归，甚至进一步扩大；市场紧张时融资收紧、被迫平仓。“理论上终会回归”的交易，在回归之前可能先让你出局。<\/p>\n\n<div class=\"desk\">\n<p>风险报告里，相对价值仓位的总 DV01 通常很小，风险藏在分桶 DV01（曲线风险）、利差敏感度和基差里。风控会特别关注杠杆、融资期限，以及压力情景下价差进一步扩大的损失。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1998 年长期资本管理公司（LTCM）就是做相对价值交易的代表：比如买入相对便宜的美国老国债、卖出相对贵的新国债，赌两者的收益率差距收窄。这些交易单笔利润很薄，LTCM 用二三十倍的杠杆放大。俄罗斯违约后，投资者涌向流动性最好的新国债，价差不但没收窄，反而大幅扩大，LTCM 最终崩溃。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>相对价值交易买便宜、卖贵，抵消方向性风险，只押注两者关系的变化。<\/li>\n<li>常见形式：曲线、蝶式、利差、新老券、跨市场交易；判断依据包括模型、历史和 carry。<\/li>\n<li>单笔利润薄、靠杠杆，最大风险是价差不回归时被迫平仓。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个交易员做了一笔“做平”交易：买 10 年期、卖 2 年期，DV01 相等。如果央行意外大幅加息，会发生什么？<\/summary>\n<div><p>央行加息通常让短端利率上升得更多，曲线变平。他卖出了 2 年期（短端利率上升时赚钱），买入了 10 年期（长端涨得少，亏得少），整体赚钱。这正是做平交易押注的情景。如果加息让市场担心通胀失控、长端涨得更多，曲线变陡，他就会亏钱。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-7\"><\/a><\/li>\n<li><a href=\"#L9-10\"><\/a><\/li>\n<li><a href=\"#L9-36\"><\/a><\/li>\n<li><a href=\"#L9-43\"><\/a><\/li>\n<\/ul><\/div>\n","9.43":"<div class=\"scene\">\n<p>美国国债期货的价格，理论上应该等于现货国债价格加上持有成本。但实际中，期货常常比理论值稍贵一点，因为很多资产管理公司喜欢用期货来获得利率敞口。对冲基金看到了这个机会：买入现货国债，卖出期货，用回购借钱买现货，赚两者之间的小差价。这就是著名的<strong>国债基差交易（Treasury basis trade）<\/strong>。<\/p>\n<\/div>\n\n<h2>基差是什么<\/h2>\n<p>国债期货的基差（basis）= 现货价格 − 期货价格 × 转换因子。期货到期时，空头可以交付一篮子符合条件的国债中的任何一只，通常会选最便宜的那只，叫最便宜可交割券（CTD）。到期时，基差会收敛到接近零。<\/p>\n<p>扣除持有现货期间的收益（票息减回购融资成本）后，剩下的就是净基差（net basis）；把期货价格隐含的融资利率算出来，叫隐含回购利率（implied repo rate）。如果隐含回购利率高于实际能借到的回购利率，买现货、卖期货就有利可图。<\/p>\n\n<h2>为什么会有这个机会<\/h2>\n<ul>\n<li>资产管理公司、养老金偏好用期货获得利率敞口：省资金、操作简单。它们大量买入期货，把期货推贵。<\/li>\n<li>交易商受资本约束，不愿意自己做这笔交易，留给了对冲基金。<\/li>\n<li>对冲基金用回购为现货融资，杠杆常常高达几十倍，每笔只赚几个基点。<\/li>\n<\/ul>\n<p>这笔交易让资产管理公司的需求和国债市场连接起来，对市场流动性有正面作用；但它的规模和杠杆，也让它成为系统性风险的关注点。<\/p>\n\n<h2>风险在哪里<\/h2>\n<ul>\n<li><strong>融资风险<\/strong>：回购利率上升、回购折扣提高，或者借不到钱。<\/li>\n<li><strong>保证金风险<\/strong>：期货的保证金要求在波动加大时上升。<\/li>\n<li><strong>基差扩大<\/strong>：市场混乱时，现货被抛售、期货相对更贵，基差进一步扩大，账面亏损。<\/li>\n<li><strong>拥挤交易<\/strong>：很多基金做同样的交易，出事时一起平仓。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>交易商的回购台是基差交易的主要融资方。风控关注每个对冲基金客户的回购融资规模、杠杆、折扣，以及压力情景下的追加保证金需求。监管机构也密切关注：美国证监会推动国债回购集中清算，部分原因就是为了降低这类交易的风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月疫情冲击时，国债现货被大量抛售，期货和现货价格关系出现异常，期货保证金要求上升，回购融资收紧。很多做基差交易的对冲基金被迫同时平仓，大量卖出国债现货，加剧了国债市场的混乱。美联储随后大规模购买国债，市场才恢复正常。2025 年 4 月关税冲击期间，市场也一度担心基差交易平仓，再次引发对这类交易规模的讨论。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>国债基差交易是买现货、卖期货、用回购融资，赚期货相对偏贵的小差价。<\/li>\n<li>机会来自资产管理公司对期货的偏好和交易商的资本约束；对冲基金用高杠杆放大收益。<\/li>\n<li>风险在于融资、保证金、基差扩大和拥挤平仓，2020 年 3 月是典型案例。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个对冲基金的基差交易，DV01 基本完全对冲。为什么在市场暴跌时它还是可能亏损甚至爆仓？<\/summary>\n<div><p>因为它对冲掉的只是利率方向风险。它仍然承担融资风险（回购借不到钱或折扣上升）、保证金风险（期货要追加保证金）和基差扩大的风险。高杠杆下，任何一个出问题都可能导致被迫平仓，而集中平仓又会进一步扩大基差。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-4\"><\/a><\/li>\n<li><a href=\"#L10-4\"><\/a><\/li>\n<li><a href=\"#L10-6\"><\/a><\/li>\n<li><a href=\"#L9-42\"><\/a><\/li>\n<\/ul><\/div>\n","9.44":"<div class=\"scene\">\n<p>收益率曲线上有几十个期限，每天每个点都在动。看起来乱七八糟，但统计学家发现：绝大部分时候，整条曲线只做三种动作。抓住这三种动作，就抓住了曲线变动的九成以上。<\/p>\n<\/div>\n\n<h2>三种动作<\/h2>\n<ul>\n<li><strong>水平（level）<\/strong>：整条曲线一起上移或下移。这是最主要的动作，通常能解释八成以上的曲线变动。<\/li>\n<li><strong>斜率（slope）<\/strong>：短端和长端反向变动，曲线变陡或变平。<\/li>\n<li><strong>曲度（curvature）<\/strong>：中间那段和两头反向变动，曲线的“弯”变大或变小。<\/li>\n<\/ul>\n<p>这三个因子是用主成分分析（principal component analysis，PCA）从历史数据里找出来的，在不同国家、不同时期都相当稳定。<\/p>\n\n<h2>它有什么用<\/h2>\n<ul>\n<li><strong>简化风险<\/strong>：几十个分桶 DV01，可以浓缩成对三个因子的敏感度：组合对水平、斜率、曲度各有多大敞口。<\/li>\n<li><strong>构建交易<\/strong>：想只押注斜率、不受水平影响，就把交易设计成对水平因子中性。蝶式交易就是押注曲度。<\/li>\n<li><strong>压力测试和 VaR<\/strong>：用这几个因子生成情景，比独立移动每个期限更合理。<\/li>\n<li><strong>判断贵贱<\/strong>：去掉三个因子能解释的部分，剩下的“残差”大，说明某个期限相对偏离。<\/li>\n<\/ul>\n\n<h2>局限<\/h2>\n<p>PCA 是从历史数据估计出来的，市场环境变化时，因子的形状和重要性也会变。比如央行把短端钉在零附近的那些年，短端几乎不动，水平因子主要体现在长端。所以 PCA 的结果要定期更新，也不能完全替代分桶 DV01。<\/p>\n\n<div class=\"desk\">\n<p>利率交易员常说“这笔交易是 PCA 加权的”，意思是两边的比例不是简单的 DV01 相等，而是按 PCA 计算，让交易对水平因子（甚至斜率因子）中性，只留下想押注的那一部分。风险报告里，也有银行把利率风险表示为对这几个因子的敏感度，便于向管理层解释。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>主成分分析用于收益率曲线，最早系统性的研究之一是 1991 年利特曼（Litterman）和沙因克曼（Scheinkman）的论文。他们用美国国债数据发现，三个因子可以解释九成以上的收益变动，并据此提出了更好的对冲方法。这篇论文至今仍是固定收益风险管理的经典参考。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>收益率曲线的变动大多可以用水平、斜率、曲度三个因子解释，水平最重要。<\/li>\n<li>它们来自主成分分析，可以用来简化风险、设计交易、生成情景、判断贵贱。<\/li>\n<li>因子来自历史数据，环境变化时会变，要定期更新，不能完全替代分桶 DV01。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个交易员想押注 5 年期相对 2 年期和 10 年期“太便宜”。他该怎么构建交易，让它不受水平和斜率变化的影响？<\/summary>\n<div><p>做一笔蝶式交易：买入 5 年期（腹部），卖出 2 年期和 10 年期（两翼），两翼的比例按 PCA 计算，使整笔交易对水平因子和斜率因子都中性。这样只剩下对曲度（以及 5 年期这个点本身偏离）的押注。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-36\"><\/a><\/li>\n<li><a href=\"#L9-42\"><\/a><\/li>\n<li><a href=\"#L24-31\"><\/a><\/li>\n<\/ul><\/div>\n","9.45":"<div class=\"scene\">\n<p>给一只普通债券估值，只需要今天的收益率曲线。但给一只可赎回债券、一个百慕大互换期权估值，就需要知道：未来利率可能怎么走？走到哪里时发行人会赎回？这就需要一个描述利率未来如何随机变动的模型：<strong>利率模型（interest rate model）<\/strong>。<\/p>\n<\/div>\n\n<h2>短利率模型：描述“明天的隔夜利率”怎么动<\/h2>\n<p>最经典的一类叫短利率模型（short-rate model），它描述一个极短期利率随时间的随机变化，再由它推出整条曲线。两个代表：<\/p>\n<ul>\n<li><strong>Vasicek 模型<\/strong>（1977）：利率会围绕一个长期平均水平波动，偏离太远会被“拉回来”，叫均值回归（mean reversion）。直觉上很合理：利率不会无限上涨或下跌。<\/li>\n<li><strong>Hull-White 模型<\/strong>（1990）：在 Vasicek 的基础上，让模型能够精确匹配今天市场上的收益率曲线。这对交易台很重要：模型给出的价格必须和市场上的普通债券、互换价格一致。<\/li>\n<\/ul>\n\n<h2>模型里的两个关键参数<\/h2>\n<ul>\n<li><strong>波动率<\/strong>：利率每年随机波动的幅度，通常用互换期权等市场价格来校准（calibration）。<\/li>\n<li><strong>均值回归速度<\/strong>：利率偏离后多快回来。它影响长期限期权和百慕大期权的价值。<\/li>\n<\/ul>\n<p>这两个参数决定了“未来利率可能分布在哪里”，进而决定了期权的价值。<\/p>\n\n<h2>更复杂的模型<\/h2>\n<p>短利率模型只有一个随机因子，整条曲线只能一起动，难以描述曲线变陡变平。更复杂的模型有：多因子模型、LIBOR 市场模型（LMM，直接对一组远期利率建模），以及 HJM 框架。它们更灵活，但计算更慢、更难校准。交易台通常根据产品选择合适复杂度的模型。<\/p>\n\n<div class=\"desk\">\n<p>利率模型主要用在：含权债券和 MBS 的估值与有效久期、百慕大互换期权、CMS 等奇异利率产品、交易对手风险（模拟未来的敞口）。模型验证团队会检查：模型是否能匹配市场价格，参数是否合理，在极端情况下（比如负利率）是否稳定。不同模型给出的价格差异，属于模型风险，需要计提估值调整。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>Vasicek 模型在 1977 年提出时，有一个被批评的特点：它允许利率变成负数。当时人们认为这是缺陷，于是出现了不允许负利率的 CIR 模型（1985）等改进。2010 年代欧洲和日本真的出现了负利率，那些“不允许负利率”的模型反而出了问题，很多银行又转向允许负利率的正态模型。模型的好坏，取决于它面对的市场。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>利率模型描述未来利率如何随机变动，用来给含权产品估值和模拟未来敞口。<\/li>\n<li>Vasicek 引入均值回归，Hull-White 进一步匹配今天的市场曲线；关键参数是波动率和均值回归速度。<\/li>\n<li>更复杂的模型（多因子、LMM）更灵活但更难用；不同模型的差异是模型风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同一个百慕大互换期权，用两个都已校准到市场的模型估值，结果差了 5%。说明了什么？风控该怎么处理？<\/summary>\n<div><p>说明这个产品的价格对模型假设敏感（比如均值回归速度、利率之间的相关性），市场上没有足够的价格信息来唯一确定它。这是模型风险。风控通常会计提模型估值调整（model reserve），限制这类产品的规模，并要求在报告中说明模型的不确定性。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-41\"><\/a><\/li>\n<li><a href=\"#L16-43\"><\/a><\/li>\n<li><a href=\"#L24-10\"><\/a><\/li>\n<\/ul><\/div>\n","9.46":"<div class=\"scene\">\n<p>一家公司有 100 亿资产，欠了 80 亿债。一年后，如果资产还值 100 亿，股东还完债剩 20 亿；如果资产缩水到 70 亿，股东可以“一走了之”（有限责任），债权人只能拿走 70 亿。股东的处境，像极了手里拿着一个看涨期权。这个洞见，就是<strong>默顿模型（Merton model）<\/strong>。<\/p>\n<\/div>\n\n<h2>股票是公司资产的看涨期权<\/h2>\n<p>1974 年，罗伯特·默顿提出：<\/p>\n<ul>\n<li><strong>股东<\/strong>相当于持有公司资产的看涨期权，执行价是债务的面值。资产价值高于债务，股东拿走剩余；低于债务，股东放弃，损失最多是股票价值。<\/li>\n<li><strong>债权人<\/strong>相当于持有一笔无风险债券，同时卖出了一个看跌期权给股东：资产价值跌破债务时，债权人承担损失。<\/li>\n<\/ul>\n<p>这样，公司债的信用风险就变成了一个期权定价问题。<\/p>\n\n<h2>它告诉我们什么<\/h2>\n<ul>\n<li><strong>杠杆越高，违约风险越大<\/strong>：债务越接近资产价值，看跌期权越接近价内，信用利差越大。<\/li>\n<li><strong>资产波动越大，违约风险越大<\/strong>：资产价值越可能跌破债务。<\/li>\n<li><strong>股价可以预示信用风险<\/strong>：股价下跌、股票波动上升，意味着资产价值下降或波动加大，信用风险上升。<\/li>\n<li><strong>股东和债权人利益冲突<\/strong>：股东持有看涨期权，喜欢公司冒更大的风险（波动越大期权越值钱）；债权人则相反。<\/li>\n<\/ul>\n\n<h2>离违约的距离<\/h2>\n<p>基于默顿模型，可以算出一个“违约距离”（distance to default）：资产价值离债务水平有多少个标准差。距离越近，违约概率越高。穆迪旗下的 KMV 模型就是这一思路的商业化应用，用股价数据估计上市公司的违约概率，常被银行用于信用风险管理和早期预警。<\/p>\n\n<div class=\"desk\">\n<p>信用风险管理里，默顿类模型常用来监控上市借款人：股价大跌、违约距离缩短，就是预警信号，往往比评级调整更早。股票和信用之间的联系，也是资本结构套利（买卖同一家公司的股票和 CDS）的理论基础。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2001 年安然公司倒闭前，评级机构直到破产前几天才把它降为垃圾级。而基于股价的违约距离类指标，在此前几个月里随着股价暴跌已经显著恶化。这类案例让市场意识到：股价里包含的信息，可以比评级更早反映信用风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>默顿模型把股票看成公司资产的看涨期权，债权人相当于卖出了一个看跌期权。<\/li>\n<li>杠杆越高、资产波动越大，违约风险和信用利差越大；股价变化可以预示信用风险。<\/li>\n<li>违约距离是它的实际应用，用于监控和预警；它也解释了股东和债权人的利益冲突。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司的管理层决定把公司的现金投入一个高风险、高回报的新项目。按照默顿模型，股东和债权人分别会怎么看？<\/summary>\n<div><p>股东可能欢迎：资产波动加大，他们手中的“看涨期权”更值钱，成功了收益全归股东，失败了最多损失股票。债权人则会担心：资产波动加大，违约概率上升，他们卖出的“看跌期权”更容易被行权，债券价值下降。这就是为什么债券契约条款会限制公司的投资和风险行为。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-47\"><\/a><\/li>\n<li><a href=\"#L16-11\"><\/a><\/li>\n<li><a href=\"#L20-8\"><\/a><\/li>\n<\/ul><\/div>\n","9.47":"<div class=\"scene\">\n<p>一家银行要给一只公司债、一笔 CDS、一个贷款组合估值和算风险。它需要回答同一个问题：这家公司未来违约的可能性有多大？业界有两大类方法，思路完全不同：一类问“为什么会违约”，一类只问“多久会违约一次”。<\/p>\n<\/div>\n\n<h2>结构模型：从公司的资产负债表出发<\/h2>\n<p>结构模型（structural model）以默顿模型为代表：模拟公司资产价值的变化，当资产跌破某个债务水平时就违约。<\/p>\n<ul>\n<li>优点：有经济含义，能把股价、杠杆、资产波动和违约联系起来，适合分析单个公司、做预警。<\/li>\n<li>缺点：公司的资产价值看不到，要从股价倒推；短期违约概率常被低估（公司资产不会突然跳到违约）；难以精确匹配市场上的信用利差。<\/li>\n<\/ul>\n\n<h2>简约模型：直接给违约一个“发生率”<\/h2>\n<p>简约模型（reduced-form model），也叫强度模型（intensity model）：不解释违约为什么发生，只假设违约是一个随机事件，每一小段时间里有一定的概率发生，这个概率叫违约强度（hazard rate）。<\/p>\n<ul>\n<li>违约强度从市场价格（CDS 利差、债券利差）校准出来。粗略地说：违约强度 ≈ 信用利差 ÷（1 − 回收率）。利差 200bp、回收率 40%，违约强度约为每年 3.3%。<\/li>\n<li>优点：直接匹配市场价格，计算方便，是 CDS 和信用衍生品定价的标准方法。<\/li>\n<li>缺点：经济含义弱，违约强度里混着风险溢价，不完全是“真实”的违约概率。<\/li>\n<\/ul>\n\n<h2>风险中性概率和真实概率<\/h2>\n<p>从市场价格倒推出来的违约概率，叫风险中性违约概率，通常远高于历史上实际发生的违约率，因为利差里还包含了投资者承担风险要求的补偿和流动性溢价。定价用前者，衡量真实损失（比如信用组合的预期损失、银行的拨备）常用后者，后者来自历史违约数据和内部评级。<\/p>\n\n<div class=\"desk\">\n<p>交易台给 CDS 和公司债估值、计算 CS01 和 JTD，用的是简约模型，信用曲线由 CDS 利差构建。银行的信用风险部门评估贷款组合、计算监管资本，用的是基于历史数据的违约概率（PD）、违约损失率（LGD），以及组合层面的相关性模型。两套体系服务不同目的，数字不一样很正常。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机期间，投资级公司的 CDS 利差大幅走阔，按简约模型推算的违约概率达到每年好几个百分点；而实际上，危机期间投资级公司的年违约率远低于这个数字。这说明危机时利差里的风险溢价和流动性溢价急剧上升。用市场隐含的违约概率估计真实损失，会大大高估；用历史违约率给 CDS 定价，则会严重低估价格。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>结构模型从公司资产和债务出发解释违约，有经济含义，适合分析和预警。<\/li>\n<li>简约模型直接用违约强度描述违约，从市场利差校准，是信用衍生品定价的标准方法。<\/li>\n<li>市场隐含（风险中性）的违约概率高于历史真实违约率；定价和衡量真实损失要用不同的概率。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司的 CDS 利差是 300bp，假设回收率 40%。市场隐含的年违约概率大约是多少？这是不是这家公司真实的违约概率？<\/summary>\n<div><p>约 300bp ÷（1 − 40%）= 5% 每年。这是风险中性的违约概率，包含了投资者要求的风险补偿和流动性溢价，通常高于真实的违约概率。用历史数据看，同评级公司的实际违约率可能明显更低。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-46\"><\/a><\/li>\n<li><a href=\"#L16-24\"><\/a><\/li>\n<li><a href=\"#L16-40\"><\/a><\/li>\n<li><a href=\"#L6-26\"><\/a><\/li>\n<\/ul><\/div>\n","9.48":"<div class=\"scene\">\n<p>三个债券基金经理，管理同样大的钱。第一个只想跟住指数，越像越好；第二个要保证 10 年后有足够的钱支付一笔确定的负债；第三个想跑赢指数，主动押注利率、曲线和信用。这是债券组合管理的三种基本思路：<strong>指数化、免疫和主动管理<\/strong>。<\/p>\n<\/div>\n\n<h2>指数化：跟住基准<\/h2>\n<p>指数化（indexing）的目标是复制债券指数的表现。难点在于：债券指数里有成千上万只债券，很多交易不活跃，全部买齐成本太高。所以通常采用抽样（sampling）的方法：选一部分有代表性的债券，让组合在久期、分桶 DV01、行业、评级、利差等关键特征上和指数一致，从而让跟踪误差（tracking error）尽量小。<\/p>\n\n<h2>免疫：保证未来的负债能付<\/h2>\n<p>免疫（immunization）是为了保证在某个未来日期，组合价值足以支付一笔已知的负债，不管利率怎么变。基本思路：<\/p>\n<ul>\n<li>让资产的现值等于负债的现值。<\/li>\n<li>让资产的久期等于负债的久期：利率变化时，资产和负债的价值同步变动。<\/li>\n<li>让资产的凸性略大于负债的凸性：大幅变动时资产不吃亏。<\/li>\n<\/ul>\n<p>利率上升时，债券价格下跌，但票息可以按更高利率再投资；利率下降时则相反。久期匹配让这两种效应互相抵消。更严格的做法是现金流匹配（cash flow matching）：每一笔负债都用到期日正好对上的债券来覆盖。养老金和保险公司的负债驱动投资（LDI）就是免疫思想的实际应用。<\/p>\n\n<h2>主动管理：押注跑赢<\/h2>\n<p>主动管理（active management）有意偏离基准，常见的押注有：<\/p>\n<ul>\n<li><strong>久期<\/strong>：预期利率下降就拉长久期。<\/li>\n<li><strong>曲线<\/strong>：押注曲线变陡或变平。<\/li>\n<li><strong>板块配置<\/strong>：在国债、公司债、证券化产品、新兴市场之间调整。<\/li>\n<li><strong>个券选择<\/strong>：挑出被低估的发行人和债券。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>组合经理和风控看组合时，最常用的是“相对基准”的视角：组合和基准的久期差、分桶 DV01 差、各板块和评级的权重差、利差敞口差（常用“DTS”，即久期乘以利差，衡量信用风险）。这些差异就是主动风险，事后用业绩归因来检验哪些押注赚了钱。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年利率急升时，大量指数化债券基金跟随指数大跌约 13%，而严格做了久期匹配的养老金，资产和负债一起缩水，资金充足率反而改善。同一年，主动管理的债券基金表现分化很大：提前缩短久期的跑赢了指数，坚持长久期的则大幅落后。三种思路在同一场利率冲击中，结果完全不同。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>指数化用抽样复制基准，目标是跟踪误差最小。<\/li>\n<li>免疫让资产和负债的现值、久期匹配，保证未来负债能付；LDI 是它的应用。<\/li>\n<li>主动管理通过久期、曲线、板块和个券押注来跑赢基准。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家保险公司 10 年后要赔付一笔固定金额。它买了一个久期也是 10 年的债券组合。三年后，它还需要做什么？<\/summary>\n<div><p>需要再平衡。三年后负债的剩余期限是 7 年，久期变成约 7；而债券组合的久期不会正好也变成 7（不同债券的久期变化速度不同，利率变化也会改变久期）。必须定期调整组合，让资产久期继续和负债久期匹配，免疫才能有效。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-34\"><\/a><\/li>\n<li><a href=\"#L9-49\"><\/a><\/li>\n<li><a href=\"#L21-20\"><\/a><\/li>\n<\/ul><\/div>\n","9.49":"<div class=\"scene\">\n<p>一个债券基金今年跑赢指数 1.2 个百分点。投资委员会问：这 1.2% 是怎么来的？是押对了利率，是曲线判断准确，是多配了公司债，还是挑中了几只好债券？回答这个问题的工具叫<strong>固定收益业绩归因（fixed income performance attribution）<\/strong>。<\/p>\n<\/div>\n\n<h2>把超额收益拆开<\/h2>\n<p>债券组合的收益，可以拆成几个来源，每一部分再和基准比较：<\/p>\n<div class=\"tbl\"><table>\n<tr><th>来源<\/th><th>含义<\/th><\/tr>\n<tr><td>持有收益（carry）<\/td><td>票息、骑乘效应带来的收益<\/td><\/tr>\n<tr><td>利率水平（久期）<\/td><td>整条曲线平移带来的收益，取决于组合和基准的久期差<\/td><\/tr>\n<tr><td>曲线形状<\/td><td>曲线变陡、变平、弯曲带来的收益，取决于分桶 DV01 的差<\/td><\/tr>\n<tr><td>利差（板块配置）<\/td><td>不同板块利差变化带来的收益，取决于板块权重和利差敞口的差<\/td><\/tr>\n<tr><td>个券选择<\/td><td>同一板块内，挑选的债券比板块整体表现好或差<\/td><\/tr>\n<tr><td>汇率<\/td><td>多币种组合的汇率影响和对冲效果<\/td><\/tr>\n<tr><td>其他 / 残差<\/td><td>交易成本、模型解释不了的部分<\/td><\/tr>\n<\/table><\/div>\n<p>它的计算方法，本质上和交易台的损益解释一样：用敏感度乘以市场变动。只不过这里比较的是组合和基准的差异。<\/p>\n\n<h2>为什么债券的归因和股票不一样<\/h2>\n<p>股票的业绩归因通常按行业配置和个股选择来拆（Brinson 方法）。债券的收益主要由利率和利差驱动，按行业拆分看不出久期和曲线押注的贡献，所以要用基于风险因子的方法，先拆出利率和利差，再看配置和选择。<\/p>\n\n<div class=\"desk\">\n<p>资产管理公司的风险与绩效团队每月出归因报告，给组合经理、投资委员会和客户看。好的归因能回答：经理的超额收益是否来自他声称的能力（比如信用选择），还是来自无意中的风险押注（比如久期长了一点、正好赶上降息）。后者往往不可持续。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年各大央行大幅降息，很多债券基金当年跑赢了基准。归因显示，相当一部分基金的超额收益来自久期略长于基准，而不是它们宣传的信用选择能力。2022 年利率反转上升，同样的久期偏离让这些基金大幅跑输。投资者和顾问越来越重视归因，就是为了分清“能力”和“运气”。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>固定收益业绩归因把超额收益拆成持有收益、久期、曲线、利差配置、个券选择和汇率。<\/li>\n<li>方法上类似损益解释：用组合与基准的敏感度差乘以市场变动。<\/li>\n<li>归因帮助区分可持续的能力和无意的风险押注。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个基金经理说他擅长挑选公司债。归因报告显示，他过去三年的超额收益大部分来自久期贡献，个券选择贡献接近零。你怎么看？<\/summary>\n<div><p>他的超额收益更可能来自利率押注（或者恰好赶上利率下降），而不是他声称的选债能力。如果利率环境改变，这部分收益可能消失甚至变成亏损。应当和他讨论久期偏离是否是有意的，并重新评估他的投资能力和风险控制。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-48\"><\/a><\/li>\n<li><a href=\"#L24-29\"><\/a><\/li>\n<li><a href=\"#L19-34\"><\/a><\/li>\n<\/ul><\/div>\n","10.1":"<div class=\"scene\">\n<p>下午 5 点，一家银行发现今天客户取款比预想的多，账上的钱不够了；另一家银行今天存款多，钱闲着。前者向后者借一晚，明早还。这种借一晚、借一周、最多借一年的市场，叫<strong>货币市场（money market）<\/strong>。它是金融体系每天的“现金调度中心”。<\/p>\n<\/div>\n\n<h2>货币市场：一年以内的借贷<\/h2>\n<p>货币市场是期限在一年以内的借贷市场。它的特点是：期限短、金额大、风险低、参与者几乎都是机构。主要的工具有：<\/p>\n<div class=\"tbl\"><table>\n<tr><th>工具<\/th><th>是什么<\/th><\/tr>\n<tr><td>银行间拆借<\/td><td>银行之间无抵押的短期借款<\/td><\/tr>\n<tr><td>回购（repo）<\/td><td>拿债券作抵押借钱，规模最大<\/td><\/tr>\n<tr><td>短期国债（T-bill）<\/td><td>政府一年以内的借款<\/td><\/tr>\n<tr><td>商业票据（CP）<\/td><td>大公司的短期无抵押借款<\/td><\/tr>\n<tr><td>大额存单（CD）<\/td><td>银行发行的可转让定期存款<\/td><\/tr>\n<\/table><\/div>\n\n<h2>为什么它这么重要<\/h2>\n<ul>\n<li><strong>央行在这里操作<\/strong>：央行设定政策利率，就是通过影响货币市场的隔夜利率来实现的。<\/li>\n<li><strong>所有利率的起点<\/strong>：隔夜利率是收益率曲线最左端的那个点，其他期限的利率都从这里往右延伸。<\/li>\n<li><strong>金融机构的“血液”<\/strong>：银行、交易商、基金每天都要靠货币市场调剂资金，一天借不到钱就可能出事。<\/li>\n<\/ul>\n\n<h2>隔夜利率：央行的目标<\/h2>\n<p>各国央行盯着的隔夜利率不同：美联储盯联邦基金利率（fed funds rate），同时看以回购为基础的 SOFR；欧洲央行看 €STR；英格兰银行看 SONIA；中国人民银行看 DR007 等回购利率。央行通过公开市场操作、存款便利和贷款便利，把这些利率控制在目标附近。<\/p>\n\n<div class=\"desk\">\n<p>银行的资金部（treasury）每天的工作，就是在货币市场里管理现金：预测今天的进出，决定借多少、借多久、用什么抵押品。风控关注的是资金的集中度（是不是太依赖某几家对手方、某一种工具）和期限（是不是借短用长）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2007 年 8 月 9 日，货币市场“冻结”。<\/strong>法国巴黎银行宣布冻结旗下三只投资次贷相关资产的基金赎回，理由是无法估值。消息一出，银行之间突然互相不信任，谁都不知道对方手里有多少有毒资产，银行间拆借利率飙升，市场几乎停止运转。欧洲央行当天向市场注入了约 950 亿欧元。很多人把这一天看作全球金融危机的开端。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>货币市场是一年以内的借贷市场：拆借、回购、短期国债、商业票据、存单。<\/li>\n<li>央行通过货币市场的隔夜利率实施货币政策，它也是所有利率的起点。<\/li>\n<li>金融机构每天靠货币市场调剂资金；它一冻结，危机就开始了。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么银行间市场会在危机中“冻结”，即使大部分银行其实是健康的？<\/summary>\n<div><p>因为信息不对称：借钱的人不知道对方是否健康，宁可不借。健康的银行也会囤积现金，防止自己突然需要用钱。人人都这样想，市场上的钱就突然不流动了。这时候通常需要央行出面，充当最后贷款人。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-4\"><\/a><\/li>\n<li><a href=\"#L10-8\"><\/a><\/li>\n<li><a href=\"#L7-12\"><\/a><\/li>\n<\/ul><\/div>\n","10.2":"<div class=\"scene\">\n<p>一家大型饮料公司下个月要付一大笔原材料货款，但销售回款要两个月后才到。它不想找银行谈贷款，而是在市场上发了一张 30 天期的借条，第二天就拿到了 5 亿美元。这张借条叫<strong>商业票据（commercial paper，CP）<\/strong>。<\/p>\n<\/div>\n\n<h2>商业票据：大公司的短期借条<\/h2>\n<p>商业票据是大公司和金融机构发行的短期、无抵押的借款凭证，期限通常不超过 270 天（美国，超过就要向证监会注册），常见的是几天到三个月。它一般折价发行，到期按面值还款，差价就是利息。<\/p>\n<p>只有信用很好的公司才能发商业票据，评级通常要在 A-1/P-1 或 A-2/P-2。为了让投资者放心，发行人往往要有银行的备用信贷额度（backup line），万一到期借不到新钱还旧钱，可以动用银行额度。<\/p>\n<p>主要买家是货币市场基金和企业财务部门。<\/p>\n\n<h2>大额存单：银行的可转让定期存款<\/h2>\n<p>大额存单（certificate of deposit，CD）是银行发行的定期存款凭证，金额大，可以在市场上转让。对银行来说，它是一种稳定的批发融资；对投资者来说，它比活期存款利息高，又可以在到期前卖出。<\/p>\n\n<h2>资产支持商业票据<\/h2>\n<p>还有一种资产支持商业票据（ABCP）：由特殊目的载体发行，用一池应收账款、贷款等资产作支持。它在 2007 年之前规模很大，很多是银行在资产负债表外设立的通道，用短期票据为长期资产融资。<\/p>\n\n<div class=\"desk\">\n<p>商业票据最大的风险是展期风险（rollover risk）：发行人每隔几周就要发新票据来还旧票据，一旦市场不愿意买，就可能还不上。所以银行在提供备用额度时，要评估这笔额度在压力下被突然动用的可能性。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2007 年夏天，很多 ABCP 通道持有次贷相关资产，投资者突然不愿再买它们的票据，展期失败。设立这些通道的银行只能把资产收回自己的资产负债表，或者动用备用额度提供资金，损失和流动性压力一下子回到了银行身上。加拿大的非银行 ABCP 市场几乎完全冻结，最终经过一年多的谈判才完成重组。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>商业票据是信用很好的大公司发行的短期无抵押借条，主要买家是货币基金。<\/li>\n<li>大额存单是银行可转让的定期存款，是银行的批发融资来源。<\/li>\n<li>这类短期融资最大的风险是展期失败；ABCP 在 2007 年的崩溃就是例子。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司用 30 天期商业票据为一座需要十年才能回本的工厂融资。这样做有什么风险？<\/summary>\n<div><p>期限严重错配：它每 30 天就要发新票据还旧票据，一旦市场情绪变差或者自己的评级下降，就可能借不到新钱，而工厂又不能马上变现。这是典型的流动性风险，也是很多危机的起点。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-1\"><\/a><\/li>\n<li><a href=\"#L10-3\"><\/a><\/li>\n<li><a href=\"#L11-11\"><\/a><\/li>\n<\/ul><\/div>\n","10.3":"<div class=\"scene\">\n<p>一家公司账上有 2 亿美元现金，暂时用不上。存在银行，超过存款保险的部分没有保障，利息也不高。它把钱放进了一只<strong>货币市场基金（money market fund，MMF）<\/strong>：随时可以取出，利息接近市场短期利率，风险很低。<\/p>\n<\/div>\n\n<h2>货币市场基金：现金的“停车场”<\/h2>\n<p>货币市场基金只投资期限很短、信用很高的资产：短期国债、回购、商业票据、大额存单。它给投资者的承诺是：本金几乎不会亏，随时可以赎回，收益跟着短期利率走。<\/p>\n<p>在美国，货币基金规模已超过 6 万亿美元，是货币市场最大的资金提供者之一。它们是回购市场和商业票据市场的主要买家。<\/p>\n\n<h2>主要类型<\/h2>\n<ul>\n<li><strong>政府货币基金<\/strong>：只投资国债、机构债和以它们为抵押的回购，最安全。<\/li>\n<li><strong>优先（prime）货币基金<\/strong>：也投资商业票据和银行存单，收益略高，风险也略高。<\/li>\n<li><strong>免税货币基金<\/strong>：投资短期市政债。<\/li>\n<\/ul>\n<p>部分货币基金按每份 1 美元的固定净值运作，给人“和存款一样”的感觉；但它不是存款，没有存款保险。<\/p>\n\n<h2>“跌破一美元”<\/h2>\n<p>如果货币基金持有的资产出现损失，每份净值跌到 1 美元以下，叫“跌破一美元”（breaking the buck）。这很少发生，但一旦发生，投资者会意识到它并不完全安全，可能集体赎回，引发挤兑。<\/p>\n\n<div class=\"desk\">\n<p>对银行和交易商来说，货币基金是回购融资的重要对手方。货币基金的规模变化、对风险的偏好、监管规则的调整，都会直接影响回购利率和交易商的融资成本。资金部和回购交易台会密切关注货币基金的资产配置变化。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2008 年 9 月 16 日，储备基金“跌破一美元”。<\/strong>雷曼兄弟破产后，美国历史最悠久的货币基金之一 Reserve Primary Fund 持有的雷曼商业票据变得一文不值，净值跌到每份 0.97 美元。投资者恐慌，优先货币基金在几天内被赎回了数千亿美元，它们只能停止购买商业票据，企业的短期融资几乎中断。美国财政部随后为货币基金提供临时担保，美联储也推出了支持商业票据市场的工具。此后，美国多次修改了货币基金的监管规则。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>货币市场基金投资短期、高信用资产，是企业和个人现金的“停车场”。<\/li>\n<li>它是回购和商业票据市场的主要资金提供者。<\/li>\n<li>它不是存款，没有存款保险；跌破一美元会引发挤兑，2008 年就发生过。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>市场恐慌时，资金从优先货币基金大量流向政府货币基金。这对商业票据市场和国债市场分别有什么影响？<\/summary>\n<div><p>商业票据市场失去了大买家，企业很难发新票据，短期融资成本飙升。政府货币基金收到大量资金，要买入短期国债和国债回购，短期国债收益率被压低，甚至可能接近零或为负。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-2\"><\/a><\/li>\n<li><a href=\"#L10-4\"><\/a><\/li>\n<li><a href=\"#L19-1\"><\/a><\/li>\n<\/ul><\/div>\n","10.4":"<div class=\"scene\">\n<p>一家交易商（dealer）手里有 10 亿美元的国债，这是它做市要用的库存。但今晚它需要 10 亿美元现金去结算别的交易。卖掉国债？明天还要用，来回买卖成本太高。<\/p>\n<p>它找到一家货币市场基金：“我把这批国债卖给你，换 9.8 亿美元现金。明天我再按 9.8 亿多一点的价格买回来。”基金手里有大把闲钱，又有国债作担保，很放心。这笔交易就是<strong>回购（repurchase agreement，repo）<\/strong>。<\/p>\n<\/div>\n\n<h2>回购的本质：拿债券作抵押，借一笔短期的钱<\/h2>\n<p>形式上，回购是“卖出，再约定买回”。本质上，它就是一笔有抵押的借款（collateralized borrowing）：<\/p>\n<ul>\n<li>借钱的一方交出债券，拿到现金。<\/li>\n<li>出钱的一方拿到债券作抵押，第二天（或约定的日期）收回现金，外加一点利息。<\/li>\n<li>买回价比卖出价高出的那一点，折成年化，就是回购利率（repo rate）。<\/li>\n<\/ul>\n<p>从借钱一方看，这叫回购（repo）；从出钱一方看，同一笔交易叫逆回购（reverse repo）。最常见的期限是隔夜（overnight），也有一周、一个月的。<\/p>\n\n<h2>为什么出钱的一方不会全额借出<\/h2>\n<p>开头的例子里，10 亿美元的国债只换来 9.8 亿现金，少给的这 2% 叫折扣（haircut）。原因很简单：万一借钱的一方第二天还不上钱，出钱的一方只能把手里的债券卖掉收回现金。如果这期间债券跌了，折扣就是那层保险垫。<\/p>\n<p>抵押品越安全、越好卖，折扣越小。短期国债的折扣很低；公司债、股票、结构化产品的折扣要高得多。市场一紧张，折扣会马上提高，借钱的一方就要拿出更多抵押品，或者少借一些钱。<\/p>\n\n<h2>谁在用回购<\/h2>\n<ul>\n<li><strong>交易商和银行<\/strong>：给手里的债券库存融资，这是回购最大的用途。<\/li>\n<li><strong>对冲基金<\/strong>：借钱加杠杆，比如买入国债后马上拿去做回购，再用借来的钱买更多。<\/li>\n<li><strong>货币市场基金和企业<\/strong>：手里有闲钱，通过逆回购放出去，既有利息又有抵押，比存银行更安全。<\/li>\n<li><strong>央行<\/strong>：用回购和逆回购向市场注入或收回资金，控制短期利率。<\/li>\n<\/ul>\n<p>回购市场每天的规模以万亿美元计，是金融机构之间流动资金的主要通道，常被叫作金融体系的“管道”（plumbing）。<\/p>\n\n<div class=\"desk\">\n<p>交易台上，回购分两种。<strong>一般抵押品回购（general collateral，GC）<\/strong>：出钱的一方只要求“任何合格的国债都行”，利率接近市场的平均短期利率。<strong>特殊回购（special）<\/strong>：对方点名要某一只具体的债券，因为它需要这只券去交割或做空。这只券越抢手，借钱一方能拿到的回购利率就越低，甚至是负数。<\/p>\n<p>回购交易一般签 GMRA（全球回购主协议，Global Master Repurchase Agreement）。协议规定每天按市值重估抵押品，价值不够要补，叫追加保证金（margin call）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2019 年 9 月，回购利率突然飙升。<\/strong>9 月 16 日和 17 日，企业要交季度税，国债又在同一天集中结算，大量现金从银行体系流出。美国隔夜回购利率在平时 2% 出头，那两天一度冲到 5% 以上，盘中有成交接近 10%。美联储 17 日起连续进行回购操作，向市场注入数千亿美元，几周后又开始购买短期国债，补充银行体系的准备金。这件事让人看清：即使是最安全的国债抵押借款，也会因为现金一时短缺而失灵。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>回购是拿债券作抵押借短期现金，形式上是卖出再约定买回。<\/li>\n<li>折扣是出钱一方的保险垫，抵押品越差、市场越紧张，折扣越高。<\/li>\n<li>回购是金融机构之间流动资金的主要管道，它一卡住，整个市场都会紧张。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同一天，大部分国债的隔夜回购利率是 4.3%，但有一只十年期国债的回购利率只有 2%。可能发生了什么？<\/summary>\n<div><p>这只国债成了特殊券（special）。很多人需要借到它，比如用来交割国债期货，或者做空它。想借它的人愿意接受更低的回购利率，等于为借到这只券付出代价。持有这只券的人可以用它以很低的成本借到现金，从中获利。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-5\"><\/a><\/li>\n<li><a href=\"#L10-6\"><\/a><\/li>\n<li><a href=\"#L10-12\"><\/a><\/li>\n<li><a href=\"#L10-21\"><\/a><\/li>\n<li><a href=\"#L10-26\"><\/a><\/li>\n<\/ul><\/div>\n","10.5":"<div class=\"scene\">\n<p>一家货币基金每天要通过回购借出几十亿美元。如果每笔都要自己检查抵押品、每天盯市、处理交割，它会忙不过来。于是它请一家银行站在中间，替双方管理抵押品。这就是<strong>三方回购（tri-party repo）<\/strong>。<\/p>\n<\/div>\n\n<h2>双边回购：双方自己管<\/h2>\n<p>最基本的回购是双边回购（bilateral repo）：借钱方和出钱方直接交易，自己负责抵押品的交割、每天的估值和追加保证金。交易商之间、交易商和对冲基金之间，很多是双边回购，尤其是需要指定某只具体债券的特殊回购。<\/p>\n\n<h2>三方回购：请一个管家<\/h2>\n<p>三方回购里，有一个第三方代理人（tri-party agent），通常是大型托管银行，比如纽约梅隆银行、欧洲的 Euroclear 和 Clearstream。它负责：<\/p>\n<ul>\n<li>从借钱方的账户里挑出合格的抵押品，转到出钱方名下。<\/li>\n<li>每天按市价重新估值，不够就要求补，多了就退。<\/li>\n<li>检查抵押品是否符合双方约定的标准（种类、评级、集中度、折扣）。<\/li>\n<\/ul>\n<p>出钱方只需要说“我接受这些类型的抵押品”，剩下的由代理人处理。货币基金和交易商之间的大量回购就是这样完成的。<\/p>\n\n<h2>集中清算回购：清算所站在中间<\/h2>\n<p>还有一种是通过中央清算所清算的回购，比如美国的固定收益清算公司（FICC）。清算所成为每一笔交易的对手方，参与者之间可以净额结算，大大减少交易对手风险和对资产负债表的占用。<\/p>\n<p>美国证监会已经要求，未来大部分国债回购都要通过集中清算，这项改革正在分阶段实施。<\/p>\n\n<div class=\"desk\">\n<p>回购台和抵押品管理团队每天要处理：哪些抵押品放在哪个三方代理、是否符合各个对手方的标准、折扣是否随市场变化调整。风控关注的是对手方集中度、抵押品集中度，以及三方代理本身的操作风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年以前，美国三方回购有一个隐患：每天早上，三方代理银行要先“解开”前一天的回购，等于在白天向借钱的交易商提供巨额的日间信贷，直到傍晚重新设定新的回购。雷曼和贝尔斯登出事时，市场担心代理银行会在白天承担巨大的风险。此后，美国推动三方回购改革，大幅减少了这种日间信贷依赖。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>双边回购由双方自己管理抵押品，常用于特殊回购。<\/li>\n<li>三方回购由托管银行担任代理人，负责挑选、估值和调整抵押品，是货币基金的主要渠道。<\/li>\n<li>集中清算回购由清算所担任对手方，可以净额结算，美国正在推动大部分国债回购集中清算。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家对冲基金需要借入某一只特定的国债去交割，它应该做三方回购还是双边回购？为什么？<\/summary>\n<div><p>双边回购（或在清算回购里做特殊券交易）。三方回购的出钱方只要求“一类”合格抵押品，代理人从池子里挑，无法指定某一只具体债券；要借到一只特定的券，需要和对手方直接约定，属于特殊回购。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-4\"><\/a><\/li>\n<li><a href=\"#L10-6\"><\/a><\/li>\n<li><a href=\"#L17-12\"><\/a><\/li>\n<\/ul><\/div>\n","10.6":"<div class=\"scene\">\n<p>你拿一套价值 100 万的房子去抵押借钱，银行最多借你 70 万。为什么不借 100 万？因为万一你还不起，银行要卖房收回钱，房价可能下跌，卖房也要时间和费用。少借的那 30 万就是银行的安全垫。在回购里，这个安全垫叫<strong>折扣（haircut）<\/strong>。<\/p>\n<\/div>\n\n<h2>折扣：抵押品价值打几折<\/h2>\n<p>折扣是抵押品市值和借出金额之间的差额，用百分比表示。100 元的债券、2% 的折扣，只能借到 98 元。也有市场用“保证金比例”（initial margin）来表示，比如 102%：借 100 元要交 102 元的抵押品。两种说法意思一样。<\/p>\n\n<h2>折扣高低由什么决定<\/h2>\n<ul>\n<li><strong>抵押品的价格波动<\/strong>：越可能大跌，折扣越高。长期债比短期债高。<\/li>\n<li><strong>流动性<\/strong>：越难卖出去，折扣越高。<\/li>\n<li><strong>信用质量<\/strong>：国债最低，公司债、高收益债、证券化产品、股票依次升高。<\/li>\n<li><strong>借钱方的信用<\/strong>：对手方越可能违约，出钱方越会要求更高折扣。<\/li>\n<li><strong>错向风险<\/strong>：抵押品和借钱方相关（比如银行拿自己发的债作抵押），折扣要更高，甚至不接受。<\/li>\n<\/ul>\n<p>大致的量级：短期国债可能 0 到 2%，长期国债几个百分点，投资级公司债 5% 到 10%，高收益债和股票更高。<\/p>\n\n<h2>折扣会随市场变化<\/h2>\n<p>折扣不是固定的。市场平静时，出钱方愿意给低折扣；市场紧张时，会迅速提高折扣。这对借钱方来说是双重打击：抵押品价格下跌，同时每单位抵押品能借到的钱也变少了，需要拿出更多抵押品或者偿还一部分借款，常常只能被迫卖出资产。这种“折扣螺旋”（haircut spiral）会放大危机。<\/p>\n\n<div class=\"desk\">\n<p>回购台和风控会维护一张折扣表（haircut schedule），按抵押品类型、评级、期限、币种列出最低折扣。监管机构（例如金融稳定理事会）也对非银行机构的证券融资交易设定了最低折扣标准，防止在平静时期折扣被压得过低。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机期间，双边回购市场上很多抵押品的折扣急剧上升。根据经济学家戈顿（Gorton）和梅特里克（Metrick）的研究，一些结构化产品的平均折扣从危机前接近零，上升到 2008 年底的 40% 以上，部分资产干脆不再被接受作为抵押品。这相当于从依赖回购融资的投资银行身上，突然抽走了大量资金。他们把这一过程称为“回购挤兑”（run on repo）。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>折扣是抵押品市值与借款金额之差，是出钱方的安全垫。<\/li>\n<li>抵押品越波动、越难卖、信用越差，折扣越高；错向风险要额外提高。<\/li>\n<li>市场紧张时折扣上升，迫使借钱方卖出资产，形成折扣螺旋。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家对冲基金用回购为 10 亿美元的公司债融资，折扣 5%。市场恐慌时，债券价格下跌 5%，折扣提高到 15%。它需要补多少钱？<\/summary>\n<div><p>原来借到 9.5 亿。现在抵押品市值 9.5 亿，按 15% 折扣只能借约 8.08 亿。需要偿还约 1.43 亿，或者补交相应的抵押品。如果拿不出这笔钱，就只能卖掉一部分债券，进一步压低价格。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-4\"><\/a><\/li>\n<li><a href=\"#L10-7\"><\/a><\/li>\n<li><a href=\"#L10-22\"><\/a><\/li>\n<\/ul><\/div>\n","10.7":"<div class=\"scene\">\n<p>你做了一笔回购，借出 98 万现金，收了价值 100 万的国债作抵押。一周后，国债跌到 97 万，抵押品已经不够覆盖你借出的钱了。你会怎么做？向对方发出通知：“请补交抵押品。”这就是<strong>追加保证金（margin call）<\/strong>。<\/p>\n<\/div>\n\n<h2>为什么要每天调整<\/h2>\n<p>回购、证券借贷、衍生品的抵押品和敞口，每天都在随市场变化。约定一个固定的抵押金额是不够的，所以合约都规定按市价定期重估（mark-to-market），通常每天一次：<\/p>\n<ul>\n<li>抵押品价值下跌，或者敞口增加：一方要求另一方补交，叫追加保证金。<\/li>\n<li>抵押品价值上涨，或者敞口减少：多出的部分要退回。<\/li>\n<\/ul>\n<p>这样，任何时候出钱方手里的抵押品都足以覆盖风险，万一对方违约，损失很小。<\/p>\n\n<h2>两种保证金<\/h2>\n<ul>\n<li><strong>变动保证金（variation margin，VM）<\/strong>：弥补已经发生的市值变化，今天的盈亏今天结清。<\/li>\n<li><strong>初始保证金（initial margin，IM）<\/strong>：在一开始就多交一部分，覆盖对方违约后、平仓完成前可能发生的不利变动。回购里的折扣就起着初始保证金的作用。<\/li>\n<\/ul>\n\n<h2>合同里的细节<\/h2>\n<p>合同（GMRA、GMSLA 或衍生品的 CSA）会规定很多细节：<\/p>\n<ul>\n<li><strong>最低转移金额（minimum transfer amount）<\/strong>：差额太小不用来回转，比如低于 50 万就不调整。<\/li>\n<li><strong>门槛（threshold）<\/strong>：敞口低于某个金额，不要求抵押品。<\/li>\n<li><strong>合格抵押品<\/strong>：可以用什么资产补，现金还是债券，什么币种。<\/li>\n<li><strong>时间<\/strong>：通知后多久必须到账，当天还是第二天。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>抵押品管理团队（collateral management）每天早上对账：和每个对手方核对敞口和抵押品的估值，发出或回应追加保证金通知。双方估值不一致时就会产生争议（dispute），要在规定时间内解决。风控关注的是争议金额、逾期未付的追加保证金，以及在压力情景下可能需要支付的现金总量。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年 3 月 Archegos 的崩溃，起点就是追加保证金：它在多家银行的互换仓位亏损后，银行要求追加保证金，它拿不出钱。2022 年 9 月英国养老金的 LDI 危机，同样是因为国债收益率暴涨，利率互换和回购要求追加大量保证金，养老金被迫卖出国债。保证金机制保护了出钱的一方，但在危机中也会让被追保的一方被迫卖出资产，放大市场波动。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>抵押品和敞口每天按市价重估，不够就追加保证金，多了就退回。<\/li>\n<li>变动保证金结清已发生的盈亏，初始保证金覆盖违约后的平仓风险。<\/li>\n<li>保证金保护了出钱方，但在危机中会迫使被追保的一方卖出资产，放大波动。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两家银行之间的一笔交易，按 A 银行的估值需要 B 银行补交 2,000 万抵押品，B 银行算出来只需要 500 万。接下来通常会怎么处理？<\/summary>\n<div><p>这是一个估值争议。通常先支付双方都认可的部分（500 万），然后对差额进行核对：检查使用的市场数据、估值模型、交易明细是否一致。规定时间内解决不了，会按合同里的争议解决机制处理，比如请第三方报价。风控会跟踪争议金额和持续时间。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-6\"><\/a><\/li>\n<li><a href=\"#L10-16\"><\/a><\/li>\n<li><a href=\"#L10-21\"><\/a><\/li>\n<\/ul><\/div>\n","10.8":"<div class=\"scene\">\n<p>几十万亿美元的贷款、浮息债和衍生品，利息都写着“基准利率 + 某个利差”。这个基准利率到底是谁定的？2012 年人们发现，最重要的那个基准 LIBOR，竟然可以被几家银行的交易员串通操纵。从那以后，全世界花了十年，把它换成了新的基准。<\/p>\n<\/div>\n\n<h2>基准利率是什么<\/h2>\n<p>基准利率（benchmark rate）是一个公开、每天发布的参考利率，用来计算浮动利率合约的利息。它的好处是：双方不用每次谈利率，只要约定“基准 + 利差”即可。<\/p>\n\n<h2>LIBOR：靠银行报价的旧基准<\/h2>\n<p>伦敦银行间同业拆借利率（LIBOR）每天由一批大银行报告：“如果我今天向别的银行借钱，大概要付多少利息。”取中间的平均值发布。问题是：<\/p>\n<ul>\n<li>它是“估计”出来的，不是真实成交，很多期限几乎没有实际交易。<\/li>\n<li>报价银行的交易员持有挂钩 LIBOR 的仓位，有动机去影响报价。<\/li>\n<li>它包含银行的信用风险，危机时会和政策利率大幅背离。<\/li>\n<\/ul>\n\n<h2>新基准：基于真实交易的隔夜利率<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>货币<\/th><th>新基准<\/th><th>基于什么<\/th><\/tr>\n<tr><td>美元<\/td><td>SOFR<\/td><td>以国债为抵押的隔夜回购交易<\/td><\/tr>\n<tr><td>欧元<\/td><td>€STR<\/td><td>银行无抵押的隔夜借款<\/td><\/tr>\n<tr><td>英镑<\/td><td>SONIA<\/td><td>无抵押的隔夜借款<\/td><\/tr>\n<tr><td>瑞郎<\/td><td>SARON<\/td><td>以合格抵押品为担保的隔夜回购<\/td><\/tr>\n<tr><td>日元<\/td><td>TONA<\/td><td>无抵押的隔夜拆借<\/td><\/tr>\n<\/table><\/div>\n<p>它们都基于大量真实交易，而且是隔夜利率，几乎不含银行信用风险。要得到 3 个月的利息，就把这 3 个月里每天的隔夜利率复利起来，叫后置复利（compounded in arrears）。欧元区的 EURIBOR 经过改革后继续保留，与 €STR 并存。<\/p>\n\n<div class=\"desk\">\n<p>基准切换给风险系统带来大量工作：曲线要重新构建（从 LIBOR 曲线改为 OIS 曲线）、存量合约要加入替代条款（fallback）、利率要做期限和信用利差的调整（credit adjustment spread）。今天在风险报告里看到的利率曲线，多半已经是 SOFR、€STR 等 OIS 曲线。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2012 年，巴克莱银行承认操纵 LIBOR，被英美监管机构罚款约 2.9 亿英镑，董事长和首席执行官先后辞职。此后瑞银、苏格兰皇家银行、德意志银行等多家银行也被罚款，合计数十亿美元，部分交易员被判刑。2017 年，英国金融行为监管局宣布不再强迫银行报价。美元 LIBOR 的主要期限在 2023 年 6 月 30 日停止以代表性方式发布，漫长的切换基本完成。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>基准利率是浮动利率合约计算利息的公开参考，几十万亿美元的合约挂钩它。<\/li>\n<li>LIBOR 靠银行报价，可被操纵、含信用风险，已基本退出。<\/li>\n<li>新基准 SOFR、€STR、SONIA 等基于真实隔夜交易，按期间复利计息。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>SOFR 基于有国债抵押的回购，几乎没有信用风险；LIBOR 包含银行的信用风险。危机时，这个区别对借浮动利率钱的银行有什么影响？<\/summary>\n<div><p>危机时银行自己的融资成本会上升，但 SOFR 可能反而下降（大家抢购国债，回购利率走低）。如果银行发放的贷款按 SOFR 收息，而自己的资金成本在上升，利差就被压缩。LIBOR 时代，贷款利息会随银行信用风险一起上升，部分抵消这个问题。这是银行业在切换中担心的“信用敏感性”缺失。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-7\"><\/a><\/li>\n<li><a href=\"#L9-21\"><\/a><\/li>\n<li><a href=\"#L10-1\"><\/a><\/li>\n<\/ul><\/div>\n","10.9":"<div class=\"scene\">\n<p>一家日本保险公司有大量日元，想买美国国债，需要三个月的美元。它不借美元，而是做了一笔<strong>外汇掉期（FX swap）<\/strong>：今天用日元换美元，同时约定三个月后再按约定汇率把美元换回日元。这三个月里，它实际上是用日元作抵押，借到了美元。<\/p>\n<\/div>\n\n<h2>外汇掉期：一买一卖，期限相反<\/h2>\n<p>外汇掉期由两笔交易组成：<\/p>\n<ol>\n<li><strong>近端（near leg）<\/strong>：今天按即期汇率，用一种货币换另一种。<\/li>\n<li><strong>远端（far leg）<\/strong>：未来某天按远期汇率换回来。<\/li>\n<\/ol>\n<p>两个汇率的差，叫掉期点（swap points），由两种货币的利差决定。效果上，就是一笔用一种货币作抵押、借另一种货币的短期借款。<\/p>\n<p>和交叉货币互换相比，外汇掉期期限短（多数在一年以内），期间不付利息，利差体现在远期汇率里。<\/p>\n\n<h2>规模巨大、大多看不见<\/h2>\n<p>外汇掉期是全球外汇市场交易量最大的品种，每天成交数万亿美元。根据国际清算银行（BIS）的估计，全球通过外汇掉期和远期形成的美元借款达到数十万亿美元，规模和美元国债相当，但因为是表外交易，并不显示在资产负债表上，被称为“隐藏的美元债务”。<\/p>\n\n<h2>谁在用<\/h2>\n<ul>\n<li>日本、欧洲的银行和保险公司：借美元投资美元资产，同时对冲汇率风险。<\/li>\n<li>企业：管理短期的外币收付。<\/li>\n<li>央行：在货币之间调剂流动性，例如美联储与其他央行的美元互换额度。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>银行的资金部和外汇掉期台用它管理不同货币之间的资金头寸：哪种货币多了，就换成缺的那种。风险报告里，外汇掉期带来两种货币的利率风险（短期 DV01）、交叉货币基差风险，以及近端和远端之间的结算风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机和 2020 年 3 月，全球美元短缺时，外汇掉期隐含的美元借款成本远高于美元利率本身，交叉货币基差急剧走负。非美国的银行很难借到美元，只能抛售美元资产。美联储通过与各国央行的美元互换额度，把美元借给这些央行，再由它们借给本国银行，才缓解了压力。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>外汇掉期是今天换出、未来换回的一对交易，相当于用一种货币作抵押借另一种。<\/li>\n<li>它是交易量最大的外汇产品，形成的美元借款规模巨大，大多在表外。<\/li>\n<li>美元紧张时，外汇掉期借美元的成本飙升，需要央行互换额度来缓解。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家欧洲银行用三个月期的外汇掉期借美元，去买 5 年期的美国公司债。这样做有什么风险？<\/summary>\n<div><p>期限错配：每三个月就要续做外汇掉期，如果美元突然紧张，续做的成本会飙升，甚至做不出来，只能被迫卖出公司债。这正是 2008 年和 2020 年很多非美国银行遇到的问题。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-8\"><\/a><\/li>\n<li><a href=\"#L18-25\"><\/a><\/li>\n<li><a href=\"#L7-13\"><\/a><\/li>\n<\/ul><\/div>\n","10.10":"<div class=\"scene\">\n<p>一家对冲基金认为某只股票被高估了，想做空（short selling）：先卖出，等跌了再买回来。问题是，手里没有这只股票，拿什么卖？<\/p>\n<p>另一边，一家大型养老金持有这只股票，打算放十年不动。股票躺在托管账户里，什么也不干。如果有人愿意借走一段时间，付点费用，用完再还回来，养老金何乐而不为？<\/p>\n<p>把这两边连起来的生意，就是<strong>证券借贷（securities lending，常简称 sec lending）<\/strong>。<\/p>\n<\/div>\n\n<h2>借的是券，不是钱<\/h2>\n<p>证券借贷里，被借来借去的是股票或债券本身：<\/p>\n<ul>\n<li><strong>出借方（lender）<\/strong>：养老金、保险公司、共同基金、ETF 这些长期持有大量证券的机构。<\/li>\n<li><strong>借入方（borrower）<\/strong>：交易商、对冲基金，以及通过交易商借券的各类投资者。<\/li>\n<li><strong>代理出借人（agent lender）<\/strong>：大部分出借方不会自己去找借家，而是委托托管银行等代理机构统一出借，按收入分成。<\/li>\n<\/ul>\n<p>借入方要交出抵押品（collateral），价值通常略高于借走的证券，比如 102% 或 105%，并付一笔借券费（lending fee）。借期一般不固定，出借方可以随时召回（recall），借入方也可以随时归还。<\/p>\n\n<h2>为什么要借券<\/h2>\n<ul>\n<li><strong>做空<\/strong>：最广为人知的用途。<\/li>\n<li><strong>交割<\/strong>：交易商卖出了一只债券，但自己的券还没到位，先借来交割，避免交割失败（settlement fail）。<\/li>\n<li><strong>做市<\/strong>：做市商要随时能卖，库存不够时先借。<\/li>\n<li><strong>抵押品转换<\/strong>：用手里不太好用的资产作抵押，借入优质国债，再拿国债去做别的融资。<\/li>\n<\/ul>\n\n<h2>出借方赚什么，承担什么<\/h2>\n<p>出借方的收入有两块：一是借券费；二是如果收的是现金抵押品，可以把这笔现金拿去投资，赚取再投资收益，同时按约定付给借入方一个返还利率（rebate rate）。借券费的高低取决于这只证券有多难借。大盘蓝筹股很容易借，费率极低，叫一般券（general collateral，GC）；被大量做空、市场上流通量又少的股票，费率可以高到每年百分之几十，叫特殊券（special）或“难借券”（hard-to-borrow）。<\/p>\n<p>借出期间，证券的经济利益仍然属于出借方。股票分红了，借入方要按同样的金额补给出借方，叫替代股息（manufactured dividend）。但投票权跟着证券走，暂时归了借入方。出借方如果想在股东大会上投票，就要先把股票召回。<\/p>\n<p>出借方承担的风险主要有两个：借入方违约而抵押品又不够；现金抵押品拿去投资时亏了钱。<\/p>\n\n<div class=\"desk\">\n<p>证券借贷每天的核心工作是盯市（mark-to-market）：借出证券和抵押品每天按市价重估。证券涨了或抵押品跌了，抵押不足，就要向借入方追加（margin call）；反过来，则要退还多余的抵押品。<\/p>\n<p>其他日常要处理的事：召回和交割时间的衔接，分红、拆股等公司行为（corporate actions）的处理，费率重新定价，以及难借券的分配。合同一般签 GMSLA（全球证券借贷主协议，Global Master Securities Lending Agreement）。代理出借人通常还会向出借方承诺：如果借入方违约、抵押品不够买回证券，差额由代理人补足，叫借方违约赔偿（borrower default indemnification）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2008 年 AIG。<\/strong>大家记住的是 AIG 卖信用违约互换（CDS）出了事，但它在证券借贷上也损失惨重。AIG 旗下保险公司把持有的证券借出，收回大量现金抵押品，再把这些现金投进了看似安全、其实与次贷相关的长期证券。金融危机中，借入方纷纷要求归还现金，而这些投资已经大幅缩水、很难卖出。这部分缺口最后也靠政府救助填补。<\/p>\n<p><strong>2021 年 GameStop。<\/strong>这只股票的做空数量一度超过可流通股数的 100%，借券费率飙升。散户集体买入推高股价，空头被迫买回股票还券，又进一步推高股价，形成了著名的逼空（short squeeze）。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>证券借贷是把股票或债券有偿借出去，借入方交抵押品、付借券费。<\/li>\n<li>借券的主要用途是做空、交割、做市和抵押品转换。<\/li>\n<li>每天盯市、追加抵押品、处理召回和公司行为，是这门生意的日常；最大的风险在借入方违约和现金抵押品的再投资。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家养老金想参加某公司的股东大会投票，但这只股票正借给别人。它该怎么办？借入方又会怎么应对？<\/summary>\n<div><p>养老金要在股东大会的登记日之前召回股票，拿回投票权。借入方要么从市场上另找券源再借，要么买入股票归还。如果这只股票本来就难借，召回会推高借券费，甚至迫使空头平仓。所以出借方在出借和召回时，要在借券收入和投票权之间做取舍。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-11\"><\/a><\/li>\n<li><a href=\"#L10-12\"><\/a><\/li>\n<li><a href=\"#L10-13\"><\/a><\/li>\n<li><a href=\"#L10-16\"><\/a><\/li>\n<li><a href=\"#L10-18\"><\/a><\/li>\n<li><a href=\"#L10-19\"><\/a><\/li>\n<\/ul><\/div>\n","10.11":"<div class=\"scene\">\n<p>证券借贷市场里，借出去的股票和债券有数万亿美元。谁是这些证券的主人？谁在借？他们各自为什么要做这门生意？把参与者理清楚，这个市场就好懂了。<\/p>\n<\/div>\n\n<h2>出借方：长期持有大量证券的机构<\/h2>\n<ul>\n<li><strong>养老金<\/strong>：持有大量股票和债券，期限很长，借出去赚一点额外收入。<\/li>\n<li><strong>共同基金和 ETF<\/strong>：用借券收入抵消一部分管理成本，提高回报。<\/li>\n<li><strong>保险公司<\/strong>：持有大量债券。<\/li>\n<li><strong>主权财富基金和央行<\/strong>：部分央行也会出借持有的国债。<\/li>\n<\/ul>\n<p>它们大多不自己出借，而是委托<strong>代理出借人（agent lender）<\/strong>，通常是大型托管银行，比如纽约梅隆、道富、摩根大通，也有专业的第三方代理。代理人负责找借家、谈费率、管理抵押品，收入按约定比例分成，常见出借方拿大头。<\/p>\n\n<h2>借入方：需要证券的人<\/h2>\n<ul>\n<li><strong>交易商（broker-dealers）<\/strong>：最大的直接借入方。他们借券一方面是自己做市、交割，另一方面是再借给客户。<\/li>\n<li><strong>对冲基金<\/strong>：通过主经纪商（prime broker）借券做空。<\/li>\n<li><strong>做市商和 ETF 申购商<\/strong>：维持做市和 ETF 申购赎回需要临时借券。<\/li>\n<\/ul>\n<p>所以链条通常是：出借方 → 代理出借人 → 交易商 → 对冲基金等最终借入方。<\/p>\n\n<h2>为什么借：四种需求<\/h2>\n<ul>\n<li><strong>做空<\/strong>：先借券卖出，日后买回还券。<\/li>\n<li><strong>交割<\/strong>：卖出的券还没到位，先借来交割，避免交割失败的罚款。<\/li>\n<li><strong>做市和套利<\/strong>：可转债套利、指数套利等策略都需要借券。<\/li>\n<li><strong>抵押品转换<\/strong>：用较差的资产作抵押，借入优质债券，再拿去做回购或交保证金。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>在交易商内部，证券借贷通常由证券融资（securities finance）或股票融资台负责，和回购、主经纪业务紧密相连。风控要看整条链：对每个借入方的敞口、抵押品，以及当出借方召回时能否及时从别处借到替代券。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>证券借贷让很多指数基金和 ETF 的成本几乎为零，甚至能贡献额外回报。比如一些大型被动基金每年的借券收入，可以抵消相当一部分管理费。这也是为什么出借方乐于参与：对一个长期持有、本来就不打算卖出的组合来说，借券收入几乎是“额外的”。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>出借方是养老金、基金、保险公司等长期持有者，通常委托托管银行等代理出借人。<\/li>\n<li>借入方主要是交易商，再转借给对冲基金等最终借入方。<\/li>\n<li>借券需求来自做空、交割、做市套利和抵押品转换。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家养老金为什么愿意把股票借给可能会做空它的对冲基金？这不是在帮别人打压自己的资产吗？<\/summary>\n<div><p>养老金是长期持有者，短期价格波动对它影响不大；借券收入是稳定的额外回报。而且做空让市场价格更有效，长期来看对投资者有利。也有一些出借方出于治理考虑会限制出借，比如在股东大会前召回股票投票，或者不借出某些敏感的股票。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-10\"><\/a><\/li>\n<li><a href=\"#L10-12\"><\/a><\/li>\n<li><a href=\"#L10-20\"><\/a><\/li>\n<li><a href=\"#L10-24\"><\/a><\/li>\n<\/ul><\/div>\n","10.12":"<div class=\"scene\">\n<p>借一股苹果股票，每年的费用可能只有 0.25%；借一只被大量做空的小盘股，每年可能要 50% 甚至更高。同样是借券，价格可以差几百倍。决定价格的，是这只券有多难借。<\/p>\n<\/div>\n\n<h2>一般券：容易借<\/h2>\n<p>一般券（general collateral，GC）是供应充足、需求一般的证券，比如大盘蓝筹股、大部分国债。出借方很多，借入方随时能借到，费率很低，股票通常每年零点几个百分点。<\/p>\n\n<h2>特殊券：很难借<\/h2>\n<p>特殊券（special），也叫难借券（hard-to-borrow），是需求远大于供应的证券。常见原因：<\/p>\n<ul>\n<li>大量投资者看空，想做空它。<\/li>\n<li>可流通的股数少，大部分被长期持有者锁住，或者出借方不愿出借。<\/li>\n<li>有事件驱动的需求：并购套利、可转债套利、配股前后。<\/li>\n<li>债券市场里：某只国债成了期货交割的最便宜券，或者被大量做空。<\/li>\n<\/ul>\n<p>特殊券的费率可以很高，有时每年超过 100%。如果收的是现金抵押品，特殊券的返还利率（rebate rate）会很低甚至为负：借入方交了现金，不但拿不到利息，还要倒贴。<\/p>\n\n<h2>费率会突然变化<\/h2>\n<p>一只股票从 GC 变成特殊券可能只需要几天：一份做空报告发布、一次并购公告，借券需求就会激增。已经借了券的人，费率可能被重新定价（re-rate），甚至被召回。所以借券成本是做空策略里最不确定的成本之一。<\/p>\n\n<div class=\"desk\">\n<p>证券借贷台的核心工作之一，就是管理特殊券：给难借券定价、分配有限的券源、预测召回风险。行业里有专门的数据提供商（比如 S&amp;P Global 旗下的 Securities Finance 数据、EquiLend 等）提供各只证券的借券费率、使用率（utilization，已借出的比例）、空头仓位等，交易员和风控都会用。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年 1 月的 GameStop 是特殊券的极端例子：空头仓位一度超过可流通股数的 100%，意味着有些股票被借出又借出。借券费率大幅上升，可借的券几乎耗尽。散户集体买入、股价暴涨，空头被迫买回股票还券，进一步推高股价。这次逼空让市场意识到：特殊券的借券成本和召回风险，可以把一个看起来合理的空头仓位变成巨大的亏损。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>一般券供应充足、费率很低；特殊券需求远大于供应、费率可以极高。<\/li>\n<li>做空、可流通股少、事件驱动和期货交割都会让一只证券变成特殊券。<\/li>\n<li>费率可能突然重新定价，召回风险让做空策略的成本高度不确定。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只股票的借券使用率（已借出占可出借的比例）从 30% 升到 95%，费率从 0.5% 升到 20%。这说明什么？对已有的空头意味着什么？<\/summary>\n<div><p>说明做空需求激增，可借的券快用完了，它正在变成特殊券。对已有空头来说，借券成本可能被重新定价、大幅上升；如果出借方召回，可能找不到替代券源，被迫买回股票平仓。高使用率加上股价上涨，就是发生逼空的典型条件。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-10\"><\/a><\/li>\n<li><a href=\"#L10-13\"><\/a><\/li>\n<li><a href=\"#L10-18\"><\/a><\/li>\n<li><a href=\"#L13-21\"><\/a><\/li>\n<\/ul><\/div>\n","10.13":"<div class=\"scene\">\n<p>借入方借走 1 亿美元的股票，要交给出借方一些东西作担保。交什么？可以是 1.02 亿美元现金，也可以是 1.05 亿美元的国债，甚至是另一篮子股票。抵押品的种类不同，经济上和风险上的意义就完全不同。<\/p>\n<\/div>\n\n<h2>现金抵押<\/h2>\n<p>在美国，现金是证券借贷最常见的抵押品。借入方交现金，出借方（通过代理人）把现金拿去投资，比如买短期国债、回购、货币基金，赚取再投资收益；同时按约定付给借入方一个返还利率（rebate rate）。<\/p>\n<ul>\n<li>出借方的收入 = 现金再投资收益 − 付给借入方的返还利率。<\/li>\n<li>一般券的返还利率接近市场利率，出借方赚得少；特殊券的返还利率很低甚至为负，出借方赚得多。<\/li>\n<\/ul>\n<p>现金抵押的风险在再投资：如果现金被投进了风险较高或期限较长的资产，一旦出问题，或者借入方突然要求还现金时资产卖不出去，出借方就会亏损。<\/p>\n\n<h2>非现金抵押<\/h2>\n<p>在欧洲和亚洲，非现金抵押更常见：借入方交国债、机构债、股票等证券作抵押。出借方不用再投资，收入就是直接收取的借券费（lending fee）。抵押品要按约定的标准（种类、评级、集中度）筛选，并按折扣和保证金比例计算。<\/p>\n<p>非现金抵押通常通过三方代理管理，和三方回购的方式类似。<\/p>\n\n<h2>保证金比例<\/h2>\n<p>无论哪种抵押，价值都要高于借出的证券，常见的是：<\/p>\n<ul>\n<li>同币种、抵押品风险低：102%。<\/li>\n<li>跨币种：105%，多出的部分用来覆盖汇率波动。<\/li>\n<li>股票作抵押：可能更高，取决于双方协议和抵押品质量。<\/li>\n<\/ul>\n<p>每天按市价调整，抵押不足就追加，抵押过多就退回。<\/p>\n\n<div class=\"desk\">\n<p>风控看证券借贷的抵押品，主要看三件事：抵押品是否足够（覆盖率）、抵押品是否和借入方或出借证券高度相关（错向风险）、现金抵押品的再投资组合是否保守（期限、信用、流动性）。代理出借人通常对再投资设置严格的指引。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年，AIG 的保险子公司把证券借出，收回大量现金抵押品，再把这些现金投进了与次贷相关的长期证券。危机中借入方纷纷归还证券、要求取回现金，而这些投资已经大幅贬值、很难卖出，形成了数百亿美元的缺口。美联储后来专门设立了 Maiden Lane II 工具，买下了这批资产。这是现金抵押再投资风险最典型的案例。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>现金抵押：出借方再投资现金、付给借入方返还利率，收入来自两者之差。<\/li>\n<li>非现金抵押：出借方直接收借券费，抵押品按标准筛选，常通过三方代理管理。<\/li>\n<li>保证金比例常见 102%（同币种）和 105%（跨币种），每天调整；现金再投资是重要风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只特殊券以现金作抵押借出，返还利率是 −2%。借入方交了 1 亿美元现金，每年要付多少？出借方如果把现金放在 4% 的回购里，每年赚多少？<\/summary>\n<div><p>返还利率为负，借入方每年不但拿不到利息，还要倒贴约 200 万美元。出借方把现金投在 4% 的回购里，每年赚 400 万利息，再加上收到的 200 万，合计约 600 万美元的收入。负的返还利率就是特殊券的“借券费”。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-12\"><\/a><\/li>\n<li><a href=\"#L10-16\"><\/a><\/li>\n<li><a href=\"#L10-17\"><\/a><\/li>\n<li><a href=\"#L10-25\"><\/a><\/li>\n<\/ul><\/div>\n","10.14":"<div class=\"scene\">\n<p>A 把债券交给 B，B 把现金交给 A，过一段时间再各自换回来。这是一笔回购，还是一笔证券借贷？从现金和证券的流向看，两者几乎一模一样。区别在于：这笔交易是为了谁、为了什么。<\/p>\n<\/div>\n\n<h2>同一枚硬币的两面<\/h2>\n<div class=\"tbl\"><table>\n<tr><th><\/th><th>回购（repo）<\/th><th>证券借贷（sec lending）<\/th><\/tr>\n<tr><td>发起的动机<\/td><td>需要现金的一方发起：用证券借钱<\/td><td>需要证券的一方发起：用抵押品借券<\/td><\/tr>\n<tr><td>谁付钱<\/td><td>借钱方付回购利率<\/td><td>借券方付借券费（或接受较低的返还利率）<\/td><\/tr>\n<tr><td>定价的核心<\/td><td>现金的价格（利率）<\/td><td>证券的稀缺程度（费率）<\/td><\/tr>\n<tr><td>法律形式<\/td><td>卖出并约定买回<\/td><td>出借，所有权转移，约定归还同类证券<\/td><\/tr>\n<tr><td>标准合同<\/td><td>GMRA<\/td><td>GMSLA<\/td><\/tr>\n<tr><td>期限<\/td><td>多为固定期限，隔夜最常见<\/td><td>多为开放期限，可随时召回或归还<\/td><\/tr>\n<\/table><\/div>\n<p>一个简单的判断方法：如果交易是因为“我需要钱”，它就是回购；如果是因为“我需要这只券”，就是证券借贷。特殊回购（special repo）正好在两者之间：表面是回购，实际是为了借到一只特定的债券，所以回购利率会很低，相当于借券费。<\/p>\n\n<h2>经济上的共同点<\/h2>\n<ul>\n<li>都是有抵押的短期交易，都要每天盯市、追加保证金。<\/li>\n<li>所有权在法律上转移，但经济利益（票息、分红）通过替代支付还给原持有人。<\/li>\n<li>都是交易商融资和做市的基础，也都可能在危机中出现挤兑。<\/li>\n<li>监管上常被合称为证券融资交易（securities financing transactions，SFT），比如欧盟的 SFTR 要求两者都报告。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>在交易商内部，回购台和证券借贷台常常属于同一个证券融资部门，共享库存和抵押品：一只债券如果是特殊券，可以通过证券借贷借出赚费，也可以在回购里以很低的利率融资。风控和资金部看的是整体：每个对手方在回购和借贷上的总敞口、抵押品的总体集中度。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年雷曼兄弟倒闭时，它在回购和证券借贷上都有大量对手方。很多出借方发现，借给雷曼的证券收不回来，只能用手里的现金抵押品去市场上买回替代证券，而当时市场剧烈波动，买回的成本高于抵押品价值，出现损失。这次经历推动了行业改进合同的违约处理条款，也促使监管机构把回购和证券借贷放在一起，作为“证券融资交易”统一监管和报告。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>回购和证券借贷的现金和证券流向几乎相同，区别在于为了钱还是为了券。<\/li>\n<li>回购定价看利率，证券借贷定价看证券的稀缺程度；特殊回购介于两者之间。<\/li>\n<li>两者都是有抵押、每天盯市的证券融资交易，监管上常一起报告和管理。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家交易商手里有一只很抢手的国债特殊券。它可以把这只券拿去做回购融资，也可以通过证券借贷借出去。两种选择的收益来自哪里？<\/summary>\n<div><p>做回购：用这只券借钱，因为是特殊券，回购利率很低，借钱的成本便宜，收益来自低成本融资。做证券借贷：把券借出收取较高的借券费（或现金抵押下付很低的返还利率）。两者本质上都在“出售”这只券的稀缺性，交易商会选择更划算的那一边。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-4\"><\/a><\/li>\n<li><a href=\"#L10-10\"><\/a><\/li>\n<li><a href=\"#L10-21\"><\/a><\/li>\n<li><a href=\"#L10-23\"><\/a><\/li>\n<\/ul><\/div>\n","10.15":"<div class=\"scene\">\n<p>周一早上，一家借了你 5 亿美元股票的交易商宣布破产。你手里有它交的 5.1 亿美元现金抵押品。听起来很安全，但当天你要去市场上买回这些股票，而股价恰好在大涨。买回来花了 5.4 亿，抵押品不够，你亏了 3,000 万。这就是证券借贷里的<strong>对手方风险（counterparty risk）<\/strong>。<\/p>\n<\/div>\n\n<h2>对手方违约后会发生什么<\/h2>\n<p>借入方违约时，出借方按合同（GMSLA 或 GMRA）的违约条款处理：<\/p>\n<ol>\n<li><strong>宣布违约<\/strong>，终止所有未到期的交易。<\/li>\n<li><strong>处置<\/strong>：用手里的抵押品，到市场上买回被借走的证券；如果抵押品是证券，就先卖掉换成现金。<\/li>\n<li><strong>结算净额<\/strong>：比较买回证券的成本和抵押品的价值。抵押品多出来的退回，不够的部分成为对违约方的索赔，排队等破产清算。<\/li>\n<\/ol>\n\n<h2>损失从哪里来<\/h2>\n<p>只要抵押品足够、每天盯市，正常情况下损失很小。真正的风险在“违约那天到处置完成”这几天里的市场变动：<\/p>\n<ul>\n<li><strong>被借证券上涨<\/strong>：买回更贵。<\/li>\n<li><strong>抵押品下跌<\/strong>：如果抵押品是证券，卖出时可能更便宜。<\/li>\n<li><strong>两者同时发生<\/strong>：违约本身往往就发生在市场剧烈波动的时候。<\/li>\n<li><strong>流动性<\/strong>：被借证券或抵押品难以买卖，处置时间更长、价格更差。<\/li>\n<\/ul>\n<p>这几天的潜在损失，就是交易对手风险的核心，用初始保证金（102%、105% 中多出的部分）来覆盖。<\/p>\n\n<div class=\"desk\">\n<p>风控衡量证券借贷的交易对手风险，通常算三个数：当前敞口（被借证券市值减抵押品）、潜在未来敞口（假设对手方违约后若干天内市场不利变动）、违约损失。对每个借入方设定限额，并在压力情景下检查：如果最大的几个借入方同时违约，损失会是多少。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年 9 月雷曼兄弟破产时，大量出借方需要在几天内处置抵押品、买回借给雷曼的证券。当时市场剧烈波动、流动性枯竭，部分出借方的抵押品不足以买回全部证券。代理出借人根据赔偿承诺补足了一部分差额，有的出借方只能向雷曼的破产财产索赔，等待多年。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>借入方违约后，出借方终止交易、用抵押品买回证券、结算净额。<\/li>\n<li>损失来自违约到处置完成这几天的市场变动和流动性问题。<\/li>\n<li>风控看当前敞口、潜在未来敞口和违约损失，并对每个借入方设限额。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同样借出 1 亿美元，一笔借出的是大盘蓝筹股，另一笔借出的是一只交易清淡的小盘股。哪笔对手方风险更大？<\/summary>\n<div><p>小盘股那笔。借入方违约后，买回小盘股需要更长时间，买入本身还会推高价格，处置期间的波动也更大。所以借出流动性差的证券，通常要求更高的保证金比例和更严的限额。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-16\"><\/a><\/li>\n<li><a href=\"#L10-20\"><\/a><\/li>\n<li><a href=\"#L10-22\"><\/a><\/li>\n<li><a href=\"#L17-21\"><\/a><\/li>\n<\/ul><\/div>\n","10.16":"<div class=\"scene\">\n<p>早上 8 点，证券借贷运营团队拿到一份清单：昨晚收盘后，3,000 笔借出交易里，有 400 笔的抵押品不足，200 笔的抵押品过多。上午 10 点前，要发出所有追加和退还通知。这就是<strong>每日盯市（daily mark-to-market）<\/strong>的日常。<\/p>\n<\/div>\n\n<h2>每天要做的事<\/h2>\n<ol>\n<li><strong>重估<\/strong>：用前一天的收盘价，重新计算每笔借出证券的市值和对应抵押品的市值。<\/li>\n<li><strong>计算要求<\/strong>：按约定的保证金比例（比如 102%），算出每笔需要的抵押品金额。<\/li>\n<li><strong>比较<\/strong>：现有抵押品低于要求，就要求借入方补足（mark-up）；高于要求，就退还多余部分（mark-down）。<\/li>\n<li><strong>汇总<\/strong>：同一对手方的多笔交易通常合并计算，按净额补交或退还。<\/li>\n<li><strong>对账与跟进<\/strong>：和对手方核对，处理分歧，跟踪是否按时到账。<\/li>\n<\/ol>\n\n<h2>容易出问题的地方<\/h2>\n<ul>\n<li><strong>价格来源不同<\/strong>：双方用了不同的价格，尤其是不活跃的证券。<\/li>\n<li><strong>公司行为<\/strong>：拆股、配股、分红后，数量和价格要同时调整，处理不当会算错。<\/li>\n<li><strong>汇率<\/strong>：跨币种交易，汇率变动也要计入。<\/li>\n<li><strong>最低转移金额<\/strong>：差额太小不调整，大量小差额可能悄悄累积。<\/li>\n<li><strong>时区和截止时间<\/strong>：不同市场的结算时间不同，抵押品可能当天到不了。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>风控每天会看一份“抵押不足报告”：哪些对手方的抵押品低于要求、差多少、拖了几天。持续不补的对手方会被升级处理，严重时停止新交易甚至宣布违约。在压力时期，还要看如果市场大幅波动，一天之内会产生多少追加需求，自己能否及时处理。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月市场剧烈波动期间，证券借贷和回购市场的盯市金额和追加通知数量大增，很多机构的运营团队工作量是平时的好几倍。行业组织事后总结时指出，自动化程度高、使用标准化平台（比如 EquiLend 和三方代理）的机构处理得更顺利；依赖手工和邮件的机构，更容易出现延误和估值争议。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>每天重估借出证券和抵押品，不足要求补足，过多要退还，通常按对手方净额处理。<\/li>\n<li>常见问题来自价格来源、公司行为、汇率、最低转移金额和截止时间。<\/li>\n<li>风控跟踪抵押不足的金额和天数，并评估压力下的追加需求。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一笔借出交易，借出证券市值 1 亿，抵押品是 1.02 亿现金。第二天证券涨到 1.05 亿。按 102% 的要求，需要追加多少抵押品？<\/summary>\n<div><p>需要的抵押品是 1.05 亿 × 102% = 1.071 亿。现有 1.02 亿，需要追加 510 万。如果合同里有最低转移金额（比如 50 万），这个差额超过了它，所以要发出追加通知。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-7\"><\/a><\/li>\n<li><a href=\"#L10-13\"><\/a><\/li>\n<li><a href=\"#L10-19\"><\/a><\/li>\n<\/ul><\/div>\n","10.17":"<div class=\"scene\">\n<p>一家养老金通过代理出借了 50 亿美元的股票，收到 51 亿美元现金抵押品。代理人把这笔现金投了出去，每年多赚了几千万。一切看起来很美好，直到有一天，借入方纷纷还回股票、要求拿回现金，而这些现金已经被投进了一时卖不出去的资产里。这就是<strong>现金抵押品的再投资风险（cash collateral reinvestment risk）<\/strong>。<\/p>\n<\/div>\n\n<h2>风险从哪里来<\/h2>\n<p>现金抵押品理论上随时要还给借入方，期限非常短。而再投资时，为了多赚一点，容易出现三种偏离：<\/p>\n<ul>\n<li><strong>期限错配<\/strong>：把随时可能要还的现金，投进了期限较长的资产。<\/li>\n<li><strong>信用风险<\/strong>：投进了信用较差、收益较高的资产，比如公司债、结构化产品。<\/li>\n<li><strong>流动性风险<\/strong>：投进了平时能卖、危机时卖不掉的资产。<\/li>\n<\/ul>\n<p>平时，这些偏离带来额外收益；危机时，借入方集中归还证券、要求取回现金，出借方被迫在最差的时候卖出资产，亏损由出借方自己承担。代理人的赔偿承诺通常只覆盖借入方违约，不覆盖再投资亏损。<\/p>\n\n<h2>怎么管<\/h2>\n<ul>\n<li>设定再投资指引：允许的资产类型、最长期限、最低评级、集中度上限。<\/li>\n<li>保持足够的流动性：一部分放在隔夜回购或政府货币基金，随时可以取出。<\/li>\n<li>监控期限和流动性缺口：如果明天一半借出被归还，能不能拿出足够的现金。<\/li>\n<li>压力测试：模拟大规模归还和资产价格下跌同时发生。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>风控会把再投资组合当成一个独立的投资组合来看：它的利率风险、信用风险、流动性分布，和它对应的“负债”（随时可能归还的现金抵押品）是否匹配。很多出借方在 2008 年之后收紧了再投资指引，或者干脆只接受非现金抵押品。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年，美国国际集团（AIG）旗下保险公司的证券借贷项目，把大量现金抵押品投进了住房抵押贷款证券。危机中借入方大规模归还证券，AIG 需要偿还数百亿美元现金，而这些证券已经大幅贬值、无法卖出。美联储为此设立了 Maiden Lane II，从 AIG 手中买下这批资产。同一时期，多家托管银行的再投资基金也出现亏损，一些出借方起诉了代理人。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>现金抵押品随时可能要归还，再投资却常常偏向更长期限、更低信用、更差流动性。<\/li>\n<li>再投资亏损通常由出借方承担，代理人的赔偿一般只覆盖借入方违约。<\/li>\n<li>用再投资指引、流动性储备和压力测试管理这项风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个再投资组合平均期限 9 个月，而对应的借出交易大多是开放期限、可随时归还的。最担心什么情况？<\/summary>\n<div><p>最担心大量借入方在短时间内集中归还证券，比如市场恐慌、做空需求骤降，或者某个大借入方出事。这时要马上还现金，但再投资资产要几个月后才到期，只能提前卖出；如果正好遇到市场下跌、流动性差，就会亏损。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-13\"><\/a><\/li>\n<li><a href=\"#L10-20\"><\/a><\/li>\n<li><a href=\"#L10-3\"><\/a><\/li>\n<\/ul><\/div>\n","10.18":"<div class=\"scene\">\n<p>一家基金经理决定卖掉手里的一只股票，可这只股票正被借出去。她通知代理人召回。借入方需要在交割日前把股票还回来，否则她卖出的股票就交不了货。如果借入方一时找不到股票呢？就会发生<strong>交割失败（settlement fail）<\/strong>。<\/p>\n<\/div>\n\n<h2>召回：出借方要回证券<\/h2>\n<p>大部分证券借贷是开放期限的，出借方可以随时召回（recall）。常见原因：<\/p>\n<ul>\n<li>出借方要卖出这只证券。<\/li>\n<li>要参加股东大会投票。<\/li>\n<li>风险考虑，比如借入方信用变差，或者市场异常。<\/li>\n<\/ul>\n<p>召回后，借入方要在标准结算周期内归还，比如美国股票 T+1。借入方通常会从别的出借方借到替代券，或者在市场上买入归还。<\/p>\n\n<h2>交割失败：券没按时到<\/h2>\n<p>如果借入方没能按时归还，出借方卖出的交易也会跟着交割失败，形成连锁反应。交割失败的后果包括：<\/p>\n<ul>\n<li><strong>罚款<\/strong>：欧盟的中央证券存管法规（CSDR）对交割失败按天收取罚款；美国的部分市场有类似的收费机制。<\/li>\n<li><strong>强制买入（buy-in）<\/strong>：失败持续一段时间后，买方可以在市场上买入证券，差价由失败方承担。<\/li>\n<li><strong>融资和对手方成本<\/strong>：没收到证券，就没法再用它融资或交付。<\/li>\n<li><strong>监管要求<\/strong>：美国 SEC 的 Reg SHO 规定，卖空的交割失败持续一定天数后必须平仓。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>证券借贷台和运营团队每天要跟踪：哪些召回还没完成、哪些交易有交割失败的风险、要不要提前从别处借券。风控关注召回风险集中的证券：如果一只特殊券的出借方集中召回，借入方可能根本找不到替代券源，只能被迫买入，推高价格。<\/p>\n<p>合同里通常约定：借入方未能按时归还召回的证券，出借方有权用抵押品自行买入，费用由借入方承担。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美国股票在 2024 年 5 月 28 日从 T+2 改为 T+1 结算。结算周期缩短一天，意味着召回和归还的时间更紧，尤其是跨时区的外国出借方，需要在美国交易日当天就完成召回和归还安排。行业为此调整了召回截止时间和流程。欧洲方面，欧盟也已经确定在 2027 年 10 月转向 T+1。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>出借方可以随时召回证券，原因包括卖出、投票和风险考虑。<\/li>\n<li>借入方没按时归还就会导致交割失败，带来罚款、强制买入和连锁失败。<\/li>\n<li>结算周期缩短（如 T+1）让召回的时间更紧，需要提前安排。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只股票的借券使用率已经很高，几家大出借方同时召回。借入方会面临什么？股价可能怎样？<\/summary>\n<div><p>借入方很难找到替代券源，借券费率飙升；找不到券就只能在市场上买入股票归还，集中买入会推高股价。如果股价上涨又迫使更多空头平仓，就可能形成逼空。这就是召回集中带来的风险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-12\"><\/a><\/li>\n<li><a href=\"#L10-19\"><\/a><\/li>\n<li><a href=\"#L17-13\"><\/a><\/li>\n<\/ul><\/div>\n","10.19":"<div class=\"scene\">\n<p>你借出了 10 万股某公司股票。借出期间，这家公司每股分红 2 元。股票现在登记在别人名下，分红也发给了别人。你的 20 万元分红去哪了？借入方要补给你。这笔钱叫<strong>替代股息（manufactured dividend）<\/strong>。<\/p>\n<\/div>\n\n<h2>借出不等于放弃经济利益<\/h2>\n<p>证券借贷里，法律所有权转移给了借入方，但合同约定：出借方保留证券的全部经济利益，就像从来没有借出一样。所以借出期间发生的各种公司行为（corporate actions），都要由借入方“还原”给出借方：<\/p>\n<ul>\n<li><strong>分红和利息<\/strong>：借入方支付等额的替代股息或替代利息（manufactured payment）。<\/li>\n<li><strong>拆股、送股<\/strong>：归还的股数按比例调整。<\/li>\n<li><strong>配股、认购权<\/strong>：出借方可以选择是否参与，借入方要提供同样的权利或等值补偿。<\/li>\n<li><strong>并购、要约<\/strong>：出借方可能需要召回证券才能参与选择。<\/li>\n<\/ul>\n\n<h2>投票权跟着证券走<\/h2>\n<p>投票权例外：股票借出后，投票权在借入方（或者最终买入股票的人）手里，出借方无法投票。想投票，就要在登记日前召回股票。<\/p>\n\n<h2>税是一个复杂的问题<\/h2>\n<p>替代股息和真正的股息，在很多国家的税务处理不同。例如在某些市场，替代股息的预提税和可抵扣税额与真实股息不一样，出借方收到的替代股息可能比真实股息少或多。历史上也有人利用这种差异，在分红日前后转移股票来规避或多退税款，被称为“股息套利”。<\/p>\n\n<div class=\"desk\">\n<p>公司行为处理是证券借贷运营最容易出错的环节之一：每一个分红、拆股、配股，都要识别哪些借出交易受影响、按什么比例调整、何时支付、税率如何。风控和合规会特别关注分红日前后的异常借券活动，防范税务相关的违规交易。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>德国的 Cum-Ex 案。<\/strong>2000 年代到 2012 年前后，一些银行和投资者利用股票在分红日前后的快速买卖和借贷，让税务机关对同一笔股息的预提税多次退税。德国估计损失了上百亿欧元的税收，多国检察机关立案调查，部分银行家和律师被判刑，一些银行被要求退还税款和支付罚款。这起案件让监管机构对分红日前后的证券借贷和交易高度警惕。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>借出期间，出借方保留经济利益：分红、利息由借入方以替代支付补给出借方。<\/li>\n<li>拆股、配股、并购等公司行为都要相应还原；投票权则跟着证券走，出借方要召回才能投票。<\/li>\n<li>替代股息的税务处理和真实股息不同，分红日前后的交易是合规关注的重点。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只股票即将召开股东大会，表决一项有争议的并购。一家养老金借出了大量这只股票。它该怎么做？<\/summary>\n<div><p>如果它想投票，必须在股权登记日之前召回股票，让股票回到自己名下。代价是损失这段时间的借券收入，借入方也可能要支付更高的费用去找替代券源。很多机构有政策规定：遇到重要投票时召回股票。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-18\"><\/a><\/li>\n<li><a href=\"#L10-16\"><\/a><\/li>\n<li><a href=\"#L17-16\"><\/a><\/li>\n<\/ul><\/div>\n","10.20":"<div class=\"scene\">\n<p>一家养老金问它的托管银行：“如果借我股票的那家交易商破产了，抵押品又不够买回股票，谁来承担损失？”托管银行回答：“我们来。”这个承诺叫<strong>借方违约赔偿（borrower default indemnification）<\/strong>，是代理出借业务最重要的卖点之一。<\/p>\n<\/div>\n\n<h2>赔偿承诺覆盖什么<\/h2>\n<p>代理出借人（通常是托管银行）向出借方承诺：如果借入方违约，而处置抵押品得到的钱不足以买回被借出的证券，差额由代理人补足。<\/p>\n<p>它通常<strong>不<\/strong>覆盖：<\/p>\n<ul>\n<li>现金抵押品再投资产生的亏损。<\/li>\n<li>出借方自己指定的、超出代理人标准的抵押品类型带来的损失。<\/li>\n<li>市场价格变动本身（只要借入方没有违约）。<\/li>\n<\/ul>\n<p>具体范围以合同为准，各家代理人的条款并不完全相同。<\/p>\n\n<h2>对代理人意味着什么<\/h2>\n<p>赔偿承诺让出借方几乎不用担心交易对手风险，代理人则承担了这部分风险。这需要代理人：<\/p>\n<ul>\n<li>严格挑选借入方，设定每个借入方的限额。<\/li>\n<li>维持足够的抵押品和保证金比例。<\/li>\n<li>持有监管资本来覆盖这项风险。银行监管把赔偿承诺视为一种担保，要计提相应的资本。<\/li>\n<\/ul>\n<p>所以代理人在分配借券机会时，会更倾向于信用好的借入方，借券费率的分成也会体现它承担的风险。<\/p>\n\n<div class=\"desk\">\n<p>托管银行的风控要把所有赔偿承诺汇总起来看：在每个借入方上的总敞口、在最坏情景下（几个大借入方同时违约、市场剧烈波动）可能需要赔付多少。这是托管银行风险报告里的一个重要部分。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>雷曼兄弟 2008 年破产时，是证券借贷市场上的重要借入方之一。很多代理出借人在雷曼违约后，用抵押品买回证券，对少数抵押品不足的情况按赔偿承诺补足了差额。行业事后普遍认为，借方违约赔偿在这次危机中基本发挥了作用；真正让出借方受损的，主要是现金再投资，而这正是赔偿承诺不覆盖的部分。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>代理出借人承诺：借入方违约且抵押品不足时，补足差额。<\/li>\n<li>赔偿通常不覆盖现金再投资亏损，具体范围以合同为准。<\/li>\n<li>代理人因此承担交易对手风险，需要严格的限额、抵押品管理和监管资本。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两家托管银行给出的借券收入分成不同：A 给出借方 90%，但不提供赔偿；B 给 80%，提供赔偿。出借方该怎么选？<\/summary>\n<div><p>要比较多出的 10% 收入是否足以补偿自己承担的交易对手风险。如果出借方有能力评估和管理借入方的信用、抵押品，且借出的多是流动性好的证券，可能选 A；如果更看重稳定、不想承担违约风险，选 B。很多养老金和基金选择带赔偿的安排，因为损失的代价远大于少收的那部分收入。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-15\"><\/a><\/li>\n<li><a href=\"#L10-17\"><\/a><\/li>\n<li><a href=\"#L10-11\"><\/a><\/li>\n<\/ul><\/div>\n","10.21":"<div class=\"scene\">\n<p>一家银行每天和几百个对手方做几千笔回购和证券借贷。如果每笔都单独签一份合同，律师会累垮，出事时也没法快速处理。行业的办法是：每个对手方只签一份主协议，之后每笔交易都按它执行。回购用 <strong>GMRA<\/strong>，证券借贷用 <strong>GMSLA<\/strong>。<\/p>\n<\/div>\n\n<h2>两份主协议<\/h2>\n<div class=\"tbl\"><table>\n<tr><th><\/th><th>GMRA<\/th><th>GMSLA<\/th><\/tr>\n<tr><td>全称<\/td><td>Global Master Repurchase Agreement<\/td><td>Global Master Securities Lending Agreement<\/td><\/tr>\n<tr><td>适用<\/td><td>回购、逆回购<\/td><td>证券借贷<\/td><\/tr>\n<tr><td>发布机构<\/td><td>国际资本市场协会（ICMA）、SIFMA<\/td><td>国际证券借贷协会（ISLA）<\/td><\/tr>\n<tr><td>常用法律<\/td><td>英国法<\/td><td>英国法<\/td><\/tr>\n<\/table><\/div>\n<p>美国市场还有本地的版本，比如回购的 MRA、证券借贷的 MSLA。<\/p>\n\n<h2>主协议里写了什么<\/h2>\n<ul>\n<li><strong>交易如何确认<\/strong>：每笔交易的条款通过确认书补充。<\/li>\n<li><strong>保证金<\/strong>：每天盯市、追加和退还的规则，最低转移金额。<\/li>\n<li><strong>替代支付<\/strong>：借出期间的利息和分红如何补偿。<\/li>\n<li><strong>违约事件<\/strong>：什么情况算违约，比如不付款、不交付、破产。<\/li>\n<li><strong>终止与净额结算<\/strong>：一方违约时，所有交易一起终止，按市价计算各自价值后互相抵销，只结算一个净额。<\/li>\n<\/ul>\n\n<h2>净额结算为什么重要<\/h2>\n<p>假设你和某家银行有 100 笔交易，有的你欠它、有的它欠你。如果它破产时只能一笔一笔算，你欠它的要全额付，它欠你的只能排队拿一部分，损失会很大。净额结算（close-out netting）让所有交易合并成一个净额，大大降低了风险。各国律师每年会出具法律意见，确认这种净额结算在当地破产法下有效，这也是银行能按净额计算资本的前提。<\/p>\n\n<div class=\"desk\">\n<p>法务和信用风险部门维护每个对手方的协议状态：签的是哪个版本、有什么修改、法律意见是否覆盖该对手方所在国家。没有有效主协议或净额结算不被认可的对手方，风险要按总额计算，限额也会更紧。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>雷曼兄弟 2008 年破产后，大量回购和证券借贷对手方依据 GMRA 和 GMSLA 宣布违约、终止交易、计算净额。这次大规模的实际“压力测试”暴露了一些问题，比如违约后估值方法的争议、时间要求过紧等。2010 年发布的新版 GMSLA 和 2011 年的新版 GMRA 吸收了这些教训，修订了违约后的估值和处置条款。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>回购用 GMRA，证券借贷用 GMSLA，每个对手方签一份主协议，之后每笔交易按它执行。<\/li>\n<li>主协议规定了确认、保证金、替代支付、违约事件和终止净额结算。<\/li>\n<li>净额结算大大降低风险，它在各国是否有效需要法律意见确认。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>你和一家外国对手方有大量回购交易，但律师说该国破产法可能不承认净额结算。这对风险管理意味着什么？<\/summary>\n<div><p>万一对手方破产，你可能要全额履行欠它的部分，而它欠你的只能按破产程序分配。风险要按总敞口而不是净额计算，监管资本也要按总额计提。应对方式包括：降低限额、要求更多抵押品、尽量用集中清算或三方结构，甚至不和这类对手方交易。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-14\"><\/a><\/li>\n<li><a href=\"#L10-15\"><\/a><\/li>\n<li><a href=\"#L17-26\"><\/a><\/li>\n<\/ul><\/div>\n","10.22":"<div class=\"scene\">\n<p>一家银行借钱给另一家银行做回购，对方拿来的抵押品，是它自己发行的债券。平时没什么问题，可一旦对方出事，它的债券也会同时暴跌。你需要抵押品的那一刻，正是抵押品最不值钱的时候。这就是<strong>错向风险（wrong-way risk）<\/strong>。<\/p>\n<\/div>\n\n<h2>错向风险：坏事一起发生<\/h2>\n<p>错向风险是指：对手方违约的可能性，和你对它的敞口（或抵押品价值）不利地联动。常见的几种：<\/p>\n<ul>\n<li><strong>自己的证券作抵押<\/strong>：对手方用自己或关联公司发的债券、股票作抵押。<\/li>\n<li><strong>同一国家<\/strong>：一家意大利银行用意大利国债作抵押，意大利出问题时两者一起变差。<\/li>\n<li><strong>同一行业<\/strong>：一家石油贸易商用石油公司的债券作抵押。<\/li>\n<li><strong>借出的证券和借入方相关<\/strong>：借给一家银行的是另一家同类银行的股票。<\/li>\n<\/ul>\n<p>反过来，对手方信用变差时你的敞口反而下降，叫正向风险（right-way risk）。<\/p>\n\n<h2>集中度：鸡蛋放在一个篮子里<\/h2>\n<p>集中度风险是指过多的敞口或抵押品集中在少数几个地方：<\/p>\n<ul>\n<li>对手方集中：一大半回购融资来自三家对手方。<\/li>\n<li>抵押品集中：收到的抵押品大部分是同一个发行人的债券。<\/li>\n<li>证券集中：借出的证券集中在几只特殊券上。<\/li>\n<\/ul>\n<p>集中度本身不一定出事，但一旦出事，损失就会很大，也更难处置。<\/p>\n\n<h2>怎么管<\/h2>\n<ul>\n<li>合格抵押品的标准里，排除对手方自己或关联方发行的证券。<\/li>\n<li>对有错向风险的抵押品提高折扣，或设单独上限。<\/li>\n<li>按对手方、发行人、国家、行业设集中度限额。<\/li>\n<li>压力测试时，假设对手方违约和抵押品下跌同时发生。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>风控的抵押品报告会列出：每个对手方给的抵押品按发行人、国家、评级、行业的分布；有没有“自我抵押”；前十大发行人占比。监管规则（如巴塞尔对交易对手风险的要求）也要求银行识别和管理特定的错向风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2011–2012 年欧债危机期间，很多欧洲银行在回购中使用本国的国债作为抵押品，而这些银行自身又大量持有本国国债。一旦国债被抛售，银行的抵押品价值和自身的信用同时恶化，清算所和对手方纷纷提高这些国债的折扣，银行的融资能力进一步下降。这种“银行和主权的恶性循环”（doom loop）是错向风险在系统层面的体现。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>错向风险是对手方违约和敞口或抵押品价值不利联动，坏事一起发生。<\/li>\n<li>集中度风险是敞口或抵押品过度集中在少数对手方、发行人或证券上。<\/li>\n<li>用排除自我抵押、提高折扣、集中度限额和联动压力测试来管理。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家对冲基金借入大量某只银行股做空，交的抵押品是另一家同类银行的债券。从出借方的角度，这里有没有错向风险？<\/summary>\n<div><p>有。如果银行业出事，银行股和银行债一起下跌：借出的股票下跌对出借方有利，但抵押品（银行债）也在下跌；更关键的是，如果危机让对冲基金违约，出借方手里的抵押品恰好是在危机中最难卖、价值最低的银行债。抵押品和市场压力高度相关，应提高折扣或要求不同类型的抵押品。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-6\"><\/a><\/li>\n<li><a href=\"#L10-15\"><\/a><\/li>\n<li><a href=\"#L24-12\"><\/a><\/li>\n<\/ul><\/div>\n","10.23":"<div class=\"scene\">\n<p>2008 年金融危机后，监管机构发现一个盲区：回购和证券借贷每天有数万亿美元在流动，却没有人能看到全貌。谁借给了谁、用什么抵押、杠杆有多高，都是一片模糊。于是有了两类要求：<strong>报告<\/strong>，让监管者看得见；<strong>资本<\/strong>，让银行为这些交易留足缓冲。<\/p>\n<\/div>\n\n<h2>报告：SFTR<\/h2>\n<p>欧盟的《证券融资交易监管条例》（Securities Financing Transactions Regulation，SFTR）要求，在欧盟的交易方把回购、证券借贷、买入卖回、保证金贷款等证券融资交易（SFT）报告给交易报告库，从 2020 年起分阶段实施。每笔交易要报上百个字段，包括：<\/p>\n<ul>\n<li>双方身份（用 LEI 识别）。<\/li>\n<li>交易的证券、期限、利率或费率。<\/li>\n<li>抵押品的明细、折扣，以及现金抵押的再投资情况。<\/li>\n<li>每天的估值和保证金变化。<\/li>\n<\/ul>\n<p>美国也在推进类似要求，例如美国金融研究办公室（OFR）收集非集中清算的双边回购数据，美国证监会对证券借贷的报告规则也在实施中。<\/p>\n\n<h2>资本：银行要为证券融资留多少缓冲<\/h2>\n<p>在巴塞尔框架下，银行做回购和证券借贷，要为以下风险计提资本：<\/p>\n<ul>\n<li><strong>交易对手信用风险<\/strong>：按敞口减去抵押品（考虑折扣）后的净额计算，抵押品质量越好、净额结算越有效，资本越少。<\/li>\n<li><strong>杠杆率<\/strong>：杠杆率要求按交易的总规模计入，不论风险多低，都占用资产负债表。这让低利润的回购业务成本上升。<\/li>\n<li><strong>流动性指标<\/strong>：短期回购融资在流动性覆盖率（LCR）和净稳定资金比例（NSFR）里有不同的折算系数。<\/li>\n<\/ul>\n<p>金融稳定理事会还为非集中清算的证券融资交易设定了最低折扣标准，防止在平静时期折扣被压得过低。<\/p>\n\n<div class=\"desk\">\n<p>SFTR 报告的难点是数据：上百个字段来自交易、抵押品、结算、参考数据等多个系统，任何一个环节出错，都会导致报告被拒或数据不一致。运营和合规团队每天要处理被拒的报告、与对手方核对数据（双方都要报告，需要配对）。资本方面，资金部和风控会测算每个业务、每个对手方占用的资本和杠杆，用来定价和分配资产负债表。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>英国和欧洲银行在季末前后，常常缩减回购等资产负债表业务，以改善季末报告的杠杆率，这种现象叫“季末粉饰”（window dressing）。结果是每到季末，欧元和美元回购利率往往会出现跳升。监管机构多次批评这种做法，并推动用日均值而不是季末值来计算杠杆率。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>SFTR 要求欧盟的回购和证券借贷交易逐笔报告到交易报告库，字段多、配对难。<\/li>\n<li>银行要为证券融资计提交易对手风险资本，并受杠杆率和流动性指标约束。<\/li>\n<li>杠杆率等要求影响回购业务的成本，季末效应就是这些约束的体现。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么同样是一笔几乎没有风险的国债回购，在杠杆率要求下仍然“占用”银行的资本？<\/summary>\n<div><p>因为杠杆率是按总资产规模计算的，不看风险高低，目的是限制银行的整体扩张，防止风险模型低估风险。一笔国债回购会增加银行的资产负债表规模，就要相应占用杠杆率下的资本。这也是为什么净额结算和集中清算对回购业务这么重要：它们可以减少计入杠杆率的规模。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-14\"><\/a><\/li>\n<li><a href=\"#L10-5\"><\/a><\/li>\n<li><a href=\"#L6-41\"><\/a><\/li>\n<\/ul><\/div>\n","10.24":"<div class=\"scene\">\n<p>一家对冲基金刚刚成立，有 10 亿美元资本。它需要：一个地方存放证券、有人帮它借券做空、有人借钱给它加杠杆、有人帮它结算交易、给它出报告。它不会去找十家机构，而是找一家投资银行，全部打包解决。这项服务叫<strong>主经纪业务（prime brokerage）<\/strong>。<\/p>\n<\/div>\n\n<h2>主经纪商提供什么<\/h2>\n<ul>\n<li><strong>融资（financing）<\/strong>：借钱给对冲基金买入证券，用这些证券作抵押，叫保证金融资。<\/li>\n<li><strong>借券（securities lending）<\/strong>：为做空提供证券，主经纪商再从代理出借人那里借来。<\/li>\n<li><strong>托管和结算<\/strong>：保管基金的证券，处理交易的清算和结算。<\/li>\n<li><strong>报告<\/strong>：每天提供持仓、损益、风险和保证金报告。<\/li>\n<li><strong>其他服务<\/strong>：引荐投资者（capital introduction）、办公场地、技术支持等。<\/li>\n<\/ul>\n<p>主经纪商的收入来自融资利息、借券费的差价，以及交易佣金。股票互换等合成融资（synthetic financing）也常由主经纪商或其关联台提供。<\/p>\n\n<h2>保证金：主经纪商的风险控制<\/h2>\n<p>主经纪商按对冲基金的整个组合计算保证金：杠杆越高、集中度越高、流动性越差，要求的保证金越多。很多主经纪商使用组合保证金（portfolio margining）：多空仓位互相抵消的部分，可以少交保证金。<\/p>\n<p>保证金规则是主经纪商控制风险的核心，也是竞争的焦点：给得越宽松，越能吸引客户，但风险也越大。<\/p>\n\n<h2>对冲基金也承担风险<\/h2>\n<p>对冲基金把证券放在主经纪商那里，主经纪商可以在一定额度内把这些证券再拿去借出或回购，叫再抵押（rehypothecation）。如果主经纪商破产，这些证券可能拿不回来。所以大的对冲基金通常同时使用几家主经纪商，分散风险。<\/p>\n\n<div class=\"desk\">\n<p>主经纪业务的风控关注每个客户的总杠杆、对单一证券的集中度、在压力情景下
