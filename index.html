的潜在损失（比如股价单日下跌 20% 时，保证金是否足够），以及同一客户在其他银行可能存在的类似仓位。客户违约时，要在很短时间内平掉仓位，平仓的顺序和速度决定损失大小。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2008 年雷曼兄弟和 2021 年 Archegos。<\/strong>雷曼破产时，在它的英国主经纪业务里有数百亿美元的客户资产被冻结，很多对冲基金多年后才拿回部分资产，此后对冲基金普遍分散使用多家主经纪商，并限制再抵押。2021 年 Archegos 违约，则是反过来让主经纪商蒙受巨额损失：瑞信在这项业务上亏损约 55 亿美元，成为它后来走向崩溃的重要一环。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>主经纪商为对冲基金提供融资、借券、托管结算和报告的一站式服务。<\/li>\n<li>它通过组合保证金控制风险，保证金的松紧是竞争和风险的平衡。<\/li>\n<li>对冲基金面临主经纪商破产和再抵押的风险，主经纪商面临客户违约的风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家主经纪商发现，它的一个大客户在它这里的杠杆是 4 倍，但市场传言这个客户在其他银行也有同样的仓位。主经纪商该怎么做？<\/summary>\n<div><p>主动询问客户在其他银行的总敞口，要求提供信息；如果客户不提供或者整体杠杆过高，提高保证金比例、限制新增仓位，特别是集中的单一股票仓位。还要预先制定违约时的平仓方案，因为一旦出事，多家银行会同时抛售同样的股票。Archegos 事件之后，各家银行普遍加强了这类信息要求。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-11\"><\/a><\/li>\n<li><a href=\"#L16-10\"><\/a><\/li>\n<li><a href=\"#L20-1\"><\/a><\/li>\n<\/ul><\/div>\n","10.25":"<div class=\"scene\">\n<p>一家银行手里有各种各样的资产：国债、公司债、股票、证券化产品。每天它要给几十个对手方、几个清算所交抵押品，每个对象接受的种类、折扣都不一样。哪项资产交给谁，最划算？这是一道每天都要做的优化题，叫<strong>抵押品优化（collateral optimisation）<\/strong>。<\/p>\n<\/div>\n\n<h2>抵押品优化：把对的资产放在对的地方<\/h2>\n<p>基本原则：<\/p>\n<ul>\n<li><strong>最便宜的先交<\/strong>：把对自己最没用、但对方能接受的资产交出去，留下最有用的（比如国债可以用来回购融资）。<\/li>\n<li><strong>考虑折扣<\/strong>：同一项资产在不同地方的折扣不同，交到折扣最低的地方效率最高。<\/li>\n<li><strong>考虑机会成本<\/strong>：特殊券留着可以借出赚钱，交出去作抵押就浪费了。<\/li>\n<li><strong>考虑集中度和合规<\/strong>：遵守对方的集中度限制和自己的监管要求。<\/li>\n<\/ul>\n<p>大银行用专门的系统，每天在所有资产和所有需求之间做匹配，叫“最便宜交付”（cheapest-to-deliver）抵押品分配。<\/p>\n\n<h2>抵押品转换：把差的变成好的<\/h2>\n<p>抵押品转换（collateral transformation，也叫 collateral upgrade）是：用较差的资产（比如公司债、股票）作抵押，从别人那里借入优质资产（比如国债），再把国债拿去交保证金或做回购。<\/p>\n<p>2008 年后，场外衍生品集中清算和保证金要求大增，清算所只接受现金和高质量债券。很多养老金、保险公司手里没有足够的合格资产，就通过银行做抵押品转换。银行从中收取费用，相当于把自己的资产负债表“租”出去。<\/p>\n\n<h2>风险<\/h2>\n<ul>\n<li><strong>流动性风险<\/strong>：转换来的优质资产需要定期归还或续做，市场紧张时可能续不上。<\/li>\n<li><strong>错向风险<\/strong>：收到的较差抵押品在危机中会大幅贬值。<\/li>\n<li><strong>系统性风险<\/strong>：优质资产被层层借用、再抵押，危机时连锁收紧。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>资金部和抵押品管理团队每天的工作之一，就是看全行的抵押品“库存”：哪些资产被占用、哪些是自由的、哪些可以拿去融资。风控关注抵押品转换业务的期限错配：给客户的是长期限的转换，自己续借的是短期限的。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年 9 月英国 LDI 危机中，很多养老金需要在短时间内拿出大量现金交保证金。它们手里大多是长期国债和其他资产，而不是现金，只能紧急卖出国债或者通过回购换取现金。因为大家同时这样做，国债价格下跌，回购和抵押品转换的成本也跟着上升。这次事件让监管机构要求 LDI 基金保持更多的流动性缓冲。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>抵押品优化是每天把合适的资产分配到合适的抵押需求，交最便宜的、留最有用的。<\/li>\n<li>抵押品转换是用较差资产换入优质资产，满足清算所和保证金要求。<\/li>\n<li>转换带来期限错配、错向和系统性风险，危机时会集中暴露。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行手里有一只国债特殊券，也有大量普通国债。一个清算所要求交 1 亿美元国债作保证金。银行该交哪个？<\/summary>\n<div><p>交普通国债，把特殊券留着。特殊券可以在证券借贷或特殊回购里赚到额外的收益，而清算所只关心是不是合格的国债，不会因为是特殊券多给好处。把它交出去作保证金，等于放弃了这部分收益。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-13\"><\/a><\/li>\n<li><a href=\"#L10-22\"><\/a><\/li>\n<li><a href=\"#L17-27\"><\/a><\/li>\n<\/ul><\/div>\n","10.26":"<div class=\"scene\">\n<p>2019 年 9 月的一个早上，美国隔夜回购利率突然从 2% 出头冲到 5% 以上。美联储当天上午就宣布：它要亲自下场，通过回购向市场注入资金。央行不只是在会议上定利率，它还每天在回购市场里操作，确保利率真的停在目标附近。<\/p>\n<\/div>\n\n<h2>央行为什么要做回购<\/h2>\n<p>央行设定政策利率后，要让市场上的短期利率真的落在目标区间里。回购是它最常用的工具之一：<\/p>\n<ul>\n<li><strong>央行做回购（向市场借出现金、收进国债作抵押）<\/strong>：向银行体系注入流动性，压低短期利率。<\/li>\n<li><strong>央行做逆回购（从市场借入现金、交出国债）<\/strong>：从体系中吸走流动性，托住短期利率不往下掉。<\/li>\n<\/ul>\n<p>注意方向：从央行角度描述和从市场角度描述，正好相反。美联储的“逆回购便利”（ON RRP），是货币基金把现金借给美联储。<\/p>\n\n<h2>常备回购便利：随叫随到的“安全阀”<\/h2>\n<p>2019 年那次利率飙升后，美联储在 2021 年设立了常备回购便利（Standing Repo Facility，SRF）：符合条件的机构可以随时用国债和机构债作抵押，按预先设定的利率向美联储借钱。它给回购利率设了一个“天花板”：市场利率高于这个水平，大家就会转向美联储借。<\/p>\n<p>与之对应，逆回购便利给利率设了一个“地板”：货币基金宁可把钱放在美联储，也不会以更低的利率借给别人。<\/p>\n<p>其他央行也有类似安排：欧洲央行的主要再融资操作和常备便利，英格兰银行的短期回购和常备工具，中国人民银行的逆回购（向市场注入资金）和 MLF 等。<\/p>\n\n<div class=\"desk\">\n<p>回购交易台和资金部会盯着央行的这些操作：常备便利的使用量、逆回购的规模、准备金的变化。逆回购便利的余额大幅下降、常备回购便利开始被频繁使用，常被看作银行体系的流动性正在变紧的信号。季末、税期、国债集中结算日，这些信号尤其重要。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2019 年 9 月 16 日和 17 日，美国企业缴税和国债集中结算叠加，银行体系准备金骤降，SOFR 一度升到 5.25%。美联储从 9 月 17 日起连续进行隔夜和定期回购操作，并在 10 月开始买入短期国债补充准备金。这次事件说明：在美联储缩表、准备金减少之后，回购市场比预想的更脆弱，也直接促成了常备回购便利的设立。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>央行用回购和逆回购向市场注入或收回流动性，把短期利率控制在目标附近。<\/li>\n<li>常备回购便利像利率的“天花板”，逆回购便利像“地板”。<\/li>\n<li>这些工具的使用量是观察银行体系流动性松紧的重要指标。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>美联储逆回购便利的余额从 2 万亿美元降到接近零，同时回购利率开始在季末明显上升。这说明什么？<\/summary>\n<div><p>说明金融体系里的多余现金正在减少：货币基金不再有大量闲钱放在美联储，而是被吸收到市场里（比如购买新发行的国债）。流动性缓冲变薄后，季末这种需求集中的时点更容易出现利率跳升。这时常备回购便利可能被更多使用，美联储也可能调整缩表的节奏。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-4\"><\/a><\/li>\n<li><a href=\"#L7-12\"><\/a><\/li>\n<li><a href=\"#L7-11\"><\/a><\/li>\n<\/ul><\/div>\n","11.1":"<div class=\"scene\">\n<p>一家银行发放了 1 万笔房贷，每笔 30 年。银行收到的是一张张 30 年的借条，钱却要等几十年才能慢慢收回。与此同时，新的购房者还在排队等贷款。银行手里的钱和资本都被老贷款占住了。怎么办？把这些贷款打包卖给愿意长期持有的投资者，拿回现金，再去放新的贷款。这就是<strong>证券化（securitization）<\/strong>的起点。<\/p>\n<\/div>\n\n<h2>传统银行：发放并持有<\/h2>\n<p>传统银行的做法是“发放并持有”（originate-to-hold）：吸收存款，发放贷款，一直持有到贷款还清。这样做有三个限制：<\/p>\n<ul>\n<li><strong>资金被占住<\/strong>：贷款期限长，存款期限短，银行能放的贷款受限于存款规模。<\/li>\n<li><strong>资本被占住<\/strong>：每笔贷款都要按监管要求配置资本，资本用完了就放不了新贷款。<\/li>\n<li><strong>风险集中<\/strong>：一家地方银行的贷款都集中在同一地区，当地经济出问题，银行会一起受损。<\/li>\n<\/ul>\n\n<h2>证券化：发放后再分销<\/h2>\n<p>证券化让银行改成“发放后分销”（originate-to-distribute）：把一批贷款卖给一个专门设立的实体，这个实体以贷款的未来还款为支持，发行债券卖给投资者。对各方来说：<\/p>\n<ul>\n<li><strong>银行<\/strong>：拿回现金，释放资本，转出风险，还能继续收取管理贷款的服务费。<\/li>\n<li><strong>投资者<\/strong>：买到期限和风险各不相同的债券，比如养老金买长期、低风险的部分，对冲基金买高风险、高收益的部分。<\/li>\n<li><strong>借款人<\/strong>：信贷供给增加，借钱更容易、利率更低。<\/li>\n<\/ul>\n<p>今天被证券化的资产很广：房贷、商业地产贷款、车贷、信用卡、学生贷款、企业杠杆贷款，甚至飞机租赁和音乐版权收入。<\/p>\n\n<div class=\"desk\">\n<p>银行内部，证券化团队（securitization 或 structured finance）负责把贷款组合设计成债券；资金部看它作为融资渠道的成本；风控和资本管理团队关心风险是否真的转出去了、能释放多少资本。评级机构、律师、会计师和受托人也都参与其中。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1970 年，美国政府国民抵押贷款协会（Ginnie Mae）担保发行了第一只现代意义的住房抵押贷款转手证券（pass-through）。1980 年代，所罗门兄弟的交易员刘易斯·拉涅里（Lewis Ranieri）大力推动抵押贷款证券市场，常被称为“证券化之父”。此后几十年，美国住房抵押贷款证券发展成规模以万亿美元计的市场。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>证券化把一批贷款打包，以未来还款为支持发行债券卖给投资者。<\/li>\n<li>银行由此拿回现金、释放资本、转出风险，从“发放并持有”变成“发放后分销”。<\/li>\n<li>它的代价是：发放贷款的人不再承担全部风险，可能放松审核，这正是 2008 年的问题之一。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>如果银行发放贷款后马上全部卖掉，它还有多大动力认真审核借款人？监管后来想了什么办法？<\/summary>\n<div><p>动力会明显下降：坏账风险已经转给了投资者，银行赚的是发放和卖出的费用，放得越多赚得越多。2008 年后，美国和欧盟都引入了风险自留（risk retention）规则，要求发起人保留一部分风险，通常是 5%，让它“利益共担”（skin in the game）。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-2\"><\/a><\/li>\n<li><a href=\"#L11-21\"><\/a><\/li>\n<li><a href=\"#L6-29\"><\/a><\/li>\n<\/ul><\/div>\n","11.2":"<div class=\"scene\">\n<p>投资者买了一只以房贷为支持的债券。几年后，发放这些房贷的银行破产了。投资者最担心的是：银行的债权人会不会来抢这些房贷？证券化的整个设计，就是要确保答案是“不会”。关键在两个概念：<strong>资产池（asset pool）<\/strong>和<strong>特殊目的载体（special purpose vehicle，SPV）<\/strong>。<\/p>\n<\/div>\n\n<h2>资产池：挑出一批贷款<\/h2>\n<p>发起人（originator）先从自己的贷款中挑出一批，组成资产池。挑选要符合事先约定的标准（eligibility criteria），比如贷款金额、借款人信用分、地区分布、贷款成数（LTV）。投资者看的就是这个池子的特征：平均利率、平均期限、分散程度、历史违约率。<\/p>\n\n<h2>SPV：一个只为这件事存在的公司<\/h2>\n<p>资产池会被卖给一个新设立的 SPV。SPV 通常是一个信托或有限公司，没有员工，只做一件事：持有这些资产，发行债券，把收到的钱付给投资者。它的设计有几个要点：<\/p>\n<ul>\n<li><strong>真实出售（true sale）<\/strong>：资产在法律上真正卖给了 SPV，发起人破产时，它的债权人追索不到这些资产。<\/li>\n<li><strong>破产隔离（bankruptcy remote）<\/strong>：SPV 自己不做其他业务、不借其他债，几乎不可能因为别的原因破产。<\/li>\n<li><strong>独立管理<\/strong>：受托人（trustee）代表投资者监督，服务商（servicer）负责收款和催收。<\/li>\n<\/ul>\n<p>这样，投资者承担的是资产池本身的风险，而不是发起银行的信用风险。<\/p>\n\n<div class=\"desk\">\n<p>交易中，律师要出具“真实出售”和“不合并”法律意见，会计师判断发起人是否可以把资产移出资产负债表（出表），风控要确认风险是否真正转移。2008 年后会计准则收紧，很多发起人仍保留控制权的 SPV 需要并表，出表变得更难。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2001 年安然公司破产，暴露了 SPV 的另一面：安然用大量特殊目的实体隐藏债务、制造利润，其中很多由公司高管控制，并非真正独立。投资者看到的资产负债表远比实际健康。安然事件后，美国出台了萨班斯-奥克斯利法案，会计准则也收紧了对 SPV 并表的要求。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>证券化先挑出一批符合标准的贷款组成资产池。<\/li>\n<li>资产池真实出售给一个破产隔离的 SPV，由它发行债券，投资者只承担资产池的风险。<\/li>\n<li>SPV 也可能被滥用来隐藏债务，因此会计和监管对出表和并表有严格要求。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>如果法院后来认定资产转给 SPV 并非“真实出售”，而是一笔以资产为抵押的借款，对投资者有什么影响？<\/summary>\n<div><p>那么资产在法律上仍属于发起人，发起人破产时，投资者只是众多有担保债权人之一，回收可能被拖延或减少。整个证券化“只看资产池、不看发起人”的基础就动摇了。所以法律意见和交易结构的设计非常关键。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-1\"><\/a><\/li>\n<li><a href=\"#L11-14\"><\/a><\/li>\n<li><a href=\"#L11-3\"><\/a><\/li>\n<\/ul><\/div>\n","11.3":"<div class=\"scene\">\n<p>同一个房贷池，养老金只想买“几乎不会亏”的部分，对冲基金想买“风险大但收益高”的部分。SPV 不是只发一种债券，而是发好几层。损失先由最下面的一层承担，吃完了再轮到上一层。这就是<strong>分层（tranching）<\/strong>：把同一堆风险切成不同风险等级的产品。<\/p>\n<\/div>\n\n<h2>三个层级<\/h2>\n<ul>\n<li><strong>优先级（senior）<\/strong>：最后承担损失、最先拿回本金，通常占池子的大部分，评级最高，可以是 AAA，利率最低。<\/li>\n<li><strong>夹层（mezzanine）<\/strong>：在优先级之下，评级通常在 AA 到 BBB 之间，利率更高。<\/li>\n<li><strong>权益级（equity，也叫首损层 first loss）<\/strong>：最先承担损失，通常没有评级，收益最不确定，可能很高也可能归零。发起人常常自己持有这一部分。<\/li>\n<\/ul>\n\n<h2>信用增级：让优先级更安全<\/h2>\n<p>优先级之所以安全，是因为它下面有“垫子”。这些垫子叫信用增级（credit enhancement）：<\/p>\n<ul>\n<li><strong>次级支持（subordination）<\/strong>：下面各层的本金，就是上面各层的缓冲。<\/li>\n<li><strong>超额抵押（overcollateralization）<\/strong>：资产池的总额大于发行的债券总额。<\/li>\n<li><strong>超额利差（excess spread）<\/strong>：贷款收到的利息高于付给投资者的利息，多出来的部分先用来弥补损失。<\/li>\n<li><strong>储备金账户（reserve account）<\/strong>：预留的一笔现金，在需要时动用。<\/li>\n<\/ul>\n<p>优先级要拿到 AAA，评级机构会要求足够厚的垫子，比如池子损失 20% 也碰不到它。<\/p>\n\n<div class=\"desk\">\n<p>投资者分析一层债券，最先看的是它的“附着点”和“分离点”（attachment / detachment point）：资产池损失到多少开始亏这一层、亏到多少这一层归零。再结合对资产池损失的预测，判断这一层的风险有多大。同样是 AAA，垫子厚度和资产质量可能差别很大。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机调查委员会（FCIC）的报告指出：穆迪在 2006 年给予 AAA 评级的抵押贷款证券中，最终有 83% 被降级。原因是房价全国性下跌，违约率远超评级模型的假设，原本看起来很厚的垫子被迅速消耗。分层本身没有消除风险，只是重新分配了风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>分层把同一资产池切成优先级、夹层和权益级，损失从下往上依次承担。<\/li>\n<li>优先级的安全来自信用增级：次级支持、超额抵押、超额利差和储备金。<\/li>\n<li>分层只是重新分配风险；如果对资产池损失的假设错了，优先级也会受损。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同一个资产池，分层后各层价值加起来，应该大于、等于还是小于资产池本身的价值？为什么银行还要分层？<\/summary>\n<div><p>理论上，在完美市场里应该相等，分层只是重新切分现金流。现实中银行愿意分层，是因为不同投资者有不同需求和监管限制：很多机构只能买高评级债券，愿意为 AAA 付出更高价格。满足这些需求，各层卖出的总价可能高于整体出售，这部分差价就是分层创造的“价值”，也是发起人的动力之一。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-4\"><\/a><\/li>\n<li><a href=\"#L11-18\"><\/a><\/li>\n<li><a href=\"#L16-37\"><\/a><\/li>\n<\/ul><\/div>\n","11.4":"<div class=\"scene\">\n<p>每个月，房贷池里的借款人还款进来：有利息，有本金，有提前还款，也有一些人违约后通过拍卖房子回收的钱。这些钱进入 SPV 后，按照一份事先写好的顺序表逐级分配：先付谁、后付谁、什么情况下顺序要改。这张顺序表叫<strong>现金流瀑布（cash flow waterfall）<\/strong>：钱像水一样从上往下流，上面的池子满了才流到下面。<\/p>\n<\/div>\n\n<h2>钱按什么顺序分<\/h2>\n<p>一个典型的瀑布大致是这样：<\/p>\n<ol>\n<li><strong>费用<\/strong>：先付受托人、服务商等各方的费用。<\/li>\n<li><strong>利息<\/strong>：按优先级从高到低，依次付各层的利息。<\/li>\n<li><strong>弥补损失<\/strong>：用剩余的利息弥补当期违约造成的本金损失。<\/li>\n<li><strong>本金<\/strong>：按规定方式偿还各层本金。<\/li>\n<li><strong>剩余<\/strong>：所有义务都付完后剩下的钱，归权益级。<\/li>\n<\/ol>\n<p>很多交易把利息和本金分成两个瀑布分别分配。<\/p>\n\n<h2>本金怎么还：顺序还是按比例<\/h2>\n<ul>\n<li><strong>顺序偿还（sequential）<\/strong>：先把优先级的本金全部还清，再还夹层，最后还权益级。对优先级最有利。<\/li>\n<li><strong>按比例偿还（pro rata）<\/strong>：各层按各自余额的比例同时还本金。对下面各层更有利。<\/li>\n<\/ul>\n<p>很多交易开始时先顺序偿还，资产表现良好、达到一定条件后再改为按比例偿还（叫 step-down）。<\/p>\n\n<h2>触发条件：情况变坏时改规则<\/h2>\n<p>瀑布里会写触发条件（trigger），比如违约率超过某个水平，或者抵押覆盖率低于某个水平。一旦触发，现金流就会改道：停止向下层分配，把钱全部用来偿还优先级。触发条件是保护优先级投资者的重要机制。<\/p>\n\n<div class=\"desk\">\n<p>分析一层债券的风险，离不开对瀑布的建模。投资者和交易员用 Intex 等专门软件，把交易文件里的瀑布写成模型，再输入不同的违约、回收和提前还款假设，算出每一层在每种情景下能收到多少钱。很多“看起来一样”的债券，因为瀑布条款不同，风险差别很大。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2007 年美国次级房贷违约率飙升，很多次贷 RMBS 的违约触发条件被触发，原本可能转为按比例偿还的交易继续顺序偿还，夹层和下层几乎收不到本金。对持有夹层的投资者，以及以这些夹层为资产再打包的 ABS CDO 来说，现金流迅速枯竭，价值大幅下跌。这让很多投资者意识到：读懂瀑布和触发条件，和看评级一样重要。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>现金流瀑布规定资产池收到的钱按什么顺序分配给各方。<\/li>\n<li>本金可以顺序偿还或按比例偿还，前者更保护优先级。<\/li>\n<li>触发条件在情况变坏时改变分配方式，把钱优先用来保护优先级。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>你持有一只交易的夹层。资产池违约率开始上升，接近触发条件。你最担心什么？<\/summary>\n<div><p>担心一旦触发，现金流全部转向优先级，你的本金偿还被暂停甚至长期收不到，即使资产池最终损失并没有大到吃掉你这一层。触发条件改变的是“什么时候收到钱”，对夹层的价值和流动性影响很大。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-3\"><\/a><\/li>\n<li><a href=\"#L11-19\"><\/a><\/li>\n<li><a href=\"#L11-18\"><\/a><\/li>\n<\/ul><\/div>\n","11.5":"<div class=\"scene\">\n<p>2020 年，美国 30 年期房贷利率跌到历史低点。几百万家庭纷纷把原来 4% 的房贷换成不到 3% 的新房贷。对这些家庭是好事；但对买了他们旧房贷证券的投资者来说，问题来了：本以为能收 30 年 4% 的利息，结果本金被提前还回来，只能以更低的利率再投资。这就是<strong>住房抵押贷款证券（residential mortgage-backed securities，RMBS）<\/strong>最特别的风险：<strong>提前还款（prepayment）<\/strong>。<\/p>\n<\/div>\n\n<h2>RMBS 是什么<\/h2>\n<p>RMBS 以一批住房抵押贷款为支持，借款人每月还的利息和本金，扣除费用后转给投资者。按有无政府相关机构担保，可以分为两类：<\/p>\n<ul>\n<li><strong>机构 MBS（agency MBS）<\/strong>：由美国的房利美、房地美或吉利美担保，投资者几乎不用担心违约，主要承担利率和提前还款风险。<\/li>\n<li><strong>非机构 RMBS（non-agency 或 private label）<\/strong>：没有政府相关担保，按借款人质量分为优质（prime）、次优（Alt-A）和次级（subprime），投资者还要承担信用风险。<\/li>\n<\/ul>\n<p>欧洲、英国和澳大利亚也有大量 RMBS，大多是非机构结构。<\/p>\n\n<h2>提前还款：借款人手里的期权<\/h2>\n<p>美国大多数房贷允许借款人随时提前还款，不收或很少收罚金。提前还款的原因很多：<\/p>\n<ul>\n<li><strong>再融资（refinancing）<\/strong>：利率下降时，换一笔更便宜的新贷款。这是最主要、也最难预测的原因。<\/li>\n<li><strong>搬家卖房<\/strong>：卖房时一次性还清贷款。<\/li>\n<li><strong>违约<\/strong>：违约后的回收对投资者来说也是一种提前回款。<\/li>\n<\/ul>\n<p>市场用年化的提前还款速度（CPR）描述提前还款快慢。利率下降，提前还款加快；利率上升，提前还款放慢。投资者等于卖出了一个“提前还款期权”给借款人，在利率对自己最不利的时候被行权。<\/p>\n\n<div class=\"desk\">\n<p>对 RMBS 投资者和交易员来说，提前还款模型是核心工具：它预测在不同利率、房价和借款人特征下，提前还款速度会是多少。久期和 DV01 都依赖这个模型，所以 MBS 的久期会随利率变化，被称为“有效久期”。风控报告里，MBS 的提前还款风险常单独列出。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>根据房地美的每周调查，美国 30 年期固定房贷平均利率在 2021 年 1 月降到约 2.65%，是有记录以来的最低点。2020–2021 年出现了历史性的再融资潮，机构 MBS 的提前还款速度大幅加快。随后 2022 年美联储快速加息，房贷利率在一年内升到 7% 左右，提前还款几乎停滞，MBS 的久期迅速拉长，持有者遭受了大幅的价格下跌。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>RMBS 以住房贷款为支持，分为有政府相关担保的机构 MBS 和没有担保的非机构 RMBS。<\/li>\n<li>借款人可以随时提前还款，利率下降时提前还款加快，相当于投资者卖出了一个期权。<\/li>\n<li>提前还款让 MBS 的久期随利率变化，需要用提前还款模型来估计风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>利率大幅上升时，持有机构 MBS 的投资者为什么会觉得“雪上加霜”？<\/summary>\n<div><p>利率上升本身就让债券价格下跌。与此同时，借款人不再提前还款，原本预计几年就能收回的本金要拖到更久，MBS 的久期变长，对利率更敏感，价格跌得更多。利率下降时则相反：提前还款加快，久期变短，价格涨不了多少。这就是负凸性。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-6\"><\/a><\/li>\n<li><a href=\"#L11-16\"><\/a><\/li>\n<li><a href=\"#L9-41\"><\/a><\/li>\n<\/ul><\/div>\n","11.6":"<div class=\"scene\">\n<p>美国每天有数千亿美元的住房抵押贷款证券在交易，但很多交易在成交时，双方并不知道具体会交割哪一批房贷。买方只约定了发行机构、票息、期限和交割月份，具体的资产池等到交割前两天才告诉买方。这种看起来奇怪的交易方式，叫做 <strong>TBA（to-be-announced）<\/strong>，它让机构 MBS 成为全世界流动性最好的债券市场之一。<\/p>\n<\/div>\n\n<h2>机构 MBS：有政府相关担保的 MBS<\/h2>\n<p>美国有三家机构为房贷证券提供担保：<\/p>\n<ul>\n<li><strong>吉利美（Ginnie Mae）<\/strong>：政府机构，担保有政府保险的房贷，享有美国政府的完全信用担保。<\/li>\n<li><strong>房利美（Fannie Mae）和房地美（Freddie Mac）<\/strong>：政府支持企业（GSE），购买符合标准的房贷并打包担保。2008 年起由政府接管，市场普遍视为隐性政府担保。<\/li>\n<\/ul>\n<p>因为有担保，投资者主要承担利率风险和提前还款风险，信用风险很小。机构 MBS 是美国规模最大的债券市场之一。<\/p>\n\n<h2>TBA：先交易，后指定资产池<\/h2>\n<p>TBA 是一种远期交易：双方约定发行机构、票息（比如 5%）、期限（比如 30 年）、价格、面值和交割日期。交割前两天，卖方才通知具体交割哪些资产池，只要符合统一的标准就行。<\/p>\n<ul>\n<li><strong>好处<\/strong>：成千上万个不同的资产池被归为少数几个标准化合约，流动性集中，交易成本很低。房贷机构可以在发放贷款前就用 TBA 锁定卖出价格。<\/li>\n<li><strong>最便宜交割<\/strong>：卖方会交割最不值钱的资产池，类似国债期货。所以 TBA 价格反映的是“最差”资产池的价值。<\/li>\n<li><strong>指定资产池（specified pools）<\/strong>：提前还款速度较慢的资产池（比如小额贷款、特定地区）价值更高，会以高于 TBA 的价格单独交易。<\/li>\n<\/ul>\n<p>市场还常做美元滚动（dollar roll）：卖出近月 TBA、买入远月 TBA，相当于一种以 MBS 为抵押的融资。<\/p>\n\n<div class=\"desk\">\n<p>银行和资管的 MBS 交易台主要通过 TBA 管理利率风险和流动性。风控关注的是 TBA 头寸的 DV01、提前还款风险，以及美元滚动的隐含融资利率。过去 TBA 交易常常不交换保证金；2010 年代起，美国的行业惯例和监管规则逐步要求双方交换保证金，以降低交易对手风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年 9 月，美国政府将房利美和房地美置于联邦住房金融局的接管（conservatorship）之下。同年 11 月，美联储宣布购买机构 MBS，第一轮量化宽松中共购买了 1.25 万亿美元。此后几轮量化宽松中美联储持续购买，一度持有超过 2.5 万亿美元的机构 MBS，成为这个市场上最大的单一投资者。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>机构 MBS 由吉利美、房利美和房地美担保，投资者主要承担利率和提前还款风险。<\/li>\n<li>TBA 先约定标准条款交易，交割前才指定资产池，大大提高了流动性。<\/li>\n<li>卖方会交割最便宜的资产池，提前还款较慢的指定资产池单独交易、价格更高。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家房贷公司今天承诺借款人 60 天后以 6.5% 的利率放款，然后打算把贷款卖给机构打包。它面临什么风险？怎样用 TBA 对冲？<\/summary>\n<div><p>如果 60 天内利率上升，这批贷款打包后的 MBS 价格会下跌，房贷公司卖出时会亏钱。它可以现在卖出对应票息、交割月份的 TBA，锁定卖出价格。利率上升时 TBA 空头赚钱，弥补贷款价值的下跌。还要注意部分借款人最终不提款的风险，这叫“管道风险”（pipeline risk）。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-5\"><\/a><\/li>\n<li><a href=\"#L11-7\"><\/a><\/li>\n<li><a href=\"#L9-43\"><\/a><\/li>\n<\/ul><\/div>\n","11.7":"<div class=\"scene\">\n<p>一只普通的 30 年期 MBS，本金什么时候还回来，谁也说不准：利率一降可能三年就还掉一大半，利率一升可能拖到二十年。一家货币基金只想要两三年就回本的产品，一家保险公司想要稳定的长期现金流，一个对冲基金愿意承担最不确定的部分。能不能把一只 MBS 的现金流重新切开，满足不同人的需要？答案是<strong>担保抵押贷款债券（collateralized mortgage obligation，CMO）<\/strong>。<\/p>\n<\/div>\n\n<h2>按顺序还本：顺序偿还层<\/h2>\n<p>最简单的 CMO 叫顺序偿还（sequential pay）结构。把一批 MBS 的现金流分成 A、B、C、D 几层：<\/p>\n<ul>\n<li>所有层都按各自余额收利息。<\/li>\n<li>所有本金，包括提前还款，先全部还给 A 层；A 层还清后，再还 B 层，依此类推。<\/li>\n<\/ul>\n<p>这样，A 层是短期债券，D 层是长期债券。和上一部讲的信用分层不同，这里的底层资产通常是机构 MBS，几乎没有信用风险，切分的是<strong>期限和提前还款风险<\/strong>。<\/p>\n\n<h2>更精细的切法<\/h2>\n<ul>\n<li><strong>计划摊还层（PAC，planned amortization class）<\/strong>：只要提前还款速度在一个区间内，就按事先定好的时间表还本金，现金流很稳定。<\/li>\n<li><strong>支持层（support 或 companion）<\/strong>：吸收 PAC 层不想要的波动。提前还款快时先多收本金，慢时少收，风险集中在这一层。<\/li>\n<li><strong>Z 层（accrual tranche）<\/strong>：前期不收利息，利息累积进本金，后期再一起还，类似零息债券。<\/li>\n<li><strong>浮动利率层和反向浮动利率层（floater / inverse floater）<\/strong>：把固定利息拆成一个随利率上升的层和一个随利率下降的层，后者对利率极其敏感。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>CMO 各层的风险差别非常大：PAC 层的久期相对稳定，支持层和反向浮动利率层的久期和价格可能剧烈波动。投资者和风控必须用提前还款模型在多种利率情景下测试每一层，而不是只看名义期限。很多监管规定也会对银行和保险公司持有的高风险 CMO 层设置限制。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1983 年 6 月，房地美在所罗门兄弟和第一波士顿的参与下发行了第一只 CMO。此后十年，CMO 市场迅速扩张，也出现了越来越复杂的高风险层。1994 年美联储意外加息，提前还款大幅放慢，支持层和反向浮动层价格暴跌。专门投资这类产品的阿斯金资本管理公司（Askin Capital Management）管理的约 6 亿美元基金在几周内几乎全部亏光并倒闭。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>CMO 把 MBS 的现金流重新切分，主要切分的是期限和提前还款风险，而非信用风险。<\/li>\n<li>顺序偿还层把本金按顺序分给各层，形成短、中、长期产品。<\/li>\n<li>PAC 层现金流稳定，支持层、Z 层和反向浮动层承担更多波动，需要仔细做情景测试。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个 CMO 的 PAC 层非常稳定。它的稳定是“凭空产生”的吗？代价由谁承担？<\/summary>\n<div><p>不是凭空产生的。资产池的总提前还款风险没有变，PAC 层的稳定是把波动转移给了支持层。提前还款快时，支持层先收到多出来的本金；慢时，支持层的本金推迟。所以支持层风险更高，通常收益也更高。提前还款速度一旦超出 PAC 的保护区间，PAC 层自己也会开始波动。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-6\"><\/a><\/li>\n<li><a href=\"#L11-15\"><\/a><\/li>\n<li><a href=\"#L11-17\"><\/a><\/li>\n<\/ul><\/div>\n","11.8":"<div class=\"scene\">\n<p>一栋写字楼、一家酒店、一座购物中心，各自都背着几千万甚至几亿美元的贷款。把几十笔这样的贷款放在一起打包，就是<strong>商业地产抵押贷款证券（commercial mortgage-backed securities，CMBS）<\/strong>。它和住房 RMBS 看起来相似，但风险完全是另一回事：池子里贷款少、单笔金额大，一栋楼出问题就会影响整只证券。<\/p>\n<\/div>\n\n<h2>和住房 RMBS 有什么不同<\/h2>\n<ul>\n<li><strong>贷款少而大<\/strong>：一个 CMBS 池通常只有几十到一百多笔贷款，最大的几笔可能占池子的一成以上，集中度高。<\/li>\n<li><strong>靠租金还款<\/strong>：还款来源是物业的租金收入，所以看的是物业的净运营收入（NOI）、出租率和债务偿付覆盖率（DSCR）。<\/li>\n<li><strong>到期一次性还大部分本金<\/strong>：很多商业地产贷款期限 5 到 10 年，前期只还很少本金，到期时需要再融资或卖楼还款（叫气球还款，balloon payment）。到期时市场不好，就可能还不上，形成“到期违约风险”。<\/li>\n<li><strong>提前还款受限<\/strong>：贷款合同通常有锁定期、罚息或替代担保（defeasance）条款，提前还款风险比住房贷款小得多。<\/li>\n<\/ul>\n\n<h2>两种主要结构<\/h2>\n<ul>\n<li><strong>多借款人池（conduit）<\/strong>：由很多不同物业、不同借款人的贷款组成，比较分散。<\/li>\n<li><strong>单一资产或单一借款人（SASB）<\/strong>：只有一笔大贷款或一个大借款人，比如一栋地标写字楼或一个酒店组合，风险完全取决于这一处资产。<\/li>\n<\/ul>\n<p>CMBS 的服务也分两种：主服务商（master servicer）负责日常收款；贷款出问题时转给特别服务商（special servicer），负责重组、展期或处置物业。<\/p>\n\n<div class=\"desk\">\n<p>分析 CMBS 要逐笔看大额贷款：所在城市、物业类型、主要租户、租约到期时间、贷款价值比和 DSCR。风控会按物业类型（写字楼、零售、酒店、公寓、仓储）设定集中度，并用压力情景测试租金下跌和估值下跌对各层的影响。CMBS 的权益级和最低层通常由“B 份买家”（B-piece buyer）购买，他们会在发行前深入审查每笔贷款。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年新冠疫情期间，酒店和零售物业收入骤降。据数据商 Trepp 统计，美国 CMBS 整体逾期率在 2020 年 6 月升至 10% 以上，其中酒店类超过 20%。疫情后，远程办公让写字楼空置率持续上升，写字楼 CMBS 的逾期率在 2024 年升至 10% 以上，超过了 2008 年危机后的高点。不同物业类型的命运截然不同，显示 CMBS 风险高度依赖于具体资产。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>CMBS 以商业地产贷款为支持，贷款少而大，集中度高，靠物业租金还款。<\/li>\n<li>很多贷款到期一次性还大部分本金，到期再融资失败是主要风险，提前还款风险较小。<\/li>\n<li>分析要逐笔看物业、租户和覆盖率，不同物业类型的风险差别很大。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一笔写字楼贷款五年后到期，物业出租率从 95% 降到 70%，同时利率比五年前高出很多。借款人还能顺利再融资吗？对 CMBS 投资者意味着什么？<\/summary>\n<div><p>很难。出租率下降让租金收入减少，利率上升让新贷款的利息更高，物业估值也会下跌，新贷款能借到的金额可能不够还旧贷款。借款人可能违约或申请展期，贷款转给特别服务商处理。CMBS 投资者会面临延迟收款，低层还可能承担损失。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-5\"><\/a><\/li>\n<li><a href=\"#L11-14\"><\/a><\/li>\n<li><a href=\"#L11-18\"><\/a><\/li>\n<\/ul><\/div>\n","11.9":"<div class=\"scene\">\n<p>一家私募基金用杠杆收购了一家公司，借了几十亿美元的贷款。这些贷款利率高、借款人信用一般，银行不想全部留在自己的账上。谁来买？很大一部分最终进入了<strong>担保贷款凭证（collateralized loan obligation，CLO）<\/strong>：一个由专业管理人管理、买入一两百笔企业杠杆贷款，再按分层发行债券的结构。今天，CLO 是美国和欧洲杠杆贷款市场最大的买家。<\/p>\n<\/div>\n\n<h2>CLO 是怎样运作的<\/h2>\n<ul>\n<li><strong>资产<\/strong>：一两百笔杠杆贷款（leveraged loans），大多是浮动利率、有担保的优先贷款，借款人通常是信用评级在 BB 或 B 级的公司。<\/li>\n<li><strong>负债<\/strong>：按分层发行，从 AAA 到 BB，再加上权益级。AAA 层通常占六成左右。<\/li>\n<li><strong>管理人<\/strong>：和大多数证券化不同，CLO 由一个管理人（CLO manager）主动管理，可以在再投资期（reinvestment period，通常 4–5 年）内买卖贷款、用还回来的本金买新贷款。<\/li>\n<\/ul>\n\n<h2>保护投资者的测试<\/h2>\n<p>CLO 有一系列定期检查的测试，确保资产足够支持负债：<\/p>\n<ul>\n<li><strong>超额抵押测试（OC test）<\/strong>：资产面值是否足够覆盖各层债务。<\/li>\n<li><strong>利息覆盖测试（IC test）<\/strong>：资产利息是否足够支付各层利息。<\/li>\n<li><strong>组合限制<\/strong>：比如 CCC 级贷款不能超过一定比例（通常 7.5%），单一行业、单一借款人不能过度集中。<\/li>\n<\/ul>\n<p>测试不通过时，现金流会改道，优先偿还高级层，保护高级层投资者。<\/p>\n\n<div class=\"desk\">\n<p>CLO 管理人每天在做信用研究和交易：评估每家借款公司，判断该买该卖。CLO 权益级投资者最关心管理人的能力和现金流测试的“缓冲”。银行持有 CLO 的 AAA 层作为高评级投资，风控关注的是底层贷款的信用质量、评级迁移和 CCC 比例的变化。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机中，CLO 的表现远好于以次贷为资产的 ABS CDO。尽管贷款违约率上升、CLO 价格大跌，但很多 CLO 的结构保护起了作用，高级层最终没有本金损失。评级机构和行业研究常提到，历史上 CLO 的 AAA 层几乎从未出现过违约。截至 2024 年，美国 CLO 市场规模约 1 万亿美元，是杠杆贷款最重要的资金来源。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>CLO 买入一两百笔企业杠杆贷款，按分层发行债券，是杠杆贷款最大的买家。<\/li>\n<li>它由管理人主动管理，可以在再投资期内买卖贷款。<\/li>\n<li>OC、IC 测试和组合限制保护高级层，测试不通过时现金流改道。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>经济放缓时，大量贷款被下调到 CCC 级，超过了 CLO 的 7.5% 上限。这会对 CLO 的权益级投资者产生什么影响？<\/summary>\n<div><p>超出上限的 CCC 贷款在 OC 测试中通常要按市场价或更低价值计算，而不是按面值，这会让 OC 测试的比例下降。一旦测试不通过，本来分给权益级的现金会转去偿还高级层，权益级的分红被暂停。所以即使贷款还没有真正违约，评级下调就可能让权益级收不到钱。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-19\"><\/a><\/li>\n<li><a href=\"#L14-10\"><\/a><\/li>\n<li><a href=\"#L11-12\"><\/a><\/li>\n<\/ul><\/div>\n","11.10":"<div class=\"scene\">\n<p>你买了一辆车，分五年付款；你刷了信用卡，下个月还；你借了学生贷款，毕业后慢慢还。这些看起来零零散散的个人借款，被汇集起来，最终也会变成债券，卖给全世界的投资者。这类以消费类贷款和应收款为支持的证券，统称<strong>资产支持证券（asset-backed securities，ABS）<\/strong>。<\/p>\n<\/div>\n\n<h2>车贷 ABS<\/h2>\n<p>车贷是 ABS 中最大的类别之一。车贷期限短（通常 3 到 6 年），按月等额还款，现金流比较可预测。按借款人质量分为优质（prime）和次级（subprime）。汽车可以收回拍卖，回收率相对较高。汽车租赁合同也可以证券化，这时还要考虑租约到期时车辆的残值。<\/p>\n\n<h2>信用卡 ABS<\/h2>\n<p>信用卡余额每个月都在变：有人还款，有人新刷。所以信用卡 ABS 通常用“主信托”（master trust）结构：<\/p>\n<ul>\n<li><strong>循环期（revolving period）<\/strong>：投资者在前几年只收利息，持卡人还回来的本金被用来购买新的信用卡应收款，维持池子规模。<\/li>\n<li><strong>摊还期（amortization）<\/strong>：之后才开始向投资者还本金。<\/li>\n<li><strong>提前摊还（early amortization）<\/strong>：如果超额利差变成负数或出现其他问题，就提前进入还本阶段，保护投资者。<\/li>\n<\/ul>\n\n<h2>其他类型<\/h2>\n<p>学生贷款、设备租赁、消费分期、“先买后付”（BNPL）贷款、手机分期，甚至飞机租赁、数据中心租金、音乐版权收入，都可以证券化。资产越新颖，历史数据越少，评估风险就越难。<\/p>\n\n<div class=\"desk\">\n<p>分析消费类 ABS，核心是看资产池的历史表现数据：每月的逾期率、违约率、回收率和提前还款速度，按发放年份（vintage）分别追踪。投资者还会关注发起人和服务商：发起人的放款标准是否放松、服务商的催收能力是否可靠。如果发起人本身财务困难，服务和资产质量都可能出问题。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2025 年 9 月，美国次级车贷公司 Tricolor 申请破产清算。随后的诉讼和调查中，有指控称同一批车贷被重复抵押给不同的融资方。几家为它提供融资的银行出现了损失，投资者开始重新审视次级车贷领域的抵押品核查。这一事件提醒市场：ABS 的风险不只是借款人违约，还包括发起人和服务商本身的操作与欺诈风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>ABS 以车贷、信用卡、学生贷款等消费类贷款和应收款为支持。<\/li>\n<li>信用卡 ABS 用主信托结构，有循环期、摊还期和提前摊还保护。<\/li>\n<li>分析要看资产池历史表现，也要看发起人和服务商的质量和操作风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家新兴的“先买后付”公司发行了第一只 ABS，评级 AAA。投资者应该担心什么？<\/summary>\n<div><p>首先，这类资产历史很短，没有经历过完整的经济周期，违约率在衰退中会怎样变化缺少数据，评级模型的假设可能过于乐观。其次，借款人可能同时在多家平台借款，真实负债水平难以看清。最后，新公司的服务和催收能力未经考验，如果公司自身出问题，资产管理可能中断。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-14\"><\/a><\/li>\n<li><a href=\"#L11-4\"><\/a><\/li>\n<li><a href=\"#L11-11\"><\/a><\/li>\n<\/ul><\/div>\n","11.11":"<div class=\"scene\">\n<p>2007 年 8 月，一个听起来很冷门的市场突然冻结了：资产支持商业票据。很多银行在资产负债表之外设立了融资载体，它们买入长期的证券化产品，却靠发行 30 天、60 天的短期票据融资。投资者一夜之间不愿意续买这些票据，载体只能找背后的银行要钱。这个市场，就是<strong>资产支持商业票据（asset-backed commercial paper，ABCP）<\/strong>。<\/p>\n<\/div>\n\n<h2>ABCP 是什么<\/h2>\n<p>ABCP 由一个专门的载体（conduit）发行，期限通常在 270 天以内，以载体持有的资产为支持。资产可以是：<\/p>\n<ul>\n<li>企业客户的应收账款、贸易融资款项；<\/li>\n<li>车贷、信用卡等消费类应收款；<\/li>\n<li>评级较高的证券化产品。<\/li>\n<\/ul>\n<p>买 ABCP 的主要是货币市场基金和企业财务部门，它们把它当作安全、短期的现金替代品。<\/p>\n\n<h2>期限错配和流动性支持<\/h2>\n<p>ABCP 载体的本质是“借短投长”：资产期限长，负债期限短，每隔几十天就要发新票据还旧票据（叫滚动，rollover）。一旦投资者不肯续买，载体就还不上钱。为此，背后的银行通常要提供流动性支持（liquidity facility）：投资者不续买时，银行出钱接手。<\/p>\n<ul>\n<li><strong>传统多卖方载体<\/strong>：主要为银行的企业客户融资应收账款，资产短期、分散，危机中表现较好。<\/li>\n<li><strong>证券套利载体和结构化投资工具（SIV）<\/strong>：买入长期的证券化产品，赚长短期利差，在 2007 年受打击最大。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>银行提供的流动性支持是一种或有负债：平时不占用资金，危机时可能突然需要大量资金。2008 年后，巴塞尔协议的流动性覆盖率（LCR）要求银行为这类承诺准备高质量流动资产，会计准则也要求银行在保留控制权时把载体并表，ABCP 的“表外”特性大大减弱。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2007 年 7 月，德国 IKB 银行的表外载体 Rhineland Funding 因持有美国次贷相关资产而无法续发票据，IKB 被迫由股东救助。8 月起，美国 ABCP 市场迅速收缩，几个月内余额缩水约三分之一。加拿大约 320 亿加元的非银行 ABCP 在 8 月完全冻结，各方随即签订“蒙特利尔协议”暂停偿付，经过一年多的谈判，最终在 2009 年初重组为长期票据。很多银行不得不把表外载体的资产收回表内，承担了原本以为已经转出的风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>ABCP 由载体发行，以资产为支持，期限短，主要卖给货币基金和企业。<\/li>\n<li>它的本质是借短投长，依赖滚动发行，背后的银行提供流动性支持。<\/li>\n<li>2007 年 ABCP 市场冻结，表外载体的风险回到银行，成为危机的早期信号。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>银行设立表外载体，宣称风险已经转出。但危机中银行最终还是把资产收回表内。为什么？<\/summary>\n<div><p>一方面，银行提供了流动性支持，合同上就有义务在投资者不续买时出钱。另一方面，即使合同没有要求，银行也担心让自己设立的载体违约会严重损害声誉，影响其他业务和融资，所以选择主动救助。这类“声誉风险”导致的隐性支持，后来被监管称为“步入风险”（step-in risk）。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L10-2\"><\/a><\/li>\n<li><a href=\"#L11-12\"><\/a><\/li>\n<li><a href=\"#LH5-5\"><\/a><\/li>\n<\/ul><\/div>\n","11.12":"<div class=\"scene\">\n<p>2006 年，华尔街把一批次级 RMBS 中评级 BBB 的夹层收集起来，放进一个新的资产池，再按分层重新发行。神奇的事发生了：一堆 BBB 级证券，经过重新打包，其中大部分可以拿到 AAA 评级。再往后，有人把这些新产品的夹层又收集起来，再打包一次。这些产品叫<strong>担保债务凭证（collateralized debt obligation，CDO）<\/strong>和 <strong>CDO 平方（CDO-squared）<\/strong>，它们后来成为 2008 年危机中损失最惨重的产品之一。<\/p>\n<\/div>\n\n<h2>CDO：把债券再打包<\/h2>\n<p>CDO 是一个以一组债务工具为资产、按分层发行负债的结构。根据资产不同，可以分为几种：<\/p>\n<ul>\n<li><strong>以企业债或贷款为资产<\/strong>：CLO 就是其中最常见的一种。<\/li>\n<li><strong>ABS CDO<\/strong>：以 RMBS、CMBS、ABS 的各层为资产，尤其是次贷 RMBS 的夹层。<\/li>\n<li><strong>合成 CDO<\/strong>：不买债券，而是通过卖出 CDS 获得信用风险。<\/li>\n<\/ul>\n\n<h2>为什么 BBB 能变成 AAA<\/h2>\n<p>评级模型假设：资产池里的几十只 BBB 证券来自不同交易、不同地区，违约之间相关性不高，不会同时出事。在这个假设下，只要垫子足够厚，最上面的层就很安全。<\/p>\n<p>问题在于，这些 BBB 夹层都来自同一类资产：美国次级房贷。当全国房价一起下跌，它们几乎同时违约。原本假设的“分散”根本不存在。<\/p>\n\n<h2>CDO 平方：风险的风险<\/h2>\n<p>CDO 平方以其他 CDO 的层为资产，再打包一次。每多打包一层，产品对底层资产损失就更敏感：底层损失稍微超出预期，夹层就被吃掉，以夹层为资产的上一层产品损失放大。对相关性和损失假设的依赖被成倍放大，模型误差的后果也被放大。<\/p>\n\n<div class=\"desk\">\n<p>危机前，很多银行把 CDO 的超高级层（super senior）留在自己账上，认为它几乎无风险，风险报告里只体现很小的 VaR。危机中，这些头寸的估值暴跌，成为银行最大的损失来源之一。今天，监管对再证券化（resecuritization）设定了很高的资本要求，CDO 平方这类产品基本退出了市场。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2007 年，高盛设计并出售了一只名为 Abacus 2007-AC1 的合成 CDO。美国证监会后来指控，高盛没有告诉投资者，一家做空这些资产的对冲基金参与了资产的挑选。2010 年 7 月，高盛同意支付 5.5 亿美元与证监会和解。同一时期，美林、花旗、瑞银等银行因 ABS CDO 头寸分别减记了数百亿美元。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>CDO 以一组债务工具为资产按分层发行负债，ABS CDO 以证券化产品的夹层为资产。<\/li>\n<li>BBB 夹层能变成 AAA，依赖“违约相关性低”的假设，而次贷夹层实际上高度相关。<\/li>\n<li>CDO 平方再打包一次，把对损失和相关性假设的敏感度成倍放大。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>银行持有 CDO 的超高级层，在危机前的 VaR 报告中显示风险很小。为什么 VaR 没有提前发出警告？<\/summary>\n<div><p>VaR 通常基于过去一两年的价格波动。危机前，超高级层的价格几乎不动，历史数据显示风险很小。但它的风险是“平时不动、出事时一次性大跌”的尾部风险，取决于房价全国下跌这类过去很少出现的情景。只看历史波动的 VaR 看不到这种风险，需要压力测试和对底层资产的分析。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-37\"><\/a><\/li>\n<li><a href=\"#L11-9\"><\/a><\/li>\n<li><a href=\"#LH5-5\"><\/a><\/li>\n<\/ul><\/div>\n","11.13":"<div class=\"scene\">\n<p>一家德国银行要为房贷融资，有两种选择：一是把房贷卖给 SPV，做成 RMBS；二是自己发行一种债券，用这批房贷作抵押，但房贷仍留在银行账上。第二种就是<strong>担保债券（covered bond）<\/strong>，在德国叫 Pfandbrief，已经有两百多年历史。两者看起来很像，对投资者却是两种完全不同的风险。<\/p>\n<\/div>\n\n<h2>最大的区别：双重追索<\/h2>\n<ul>\n<li><strong>证券化<\/strong>：资产卖给 SPV，投资者只能找资产池要钱。发起银行破产与否，影响不大。<\/li>\n<li><strong>担保债券<\/strong>：债券是银行自己的负债，银行要全额偿还。银行破产时，投资者还对一个专门的担保资产池（cover pool）有优先受偿权。这叫“双重追索”（dual recourse）：先找银行，银行不行再找资产池。<\/li>\n<\/ul>\n<p>因此担保债券的风险比同一家银行的普通债券低得多，评级通常是 AAA 或 AA，利率接近国债。<\/p>\n\n<h2>其他重要区别<\/h2>\n<div class=\"tbl\"><table>\n<tr><th><\/th><th>担保债券<\/th><th>证券化（如 RMBS）<\/th><\/tr>\n<tr><td>资产在哪<\/td><td>留在银行资产负债表上<\/td><td>卖给 SPV，通常出表<\/td><\/tr>\n<tr><td>资产池<\/td><td>动态：坏贷款要替换成好贷款<\/td><td>大多静态：违约就是损失<\/td><\/tr>\n<tr><td>分层<\/td><td>通常只有一种债券<\/td><td>多层，风险等级不同<\/td><\/tr>\n<tr><td>提前还款<\/td><td>大多按固定日期还本，风险由银行承担（丹麦等少数市场例外）<\/td><td>传递给投资者<\/td><\/tr>\n<tr><td>法律基础<\/td><td>多数国家有专门法律<\/td><td>主要依靠合同<\/td><\/tr>\n<\/table><\/div>\n<p>担保债券在欧洲是银行重要的长期融资工具，丹麦、德国、法国、西班牙等国都有很大的市场。<\/p>\n\n<div class=\"desk\">\n<p>对银行资金部来说，担保债券是成本最低的长期融资之一，但会“锁住”一部分最好的资产（资产负担，asset encumbrance），损害普通无担保债权人的利益，所以监管和评级机构会关注银行的资产负担比例。投资者和监管都把高质量担保债券视为高流动性资产，可以计入流动性缓冲，风险权重也较低。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>担保债券起源于 1769 年普鲁士腓特烈大帝时期，为七年战争后的贵族地产融资而设。2008–2009 年金融危机中，担保债券市场虽然也受冲击，但据行业统计，没有出现让投资者实际亏损的违约。2009 年 7 月，欧洲央行推出第一轮担保债券购买计划，规模 600 亿欧元，用以支持这个市场。欧盟后来出台统一的担保债券指令，于 2022 年 7 月起适用。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>担保债券是银行自己的负债，投资者同时对银行和担保资产池有追索权。<\/li>\n<li>资产留在银行表上，资产池是动态的，坏资产要被替换，通常只发一种债券。<\/li>\n<li>它是欧洲银行低成本的长期融资工具，但会增加银行的资产负担。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同一家银行，发行的担保债券评级 AAA，普通高级债评级 A。如果银行发了大量担保债券，普通高级债投资者为什么会不高兴？<\/summary>\n<div><p>担保债券的担保资产池拿走了银行最好的资产。银行破产时，担保债券投资者先从这些资产中受偿，剩下给普通债权人的资产就更少、更差。担保债券发得越多，普通高级债的回收率就越低，风险越高。所以很多国家的法律会对担保债券的发行规模设定上限。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L6-45\"><\/a><\/li>\n<li><a href=\"#L11-2\"><\/a><\/li>\n<li><a href=\"#L11-5\"><\/a><\/li>\n<\/ul><\/div>\n","11.14":"<div class=\"scene\">\n<p>一只 RMBS 发行后要存续二三十年。这期间，谁每个月去收那几千个借款人的还款？借款人不还钱，谁去催收、谁去拍卖房子？谁来确保钱按瀑布正确分配？谁告诉投资者这只债券大概有多安全？证券化背后有一整套分工，每个角色出问题，都可能让投资者受损。主要有三个：<strong>服务商（servicer）<\/strong>、<strong>受托人（trustee）<\/strong>和<strong>评级机构（rating agency）<\/strong>。<\/p>\n<\/div>\n\n<h2>服务商：管理每一笔贷款<\/h2>\n<p>服务商负责资产池的日常管理：收取还款、处理逾期、和借款人协商修改贷款、启动止赎和处置抵押物，并把收到的钱转给 SPV。服务商通常就是发起银行本身，也可能是专门的服务公司。<\/p>\n<ul>\n<li><strong>主服务商<\/strong>：处理正常贷款。<\/li>\n<li><strong>特别服务商<\/strong>：贷款出问题后接手，负责重组或处置，在 CMBS 中特别重要。<\/li>\n<li><strong>备用服务商（backup servicer）<\/strong>：主服务商出问题时接手，保证服务不中断。<\/li>\n<\/ul>\n<p>服务商在借款人违约时通常要先垫付利息（advancing），后面再从回收中拿回来。<\/p>\n\n<h2>受托人：代表投资者<\/h2>\n<p>受托人代表全体投资者持有 SPV 的资产权益，监督服务商是否按合同办事，按瀑布计算和分配现金，发布定期报告。出现违约时，受托人代表投资者采取法律行动。<\/p>\n\n<h2>评级机构：给出风险意见<\/h2>\n<p>评级机构分析资产池、结构和各方角色，给每一层债券评级。很多机构投资者只能买特定评级以上的债券，评级直接影响债券的需求和价格。问题在于“发行人付费”模式：评级费用由发行方支付，发行方可以选择给出更高评级的机构，形成利益冲突。<\/p>\n\n<div class=\"desk\">\n<p>投资者在尽职调查时会审查服务商的能力和评级（服务商也有评级）、受托人的责任范围，以及各评级机构的方法差异。交易中还有安排人（arranger）、承销商、律师和会计师。危机后，美国和欧盟都对评级机构加强了监管，要求披露方法、管理利益冲突。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2010 年，美国多家大型服务商被发现在止赎文件上批量签字而不核实内容，被称为“机器人签字”（robo-signing）丑闻。2012 年，五家大型服务商与美国政府和多州达成约 250 亿美元的和解。评级机构方面，标普在 2015 年因危机前的评级问题，与美国司法部和多个州达成约 13.75 亿美元的和解；穆迪在 2017 年也以约 8.64 亿美元和解。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>服务商管理每笔贷款的收款、催收和处置，出问题时由特别服务商或备用服务商接手。<\/li>\n<li>受托人代表投资者监督各方、分配现金、必要时采取法律行动。<\/li>\n<li>评级机构给各层评级，但“发行人付费”模式带来利益冲突。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>服务商在借款人违约时要垫付利息，同时也负责决定是修改贷款还是止赎。这里可能有什么利益冲突？<\/summary>\n<div><p>服务商垫付的钱要在处置后才能拿回，它可能倾向于拖延或选择对自己有利的方式，而不一定是对投资者最有利的方式。如果服务商同时是发起银行，还持有借款人的第二顺位贷款，它可能不愿意做降低第一顺位贷款本金的修改。不同层的投资者对处置方式的偏好也不同，这些都让服务商的决策有争议。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-2\"><\/a><\/li>\n<li><a href=\"#LI2-20\"><\/a><\/li>\n<li><a href=\"#LC12-3\"><\/a><\/li>\n<\/ul><\/div>\n","11.15":"<div class=\"scene\">\n<p>一只 30 年期 MBS，名义期限是 30 年，但投资者平均要等几年才能拿回本金？答案可能是 5 年，也可能是 12 年，取决于借款人提前还款的速度。投资者需要一个比“30 年”更有用的数字。这个数字叫<strong>加权平均期限（weighted average life，WAL）<\/strong>。<\/p>\n<\/div>\n\n<h2>WAL：平均要等多久拿回本金<\/h2>\n<p>WAL 是每一笔本金回收时间的加权平均，权重是这笔本金的金额。比如一只债券一半本金在第 2 年还，另一半在第 8 年还，WAL 就是 5 年。它只看本金，不看利息。<\/p>\n<p>对证券化产品，WAL 比名义期限有用得多：投资者用 WAL 来对比同期限的国债或互换利率，计算利差。WAL 的关键在于它依赖提前还款速度的假设，速度变了，WAL 就变了。<\/p>\n\n<h2>怎样描述提前还款速度<\/h2>\n<ul>\n<li><strong>SMM（单月提前还款率）<\/strong>：一个月里，剩余本金中有多少比例被提前还清。<\/li>\n<li><strong>CPR（年化提前还款率）<\/strong>：把 SMM 年化后的数字，市场最常用。CPR 为 10%，意思是每年大约有 10% 的剩余本金被提前还掉。<\/li>\n<li><strong>PSA 基准<\/strong>：一个标准的提前还款曲线。100% PSA 假设新贷款第一个月 CPR 为 0.2%，之后每月增加 0.2%，到第 30 个月达到 6% 并保持不变。市场常说“这只 MBS 按 200% PSA 定价”，意思是提前还款速度是基准的两倍。<\/li>\n<\/ul>\n<p>PSA 曲线反映了一个规律：新贷款刚发放时很少有人提前还款，随着时间推移，搬家、再融资的人逐渐增多。<\/p>\n\n<div class=\"desk\">\n<p>交易台给 MBS 和 ABS 报价时，通常要说明基于什么提前还款速度，比如“按 15 CPR，WAL 5.2 年，利差 120 基点”。风控会测试不同速度下的 WAL：提前还款加快，WAL 缩短，叫缩期风险（contraction risk）；提前还款放慢，WAL 拉长，叫延期风险（extension risk）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>PSA 基准由美国公共证券协会（Public Securities Association，现在的 SIFMA 前身之一）在 1985 年提出，作为市场统一的提前还款速度“尺子”。2022 年美联储快速加息后，大量借款人锁定了 3% 以下的房贷利率，几乎没人提前还款或搬家，机构 MBS 的实际提前还款速度降到历史低位，WAL 大幅拉长。这一现象被称为房贷利率的“锁定效应”（lock-in effect）。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>WAL 是本金回收时间的加权平均，比名义期限更能反映证券化产品实际要等多久。<\/li>\n<li>提前还款速度用 SMM、CPR 和 PSA 基准描述，WAL 随速度假设变化。<\/li>\n<li>提前还款加快带来缩期风险，放慢带来延期风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个投资者买了 WAL 为 3 年的 MBS，用 3 年期的资金来匹配。利率大幅上升后，可能出现什么问题？<\/summary>\n<div><p>利率上升让提前还款放慢，WAL 可能从 3 年拉长到 7 年甚至更长。投资者的资金 3 年后到期，但 MBS 的本金远没有还回来，要么以更高的利率续借，要么在价格已经下跌的时候卖出 MBS。这就是延期风险带来的资产负债错配。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-5\"><\/a><\/li>\n<li><a href=\"#L11-16\"><\/a><\/li>\n<li><a href=\"#L11-7\"><\/a><\/li>\n<\/ul><\/div>\n","11.16":"<div class=\"scene\">\n<p>两个借款人，房贷利率都是 6%。市场利率降到 5% 时，一个马上去再融资了，另一个一直没动。为什么？也许他刚换了工作，银行审批困难；也许他的房子贬值了，借不到新贷款；也许他根本没注意。提前还款不是一道纯粹的数学题，而是几百万个家庭各自做出的决定。预测这些决定，就是<strong>提前还款模型（prepayment model）<\/strong>的任务。<\/p>\n<\/div>\n\n<h2>提前还款的几个驱动因素<\/h2>\n<ul>\n<li><strong>再融资动机（refinancing incentive）<\/strong>：原贷款利率和当前市场利率的差距，差得越多，再融资的人越多。这是最重要的因素。<\/li>\n<li><strong>周转（turnover）<\/strong>：搬家卖房引起的提前还款，和房地产市场的活跃度有关，受利率影响较小。<\/li>\n<li><strong>账龄（seasoning）<\/strong>：新贷款前几年提前还款较少，之后逐渐增加。<\/li>\n<li><strong>倦怠（burnout）<\/strong>：一个资产池经历过几轮低利率后，还没再融资的人可能就是“不会再融资”的人，速度会放慢。<\/li>\n<li><strong>季节性和其他<\/strong>：夏天搬家多；贷款金额、信用分、房价变化、贷款机构的营销力度也会影响速度。<\/li>\n<\/ul>\n<p>把提前还款速度和再融资动机画成图，通常是一条 S 形曲线：动机小时速度低，动机增大后快速上升，再往上趋于平缓。<\/p>\n\n<h2>负凸性：MBS 最核心的特征<\/h2>\n<p>普通债券有正凸性：利率下降时价格涨得多，利率上升时价格跌得少。MBS 则相反：<\/p>\n<ul>\n<li>利率下降，提前还款加快，本金提前回来，只能以低利率再投资，价格涨不了多少。<\/li>\n<li>利率上升，提前还款放慢，久期拉长，价格跌得更多。<\/li>\n<\/ul>\n<p>这就是负凸性（negative convexity）。它的根源是投资者卖给借款人的提前还款期权，投资者为此获得的补偿，就是 MBS 相对国债的额外利差。<\/p>\n\n<div class=\"desk\">\n<p>MBS 持有者为了保持久期稳定，要做“凸性对冲”（convexity hedging）：利率上升、久期拉长时卖出国债或支付固定利率互换；利率下降、久期缩短时买入国债。这种对冲方向和利率走势一致，规模大时会放大利率波动。所以利率交易员会关注 MBS 市场的凸性对冲需求。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2003 年夏天，美国 10 年期国债收益率在 6 月中旬到 8 月初之间从约 3.1% 快速升到约 4.6%。市场普遍认为，房利美、房地美和其他大型 MBS 持有者的凸性对冲卖盘是放大这次抛售的重要原因：收益率上升使 MBS 久期迅速拉长，持有者被迫卖出国债和互换，又进一步推高收益率。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>提前还款模型根据再融资动机、周转、账龄、倦怠等因素预测速度。<\/li>\n<li>速度和再融资动机的关系通常是 S 形曲线。<\/li>\n<li>提前还款让 MBS 具有负凸性，持有者的凸性对冲可能放大利率波动。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两个资产池票息相同，一个由刚发放的新贷款组成，另一个由经历过两轮再融资潮的老贷款组成。利率再次下降时，哪个提前还款更快？<\/summary>\n<div><p>通常新贷款池更快。老贷款池经历过两轮再融资潮，对利率敏感、有能力再融资的借款人大多已经走了，剩下的借款人可能因为信用、房产价值或个人原因无法或不愿再融资，这就是倦怠效应。所以老贷款池的提前还款风险较小，负凸性也较弱，通常价格更高。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-15\"><\/a><\/li>\n<li><a href=\"#L9-35\"><\/a><\/li>\n<li><a href=\"#L11-24\"><\/a><\/li>\n<\/ul><\/div>\n","11.17":"<div class=\"scene\">\n<p>把一只 MBS 的现金流分成两份：一份只收利息，另一份只收本金。利率下降时，借款人提前还款，本金很快回来，只收本金的一方赚了；只收利息的一方却少收了很多年的利息，价值暴跌。同一只 MBS 拆开后，两部分对利率的反应完全相反。这就是<strong>只收利息（interest only，IO）<\/strong>和<strong>只收本金（principal only，PO）<\/strong>证券。<\/p>\n<\/div>\n\n<h2>PO：本金回来越快越好<\/h2>\n<p>PO 不付利息，以很大的折价发行，比如 60 美元买入面值 100 美元。投资者的收益来自最终拿回全部本金。本金回来得越快，收益越高：<\/p>\n<ul>\n<li>利率下降：提前还款加快，PO 价值大涨。<\/li>\n<li>利率上升：提前还款放慢，本金要等很久，PO 价值下跌，跌幅比普通债券大很多。<\/li>\n<\/ul>\n<p>PO 的久期很长，而且对利率的敏感度比普通债券高。<\/p>\n\n<h2>IO：贷款存在越久越好<\/h2>\n<p>IO 只收利息，利息按剩余本金计算。本金一旦被提前还掉，那部分利息就永远没了：<\/p>\n<ul>\n<li>利率下降：提前还款加快，利息流迅速减少，IO 价值暴跌，甚至可能连成本都收不回。<\/li>\n<li>利率上升：提前还款放慢，利息收得更久，IO 价值反而上升。<\/li>\n<\/ul>\n<p>IO 是少数利率上升时价值上升的固定收益产品，有负久期（negative duration）。<\/p>\n\n<h2>用途<\/h2>\n<ul>\n<li>MBS 投资者买入 IO，对冲利率上升带来的损失。<\/li>\n<li>银行和服务商的抵押贷款服务权（MSR）和 IO 很像：利率下降时贷款被提前还清，服务费收入消失，所以常用 PO 或利率产品对冲。<\/li>\n<li>对冲基金用 IO 和 PO 表达对提前还款速度的看法。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>IO 和 PO 的风险报告和普通债券差别很大：DV01 的符号可能相反，数值对提前还款模型极其敏感，凸性也很大。风控一般会对它们做大幅利率情景和提前还款速度情景测试，而不只依赖小幅度的 DV01。模型稍有偏差，估值就可能差很多。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1987 年 4 月，美林证券的一名交易员持有大量未经授权的 PO 头寸。当月利率快速上升，提前还款预期放慢，PO 价格暴跌，美林据报道损失约 3.7 亿美元，是当时华尔街最大的单笔交易损失之一。这一事件让市场认识到：PO 和 IO 看似由普通 MBS 拆分而来，风险却比原来的 MBS 大得多。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>PO 只收本金，以折价发行，利率下降、提前还款加快时价值上升。<\/li>\n<li>IO 只收利息，利率上升、提前还款放慢时价值上升，有负久期。<\/li>\n<li>两者对提前还款模型极其敏感，常被用于对冲和表达对提前还款速度的看法。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行持有大量抵押贷款服务权（MSR），每年按贷款余额收取服务费。它最担心利率怎样变动？可以怎样对冲？<\/summary>\n<div><p>它最担心利率下降：借款人大量再融资，旧贷款被还清，服务费收入随之消失，MSR 价值下跌。这和持有 IO 的风险相同。它可以买入 PO、买入国债或收取固定利率的互换，利率下降时这些头寸赚钱，弥补 MSR 的损失。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-16\"><\/a><\/li>\n<li><a href=\"#L11-7\"><\/a><\/li>\n<li><a href=\"#L9-35\"><\/a><\/li>\n<\/ul><\/div>\n","11.18":"<div class=\"scene\">\n<p>一个分析师要评估一只次贷 RMBS 的夹层：这一层会不会亏？他需要回答三个问题：有多少借款人会违约？违约后能收回多少？这些损失什么时候发生？把这三个问题的不同答案组合起来，就形成了一组<strong>违约与回收情景（default and recovery scenarios）<\/strong>。证券化产品的信用分析，核心就是在这些情景下看损失会穿透到哪一层。<\/p>\n<\/div>\n\n<h2>三个关键假设<\/h2>\n<ul>\n<li><strong>违约率<\/strong>：常用年化违约率（CDR，constant default rate），每年剩余本金中有多少比例违约。<\/li>\n<li><strong>损失严重程度（loss severity）<\/strong>：违约贷款最终损失的比例，等于 1 减回收率。房贷的损失严重程度取决于房价、止赎成本和处置时间。<\/li>\n<li><strong>损失时间<\/strong>：损失是集中在前几年还是后几年。时间不同，超额利差能吸收的损失也不同，对瀑布的影响很大。<\/li>\n<\/ul>\n<p>累计损失约等于违约率乘以损失严重程度。逾期管道（delinquency pipeline）也很重要：已经逾期 60 天、90 天的贷款，很大一部分最终会违约。<\/p>\n\n<h2>哪一层先亏<\/h2>\n<p>把情景输入瀑布模型，就能看到每一层的结果：<\/p>\n<ul>\n<li>累计损失小于权益级和超额利差的保护：所有债券层都不亏。<\/li>\n<li>损失超过权益级：开始吃掉最低的夹层。<\/li>\n<li>损失继续扩大：一层一层向上穿透。<\/li>\n<\/ul>\n<p>分析师常常反过来问：“损失要达到多少，这一层才会开始亏？”这个数字叫“断点”（break-even loss），再和历史最差情况、压力情景比较，判断这一层的安全程度。<\/p>\n\n<div class=\"desk\">\n<p>证券化投资者和风控的日常工作是构建情景表：基准情景、温和衰退、严重衰退，各自对应一组违约率、损失严重程度和提前还款速度，并加上利率路径。对每一层计算损失、WAL 和收益率。监管压力测试也会要求银行对持有的证券化头寸做类似分析。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2006–2007 年发行的美国次贷 RMBS，在发行时评级模型假设的累计损失通常在个位数到十几个百分点之间。房价全国下跌后，很多交易的累计损失最终达到原始资产池的 20% 以上，部分交易更高，远远超出夹层甚至部分高级层的保护。此后，评级机构和投资者大幅提高了压力情景的严重程度，并更重视房价下跌和违约相关性。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>信用情景由违约率、损失严重程度和损失时间三个假设组成。<\/li>\n<li>把情景输入瀑布，看损失从权益级开始一层层向上穿透到哪里。<\/li>\n<li>断点损失衡量一层能承受多大损失，要和历史和压力情景比较。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两个情景的累计损失都是 10%，一个损失集中在前两年，另一个均匀分布在十年内。对夹层投资者来说，哪个更糟？<\/summary>\n<div><p>通常前两年集中损失更糟。损失来得早，超额利差还没来得及积累起来吸收损失，损失会更快地穿透权益级、打到夹层，还可能触发触发条件，让现金流转向优先级，夹层收不到本金。损失分布在十年内，每年的超额利差都能抵消一部分，夹层可能完全不受影响。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-4\"><\/a><\/li>\n<li><a href=\"#L11-3\"><\/a><\/li>\n<li><a href=\"#L24-32\"><\/a><\/li>\n<\/ul><\/div>\n","11.19":"<div class=\"scene\">\n<p>一个 CLO 里有 200 笔贷款。经济一放缓，十几家借款公司被评级机构降到 CCC 级，两家违约。贷款还在付利息，CLO 的资产看起来没少多少，但权益级投资者突然收到通知：这个季度的分红暂停。原因是两个测试没通过：<strong>超额抵押测试（overcollateralization test，OC 测试）<\/strong>和<strong>利息覆盖测试（interest coverage test，IC 测试）<\/strong>。<\/p>\n<\/div>\n\n<h2>OC 测试：资产够不够<\/h2>\n<p>OC 测试比较的是：资产池的面值，除以某一层及其以上所有层的债务余额。比如 AA 层的 OC 比率 = 资产面值 ÷（AAA 层 + AA 层余额）。每一层都有自己的最低要求，越低的层要求越松。<\/p>\n<p>关键在于“资产面值”怎么算：<\/p>\n<ul>\n<li>正常贷款按面值计算。<\/li>\n<li>违约贷款按回收价值或市场价计算。<\/li>\n<li>CCC 级贷款超过上限（通常 7.5%）的部分，按市场价计算，而市场价往往远低于面值。<\/li>\n<\/ul>\n<p>所以贷款被降级或违约时，即使还没有真正损失，OC 比率也会下降。<\/p>\n\n<h2>IC 测试：利息够不够<\/h2>\n<p>IC 测试比较的是：资产池收到的利息，除以某一层及其以上所有层应付的利息。它确保利息收入足够支付债务利息。因为 CLO 的资产和负债大多是浮动利率，IC 测试通常比 OC 测试更不容易被触发。<\/p>\n\n<h2>测试失败会怎样<\/h2>\n<p>测试失败时，现金流会改道：原本应该付给下层和权益级的利息，转去偿还最高级层的本金，直到测试重新通过。这叫“治愈”（cure）。还有一种较温和的再投资测试（reinvestment test），失败时把部分现金用来买入新贷款，提高资产面值。<\/p>\n\n<div class=\"desk\">\n<p>CLO 管理人每月出具受托人报告，列出每个测试的结果和“缓冲”（cushion），也就是离不通过还有多远。权益级和夹层投资者最关注这些缓冲：缓冲越薄，未来分红暂停的可能越大。管理人可以通过卖出风险较高的贷款、以折价买入贷款来提高面值等方式改善测试结果。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年新冠疫情初期，大量杠杆贷款借款人被降级，很多 CLO 的 CCC 比例在几个月内超过 7.5% 的上限。2020 年春季到夏季，相当一部分美国 CLO 的最低层 OC 测试未通过，权益级分红暂停，部分夹层的利息也被递延。随着经济恢复、贷款价格回升，大多数 CLO 在之后一两年内重新通过测试，恢复了分红。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>OC 测试检查资产面值是否足够覆盖债务，降级和违约的贷款会被折算，压低比率。<\/li>\n<li>IC 测试检查利息收入是否足够支付债务利息。<\/li>\n<li>测试失败时现金流改道偿还高级层，权益级分红暂停，直到测试恢复。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>CLO 管理人为了改善 OC 测试，以 85 美元的价格买入面值 100 美元的贷款。为什么这样能提高 OC 比率？对投资者有什么风险？<\/summary>\n<div><p>OC 测试按面值计算正常贷款，用 85 美元买入的贷款按 100 美元计入资产，OC 比率上升。风险在于：折价往往意味着市场认为这笔贷款风险较高，如果借款公司后来被降级或违约，资产价值会大幅缩水。这种做法可能“美化”测试结果，却增加组合的信用风险。所以很多 CLO 文件对折价买入有专门限制。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-9\"><\/a><\/li>\n<li><a href=\"#L11-4\"><\/a><\/li>\n<li><a href=\"#L11-20\"><\/a><\/li>\n<\/ul><\/div>\n","11.20":"<div class=\"scene\">\n<p>月底，风控要求交易台为一只持有的 CMBS 夹层估值。问题是，这只债券上一次成交已经是三个月前。交易员只能参考相近的债券报价、交易商的指示性报价和模型。同一只债券，三家交易商给出的价格可能相差好几个点。证券化产品的<strong>估值（valuation）<\/strong>、<strong>利差（spread）<\/strong>和<strong>流动性风险（liquidity risk）<\/strong>，本质上是同一个问题的三个侧面。<\/p>\n<\/div>\n\n<h2>证券化产品怎样报价<\/h2>\n<ul>\n<li><strong>固定利率产品<\/strong>：通常报相对 WAL 对应国债或互换的利差，比如“WAL 5 年，利差 150 基点”。<\/li>\n<li><strong>浮动利率产品<\/strong>（如 CLO）：通常报折现边际（discount margin，DM），即在参考利率之上需要多少利差才能让现金流折现等于价格。<\/li>\n<li><strong>低评级或问题产品<\/strong>：直接报价格，比如 72 美元。<\/li>\n<\/ul>\n<p>无论怎么报，背后都要先对现金流建模，而现金流取决于违约、回收和提前还款假设。同样的价格，不同假设算出的利差可能完全不同。<\/p>\n\n<h2>利差里包含什么<\/h2>\n<p>证券化产品的利差，大致可以拆成几部分：预期的信用损失、对不确定性的补偿、提前还款或延期风险的补偿，以及流动性溢价（liquidity premium）。很多证券化产品流动性远不如同评级的公司债，投资者会要求额外的补偿。市场恐慌时，流动性溢价可能远大于实际信用风险的变化。<\/p>\n\n<h2>流动性风险<\/h2>\n<p>证券化产品的交易主要靠交易商撮合，很多债券几个月都没有一笔成交。投资者想卖时，常通过“招标清单”（BWIC，bids wanted in competition）请多家交易商竞价。市场紧张时，竞价的人很少、价格很低，甚至无人出价。<\/p>\n\n<div class=\"desk\">\n<p>会计上，很多证券化产品属于公允价值第 2 或第 3 层级：没有直接的市场报价，需要用可比价格或模型估值。风控和产品控制（product control）要做独立价格验证（IPV），比较交易台的估值和外部数据，计提估值调整（如买卖价差储备、模型不确定性储备）。审慎估值（prudent valuation）规则也要求银行为估值不确定性扣减资本。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2006 年，市场推出了一个次贷 RMBS 指数 ABX，追踪一组次贷 RMBS 各评级层的价格。2007 年次贷问题爆发后，ABX 中 BBB 级子指数的价格从接近 100 跌到 20 左右。很多实际持有的次贷债券几乎没有成交，银行被迫参考 ABX 给自己的头寸估值，引发大规模减记。一些银行认为 ABX 被恐慌和流动性推低，远低于实际损失，但没有更好的价格可用。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>证券化产品按利差、折现边际或价格报价，背后都依赖现金流假设。<\/li>\n<li>利差包含预期损失、不确定性、提前还款风险和流动性溢价。<\/li>\n<li>很多产品流动性差，估值依赖模型，需要独立价格验证和估值调整。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>市场恐慌时，一只 AAA 级 CLO 的价格从 100 跌到 90，但底层贷款的违约率几乎没变。这是信用风险还是流动性风险？持有者该怎么办？<\/summary>\n<div><p>主要是流动性风险和风险偏好的变化，而不是预期损失大幅增加。如果持有者能长期持有、不需要卖出，到期时很可能收回全部本金，价格下跌只是账面损失。但如果它需要追加保证金或被迫卖出，这些账面损失就会变成真实损失。所以资金来源是否稳定，决定了流动性风险会不会变成实际损失。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-15\"><\/a><\/li>\n<li><a href=\"#L11-24\"><\/a><\/li>\n<li><a href=\"#L24-36\"><\/a><\/li>\n<\/ul><\/div>\n","11.21":"<div class=\"scene\">\n<p>一家银行持有两种资产：一笔 1 亿欧元的企业贷款组合，和这同一组贷款证券化后的 AAA 层。直觉上，AAA 层风险低很多，应该少占资本。但监管者记得 2008 年：很多 AAA 层最后并不安全。于是巴塞尔协议为证券化设计了一套专门的规则，既要承认分层带来的风险差异，又要防止银行用证券化“玩”资本。这就是<strong>证券化监管资本框架（securitisation framework）<\/strong>和<strong>风险自留（risk retention）<\/strong>规则。<\/p>\n<\/div>\n\n<h2>资本怎么算：三种方法<\/h2>\n<p>巴塞尔协议现行框架给出几种方法，银行按顺序选择能用的那一种：<\/p>\n<ul>\n<li><strong>内部评级法（SEC-IRBA）<\/strong>：银行能用自己的模型估计底层资产的资本要求时使用。<\/li>\n<li><strong>外部评级法（SEC-ERBA）<\/strong>：根据评级机构给的评级和期限查表。部分地区（如美国）不允许使用外部评级。<\/li>\n<li><strong>标准法（SEC-SA）<\/strong>：根据底层资产的标准法资本和拖欠情况计算。<\/li>\n<\/ul>\n<p>几个重要特点：高级层的风险权重有 15% 的下限，即使它非常安全；最低层未评级的首损层通常适用 1,250% 的风险权重，相当于按面值全额扣减资本。再证券化（如 CDO 平方）要求更高。<\/p>\n\n<h2>简单、透明、标准化<\/h2>\n<p>危机后，欧盟为了重振高质量证券化市场，推出“简单、透明、标准化”（STS）标签，自 2019 年起适用。符合条件的交易可以享受更低的资本要求，高级层风险权重下限降到 10%。<\/p>\n\n<h2>风险自留：发起人要留一部分<\/h2>\n<p>为了防止“发放后全部卖掉”导致审核松懈，美国和欧盟要求发起人或发行人保留至少 5% 的经济利益。可以保留每一层的 5%、保留首损层，或者其他等价方式。<\/p>\n\n<div class=\"desk\">\n<p>银行的证券化团队在设计交易时，会同时计算发起银行转出风险后能释放多少资本，以及投资者持有各层需要多少资本。资本成本直接影响每一层的定价和谁愿意买。风控和资本管理团队要确认交易满足风险转移的监管条件，否则资本无法释放。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美国多德-弗兰克法案要求证券化发起人保留 5% 的风险，相关规则在 2015–2016 年间生效，最初也适用于 CLO 管理人。美国贷款银团与交易协会（LSTA）起诉监管机构，2018 年 2 月，联邦哥伦比亚特区巡回上诉法院裁定，在公开市场买入贷款的 CLO 管理人不是“证券化发起人”，无需遵守风险自留规则。欧盟的 CLO 则仍需满足自留要求，这也是美欧 CLO 市场结构不同的原因之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>巴塞尔证券化框架按内部评级法、外部评级法和标准法计算各层资本，高级层有风险权重下限。<\/li>\n<li>欧盟 STS 标签给简单、透明、标准化的交易更低资本要求。<\/li>\n<li>风险自留要求发起人保留至少 5% 的经济利益，让它和投资者利益共担。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么监管要给 AAA 级的证券化高级层设置 15% 的风险权重下限，而不是像同评级的国债那样更低？<\/summary>\n<div><p>因为证券化产品的风险高度依赖模型假设，尤其是违约相关性和极端情景，2008 年已经证明 AAA 评级可能严重低估风险。分层还会集中尾部风险：平时几乎没有损失，出事时损失很大。设置下限是为模型风险和尾部风险留出余地，防止银行通过证券化把资本要求压得过低。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L6-29\"><\/a><\/li>\n<li><a href=\"#L25-7\"><\/a><\/li>\n<li><a href=\"#L11-22\"><\/a><\/li>\n<\/ul><\/div>\n","11.22":"<div class=\"scene\">\n<p>一家欧洲银行有一个 30 亿欧元的中小企业贷款组合。它想释放资本，但这些贷款涉及长期客户关系，卖掉会影响客户，借款人也可能不同意转让。于是银行换了个办法：贷款留在自己账上，只把其中一段信用风险“卖”给投资者，投资者获得保费，承担一部分损失。这就是<strong>合成证券化（synthetic securitisation）<\/strong>，监管上常称为<strong>重大风险转移（significant risk transfer，SRT）<\/strong>。<\/p>\n<\/div>\n\n<h2>合成证券化怎么做<\/h2>\n<ol>\n<li>银行选定一个贷款组合作为参考组合，贷款本身不转移。<\/li>\n<li>把参考组合的损失按层切分，通常银行自己保留最底下一小段首损层和最上面的大块高级层。<\/li>\n<li>中间的一段（夹层或首损附近的层）通过信用保护转给投资者，比如一份 CDS、一份金融担保，或者发行一只信用联结票据（CLN）。<\/li>\n<li>投资者每年收取保费。参考组合出现损失、穿透到这一层时，投资者赔付银行。<\/li>\n<\/ol>\n<p>用 CLN 时，投资者先把本金交给银行或 SPV，银行因此不用担心投资者到时赔不起，这叫“有资金支持”（funded）的保护。<\/p>\n\n<h2>为什么叫重大风险转移<\/h2>\n<p>只有转移了足够多的风险，监管才允许银行降低资本要求。欧洲央行等监管机构会审查交易：转出去的风险是否“重大”、有没有隐性的回购承诺或补偿安排。通过后，银行就可以按证券化框架计算资本，通常能释放可观的风险加权资产（RWA）。<\/p>\n\n<div class=\"desk\">\n<p>银行做 SRT 的核心计算是：每年付出的保费，和释放资本带来的收益（可以支持更多业务或提高资本回报率）相比是否划算。投资者主要是专门的信用基金、养老金和保险公司，它们要深入分析参考组合的历史表现和银行的放贷标准。风控关注交易的风险转移是否真实、对手方风险，以及到期或提前终止时资本会怎样变化。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1997 年，摩根大通推出 BISTRO 交易，被普遍视为第一笔现代合成证券化：银行保留贷款，用 CDS 把一个企业贷款组合的信用风险转给投资者。此后，欧洲银行成为 SRT 的主要使用者。2023 年 9 月，美联储发布答疑，明确满足条件的 CLN 结构可以获得资本减免，美国银行随后大幅增加了这类交易。监管也开始关注 SRT 的另一面：部分投资者通过向银行借钱来购买 SRT，风险可能又回到银行体系。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>合成证券化把贷款留在银行，只通过 CDS、担保或 CLN 把一段信用风险转给投资者。<\/li>\n<li>监管认定风险转移“重大”后，银行才能按证券化框架降低资本要求。<\/li>\n<li>它的核心是权衡保费成本和释放资本的收益，也要警惕风险以融资形式回流银行。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>银行在 SRT 中保留了最底下的首损层，只把它上面的一层卖给投资者。监管为什么不一定反对？银行保留首损层有什么好处？<\/summary>\n<div><p>只要卖出的那一层承担了大部分预期和非预期损失，风险转移仍然可以是“重大”的。银行保留首损层，自己承担最先发生的损失，表明它和投资者利益一致，有动力继续管好这些贷款，投资者也更愿意购买。首损层的资本要求很高，银行要在资本释放和利益共担之间权衡。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-37\"><\/a><\/li>\n<li><a href=\"#L11-21\"><\/a><\/li>\n<li><a href=\"#L16-24\"><\/a><\/li>\n<\/ul><\/div>\n","11.23":"<div class=\"scene\">\n<p>2008 年后，美国大约一半的住房贷款信用风险压在两家机构身上：房利美和房地美。它们由政府接管，相当于纳税人承担着几万亿美元房贷的违约风险。监管要求它们把一部分风险转给私人投资者。可是机构 MBS 的投资者早就习惯了“没有信用风险”，不想承担违约损失。办法是另设一类产品，专门把信用风险切出来卖。这就是<strong>信用风险转移（credit risk transfer，CRT）<\/strong>。<\/p>\n<\/div>\n\n<h2>CRT 怎样运作<\/h2>\n<p>两家机构仍然为机构 MBS 提供完全担保，MBS 投资者照常不承担信用风险。同时，它们挑选一个参考房贷池，就这个池子的信用损失发行特殊的债券或购买保险：<\/p>\n<ul>\n<li><strong>债券形式<\/strong>：房地美的 STACR 和房利美的 CAS。投资者买入债券，获得较高的浮动利率利息；参考池的违约损失超过一定程度时，债券本金被减记。<\/li>\n<li><strong>保险和再保险形式<\/strong>：把同样的风险分给保险和再保险公司。<\/li>\n<\/ul>\n<p>这和合成证券化很像：房贷本身不动，只转移一段信用风险。<\/p>\n\n<h2>谁在买<\/h2>\n<p>CRT 的投资者包括对冲基金、资产管理公司、保险公司和房地产投资信托（REIT）。它提供的是美国住房信用风险的纯粹敞口，利率风险很小（大多是浮动利率），对希望投资美国房地产信用的人很有吸引力。<\/p>\n\n<div class=\"desk\">\n<p>分析 CRT 债券，主要看参考池的贷款特征（信用分、贷款成数、地区分布）、各层的附着点和分离点，以及在不同房价情景下的预期损失。CRT 的价格对房价预期和失业率很敏感。对两家机构来说，CRT 降低了它们需要持有的资本，但也要权衡转移风险的成本。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2013 年 7 月，房地美发行了第一笔 STACR 交易，同年房利美推出 CAS。此后十年两家机构累计转移了数万亿美元房贷的部分信用风险。2020 年 3 月新冠疫情冲击时，市场担心大规模失业导致房贷违约，CRT 债券价格暴跌、利差大幅扩大。随后政府推出房贷延期还款计划，房价也持续上涨，实际损失远低于担忧，CRT 价格在一年内基本恢复。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>CRT 让房利美和房地美在继续担保 MBS 的同时，把一段信用风险转给私人投资者。<\/li>\n<li>形式包括 STACR、CAS 等信用债券，以及保险和再保险。<\/li>\n<li>它为投资者提供纯粹的美国住房信用敞口，价格对房价和失业率很敏感。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>2020 年 3 月，CRT 价格暴跌，但最终损失很小。如果一个投资者在暴跌时被迫卖出，另一个一直持有，结果有何不同？这说明了什么？<\/summary>\n<div><p>被迫卖出的投资者在低价锁定了巨大的损失；一直持有的投资者，在价格恢复后几乎没有损失，还收到了全部利息。这说明市场价格反映的是当时的恐慌和流动性，不一定等于最终信用损失。能否承受价格波动、是否有稳定的资金来源，决定了结果。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L11-22\"><\/a><\/li>\n<li><a href=\"#L11-6\"><\/a><\/li>\n<li><a href=\"#L11-18\"><\/a><\/li>\n<\/ul><\/div>\n","11.24":"<div class=\"scene\">\n<p>一只机构 MBS 和一只同期限国债相比，收益率高出 150 个基点。这 150 个基点里，多少是对投资者卖出提前还款期权的补偿，多少才是真正的“额外收益”？只看名义利差回答不了这个问题。MBS 市场用一个专门的指标来回答：<strong>期权调整利差（option-adjusted spread，OAS）<\/strong>，而计算它需要用到<strong>蒙特卡洛模拟（Monte Carlo simulation）<\/strong>。<\/p>\n<\/div>\n\n<h2>为什么 MBS 要用蒙特卡洛<\/h2>\n<p>MBS 的现金流取决于提前还款，而提前还款取决于利率走过的整条路径。比如，利率先降后升，很多借款人在低点已经再融资；利率先升后降，同样的终点利率，提前还款却少得多。这种路径依赖用二叉树很难处理，所以 MBS 估值几乎都用蒙特卡洛：<\/p>\n<ol>\n<li>用利率模型模拟几千条未来利率路径。<\/li>\n<li>在每条路径上，用提前还款模型算出每个月的提前还款和现金流。<\/li>\n<li>用这条路径上的利率加上一个固定的利差，把现金流折现。<\/li>\n<li>对所有路径取平均，得到模型价格。<\/li>\n<\/ol>\n\n<h2>OAS：调整掉期权以后的利差<\/h2>\n<p>不断调整第 3 步里加上的那个固定利差，直到模型价格等于市场价格，这个利差就是 OAS。因为每条路径都已经考虑了提前还款，OAS 被认为是去除了提前还款期权影响后的利差。<\/p>\n<p>和不考虑期权、只用一条曲线算出的 Z 利差相比：<\/p>\n<ul>\n<li><strong>期权成本（option cost）<\/strong> = Z 利差 − OAS，代表投资者卖出提前还款期权得到的补偿。<\/li>\n<li><strong>OAS<\/strong> 代表对信用、流动性和模型风险的补偿。投资者用它比较不同 MBS 的相对价值。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>OAS 高度依赖模型：同一只 MBS，不同交易商的利率模型、波动率假设和提前还款模型不同，算出的 OAS 可能差几十个基点。所以看 OAS 要知道是谁的模型、用什么假设。基于同样的模型还可以算出有效久期（effective duration）和有效凸性，它们才是 MBS 风险报告里使用的久期和凸性。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月新冠疫情引发市场抛售，连机构 MBS 这类几乎没有信用风险的资产也出现大幅下跌，OAS 迅速走阔，部分杠杆投资者被追加保证金后被迫卖出。3 月 15 日，美联储宣布至少购买 2,000 亿美元机构 MBS，3 月 23 日改为“按需购买”，不设上限。MBS 的 OAS 随后快速收窄。这说明 OAS 里除了期权以外，流动性和市场压力也占很大部分。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>MBS 现金流依赖利率路径，所以估值用蒙特卡洛模拟利率路径和提前还款。<\/li>\n<li>OAS 是让模型价格等于市场价格的利差，去除了提前还款期权的影响。<\/li>\n<li>Z 利差减 OAS 是期权成本，OAS 结果高度依赖模型假设。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两只 MBS 名义利差相同，一只 OAS 是 60 基点，另一只是 20 基点。哪只更“便宜”？为什么还要谨慎？<\/summary>\n<div><p>按模型，OAS 为 60 基点的那只更便宜：扣除提前还款期权后，它给出的补偿更多。但要谨慎，因为 OAS 依赖提前还款模型。如果模型低估了这只 MBS 的提前还款风险（比如借款人特征让它再融资更快），真实的期权成本更高，OAS 实际上被高估了。市场给它更高的 OAS，可能正是因为参与者不相信模型。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-45\"><\/a><\/li>\n<li><a href=\"#L9-37\"><\/a><\/li>\n<li><a href=\"#L11-16\"><\/a><\/li>\n<\/ul><\/div>\n","16.1":"<div class=\"scene\">\n<p>一家航空公司担心明年油价上涨，吃掉全部利润。它不想今天就买一年的燃油囤起来，只想把明年的油价“锁住”。于是它和一家银行签了一份合同：明年按每桶 80 美元结算，油价涨了银行补差价，跌了航空公司补差价。<\/p>\n<p>这份合同本身不是石油，它的价值完全取决于油价。这就是<strong>衍生品（derivative）<\/strong>：价格从另一样东西“衍生”出来的合约。<\/p>\n<\/div>\n\n<h2>衍生品买卖的是风险<\/h2>\n<p>衍生品的价值来自一个标的资产（underlying），可以是股票、债券、利率、汇率、商品、信用，甚至天气。交易衍生品，不需要真正买卖标的本身，买卖的只是和它价格变化相关的风险。<\/p>\n<p>所以衍生品有两个基本用途：<\/p>\n<ul>\n<li><strong>对冲（hedge）<\/strong>：把不想要的风险转给别人。航空公司对冲油价，出口商对冲汇率，银行对冲利率。<\/li>\n<li><strong>投机（speculate）<\/strong>：主动承担风险，赌价格的方向或波动。衍生品往往只需要少量保证金，就能获得很大的敞口，这叫杠杆（leverage）。<\/li>\n<\/ul>\n<p>同一份合约，一方可能在对冲，另一方可能在投机。衍生品市场就是风险从不想要它的人，流向愿意承担它的人。<\/p>\n\n<h2>四种基本形态<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>类型<\/th><th>一句话<\/th><th>双方义务<\/th><\/tr>\n<tr><td>远期（forward）<\/td><td>今天约定未来某天按某个价格买卖<\/td><td>双方都必须履约<\/td><\/tr>\n<tr><td>期货（futures）<\/td><td>标准化、在交易所交易的远期<\/td><td>双方都必须履约<\/td><\/tr>\n<tr><td>互换（swap）<\/td><td>双方定期交换两串现金流<\/td><td>双方都必须履约<\/td><\/tr>\n<tr><td>期权（option）<\/td><td>买方有权利、没有义务<\/td><td>只有卖方有义务<\/td><\/tr>\n<\/table><\/div>\n<p>市面上千奇百怪的衍生品，基本都是这四种的组合。<\/p>\n\n<h2>规模有多大<\/h2>\n<p>按名义本金（notional）算，全球场外衍生品存量有几百万亿美元，其中大部分是利率衍生品。名义本金只是用来计算支付的基数，并不是真的会转手的钱。真正衡量风险的，是合约的市值和敏感度。<\/p>\n\n<div class=\"desk\">\n<p>交易台上，衍生品几乎是每个产品线都离不开的工具：利率台用互换和期货管理 DV01，信用台用 CDS 管理 CS01，外汇台用远期和期权，股票台用期权和互换。风控看衍生品，关注三件事：市场风险（敏感度）、交易对手风险（对方会不会违约）、流动性风险（保证金要付多少现金）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>衍生品比你想的古老得多。17 世纪的大阪堂岛米市，商人已经在交易未来交割的大米合约，被视为最早有组织的期货市场之一。1848 年成立的芝加哥期货交易所（CBOT），最初也是为了让农民和粮商提前锁定谷物价格。直到 1970 年代，金融期货和期权才大规模出现，今天它们的交易量早已远超商品。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>衍生品的价值来自标的资产，交易的是风险本身。<\/li>\n<li>主要用途是对冲和投机，同一份合约两边的动机可能不同。<\/li>\n<li>四种基本形态：远期、期货、互换、期权；名义本金很大，但不等于真实风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家欧洲出口商三个月后会收到 1,000 万美元货款，担心美元贬值。它可以用哪种衍生品对冲？<\/summary>\n<div><p>最简单的是外汇远期：今天约定三个月后按某个汇率卖出 1,000 万美元换成欧元，锁定收入。如果它还想在美元升值时受益，可以买一个美元看跌期权，付出期权费，只防下跌、不封顶。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-2\"><\/a><\/li>\n<li><a href=\"#L16-26\"><\/a><\/li>\n<li><a href=\"#L24-20\"><\/a><\/li>\n<\/ul><\/div>\n","16.2":"<div class=\"scene\">\n<p>一个面包店老板和一个麦农在 3 月约好：9 月麦子收割后，按每吨 250 欧元成交，不管到时候市价是多少。这份约定就是一份<strong>远期合约（forward）<\/strong>。如果把它标准化，拿到交易所去，人人都能买卖，就成了<strong>期货（futures）<\/strong>。<\/p>\n<\/div>\n\n<h2>远期：一对一的约定<\/h2>\n<p>远期合约是双方私下签的：今天约定在未来某一天，按某个价格（远期价格，forward price）买卖一定数量的资产。条款可以量身定制：数量、日期、交割地点都能谈。<\/p>\n<ul>\n<li>约定买入的一方是多头（long），到期价格高于约定价就赚。<\/li>\n<li>约定卖出的一方是空头（short），到期价格低于约定价就赚。<\/li>\n<\/ul>\n<p>签约时双方都不付钱，合约价值为零。之后随着市价变化，一方赚、一方亏。最大的风险是对方到时候不履约，这叫交易对手风险（counterparty risk）。<\/p>\n\n<h2>期货：标准化的远期<\/h2>\n<p>期货把远期做成了标准化产品：<\/p>\n<ul>\n<li>在交易所交易，合约规格统一：数量、质量、到期月份都事先规定。<\/li>\n<li>交易对手是交易所的清算所（CCP），不用担心某个具体的对手违约。<\/li>\n<li>每天按市价结算盈亏，亏的一方要补保证金。<\/li>\n<li>随时可以平仓，大多数期货在到期前就被平掉，很少真正交割。<\/li>\n<\/ul>\n\n<h2>远期价格怎么定：持有成本<\/h2>\n<p>远期价格并不是对未来价格的猜测，而是由今天的现货价格加上“持有到那天的成本和收益”决定：<\/p>\n<ul>\n<li>加上资金成本：今天买现货要付钱，这笔钱本可以赚利息。<\/li>\n<li>加上储存成本：商品要仓储、保险。<\/li>\n<li>减去持有收益：股票的分红、债券的利息、手里有现货带来的便利（便利收益）。<\/li>\n<\/ul>\n<p>如果远期价格偏离这个关系，就有人可以无风险套利：比如远期太贵，就买现货、卖远期，到期交割，稳赚差价。这种套利会把价格拉回来。<\/p>\n\n<div class=\"desk\">\n<p>银行与企业客户之间的外汇远期、商品远期，是最常见的场外远期。交易所里交易量最大的期货包括股指期货（比如标普 500 期货）、国债期货、利率期货（比如 SOFR 期货）和原油期货。<\/p>\n<p>交易员说“期货升水”（contango）是远期价格高于现货，“期货贴水”（backwardation）是远期价格低于现货。前者在库存充足时常见，后者在现货紧张时常见。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2020 年 4 月 20 日，原油期货跌到负数。<\/strong>疫情让石油需求骤降，美国交割地库欣的储油罐快要装满。5 月到期的 WTI 原油期货在到期前一天收于每桶 −37.63 美元。持有多头合约、又没有地方储存原油的投资者，只能倒贴钱让别人接手。这个极端事件说明：期货最终是要交割实物的，储存成本可以大到让价格变成负数。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>远期是一对一定制的未来买卖约定，有交易对手风险。<\/li>\n<li>期货是标准化、在交易所交易、每天结算的远期，对手是清算所。<\/li>\n<li>远期价格由现货加持有成本决定，偏离就会被套利拉回。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>黄金现货每盎司 2,000 美元，一年期利率 5%，黄金没有利息，储存成本很低。一年期黄金远期价格大约是多少？如果市场报价 2,200 美元，你会怎么做？<\/summary>\n<div><p>大约 2,100 美元（2,000 × 1.05，忽略储存成本）。如果报价 2,200，远期太贵了：借钱买入现货黄金，同时卖出一年期远期，一年后交割收 2,200，还贷 2,100，赚约 100 美元。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-3\"><\/a><\/li>\n<li><a href=\"#L16-4\"><\/a><\/li>\n<li><a href=\"#L16-14\"><\/a><\/li>\n<li><a href=\"#L18-15\"><\/a><\/li>\n<\/ul><\/div>\n","16.3":"<div class=\"scene\">\n<p>你买了一份标普 500 期货，合约价值约 25 万美元，可你只付了 1.5 万美元。第二天指数下跌 2%，你的账户里少了 5,000 美元；交易所发来通知：今天下午之前补钱，不然强制平仓。这就是期货的<strong>保证金与每日结算<\/strong>。<\/p>\n<\/div>\n\n<h2>保证金：一份履约押金<\/h2>\n<p>买卖期货不需要付全款，只需要存一笔保证金（margin），作为履约的押金：<\/p>\n<ul>\n<li><strong>初始保证金（initial margin）<\/strong>：开仓时必须存入的金额，通常是合约价值的几个百分点，由清算所根据波动率设定。<\/li>\n<li><strong>维持保证金（maintenance margin）<\/strong>：账户里至少要保持的金额，低于它就要补钱。<\/li>\n<\/ul>\n<p>只付一小部分钱，就承担整份合约的涨跌，这是期货的杠杆。合约价值 25 万、保证金 1.5 万，相当于大约 17 倍杠杆，指数跌 6% 左右，保证金就亏光了。<\/p>\n\n<h2>每日结算：今天的盈亏今天付<\/h2>\n<p>期货每天收盘后按结算价重新计算盈亏，叫逐日盯市（mark-to-market）。赚的一方当天收到现金，亏的一方当天付出现金，这笔钱叫变动保证金（variation margin）。账户低于维持保证金时，就会收到追加保证金通知（margin call），必须在规定时间内补足，否则清算会员可以强制平仓。<\/p>\n<p>每日结算的好处是：亏损每天清零，不会越积越多，清算所面临的风险很小。代价是：即使你判断最终是对的，中途的亏损也必须马上用现金支付。<\/p>\n\n<h2>交割：真的要买卖实物吗<\/h2>\n<p>到期时有两种方式：<\/p>\n<ul>\n<li><strong>实物交割（physical delivery）<\/strong>：卖方交出实物，比如原油、国债，买方付钱。<\/li>\n<li><strong>现金交割（cash settlement）<\/strong>：只按到期价格结算差额，比如股指期货。<\/li>\n<\/ul>\n<p>绝大多数期货在到期前就被平仓或展期到下一个月份，真正交割的只是一小部分。但交割机制保证了期货价格到期时会和现货价格收敛。<\/p>\n\n<div class=\"desk\">\n<p>对一家机构来说，期货仓位的风险不只是市场风险，还有流动性风险：市场剧烈波动时，变动保证金可能一天就要付出大量现金。风控和资金部（treasury）要预测在压力情景下可能需要支付的保证金，提前准备好现金或合格抵押品。<\/p>\n<p>清算所在市场波动加大时还会提高初始保证金要求，进一步消耗现金。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月，全球市场暴跌，波动率飙升，各大清算所大幅提高了期货和场外清算衍生品的保证金要求。很多基金和企业突然需要拿出大量现金，只能卖出手里最容易卖的资产，包括美国国债，这也加剧了那段时间的“现金荒”。2022 年欧洲能源危机中，电力和天然气期货的保证金要求同样暴涨，一些能源公司因此需要政府提供流动性支持。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>期货只需存入保证金，带来杠杆；保证金分初始和维持两种。<\/li>\n<li>每天按收盘价结算盈亏，亏损当天要用现金补，叫变动保证金。<\/li>\n<li>期货风险不只是价格，还有在波动中突然要付大量现金的流动性风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家航空公司用原油期货对冲燃油成本。油价突然暴跌 40%。从全年来看，它的对冲有效吗？短期内会遇到什么麻烦？<\/summary>\n<div><p>全年来看是有效的：期货亏钱，但买燃油便宜了，两者大致抵消。短期麻烦在于现金：期货的亏损要每天用现金付变动保证金，而便宜燃油带来的节省要等以后买油时才慢慢体现。公司可能突然需要大量现金，这就是对冲中的流动性风险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-2\"><\/a><\/li>\n<li><a href=\"#L17-12\"><\/a><\/li>\n<li><a href=\"#L10-7\"><\/a><\/li>\n<\/ul><\/div>\n","16.4":"<div class=\"scene\">\n<p>一家美国航空公司想对冲航空煤油的价格，但市场上没有流动性好的航空煤油期货。它只能用原油期货来对冲。问题是，航空煤油和原油的价格虽然大致同涨同跌，但并不完全一致。这个“不完全一致”，就是<strong>基差风险（basis risk）<\/strong>。<\/p>\n<\/div>\n\n<h2>用期货对冲的基本思路<\/h2>\n<p>手里有一样东西怕价格跌，就卖出期货（空头对冲，short hedge）；将来要买一样东西怕价格涨，就买入期货（多头对冲，long hedge）。价格变动时，现货的损失被期货的收益抵消，反之亦然。<\/p>\n<ul>\n<li>农民担心收获时粮价下跌：卖出粮食期货。<\/li>\n<li>航空公司担心油价上涨：买入原油期货。<\/li>\n<li>债券基金担心利率上升：卖出国债期货。<\/li>\n<li>股票基金担心市场下跌：卖出股指期货。<\/li>\n<\/ul>\n\n<h2>基差：现货和期货的差<\/h2>\n<p>基差（basis）= 现货价格 − 期货价格。如果基差一直不变，对冲就是完美的：现货亏多少，期货就赚多少。但基差会变，原因包括：<\/p>\n<ul>\n<li><strong>品种不同<\/strong>：对冲的东西和期货的标的不一样，比如航空煤油对原油、公司债对国债期货。<\/li>\n<li><strong>时间不同<\/strong>：对冲结束的日子和期货到期日不一样，平仓时基差不确定。<\/li>\n<li><strong>地点和质量不同<\/strong>：比如期货交割地的原油和你所在地的原油价格不同。<\/li>\n<\/ul>\n<p>对冲之后，价格风险被换成了基差风险。基差风险通常小得多，但不会消失。<\/p>\n\n<h2>对冲比例：买卖多少份期货<\/h2>\n<p>对冲多少份合约，不一定是一比一。要看两者价格变动的比例：<\/p>\n<ul>\n<li>股票组合用股指期货对冲，要乘以组合的贝塔（beta）：组合波动比指数大 20%，就要多卖 20% 的期货。<\/li>\n<li>债券用国债期货对冲，要让两边的 DV01 相等。<\/li>\n<li>不同商品之间，用历史数据估计最优对冲比例（minimum variance hedge ratio）。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>风控评估一个对冲后的仓位，不能只看“对冲比例 100%”就认为没有风险。要单独衡量基差风险：在历史情景和压力情景下，现货和对冲工具的价格差会怎么变。风险报告里常把它单列为基差风险或残余风险（residual risk）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>1993 年德国金属公司（Metallgesellschaft）。<\/strong>它的美国子公司向客户承诺未来十年按固定价格供应石油产品，再用短期原油期货滚动对冲。1993 年油价下跌，期货端每天要付出大量变动保证金，而长期合约的收益要很多年后才实现；同时期货曲线从贴水变成升水，每次展期都要亏钱。最终母公司决定平仓，损失超过 10 亿美元。这个案例同时展示了基差风险、展期风险和对冲带来的流动性压力。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>怕跌就卖期货，怕涨就买期货，用期货的盈亏抵消现货的盈亏。<\/li>\n<li>基差是现货与期货的价差，基差变动带来基差风险，对冲后风险变小但不会消失。<\/li>\n<li>对冲比例要按贝塔、DV01 或历史关系来定，不一定是一比一。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个公司债组合用国债期货对冲了全部 DV01。市场恐慌时，国债上涨、公司债下跌。这个对冲为什么会失效？<\/summary>\n<div><p>因为国债期货只对冲了利率风险，没对冲信用利差风险。恐慌时国债收益率下降，期货空头亏钱；公司债利差走阔，现货也亏钱。两边一起亏。这是对冲工具和被对冲资产之间的基差（这里就是信用利差）带来的风险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-3\"><\/a><\/li>\n<li><a href=\"#L9-39\"><\/a><\/li>\n<li><a href=\"#L9-38\"><\/a><\/li>\n<\/ul><\/div>\n","16.5":"<div class=\"scene\">\n<p>一家公司知道半年后要借 1,000 万美元，借三个月。它担心到时候利率比现在高。能不能今天就把半年后那三个月的利率锁住？可以，用一份<strong>远期利率协议（forward rate agreement，FRA）<\/strong>。<\/p>\n<\/div>\n\n<h2>FRA：锁定未来某段时间的利率<\/h2>\n<p>FRA 是双方约定：在未来某段时间（比如 6 个月后开始、为期 3 个月），按一个固定利率计算利息。到时候和市场实际利率比较，只交换差额，不交换本金。<\/p>\n<ul>\n<li>买方（锁定借款利率的一方）：到时市场利率高于约定利率，收到差额；低于约定利率，付出差额。<\/li>\n<li>卖方：正好相反。<\/li>\n<\/ul>\n<p>这样，无论半年后利率怎么变，公司的实际借款成本都被锁定在约定利率附近。<\/p>\n<p>FRA 的命名方式是“6×9”：6 个月后开始、9 个月后结束，也就是 6 个月后那 3 个月的利率。<\/p>\n\n<h2>FRA 的价格从哪来<\/h2>\n<p>FRA 的约定利率，就是今天收益率曲线上隐含的远期利率。如果 6 个月利率 4%、9 个月利率 4.2%，那么“6 个月后的 3 个月”利率大约是 4.5%：先借 6 个月、再借 3 个月，结果应该和直接借 9 个月差不多。<\/p>\n\n<h2>FRA、利率期货和利率互换的关系<\/h2>\n<p>三者是一家人：<\/p>\n<ul>\n<li><strong>利率期货<\/strong>（比如三个月 SOFR 期货）：标准化、在交易所交易的 FRA。<\/li>\n<li><strong>FRA<\/strong>：场外定制的单期利率锁定。<\/li>\n<li><strong>利率互换<\/strong>：可以看成一连串 FRA 打包在一起，锁定未来很多期的利率。<\/li>\n<\/ul>\n<p>LIBOR 退出后，美元市场的 FRA 用得少了，短期利率风险主要通过 SOFR 期货和隔夜指数互换（OIS）管理；其他货币仍在使用 FRA。<\/p>\n\n<div class=\"desk\">\n<p>利率交易员经常用一串 FRA 或短期利率期货，表达对央行未来几次议息会议的判断。把这些远期利率连起来，就能看出市场“定价”了几次加息或降息。风险报告里，这类短期工具的 DV01 会落在 1 年以内的分桶里。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>LIBOR 曾是 FRA 和大量衍生品的基准利率。2012 年起，多家国际银行被查出操纵 LIBOR 报价，合计被罚数十亿美元。此后监管机构推动用基于真实交易的利率（美元的 SOFR、英镑的 SONIA、欧元的 €STR）替代 LIBOR。美元 LIBOR 的主要期限在 2023 年 6 月底停止公布，FRA 和互换市场也随之完成了基准切换。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>FRA 锁定未来某段时间的利率，到期只交换利息差额，不交换本金。<\/li>\n<li>FRA 的约定利率就是今天曲线隐含的远期利率。<\/li>\n<li>利率期货是标准化的 FRA，利率互换是一串 FRA 的组合。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司买入了一份 3×6 FRA，约定利率 4%。三个月后，市场三个月期利率是 4.5%。公司是收钱还是付钱？它的实际借款成本是多少？<\/summary>\n<div><p>公司收钱：市场利率高于约定利率，按 0.5 个百分点的差额收到补偿（按名义本金和三个月期限计算）。公司在市场上按 4.5% 借钱，加上收到的补偿，实际借款成本约为 4%，正好是当初锁定的水平。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-8\"><\/a><\/li>\n<li><a href=\"#L16-6\"><\/a><\/li>\n<li><a href=\"#L16-7\"><\/a><\/li>\n<li><a href=\"#L10-8\"><\/a><\/li>\n<\/ul><\/div>\n","16.6":"<div class=\"scene\">\n<p>一家公司五年前借了一笔浮动利率贷款，每季度按 SOFR 加点付息。现在它担心利率上涨，想把利息固定下来，但不想提前还贷款重新借。办法是和银行做一笔<strong>利率互换（interest rate swap）<\/strong>：公司每季度付给银行固定利率，银行付给公司浮动利率。两边一抵，公司的贷款就变成了固定利率。<\/p>\n<\/div>\n\n<h2>交换的是利息，不是本金<\/h2>\n<p>利率互换是双方约定，在一段时间内，按同一个名义本金（notional），定期交换两种利息：<\/p>\n<ul>\n<li><strong>固定端（fixed leg）<\/strong>：按约定的固定利率（互换利率，swap rate）付息。<\/li>\n<li><strong>浮动端（floating leg）<\/strong>：按某个浮动基准利率（SOFR、€STR、EURIBOR 等）付息。<\/li>\n<\/ul>\n<p>本金不交换，只用来计算利息；实际支付时通常只付两者的差额。<\/p>\n<p>付固定、收浮动的一方叫“付固定”（payer）；收固定、付浮动的一方叫“收固定”（receiver）。<\/p>\n\n<h2>互换的利率风险，像一只债券<\/h2>\n<p>收固定、付浮动，相当于持有一只固定利率债券、同时借浮动利率的钱买它。所以：<\/p>\n<ul>\n<li><strong>收固定<\/strong>：利率下降时赚钱，像多头债券，DV01 为“多头”方向。<\/li>\n<li><strong>付固定<\/strong>：利率上升时赚钱，像空头债券。<\/li>\n<\/ul>\n<p>签约时互换利率定在让双方价值相等的水平，合约价值为零。之后市场利率变化，一方的合约就有了正价值，另一方是负价值。<\/p>\n\n<h2>谁在用互换<\/h2>\n<ul>\n<li><strong>企业<\/strong>：把浮动利率债务换成固定，或者反过来。<\/li>\n<li><strong>银行<\/strong>：管理资产负债的利率错配，比如发放了固定利率房贷、吸收的是浮动利率存款。<\/li>\n<li><strong>养老金和保险公司<\/strong>：收固定，拉长资产的久期，匹配长期负债。<\/li>\n<li><strong>投资者和交易员<\/strong>：用互换表达对利率的看法，或对冲债券的利率风险。<\/li>\n<\/ul>\n<p>利率互换是全球规模最大的衍生品，名义本金以数百万亿美元计。<\/p>\n\n<div class=\"desk\">\n<p>交易员报互换，一般直接报互换利率：“5 年期 SOFR 互换 3.85%”。互换利率减同期限国债收益率，叫互换利差（swap spread），它反映银行信用、国债供求、资本成本等因素，本身也是一个交易品种。<\/p>\n<p>2008 年以后，大部分标准化的利率互换都必须通过清算所（比如 LCH）集中清算，双方每天交换变动保证金，交易对手风险大大降低。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>英国的负债驱动投资（LDI）大量使用利率互换：养老金通过收固定、付浮动，增加资产的利率敏感度，用来对冲负债。2022 年 9 月英国国债收益率暴涨时，这些收固定互换出现巨额浮亏，养老金必须在几天内交出大量现金作为保证金，只能被迫卖出国债，又推高了收益率。互换本身对冲了利率风险，但保证金要求把它变成了流动性危机。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>利率互换是按名义本金定期交换固定利息和浮动利息，本金不交换。<\/li>\n<li>收固定像持有债券（利率下降赚钱），付固定像做空债券（利率上升赚钱）。<\/li>\n<li>企业、银行、养老金和交易员都用互换管理或表达利率风险；大部分已集中清算。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行发放了大量 10 年期固定利率房贷，资金来自活期存款（利率随市场变）。它担心什么风险？可以怎样用利率互换对冲？<\/summary>\n<div><p>担心利率上升：存款成本上升，房贷收入却固定，利差被压缩，房贷的市值也下降。可以做付固定、收浮动的利率互换：利率上升时，互换收到的浮动利息增加，弥补存款成本的上升。这就把固定利率资产“变成”了浮动利率资产。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-5\"><\/a><\/li>\n<li><a href=\"#L16-7\"><\/a><\/li>\n<li><a href=\"#L9-39\"><\/a><\/li>\n<li><a href=\"#L16-44\"><\/a><\/li>\n<\/ul><\/div>\n","16.7":"<div class=\"scene\">\n<p>市场每天都在问：央行下次开会会加息还是降息？年底前一共会降几次？有一种互换，几乎就是专门回答这个问题的工具，叫<strong>隔夜指数互换（overnight index swap，OIS）<\/strong>。<\/p>\n<\/div>\n\n<h2>OIS：固定利率换“隔夜利率的平均”<\/h2>\n<p>OIS 的浮动端，用的是一段时间内每天的隔夜利率复利计算出来的平均值，比如美元的 SOFR、欧元的 €STR、英镑的 SONIA。固定端是约定的 OIS 利率。<\/p>\n<p>隔夜利率几乎完全由央行的政策利率决定，所以一个 3 个月期 OIS 的利率，基本就是市场对未来三个月平均政策利率的预期。把不同期限、或者覆盖不同央行会议日期的 OIS 排在一起，就能读出市场定价的加息或降息路径。<\/p>\n\n<h2>OIS 也是折现的基准<\/h2>\n<p>2008 年以前，衍生品普遍用 LIBOR 曲线折现。危机中银行间信用风险暴涨，LIBOR 和隔夜利率之间的差距一度扩大到几个百分点，大家意识到 LIBOR 含有银行信用风险。此后，有抵押品担保的衍生品改用 OIS 曲线折现，因为抵押品的利息通常按隔夜利率计算。这就是“OIS 折现”。<\/p>\n<p>LIBOR 退出后，美元互换市场的主流已经是 SOFR OIS，它本身就是新的“标准利率互换”。<\/p>\n\n<h2>基差互换：两种浮动利率交换<\/h2>\n<p>基差互换（basis swap）的两端都是浮动利率，只是基准不同，比如：<\/p>\n<ul>\n<li>3 个月 EURIBOR 对 €STR：反映银行间无担保借款相对隔夜利率的溢价。<\/li>\n<li>1 个月期限对 3 个月期限的同一种利率：反映不同期限之间的差异。<\/li>\n<li>两种货币之间的利率交换（交叉货币基差互换，下一课讲）。<\/li>\n<\/ul>\n<p>基差互换的价格是一个利差，比如“+12bp”，表示一端要在利率之上多付 12bp。<\/p>\n\n<div class=\"desk\">\n<p>风险系统里，同一种货币往往有好几条曲线：OIS 折现曲线、各期限的预测曲线。曲线之间的利差变化就是基差风险，在风险报告里单独列出“基差 DV01”。一个看起来利率风险已经对冲好的组合，可能因为两端用了不同的基准，留下明显的基差风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机前，美元 3 个月 LIBOR 和同期限 OIS 之间的利差（LIBOR-OIS spread）通常不到 0.1 个百分点。雷曼倒闭后，这个利差在 2008 年 10 月一度超过 3.5 个百分点，银行之间几乎不敢互相借钱。从那以后，LIBOR-OIS 利差成了衡量银行体系压力的重要指标，也推动了整个衍生品定价体系从 LIBOR 转向 OIS。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>OIS 用隔夜利率的复利平均作浮动端，几乎直接反映市场对央行政策路径的预期。<\/li>\n<li>有抵押的衍生品用 OIS 曲线折现；LIBOR 退出后，OIS 成了主流的利率互换。<\/li>\n<li>基差互换交换两种不同的浮动利率，曲线之间的利差变化构成基差风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>央行下周开会。今天 1 个月期 OIS 利率比当前政策利率低 20bp。市场在预期什么？<\/summary>\n<div><p>市场大概率预期下周降息。粗略看，如果降息 25bp 发生在这一个月里的早期，一个月的平均利率会比现在低 20bp 左右。所以低 20bp 意味着市场几乎完全定价了一次 25bp 的降息。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-6\"><\/a><\/li>\n<li><a href=\"#L16-8\"><\/a><\/li>\n<li><a href=\"#L10-8\"><\/a><\/li>\n<li><a href=\"#L16-44\"><\/a><\/li>\n<\/ul><\/div>\n","16.8":"<div class=\"scene\">\n<p>一家日本公司要在美国建工厂，需要美元。它在日本借日元很便宜，在美国借美元却不太容易。办法是：在日本借日元，再和银行做一笔<strong>交叉货币互换（cross-currency swap）<\/strong>，把日元换成美元用，期间付美元利息、收日元利息，到期再把本金换回来。<\/p>\n<\/div>\n\n<h2>交叉货币互换：交换两种货币的本金和利息<\/h2>\n<p>和普通利率互换不同，交叉货币互换会交换本金：<\/p>\n<ol>\n<li><strong>开始时<\/strong>：按当时的汇率交换本金，比如日本公司给出 150 亿日元，收到 1 亿美元。<\/li>\n<li><strong>期间<\/strong>：日本公司付美元利息，收日元利息。<\/li>\n<li><strong>到期时<\/strong>：按开始时的同一个汇率把本金换回来。<\/li>\n<\/ol>\n<p>这样，日本公司相当于借到了美元，汇率风险也被锁定：无论这几年日元怎么变，到期都按原汇率换回。<\/p>\n\n<h2>交叉货币基差：借美元的额外价格<\/h2>\n<p>按理论，用日元换美元借几年，成本应该和直接借美元一样，由两国利差决定。但现实中，大家都想借美元，美元供不应求，借美元的一方要多付一点。这个额外的价格叫交叉货币基差（cross-currency basis），通常以“非美元货币利率 + 某个负利差”的形式报价，比如日元对美元 −30bp。<\/p>\n<p>基差越负，说明借美元越紧张。市场动荡时，全球争抢美元，基差会急剧走负。<\/p>\n\n<h2>谁在用<\/h2>\n<ul>\n<li><strong>跨国企业<\/strong>：在一种货币融资，在另一种货币投资。<\/li>\n<li><strong>发行人<\/strong>：在别国发债后换回本币，比如欧洲公司发美元债、再换成欧元。<\/li>\n<li><strong>投资者<\/strong>：日本、欧洲的保险公司买美国债券，用货币互换对冲汇率风险。<\/li>\n<li><strong>央行<\/strong>：美联储与其他央行之间的美元互换额度，本质上也是交叉货币互换。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>交叉货币互换的风险包括两种货币的利率 DV01、交叉货币基差风险，以及汇率风险（因为期末要按原汇率换回本金，合约的市值随汇率大幅波动）。由于有本金交换，交易对手风险也比普通利率互换大得多，常需要定期按汇率重置本金（mark-to-market cross-currency swap）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月疫情爆发，全球企业和金融机构争抢美元，多种货币对美元的交叉货币基差急剧走负。3 月 15 日和 19 日，美联储先后扩大了和多家央行的美元互换额度，让这些央行可以把美元借给本国银行。几周之内，基差恢复正常。这说明交叉货币基差是观察全球美元紧张程度的“温度计”。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>交叉货币互换交换两种货币的本金和利息，到期按原汇率换回本金。<\/li>\n<li>交叉货币基差是借美元的额外价格，越负说明美元越紧张。<\/li>\n<li>它带有两种货币的利率风险、基差风险、汇率风险和较大的交易对手风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家欧洲保险公司买了美国国债，用交叉货币互换把美元收益换回欧元。如果欧元对美元的交叉货币基差变得更负，对它的对冲后收益有什么影响？<\/summary>\n<div><p>收益会下降。保险公司在互换开始时用欧元换入美元去买美债，相当于借入美元、借出欧元；期间它收到的欧元利息，要按欧元利率加上（负的）基差来算。基差更负，收到的欧元利息更少，对冲后的欧元收益就更低。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-7\"><\/a><\/li>\n<li><a href=\"#L10-9\"><\/a><\/li>\n<li><a href=\"#L18-25\"><\/a><\/li>\n<li><a href=\"#L7-13\"><\/a><\/li>\n<\/ul><\/div>\n","16.9":"<div class=\"scene\">\n<p>一家英国养老金每年要付给退休人员的钱，会随通胀上调。通胀越高，负担越重。它想把这个风险转出去：找一个愿意承担通胀风险的人，自己付一个固定数，对方付实际通胀。这就是<strong>通胀互换（inflation swap）<\/strong>。<\/p>\n<\/div>\n\n<h2>交换固定通胀和实际通胀<\/h2>\n<p>最常见的是零息通胀互换（zero-coupon inflation swap）：到期时一次性结算。<\/p>\n<ul>\n<li>一方付按约定固定通胀率（比如每年 2.5%）累积的金额。<\/li>\n<li>另一方付按实际通胀指数（比如英国零售物价指数 RPI、美国 CPI、欧元区 HICP）累积的金额。<\/li>\n<\/ul>\n<p>如果实际通胀高于 2.5%，收实际通胀的一方赚钱；低于 2.5%，付实际通胀的一方赚钱。<\/p>\n<p>约定的固定通胀率，就是市场对这段时间平均通胀的定价，和通胀挂钩债推出的盈亏平衡通胀很接近。<\/p>\n\n<h2>谁在两边<\/h2>\n<ul>\n<li><strong>想要通胀保护的<\/strong>：养老金（负债随通胀上升）、某些保险公司，收实际通胀。<\/li>\n<li><strong>天然有通胀收入的<\/strong>：收入和通胀挂钩的公司，比如受监管的公用事业、收费公路、物业租金按通胀调整的房地产公司，付实际通胀、收固定。<\/li>\n<li><strong>交易员和投资者<\/strong>：表达对通胀的看法。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>通胀互换的主要风险是通胀敏感度（Inflation01）：通胀预期上升 1bp，仓位赚亏多少。通胀指数有公布滞后（通常两三个月），合约里规定了用哪个月份的指数，这会产生季节性等细节风险。风险报告里，通胀风险按期限分桶，和名义利率的 DV01 分开列示。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年起全球通胀上升，英国 RPI 通胀在 2022 年 10 月达到 14% 以上。在这之前收实际通胀的投资者获得了大笔收益。与此同时，英国的通胀互换市场以 RPI 为基准，而英国政府决定从 2030 年起把 RPI 的计算方法改为向 CPIH 靠拢。这项改革直接影响了大量 RPI 挂钩合约的价值，是通胀衍生品特有的“指数定义风险”。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>通胀互换交换固定通胀率和实际通胀，最常见的是到期一次结算的零息通胀互换。<\/li>\n<li>约定的固定通胀率就是市场对未来通胀的定价，和盈亏平衡通胀接近。<\/li>\n<li>养老金收实际通胀买保护，收入挂钩通胀的公司付实际通胀；风险看 Inflation01。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家收费公路公司每年可以按通胀上调收费。它为什么可能愿意在通胀互换里付实际通胀、收固定？<\/summary>\n<div><p>它的收入天然随通胀上升，付出实际通胀正好被收入的增长抵消，等于把一部分不确定的通胀收入换成确定的固定收入，让现金流更稳定，也可以降低融资成本。对它来说，这是在对冲，而不是投机。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-22\"><\/a><\/li>\n<li><a href=\"#L24-23\"><\/a><\/li>\n<li><a href=\"#L21-20\"><\/a><\/li>\n<\/ul><\/div>\n","16.10":"<div class=\"scene\">\n<p>一家对冲基金想持有 10 亿美元的某只股票，但不想真的买入：不想占用这么多现金，也不想在股东名册上露面。它可以找一家银行：“这只股票的涨跌和分红都给我，我付你一个融资利率。”银行买入股票对冲，基金拿到了股票的全部经济利益。这就是<strong>总收益互换（total return swap，TRS）<\/strong>。<\/p>\n<\/div>\n\n<h2>总收益互换：把资产的全部回报换给别人<\/h2>\n<p>总收益互换的一方（收益支付方，通常是银行）把某个资产的全部回报付给另一方：价格涨跌，加上分红或利息。另一方（收益接收方）付一个融资利率，比如 SOFR 加若干基点。<\/p>\n<p>标的可以是一只股票、一篮子股票、一个指数、一只债券或一组贷款。对接收方来说，效果和借钱买入资产几乎一样，但：<\/p>\n<ul>\n<li>不需要全额出钱，只交保证金，杠杆很高。<\/li>\n<li>资产登记在银行名下，接收方不直接持有。<\/li>\n<li>可能有税务或监管上的不同处理。<\/li>\n<\/ul>\n<p>以股票为标的的总收益互换，常叫股票互换（equity swap）。<\/p>\n\n<h2>差价合约：给个人投资者的版本<\/h2>\n<p>差价合约（contract for difference，CFD）是面向个人投资者的类似产品：投资者和券商约定，按开仓和平仓时的价格差结算，期间按持仓付融资费用。英国、欧洲、澳洲很常见，美国则基本不允许向散户提供。CFD 的杠杆很高，监管机构多次警告，大部分散户账户最终是亏钱的。<\/p>\n\n<h2>风险藏在哪里<\/h2>\n<ul>\n<li><strong>杠杆和集中度<\/strong>：少量保证金撬动巨大敞口。<\/li>\n<li><strong>交易对手风险<\/strong>：银行和客户互相承担对方违约的风险。<\/li>\n<li><strong>透明度<\/strong>：通过互换持有的大量股份，可能不需要像直接持股那样公开披露，市场和监管者都看不到全貌。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>银行的股票融资（equity finance）和主经纪业务（prime brokerage）大量提供股票互换。风控要看的是：每个客户的总敞口、对单一股票的集中度、保证金是否足够覆盖剧烈下跌，以及同一个客户是否在多家银行都有类似的仓位。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2021 年 3 月 Archegos 爆仓。<\/strong>家族办公室 Archegos Capital 通过多家银行的总收益互换，在少数几只股票（比如 ViacomCBS）上建立了数倍杠杆的巨大仓位。由于是互换，各家银行只看到自己那一部分，不知道它在别处也有同样的仓位。股价下跌后它无法追加保证金，各银行争相抛售对冲用的股票。先卖的银行损失较小，瑞信损失约 55 亿美元，野村约 28 亿美元。这件事暴露了互换带来的不透明和集中度风险，此后美国证监会提出要求，加强对大额证券互换仓位的披露。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>总收益互换把资产的全部回报换给对方，对方付融资利率，效果像高杠杆买入资产。<\/li>\n<li>股票互换和差价合约是它在股票和散户市场的版本。<\/li>\n<li>风险在于杠杆、集中度、交易对手和不透明，Archegos 是典型案例。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>Archegos 爆仓时，为什么“先卖的银行”损失较小？这对风险管理有什么启示？<\/summary>\n<div><p>因为大家手里都有同样的股票要卖，先卖的人能以较高的价格卖出，后卖的人面对的是已经被砸低的价格。启示是：同一客户在多家银行的集中仓位，会让所有银行在出事时同时被迫卖出；风控要关注客户的整体杠杆，并在违约时迅速行动，事先约定好保证金和平仓条款。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-6\"><\/a><\/li>\n<li><a href=\"#L10-24\"><\/a><\/li>\n<li><a href=\"#L17-21\"><\/a><\/li>\n<\/ul><\/div>\n","16.11":"<div class=\"scene\">\n<p>你看中了一套房子，卖家开价 500 万。你还没决定买，但又怕被别人抢走。你和卖家商量：“我先付 5 万定金，三个月内我有权按 500 万买下；如果我不买，定金归你。”三个月后，如果房价涨到 600 万，你按 500 万买下，赚了；如果跌到 400 万，你放弃，只损失 5 万定金。<\/p>\n<p>你买的这个“权利”，就是一份<strong>期权（option）<\/strong>。<\/p>\n<\/div>\n\n<h2>权利，而不是义务<\/h2>\n<p>期权给买方一个权利：在约定的时间（或之前），按约定的价格买入或卖出某样东西。买方可以用这个权利，也可以放弃。为了得到这个权利，买方要付给卖方一笔钱，叫期权费（premium）。<\/p>\n<ul>\n<li><strong>看涨期权（call）<\/strong>：按约定价格买入的权利。标的价格涨得越多，越值钱。<\/li>\n<li><strong>看跌期权（put）<\/strong>：按约定价格卖出的权利。标的价格跌得越多，越值钱。<\/li>\n<\/ul>\n<p>约定的价格叫执行价（strike price），约定的日期叫到期日（expiry）。<\/p>\n\n<h2>买方和卖方的处境完全不同<\/h2>\n<div class=\"tbl\"><table>\n<tr><th><\/th><th>买方（long）<\/th><th>卖方（short，也叫 writer）<\/th><\/tr>\n<tr><td>付或收<\/td><td>付期权费<\/td><td>收期权费<\/td><\/tr>\n<tr><td>最大损失<\/td><td>期权费<\/td><td>可能非常大（卖看涨理论上无限）<\/td><\/tr>\n<tr><td>最大收益<\/td><td>可能非常大<\/td><td>期权费<\/td><\/tr>\n<tr><td>义务<\/td><td>没有<\/td><td>买方行权时必须履约<\/td><\/tr>\n<\/table><\/div>\n<p>买期权像买保险：花一点小钱，防一件可能发生的大事。卖期权像卖保险：平时收保费，出事时要赔一大笔。<\/p>\n\n<h2>期权的两大用途<\/h2>\n<ul>\n<li><strong>保护<\/strong>：持有股票的人买看跌期权，股价跌破执行价时可以按执行价卖出，锁住最大损失。<\/li>\n<li><strong>表达观点<\/strong>：看好一只股票，买看涨期权，只花期权费就能分享上涨，最多亏掉期权费。<\/li>\n<\/ul>\n<p>期权的标的可以是股票、指数、汇率、利率、商品、期货，甚至信用（CDS 期权）。<\/p>\n\n<div class=\"desk\">\n<p>交易台上，期权的报价常常不报价格，而报隐含波动率：“3 个月平值看涨，22 个 vol”。因为期权价格会随标的价格和时间不断变化，隐含波动率更稳定，更方便比较。<\/p>\n<p>风控看期权仓位，不能只看名义本金，要看希腊字母：Delta（标的动一点赚亏多少）、Gamma、Vega、Theta。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1973 年 4 月，芝加哥期权交易所（CBOE）成立，第一次把股票期权标准化、集中在交易所交易。同一年，布莱克和斯科尔斯发表了期权定价公式。在此之前，期权只是零散的场外交易，价格全凭感觉。标准化合约加上定价模型，让期权市场在之后几十年迅速成长为全球交易量最大的金融市场之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>期权给买方一个权利而不是义务：看涨是买的权利，看跌是卖的权利。<\/li>\n<li>买方付期权费、最多亏期权费；卖方收期权费、可能亏很多。<\/li>\n<li>期权用来保护或表达观点，风险要用希腊字母来看。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>你持有一只股票，现价 100 元，担心未来三个月大跌，又不想卖掉。可以用期权怎么做？代价是什么？<\/summary>\n<div><p>买一个三个月期、执行价比如 95 元的看跌期权。股价跌破 95 时，你可以按 95 卖出，损失被锁定在 5 元加上期权费。代价是期权费：如果股价没跌，这笔钱就白花了，像买了一份没用上的保险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-12\"><\/a><\/li>\n<li><a href=\"#L16-13\"><\/a><\/li>\n<li><a href=\"#L16-17\"><\/a><\/li>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<\/ul><\/div>\n","16.12":"<div class=\"scene\">\n<p>一只股票现价 100 元。你手里有三个看涨期权，执行价分别是 80、100、120。如果今天就到期，第一个马上能赚 20 元，第二个刚好不赚不亏，第三个一文不值。交易员用三个词来描述它们：<strong>价内、平值、价外<\/strong>。<\/p>\n<\/div>\n\n<h2>三种状态<\/h2>\n<p>用“如果现在马上行权，有没有钱赚”来区分：<\/p>\n<div class=\"tbl\"><table>\n<tr><th>状态<\/th><th>看涨期权（call）<\/th><th>看跌期权（put）<\/th><\/tr>\n<tr><td>价内（in the money，ITM）<\/td><td>标的价格 &gt; 执行价<\/td><td>标的价格 &lt; 执行价<\/td><\/tr>\n<tr><td>平值（at the money，ATM）<\/td><td>标的价格 ≈ 执行价<\/td><td>标的价格 ≈ 执行价<\/td><\/tr>\n<tr><td>价外（out of the money，OTM）<\/td><td>标的价格 &lt; 执行价<\/td><td>标的价格 &gt; 执行价<\/td><\/tr>\n<\/table><\/div>\n<p>同一个执行价，看涨价内，看跌就是价外；反之亦然。<\/p>\n\n<h2>期权价格 = 内在价值 + 时间价值<\/h2>\n<p><strong>内在价值（intrinsic value）<\/strong>：如果现在马上行权能赚多少。价内期权才有内在价值，价外和平值期权的内在价值为零。<\/p>\n<p><strong>时间价值（time value）<\/strong>：期权价格超过内在价值的部分，代表“到期前还可能变得更值钱”的可能性。离到期越远、市场波动越大，时间价值越高。到期那一刻，时间价值归零，期权只剩内在价值。<\/p>\n<p>价外期权全是时间价值：现在一文不值，但到期前可能变成价内。平值期权的时间价值最大，因为它最不确定。<\/p>\n\n<h2>不同状态，性格不同<\/h2>\n<ul>\n<li><strong>深度价内<\/strong>：几乎一定会行权，价格跟着标的一对一变动，像直接持有标的。<\/li>\n<li><strong>平值<\/strong>：对价格、时间、波动率都最敏感，Gamma 和 Vega 最大。<\/li>\n<li><strong>深度价外<\/strong>：很便宜，大概率作废，偶尔一次大行情能翻好几十倍，像彩票。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>交易员也常用 Delta 来描述价内价外的程度：“25 Delta 看涨”指的是 Delta 为 0.25 的价外看涨期权，“50 Delta”大约就是平值。外汇期权市场的报价，就是按 25 Delta、10 Delta 这样的标准来报的。<\/p>\n<p>利率期权也一样：利率上限（cap）在利率高于执行利率时是价内，互换期权在远期互换利率高于执行利率时，付固定的那一方是价内。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年和 2021 年，美国散户大量买入深度价外、很快到期的看涨期权，比如 GameStop、特斯拉的期权。这些期权很便宜，看起来“小钱博大钱”。做市商卖出这些期权后，要买入股票对冲，股价一涨，又需要买更多，形成了所谓的“Gamma 挤压”（gamma squeeze），进一步推高股价。深度价外期权平时像彩票，大量集中买入时，却能反过来推动标的价格。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>价内、平值、价外描述“现在行权有没有钱赚”，看涨和看跌方向相反。<\/li>\n<li>期权价格 = 内在价值 + 时间价值；到期时时间价值归零。<\/li>\n<li>深度价内像标的本身，平值最敏感，深度价外像彩票。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个价外看涨期权，标的价格一直没动，过了一个月，期权价格跌了一半。为什么？<\/summary>\n<div><p>因为价外期权的价格全是时间价值。时间过去，到期前“涨到执行价以上”的机会变少了，时间价值就流失了。这就是 Theta：即使什么都没发生，期权买方每天都在“付租金”。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-13\"><\/a><\/li>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<li><a href=\"#L16-28\"><\/a><\/li>\n<\/ul><\/div>\n","16.13":"<div class=\"scene\">\n<p>同样是执行价 100 的看涨期权，有的卖 3 元，有的卖 12 元。差别从哪来？期权的价格由六样东西决定。理解了它们，就理解了期权交易员每天在想什么。<\/p>\n<\/div>\n\n<h2>六个因素<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>因素<\/th><th>上升时，看涨期权<\/th><th>上升时，看跌期权<\/th><th>原因<\/th><\/tr>\n<tr><td>标的价格<\/td><td>涨<\/td><td>跌<\/td><td>看涨离价内更近，看跌更远<\/td><\/tr>\n<tr><td>执行价<\/td><td>跌<\/td><td>涨<\/td><td>看涨的买入价更高，看跌的卖出价更高<\/td><\/tr>\n<tr><td>到期时间<\/td><td>通常涨<\/td><td>通常涨<\/td><td>时间越长，变成价内的机会越多<\/td><\/tr>\n<tr><td>波动率<\/td><td>涨<\/td><td>涨<\/td><td>波动越大，大幅变动的可能越大<\/td><\/tr>\n<tr><td>利率<\/td><td>涨<\/td><td>跌<\/td><td>看涨推迟了付钱，看跌推迟了收钱<\/td><\/tr>\n<tr><td>分红<\/td><td>跌<\/td><td>涨<\/td><td>分红会让股价下降<\/td><\/tr>\n<\/table><\/div>\n\n<h2>最关键的一个：波动率<\/h2>\n<p>六个因素里，五个都能直接看到：标的价格、执行价、到期时间、利率、分红。只有波动率是关于未来的，没人知道未来真正会波动多大。<\/p>\n<p>波动率为什么让看涨和看跌都更值钱？因为期权的收益是不对称的：好的方向收益很大，坏的方向最多亏掉期权费。波动越大，好方向出现大收益的机会越多，而坏方向的损失被期权费封顶。<\/p>\n<p>市场根据期权的实际价格，反推出来的波动率叫隐含波动率（implied volatility）。所以交易期权，本质上是在交易对未来波动的看法。<\/p>\n\n<h2>定价模型做的是什么<\/h2>\n<p>Black-Scholes 等定价模型，就是把这六个因素放进一个公式，算出“合理的”期权价格。现实中，交易员更多是反过来用：已知市场价格，反推隐含波动率，再用隐含波动率来比较不同期权贵不贵。你不需要会推导公式，只要知道：模型把期权价格和这六个因素连了起来。<\/p>\n\n<div class=\"desk\">\n<p>每个因素对应一个希腊字母：标的价格对应 Delta 和 Gamma，时间对应 Theta，波动率对应 Vega，利率对应 Rho。期权台的风险报告，就是把这几个敏感度按到期日、执行价分桶列出来。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1987 年 10 月 19 日，美国股市单日暴跌超过 20%。此后，股票指数的价外看跌期权的隐含波动率长期高于平值期权，形成了“波动率偏斜”（skew）。市场学到了一课：暴跌比模型假设的更常见，大家愿意为下跌保护多付钱。这也说明，定价模型只是框架，真正的价格还包含了市场对极端风险的恐惧。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>期权价格由标的价格、执行价、到期时间、波动率、利率、分红六个因素决定。<\/li>\n<li>只有波动率无法直接观察，市场价格反推出来的叫隐含波动率。<\/li>\n<li>波动率上升让看涨和看跌都更值钱，因为期权的收益是不对称的。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司宣布即将公布一项重大的临床试验结果，结果可能大好也可能大坏。公告前，这只股票的看涨和看跌期权价格会怎样变化？<\/summary>\n<div><p>两者都会变贵，因为预期的波动率大幅上升，隐含波动率走高。结果公布后，不确定性消失，隐含波动率通常会迅速回落，叫“波动率压缩”（vol crush）。即使股价朝你想的方向走，期权也可能因为波动率回落而赚得不多，甚至亏钱。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-14\"><\/a><\/li>\n<li><a href=\"#L16-19\"><\/a><\/li>\n<li><a href=\"#L16-41\"><\/a><\/li>\n<\/ul><\/div>\n","16.14":"<div class=\"scene\">\n<p>你能不能不用任何期权，只用股票和现金，做出一个和期权一模一样的东西？可以。而一旦你能“造”出一个期权，期权的价格就不能随便定了：太贵，大家就卖期权、自己造一个；太便宜，就买期权、反向造一个。这就是衍生品定价的核心：<strong>无套利与复制<\/strong>。<\/p>\n<\/div>\n\n<h2>无套利：天下没有免费的午餐<\/h2>\n<p>套利（arbitrage）是指不承担风险、不投入资金，却能稳赚的机会。在一个有效的市场里，这种机会一出现，就会被抢着利用，直到消失。<\/p>\n<p>由此得出一条非常有用的原则：<strong>两个未来现金流完全一样的东西，今天的价格必须一样。<\/strong>否则就可以买便宜的、卖贵的，稳赚差价。<\/p>\n\n<h2>复制：用简单的东西拼出复杂的东西<\/h2>\n<p>如果能用标的资产和借贷，拼出一个和衍生品未来收益完全相同的组合（叫复制组合，replicating portfolio），那么衍生品的价格就等于这个组合的成本。<\/p>\n<ul>\n<li><strong>远期<\/strong>：今天借钱买入现货，持有到期，效果和远期多头完全相同。所以远期价格 = 现货价格加资金成本（再加减储存成本和持有收益）。<\/li>\n<li><strong>期权<\/strong>：复制更复杂，需要随着标的价格变动，不断调整持有的股票数量。Black-Scholes 模型证明，持续地这样调整，就能复制一个期权。调整的比例，就是 Delta。<\/li>\n<\/ul>\n\n<h2>为什么这么重要<\/h2>\n<p>无套利定价有一个惊人的结论：期权的价格，和市场觉得股票会涨还是会跌无关。因为无论大家怎么看，复制成本是一样的。这也是为什么衍生品可以定价：交易员不需要预测方向，只需要知道复制的成本。<\/p>\n<p>做市商就是这样工作的：卖出一个期权，同时用标的资产做 Delta 对冲，相当于“复制”了一个期权来抵消卖出的那个，赚的是期权费和复制成本之间的差额。<\/p>\n\n<div class=\"desk\">\n<p>交易台上，很多日常的“套利交易”其实是在维护无套利关系：现货和期货之间的基差交易、看涨看跌平价关系、不同期限利率之间的关系。当这些关系偏离时，交易员会买入便宜的、卖出贵的，等它回来。偏离常常出现在市场紧张、资金紧缺的时候，因为套利需要资金和资产负债表。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>1998 年长期资本管理公司（LTCM）。<\/strong>LTCM 由多位顶尖交易员和两位诺贝尔经济学奖得主（包括斯科尔斯和默顿）参与创立，专门做“近似套利”：买入相对便宜的债券、卖出相对贵的，等两者的价差回归，用极高的杠杆放大微小的利润。1998 年俄罗斯违约后，市场恐慌，价差不但没有回归，反而越拉越大。LTCM 资金耗尽，最终在美联储协调下由多家银行接管。这说明：理论上的无套利关系最终会成立，但在那之前，你可能先被迫出局。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>无套利原则：未来现金流相同的东西，今天的价格必须相同。<\/li>\n<li>能用标的和借贷复制出来的衍生品，价格就等于复制的成本。<\/li>\n<li>期权定价与市场对方向的看法无关；但现实中套利需要资金，关系可能长时间偏离。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>既然期权的价格和“股票会涨还是跌”无关，那看好股票的人为什么还要买看涨期权？<\/summary>\n<div><p>期权的价格由复制成本决定，与市场整体的方向判断无关；但对个人来说，如果你比市场更看好，买看涨期权就能从你的判断中获利。价格是“公平”的，收益取决于你的判断是否比市场准确。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-2\"><\/a><\/li>\n<li><a href=\"#L16-15\"><\/a><\/li>\n<li><a href=\"#L16-40\"><\/a><\/li>\n<li><a href=\"#L9-43\"><\/a><\/li>\n<\/ul><\/div>\n","16.15":"<div class=\"scene\">\n<p>有两个组合。A：买一个执行价 100 的看涨期权，再存一笔到期正好变成 100 元的现金。B：买一股股票，再买一个执行价 100 的看跌期权。到期时，无论股价是 70 还是 130，这两个组合的价值都一模一样。既然结果一样，今天的价格也必须一样。这就是<strong>看涨看跌平价（put-call parity）<\/strong>。<\/p>\n<\/div>\n\n<h2>为什么到期时两个组合一样<\/h2>\n<ul>\n<li><strong>股价 130<\/strong>：A 的看涨期权值 30，加上 100 元现金，共 130；B 的股票值 130，看跌期权作废，共 130。<\/li>\n<li><strong>股价 70<\/strong>：A 的看涨期权作废，剩 100 元现金；B 的股票值 70，看跌期权值 30，共 100。<\/li>\n<\/ul>\n<p>两个组合到期价值都是 max（股价，100）。所以今天：<\/p>\n<p><strong>看涨期权价格 + 执行价的现值 = 股票价格 + 看跌期权价格<\/strong><\/p>\n<p>这个关系对同一标的、同一执行价、同一到期日的欧式期权成立（有分红时要扣掉分红的现值）。<\/p>\n\n<h2>它告诉我们什么<\/h2>\n<ul>\n<li><strong>看涨和看跌的价格是绑在一起的<\/strong>：知道一个，就能算出另一个。所以同一执行价、同一到期日的看涨和看跌，隐含波动率应该相同。<\/li>\n<li><strong>可以用期权“合成”其他东西<\/strong>：买看涨 + 卖看跌（同一执行价）= 一个远期多头，叫合成多头（synthetic long）；买股票 + 买看跌 = 一个“有保护的”股票，收益形状和看涨期权一样。<\/li>\n<li><strong>偏离就是套利机会<\/strong>：如果等式两边不相等，就买便宜的一边、卖贵的一边。<\/li>\n<\/ul>\n\n<h2>现实中的偏离<\/h2>\n<p>平价关系通常非常紧，但在一些情况下会出现偏差：股票很难借（做空成本高）、交易成本、美式期权的提前行权，以及分红预期不同。股票很难借时，看跌期权会相对变贵，因为想做空的人只能改买看跌期权。<\/p>\n\n<div class=\"desk\">\n<p>做市商和交易员常用平价关系检查报价是否一致，也用它把看涨期权“转换”成看跌期权。从看涨看跌的价格可以反推出市场隐含的远期价格，甚至隐含的借券成本和分红预期。<\/p>\n<p>做空期权和股票组合的“转换”（conversion）、“反转换”（reversal）交易，就是利用平价关系偏离来套利。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年 1 月 GameStop 暴涨期间，这只股票几乎借不到，借券费率高得惊人。期权市场上，同一执行价的看跌期权明显比按平价关系算出来的更贵，隐含的借券成本高达每年几十个百分点。这正是平价关系里“股票借不到”这一项在起作用：做空股票太难，看跌期权就成了替代品，价格被推高。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>看涨期权价格 + 执行价现值 = 股票价格 + 看跌期权价格（欧式期权）。<\/li>\n<li>看涨和看跌的价格绑在一起，还可以用期权合成远期或有保护的股票。<\/li>\n<li>偏离通常来自借券困难、交易成本、提前行权和分红，偏离就是套利信号。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>股票 100 元，一年后到期、执行价 100 的看涨期权 10 元，利率为零，没有分红。同样条件的看跌期权应该是多少？如果市场报 13 元，怎么套利？<\/summary>\n<div><p>按平价关系：看跌 = 看涨 + 执行价现值 − 股价 = 10 + 100 − 100 = 10 元。市场报 13 元，看跌太贵：卖出看跌（收 13），买入看涨（付 10），卖空一股股票（收 100），把钱存起来。到期无论股价多少，组合都能平掉，锁定约 3 元的利润。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-14\"><\/a><\/li>\n<li><a href=\"#L16-17\"><\/a><\/li>\n<li><a href=\"#L10-12\"><\/a><\/li>\n<\/ul><\/div>\n","16.16":"<div class=\"scene\">\n<p>两个看涨期权，执行价、到期日都一样。一个只能在到期那天行权，另一个随时都可以行权。后者至少不会比前者便宜，因为它多了一份选择。期权按“什么时候可以行权”，分成欧式、美式和百慕大式。名字和地理无关。<\/p>\n<\/div>\n\n<h2>三种行权方式<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>类型<\/th><th>什么时候能行权<\/th><th>常见于<\/th><\/tr>\n<tr><td>欧式（European）<\
