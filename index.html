时相关性很低，组合波动很小。为什么风控还会担心？<\/summary>\n<div><p>因为相关性在危机中会急剧上升，平时不相关的市场会一起下跌。基于平时数据算出的低波动和分散效果，会严重低估危机时的损失。所以要用危机情景（比如 2008 年、2020 年 3 月）做压力测试，看相关性接近 1 时组合会亏多少。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-4\"><\/a><\/li>\n<li><a href=\"#L16-35\"><\/a><\/li>\n<li><a href=\"#L24-35\"><\/a><\/li>\n<\/ul><\/div>\n","24.29":"<div class=\"scene\">\n<p>每天早上，风控要回答两个问题：昨天赚的钱是从哪里来的？明天最多可能亏多少？前一个问题靠<strong>损益解释<\/strong>，后一个靠 <strong>VaR<\/strong>。两者用的是同一套原料：敏感度。<\/p>\n<\/div>\n\n<h2>从敏感度到损益解释<\/h2>\n<p>损益解释（P&amp;L explain 或 P&amp;L attribution）把一天的实际损益拆成几块：<\/p>\n<ul>\n<li><strong>利率<\/strong>：各期限 DV01 × 当天各期限利率的变动。<\/li>\n<li><strong>信用<\/strong>：CS01 × 利差的变动。<\/li>\n<li><strong>股票、汇率<\/strong>：Delta × 价格变动，再加上 ½ × Gamma × 变动的平方。<\/li>\n<li><strong>波动率<\/strong>：Vega × 隐含波动率的变动。<\/li>\n<li><strong>时间<\/strong>：Theta、carry。<\/li>\n<li><strong>新交易<\/strong>：当天新做的交易带来的损益。<\/li>\n<li><strong>未解释<\/strong>：实际损益减去以上各项。<\/li>\n<\/ul>\n<p>未解释部分很小，说明敏感度和风险模型抓住了主要风险；未解释部分很大，说明有东西漏了：漏掉的风险因子、模型问题、数据错误或交易录错。<\/p>\n\n<h2>从敏感度到 VaR<\/h2>\n<p>VaR（风险价值）回答：在正常市场里，比如 99% 的日子，明天最多亏多少。计算的思路是：<\/p>\n<ol>\n<li>把仓位表示成对一组风险因子的敏感度（或者用全额重估）。<\/li>\n<li>假设风险因子明天的各种可能变动：用历史上的真实变动（历史模拟法），或者用波动率和相关性推算（参数法、蒙特卡洛）。<\/li>\n<li>算出每种变动下的损益，排成分布，取第 1% 最差的那个。<\/li>\n<\/ol>\n<p>所以敏感度是 VaR 的“仓位”，市场数据是“情景”。敏感度漏了某个风险因子，VaR 也会漏掉它。<\/p>\n\n<h2>两者要对得上<\/h2>\n<p>监管要求银行检验：风险模型里的损益，和前台实际的损益是否一致（FRTB 的损益归因测试，PLA test）；VaR 预测的亏损，和实际发生的亏损是否吻合（回溯测试，backtesting）。对不上，模型就不能用于计算资本。<\/p>\n\n<div class=\"desk\">\n<p>市场风险分析师的每日工作，很大一部分就是这一套：核对敏感度、跑损益解释、追查未解释损益、检查 VaR 是否变动异常、写日报说明原因。理解了敏感度，损益解释和 VaR 就都有了基础。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2012 年伦敦鲸事件中，摩根大通首席投资办公室在年初更换了 VaR 模型，新模型算出的 VaR 大约只有旧模型的一半。后来的内部调查发现，新模型在计算中存在错误，包括电子表格中的公式错误，低估了风险。这个案例经常被用来说明：VaR 只是模型的输出，敏感度、数据和计算的每一步都需要独立验证。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>损益解释 = 各敏感度 × 当天市场变动 + 时间效应 + 新交易 + 未解释部分。<\/li>\n<li>VaR 用同样的敏感度（或全额重估），配上历史或模拟的市场变动，估计正常日子里的最大亏损。<\/li>\n<li>损益归因测试和回溯测试检验敏感度和模型是否可靠；未解释损益是重要警报。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个交易台连续几天出现大额未解释损益，而 VaR 很稳定。可能是什么问题？<\/summary>\n<div><p>可能是风险系统漏掉了某个风险因子（比如基差、相关性、某个新产品的特殊风险），所以敏感度和 VaR 都没反映它，但它在实际损益里出现了。也可能是前台和风控用的价格、曲线不一致，或者交易数据有错。需要逐项核对，找到漏掉的风险，否则 VaR 会持续低估风险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L24-4\"><\/a><\/li>\n<li><a href=\"#L24-5\"><\/a><\/li>\n<li><a href=\"#L24-8\"><\/a><\/li>\n<li><a href=\"#L24-20\"><\/a><\/li>\n<\/ul><\/div>\n"}}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('atlas-data').textContent);
  var parts = [], lessons = [], partOf = {}, volOf = {}, byCode = {};
  D.vols.forEach(function (v) {
    v.parts.forEach(function (p) {
      parts.push(p); volOf[p.id] = v;
      p.lessons.forEach(function (l) { lessons.push(l); partOf[l.code] = p; byCode[l.code] = l; });
    });
  });
  function written(code) { return Object.prototype.hasOwnProperty.call(D.content, code); }
  function lid(code) { return 'L' + code.replace(/\./g, '-'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function wcount(p) { return p.lessons.filter(function (l) { return written(l.code); }).length; }

  function renderSide(curPart, curCode) {
    var h = '';
    D.vols.forEach(function (v) {
      var open = curPart ? volOf[curPart.id] === v : v.id === 'v1';
      h += '<details' + (open ? ' open' : '') + '><summary>' + esc(v.name) + '</summary>';
      var g = null;
      v.parts.forEach(function (p) {
        if (p.group && p.group !== g) { g = p.group; h += '<div class="grp">' + esc(g) + '</div>'; }
        var w = wcount(p);
        h += '<a href="#P' + p.id + '" class="' + (w ? 'has' : '') + (curPart === p && !curCode ? ' cur' : '') + '"><span>' + esc(p.name) + '</span>' + (w ? '<span class="n">' + w + '</span>' : '') + '</a>';
        if (curPart === p) {
          h += '<div class="lessons">';
          p.lessons.forEach(function (l) {
            h += '<a href="#' + lid(l.code) + '" class="' + (written(l.code) ? 'w' : '') + (curCode === l.code ? ' cur' : '') + '"><span class="mono" style="font-size:11px;min-width:34px">' + l.code + '</span><span>' + esc(l.title) + '</span></a>';
          });
          h += '</div>';
        }
      });
      h += '</details>';
    });
    document.getElementById('side').innerHTML = h;
    var cur = document.querySelector('.side .cur'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
  }

  function renderHome() {
    var nW = Object.keys(D.content).length;
    var h = '<section class="hero"><h1>金融学习笔记</h1><p class="lede">一套从经济到金融的系统课程，跟着一笔钱走。每一课只讲一件事：它是什么、为什么、在实际工作中怎么用。关键术语标注英文。</p>' +
      '<div class="stats"><div><b>' + lessons.length + '</b>课程总数</div><div><b>' + nW + '</b>已经写好</div><div><b>' + D.vols.length + '</b>卷</div></div></section>';
    if (nW) {
      h += '<div class="sec-h"><h2>已经写好的课</h2><span>从这里开始读</span></div><div class="ready">';
      lessons.forEach(function (l) { if (written(l.code)) h += '<a href="#' + lid(l.code) + '"><span class="c">' + l.code + ' · ' + esc(partOf[l.code].name.replace(/^第 \d+ 部 /, '')) + '</span>' + esc(l.title) + '</a>'; });
      h += '</div>';
    }
    h += '<div class="sec-h"><h2>全部目录</h2><span>● 后面的数字是已写好的课数</span></div><div class="vols">';
    D.vols.forEach(function (v) {
      h += '<article class="vol"><h3>' + esc(v.name) + '</h3>';
      var g = null, open = false;
      v.parts.forEach(function (p) {
        if (p.group !== g) { if (open) h += '</ul>'; g = p.group; if (g) h += '<div class="grp">' + esc(g) + '</div>'; h += '<ul>'; open = true; }
        if (!open) { h += '<ul>'; open = true; }
        var w = wcount(p);
        h += '<li><a href="#P' + p.id + '"><span>' + esc(p.name) + '</span><span class="n' + (w ? ' w' : '') + '">' + (w ? '● ' + w + ' / ' : '') + p.lessons.length + '</span></a></li>';
      });
      if (open) h += '</ul>';
      h += '</article>';
    });
    return h + '</div>';
  }

  function crumb(p) {
    var v = volOf[p.id];
    return '<div class="crumb"><a href="#">首页</a> / <span>' + esc(v.name) + '</span>' + (p.group ? ' / <span>' + esc(p.group) + '</span>' : '') + ' / <a href="#P' + p.id + '">' + esc(p.name) + '</a></div>';
  }

  function renderPart(p) {
    var h = crumb(p) + '<div class="head"><h1>' + esc(p.name) + '</h1></div>';
    if (p.q) h += '<p class="partq">' + esc(p.q) + '</p>';
    if (p.role) h += '<p class="partmeta">新角色：' + esc(p.role) + '</p>';
    h += '<ul class="plist">';
    var sub = null;
    p.lessons.forEach(function (l) {
      if (l.sub !== sub) { sub = l.sub; if (sub) h += '<li class="sub' + (l.adv ? '' : ' plain') + '">' + (l.adv ? '★ ' : '') + esc(sub) + '</li>'; }
      var w = written(l.code);
      h += '<li><a href="#' + lid(l.code) + '" class="' + (w ? 'w' : '') + '"><span class="c">' + l.code + '</span><span>' + esc(l.title) + '</span><span class="st">' + (w ? '已写好' : '') + '</span></a></li>';
    });
    h += '</ul>';
    if (p.branch) h += '<p class="branch">支线：' + esc(p.branch) + '</p>';
    return h;
  }

  function renderLesson(l) {
    var p = partOf[l.code];
    var h = crumb(p) + '<div class="head"><h1>' + esc(l.title) + '</h1><div class="tags"><span class="mono">' + l.code + '</span>' +
      (l.sub ? '<span class="tag' + (l.adv ? ' adv' : '') + '">' + (l.adv ? '进阶 · ' : '') + esc(l.sub) + '</span>' : '') + '</div></div>';
    if (written(l.code)) h += '<article class="content" id="content">' + D.content[l.code] + '</article>';
    else h += '<div class="todo">这一课还没写。它在目录里的位置已经定好，写好后会出现在这里。</div>';
    var i = p.lessons.indexOf(l), prev = p.lessons[i - 1], next = p.lessons[i + 1];
    h += '<div class="pager"><span>' + (prev ? '<a href="#' + lid(prev.code) + '">← ' + prev.code + ' ' + esc(prev.title) + '</a>' : '<a href="#P' + p.id + '">← 回到本部目录</a>') + '</span><span>' +
      (next ? '<a href="#' + lid(next.code) + '">' + next.code + ' ' + esc(next.title) + ' →</a>' : '<a href="#P' + p.id + '">回到本部目录 →</a>') + '</span></div>';
    return h;
  }

  function decorate() {
    var c = document.getElementById('content'); if (!c) return;
    c.querySelectorAll('a[href^="#L"]').forEach(function (a) {
      var code = a.getAttribute('href').slice(2).replace(/-/g, '.'), l = byCode[code];
      if (!l || a.textContent.trim()) return;
      a.textContent = l.code + ' ' + l.title;
      if (!written(l.code)) { var s = document.createElement('span'); s.className = 'todo-tag'; s.textContent = '（未写）'; a.parentNode.insertBefore(s, a.nextSibling); }
    });
    c.querySelectorAll('table').forEach(function (t) {
      if (t.parentNode.classList.contains('tbl')) return;
      var w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
  }

  function route() {
    var id = (location.hash || '').replace(/^#/, ''), main = document.getElementById('main');
    document.body.classList.remove('navopen');
    var l = null, p = null;
    if (id.charAt(0) === 'L') { var code = id.slice(1).replace(/-/g, '.'); l = byCode[code]; }
    if (id.charAt(0) === 'P') { p = parts.filter(function (x) { return x.id === id.slice(1); })[0]; }
    if (l) { main.innerHTML = renderLesson(l); renderSide(partOf[l.code], l.code); decorate(); document.title = l.title + ' · 金融学习笔记'; }
    else if (p) { main.innerHTML = renderPart(p); renderSide(p, null); document.title = p.name + ' · 金融学习笔记'; }
    else { main.innerHTML = renderHome(); renderSide(null, null); document.title = 'Finance Study Notes · 金融学习笔记'; }
    window.scrollTo(0, 0);
  }

  // search
  var idx = lessons.map(function (l) {
    var text = written(l.code) ? D.content[l.code].replace(/<[^>]+>/g, ' ').replace(/&[a-z#0-9]+;/gi, ' ').replace(/\s+/g, ' ') : '';
    return { l: l, title: (l.code + ' ' + l.title).toLowerCase(), text: text, low: text.toLowerCase() };
  });
  var q = document.getElementById('q'), res = document.getElementById('results'), sel = -1;
  function doSearch() {
    var s = q.value.trim().toLowerCase(); sel = -1;
    if (!s) { res.hidden = true; return; }
    var hits = [];
    idx.forEach(function (e) {
      var score = 0, snip = '', p = e.low.indexOf(s);
      if (e.title.indexOf(s) > -1) score += 10;
      if (p > -1) { score += 3; snip = (p > 24 ? '…' : '') + e.text.slice(Math.max(0, p - 24), p + 56) + '…'; }
      if (score) hits.push({ e: e, score: score + (written(e.l.code) ? 2 : 0), snip: snip });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    res.innerHTML = hits.length ? hits.slice(0, 14).map(function (h) {
      return '<a href="#' + lid(h.e.l.code) + '"><div>' + h.e.l.code + ' · ' + esc(h.e.l.title) + (written(h.e.l.code) ? '' : ' <span class="r-s">（未写）</span>') + '</div>' + (h.snip ? '<div class="r-s">' + esc(h.snip) + '</div>' : '') + '</a>';
    }).join('') : '<div class="empty">没有找到。换个词，或者试试英文术语。</div>';
    res.hidden = false;
  }
  q.addEventListener('input', doSearch);
  q.addEventListener('keydown', function (ev) {
    var as = res.querySelectorAll('a'); if (!as.length) return;
    if (ev.key === 'ArrowDown') { sel = Math.min(as.length - 1, sel + 1); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp') { sel = Math.max(0, sel - 1); ev.preventDefault(); }
    else if (ev.key === 'Enter') { location.hash = as[Math.max(0, sel)].getAttribute('href'); res.hidden = true; q.blur(); return; }
    else if (ev.key === 'Escape') { res.hidden = true; return; }
    as.forEach(function (a, i) { a.classList.toggle('sel', i === sel); });
  });
  res.addEventListener('click', function () { res.hidden = true; q.value = ''; });
  document.addEventListener('click', function (ev) { if (!ev.target.closest('.search')) res.hidden = true; });
  document.getElementById('themebtn').addEventListener('click', function () {
    var r = document.documentElement, cur = r.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
  document.getElementById('navbtn').addEventListener('click', function () { document.body.classList.toggle('navopen'); });
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
