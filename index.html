<style>
/* Layout: a quiet reading room. Sticky bar, outline on the left, a 66ch reading column. Ledger-green accent, ochre for real-world cases. */
:root {
  --bg: #F4F6F4; --surface: #FFFFFF; --sunk: #EAEEEB; --ink: #15212B; --muted: #5B6871; --line: #D6DDD8;
  --accent: #0E6B66; --accent-soft: #DCEDEA; --ochre: #9A5B17; --ochre-soft: #F6ECDD; --blue: #2B4C7E; --blue-soft: #E3EAF5;
  --font-body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bar-h: 56px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1417; --surface: #151D21; --sunk: #1B252A; --ink: #E3EAEC; --muted: #98A6AD; --line: #27343A;
  --accent: #55B8AF; --accent-soft: #173431; --ochre: #D99A52; --ochre-soft: #2E2416; --blue: #86A6DA; --blue-soft: #1A2433; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1417; --surface: #151D21; --sunk: #1B252A; --ink: #E3EAEC; --muted: #98A6AD; --line: #27343A;
  --accent: #55B8AF; --accent-soft: #173431; --ochre: #D99A52; --ochre-soft: #2E2416; --blue: #86A6DA; --blue-soft: #1A2433; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16.5px; line-height: 1.85; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { height: var(--bar-h); display: flex; align-items: center; gap: 12px; max-width: 1320px; margin: 0 auto; }
.brand { text-decoration: none; color: var(--ink); white-space: nowrap; display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: 0.02em; }
.brand span { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.more { margin: 30px 0 10px; padding: 14px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.more::before { content: "继续深入"; display: block; font-size: 12px; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.more ul { margin: 0; padding-left: 1.1em; }
.more li { margin: 3px 0; font-size: 15px; }
.more .todo-tag { color: var(--muted); font-size: 12.5px; }
.foot { max-width: 1320px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }
@media (max-width: 560px) { .brand span { display: none; } }
.search { flex: 1; min-width: 0; position: relative; max-width: 440px; margin-left: auto; }
.search input { width: 100%; height: 36px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 0 12px; font: inherit; font-size: 14px; }
.results { position: absolute; top: 42px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.14); max-height: 70vh; overflow: auto; }
.results a { display: block; padding: 9px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.results a:last-child { border-bottom: 0; }
.results a:hover, .results a.sel { background: var(--accent-soft); }
.results .r-s { font-size: 12.5px; color: var(--muted); }
.results .empty { padding: 12px 14px; color: var(--muted); font-size: 14px; }
.tbtn { height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-size: 13px; }
.navbtn { display: none; }

.frame { display: grid; grid-template-columns: 300px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; gap: 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.side { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - var(--bar-h)); overflow: auto; padding-block: 20px 48px; font-size: 13.5px; line-height: 1.5; }
.side details { margin: 0 0 6px; }
.side summary { cursor: pointer; font-weight: 600; padding: 6px 0; list-style: none; }
.side summary::-webkit-details-marker { display: none; }
.side summary::before { content: "▸"; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
.side details[open] > summary::before { transform: rotate(90deg); }
.side .grp { font-size: 11.5px; letter-spacing: 0.08em; color: var(--accent); margin: 10px 0 2px 14px; }
.side a { display: flex; gap: 8px; padding: 3px 8px; margin-left: 6px; border-radius: 6px; text-decoration: none; color: var(--muted); }
.side a:hover { background: var(--sunk); color: var(--ink); }
.side a.cur { background: var(--accent-soft); color: var(--accent); }
.side a.has { color: var(--ink); }
.side a .n { font-family: var(--font-mono); font-size: 11px; color: var(--accent); margin-left: auto; padding-left: 6px; }
.side .lessons { margin: 2px 0 6px 18px; border-left: 1px solid var(--line); }
.side .lessons a { font-size: 13px; }
.side .lessons a.w::after { content: "●"; font-size: 8px; color: var(--accent); margin-left: auto; align-self: center; }
main { min-width: 0; padding-block: 34px 110px; }

/* home */
.hero h1 { font-family: var(--font-display); font-size: clamp(30px, 4.4vw, 46px); line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
.lede { font-size: 18px; color: var(--muted); max-width: 60ch; margin: 0; }
.stats { display: flex; gap: 30px; flex-wrap: wrap; margin: 22px 0 0; font-size: 14px; color: var(--muted); }
.stats b { font-family: var(--font-mono); font-size: 24px; color: var(--ink); display: block; line-height: 1.2; font-weight: 500; }
.sec-h { margin: 46px 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.sec-h span { color: var(--muted); font-size: 14px; }
.ready { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.ready a { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; line-height: 1.5; }
.ready a:hover { border-color: var(--accent); }
.ready .c { font-family: var(--font-mono); font-size: 12px; color: var(--accent); display: block; margin-bottom: 2px; }
.vols { display: grid; gap: 14px; }
.vol { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.vol h3 { margin: 0 0 4px; font-size: 18px; }
.vol .grp { font-size: 12px; color: var(--accent); letter-spacing: 0.06em; margin: 12px 0 4px; }
.vol ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px 20px; }
.vol li a { text-decoration: none; color: var(--ink); display: flex; gap: 8px; font-size: 14.5px; line-height: 1.6; padding: 2px 0; }
.vol li a:hover { color: var(--accent); }
.vol li .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.vol li .n.w { color: var(--accent); }

/* part + lesson */
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumb a { color: var(--muted); }
.head h1 { font-family: var(--font-display); font-size: clamp(25px, 3.4vw, 34px); line-height: 1.35; margin: 10px 0 8px; text-wrap: balance; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.tag.adv { border-color: var(--ochre); color: var(--ochre); }
.partq { font-size: 18px; margin: 14px 0 4px; }
.partmeta { color: var(--muted); font-size: 14px; }
.plist { list-style: none; padding: 0; margin: 14px 0 0; max-width: 72ch; }
.plist .sub { font-size: 13px; color: var(--ochre); margin: 22px 0 6px; font-weight: 600; }
.plist .sub.plain { color: var(--accent); }
.plist a { display: flex; gap: 12px; text-decoration: none; color: var(--muted); padding: 7px 10px; border-radius: 8px; line-height: 1.5; }
.plist a.w { color: var(--ink); }
.plist a:hover { background: var(--sunk); }
.plist .c { font-family: var(--font-mono); font-size: 12px; min-width: 46px; padding-top: 2px; }
.plist a.w .c { color: var(--accent); }
.plist .st { margin-left: auto; font-size: 12px; white-space: nowrap; }
.branch { margin-top: 26px; padding-top: 14px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 14px; max-width: 72ch; }

.content { max-width: 66ch; margin-top: 26px; }
.content h2 { font-family: var(--font-display); font-size: 22px; line-height: 1.45; margin: 40px 0 10px; text-wrap: balance; }
.content p { margin: 0 0 16px; }
.content ul, .content ol { padding-left: 1.3em; margin: 0 0 16px; }
.content li { margin: 4px 0; }
.content strong { font-weight: 600; }
.scene { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin: 0 0 26px; font-size: 17px; }
.scene p:last-child, .desk p:last-child, .case p:last-child, .takeaway p:last-child { margin-bottom: 0; }
.desk { background: var(--blue-soft); border-radius: 14px; padding: 16px 22px; margin: 22px 0; }
.desk::before { content: "在交易台上"; display: block; font-size: 12px; letter-spacing: 0.1em; color: var(--blue); font-weight: 600; margin-bottom: 6px; }
.case { background: var(--ochre-soft); border-radius: 14px; padding: 16px 22px; margin: 22px 0; }
.case::before { content: "真实发生过"; display: block; font-size: 12px; letter-spacing: 0.1em; color: var(--ochre); font-weight: 600; margin-bottom: 6px; }
.takeaway { border-left: 3px solid var(--accent); padding: 4px 0 4px 20px; margin: 36px 0 22px; }
.takeaway::before { content: "三句话记住"; display: block; font-size: 12px; letter-spacing: 0.1em; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
.takeaway ol { margin: 0; }
details.think { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 18px 0; }
details.think summary { cursor: pointer; padding: 14px 18px; font-weight: 500; }
details.think summary::before { content: "想一想　"; color: var(--accent); font-weight: 600; }
details.think > div { padding: 12px 18px 16px; border-top: 1px dashed var(--line); }
.tbl { overflow-x: auto; margin: 16px 0 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.6; }
.tbl th, .tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--sunk); font-weight: 600; font-size: 13.5px; }
.tbl tr:last-child td { border-bottom: 0; }
.todo { margin-top: 26px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 20px 22px; color: var(--muted); max-width: 66ch; }
.pager { display: flex; justify-content: space-between; gap: 14px; margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; font-size: 14px; }
.pager a { text-decoration: none; max-width: 48%; }

@media (max-width: 980px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 0; }

  body.navopen nav.side { display: block; }
  .navbtn { display: inline-flex; align-items: center; }
}
@media (max-width: 520px) { body { font-size: 16px; } .pager a { max-width: 100%; } }
</style>

l,"adv":false},{"code":"H8.4","title":"马克思与政治经济学批判","sub":null,"adv":false},{"code":"H8.5","title":"边际革命：门格尔、杰文斯与瓦尔拉斯","sub":null,"adv":false},{"code":"H8.6","title":"马歇尔与新古典经济学","sub":null,"adv":false},{"code":"H8.7","title":"凯恩斯与大萧条","sub":null,"adv":false},{"code":"H8.8","title":"奥地利学派：米塞斯与哈耶克","sub":null,"adv":false},{"code":"H8.9","title":"熊彼特与创造性破坏","sub":null,"adv":false},{"code":"H8.10","title":"萨缪尔森与新古典综合","sub":null,"adv":false},{"code":"H8.11","title":"本杰明·格雷厄姆与价值投资","sub":null,"adv":false},{"code":"H8.12","title":"弗里德曼、芝加哥学派与货币主义","sub":null,"adv":false},{"code":"H8.13","title":"新凯恩斯主义","sub":null,"adv":false},{"code":"H8.14","title":"公共选择学派","sub":null,"adv":false},{"code":"H8.15","title":"制度经济学：科斯与诺斯","sub":null,"adv":false},{"code":"H8.16","title":"现代货币理论（MMT）","sub":null,"adv":false},{"code":"H8.17","title":"马科维茨与现代投资组合理论","sub":null,"adv":false},{"code":"H8.18","title":"布莱克、斯科尔斯与默顿","sub":null,"adv":false},{"code":"H8.19","title":"法玛、席勒与市场有没有效率","sub":null,"adv":false},{"code":"H8.20","title":"卡尼曼、特沃斯基与行为金融","sub":null,"adv":false},{"code":"H8.21","title":"明斯基与“明斯基时刻”","sub":null,"adv":false},{"code":"H8.22","title":"伯南克与金融危机研究","sub":null,"adv":false}]}]},{"id":"v6","name":"卷六 词条：全部术语中英对照","parts":[{"id":"v6p1","name":"词条分类","group":null,"q":"","role":"","branch":"","lessons":[{"code":"T1","title":"股票类工具（ISO 10962 E 类）","sub":null,"adv":false},{"code":"T2","title":"债务类工具（D 类）","sub":null,"adv":false},{"code":"T3","title":"集合投资工具（C 类）","sub":null,"adv":false},{"code":"T4","title":"权利、权证与杠杆证书（R 类）","sub":null,"adv":false},{"code":"T5","title":"场内期权与期货（O、F 类）","sub":null,"adv":false},{"code":"T6","title":"互换（S 类）","sub":null,"adv":false},{"code":"T7","title":"场外与复杂期权（H 类）","sub":null,"adv":false},{"code":"T8","title":"即期与远期（I、J 类）","sub":null,"adv":false},{"code":"T9","title":"组合策略（K 类）","sub":null,"adv":false},{"code":"T10","title":"融资类：贷款、回购与证券借贷（L 类）","sub":null,"adv":false},{"code":"T11","title":"参照物：货币、商品与利率（T 类）","sub":null,"adv":false},{"code":"T12","title":"数字资产","sub":null,"adv":false},{"code":"T13","title":"市场与交易机制","sub":null,"adv":false},{"code":"T14","title":"机构与参与者","sub":null,"adv":false},{"code":"T15","title":"风险与度量","sub":null,"adv":false},{"code":"T16","title":"监管与合规","sub":null,"adv":false},{"code":"T17","title":"会计与税务","sub":null,"adv":false},{"code":"T18","title":"宏观指标","sub":null,"adv":false},{"code":"T19","title":"微观经济学概念","sub":null,"adv":false},{"code":"T20","title":"国际经济、增长与发展","sub":null,"adv":false},{"code":"T21","title":"商业、管理与行业","sub":null,"adv":false},{"code":"T22","title":"法律","sub":null,"adv":false},{"code":"T23","title":"模型与数学","sub":null,"adv":false},{"code":"T24","title":"投资策略与风格","sub":null,"adv":false},{"code":"T25","title":"人物与事件","sub":null,"adv":false}]}]}],"content":{"0.1":"<div class=\"scene\">\n<p>小王 25 岁，刚工作，每个月能存下 3,000 元，但暂时用不上。小李 30 岁，想开一家咖啡店，需要 50 万元，手里只有 10 万。张阿姨 60 岁，刚退休，想让自己一辈子攒下的钱每个月给她带来一点收入。三个人互不认识，但他们的需要可以拼在一起：小王和张阿姨有钱暂时不用，小李现在就需要钱。把他们连起来的，就是<strong>金融（finance）<\/strong>。<\/p>\n<\/div>\n\n<h2>今天有钱的人，和明天才有钱的人<\/h2>\n<p>每个人一生的收入和花费很少同步。年轻时收入低、想买房；中年时收入高、花得少；退休后几乎没有收入、还要生活。企业也一样：开新工厂要先花钱，好几年后才赚回来。<\/p>\n<p>如果没有金融，每个人只能等攒够了钱再做事：咖啡店要晚开十年，房子要到五十岁才买得起，退休金只能藏在床底下。金融做的第一件事，是让<strong>今天有多余的钱的人<\/strong>，把钱交给<strong>今天需要钱的人<\/strong>；作为回报，后者在未来多还一些。多还的部分，就是利息或投资回报。<\/p>\n\n<h2>直接借，还是通过中间人<\/h2>\n<p>小王可以直接借钱给小李，但他会担心：小李靠谱吗？咖啡店倒闭了怎么办？他需要用钱的时候小李能还吗？于是出现了中间人：<\/p>\n<ul>\n<li><strong>银行<\/strong>：小王把钱存进银行，银行审核后贷给小李，风险由银行承担和分散。<\/li>\n<li><strong>市场<\/strong>：大公司可以直接向公众发行股票和债券，大家各自买一点。<\/li>\n<li><strong>基金、保险和养老金<\/strong>：张阿姨把钱交给专业机构，由它们决定投给谁。<\/li>\n<\/ul>\n<p>这门课的主线，就是跟着一笔钱，从储蓄的人手里出发，经过这些中间人，最终到达用钱的人手里，再看沿途的价格和风险。<\/p>\n\n<div class=\"desk\">\n<p>金融行业的几乎每个岗位，都在这条路上的某个位置：银行的信贷员决定钱借给谁，投资银行帮公司向市场募资，交易员让证券能随时买卖，基金经理替储户挑选投资，风控确认每一环的风险可以承受，监管确保整条路不出大事。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1976 年，孟加拉国经济学家穆罕默德·尤努斯借给 42 位村民共约 27 美元，帮助她们摆脱高利贷。几年后他创办格莱珉银行（Grameen Bank），专门向没有抵押品的穷人发放小额贷款。到 2000 年代，它已服务数百万借款人。2006 年，尤努斯和格莱珉银行获得诺贝尔和平奖。这个故事说明，让钱流到需要它的人手里，本身就能改变很多人的生活。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>每个人和每家企业的收入和花费很少同步，有人暂时有多余的钱，有人暂时需要钱。<\/li>\n<li>金融把两者连起来：有钱的人今天把钱交出去，未来获得回报。<\/li>\n<li>钱可以通过银行、市场或基金保险等中间人流动，这门课就跟着这笔钱走一圈。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>如果世界上没有任何借贷和投资，只能用自己攒的钱，社会会有什么不同？<\/summary>\n<div><p>大部分人买房、上学、创业都要推迟很多年，很多好的项目因为凑不够钱而无法开始，经济增长会慢得多。另一方面，攒下钱的人也只能把钱放着，没有回报，还会被通胀侵蚀。金融让资源更快地流向最需要、最能用好它的地方。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L0-2\"><\/a><\/li>\n<li><a href=\"#L5-2\"><\/a><\/li>\n<li><a href=\"#L6-1\"><\/a><\/li>\n<\/ul><\/div>\n","0.2":"<div class=\"scene\">\n<p>你在银行存了 1 万元。这笔存款是你的资产：你随时可以取出来。但对银行来说，它是一笔负债：银行欠你 1 万元。银行又把这笔钱贷给一家公司，贷款是银行的资产，却是公司的负债。公司用这笔钱付了员工工资，员工又把工资存进银行……金融世界里的每一笔钱，都同时出现在两个地方：<strong>一方的资产，就是另一方的负债<\/strong>。<\/p>\n<\/div>\n\n<h2>资产负债表：看懂金融的基本工具<\/h2>\n<p>每个人、每家公司、每家银行、每个国家，都可以画一张资产负债表（balance sheet）：<\/p>\n<ul>\n<li><strong>资产（assets）<\/strong>：你拥有的东西，或者别人欠你的东西。存款、房子、股票、借出去的钱。<\/li>\n<li><strong>负债（liabilities）<\/strong>：你欠别人的东西。房贷、信用卡欠款。<\/li>\n<li><strong>净值或权益（equity）<\/strong>：资产减负债，真正属于你的部分。<\/li>\n<\/ul>\n<p>金融资产的特别之处在于：它一定是另一方的负债。房子是“实物资产”，不欠任何人；而存款、债券、贷款都是一张“借条”，背后必然有一个欠钱的人。<\/p>\n\n<h2>为什么这个视角很重要<\/h2>\n<ul>\n<li><strong>风险会传递<\/strong>：欠钱的一方出了问题，持有它借条的一方就会受损。一家银行倒闭，持有它债券的基金会亏钱，基金的投资者也会亏钱。<\/li>\n<li><strong>整体上抵消<\/strong>：把全世界的金融资产和金融负债加起来，几乎正好抵消。全社会真正的财富，是房子、工厂、技术这些实物资产和人的能力。金融决定的是这些财富归谁、风险由谁承担。<\/li>\n<li><strong>看清链条<\/strong>：读新闻时问一句“这是谁的资产，谁的负债？”，往往就能看清一场危机会从哪里传到哪里。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>银行分析师、信用分析师和监管者每天都在读资产负债表。分析一家银行，先看它的资产是什么（贷款、债券）、负债是什么（存款、批发融资），两边的期限和风险是否匹配。风控还会看“交易对手”：我们的资产是谁的负债，他们有没有能力还。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年 9 月 15 日，雷曼兄弟破产。它发行的短期商业票据，是很多货币市场基金的资产。第二天，美国历史最悠久的货币基金之一 Reserve Primary Fund 宣布，由于持有约 7.85 亿美元雷曼票据，基金净值跌破 1 美元。投资者纷纷赎回，恐慌迅速蔓延到整个货币基金市场，美国财政部不得不为货币基金提供临时担保。一家公司的负债，就这样变成了千万储户的损失。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>每一项金融资产，都是另一方的负债。<\/li>\n<li>资产负债表由资产、负债和净值组成，是看懂个人、公司、银行和国家的基本工具。<\/li>\n<li>负债一方出问题，风险会传给持有资产的一方，问“谁的资产、谁的负债”能看清风险链条。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家的政府债务越来越多。从“一方的资产就是另一方的负债”的角度看，谁持有这些资产？这对风险意味着什么？<\/summary>\n<div><p>政府债务是国债持有者的资产，可能是本国银行、养老金、保险公司、家庭、央行，也可能是外国投资者。如果本国银行持有大量国债，一旦政府信用出问题，银行也会受损，两者互相拖累，欧债危机中就出现过这种情况。如果外国投资者占比高，资金外流的风险就更大。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L0-3\"><\/a><\/li>\n<li><a href=\"#L6-2\"><\/a><\/li>\n<li><a href=\"#L10-2\"><\/a><\/li>\n<\/ul><\/div>\n","0.3":"<div class=\"scene\">\n<p>17 世纪末的伦敦，一家咖啡馆里坐满了船东、商人和有钱人。一艘船要远航印度，船东担心船沉了血本无归。咖啡馆里的人在一张纸上签名，每人承诺承担一部分损失，换取一笔保费。这家咖啡馆后来发展成了劳合社。这个场景里藏着金融做的三件事中的一件。另外两件，你在上一课已经见过。<\/p>\n<\/div>\n\n<h2>第一件事：跨越时间<\/h2>\n<p>把钱从现在搬到未来，或者从未来搬到现在。存钱和投资是把今天的钱搬到未来；贷款是把未来的收入搬到今天来用。利率就是这种“搬运”的价格。房贷、养老金、企业债券，本质上都在做这件事。<\/p>\n\n<h2>第二件事：分担风险<\/h2>\n<p>把一个人承担不起的风险，分给很多人，或者交给最愿意、最有能力承担的人：<\/p>\n<ul>\n<li><strong>保险<\/strong>：很多人各付一点保费，一起承担少数人的损失。<\/li>\n<li><strong>分散投资<\/strong>：不把钱全押在一家公司上。<\/li>\n<li><strong>衍生品<\/strong>：航空公司担心油价上涨，可以把这个风险转给愿意承担的人。<\/li>\n<li><strong>股权<\/strong>：创业失败的风险由众多股东一起分担。<\/li>\n<\/ul>\n\n<h2>第三件事：解决信息不对称<\/h2>\n<p>借钱的人比借钱给他的人更了解自己的情况：项目好不好、会不会认真还钱。这叫信息不对称（information asymmetry）。如果没人能判断，出借人就会害怕，好的借款人也借不到钱。金融机构和市场通过信用审核、评级、信息披露、抵押品、合同条款来减少这个问题。<\/p>\n\n<h2>还有一件基础的事：支付<\/h2>\n<p>除了这三件事，金融还提供支付（payments）：让钱能安全、快速地从一个人转到另一个人。刷卡、转账、跨境汇款，都是金融基础设施在工作。<\/p>\n\n<div class=\"desk\">\n<p>判断一个金融产品或岗位在做什么，可以问三个问题：它在跨越时间吗？它在转移风险吗？它在解决信息问题吗？比如信贷分析师主要解决信息问题，衍生品交易员主要转移风险，资产管理同时涉及三者。新产品出现时，这三个问题也能帮你看清它真正的价值。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1688 年前后，爱德华·劳埃德在伦敦开了一家咖啡馆，船东和商人在这里交换航运消息、安排海上保险。愿意承担风险的人在保单下方签名，“承保人”（underwriter）一词据说就来源于此。这家咖啡馆后来发展为劳合社（Lloyd's of London），至今仍是全球重要的保险和再保险市场，承保从油轮到卫星发射的各种风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>金融做的第一件事是跨越时间：把钱从现在搬到未来，或从未来搬到现在。<\/li>\n<li>第二件事是分担风险：通过保险、分散、衍生品和股权，把风险交给愿意承担的人。<\/li>\n<li>第三件事是解决信息不对称：通过审核、评级、披露和合同，让出借人敢把钱借出去。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一张信用卡同时在做这三件事中的哪几件？<\/summary>\n<div><p>三件都有。跨越时间：你今天消费，下个月或之后再还。分担风险：银行把大量持卡人的违约风险放在一起，靠利息覆盖少数人的违约。解决信息不对称：银行用信用记录和收入审核决定给你多少额度。同时它还提供支付功能。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L0-4\"><\/a><\/li>\n<li><a href=\"#L1-16\"><\/a><\/li>\n<li><a href=\"#L21-1\"><\/a><\/li>\n<\/ul><\/div>\n","0.4":"<div class=\"scene\">\n<p>一只股票的价格到底由什么决定？金融课本说：价格等于它未来所有现金流的贴现值。经济学课本说：价格由需求和供给决定。两本书说的似乎是两回事。到底谁对？其实两者都对，只是看问题的角度不同。弄清楚这一点，也就弄清楚了<strong>经济学（economics）<\/strong>和<strong>金融学（finance）<\/strong>的关系。<\/p>\n<\/div>\n\n<h2>经济学：资源怎样分配<\/h2>\n<p>经济学研究的是：资源有限，人、企业和政府怎样做选择，这些选择加在一起，怎样决定价格、产出、就业和增长。它分为两大块：<\/p>\n<ul>\n<li><strong>微观经济学<\/strong>：单个消费者、企业和市场，比如价格怎样形成、企业怎样定价。<\/li>\n<li><strong>宏观经济学<\/strong>：整个国家，比如通胀、失业、利率、经济周期。<\/li>\n<\/ul>\n\n<h2>金融学：钱、时间和风险<\/h2>\n<p>金融学可以看作经济学的一个分支，专门研究跨越时间和面对风险时的资源分配：钱该投到哪里、资产值多少、风险怎样定价、公司该怎样融资。它更关注金融市场和金融机构。<\/p>\n<p>两者的关系，可以这样理解：经济学给出大环境，比如利率为什么上升、经济会不会衰退；金融学在这个环境下回答具体问题，比如这只债券值多少钱、这家公司该不该借钱。所以这门课先讲经济学，再讲金融。<\/p>\n\n<h2>回到那个问题：贴现还是供需？<\/h2>\n<ul>\n<li><strong>贴现<\/strong>回答的是“一个投资者愿意出多少钱”：他根据自己对未来现金流的预期和要求的回报率，算出一个价值。<\/li>\n<li><strong>供需<\/strong>回答的是“市场价格最终停在哪里”：所有投资者带着各自的估值来买卖，价格停在买的人和卖的人刚好平衡的位置。<\/li>\n<\/ul>\n<p>长期来看，如果价格远高于大家估算的价值，聪明的投资者会卖出，价格会被拉回来，所以贴现值像一个“锚”。短期内，资金流入流出、情绪、被迫卖出等供需因素，可以让价格大幅偏离这个锚。<\/p>\n\n<div class=\"desk\">\n<p>在交易台上，两种视角同时存在。分析师用贴现模型估算“合理价值”；交易员更关心近期谁在买、谁在卖，资金流向和头寸拥挤程度。好的投资判断往往要回答两个问题：它值多少钱？市场什么时候、因为什么会认识到这一点？<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年 1 月，美国游戏零售商 GameStop 的股价在几周内从不到 20 美元涨到盘中最高约 480 美元（按当时未拆股价格）。公司业务没有发生大的变化，按贴现估算的价值远低于这个价格。推动价格的是供需：大量散户在社交媒体上号召买入，而很多对冲基金做空了这只股票，被迫高价买回平仓（逼空，short squeeze）。几个月后股价大幅回落，但长期仍未回到起点。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>经济学研究有限资源怎样分配，金融学专门研究跨越时间和面对风险时的资源分配。<\/li>\n<li>经济学给出大环境，金融学在这个环境中给资产定价、做投资和融资决策。<\/li>\n<li>贴现值回答“值多少”，供需决定“价格停在哪里”；长期价格围绕价值，短期可以大幅偏离。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>央行宣布加息。用经济学和金融学两种视角，分别会怎样分析这件事？<\/summary>\n<div><p>经济学视角：加息让借钱更贵，消费和投资会减少，经济降温，通胀可能下降，失业可能上升。金融学视角：利率上升，未来现金流的贴现率提高，债券和股票的价值下降；借钱多的公司利息负担加重；银行的净息差可能变化。两种视角结合起来，才能完整判断这件事的影响。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-3\"><\/a><\/li>\n<li><a href=\"#L5-4\"><\/a><\/li>\n<li><a href=\"#L16-14\"><\/a><\/li>\n<\/ul><\/div>\n","0.5":"<div class=\"scene\">\n<p>2007 年，美国加州一位收入不稳定的借款人，申请到了一笔几乎不用首付的房贷。一年后，他还不上钱了。这件事最后让一家德国银行濒临倒闭、冰岛的银行体系崩溃、英国银行门口排起长队、全世界的央行把利率降到接近零。一笔房贷是怎样走到这么远的地方的？把这条路走一遍，就是这门课的全部内容。<\/p>\n<\/div>\n\n<h2>先看懂经济（篇一）<\/h2>\n<p>第 1–4 部讲经济学：人和企业怎样做决定，整个国家的经济怎样运行，国与国之间怎样贸易和投资，经济为什么增长、财富怎样分配。这是理解一切金融现象的背景。<\/p>\n\n<h2>然后，跟着一笔钱走<\/h2>\n<ul>\n<li><strong>篇二 钱从哪里来<\/strong>（第 5–8 部）：钱、利息和时间；你的存款怎样被银行贷出去；央行怎样管银行和利率；政府怎样借钱。<\/li>\n<li><strong>篇三 借钱的市场<\/strong>（第 9–11 部）：债券；金融机构之间的短期借钱和借券；把贷款打包成证券。<\/li>\n<li><strong>篇四 公司<\/strong>（第 12–15 部）：一门生意怎样赚钱；股票和公司金融；公司从创业到上市再到被收购；并购实务。<\/li>\n<li><strong>篇五 交易风险<\/strong>（第 16–18 部）：衍生品；交易在哪里发生；外汇和大宗商品。<\/li>\n<li><strong>篇六 管钱的人<\/strong>（第 19–22 部）：资产管理；对冲基金和私募；保险和养老金；个人理财。<\/li>\n<li><strong>篇七 全景与规则<\/strong>（第 23–26 部）：宏观与大类资产怎样联动；风险管理；监管、会计、税和法律；金融科技等新边界。<\/li>\n<\/ul>\n\n<h2>主线之外的五卷<\/h2>\n<p>主线之外，还有机构、职业、技能、历史和词条五卷，像百科一样随时查。每课最后的“继续深入”会把你带到相关的课；标 ★ 的是进阶课，第一次读可以跳过。<\/p>\n\n<div class=\"desk\">\n<p>每一课都有几个固定部分：开头的场景，中间的讲解，“在交易台上”讲实际工作中怎么用，“真实发生过”讲一个真实事件，最后是三句话总结和一道思考题。建议读完一课后，先自己回答思考题，再展开看答案。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机几乎串起了这门课的每一部：美国的次级房贷（第 6 部）被打包成 MBS 和 CDO（第 11 部），通过 CDS（第 16 部）和回购融资（第 10 部）连到全球银行；德国 IKB 的表外载体在 2007 年 7 月首先出事，英国北岩银行在 9 月遭遇挤兑；2008 年 9 月雷曼破产，货币基金跌破面值（第 19 部）；各国央行降息并推出量化宽松（第 7 部），政府救助银行（第 8 部）；危机后巴塞尔协议全面收紧（第 25 部）。学完这门课，你可以回头再读一遍这段历史。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>这门课先用四部讲清经济学，再跟着一笔钱走过银行、市场、公司、交易和投资。<\/li>\n<li>最后一篇把所有部分连起来：宏观、风险管理、规则和新技术。<\/li>\n<li>机构、职业、技能、历史、词条五卷可以随时查，★ 进阶课第一次可以跳过。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>在开始之前，试着回答：你每个月的工资，从公司账户到你手里，再到你花掉或存起来，经过了哪些金融机构？<\/summary>\n<div><p>公司在银行的账户通过支付系统（可能经过央行的清算系统）把工资转到你的银行账户。你刷卡消费时，经过卡组织和商户的收单银行。你存下的钱，银行可能贷给别人或买债券；你买的基金，基金公司把钱投给股票和债券；你的养老金由养老金机构管理。几乎每一部的内容，都在你的工资里出现过。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-1\"><\/a><\/li>\n<li><a href=\"#L5-1\"><\/a><\/li>\n<li><a href=\"#LH5-5\"><\/a><\/li>\n<\/ul><\/div>\n","1.1":"<div class=\"scene\">\n<p>周六下午，你有三个选择：加班赚 800 元加班费，陪朋友去看电影，或者在家复习下个月的考试。你只能选一个。选了看电影，你放弃的不只是电影票的钱，还有那 800 元，或者一下午的复习时间。经济学把这种“为了得到一样东西而放弃的最好的另一样东西”叫作<strong>机会成本（opportunity cost）<\/strong>。它源自一个更根本的事实：<strong>稀缺（scarcity）<\/strong>。<\/p>\n<\/div>\n\n<h2>稀缺：经济学的起点<\/h2>\n<p>时间、钱、土地、能源、人才，都是有限的；而人想要的东西几乎是无限的。资源不够满足所有愿望，就必须选择。经济学研究的，就是在稀缺之下人们怎样选择，以及这些选择带来什么结果。<\/p>\n<p>稀缺不等于“很少”。一个亿万富翁的钱很多，但他的时间同样每天只有 24 小时，他也必须选择。<\/p>\n\n<h2>机会成本：真正的代价<\/h2>\n<p>一件事的真正成本，是为它放弃的最好的替代选择。几个例子：<\/p>\n<ul>\n<li>读两年全日制硕士，成本不只是学费，还有这两年本可以赚到的工资。<\/li>\n<li>一家公司把 1 亿元留在账上不用，成本是这笔钱本可以获得的投资回报。<\/li>\n<li>政府把一块地用来建公园，成本是这块地本可以用来建住宅或学校。<\/li>\n<\/ul>\n<p>机会成本很容易被忽视，因为它不会出现在账单上。但好的决定，总是把它算进去。<\/p>\n\n<div class=\"desk\">\n<p>金融里到处都是机会成本。投资决策中最常用的“要求回报率”（required return），本质上就是机会成本：投这个项目，就不能投其他风险相当的项目，所以至少要赚到那些项目能赚的回报。公司金融里的“资本成本”、交易台上持有头寸的“资金成本”，都是同样的思路。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年美联储快速加息后，持有现金的机会成本突然变得很高：活期存款几乎没有利息，而货币市场基金的收益率升到 5% 左右。大量资金从银行存款流向货币基金，美国货币市场基金的总规模在 2024 年超过 6 万亿美元，创下历史纪录。利率低的时候，把钱放在活期账户里“几乎没有代价”；利率高的时候，同样的选择每年要放弃 5% 的回报。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>资源有限而愿望无限，这就是稀缺，它迫使人们做选择。<\/li>\n<li>一个选择的机会成本，是为它放弃的最好的替代选择。<\/li>\n<li>金融里的要求回报率和资本成本，本质上都是机会成本。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司账上有大量现金，利率为零时，股东为什么不太在意？利率升到 5% 后，股东为什么开始要求公司分红或回购股票？<\/summary>\n<div><p>利率为零时，持有现金的机会成本很低：拿去投资别的低风险资产也赚不了多少。利率升到 5% 后，如果公司把现金闲置，或者只能投资回报率低于 5% 的项目，股东就是在放弃本可以轻松获得的回报。股东更愿意公司把钱还回来，自己去投资。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-2\"><\/a><\/li>\n<li><a href=\"#L5-2\"><\/a><\/li>\n<li><a href=\"#L5-9\"><\/a><\/li>\n<\/ul><\/div>\n","1.2":"<div class=\"scene\">\n<p>你花 300 元买了一张演唱会门票。演出当天下大雨，你感冒了，也不太想去了。你会想：“票都买了，不去就浪费了。”于是你冒雨去了，结果病得更重。经济学会说：那 300 元已经花掉了，不管去不去都拿不回来，它是<strong>沉没成本（sunk cost）<\/strong>，不该影响你的决定。你真正应该比较的是：从现在开始，去和不去，哪个更好？这就是<strong>边际思维（marginal thinking）<\/strong>。<\/p>\n<\/div>\n\n<h2>边际思维：只看“再多一点”<\/h2>\n<p>边际（marginal）的意思是“额外的一单位”。经济学认为，理性的决定是比较额外一单位带来的好处和成本：<\/p>\n<ul>\n<li>工厂要不要多生产一件产品？看这一件的额外收入（边际收益）是否大于额外成本（边际成本）。<\/li>\n<li>要不要多学一个小时？看这一小时带来的进步，是否值得放弃的休息或娱乐。<\/li>\n<li>航空公司要不要以低价卖出最后几个空座？只要票价高于多载一个乘客的额外成本（餐食、燃油），就值得卖。<\/li>\n<\/ul>\n<p>平均成本常常会误导人，边际成本才是做决定时该看的。<\/p>\n\n<h2>沉没成本：已经回不来的钱<\/h2>\n<p>沉没成本是已经发生、无论怎么选都无法收回的成本。它和未来的决定无关。但人很难忽略它，因为放弃意味着承认之前的投入“白费了”。这种心理叫沉没成本谬误（sunk cost fallacy）。<\/p>\n\n<div class=\"desk\">\n<p>投资者最常见的错误之一，就是被买入价格“锚住”：一只股票从 100 元跌到 60 元，不愿卖出，想等回本再说。但买入价是沉没成本，正确的问题是：以今天 60 元的价格，如果手里是现金，我还会买它吗？交易台上也一样，评估一个头寸只看今天的价格和未来的风险收益，不看当初在什么价位建仓。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>英法两国在 1960 年代开始联合研发协和式超音速客机。研发过程中，成本不断上升，商业前景越来越差，但两国政府因为已经投入巨大，又涉及国家声誉和合同，一直没有停止。协和客机 1976 年投入商业运营，只生产了 20 架，长期难以盈利，2003 年全部退役。“协和谬误”（Concorde fallacy）后来成了沉没成本谬误的代名词。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>边际思维比较额外一单位的好处和成本，是理性决定的核心。<\/li>\n<li>沉没成本已经发生、无法收回，不应该影响未来的决定。<\/li>\n<li>投资中不要被买入价锚住，只看今天的价格和未来的前景。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司已经在一个项目上投入了 5 亿元，完成项目还需要 3 亿元，完成后预计能带来 2 亿元收入。应不应该继续？<\/summary>\n<div><p>不应该（假设没有其他好处）。已经投入的 5 亿元是沉没成本，无论是否继续都拿不回来。从现在起，继续需要再花 3 亿元，只能带来 2 亿元，额外损失 1 亿元。停下来虽然意味着承认之前的 5 亿元“打了水漂”，但继续只会损失更多。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-1\"><\/a><\/li>\n<li><a href=\"#L1-8\"><\/a><\/li>\n<li><a href=\"#L1-23\"><\/a><\/li>\n<\/ul><\/div>\n","1.3":"<div class=\"scene\">\n<p>2020 年 4 月 20 日，美国原油期货价格跌到了负 37 美元一桶。这意味着卖方要倒贴钱给买方，才能把原油“送”出去。疫情让全世界的工厂停工、飞机停飞，石油需求骤降；产油国却没能及时减产，储油罐快满了。没有人愿意接收原油，价格就跌破了零。这是<strong>需求（demand）<\/strong>和<strong>供给（supply）<\/strong>最极端的一课。<\/p>\n<\/div>\n\n<h2>需求：价格越低，想买的人越多<\/h2>\n<p>需求描述的是：在每一个价格下，人们愿意并且能够买多少。通常价格越低，买的人越多、买的量越大，这叫需求定律。画成图，就是一条向右下方倾斜的需求曲线。<\/p>\n<p>价格之外，收入、偏好、其他商品的价格、对未来的预期等因素变化，会让整条需求曲线移动。比如经济衰退时收入下降，很多商品在每个价格上的需求都会减少。<\/p>\n\n<h2>供给：价格越高，想卖的人越多<\/h2>\n<p>供给描述的是：在每一个价格下，生产者愿意卖多少。价格越高，生产越有利可图，供给越多。供给曲线向右上方倾斜。<\/p>\n<p>生产成本、技术、生产者数量、天气等因素变化，会让整条供给曲线移动。比如技术进步让太阳能电池板更便宜，供给增加。<\/p>\n\n<h2>均衡：价格停在哪里<\/h2>\n<p>需求曲线和供给曲线相交的地方，买的量正好等于卖的量，这就是均衡价格（equilibrium price）。如果价格高于均衡，卖不出去的货会积压，卖家会降价；如果价格低于均衡，东西不够卖，买家会抬价。价格就这样自动向均衡移动。<\/p>\n<p>价格因此成为一种信号：它告诉生产者生产什么、生产多少，告诉消费者什么东西稀缺。<\/p>\n\n<div class=\"desk\">\n<p>金融市场也是供需。债券收益率上升，可能是因为政府发债太多（供给增加），也可能是因为投资者不想买了（需求减少）。交易员每天都在问：今天谁在买、谁在卖？有没有大额发行、央行购买、基金赎回？这些供需因素在短期内往往比基本面更能解释价格变化。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 4 月 20 日，即将到期的 5 月 WTI 原油期货合约收于每桶约负 37.63 美元，是史上第一次出现负油价。原因是：疫情让需求暴跌，而交割地美国俄克拉何马州库欣的储油设施接近满载。持有多头合约、不想或无法接收实物原油的投资者，只能不计代价卖出。第二天，下一个月的合约价格仍在 20 美元左右。这说明供需的冲击，在特定时间和地点可以极其剧烈。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>需求曲线向下倾斜：价格越低，买得越多；供给曲线向上倾斜：价格越高，卖得越多。<\/li>\n<li>两条曲线相交处是均衡价格，价格会自动向均衡调整。<\/li>\n<li>价格以外的因素会移动整条曲线；金融市场的价格也由供需决定。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家宣布大幅增加国债发行。如果投资者的需求不变，国债的价格和收益率会怎样？如果央行同时宣布大量买入国债呢？<\/summary>\n<div><p>供给增加、需求不变，国债价格会下跌，收益率上升，才能吸引投资者买下更多国债。如果央行同时大量买入，相当于需求也增加，抵消了供给增加的影响，价格和收益率可能变化不大。这正是量化宽松时期常见的情况。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-4\"><\/a><\/li>\n<li><a href=\"#L0-4\"><\/a><\/li>\n<li><a href=\"#L18-9\"><\/a><\/li>\n<\/ul><\/div>\n","1.4":"<div class=\"scene\">\n<p>2011 年，美国流媒体公司 Netflix 宣布，把同时包含 DVD 租赁和在线观看的套餐价格提高约 60%。公司以为大多数用户会接受。结果，一个季度内它在美国流失了约 80 万订户，股价在几个月内跌去了一大半。Netflix 错估了一个关键问题：价格涨一点，用户会少多少？经济学把这个问题叫作<strong>弹性（elasticity）<\/strong>。<\/p>\n<\/div>\n\n<h2>需求的价格弹性<\/h2>\n<p>需求的价格弹性衡量的是：价格变化 1%，需求量变化百分之几。<\/p>\n<ul>\n<li><strong>富有弹性（elastic）<\/strong>：价格稍微上涨，需求就大幅减少。比如某个品牌的饮料，旁边就有很多替代品。<\/li>\n<li><strong>缺乏弹性（inelastic）<\/strong>：价格上涨很多，需求也只减少一点。比如汽油、药品、香烟，短期内很难不用。<\/li>\n<\/ul>\n<p>弹性决定了涨价能否增加收入：需求缺乏弹性时，涨价会让总收入增加；需求富有弹性时，涨价反而让总收入减少。<\/p>\n\n<h2>什么决定弹性<\/h2>\n<ul>\n<li><strong>替代品多不多<\/strong>：替代品越多，弹性越大。<\/li>\n<li><strong>是必需品还是奢侈品<\/strong>：必需品弹性小，奢侈品弹性大。<\/li>\n<li><strong>占收入比例<\/strong>：占收入比例越大，人们对价格越敏感。<\/li>\n<li><strong>时间长短<\/strong>：短期内弹性小，长期内人们会找到替代办法，弹性变大。比如油价长期上涨，人们会换电动车。<\/li>\n<\/ul>\n<p>供给也有弹性：价格上涨时，生产者能多快增加供给。农产品、石油短期供给弹性很小，所以价格容易大幅波动。<\/p>\n\n<div class=\"desk\">\n<p>行业研究中，“定价能力”（pricing power）是分析师最看重的指标之一，背后就是弹性：一家公司能否在不流失客户的情况下涨价。通胀时期，需求缺乏弹性的公司（拥有强大品牌、垄断地位或必需品）能把成本转嫁给消费者，利润率保持稳定；需求富有弹性的公司则利润被挤压。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2011 年 7 月，Netflix 宣布将 DVD 和在线观看拆分为两个独立套餐，同时订阅两者的价格从每月约 10 美元涨到约 16 美元。随后一个季度，公司在美国流失约 80 万订户，股价从当年 7 月的高点到年底下跌了约四分之三。Netflix 很快放弃了拆分计划。多年后，Netflix 内容积累、替代品相对减少后，多次涨价时流失的用户就少得多，弹性已经变了。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>弹性衡量价格变化 1%，需求量（或供给量）变化百分之几。<\/li>\n<li>替代品越多、越非必需、占收入越高、时间越长，需求弹性越大。<\/li>\n<li>弹性决定了涨价对收入的影响，是分析企业定价能力的关键。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>政府想通过提高香烟税来增加财政收入，同时减少吸烟。这两个目标会不会冲突？<\/summary>\n<div><p>会有一定冲突。香烟需求短期内缺乏弹性，加税后吸烟量减少不多，税收收入会明显增加，但减少吸烟的效果有限。如果需求富有弹性，吸烟量会大幅减少，但税收增加不多。长期看，弹性通常更大，尤其是对价格敏感的年轻人，所以加税的控烟效果会随时间增强。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-3\"><\/a><\/li>\n<li><a href=\"#L1-5\"><\/a><\/li>\n<li><a href=\"#L1-22\"><\/a><\/li>\n<\/ul><\/div>\n","1.5":"<div class=\"scene\">\n<p>2008 年金融危机，很多人失业或收入下降，高档餐厅的生意一落千丈。同一时期，麦当劳的全球同店销售额却增长了约 7%。收入减少时，人们没有少吃饭，只是把高档餐厅换成了快餐。同一件事，对不同商品的影响完全相反。这背后有四个概念：<strong>正常品、劣等品、替代品和互补品<\/strong>。<\/p>\n<\/div>\n\n<h2>收入变化时：正常品和劣等品<\/h2>\n<ul>\n<li><strong>正常品（normal goods）<\/strong>：收入增加，需求增加。大多数商品都是正常品，比如外出就餐、旅行、新车。其中收入增加时需求增长更快的，叫奢侈品（luxury goods）。<\/li>\n<li><strong>劣等品（inferior goods）<\/strong>：收入增加，需求反而减少。比如方便面、二手车、公交出行：收入提高后，人们会换成更好的选择。<\/li>\n<\/ul>\n<p>同一件商品对不同人可能属性不同：对低收入者，快餐可能是正常品；对中高收入者，它可能更像劣等品。<\/p>\n\n<h2>其他商品价格变化时：替代品和互补品<\/h2>\n<ul>\n<li><strong>替代品（substitutes）<\/strong>：可以互相代替的商品。一个涨价，另一个的需求增加。比如咖啡和茶、高铁和飞机、燃油车和电动车。<\/li>\n<li><strong>互补品（complements）<\/strong>：一起使用的商品。一个涨价，另一个的需求减少。比如打印机和墨盒、汽车和汽油、游戏机和游戏。<\/li>\n<\/ul>\n<p>很多商业模式利用互补品：低价卖打印机、高价卖墨盒；低价卖游戏机、靠游戏赚钱。<\/p>\n\n<div class=\"desk\">\n<p>行业研究和宏观交易常用这几个概念判断经济周期对不同公司的影响。经济扩张时，奢侈品、旅游、汽车等“可选消费”（consumer discretionary）受益最大；衰退时，食品、日用品等“必需消费”（consumer staples）更稳定，折扣零售甚至可能受益。投资者在周期不同阶段会在这些板块之间轮动。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年，在全球经济陷入衰退的背景下，麦当劳全球同店销售额增长约 7%，股价全年小幅上涨，是道琼斯指数中少数上涨的成分股之一，而当年道指整体下跌三成以上。很多消费者从全服务餐厅转向快餐。同一时期，豪华汽车和高端餐饮的销售大幅下降。收入冲击对不同商品的影响，取决于它们是正常品还是更接近劣等品。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>正常品在收入增加时需求增加，劣等品在收入增加时需求减少。<\/li>\n<li>替代品此消彼长，互补品同涨同跌。<\/li>\n<li>这些概念帮助判断经济周期对不同行业和公司的影响。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>油价大幅上涨，对以下几类公司分别是利好还是利空：航空公司、电动车厂商、大排量 SUV 厂商、公共交通运营商？<\/summary>\n<div><p>航空公司：燃油是主要成本，利空。电动车厂商：电动车是燃油车的替代品，利好。大排量 SUV 厂商：汽油是汽车的互补品，油价上涨让耗油的车更不受欢迎，利空。公共交通运营商：公共交通是自驾的替代品，客流可能增加，利好，但如果它自己也用燃油，成本会上升。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-4\"><\/a><\/li>\n<li><a href=\"#L1-7\"><\/a><\/li>\n<li><a href=\"#L1-19\"><\/a><\/li>\n<\/ul><\/div>\n","1.6":"<div class=\"scene\">\n<p>你本来愿意花 50 元打车回家，结果软件显示只要 30 元。你多赚了 20 元的“满足感”。司机本来愿意 20 元就接这单，结果收到 30 元，他也多赚了 10 元。一笔交易，双方都觉得赚了。经济学把这两部分分别叫作<strong>消费者剩余（consumer surplus）<\/strong>和<strong>生产者剩余（producer surplus）<\/strong>。它们解释了为什么自愿的交易能让双方都变好。<\/p>\n<\/div>\n\n<h2>消费者剩余：愿意付的减去实际付的<\/h2>\n<p>每个消费者心里都有一个最高愿意支付的价格（willingness to pay）。实际价格低于这个价格时，差额就是他的消费者剩余。把所有买家的剩余加起来，就是这个市场的消费者剩余。价格越低，消费者剩余越大。<\/p>\n\n<h2>生产者剩余：实际收到的减去最低愿意接受的<\/h2>\n<p>每个卖家都有一个最低愿意接受的价格，通常和他的成本有关。实际价格高于这个价格时，差额就是生产者剩余。价格越高，生产者剩余越大。<\/p>\n\n<h2>总剩余：市场创造了多少价值<\/h2>\n<p>消费者剩余加生产者剩余，就是这个市场创造的总剩余（total surplus），衡量交易给社会带来的好处。在竞争市场中，均衡价格让总剩余最大：所有“愿意付的高于愿意接受的”交易都发生了。<\/p>\n<p>如果政府设定价格上限、征税，或者市场被垄断，一部分本该发生的交易就不会发生，总剩余减少。减少的部分叫无谓损失（deadweight loss），是谁也得不到的损失。<\/p>\n\n<div class=\"desk\">\n<p>剩余的概念在金融里也很常见。做市商的买卖价差，可以看作它提供流动性获得的“生产者剩余”；投资者愿意为一只能随时卖出的债券多付一点钱，就是流动性带来的“消费者剩余”。分析一个新的金融产品或平台时，也常问：它为客户创造了多少剩余，又能从中分到多少？<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2016 年，几位经济学家利用网约车平台 Uber 的海量数据估算消费者剩余。他们利用“动态加价”时价格的变化，观察不同价格下乘客是否下单，估计出 2015 年美国 UberX 服务创造的消费者剩余约为 68 亿美元，相当于乘客每花 1 美元，就额外获得约 1.6 美元的剩余。这项研究常被用来说明：新技术和平台带来的好处，很多并不体现在 GDP 或公司收入里。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>消费者剩余是愿意支付的价格减去实际价格，生产者剩余是实际价格减去最低接受价格。<\/li>\n<li>两者之和是总剩余，衡量交易给社会带来的好处，竞争市场的均衡让它最大。<\/li>\n<li>价格管制、税收和垄断会让部分交易无法发生，造成无谓损失。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个平台上线后，乘客打车更便宜、更方便，司机收入也增加了。但出租车公司的利润下降了。社会整体是变好了还是变坏了？<\/summary>\n<div><p>要比较总剩余的变化。乘客的消费者剩余增加，新司机获得了生产者剩余，出租车公司的生产者剩余减少。如果增加的部分大于减少的部分，社会整体变好了，但收益和损失落在不同的人身上，所以会有赢家和输家。这也是新技术常引起争议的原因。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-21\"><\/a><\/li>\n<li><a href=\"#L1-22\"><\/a><\/li>\n<li><a href=\"#L1-24\"><\/a><\/li>\n<\/ul><\/div>\n","1.7":"<div class=\"scene\">\n<p>大热天，你走了很久，买了一瓶冰水。第一口简直是享受；第二瓶还不错；喝到第四瓶，你已经一点也不想要了。同样一瓶水，带给你的满足感越来越少。经济学把这种满足感叫作<strong>效用（utility）<\/strong>，把“每多一单位带来的额外满足感越来越少”叫作<strong>边际效用递减（diminishing marginal utility）<\/strong>。这个简单的道理，能解释从购物到买保险的很多选择。<\/p>\n<\/div>\n\n<h2>预算约束：钱是有限的<\/h2>\n<p>每个人都有一个预算约束（budget constraint）：能买的东西，受收入和价格限制。在这个限制下，人们会尽量选择让自己总效用最大的组合。<\/p>\n<p>一个简单的规则是：把钱花在“每一块钱带来的额外效用最多”的地方。如果最后一块钱花在咖啡上带来的满足感，比花在书上的多，就多买咖啡、少买书，直到两者相等。这时就没法再通过调整变得更好了。<\/p>\n\n<h2>价格变化时，选择怎样变<\/h2>\n<p>一件商品涨价，会产生两种效应：<\/p>\n<ul>\n<li><strong>替代效应（substitution effect）<\/strong>：它相对变贵了，人们转向其他商品。<\/li>\n<li><strong>收入效应（income effect）<\/strong>：同样的收入能买的东西变少了，相当于变穷了。<\/li>\n<\/ul>\n<p>两种效应合在一起，决定了需求量变化多少。<\/p>\n\n<h2>边际效用递减和风险<\/h2>\n<p>边际效用递减还解释了人们为什么厌恶风险（risk aversion）。对一个只有 10 万元的人来说，赢 10 万元带来的快乐，远小于输掉 10 万元带来的痛苦，因为最后那 10 万元对他来说太重要了。所以人们愿意花钱买保险，把一个可能的大损失换成一笔确定的小支出。<\/p>\n\n<div class=\"desk\">\n<p>金融学中的很多理论都建立在效用之上。投资组合理论假设投资者在收益和风险之间权衡；资产定价理论认为，在经济差、人们最需要钱的时候表现好的资产更值钱，所以保险类资产（如国债、看跌期权）的预期回报较低，而在经济差时表现更差的资产（如股票）需要更高的预期回报来补偿。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1738 年，数学家丹尼尔·伯努利研究了一个著名的问题“圣彼得堡悖论”：一个游戏的期望奖金是无穷大，但几乎没有人愿意花很多钱去玩。伯努利的解释是，人们看重的是财富带来的效用，而不是财富本身，财富越多，每多一块钱的效用越小。这是经济学中效用思想的早期起源，两百年后发展为现代的期望效用理论。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>效用是从消费中获得的满足感，每多一单位带来的额外效用通常越来越少。<\/li>\n<li>在预算约束下，人们把钱分配到“每一块钱的额外效用”相等的状态。<\/li>\n<li>边际效用递减解释了风险厌恶，也是保险和资产定价理论的基础。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个有 1 亿元财富的人和一个只有 10 万元的人，面对同一个“一半概率赢 5 万、一半概率输 5 万”的赌局，谁更可能接受？为什么？<\/summary>\n<div><p>有 1 亿元的人更可能接受，或者至少不那么在意。对他来说，5 万元的输赢只是财富的极小一部分，效用变化几乎是线性的，风险厌恶程度很低。对只有 10 万元的人来说，输掉 5 万元意味着财富减半，痛苦远大于赢 5 万元的快乐，他会强烈拒绝。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-5\"><\/a><\/li>\n<li><a href=\"#L5-9\"><\/a><\/li>\n<li><a href=\"#L1-23\"><\/a><\/li>\n<\/ul><\/div>\n","1.8":"<div class=\"scene\">\n<p>1908 年，福特 T 型车售价约 850 美元，是普通工人好几年的收入。1913 年福特引入流水线，造一辆车的时间从十几个小时缩短到一个半小时左右。产量越大，每辆车分摊的成本越低，福特就越能降价；降价后卖得更多，成本又进一步下降。到 1920 年代中期，T 型车售价降到 300 美元以下。这就是<strong>规模经济（economies of scale）<\/strong>的力量。<\/p>\n<\/div>\n\n<h2>成本的几种类型<\/h2>\n<ul>\n<li><strong>固定成本（fixed cost）<\/strong>：不随产量变化的成本，比如厂房、设备、研发、系统。<\/li>\n<li><strong>可变成本（variable cost）<\/strong>：随产量变化的成本，比如原材料、计件工资、能源。<\/li>\n<li><strong>平均成本（average cost）<\/strong>：总成本除以产量。<\/li>\n<li><strong>边际成本（marginal cost）<\/strong>：多生产一单位增加的成本。<\/li>\n<\/ul>\n<p>固定成本高的行业，产量越大，平均成本下降越明显。软件、药品、芯片、平台就是典型：开发第一份要花几十亿，之后每多卖一份的边际成本很低。<\/p>\n\n<h2>规模经济和规模不经济<\/h2>\n<p>规模经济的来源包括：固定成本被摊薄、大批量采购的议价能力、专业分工、更高效的技术。但规模不是越大越好。企业过大后，管理层级增多、协调困难、反应变慢，平均成本可能反而上升，这叫规模不经济（diseconomies of scale）。<\/p>\n\n<h2>范围经济：一起做更便宜<\/h2>\n<p>范围经济（economies of scope）是指：同时生产多种产品，比分别生产更便宜。比如同一套物流网络既送书又送电器，同一个银行网点既办存款又卖保险。共享的资源让每种产品的成本都下降。<\/p>\n\n<div class=\"desk\">\n<p>金融业的规模经济很明显。托管银行、清算所、指数基金和支付网络的固定成本主要在系统和合规上，规模越大，单位成本越低，所以这些行业往往由少数几家巨头主导。大型银行的范围经济体现在一个客户同时使用贷款、支付、外汇、投行服务。分析金融公司时，要看它的成本收入比随规模怎样变化。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美国指数基金的费率在过去几十年持续下降。先锋集团（Vanguard）1976 年推出第一只面向散户的指数基金。随着规模增长到数万亿美元，大型指数基金的年费率降到 0.1% 以下，部分产品接近零。2018 年，富达推出了零费率的指数基金。规模带来的成本下降，被以低费率的形式让给投资者，又吸引了更多资金，形成正反馈。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>成本分为固定成本和可变成本；做决定时要看边际成本，评估效率时看平均成本。<\/li>\n<li>规模经济让平均成本随产量下降，规模过大则可能出现规模不经济。<\/li>\n<li>范围经济是指同时生产多种产品更便宜，金融业的规模经济和范围经济都很明显。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家小型资产管理公司和一家管理数万亿美元的公司竞争指数基金业务，小公司有什么劣势？它可以怎样竞争？<\/summary>\n<div><p>指数基金的成本主要是固定的系统、合规和运营成本，大公司分摊到每一块钱上的成本低得多，能把费率压到小公司无法承受的水平。小公司很难在费率上竞争，可以转向大公司不擅长或规模较小的领域，比如主动管理、细分主题、定制化服务或特定地区市场，靠差异化而不是规模竞争。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-2\"><\/a><\/li>\n<li><a href=\"#L1-9\"><\/a><\/li>\n<li><a href=\"#L1-10\"><\/a><\/li>\n<\/ul><\/div>\n","1.9":"<div class=\"scene\">\n<p>老张辞掉年薪 30 万元的工作，拿出自己的 200 万元积蓄开了一家餐馆。第一年，餐馆收入减去房租、食材、员工工资，赚了 25 万元。会计说：盈利 25 万，不错。经济学家说：你其实亏了。因为你放弃了 30 万的工资，那 200 万如果拿去投资，一年也能赚 10 万。这就是<strong>会计利润（accounting profit）<\/strong>和<strong>经济利润（economic profit）<\/strong>的区别。<\/p>\n<\/div>\n\n<h2>会计利润：账上看得见的<\/h2>\n<p>会计利润 = 收入 − 显性成本。显性成本是实际付出去的钱：房租、原材料、工资、利息、税。财务报表上的净利润，就是会计利润。<\/p>\n\n<h2>经济利润：把机会成本也算进去<\/h2>\n<p>经济利润 = 收入 − 显性成本 − 隐性成本。隐性成本就是机会成本：自己投入的时间本可以赚的工资，自己投入的资本本可以获得的回报。<\/p>\n<p>在老张的例子里：会计利润 25 万，减去放弃的工资 30 万和资本的机会成本 10 万，经济利润是负 15 万。从经济学角度，他的资源用在别处会更好。<\/p>\n\n<h2>为什么经济利润更重要<\/h2>\n<ul>\n<li>经济利润为正，说明资源用在这里比用在别处更有价值，会吸引新的竞争者进入。<\/li>\n<li>经济利润为负，说明资源用在别处更好，长期会有人退出。<\/li>\n<li>在竞争充分的市场中，长期经济利润趋向于零：企业只能赚到“正常利润”，也就是刚好补偿机会成本的利润。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>投资分析中，最常用的“经济利润”指标是投入资本回报率（ROIC）和加权平均资本成本（WACC）的比较。ROIC 高于 WACC，公司在创造价值；低于 WACC，即使会计上有盈利，也在毁灭价值。银行分析中，股本回报率（ROE）要和股本成本（cost of equity）比较。很多公司还用经济增加值（EVA）来考核管理层。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1980 年代起担任可口可乐首席执行官的罗伯托·戈伊苏埃塔，是最早系统使用“经济利润”管理公司的人之一。他要求每个业务都要赚到超过资本成本的回报，否则就要改进或退出，并据此出售低回报业务、减少资本占用。可口可乐的市值在他任内增长了数十倍。1990 年代，咨询公司思腾思特（Stern Stewart）把这一思路推广为“经济增加值”（EVA），被许多大公司采用。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>会计利润只减去显性成本，经济利润还要减去机会成本。<\/li>\n<li>经济利润为正会吸引竞争者进入，竞争充分时长期经济利润趋于零。<\/li>\n<li>投资中用 ROIC 与 WACC、ROE 与股本成本的比较来判断公司是否在创造价值。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行的 ROE 是 8%，股东要求的回报率是 11%。这家银行会计上赚钱，为什么它的股价可能低于每股净资产？<\/summary>\n<div><p>因为它的经济利润为负：股东每投入 1 元，银行每年只能赚 0.08 元，而股东本可以在风险相当的地方赚 0.11 元。银行在“毁灭价值”，市场不愿意按账面价值购买它的股权，股价就低于每股净资产（市净率低于 1）。很多欧洲银行在 2010 年代就长期处于这种状态。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-1\"><\/a><\/li>\n<li><a href=\"#L1-10\"><\/a><\/li>\n<li><a href=\"#L13-49\"><\/a><\/li>\n<\/ul><\/div>\n","1.10":"<div class=\"scene\">\n<p>你家楼下有十几家小吃店，谁也不敢随便涨价；你用的手机操作系统基本只有两家可选；你所在城市的自来水只有一家公司供应。同样是做生意，竞争的激烈程度天差地别。经济学按竞争程度把市场分成四种<strong>市场结构（market structure）<\/strong>：完全竞争、垄断竞争、寡头和垄断。<\/p>\n<\/div>\n\n<h2>四种市场结构<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>结构<\/th><th>企业数量<\/th><th>产品<\/th><th>定价能力<\/th><th>例子<\/th><\/tr>\n<tr><td>完全竞争<\/td><td>很多<\/td><td>完全相同<\/td><td>没有，只能接受市场价<\/td><td>农产品、外汇市场的接近形态<\/td><\/tr>\n<tr><td>垄断竞争<\/td><td>很多<\/td><td>有差别<\/td><td>有一点<\/td><td>餐馆、服装、理发店<\/td><\/tr>\n<tr><td>寡头<\/td><td>少数几家<\/td><td>相同或有差别<\/td><td>较强，互相影响<\/td><td>航空、电信、手机操作系统、评级机构<\/td><\/tr>\n<tr><td>垄断<\/td><td>一家<\/td><td>没有替代品<\/td><td>很强<\/td><td>自来水、电网、专利药<\/td><\/tr>\n<\/table><\/div>\n\n<h2>竞争程度决定利润<\/h2>\n<ul>\n<li><strong>完全竞争<\/strong>：价格被压到边际成本，长期经济利润为零。<\/li>\n<li><strong>垄断竞争<\/strong>：通过品牌和差异化获得一点定价能力，但新进入者会不断蚕食利润。<\/li>\n<li><strong>寡头<\/strong>：少数企业互相观察对方的行动，可能激烈价格战，也可能默契地维持高价。<\/li>\n<li><strong>垄断<\/strong>：可以把价格定在高于边际成本的水平，长期获得经济利润，但产量低于社会最优，造成无谓损失。<\/li>\n<\/ul>\n<p>决定市场结构的关键是进入壁垒（barriers to entry）：规模经济、专利、牌照、网络效应、品牌、转换成本等。壁垒越高，竞争越少。<\/p>\n\n<div class=\"desk\">\n<p>投资者常说的“护城河”（moat），就是可持续的进入壁垒，让公司能长期赚取超额回报。分析一个行业时，常用集中度指标衡量竞争程度：前几家公司的市场份额之和（CR4），或者赫芬达尔-赫希曼指数（HHI）。反垄断机构审查并购时，也会看并购前后 HHI 的变化。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>评级行业是典型的寡头市场。根据美国证监会的年度报告，标普、穆迪和惠誉三家合计约占全部未到期信用评级的 95%。高进入壁垒来自监管认可、声誉和网络效应：投资者和监管规则都习惯使用这三家的评级，发行人也只好找它们。2008 年后，监管试图鼓励更多竞争者进入，但三巨头的份额变化不大。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>按竞争程度，市场分为完全竞争、垄断竞争、寡头和垄断。<\/li>\n<li>竞争越少，企业定价能力越强，越可能获得长期经济利润。<\/li>\n<li>进入壁垒决定市场结构，投资者称之为“护城河”，用集中度指标衡量竞争程度。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个行业里只有三家公司，但它们的利润率很低，经常打价格战。另一个行业有几百家公司，但头部公司利润率很高。这说明了什么？<\/summary>\n<div><p>企业数量只是表象，关键是竞争的方式和进入壁垒。三家公司的寡头如果产品同质、产能过剩，可能陷入价格战，利润很低，比如一些航空和化工行业。几百家公司的行业如果头部公司有强大的品牌、技术或网络效应，就能获得很高的定价能力。判断竞争程度要看定价能力和利润的持续性，而不只是数公司。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-13\"><\/a><\/li>\n<li><a href=\"#L1-27\"><\/a><\/li>\n<li><a href=\"#LI2-20\"><\/a><\/li>\n<\/ul><\/div>\n","1.11":"<div class=\"scene\">\n<p>一个小镇上只有一家大工厂。镇上的人想找工作，几乎只能去这家工厂。工厂知道这一点，于是工资给得比别处低，工人也没有更好的选择。我们常说的垄断，是只有一个卖家；而这里是只有一个买家，买的是劳动力。这种市场叫<strong>买方垄断（monopsony）<\/strong>。<\/p>\n<\/div>\n\n<h2>买方垄断是什么<\/h2>\n<p>买方垄断是指市场上只有一个或少数几个买家，卖家没有其他选择，买家因此可以压低价格。最常见的场合是劳动力市场：雇主是“买家”，工人是“卖家”。<\/p>\n<p>和卖方垄断一样，买方垄断也会造成效率损失：雇主为了压低工资，雇用的工人比竞争市场下更少，部分本该发生的雇用没有发生。<\/p>\n\n<h2>在哪里能看到<\/h2>\n<ul>\n<li><strong>劳动力市场<\/strong>：小地方的大雇主，或者某些专业技能只有少数雇主需要，比如军方对某些专业人员。<\/li>\n<li><strong>供应链<\/strong>：一家大型零售商或汽车厂商是很多小供应商的主要客户，可以压低采购价。<\/li>\n<li><strong>医疗<\/strong>：在全民医保体系中，政府是药品和医疗服务的主要买家，有很强的议价能力。<\/li>\n<li><strong>竞业限制<\/strong>：雇主之间约定互不挖人，或用合同限制员工跳槽，会削弱工人的议价能力。<\/li>\n<\/ul>\n\n<h2>和最低工资的关系<\/h2>\n<p>在竞争的劳动力市场中，最低工资可能减少就业。但在买方垄断的市场中，适度的最低工资可能反而增加就业：雇主不能再压低工资，压低雇用人数的动机也就减弱了。这是最低工资争论中的一个重要观点。<\/p>\n\n<div class=\"desk\">\n<p>行业研究中，分析一家公司和供应商、客户之间的议价能力，就是在判断谁在扮演“买方垄断”或“卖方垄断”的角色。比如大型零售商对供应商的压价能力，会直接影响供应商的利润率。信贷分析师评估一家供应商时，也会看它是否过度依赖少数几个大客户。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2010 年，美国司法部调查发现，苹果、谷歌、英特尔、Adobe 等科技公司之间存在互不招揽对方员工的协议。员工随后提起集体诉讼，认为这些协议压低了工资。2015 年，法院批准了 4.15 亿美元的和解方案。这是买方之间合谋形成“买方垄断”的典型案例，也让劳动力市场的反垄断问题受到更多关注。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>买方垄断是只有一个或少数几个买家的市场，买家可以压低价格。<\/li>\n<li>最常见于劳动力市场，也出现在供应链和医疗等领域。<\/li>\n<li>在买方垄断的劳动力市场中，适度的最低工资可能反而增加就业。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家零部件供应商 70% 的收入来自一家汽车厂商。作为它的信贷分析师，你会担心什么？<\/summary>\n<div><p>首先，汽车厂商有很强的议价能力，可以不断压价，挤压供应商的利润率。其次，客户集中风险很高：如果这家汽车厂商减产、换供应商或自己陷入困境，供应商的收入会大幅下降。这样的供应商通常需要更高的风险溢价，信贷协议里也可能加入对客户集中度的监控。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-10\"><\/a><\/li>\n<li><a href=\"#L1-21\"><\/a><\/li>\n<li><a href=\"#L1-27\"><\/a><\/li>\n<\/ul><\/div>\n","1.12":"<div class=\"scene\">\n<p>同一班飞机，坐在你旁边的人可能比你少付了一半的钱：他提前三个月订票、不能退改，而你昨天才订。同一部电影，学生票比成人票便宜；同一款软件，企业版比个人版贵很多。同样的东西对不同的人收不同的价格，这叫<strong>价格歧视（price discrimination）<\/strong>。它听起来不公平，却在商业中无处不在。<\/p>\n<\/div>\n\n<h2>为什么要区别定价<\/h2>\n<p>不同的人愿意支付的价格不同。如果只定一个价格，定高了会失去愿意付得少的客户，定低了会少赚愿意付得多的客户的钱。如果能对每类人收他们愿意付的价格，企业就能把更多消费者剩余变成自己的利润，同时服务更多客户。<\/p>\n<p>价格歧视需要三个条件：企业有一定定价能力；能区分不同客户；客户之间无法转卖。<\/p>\n\n<h2>三种类型<\/h2>\n<ul>\n<li><strong>一级价格歧视<\/strong>：对每个人收他愿意付的最高价格。现实中很难完全做到，但讨价还价、个性化定价接近这一点。<\/li>\n<li><strong>二级价格歧视<\/strong>：按购买量或版本收不同价格，让客户自己选择。比如批量折扣、手机套餐、经济舱和商务舱。<\/li>\n<li><strong>三级价格歧视<\/strong>：按客户群体收不同价格。比如学生折扣、老年人优惠、不同国家定价不同。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>金融业里价格歧视非常普遍。机构客户和散户的交易佣金、贷款利率、理财费率差别很大；同一笔外汇交易，大客户拿到的点差远小于小客户。投行为不同客户分层服务，交易台会根据客户的交易量和关系决定报价。监管则要求金融机构在定价中不能歧视受保护群体，也要求对散户充分披露费用。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2000 年 9 月，有消费者发现，亚马逊对同一张 DVD 向不同顾客显示不同价格，差价可达数美元。消息传开后引发强烈批评。亚马逊称这只是随机的价格测试，与客户的个人信息无关，并向支付了较高价格的顾客退还差价。这件事说明，价格歧视虽然常见，但当消费者认为它不公平、不透明时，可能严重损害企业声誉。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>价格歧视是对同一商品向不同客户收不同价格，前提是有定价能力、能区分客户、无法转卖。<\/li>\n<li>它分为一级（个性化）、二级（按数量或版本）和三级（按群体）三种。<\/li>\n<li>它能增加企业利润，有时也能服务更多客户，但不透明的做法可能引起反感和监管关注。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>航空公司对提前预订、不可退改的机票收低价，对临时预订、可退改的机票收高价。这是哪种价格歧视？它在区分什么样的客户？<\/summary>\n<div><p>这主要是二级价格歧视：航空公司设计不同条件的票价，让客户自己选择。它实际上在区分对价格敏感的休闲旅客和对时间灵活性要求高、通常由公司报销的商务旅客。商务旅客愿意为灵活性付更多钱，休闲旅客愿意接受限制换取低价。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-6\"><\/a><\/li>\n<li><a href=\"#L1-10\"><\/a><\/li>\n<li><a href=\"#L1-19\"><\/a><\/li>\n<\/ul><\/div>\n","1.13":"<div class=\"scene\">\n<p>两个嫌疑人被分开审讯。如果两人都不招，各判 1 年；如果一人招供、一人不招，招供的当场释放，不招的判 10 年；如果两人都招，各判 5 年。对每个人来说，不管对方怎么做，招供都是更好的选择。结果两人都招了，各判 5 年，比都不招糟得多。这就是<strong>囚徒困境（prisoner's dilemma）<\/strong>：每个人都理性，结果却对大家都不好。研究这类互动的学问，叫<strong>博弈论（game theory）<\/strong>。<\/p>\n<\/div>\n\n<h2>博弈：你的最优选择取决于别人<\/h2>\n<p>博弈论研究的是：当一个人的结果不仅取决于自己的选择，还取决于别人的选择时，人们会怎样做。它在寡头竞争、谈判、拍卖、国际关系和金融市场中都有广泛应用。<\/p>\n\n<h2>纳什均衡：谁都不想单方面改变<\/h2>\n<p>纳什均衡（Nash equilibrium）是指这样一种状态：给定别人的选择，没有人能通过单方面改变自己的选择变得更好。在囚徒困境中，“两人都招供”就是纳什均衡，虽然它不是对双方最好的结果。<\/p>\n<p>纳什均衡告诉我们：个人理性不一定带来集体最优。这是很多经济和社会问题的根源，比如价格战、军备竞赛、过度捕捞。<\/p>\n\n<h2>重复博弈：合作为什么能维持<\/h2>\n<p>如果同样的博弈反复进行，情况就不同了。今天背叛对方，明天对方会报复，长期来看合作可能更有利。所以长期关系、声誉和可置信的惩罚，能让参与者走出囚徒困境。寡头企业之间的“默契”、交易对手之间的信任，都依赖重复博弈。<\/p>\n\n<div class=\"desk\">\n<p>金融市场中有很多博弈。银行挤兑就是一种：如果所有储户都不取钱，银行安全；但如果你认为别人会去取，你最好也赶紧去取，结果银行真的倒了。经济学家戴蒙德和迪布维格 1983 年用博弈模型描述了这一现象，这也是存款保险存在的理由。交易员在流动性紧张时“抢着卖”、债权人在公司困境时“抢着收回贷款”，都是类似的协调失败。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月初，欧佩克和俄罗斯就进一步减产谈判破裂。沙特随即宣布大幅降价并增产，试图抢占市场份额，俄罗斯也表示不会减产。3 月 9 日，布伦特原油价格单日下跌约 24%，是 1991 年海湾战争以来最大单日跌幅。叠加疫情冲击，油价在随后几周暴跌。4 月，双方重回谈判桌，达成历史性的减产协议。这是寡头之间合作破裂、陷入价格战，又在损失面前重新合作的典型博弈。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>博弈论研究结果取决于彼此选择的互动；囚徒困境说明个人理性可能导致集体糟糕的结果。<\/li>\n<li>纳什均衡是谁都不想单方面改变选择的状态，它不一定是最优的。<\/li>\n<li>重复博弈中，声誉和报复的威胁能维持合作；银行挤兑是典型的协调失败。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司陷入困境，有十家银行借钱给它。如果所有银行都同意展期，公司可以活下来，大家都能收回钱。为什么银行常常还是会抢着收回贷款？怎样解决？<\/summary>\n<div><p>每家银行都担心别的银行先收回贷款，自己最后什么也拿不到，所以抢先收回是个人最优选择，结果公司被逼倒闭，大家都损失更大。这是协调失败。解决办法包括：组成债权人委员会统一行动、签订暂停偿付协议、在法律上通过破产保护程序冻结所有债权人的追讨，强制大家一起谈判。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-10\"><\/a><\/li>\n<li><a href=\"#L18-22\"><\/a><\/li>\n<li><a href=\"#L1-26\"><\/a><\/li>\n<\/ul><\/div>\n","1.14":"<div class=\"scene\">\n<p>一家工厂在河的上游生产，把污水排进河里。工厂的成本很低，产品卖得便宜，赚得不错。下游的渔民却发现鱼越来越少，居民的饮用水也要花钱净化。工厂的账本上没有这笔成本，但社会实实在在地承担了。经济学把这种“一方的行为影响了别人，却不用为此付钱或得到补偿”的情况叫作<strong>外部性（externality）<\/strong>。<\/p>\n<\/div>\n\n<h2>负外部性和正外部性<\/h2>\n<ul>\n<li><strong>负外部性（negative externality）<\/strong>：给别人带来成本却不用付钱。比如污染、交通拥堵、吸二手烟、过度使用抗生素。因为成本没有算进价格，这些东西会被生产或消费得太多。<\/li>\n<li><strong>正外部性（positive externality）<\/strong>：给别人带来好处却得不到报酬。比如接种疫苗保护了周围的人，基础科研的成果被所有人使用。这些东西会被提供得太少。<\/li>\n<\/ul>\n\n<h2>怎样解决外部性<\/h2>\n<ul>\n<li><strong>征税或补贴<\/strong>：对污染征税（叫庇古税，Pigouvian tax），让成本进入价格；对研发和疫苗给予补贴。<\/li>\n<li><strong>总量控制和交易<\/strong>：政府设定排放总量，发放排放许可，允许企业之间买卖。减排成本低的企业多减排、卖出许可，整体以最低成本达到目标。<\/li>\n<li><strong>明确产权和谈判<\/strong>：经济学家科斯指出，如果产权清晰、谈判成本低，受影响的各方可以自己谈判解决。<\/li>\n<li><strong>直接管制<\/strong>：规定排放标准，禁止某些行为。<\/li>\n<\/ul>\n\n<h2>公共品：谁都能用，谁都不想付钱<\/h2>\n<p>公共品（public goods）有两个特点：非竞争性（一个人用不影响别人用）和非排他性（无法阻止不付钱的人用）。比如国防、灯塔、路灯、基础研究。因为每个人都想“搭便车”（free ride），市场很难自发提供足够的公共品，通常需要政府提供。<\/p>\n\n<div class=\"desk\">\n<p>金融监管把系统性风险看作一种负外部性：一家大银行冒高风险，自己赚取收益，一旦倒闭却会拖累整个金融体系和经济。这是对大型银行额外征收资本要求（如系统重要性银行附加资本）的理由。碳市场则是一个金融化的外部性解决方案，排放许可已经成为一种交易活跃的商品。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>欧盟碳排放交易体系（EU ETS）于 2005 年启动，是全球第一个大型碳排放交易市场，覆盖电力、工业和航空等行业。早期由于发放的配额过多，碳价一度跌到每吨几欧元。欧盟随后收紧配额供应，引入市场稳定储备，碳价在 2023 年 2 月首次突破每吨 100 欧元。碳价上涨让燃煤发电的成本大幅提高，推动了能源结构的转型。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>外部性是一方行为影响别人却不用付钱或得不到补偿，负外部性导致过度，正外部性导致不足。<\/li>\n<li>解决办法包括征税补贴、总量控制与交易、明确产权和直接管制。<\/li>\n<li>公共品具有非竞争性和非排他性，因搭便车问题通常需要政府提供。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么经济学家通常更喜欢用碳税或碳交易，而不是直接规定每家企业减排多少？<\/summary>\n<div><p>因为不同企业的减排成本差别很大。直接规定每家减排同样比例，成本高的企业要付出很大代价。碳税或碳交易让每家企业自己决定：减排成本低于碳价的就减排，高于碳价的就付钱或买许可。这样整个社会以最低的总成本达到同样的减排效果，还鼓励企业持续寻找更便宜的减排技术。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-15\"><\/a><\/li>\n<li><a href=\"#L1-22\"><\/a><\/li>\n<li><a href=\"#L1-25\"><\/a><\/li>\n<\/ul><\/div>\n","1.15":"<div class=\"scene\">\n<p>经济学的一个核心观点是：在竞争市场里，价格这只“看不见的手”会把资源配置到最有效率的地方。但这只手有时会失灵：工厂污染了河流，药品因为专利而昂贵，好的二手车卖不出去，人们排队挤兑一家原本健康的银行。当市场自己无法实现有效率的结果时，经济学称之为<strong>市场失灵（market failure）<\/strong>。<\/p>\n<\/div>\n\n<h2>市场失灵的几种主要原因<\/h2>\n<ul>\n<li><strong>市场势力<\/strong>：垄断和寡头把价格定在高于成本的水平，产量低于社会最优。<\/li>\n<li><strong>外部性<\/strong>：成本或好处没有反映在价格中，导致过度或不足。<\/li>\n<li><strong>公共品<\/strong>：搭便车问题让市场提供得太少。<\/li>\n<li><strong>信息不对称<\/strong>：一方比另一方知道得多，可能导致好的交易无法发生，或者出现欺骗和冒险行为。<\/li>\n<\/ul>\n\n<h2>金融市场特有的失灵<\/h2>\n<p>金融市场还有一些特别的失灵方式：<\/p>\n<ul>\n<li><strong>挤兑和恐慌<\/strong>：即使银行本身健康，只要大家担心别人取钱，就可能引发挤兑。<\/li>\n<li><strong>甩卖（fire sale）<\/strong>：一个机构被迫卖资产，压低价格，其他持有同样资产的机构也被迫减值、卖出，形成恶性循环。<\/li>\n<li><strong>羊群效应和泡沫<\/strong>：投资者跟随别人，价格脱离基本面，最终崩溃。<\/li>\n<li><strong>“大而不能倒”<\/strong>：大机构预期会被救助，冒更多风险。<\/li>\n<\/ul>\n\n<h2>政府干预也可能失灵<\/h2>\n<p>市场失灵是政府干预的理由，但政府干预本身也可能出错：信息不足、被利益集团影响、带来新的扭曲。这叫政府失灵（government failure）。所以问题往往在于：市场失灵的代价和政府干预的代价，哪个更大。<\/p>\n\n<div class=\"desk\">\n<p>金融监管的大部分规则，都是针对某种市场失灵设计的：存款保险和最后贷款人针对挤兑，资本和流动性要求针对过度冒险和甩卖，信息披露规则针对信息不对称，反垄断和公平交易规则针对市场势力。理解一条规则背后要解决的是哪种市场失灵，能帮助你理解它为什么这样设计。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1930 年到 1933 年大萧条期间，美国约有 9,000 家银行倒闭，大量是挤兑造成的：储户听说某家银行有问题，就去其他银行也取钱，健康的银行也被拖垮。1933 年，美国通过《银行法》（格拉斯-斯蒂格尔法案），设立联邦存款保险公司（FDIC），为小额存款提供保险。此后几十年，美国大规模挤兑事件大大减少。存款保险用政府担保解决了一个典型的市场失灵。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>市场失灵是指市场自己无法实现有效率的结果，主要原因是市场势力、外部性、公共品和信息不对称。<\/li>\n<li>金融市场还有挤兑、甩卖、羊群效应和“大而不能倒”等特有的失灵。<\/li>\n<li>市场失灵是监管和干预的理由，但政府干预本身也可能失灵。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>存款保险解决了挤兑问题，但它可能带来什么新的问题？监管怎样应对？<\/summary>\n<div><p>它可能带来道德风险：储户知道存款有保险，就不再关心银行是否稳健；银行也可能因此冒更多风险，因为出了事由保险兜底。监管的应对包括：只保险一定额度以内的存款，对银行收取与风险挂钩的保费，以及通过资本要求、监管检查限制银行冒险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-14\"><\/a><\/li>\n<li><a href=\"#L1-16\"><\/a><\/li>\n<li><a href=\"#L1-28\"><\/a><\/li>\n<\/ul><\/div>\n","1.16":"<div class=\"scene\">\n<p>你想买一辆二手车。卖家知道这辆车有没有出过事故、发动机好不好，你却不知道。你只肯出一个“平均车况”的价格。车况好的卖家觉得太便宜，不愿意卖；车况差的卖家觉得很划算，抢着卖。结果市场上剩下的，大多是车况差的车。经济学家阿克洛夫把这些车叫“柠檬”（lemons）。这就是<strong>信息不对称（information asymmetry）<\/strong>带来的问题之一：<strong>逆向选择（adverse selection）<\/strong>。<\/p>\n<\/div>\n\n<h2>逆向选择：交易之前的信息问题<\/h2>\n<p>逆向选择发生在交易之前：一方知道自己的“类型”，另一方不知道，结果吸引来的往往是最差的那一类。<\/p>\n<ul>\n<li><strong>保险<\/strong>：保险公司按平均风险定价，健康的人觉得贵、不买，身体差的人积极投保，保险公司赔付越来越多，只好涨价，更多健康的人离开。<\/li>\n<li><strong>贷款<\/strong>：银行提高利率，谨慎的借款人不借了，愿意借高息贷款的反而是风险更高的人。所以银行有时宁可不放贷，也不提高利率，这叫信贷配给（credit rationing）。<\/li>\n<\/ul>\n\n<h2>道德风险：交易之后的行为问题<\/h2>\n<p>道德风险（moral hazard）发生在交易之后：一方的行为改变了，另一方无法观察或控制。<\/p>\n<ul>\n<li>买了全额车险的人，开车可能不那么小心。<\/li>\n<li>借了钱的公司，可能把钱投到风险更高的项目上，因为赚了归股东，亏了由债权人承担。<\/li>\n<li>预期会被政府救助的银行，可能冒更大的风险。<\/li>\n<\/ul>\n\n<h2>怎样减少信息问题<\/h2>\n<ul>\n<li><strong>信号（signaling）<\/strong>：知道更多的一方主动传递可信的信号。比如提供质保、学历证书、公司保留股份。<\/li>\n<li><strong>筛选（screening）<\/strong>：知道更少的一方设计方法让对方暴露信息。比如保险的免赔额选项、贷款的抵押要求、体检。<\/li>\n<li><strong>合同和监督<\/strong>：免赔额、共同承担、贷款契约条款（covenants）、定期报告，限制交易后的行为。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>信息不对称几乎是金融的核心问题。银行的信贷审批是筛选，抵押品和契约条款是控制道德风险；公司上市时的信息披露、审计、评级都是为了减少投资者和公司之间的信息差距；证券化中的风险自留要求，是用“利益共担”来解决发起人和投资者之间的道德风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1970 年，乔治·阿克洛夫发表了《“柠檬”市场》一文，用二手车市场说明信息不对称会让市场萎缩甚至消失。这篇论文最初被几家期刊拒稿，理由之一是“太简单”。2001 年，阿克洛夫、迈克尔·斯宾塞（研究信号）和约瑟夫·斯蒂格利茨（研究筛选和信贷配给）因信息不对称市场的研究共同获得诺贝尔经济学奖。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>信息不对称是交易一方比另一方知道得多。<\/li>\n<li>逆向选择发生在交易前，吸引来的往往是最差的一类；道德风险发生在交易后，一方的行为变得更冒险。<\/li>\n<li>信号、筛选、合同和监督是减少信息问题的主要方法，也是金融机构的核心工作。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司突然宣布发行大量新股融资。很多时候股价会下跌。用信息不对称怎样解释？<\/summary>\n<div><p>管理层比投资者更了解公司的真实价值。如果他们认为股价被低估，通常不愿意以低价发新股，而会选择借债；如果他们认为股价被高估，发新股最划算。所以投资者会把发新股看作“管理层认为股价偏高”的信号，股价随之下跌。这是公司金融中“优序融资理论”的核心观点之一。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-17\"><\/a><\/li>\n<li><a href=\"#L0-3\"><\/a><\/li>\n<li><a href=\"#L11-1\"><\/a><\/li>\n<\/ul><\/div>\n","1.17":"<div class=\"scene\">\n<p>一家银行为了鼓励员工多卖产品，规定每个员工每天要为客户开一定数量的新账户，完成目标的有奖金，完不成的可能被开除。几年后人们发现，员工在客户不知情的情况下，开了上百万个虚假账户。管理层想要的是“业务增长”，但他们设计的激励，让员工追求的是“账户数量”。这是<strong>委托代理问题（principal-agent problem）<\/strong>的一个极端例子。<\/p>\n<\/div>\n\n<h2>委托人和代理人<\/h2>\n<p>委托人（principal）把事情交给代理人（agent）去做，代理人的行为影响委托人的利益。问题在于：两者的利益不完全一致，而委托人无法完全观察代理人在做什么。<\/p>\n<ul>\n<li>股东（委托人）和公司经理（代理人）：股东想要长期价值，经理可能想要高薪、权力和短期业绩。<\/li>\n<li>投资者和基金经理：投资者想要好的风险调整回报，基金经理可能想要管理更多资金、多收管理费。<\/li>\n<li>储户和银行：储户想要安全，银行可能想冒更大风险赚更多钱。<\/li>\n<\/ul>\n\n<h2>激励设计：让代理人的利益和委托人一致<\/h2>\n<ul>\n<li><strong>业绩挂钩的报酬<\/strong>：股票、期权、奖金。但要小心：衡量什么，代理人就追求什么。<\/li>\n<li><strong>利益共担（skin in the game）<\/strong>：让代理人自己也投入资金，承担损失。比如对冲基金经理在自己的基金里投资，证券化发起人保留一部分风险。<\/li>\n<li><strong>延期支付和追回（clawback）<\/strong>：奖金分几年发放，如果之后发现问题可以追回，减少短期冒险。<\/li>\n<li><strong>监督<\/strong>：董事会、审计、内部控制和外部监管。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>金融机构的薪酬设计是委托代理问题的核心战场。2008 年危机后，监管认为交易员和高管的奖金结构鼓励了短期冒险：赚了拿高额奖金，亏了由股东和纳税人承担。欧盟随后对银行业设置了奖金与固定工资的比例上限，各国也要求大额奖金延期支付并可追回。风控部门的独立性和汇报路线，也是为了让监督者不受业务部门激励的影响。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2016 年 9 月，美国富国银行被监管机构罚款 1.85 亿美元。调查发现，员工为完成销售目标，在客户不知情的情况下开设了约 200 万个存款和信用卡账户，后来这一数字被修正为约 350 万个。银行解雇了约 5,300 名员工，首席执行官随后辞职。2018 年，美联储对富国银行实施资产规模上限，直到 2025 年才解除。不合理的激励设计，最终给股东带来了远大于短期收益的损失。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>委托代理问题出现在委托人和代理人利益不一致、委托人无法完全观察代理人行为时。<\/li>\n<li>激励设计包括业绩挂钩报酬、利益共担、延期支付与追回，以及监督。<\/li>\n<li>衡量什么就会得到什么，错误的激励可能带来严重的风险和损失。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个交易员的奖金是当年利润的 10%，亏损时奖金为零但不用赔钱。这种激励结构会怎样影响他的风险偏好？<\/summary>\n<div><p>他的收益像一个看涨期权：赚了拿 10%，亏了最多拿零。风险越大，期权越值钱，他有动力承担比股东希望更大的风险，尤其是“平时小赚、偶尔巨亏”的策略。这就是为什么银行要设置风险限额、延期支付和追回机制，并且用风险调整后的利润来计算奖金。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-16\"><\/a><\/li>\n<li><a href=\"#L13-22\"><\/a><\/li>\n<li><a href=\"#L1-26\"><\/a><\/li>\n<\/ul><\/div>\n","1.18":"<div class=\"scene\">\n<p>如果市场这么有效率，为什么还需要公司？一个造汽车的人，完全可以每天在市场上找工人、买零件、租机器，用合同把一切安排好。现实中，人们却组建大公司，把成千上万的人放在一个组织里，用命令而不是价格来协调。1937 年，年轻的经济学家罗纳德·科斯问了这个问题，他的答案是：在市场上做交易是有成本的。这些成本叫<strong>交易成本（transaction costs）<\/strong>。<\/p>\n<\/div>\n\n<h2>什么是交易成本<\/h2>\n<p>交易成本是除了商品本身价格以外，完成一笔交易需要付出的成本：<\/p>\n<ul>\n<li><strong>搜寻成本<\/strong>：找到合适的交易对象。<\/li>\n<li><strong>谈判和签约成本<\/strong>：讨价还价、写合同、请律师。<\/li>\n<li><strong>监督和执行成本<\/strong>：确保对方按合同办事，出了问题打官司。<\/li>\n<\/ul>\n<p>如果这些成本很高，把交易放到公司内部、用管理代替合同，可能更划算。公司的边界，就在“市场交易的成本”和“内部管理的成本”相等的地方。<\/p>\n\n<h2>自己做还是外包<\/h2>\n<p>后来的经济学家，如奥利弗·威廉姆森，进一步分析了什么时候应该自己做、什么时候应该从市场买：<\/p>\n<ul>\n<li><strong>专用性投资<\/strong>：如果一方为合作做了只对这个对象有用的投资（比如专门为某个客户建的工厂），另一方就可能事后压价，这叫“敲竹杠”（hold-up）。这种情况下合并在一起更安全。<\/li>\n<li><strong>不确定性和复杂性<\/strong>：交易越复杂、越难写清楚合同，越适合内部完成。<\/li>\n<li><strong>频率<\/strong>：经常发生的交易，内部化更划算。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>金融基础设施的很大价值就在于降低交易成本：交易所把买卖双方集中在一起，降低搜寻成本；标准化合约降低谈判成本；清算所承担对手方风险，降低监督和执行成本；ISDA 主协议让衍生品交易不必每次都重新谈判。银行和资管决定哪些业务外包（如 IT、托管、基金管理），也是在比较交易成本和内部成本。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1919 年，通用汽车与车身制造商费雪车身（Fisher Body）签订长期合同，并收购了其部分股权。随着汽车设计变化和需求增长，双方就生产地点、定价和产能投资不断产生分歧，通用汽车担心被对方“敲竹杠”。1926 年，通用汽车全资收购了费雪车身。这个案例被经济学家反复讨论，成为解释企业为什么要“纵向一体化”的经典例子。科斯在 1991 年获得诺贝尔经济学奖。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>交易成本是搜寻、谈判、监督和执行交易的成本。<\/li>\n<li>当市场交易成本高于内部管理成本时，把活动放进公司更划算，这决定了公司的边界。<\/li>\n<li>专用性投资、复杂性和交易频率影响自己做还是外包；金融基础设施的核心价值是降低交易成本。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么衍生品市场需要 ISDA 主协议这样的标准合同？如果没有，会发生什么？<\/summary>\n<div><p>没有标准合同，每笔衍生品交易都要单独谈判违约、净额结算、抵押品、终止等条款，律师成本和时间成本极高，很多交易会因此不值得做。各家合同不同，也让风险管理和破产处理非常复杂。ISDA 主协议让双方只需签一次框架协议，之后的交易只需确认关键条款，大大降低了交易成本，衍生品市场才得以发展到今天的规模。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-17\"><\/a><\/li>\n<li><a href=\"#L1-19\"><\/a><\/li>\n<li><a href=\"#L16-26\"><\/a><\/li>\n<\/ul><\/div>\n","1.19":"<div class=\"scene\">\n<p>世界上第一台传真机毫无用处，因为没有人可以接收它发出的传真。第二台出现后，两台之间可以互发；有一百万台时，每一台都变得非常有用。一种产品的价值随着使用的人数增加而增加，这叫<strong>网络效应（network effects）<\/strong>。今天，从社交媒体到支付系统，从交易所到操作系统，很多最有价值的公司都建立在网络效应之上。<\/p>\n<\/div>\n\n<h2>直接网络效应和间接网络效应<\/h2>\n<ul>\n<li><strong>直接网络效应<\/strong>：同一类用户越多，每个用户的价值越大。比如电话、即时通讯软件：朋友都在用，你也得用。<\/li>\n<li><strong>间接网络效应<\/strong>：一边的用户越多，吸引另一边的用户越多。比如操作系统：用户越多，开发者越愿意为它开发应用；应用越多，又吸引更多用户。<\/li>\n<\/ul>\n\n<h2>双边平台<\/h2>\n<p>连接两类不同用户的平台叫双边平台（two-sided platform）：网约车连接乘客和司机，电商连接买家和卖家，银行卡连接持卡人和商户。平台经济有几个特点：<\/p>\n<ul>\n<li><strong>定价不对称<\/strong>：平台常对一边免费甚至补贴，对另一边收费。比如持卡人刷卡不用付费，商户要付手续费。<\/li>\n<li><strong>先有鸡还是先有蛋<\/strong>：平台起步时两边都缺人，往往需要大量补贴来吸引第一批用户。<\/li>\n<li><strong>赢家通吃<\/strong>：网络效应让领先者越来越强，市场容易集中到一两家。但如果用户可以同时使用多个平台（多归属，multi-homing），比如司机同时开几个网约车软件，赢家通吃就没那么严重。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>金融市场到处都有网络效应。交易所和交易平台的核心价值是流动性：买家越多，卖家越愿意来，反过来也一样，所以“流动性吸引流动性”，新交易所很难挑战老交易所。支付网络、清算所、彭博终端、SWIFT 都有很强的网络效应。分析这类公司时，投资者看的是用户数量、使用频率和用户切换的难度。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>Visa 和万事达卡是典型的双边网络：商户接受它们，是因为持卡人多；持卡人用它们，是因为接受的商户多。商户长期认为银行卡手续费（交换费，interchange fee）过高，并在美国提起集体诉讼。2019 年，法院最终批准了约 55 亿美元的和解，这是美国历史上最大的反垄断集体诉讼和解之一。即使如此，商户也很难拒绝这两家网络，这正说明了网络效应带来的市场力量。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>网络效应是产品价值随用户数量增加而增加，分为直接和间接两种。<\/li>\n<li>双边平台连接两类用户，常对一边补贴、对另一边收费，容易赢家通吃。<\/li>\n<li>交易所、支付网络和清算所等金融基础设施都具有很强的网络效应。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个新的交易平台手续费比老交易所低一半，为什么很多投资者仍然不愿意转过去？<\/summary>\n<div><p>因为投资者最关心的是能否以好的价格快速成交，也就是流动性。老交易所买卖的人多，价差小、成交快；新平台人少，即使手续费低，成交价格可能更差，大单还可能找不到对手。每个投资者都在等别人先转过去，这就是网络效应形成的壁垒。新平台通常要通过补贴做市商、给予返佣等方式先把流动性做起来。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-10\"><\/a><\/li>\n<li><a href=\"#L26-2\"><\/a><\/li>\n<li><a href=\"#L17-3\"><\/a><\/li>\n<\/ul><\/div>\n","1.20":"<div class=\"scene\">\n<p>2000 年，英国政府拍卖第三代移动通信（3G）牌照。政府原本预计能收入几十亿英镑，结果几家电信公司激烈竞价，最终拍出了约 225 亿英镑。政府非常满意，但赢得牌照的公司背上了沉重的债务，几年后都不得不大幅减记。拍得的人反而可能是输家，这叫“赢者诅咒”。<strong>拍卖（auction）<\/strong>是一种古老而重要的定价方式，从艺术品到国债，从电力到广告位，都在用它。<\/p>\n<\/div>\n\n<h2>为什么用拍卖<\/h2>\n<p>当卖家不知道买家愿意付多少钱时，拍卖让买家通过竞价自己说出来。东西应当卖给最看重它的人，价格也更接近它的真实价值。拍卖还相对公开透明，适合政府出售公共资源。<\/p>\n\n<h2>几种常见的拍卖方式<\/h2>\n<ul>\n<li><strong>英式拍卖（English auction）<\/strong>：价格从低往高叫，最后出价最高的人得到。艺术品拍卖常用。<\/li>\n<li><strong>荷式拍卖（Dutch auction）<\/strong>：价格从高往低降，第一个接受的人得到。荷兰花卉市场常用。<\/li>\n<li><strong>第一价格密封拍卖<\/strong>：每人秘密出一次价，最高者得，按自己的出价付钱。<\/li>\n<li><strong>第二价格密封拍卖（Vickrey auction）<\/strong>：最高者得，但只付第二高的出价。它的好处是每个人按真实估值出价就是最优策略。<\/li>\n<\/ul>\n<p>出售多个相同物品时（比如国债），还有统一价格拍卖（所有中标者付同一个价格）和差别价格拍卖（每人按自己的出价付钱）。<\/p>\n\n<h2>赢者诅咒<\/h2>\n<p>当东西的价值对所有人都差不多、但每个人只能估计时（比如一块油田的储量），出价最高的人，往往是估计得最乐观的人，也就是最可能高估的人。赢得拍卖本身就是“我可能估高了”的信号。理性的竞拍者会因此压低出价。<\/p>\n\n<div class=\"desk\">\n<p>金融市场里拍卖无处不在。各国政府通过拍卖发行国债，交易员要预测拍卖结果，关注认购倍数（bid-to-cover）和尾部（tail）等指标。股票交易所每天的开盘和收盘价通常通过集合竞价确定。一些公司用拍卖方式进行 IPO。银行出售不良贷款组合，也常常采用竞标的方式。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2000 年 4 月，英国 3G 牌照拍卖持续了七周、进行了 150 轮竞价，五张牌照最终总价约 225 亿英镑，约占英国当年 GDP 的 2.5%。同年德国的 3G 拍卖也筹得约 500 亿欧元。随后互联网泡沫破裂，电信股暴跌，多家欧洲电信公司因此背负巨额债务，被迫减记资产、裁员。这次拍卖设计本身被认为很成功，但也常被作为赢者诅咒的例子。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>拍卖让买家通过竞价揭示愿意支付的价格，适合价值不确定的物品。<\/li>\n<li>常见方式有英式、荷式、第一价格和第二价格密封拍卖，多物品时有统一价格和差别价格拍卖。<\/li>\n<li>当物品对所有人价值相近但难以估计时，赢家往往是高估的人，这叫赢者诅咒。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>美国国债拍卖采用统一价格方式：所有中标者都按最低的中标价格（最高中标收益率）成交。为什么这比“各自按自己出价成交”更能吸引投资者积极出价？<\/summary>\n<div><p>在差别价格拍卖中，出价太高的人会付出比别人更高的价格，所以每个人都会小心地压低出价，猜测别人怎么出，这对不擅长预测的小投资者不利。统一价格拍卖下，即使你出价较高，最终也按统一的中标价格成交，出价接近真实估值的风险较小，更多人愿意参与，竞争更充分，政府的融资成本可能更低。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-32\"><\/a><\/li>\n<li><a href=\"#L14-5\"><\/a><\/li>\n<li><a href=\"#L1-26\"><\/a><\/li>\n<\/ul><\/div>\n","1.21":"<div class=\"scene\">\n<p>2020 年，德国柏林的房租多年来快速上涨，市政府推出“房租冻结”：大部分出租公寓的租金五年内不得上涨，过高的还要降下来。租客一开始很高兴。但很快，可供出租的公寓数量明显减少，房东转而出售房子或不再出租，找房变得更难。一年后，德国联邦宪法法院裁定这项法律违宪。这就是<strong>价格管制（price controls）<\/strong>经常遇到的困境。<\/p>\n<\/div>\n\n<h2>价格上限：不能高于某个价格<\/h2>\n<p>价格上限（price ceiling）规定价格不能超过某个水平，目的是保护买方。如果上限低于均衡价格：<\/p>\n<ul>\n<li>需求增加，供给减少，出现短缺（shortage）。<\/li>\n<li>东西不再按价格分配，而是按排队、关系或运气分配。<\/li>\n<li>可能出现黑市，或者卖家降低质量，比如房东不再维修房子。<\/li>\n<\/ul>\n<p>例子：房租管制、燃油限价、利率上限（高利贷法）。<\/p>\n\n<h2>价格下限：不能低于某个价格<\/h2>\n<p>价格下限（price floor）规定价格不能低于某个水平，目的是保护卖方。如果下限高于均衡价格，就会出现过剩（surplus）：东西卖不出去，或者政府要出钱收购。<\/p>\n<p>例子：农产品保护价、最低工资。最低工资是否会减少就业，经济学界争论很久：在竞争的劳动力市场中，过高的最低工资可能减少就业；在雇主有买方垄断力量的市场中，适度的最低工资影响可能很小，甚至增加就业。<\/p>\n\n<h2>为什么还会使用价格管制<\/h2>\n<p>价格管制往往出于公平考虑：保护低收入者买得起必需品，保护农民和工人的收入。但它的代价常常被低估。经济学家通常更倾向于直接向需要帮助的人提供补贴或现金转移，而不是扭曲价格。<\/p>\n\n<div class=\"desk\">\n<p>金融领域也有价格管制：信用卡利率上限、贷款利率上限、对某些手续费的限制，以及战时或危机时的资本管制。2022 年起，西方国家还对俄罗斯原油海运出口设定了每桶 60 美元的价格上限，限制提供航运和保险服务。分析这类政策时，可以用同样的框架：上限低于市场价会带来短缺、绕道和黑市。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>柏林的房租冻结法律于 2020 年 2 月生效，冻结约 150 万套公寓的租金。研究发现，生效后受管制公寓的挂牌出租数量明显减少，而不受管制的新建公寓租金上涨更快。2021 年 4 月，德国联邦宪法法院裁定，房租管制属于联邦立法权限，柏林州无权制定，法律无效。很多租客因此需要补交之前少付的租金。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>价格上限低于均衡价格时会导致短缺、排队和黑市，价格下限高于均衡价格时会导致过剩。<\/li>\n<li>房租管制、利率上限是价格上限，农产品保护价、最低工资是价格下限。<\/li>\n<li>价格管制出于公平考虑，但代价常被低估，直接补贴通常是更有效率的替代方案。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>政府规定个人贷款年利率不得超过 10%。对信用很好的借款人和信用较差的借款人，影响分别是什么？<\/summary>\n<div><p>信用好的借款人本来就能借到 10% 以下的贷款，几乎不受影响。信用较差的借款人风险高，银行需要更高的利率来覆盖违约损失，在上限下放贷不划算，银行会拒绝给他们贷款。结果，最需要借钱的人可能被迫转向不受监管的地下借贷，付出更高的代价。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-3\"><\/a><\/li>\n<li><a href=\"#L1-11\"><\/a><\/li>\n<li><a href=\"#L1-6\"><\/a><\/li>\n<\/ul><\/div>\n","1.22":"<div class=\"scene\">\n<p>政府宣布对每升汽油征收 1 元的税，由加油站缴纳。加油站会自己承担这 1 元吗？不会全部承担。它会提高油价，把一部分税转给司机。转多少？这取决于司机和加油站谁更“离不开”这笔交易。法律上由谁交税，和最终由谁承担税负，常常是两回事。经济学把这个问题叫作<strong>税收归宿（tax incidence）<\/strong>。<\/p>\n<\/div>\n\n<h2>谁承担税负：看弹性<\/h2>\n<p>税收会在买方支付的价格和卖方收到的价格之间打进一个“楔子”。这个楔子由谁承担，取决于双方的弹性：<\/p>\n<ul>\n<li><strong>需求缺乏弹性、供给富有弹性<\/strong>：买方离不开，卖方容易转行，税负主要落在买方身上。比如汽油、香烟。<\/li>\n<li><strong>需求富有弹性、供给缺乏弹性<\/strong>：买方容易找替代，卖方无处可去，税负主要落在卖方身上。比如土地：土地的供给几乎固定，土地税主要由地主承担。<\/li>\n<\/ul>\n<p>简单地说：谁更难逃避，谁就承担更多。法律规定由买方还是卖方交税，对最终结果影响不大。<\/p>\n\n<h2>补贴：同样的道理反过来<\/h2>\n<p>补贴相当于负的税。政府给电动车买家补贴 1 万元，买家实际得到多少，也取决于弹性：如果车企的供给缺乏弹性，车企可能提高售价，把一部分补贴拿走。<\/p>\n\n<h2>税收的代价<\/h2>\n<p>税收会让一部分交易无法发生，造成无谓损失。弹性越大，人们越容易调整行为，无谓损失越大。所以从效率角度看，对弹性小的东西征税代价较小。但弹性小的往往是必需品，对低收入者负担更重，这就涉及效率和公平的权衡。<\/p>\n\n<div class=\"desk\">\n<p>金融领域常讨论的税收归宿问题包括：企业所得税最终由股东、员工还是消费者承担？金融交易税会不会让交易转移到其他市场？银行税是否会被转嫁给贷款客户？交易员和投资者关心的是：一项新税会怎样改变价格和交易量，交易会不会转移到税负更低的地方。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1984 年，瑞典开始对股票交易征收 0.5% 的交易税，1986 年提高到 1%（买卖合计 2%）。结果，大量瑞典股票的交易转移到伦敦，最活跃的一批瑞典股票有过半交易量流向海外，固定收益交易量也大幅萎缩，税收收入远低于预期。瑞典在 1991 年废除了这项税。投资者和交易的弹性远大于政府的估计，税负很难留在本国市场上。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>税负最终由谁承担，取决于买卖双方的弹性，而不是法律规定谁交税。<\/li>\n<li>谁更难逃避，谁承担更多；补贴的分配也遵循同样的道理。<\/li>\n<li>弹性越大，税收造成的无谓损失越大，资本和交易的高弹性让金融交易税很难征收。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>政府对银行征收一项新税，按银行的负债规模计算。这项税最终可能由谁承担？<\/summary>\n<div><p>可能部分由银行股东承担（利润减少），部分转嫁给客户（提高贷款利率、降低存款利率、增加手续费），部分转嫁给员工（压缩薪酬）。转嫁多少取决于竞争程度和客户的弹性：如果客户很容易转向其他不交税的机构或市场，银行很难转嫁，股东承担更多；如果客户别无选择，客户承担更多。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-4\"><\/a><\/li>\n<li><a href=\"#L1-6\"><\/a><\/li>\n<li><a href=\"#L1-21\"><\/a><\/li>\n<\/ul><\/div>\n","1.23":"<div class=\"scene\">\n<p>你在路上捡到 100 元，晚上请朋友吃饭花掉了，毫不心疼。但如果是自己工资里的 100 元，你可能会犹豫很久。同样是 100 元，你把它们放进了不同的“心理账户”。你持有的股票跌了 20%，你迟迟不肯卖；涨了 20%，你很快就卖了。传统经济学假设人是完全理性的，但现实中的人常常不是。研究这些系统性偏差的学科，叫<strong>行为经济学（behavioral economics）<\/strong>。<\/p>\n<\/div>\n\n<h2>心理账户<\/h2>\n<p>心理账户（mental accounting）是指人们把钱分成不同的类别，各自管理，即使钱本身没有区别。比如一边存着低利息的储蓄，一边背着高利息的信用卡欠款；退税、奖金、赢来的钱更容易被大手大脚地花掉。<\/p>\n\n<h2>前景理论和损失厌恶<\/h2>\n<p>前景理论（prospect theory）描述了人们面对得失时的真实反应：<\/p>\n<ul>\n<li><strong>参照点<\/strong>：人们看的是相对于某个参照点（比如买入价）的得失，而不是总财富。<\/li>\n<li><strong>损失厌恶（loss aversion）<\/strong>：损失带来的痛苦，大约是同等收益带来的快乐的两倍。<\/li>\n<li><strong>得失下的风险态度不同<\/strong>：面对收益时倾向于保守，宁可拿确定的小钱；面对损失时倾向于冒险，宁可赌一把也不愿接受确定的损失。<\/li>\n<\/ul>\n<p>这解释了“处置效应”（disposition effect）：投资者太早卖出盈利的股票，太久持有亏损的股票。<\/p>\n\n<h2>锚定和其他偏差<\/h2>\n<ul>\n<li><strong>锚定（anchoring）<\/strong>：判断时过度依赖最先看到的数字。比如谈判中的第一个报价、股票的历史最高价。<\/li>\n<li><strong>过度自信（overconfidence）<\/strong>：高估自己的判断能力，交易过于频繁。<\/li>\n<li><strong>从众（herding）<\/strong>：跟着别人做，推动泡沫和恐慌。<\/li>\n<li><strong>近因偏差（recency bias）<\/strong>：过度重视最近发生的事情。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>行为偏差在交易台上随处可见：交易员不愿止损，希望亏损头寸“回本”；分析师的预测被上一期数字锚住；市场在一段平静期后低估风险。很多风控规则，比如强制止损限额、独立的估值和风险报告，部分就是为了对抗这些人性弱点。量化策略中的动量和反转效应，也常被认为与行为偏差有关。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1979 年，心理学家丹尼尔·卡尼曼和阿莫斯·特沃斯基发表前景理论，成为行为经济学的奠基性研究。1998 年，经济学家特伦斯·奥丁分析了约一万个美国券商账户的交易记录，发现投资者卖出盈利股票的概率明显高于卖出亏损股票，而被卖掉的盈利股票之后的表现反而好于被保留的亏损股票。卡尼曼在 2002 年、理查德·塞勒在 2017 年先后因行为经济学研究获得诺贝尔经济学奖。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>心理账户让人们把同样的钱分开对待，影响消费和储蓄决定。<\/li>\n<li>前景理论指出人们看相对参照点的得失，损失厌恶约为收益的两倍，导致处置效应。<\/li>\n<li>锚定、过度自信、从众和近因偏差在投资和交易中普遍存在，风控规则部分是为了对抗它们。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>你在 100 元买入一只股票，现在跌到 70 元。你对自己说：“等回到 100 元我就卖。”这句话里有哪些行为偏差？更理性的做法是什么？<\/summary>\n<div><p>有锚定（以买入价 100 元为参照点）、损失厌恶（不愿意确认 30 元的损失）和沉没成本谬误。股价从 70 元回到 100 元的可能性，和你当初在什么价位买入毫无关系。更理性的做法是问：如果我现在手里是 70 元现金，我会买这只股票吗？如果不会，就应该卖出，把钱投到更好的地方。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-2\"><\/a><\/li>\n<li><a href=\"#L1-7\"><\/a><\/li>\n<li><a href=\"#L19-20\"><\/a><\/li>\n<\/ul><\/div>\n","1.24":"<div class=\"scene\">\n<p>中东爆发战争，油价翻倍。影响的不只是石油市场：汽油贵了，人们少开车、多坐公交；航空公司提高票价，旅游业受冲击；塑料和化肥变贵，农产品价格上涨；产油国赚了更多钱，买了更多外国的东西和资产。一个市场的变化会像涟漪一样传到所有市场。只看一个市场叫局部均衡；把所有市场放在一起看，就是<strong>一般均衡（general equilibrium）<\/strong>。<\/p>\n<\/div>\n\n<h2>一般均衡：所有市场同时平衡<\/h2>\n<p>前面学的供需分析，大多只看一个市场，假设其他条件不变。一般均衡分析则同时考虑所有商品、劳动和资本市场：每个市场的价格都会影响其他市场，最终所有市场的供需同时相等。<\/p>\n<p>19 世纪，法国经济学家瓦尔拉斯（Walras）最早提出这个思想。20 世纪 50 年代，阿罗（Arrow）和德布鲁（Debreu）用数学证明了，在一定条件下，这样一组让所有市场同时平衡的价格是存在的。<\/p>\n\n<h2>帕累托效率：没有人能再变好而不让别人变差<\/h2>\n<p>帕累托效率（Pareto efficiency）是经济学判断效率的标准：如果不让任何人变差，就无法让任何人变好，资源配置就是有效率的。如果还能让至少一个人变好而不损害别人，这个改变叫帕累托改进。<\/p>\n<p>帕累托效率只关心效率，不关心公平：一个人拥有一切、其他人一无所有，也可能是帕累托有效的。<\/p>\n\n<h2>福利经济学两大定理<\/h2>\n<ul>\n<li><strong>第一定理<\/strong>：在完全竞争、没有外部性、信息完全等条件下，市场均衡是帕累托有效的。这是“看不见的手”的严格表述。<\/li>\n<li><strong>第二定理<\/strong>：任何一个帕累托有效的结果，都可以通过适当的初始财富再分配，再让市场自由运作来实现。效率和公平可以在一定程度上分开处理。<\/li>\n<\/ul>\n<p>这些条件在现实中很少完全满足，这正是前面讲的市场失灵。<\/p>\n\n<div class=\"desk\">\n<p>阿罗和德布鲁的模型对金融学影响深远。他们设想了一种“状态证券”（Arrow-Debreu security）：只在某一种未来状态出现时付 1 元。如果每一种可能的状态都有对应的证券，市场就是“完全的”（complete market），任何风险都可以交易和对冲。衍生品定价中的“状态价格”和风险中性定价，都源自这个思想。现实市场是不完全的，有些风险无法对冲，这正是很多金融创新的出发点。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1954 年，阿罗和德布鲁发表论文，证明了竞争性一般均衡的存在。阿罗在 1972 年、德布鲁在 1983 年分别获得诺贝尔经济学奖。今天，各国政府和国际机构用“可计算一般均衡”（CGE）模型评估贸易协定、税制改革和碳税等政策，因为这些政策的影响会通过价格传导到整个经济，只看一个市场会严重低估或误判效果。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>一般均衡同时考虑所有市场，一个市场的变化会通过价格传导到其他市场。<\/li>\n<li>帕累托效率是指无法在不损害他人的情况下让任何人变好，它不涉及公平。<\/li>\n<li>在理想条件下市场均衡是帕累托有效的；阿罗-德布鲁的状态证券思想是现代金融定价的基础。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>政府对进口钢材征收高关税，保护本国钢铁企业。只看钢铁市场，似乎是保住了就业。用一般均衡的视角，还应该考虑哪些影响？<\/summary>\n<div><p>钢材变贵后，汽车、机械、建筑等使用钢材的行业成本上升，竞争力下降，可能减少生产和就业；消费者买车、买房更贵；其他国家可能报复，对本国出口产品加征关税，影响出口行业；汇率也可能变化。把这些都算进去，整体影响可能是负的，即使钢铁行业本身受益。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-25\"><\/a><\/li>\n<li><a href=\"#L1-15\"><\/a><\/li>\n<li><a href=\"#L16-40\"><\/a><\/li>\n<\/ul><\/div>\n","1.25":"<div class=\"scene\">\n<p>政府要决定是否修一条新的高速铁路：造价 1,000 亿元，建成后能节省旅客时间、减少公路拥堵和碳排放，但会占用农田、产生噪音。这条铁路值得修吗？要回答这个问题，就要把所有好处和代价都换算成同一种单位，放在一起比较。这就是<strong>成本收益分析（cost-benefit analysis）<\/strong>，它的理论基础叫<strong>福利经济学（welfare economics）<\/strong>。<\/p>\n<\/div>\n\n<h2>福利经济学：怎样判断“更好”<\/h2>\n<p>福利经济学研究的是：怎样评价一个经济结果或一项政策对社会是好是坏。上一课的帕累托标准很严格，几乎所有政策都会让一部分人受损。所以实践中常用一个更宽松的标准：<\/p>\n<ul>\n<li><strong>卡尔多-希克斯标准（Kaldor-Hicks）<\/strong>：如果受益者得到的好处足够大，理论上可以补偿受损者之后还有剩余，这个政策就是有效率的。补偿不一定真的发生。<\/li>\n<\/ul>\n<p>此外还有社会福利函数（social welfare function），把不同人的福利加权，对低收入者的福利给予更高权重，反映对公平的重视。<\/p>\n\n<h2>成本收益分析怎么做<\/h2>\n<ol>\n<li><strong>列出所有影响<\/strong>：不只是金钱，还包括时间、健康、环境、安全。<\/li>\n<li><strong>货币化<\/strong>：把非市场的东西也换算成钱。比如用人们愿意为节省时间付多少钱来估算时间价值，用“统计生命价值”（value of a statistical life）评估安全改善。<\/li>\n<li><strong>折现<\/strong>：未来的成本和收益要折现到今天。折现率的选择往往决定结论。<\/li>\n<li><strong>比较和敏感性分析<\/strong>：看净收益是否为正，以及在不同假设下结论是否稳健。<\/li>\n<\/ol>\n\n<div class=\"desk\">\n<p>成本收益分析和公司金融里的净现值（NPV）方法本质相同：把未来的现金流折现，和投资成本比较。区别是成本收益分析要计算对整个社会的成本和收益，包括外部性。银行和开发性金融机构评估基础设施项目、监管机构评估新规则（比如资本要求提高的成本和避免危机的收益），都会用到这种方法。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2006 年，英国政府发布由经济学家尼古拉斯·斯特恩主持的气候变化经济学报告。报告采用很低的折现率（约 1.4%），认为不采取行动的长期代价相当于每年全球 GDP 的 5% 到 20%，远高于减排成本，因此主张立即大规模减排。耶鲁大学的威廉·诺德豪斯等人批评报告的折现率过低，用更高的折现率会得出更渐进的减排路径。同一个问题，折现率的不同几乎决定了结论。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>福利经济学评价政策对社会的好坏，实践中常用“受益者能否补偿受损者”的卡尔多-希克斯标准。<\/li>\n<li>成本收益分析列出所有影响，货币化、折现后比较净收益，本质上和 NPV 相同。<\/li>\n<li>结论常常高度依赖折现率和货币化假设，需要做敏感性分析。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么折现率对气候政策的成本收益分析影响特别大？<\/summary>\n<div><p>因为气候政策的成本主要发生在现在，而收益（避免的损失）主要发生在几十年甚至一百年以后。折现率越高，遥远未来的收益折算到今天就越小。按 1.4% 折现，100 年后的 100 元今天约值 25 元；按 5% 折现，只值不到 1 元。所以折现率稍有不同，就可能从“必须立刻行动”变成“可以慢慢来”。折现率的选择本身还涉及对子孙后代的道德判断。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-24\"><\/a><\/li>\n<li><a href=\"#L5-4\"><\/a><\/li>\n<li><a href=\"#L24-15\"><\/a><\/li>\n<\/ul><\/div>\n","1.26":"<div class=\"scene\">\n<p>政府想出售一批无线电频谱，希望频谱落到最能用好它的公司手里，同时为国库筹到合理的收入。可政府不知道每家公司愿意出多少钱，公司也会隐藏真实想法。怎样设计一套规则，让参与者即使只为自己打算，最终结果也符合设计者的目标？这就是<strong>机制设计（mechanism design）<\/strong>：经济学里的“逆向工程”，先定目标，再设计规则。<\/p>\n<\/div>\n\n<h2>机制设计：先定目标，再定规则<\/h2>\n<p>传统经济学分析的是：给定规则，人们会怎样做？机制设计反过来问：想要某个结果，应该设计什么规则？核心难题是：参与者掌握私人信息，可能撒谎或策略性行动。<\/p>\n<p>一个关键概念是“激励相容”（incentive compatible）：规则设计得让每个人说真话、按真实情况行动，就是对自己最好的选择。上一课的第二价格拍卖就是一个例子：按真实估值出价是最优策略。<\/p>\n<p>机制设计的应用包括：拍卖规则、医院和实习医生的匹配、学校录取、器官捐献配对、碳排放许可的分配。<\/p>\n\n<h2>契约理论：怎样写一份好合同<\/h2>\n<p>契约理论（contract theory）研究在信息不对称和无法预见所有情况时，怎样设计合同：<\/p>\n<ul>\n<li><strong>激励合同<\/strong>：当委托人无法观察代理人的努力时，报酬应该怎样和结果挂钩。挂得太紧，代理人承担太多运气带来的风险；挂得太松，没有激励。<\/li>\n<li><strong>不完全合同（incomplete contracts）<\/strong>：合同不可能写清楚所有未来情况。当意外发生时，谁有决定权就很重要。所以“控制权”和“所有权”的分配，本身就是合同设计的一部分。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>金融合同是契约理论的主要应用场景。债券和贷款中的契约条款（covenants）限制借款人的行为；风险投资合同中的优先清算权、董事会席位和分阶段注资，分配了控制权和风险；高管薪酬合同的期权和延期支付，处理激励问题。为什么债权人在公司违约时获得控制权，为什么股东平时拥有投票权，都可以用不完全合同理论解释。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1994 年，美国联邦通信委员会（FCC）首次用拍卖方式出售频谱，采用经济学家米尔格罗姆和威尔逊设计的“同时多轮升价拍卖”，取代过去的抽签和听证。此后 FCC 通过拍卖筹得了上千亿美元。2020 年，两人因改进拍卖理论和发明新拍卖形式获得诺贝尔经济学奖。此前，赫维奇、马斯金和迈尔森在 2007 年因机制设计理论获奖，哈特和霍姆斯特罗姆在 2016 年因契约理论获奖。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>机制设计先确定想要的结果，再设计规则，让参与者在追求自身利益时实现这个结果。<\/li>\n<li>激励相容让说真话、如实行动成为每个人的最优选择。<\/li>\n<li>契约理论研究激励合同和不完全合同，控制权分配是合同设计的核心，金融合同是主要应用。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>风险投资基金投资一家初创公司，为什么常常分好几轮注资，而不是一次给足所有钱？<\/summary>\n<div><p>分阶段注资是一种机制设计：创始人比投资者更了解公司真实进展，一次给足钱后，投资者很难控制资金使用（道德风险）。分阶段注资让投资者在每个阶段根据新信息决定是否继续，相当于持有一个“继续或退出”的期权；同时创始人必须达到里程碑才能拿到下一轮资金，激励他们努力。这在信息不对称和不确定性很高时特别有价值。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-20\"><\/a><\/li>\n<li><a href=\"#L1-17\"><\/a><\/li>\n<li><a href=\"#L1-16\"><\/a><\/li>\n<\/ul><\/div>\n","1.27":"<div class=\"scene\">\n<p>2017 年 3 月，欧盟委员会否决了伦敦证券交易所集团和德意志交易所集团的合并。两家交易所都认为合并能提高效率、和美国交易所竞争。欧盟则担心：合并后的集团会在欧洲固定收益清算等领域几乎没有竞争对手，客户将失去选择。一个行业要多集中才算太集中？企业怎样竞争和合并？这些问题属于<strong>产业组织（industrial organization）<\/strong>和<strong>反垄断（antitrust）<\/strong>。<\/p>\n<\/div>\n\n<h2>产业组织：企业怎样竞争<\/h2>\n<p>产业组织研究市场结构、企业行为和市场表现之间的关系。它关心的问题包括：<\/p>\n<ul>\n<li>行业集中度如何，进入壁垒有多高？<\/li>\n<li>企业怎样定价，会不会默契合谋？<\/li>\n<li>企业怎样利用产品差异、捆绑销售、排他协议来获得竞争优势？<\/li>\n<li>纵向整合（把上下游合并）是提高效率还是排挤对手？<\/li>\n<\/ul>\n\n<h2>反垄断：保护竞争<\/h2>\n<p>反垄断法（美国叫 antitrust law，欧洲叫竞争法 competition law）的目标是保护竞争，主要处理三类问题：<\/p>\n<ul>\n<li><strong>合谋<\/strong>：竞争者之间约定价格、划分市场、操纵投标。这在大多数国家是违法的，甚至可能被判刑。<\/li>\n<li><strong>滥用市场支配地位<\/strong>：大企业利用优势排挤竞争对手，比如掠夺性定价、强制捆绑、拒绝交易。<\/li>\n<li><strong>并购控制<\/strong>：审查可能显著减少竞争的合并，必要时附加条件（比如出售部分业务）或直接否决。<\/li>\n<\/ul>\n<p>美国 1890 年通过的《谢尔曼法》是最早的现代反垄断法。今天，美国司法部、联邦贸易委员会和欧盟委员会是全球最有影响力的反垄断执法机构。<\/p>\n\n<div class=\"desk\">\n<p>在并购交易中，反垄断审查是最重要的不确定性之一。投行和律师会提前分析合并后的市场份额和 HHI 变化，评估需要出售哪些业务来获得批准。并购套利（merger arbitrage）基金的核心工作，就是判断交易能否通过反垄断审查、需要多长时间。金融行业本身，交易所、清算所、评级机构和支付网络，也是反垄断机构重点关注的领域。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>伦交所和德交所在 2016 年宣布合并，交易价值约 290 亿欧元。欧盟委员会审查后认为，合并将在固定收益产品清算等领域形成事实上的垄断，要求伦交所出售其持有的意大利债券交易平台 MTS，伦交所拒绝。2017 年 3 月，欧盟正式否决合并。这已经是两家交易所第三次尝试合并失败。2024 年，美国法院在司法部诉谷歌案中裁定谷歌在搜索市场非法维持垄断，显示反垄断执法正越来越多地针对科技和平台企业。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>产业组织研究市场结构、企业行为和市场表现之间的关系。<\/li>\n<li>反垄断主要处理合谋、滥用市场支配地位和并购控制三类问题。<\/li>\n<li>反垄断审查是并购交易的核心不确定性，金融基础设施也是重点监管领域。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两家银行合并后，全国市场份额只有 10%，但在某几个城市的份额超过 50%。反垄断机构会怎样处理？<\/summary>\n<div><p>反垄断分析看的是相关市场，而不只是全国份额。对存款和小企业贷款这类业务，客户主要在本地选择银行，所以相关市场可能是城市或地区。如果合并后在这些城市的份额过高，反垄断机构通常会要求银行出售在这些地区的部分网点和业务给其他银行，以保持当地的竞争，再批准合并。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-10\"><\/a><\/li>\n<li><a href=\"#L15-26\"><\/a><\/li>\n<li><a href=\"#L25-40\"><\/a><\/li>\n<\/ul><\/div>\n","1.28":"<div class=\"scene\">\n<p>一项政策让一千万消费者每人每年多付 10 元，同时让一百家企业每家每年多赚 100 万元。消费者损失加起来有 1 亿元，比企业的收益多，但几乎没有消费者会为了 10 元去游说议员；而企业会花大价钱聘请说客。结果，这项政策很可能通过。政府也是由追求自身利益的人组成的，它也会失灵。研究这一问题的学科，叫<strong>公共选择理论（public choice theory）<\/strong>。<\/p>\n<\/div>\n\n<h2>政治也是一个“市场”<\/h2>\n<p>公共选择理论用经济学的方法分析政治：选民、政治家、官员和利益集团，都被看作追求自身利益的理性人。<\/p>\n<ul>\n<li><strong>选民<\/strong>：一张选票很难改变结果，花时间研究政策的回报很低，所以很多选民对政策细节“理性地无知”。<\/li>\n<li><strong>政治家<\/strong>：追求连任，倾向于支持能带来选票和资金的政策，偏好短期见效的政策。<\/li>\n<li><strong>官员<\/strong>：可能追求扩大部门预算和权力。<\/li>\n<li><strong>利益集团<\/strong>：组织起来影响政策，为自己争取好处。<\/li>\n<\/ul>\n\n<h2>政府失灵的几种方式<\/h2>\n<ul>\n<li><strong>集中收益、分散成本<\/strong>：好处集中在少数人身上、成本分散在多数人身上的政策，容易通过。<\/li>\n<li><strong>寻租（rent-seeking）<\/strong>：企业把资源花在争取补贴、牌照和保护上，而不是改进产品。<\/li>\n<li><strong>监管俘获（regulatory capture）<\/strong>：监管机构逐渐被它监管的行业影响，开始维护行业利益而不是公众利益。经济学家斯蒂格勒在 1971 年系统提出了这一观点。<\/li>\n<li><strong>短视<\/strong>：选举周期让政治家偏好短期刺激，把成本推给未来。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>理解公共选择，有助于判断监管和政策的走向。金融监管中有几个常被讨论的问题：监管者和银行之间的“旋转门”（人员在两边来回流动）、危机后监管收紧而繁荣期逐渐放松的周期、政府对国有或系统重要性机构的隐性担保。分析师在评估政策风险时，会问：谁会受益？谁有动力和能力去游说？<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1980 年代美国储贷危机中，大量储蓄贷款机构因高风险投资陷入困境，监管机构却一再推迟关闭它们。1987 年，五位美国参议员与监管官员会面，为林肯储贷公司的老板查尔斯·基廷说情，被称为“基廷五人案”。林肯储贷在 1989 年倒闭，处置成本超过 30 亿美元。整个储贷危机最终花费美国纳税人约 1,240 亿美元。推迟处置让问题越滚越大，是政府失灵的典型例子。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>公共选择理论把选民、政治家、官员和利益集团都看作追求自身利益的理性人。<\/li>\n<li>集中收益分散成本、寻租、监管俘获和短视是政府失灵的主要方式。<\/li>\n<li>市场失灵是干预的理由，但干预时也要考虑政府失灵的可能。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么金融监管在危机后往往大幅收紧，而在长期繁荣后又逐渐放松？<\/summary>\n<div><p>危机后，公众损失巨大、愤怒强烈，政治家有动力表现出强硬的姿态，监管收紧。繁荣期，危机的记忆淡化，行业利润丰厚、游说力量增强，而严格监管的成本（比如信贷减少）看得见，好处（避免未来的危机）看不见，监管就会逐渐放松。这种周期本身可能加剧金融周期的波动。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-15\"><\/a><\/li>\n<li><a href=\"#LH4-6\"><\/a><\/li>\n<li><a href=\"#LI2-25\"><\/a><\/li>\n<\/ul><\/div>\n","2.1":"<div class=\"scene\">\n<p>2014 年 4 月的一个星期天，尼日利亚一夜之间“富”了近一倍。政府统计局宣布，更新统计基准年份后，2013 年的 GDP 从约 2,700 亿美元上调到约 5,100 亿美元，尼日利亚一下超过南非，成为非洲最大的经济体。经济本身没有任何变化，变的只是计算方法。那么，<strong>国内生产总值（gross domestic product，GDP）<\/strong>到底是怎么算出来的？<\/p>\n<\/div>\n\n<h2>GDP 是什么<\/h2>\n<p>GDP 是一个国家在一定时期内（一个季度或一年）境内生产的所有最终产品和服务的市场价值。几个关键词：<\/p>\n<ul>\n<li><strong>境内<\/strong>：在这个国家领土上生产的，不管是本国企业还是外国企业。<\/li>\n<li><strong>最终产品<\/strong>：只算最终卖给使用者的东西。面粉卖给面包店，再做成面包卖给你，只算面包，否则面粉会被重复计算。<\/li>\n<li><strong>市场价值<\/strong>：按市场价格计算。所以不经过市场的活动，比如家务劳动，通常不算在内。<\/li>\n<\/ul>\n\n<h2>三种算法，同一个答案<\/h2>\n<p>一个经济体里，一个人的支出就是另一个人的收入，也对应着某种生产。所以 GDP 可以从三个角度算，理论上结果相同：<\/p>\n<ul>\n<li><strong>支出法（expenditure approach）<\/strong>：GDP = 消费（C）+ 投资（I）+ 政府购买（G）+ 净出口（出口 − 进口，NX）。这是市场最常用的拆分方式。<\/li>\n<li><strong>收入法（income approach）<\/strong>：把生产中所有人的收入加起来：工资、企业利润、利息、租金，再加上折旧和间接税。<\/li>\n<li><strong>生产法（production approach）<\/strong>：把每个行业的增加值（产出减去中间投入）加起来：农业、工业、服务业等。<\/li>\n<\/ul>\n<p>实际统计中，三种方法的结果会有差异，称为统计误差。<\/p>\n\n<div class=\"desk\">\n<p>交易员和经济学家看 GDP 数据，最关心的是支出法的各项贡献：消费是否强劲，企业投资是否增长，库存变化和净出口是否扭曲了数字。美国 GDP 以“季度环比折年率”公布，欧洲和中国通常看同比或季度环比。数据公布后还会多次修订，市场对初值的意外反应最大。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>尼日利亚此前的 GDP 以 1990 年为基准年，没有反映此后快速发展的电信、电影（“诺莱坞”）、金融和零售等行业。2014 年更新为 2010 年基准后，GDP 规模上调约 89%，服务业占比大幅上升。同一年，欧盟统一核算标准，要求成员国把毒品交易、走私等非法活动的估计纳入 GDP，英国和意大利的 GDP 因此也有所上调。这些例子说明，GDP 是一个统计构造，方法变了，数字就会变。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>GDP 是一国境内一定时期内生产的所有最终产品和服务的市场价值。<\/li>\n<li>它可以用支出法、收入法和生产法计算，理论上结果相同。<\/li>\n<li>市场最常用支出法拆分：消费、投资、政府购买和净出口；GDP 的数字也依赖统计方法。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>你请了一位保姆做家务，每月付 5,000 元。后来你和她结婚了，她继续做同样的家务，但你不再付工资。GDP 会怎样变化？这说明了 GDP 的什么局限？<\/summary>\n<div><p>GDP 会减少每年 6 万元，尽管实际完成的家务和带来的福利没有任何变化。这说明 GDP 只计算经过市场交易的活动，家务劳动、志愿服务、闲暇等都不在其中。它衡量的是市场生产，而不完全是人们的生活水平或福利。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-2\"><\/a><\/li>\n<li><a href=\"#L2-3\"><\/a><\/li>\n<li><a href=\"#L23-1\"><\/a><\/li>\n<\/ul><\/div>\n","2.2":"<div class=\"scene\">\n<p>2015 年，爱尔兰公布当年 GDP 增长约 26%。这是一个发达国家几乎不可能出现的数字。经济学家保罗·克鲁格曼戏称其为“小矮妖经济学”（leprechaun economics）。原因是几家跨国公司把大量知识产权和资产转移到爱尔兰，它们在爱尔兰“生产”的利润大增，但这些利润最终大部分流向了外国股东，爱尔兰普通人的收入并没有大幅增加。这说明了 <strong>GDP<\/strong> 和 <strong>GNP（国民生产总值）<\/strong>、国民收入之间的区别。<\/p>\n<\/div>\n\n<h2>境内还是国民<\/h2>\n<ul>\n<li><strong>GDP（国内生产总值）<\/strong>：在本国境内生产的，不管是谁的企业。<\/li>\n<li><strong>GNP 或 GNI（国民生产总值或国民总收入）<\/strong>：本国居民（个人和企业）获得的收入，不管在哪里生产的。<\/li>\n<\/ul>\n<p>两者的差别是“来自国外的净要素收入”：本国居民在国外赚的工资、利润和利息，减去外国居民在本国赚走的部分。<\/p>\n<ul>\n<li>外资企业很多、利润大量汇出的国家，GNI 低于 GDP，比如爱尔兰、卢森堡。<\/li>\n<li>海外投资很多、或者大量劳动力在国外工作并汇回收入的国家，GNI 可能高于 GDP，比如日本、菲律宾。<\/li>\n<\/ul>\n\n<h2>从 GNI 到国民收入<\/h2>\n<p>还有几个相关概念：<\/p>\n<ul>\n<li><strong>国民净收入（NNI）<\/strong>：GNI 减去折旧，因为机器和建筑在生产中会磨损，需要用一部分产出来补偿。<\/li>\n<li><strong>国民收入（national incom
