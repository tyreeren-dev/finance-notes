/td><td>只能在到期日<\/td><td>股指期权、大多数场外期权、利率上限和互换期权<\/td><\/tr>\n<tr><td>美式（American）<\/td><td>到期前任何一天<\/td><td>美国个股期权、很多期货期权<\/td><\/tr>\n<tr><td>百慕大式（Bermudan）<\/td><td>在几个约定的日期<\/td><td>可赎回债券、百慕大互换期权<\/td><\/tr>\n<\/table><\/div>\n<p>百慕大这个名字，是因为它介于欧洲和美国之间，就像百慕大群岛在大西洋上的位置。<\/p>\n\n<h2>什么时候值得提前行权<\/h2>\n<p>对不分红股票的美式看涨期权，提前行权几乎从来不划算：提前行权只能拿到内在价值，却放弃了时间价值，还要提前付执行价。不如直接把期权卖掉。<\/p>\n<p>但有两种情况会提前行权：<\/p>\n<ul>\n<li><strong>分红前的看涨期权<\/strong>：股票即将分红、分红后股价会下跌，持有看涨期权的人可能在分红前行权，拿到股票领取分红。<\/li>\n<li><strong>深度价内的看跌期权<\/strong>：早点行权拿到执行价的现金，可以早点赚利息，尤其在利率高的时候。<\/li>\n<\/ul>\n\n<h2>百慕大式无处不在<\/h2>\n<p>百慕大式听起来冷门，其实在固定收益里非常常见：<\/p>\n<ul>\n<li>可赎回债券通常只能在付息日赎回，就是发行人手里的百慕大期权。<\/li>\n<li>百慕大互换期权（Bermudan swaption）允许在多个日期选择是否进入利率互换，常用来对冲可赎回债券。<\/li>\n<\/ul>\n<p>它的定价比欧式复杂，因为每个行权日都要判断：现在行权和继续持有，哪个更值钱。需要用利率模型和数值方法来算。<\/p>\n\n<div class=\"desk\">\n<p>风险系统给美式和百慕大期权估值，要用树模型或蒙特卡洛等数值方法，比欧式期权慢得多，也更依赖模型假设。模型验证团队会特别检查提前行权的处理是否合理。<\/p>\n<p>期权到期日和分红日附近，交易台要检查：哪些空头期权可能被提前行权，从而突然多出或少了股票，影响对冲和交割。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美国股票期权的“分红套利”（dividend play）：分红前一天，一些交易员会大量交易深度价内的看涨期权，赌部分持有者忘记在分红前提前行权。没有行权的看涨期权卖方，会在分红日后少损失一些，套利者从中获利。这类交易让交易所在分红前后经常出现异常巨大的期权成交量。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>欧式只能到期行权，美式随时可以，百慕大在几个约定日期可以。<\/li>\n<li>不分红股票的美式看涨几乎不该提前行权；分红前的看涨和深度价内的看跌可能提前行权。<\/li>\n<li>百慕大式在固定收益里很常见，比如可赎回债券和百慕大互换期权，定价需要数值方法。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只可赎回债券，发行人可以在之后每年的付息日按面值赎回。从投资者的角度看，他持有的是什么样的期权组合？<\/summary>\n<div><p>投资者持有一只普通债券，同时卖出了一个百慕大式的看涨期权给发行人：发行人在每个付息日都可以选择按面值“买回”债券。所以投资者是这个百慕大期权的空头，Vega 为负，也承受负凸性。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-20\"><\/a><\/li>\n<li><a href=\"#L16-23\"><\/a><\/li>\n<li><a href=\"#L16-41\"><\/a><\/li>\n<\/ul><\/div>\n","16.17":"<div class=\"scene\">\n<p>你觉得一只股票未来一个月会涨，但不会涨太多。直接买看涨期权？太贵了。有没有更便宜的办法？有：买一个看涨期权，同时卖出一个执行价更高的看涨期权。你放弃了大涨的收益，换来更低的成本。这就是一个期权组合策略。把几个期权拼在一起，可以“定制”出几乎任何你想要的收益形状。<\/p>\n<\/div>\n\n<h2>最常见的几种策略<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>策略<\/th><th>怎么搭<\/th><th>押注什么<\/th><\/tr>\n<tr><td>牛市价差（bull spread）<\/td><td>买低执行价看涨，卖高执行价看涨<\/td><td>温和上涨，成本更低，收益封顶<\/td><\/tr>\n<tr><td>熊市价差（bear spread）<\/td><td>买高执行价看跌，卖低执行价看跌<\/td><td>温和下跌<\/td><\/tr>\n<tr><td>跨式（straddle）<\/td><td>买同一执行价的看涨和看跌<\/td><td>大幅波动，方向不重要<\/td><\/tr>\n<tr><td>宽跨式（strangle）<\/td><td>买价外看涨和价外看跌<\/td><td>更大幅的波动，成本更低<\/td><\/tr>\n<tr><td>备兑看涨（covered call）<\/td><td>持有股票，卖出看涨<\/td><td>股价不会大涨，赚期权费<\/td><\/tr>\n<tr><td>保护性看跌（protective put）<\/td><td>持有股票，买入看跌<\/td><td>给股票买保险<\/td><\/tr>\n<tr><td>领口（collar）<\/td><td>持有股票，买看跌、卖看涨<\/td><td>用卖看涨的钱付保险费，锁定区间<\/td><\/tr>\n<tr><td>蝶式（butterfly）<\/td><td>买两边、卖中间两份<\/td><td>价格停在某个点附近<\/td><\/tr>\n<\/table><\/div>\n\n<h2>看方向，也看波动<\/h2>\n<p>策略可以分成两类：<\/p>\n<ul>\n<li><strong>方向性<\/strong>：价差、备兑、保护性看跌，主要押注涨还是跌。<\/li>\n<li><strong>波动性<\/strong>：跨式、宽跨式、蝶式，主要押注波动大还是小。买跨式的人不在乎方向，只要大幅变动；卖跨式的人收期权费，赌市场平静，但一旦出现大行情，损失可能很大。<\/li>\n<\/ul>\n\n<h2>每个策略都有代价<\/h2>\n<p>没有免费的保护：领口锁住了下跌，也封住了上涨；备兑看涨多赚了期权费，却放弃了大涨；卖出期权收了钱，就要承担意外的风险。选策略，就是在“想要什么”和“愿意放弃什么”之间做取舍。<\/p>\n\n<div class=\"desk\">\n<p>企业常用领口来管理持有的大块股票或外汇敞口，叫零成本领口（zero-cost collar）：卖看涨收到的钱正好够买看跌。私人银行常给持有集中股票的客户推荐这种结构。<\/p>\n<p>风控看策略组合，要看整体的希腊字母，而不是单个期权。比如一个跨式空头，Delta 可能接近零，但 Gamma 和 Vega 都是大额负数。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2017 年前后，美国市场持续平静，波动率很低，很多投资者用“卖跨式”“卖宽跨式”或卖出波动率产品的方式赚取稳定收入。2018 年 2 月 5 日，市场突然大跌，VIX 一天翻了一倍多，这些卖期权的仓位瞬间出现巨额亏损，有的基金一天亏光了几年的收益。卖期权的策略在平静时期看起来像“稳定收息”，本质上是在卖保险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>把几个期权组合起来，可以定制收益形状：价差、跨式、领口、蝶式等。<\/li>\n<li>策略分方向性和波动性两类，后者押注的是波动大小而不是方向。<\/li>\n<li>每个策略都在取舍：得到保护或收入，就要放弃一部分收益或承担尾部风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司下周公布财报，你认为股价会大幅变动，但不知道是涨还是跌。用什么策略？最大的风险是什么？<\/summary>\n<div><p>买跨式或宽跨式：同时买看涨和看跌。最大的风险是股价变动幅度不够大，或者财报公布后隐含波动率大幅回落（波动率压缩），两个期权的价值都下降，你可能亏掉大部分期权费。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-15\"><\/a><\/li>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<li><a href=\"#L24-26\"><\/a><\/li>\n<\/ul><\/div>\n","16.18":"<div class=\"scene\">\n<p>你卖出了 1,000 份看涨期权。老板问：“股价涨 1 元，我们亏多少？明天什么都不变，我们赚多少？市场突然恐慌，我们会怎样？”每个问题，都对应一个希腊字母。它们是期权风险的仪表盘。<\/p>\n<\/div>\n\n<h2>Delta：标的动一点，期权动多少<\/h2>\n<p>Delta 是标的价格变动 1 单位时，期权价格的变化。看涨期权的 Delta 在 0 到 1 之间，看跌期权在 −1 到 0 之间。<\/p>\n<ul>\n<li>深度价内看涨：Delta 接近 1，像持有股票。<\/li>\n<li>平值：Delta 约 0.5。<\/li>\n<li>深度价外：Delta 接近 0。<\/li>\n<\/ul>\n<p>Delta 也是对冲比例：卖出一个 Delta 0.5 的看涨期权，买入 0.5 股股票，小幅波动下就基本不赚不亏，叫 Delta 中性（delta neutral）。<\/p>\n\n<h2>Gamma：Delta 自己怎么变<\/h2>\n<p>Gamma 是标的变动 1 单位时，Delta 的变化。平值、临近到期的期权 Gamma 最大：股价稍微一动，Delta 就从 0.3 跳到 0.7。<\/p>\n<p>买入期权是 Gamma 多头：股价大涨时 Delta 变大，赚得越来越多；大跌时 Delta 变小，亏得越来越少。卖出期权是 Gamma 空头：大行情两边都吃亏，而且需要不停调整对冲。<\/p>\n\n<h2>Vega：波动率动一点，期权动多少<\/h2>\n<p>Vega 是隐含波动率上升 1 个点时期权价格的变化。买期权 Vega 为正，卖期权 Vega 为负。期限越长，Vega 越大。<\/p>\n\n<h2>Theta：时间流逝的代价<\/h2>\n<p>Theta 是过了一天、其他都不变时，期权价格的变化。买方的 Theta 通常为负：期权每天都在流失时间价值。卖方的 Theta 为正，每天“收租”。临近到期的平值期权，Theta 最大。<\/p>\n\n<h2>Gamma 和 Theta 是一对<\/h2>\n<p>这是期权交易最重要的一个关系：<strong>Gamma 多头的人付 Theta，Theta 多头的人承担 Gamma 风险。<\/strong>买期权的人每天付时间价值，换取大行情时的收益；卖期权的人每天收时间价值，承担大行情时的损失。天下没有免费的午餐。<\/p>\n<p>还有一个 Rho：利率变动 1 个百分点时期权价格的变化，对短期股票期权影响不大，对长期期权和利率期权更重要。<\/p>\n\n<div class=\"desk\">\n<p>期权台的日报会列出：按标的汇总的 Delta（常换算成“等值股数”或金额）、Gamma（股价动 1% 时 Delta 变多少）、按到期日分桶的 Vega、全账户的 Theta。交易员的日常就是在这几个数字之间取舍：留多少 Gamma、愿意付多少 Theta、Vega 押在哪个期限。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>1995 年巴林银行倒闭。<\/strong>新加坡交易员尼克·里森除了在日经指数期货上做大额押注，还大量卖出日经指数的跨式期权，相当于同时卖出看涨和看跌，押注市场平静。他的仓位是巨大的 Gamma 空头和 Vega 空头。1995 年 1 月阪神大地震后，日经指数大跌、波动率飙升，两头一起亏损，损失约 8.3 亿英镑，超过了巴林银行的全部资本，这家有两百多年历史的银行随之倒闭。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>Delta 看方向，Gamma 看 Delta 的变化，Vega 看波动率，Theta 看时间。<\/li>\n<li>Delta 也是对冲比例；平值、临近到期的期权 Gamma 和 Theta 最大。<\/li>\n<li>Gamma 多头付 Theta，Theta 多头担 Gamma 风险：买期权和卖期权是一场交换。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个期权交易员的账户 Delta 为零、Gamma 很大的负数、Theta 为正。他在押注什么？什么情况下会出事？<\/summary>\n<div><p>他在押注市场平静：Delta 为零不怕小幅波动，正 Theta 让他每天赚时间价值。出事的情况是行情突然大幅变动，无论涨跌：负 Gamma 让他的 Delta 朝不利方向快速变化，对冲跟不上，损失会迅速放大。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L24-20\"><\/a><\/li>\n<li><a href=\"#L24-25\"><\/a><\/li>\n<li><a href=\"#L24-26\"><\/a><\/li>\n<li><a href=\"#L16-28\"><\/a><\/li>\n<\/ul><\/div>\n","16.19":"<div class=\"scene\">\n<p>你问一个期权交易员：“这个期权多少钱？”他回答：“25 个 vol。”你可能会一头雾水：价格怎么用百分比来报？其实他报的是<strong>隐含波动率（implied volatility）<\/strong>，期权市场真正的“价格”。<\/p>\n<\/div>\n\n<h2>从价格反推出来的波动率<\/h2>\n<p>期权定价模型需要六个输入，只有波动率看不到。反过来，如果知道了期权在市场上的价格，就可以把其他五个输入代进去，倒推出那个让模型价格等于市场价格的波动率。这个数就是隐含波动率。<\/p>\n<p>它代表市场认为标的未来会波动多大。年化 20% 的波动率，大致意味着一年里价格的典型变动幅度在 ±20% 左右，换算到一天约 ±1.3%（20% 除以 √252）。<\/p>\n\n<h2>为什么交易员用波动率报价<\/h2>\n<p>期权的价格会随标的价格和时间不停变化，同一个期权早上 5 元、下午 4.5 元，可能只是因为股价动了。隐含波动率把这些因素剔除了，剩下的才是“这个期权贵不贵”。比较不同执行价、不同到期日的期权，也只能用隐含波动率。<\/p>\n\n<h2>隐含波动率和历史波动率<\/h2>\n<ul>\n<li><strong>历史波动率（realized / historical volatility）<\/strong>：过去一段时间标的实际波动了多少，用历史价格算出来。<\/li>\n<li><strong>隐含波动率<\/strong>：市场预期未来会波动多少，从期权价格反推。<\/li>\n<\/ul>\n<p>隐含波动率通常略高于后来实际发生的波动率，差额叫波动率风险溢价（volatility risk premium）：买保险的人愿意多付一点，卖保险的人平时因此赚钱，但偶尔遭遇大灾。<\/p>\n\n<h2>一张表，而不是一个数<\/h2>\n<p>同一个标的，不同执行价、不同到期日的期权，隐含波动率各不相同。股票指数的价外看跌期权，隐含波动率通常明显更高，叫偏斜（skew）；外汇和很多商品期权两边都高，叫微笑（smile）。把所有执行价和到期日排在一起，就是波动率曲面（volatility surface）。<\/p>\n\n<div class=\"desk\">\n<p>交易员的口头报价：“平值三个月 22 个 vol，25 Delta 看跌比看涨贵 4 个 vol。”前半句说整体水平，后半句说偏斜。风险报告里的 Vega，就是隐含波动率每变动 1 个点（1 个 vol）的损益。<\/p>\n<p>隐含波动率在恐慌时往往和标的价格反向变动：股市大跌，隐含波动率飙升。这就是为什么卖期权的人在危机中会同时被价格和波动率打击。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月 16 日，衡量标普 500 未来 30 天隐含波动率的 VIX 指数收于 82.69，是有史以来最高的收盘值，超过了 2008 年金融危机期间的高点。对应到一天的典型波动约 5%。平静时期 VIX 通常在 12 到 20 之间。几个月后，随着市场稳定，VIX 回落到 20 多，期权的价格也随之大幅下降。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>隐含波动率是从期权价格反推出来的市场预期波动，是期权市场真正的“价格”。<\/li>\n<li>它通常略高于事后实际的波动，差额是波动率风险溢价。<\/li>\n<li>不同执行价、到期日的隐含波动率不同，形成偏斜、微笑和波动率曲面。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只股票的历史波动率是 25%，它的平值期权隐含波动率是 40%。可能是什么原因？<\/summary>\n<div><p>市场预期未来会比过去波动得更厉害：可能有即将公布的财报、重大事件（比如监管决定、诉讼、并购结果），或者整个市场正在恐慌。也可能是期权需求暂时很大，把价格推高了。卖期权的人会觉得它“贵”，但要先确认是不是有一件大事即将发生。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-20\"><\/a><\/li>\n<li><a href=\"#L16-27\"><\/a><\/li>\n<li><a href=\"#L24-26\"><\/a><\/li>\n<\/ul><\/div>\n","16.20":"<div class=\"scene\">\n<p>新闻里常说：“恐慌指数 VIX 飙升至 35。”VIX 是什么？它和股市有什么关系？能不能直接买？<\/p>\n<\/div>\n\n<h2>VIX：市场的“恐慌温度计”<\/h2>\n<p>VIX 是芝加哥期权交易所（Cboe）编制的指数，用标普 500 指数一系列期权的价格，计算出市场预期未来 30 天的年化波动率。VIX 20，意思是市场预期未来一个月标普 500 的年化波动约 20%，大约对应每天 1.3% 左右的典型波动。<\/p>\n<p>VIX 通常和股市反向变动：股市下跌时，大家抢着买保护，期权变贵，VIX 上升。所以它被叫作“恐慌指数”（fear gauge）。平静时 VIX 在 12 到 20 之间，恐慌时可以冲到 40、50 以上。<\/p>\n\n<h2>VIX 本身不能直接买<\/h2>\n<p>VIX 是一个计算出来的数字，没有办法像股票那样直接持有。想交易波动率，要用相关的产品：<\/p>\n<ul>\n<li><strong>VIX 期货<\/strong>：押注未来某个月的 VIX 水平。<\/li>\n<li><strong>VIX 期权<\/strong>：以 VIX 期货为标的的期权。<\/li>\n<li><strong>波动率交易所产品（ETP）<\/strong>：通过滚动持有 VIX 期货，提供做多或做空波动率的敞口。<\/li>\n<li><strong>方差互换（variance swap）<\/strong>：场外直接交易未来的实际波动。<\/li>\n<\/ul>\n\n<h2>做多波动率为什么常常亏钱<\/h2>\n<p>VIX 期货通常是升水的：远月期货比近月和现货 VIX 更高，因为市场平静时，大家预期波动最终会回到平均水平。持有做多波动率的产品，需要不断卖出快到期的期货、买入更贵的远月期货，每次展期都会亏一点。所以长期持有做多 VIX 的产品，价格几乎一路下跌，只有在危机时才会短暂暴涨。<\/p>\n<p>反过来，做空波动率的产品平时稳定赚钱，危机时可能一次亏光。<\/p>\n\n<div class=\"desk\">\n<p>交易员和风控看 VIX，主要当作市场情绪的指标：VIX 快速上升，通常伴随着利差走阔、流动性变差、相关性上升。很多机构的压力测试情景会写明“VIX 升至 50”之类的假设。<\/p>\n<p>其他市场也有类似的指数：欧洲的 VSTOXX、美国国债期权的 MOVE 指数（衡量利率波动）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2018 年 2 月 5 日，“波动率末日”。<\/strong>那天美股下跌约 4%，VIX 从 17 左右升到 37 左右，单日涨幅超过 100%。做空波动率的产品 XIV 当晚暴跌超过 90%，发行商第二天宣布提前终止；另一只类似产品 SVXY 也大幅亏损。很多散户把这类产品当作“稳定收益”来源，没有意识到它们在一天之内就可能归零。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>VIX 由标普 500 期权价格算出，代表市场预期未来 30 天的波动，被称为恐慌指数。<\/li>\n<li>VIX 本身不能直接买，只能通过 VIX 期货、期权、ETP 和方差互换来交易波动率。<\/li>\n<li>VIX 期货通常升水，长期做多波动率会因展期亏损；做空波动率平时赚钱，危机时可能一次亏光。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个投资者买入了一只跟踪 VIX 短期期货的做多波动率基金，打算长期持有，作为股市下跌的保险。这样做有什么问题？<\/summary>\n<div><p>VIX 期货通常升水，这只基金每次展期都在亏钱，长期持有会大幅缩水。它在危机爆发时确实会暴涨，但如果危机迟迟不来，展期损失会把大部分价值耗掉。这类产品更适合短期战术使用，不适合长期持有。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-19\"><\/a><\/li>\n<li><a href=\"#L16-34\"><\/a><\/li>\n<li><a href=\"#L24-26\"><\/a><\/li>\n<\/ul><\/div>\n","16.21":"<div class=\"scene\">\n<p>周三早上 9 点半，美国股市开盘。一个散户花 200 美元，买了一份当天下午 4 点就到期的标普 500 价外看涨期权。如果下午指数涨 1%，这份期权可能值 2,000 美元；如果不涨，到收盘就一文不值。这种当天到期的期权，叫 <strong>0DTE 期权（zero days to expiration）<\/strong>，中文常叫“末日期权”。<\/p>\n<\/div>\n\n<h2>为什么现在每天都有期权到期<\/h2>\n<p>过去，标普 500 期权主要在每月第三个周五到期。后来交易所陆续增加了周期权，到 2022 年，标普 500 指数期权已经覆盖了每周一到周五每一天到期。于是每个交易日，都有当天到期的期权可以交易。<\/p>\n<p>0DTE 期权的交易量增长极快。到 2024 年前后，当天到期的期权已经占到标普 500 指数期权总成交量的一半左右。<\/p>\n\n<h2>0DTE 的特点：极端的 Gamma 和 Theta<\/h2>\n<ul>\n<li><strong>便宜<\/strong>：离到期只剩几个小时，时间价值很少，价外期权只要几美元到几十美元。<\/li>\n<li><strong>Gamma 极大<\/strong>：临近到期的平值期权，指数稍微一动，Delta 就会剧烈变化，价格可能几分钟内翻几倍或归零。<\/li>\n<li><strong>Theta 极大<\/strong>：时间价值在几个小时内全部消失，到了下午每过一分钟都在大幅贬值。<\/li>\n<\/ul>\n<p>买方像买彩票：小钱博大钱，大部分时候归零。卖方每天收一点期权费，偶尔一次大行情就要赔很多。<\/p>\n\n<h2>谁在交易<\/h2>\n<p>散户是重要的参与者，但机构也大量使用：对冲当天公布的经济数据或央行决定带来的风险，精确地在日内调整敞口，或者系统化地卖出 0DTE 期权赚取期权费。<\/p>\n\n<div class=\"desk\">\n<p>市场关心的一个问题是：卖出大量 0DTE 期权的做市商，需要在日内不断对冲 Delta，这会不会放大市场波动？如果做市商是大量 Gamma 空头，指数一跌他们就要卖、一涨就要买，可能加剧日内波动；反之如果是 Gamma 多头，则会起到稳定作用。这个问题在业界和学界都还有争论。<\/p>\n<p>对风控来说，0DTE 仓位的风险几乎完全在当天：日终可能已经全部到期，但日内的风险可以非常大，需要盘中监控，而不只是看收盘后的报告。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2024 年 8 月 5 日，日元套息交易集中平仓，全球市场大跌，VIX 在开盘前后一度冲到 65 左右。当天美国股市的 0DTE 期权交易异常活跃，很多卖出当天到期期权的策略遭受大额亏损。不过当天收盘时 VIX 已回落到 38 左右，几天后又回到 20 附近。这一天常被拿来讨论：在 0DTE 盛行的市场里，日内的波动可以比收盘数字所显示的剧烈得多。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>0DTE 是当天到期的期权；标普 500 指数期权现在每个交易日都有到期。<\/li>\n<li>它便宜、Gamma 和 Theta 极大，价格在几小时内可能翻几倍或归零。<\/li>\n<li>散户和机构都在用；它的风险集中在日内，需要盘中监控。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个散户说：“我每天买 0DTE 看涨期权，赢一次就能赚十倍。”从期权定价的角度，这个策略长期来看大概率会怎样？<\/summary>\n<div><p>大概率亏钱。期权价格已经反映了涨到执行价的概率，赢一次赚十倍，往往对应着十次里赢不到一次。再加上买卖价差和隐含波动率通常高于实际波动的溢价，长期来看买方处于劣势。赢一次十倍的感觉很好，但输掉的那九次以上会把收益吃掉。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<li><a href=\"#L16-28\"><\/a><\/li>\n<li><a href=\"#L16-22\"><\/a><\/li>\n<\/ul><\/div>\n","16.22":"<div class=\"scene\">\n<p>你长期看好一家公司，但不想一次投入很多钱买股票。你买了一份两年后到期的看涨期权，花的钱只有股价的四分之一左右。如果两年后股价翻倍，你的收益是买股票的好几倍。这种到期时间很长的期权，叫<strong>长期期权（LEAPS，Long-term Equity AnticiPation Securities）<\/strong>。<\/p>\n<\/div>\n\n<h2>LEAPS：一年以上到期的期权<\/h2>\n<p>LEAPS 是交易所上市的、到期时间一年以上（常见两到三年）的股票或指数期权。它的机制和普通期权一样，只是时间长得多。<\/p>\n<p>时间长带来几个不同的特点：<\/p>\n<ul>\n<li><strong>更贵<\/strong>：时间价值多，期权费高。<\/li>\n<li><strong>Theta 小<\/strong>：每天的时间价值流失慢，不像短期期权那样“天天付租金”。<\/li>\n<li><strong>Vega 大<\/strong>：对隐含波动率的变化很敏感。<\/li>\n<li><strong>Rho 和分红的影响变大<\/strong>：期限长了，利率和分红预期的变化不能再忽略。<\/li>\n<\/ul>\n\n<h2>常见用法<\/h2>\n<ul>\n<li><strong>替代股票<\/strong>：买深度价内的 LEAPS 看涨期权，Delta 接近 1，用较少的资金获得接近持有股票的收益，叫“股票替代”（stock replacement）。<\/li>\n<li><strong>长期保护<\/strong>：持有股票组合，买 LEAPS 看跌期权，给未来两年买保险，比每个月滚动买短期看跌期权省事。<\/li>\n<li><strong>卖出收入<\/strong>：持有股票时卖出 LEAPS 看涨期权，一次收到较多期权费。<\/li>\n<\/ul>\n\n<h2>要注意的地方<\/h2>\n<p>LEAPS 的流动性通常比短期期权差，买卖价差大；期限长，隐含波动率的变化对价格影响很大；公司分红政策、并购等事件也会改变它的价值。买 LEAPS 看起来是“便宜的杠杆”，但如果两年里股价不涨，期权费仍会全部损失。<\/p>\n\n<div class=\"desk\">\n<p>长期期权在场外市场也很常见：银行发行的结构性产品里，常常嵌着三到五年期的股票期权，银行再到市场上对冲。这些长期期权的 Vega、利率和分红风险，是股票衍生品交易台最难管理的部分之一，因为长期限的对冲工具很少。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>LEAPS 由芝加哥期权交易所在 1990 年推出，最初的设计目的是给长期投资者一个更有效率的期权工具。在 2020–2021 年的牛市中，部分个人投资者大量用深度价内的 LEAPS 看涨期权替代股票，获得了数倍杠杆的收益；2022 年科技股大跌时，同样的仓位也带来了远超股票本身的亏损。杠杆是双向的。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>LEAPS 是到期一年以上的上市期权，机制和普通期权相同。<\/li>\n<li>时间长使它更贵、Theta 小、Vega 大，利率和分红的影响也更明显。<\/li>\n<li>常用来替代股票、做长期保护或收取期权费；流动性较差，杠杆是双向的。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两个投资者都看好同一只股票：一个买 1 个月期的平值看涨期权，一个买 2 年期的平值看涨期权。如果股价在接下来一个月原地不动，谁亏得多？<\/summary>\n<div><p>1 个月期的买方亏得多，几乎亏光期权费：期权到期作废。2 年期的期权只过去了一小段时间，时间价值流失很少，价格变化不大。这正是长期期权 Theta 小的体现。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<li><a href=\"#L16-21\"><\/a><\/li>\n<li><a href=\"#L16-29\"><\/a><\/li>\n<\/ul><\/div>\n","16.23":"<div class=\"scene\">\n<p>一家公司借了浮动利率贷款，担心利率上涨，但又不想用利率互换把利率完全固定，因为如果利率下跌，它也想享受好处。它的选择是买一份“利率保险”：利率超过 5%，超出部分由银行补；利率低于 5%，公司照样按市场利率付。这就是<strong>利率上限（cap）<\/strong>。<\/p>\n<\/div>\n\n<h2>利率上限和下限：利率期权<\/h2>\n<p><strong>利率上限（cap）<\/strong>是一串利率看涨期权，每一个叫 caplet，对应一个付息期。每期如果浮动利率高于执行利率（cap rate），买方收到差额。借浮动利率钱的人用它防止利率上涨。<\/p>\n<p><strong>利率下限（floor）<\/strong>是一串利率看跌期权，每一个叫 floorlet。浮动利率低于执行利率时，买方收到差额。放浮动利率贷款或持有浮息资产的人用它防止利率下跌。<\/p>\n<p>同时买上限、卖下限，就是利率领口（collar）：把利率锁在一个区间里，卖下限收到的钱可以抵消买上限的成本。<\/p>\n\n<h2>互换期权：进入互换的权利<\/h2>\n<p>互换期权（swaption）是在未来某天进入一笔利率互换的权利：<\/p>\n<ul>\n<li><strong>付固定互换期权（payer swaption）<\/strong>：有权进入一笔“付固定、收浮动”的互换。利率上升时值钱。<\/li>\n<li><strong>收固定互换期权（receiver swaption）<\/strong>：有权进入一笔“收固定、付浮动”的互换。利率下降时值钱。<\/li>\n<\/ul>\n<p>互换期权用两个期限描述：“1y10y”是 1 年后到期、标的是 10 年期互换。它是利率市场里最重要的期权，用来对冲可赎回债券、按揭贷款的提前还款、未来的发债计划等。<\/p>\n\n<h2>利率波动率怎么报<\/h2>\n<p>利率期权的价格通常用隐含波动率报价。因为利率可能接近零甚至为负，美元和欧元市场主要使用正态波动率（normal volatility），单位是基点，比如“1y10y 平值 90bp”，大致表示这个利率一年里典型的变动在 ±90bp 左右。<\/p>\n<p>所有到期和标的期限的平值波动率排成一张表，叫波动率矩阵；再加上不同执行价，就成了波动率立方（vol cube）。<\/p>\n\n<div class=\"desk\">\n<p>利率期权台的风险报告里，Vega 按“到期 × 标的期限”的格子列出；Delta 换算成 DV01 并按期限分桶。银行的资产负债管理部门也会用互换期权和利率上限对冲按揭提前还款等“隐含期权”风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年美联储快速加息前，很多私募基金控股的公司借了大量浮动利率贷款，并按贷款要求买入了利率上限，通常期限两到三年。利率上升后，这些上限保护了它们一段时间；但当旧的上限到期、要续买新的时，由于利率和利率波动率都已大幅上升，新上限的价格比几年前贵了很多倍，成了这些公司的一笔沉重开支。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>利率上限是一串利率看涨期权，防利率上涨；下限是一串看跌期权，防利率下跌。<\/li>\n<li>互换期权是进入利率互换的权利，分付固定和收固定，用“1y10y”描述期限。<\/li>\n<li>利率期权常用正态波动率（bp）报价，Vega 按到期和标的期限分桶管理。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司计划一年后发行 10 年期固定利率债券，担心一年后利率比现在高。它可以买哪种互换期权来对冲？<\/summary>\n<div><p>买一个 1y10y 的付固定互换期权。如果一年后利率上升，它可以行权进入付固定互换，赚到的钱抵消发债成本的上升；如果利率下降，它放弃行权，按更低的利率发债，只损失期权费。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-6\"><\/a><\/li>\n<li><a href=\"#L16-27\"><\/a><\/li>\n<li><a href=\"#L16-33\"><\/a><\/li>\n<li><a href=\"#L24-26\"><\/a><\/li>\n<\/ul><\/div>\n","16.24":"<div class=\"scene\">\n<p>你持有一家汽车公司 1,000 万美元的债券，担心它会违约，但不想卖掉债券。你找到一家银行：“我每年付你 1.5% 的保费；如果这家公司违约，你赔我损失。”你买到的是一份针对这家公司信用的保险，叫<strong>信用违约互换（credit default swap，CDS）<\/strong>。<\/p>\n<\/div>\n\n<h2>CDS：信用风险的保险<\/h2>\n<ul>\n<li><strong>保护买方（protection buyer）<\/strong>：定期付保费，叫 CDS 利差或 CDS 费率（spread），比如每年 150bp。<\/li>\n<li><strong>保护卖方（protection seller）<\/strong>：收保费；如果参考实体（reference entity）发生信用事件，就赔付买方损失。<\/li>\n<\/ul>\n<p>信用事件（credit event）包括破产、不付款，以及在某些合约里的债务重组。赔付金额 = 名义本金 ×（1 − 回收率）。回收率通常通过一场统一的拍卖（auction）确定。<\/p>\n<p>买 CDS 不需要持有对方的债券，所以 CDS 也被用来单纯押注某家公司信用变差，叫“裸 CDS”（naked CDS）。<\/p>\n\n<h2>CDS 利差和债券利差<\/h2>\n<p>CDS 利差和同一家公司债券的信用利差，衡量的是同一种风险，理论上应该很接近。两者的差叫 CDS-债券基差（CDS-bond basis）。实际中，资金成本、债券流动性、CDS 合约条款等因素会让基差偏离零。<\/p>\n\n<h2>方向别搞反<\/h2>\n<ul>\n<li><strong>买保护<\/strong>：利差走阔（信用变差）时赚钱，相当于做空信用。<\/li>\n<li><strong>卖保护<\/strong>：利差收窄时赚钱，相当于做多信用，效果类似持有这家公司的债券，但不用出本金。<\/li>\n<\/ul>\n<p>今天的标准 CDS 合约有固定的票息（美国通常 100bp 或 500bp），实际利差和固定票息之间的差额在交易时一次性支付，叫预付款（upfront）。<\/p>\n\n<div class=\"desk\">\n<p>CDS 的风险报告里有三样东西：CS01（利差动 1bp 的损益）、违约跳跃风险 JTD（参考实体突然违约时的损益）、回收率敏感度 Rec01。卖保护的仓位平时像持有债券，违约时会一下子亏掉“名义本金 × (1 − 回收率)”。<\/p>\n<p>CDS 合约由 ISDA 的标准文件管理，信用事件是否发生，由 ISDA 的信用衍生品决定委员会（Determinations Committee）裁定。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2008 年 AIG。<\/strong>美国国际集团（AIG）通过旗下的金融产品部门，卖出了大量针对次贷相关证券的 CDS 保护，名义本金达数千亿美元，几乎没有对冲。房价下跌后，这些证券被降级，AIG 按合约要追加大量抵押品；它自己的评级被下调，又触发了更多的抵押品要求。2008 年 9 月，AIG 资金耗尽，美国政府最终提供了总额超过 1,800 亿美元的救助。卖保护看起来是“收保费的稳定生意”，本质上是集中承担了巨大的尾部风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>CDS 是信用风险的保险：买方付保费，参考实体出事时卖方赔付名义本金 ×（1 − 回收率）。<\/li>\n<li>买保护是做空信用，卖保护是做多信用；CDS 利差和债券利差衡量同一种风险。<\/li>\n<li>CDS 风险看 CS01、JTD 和 Rec01；卖保护平时稳定、违约时损失集中。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行给一家公司发放了大额贷款，担心集中度太高。它可以怎样用 CDS 降低风险？还剩下什么风险？<\/summary>\n<div><p>买入这家公司的 CDS 保护：公司违约时，CDS 的赔付抵消贷款的损失。剩下的风险包括：卖保护的交易对手可能在关键时刻也出问题（交易对手风险，尤其当两者相关时，叫错向风险）；贷款和 CDS 的回收率可能不同；CDS 合约对“信用事件”的定义可能和贷款违约的情形不完全一致（基差风险）。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-25\"><\/a><\/li>\n<li><a href=\"#L24-21\"><\/a><\/li>\n<li><a href=\"#L24-22\"><\/a><\/li>\n<li><a href=\"#L9-16\"><\/a><\/li>\n<\/ul><\/div>\n","16.25":"<div class=\"scene\">\n<p>一个信用基金经理担心整个公司债市场都会走弱，而不是某一家公司。他不想一只一只卖掉手里的几百只债券，而是想一次性对冲整个市场的信用风险。他用的工具是<strong>信用指数（credit index）<\/strong>：一篮子 CDS 打包在一起的标准化合约。<\/p>\n<\/div>\n\n<h2>两大家族：CDX 和 iTraxx<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>指数<\/th><th>覆盖<\/th><th>成分数量<\/th><\/tr>\n<tr><td>CDX NA IG<\/td><td>北美投资级公司<\/td><td>125 家<\/td><\/tr>\n<tr><td>CDX NA HY<\/td><td>北美高收益公司<\/td><td>100 家<\/td><\/tr>\n<tr><td>iTraxx Europe（Main）<\/td><td>欧洲投资级公司<\/td><td>125 家<\/td><\/tr>\n<tr><td>iTraxx Crossover<\/td><td>欧洲高收益为主的公司<\/td><td>约 75 家<\/td><\/tr>\n<\/table><\/div>\n<p>每个指数每半年“换代”一次，叫新系列（series），重新挑选成分公司。最新一期叫 on-the-run，交易最活跃，最常用的期限是 5 年。<\/p>\n\n<h2>怎么交易<\/h2>\n<p>买入指数保护，相当于同时买入了篮子里每一家公司的 CDS 保护，每家公司按相同权重。某一家公司违约，指数按它的权重赔付，然后这家公司被移出，指数继续交易。<\/p>\n<p>信用指数是信用市场里流动性最好的工具，比单个公司的 CDS 和公司债都好交易得多。所以它被大量用于：<\/p>\n<ul>\n<li>对冲一个公司债组合的整体利差风险。<\/li>\n<li>表达对整个信用市场的看法。<\/li>\n<li>做相对价值交易：指数对成分公司、投资级对高收益、美国对欧洲。<\/li>\n<\/ul>\n\n<h2>指数期权和分层<\/h2>\n<p>在指数之上，还有两类衍生品：<\/p>\n<ul>\n<li><strong>指数期权（index swaption）<\/strong>：在未来某天按约定利差买入或卖出指数保护的权利，用来交易信用市场的波动率。<\/li>\n<li><strong>指数分层（tranches）<\/strong>：把指数的违约损失按顺序切成几层，比如 0–3%、3–7% 等，最先承担损失的层风险最高。这是合成 CDO 的标准化版本，交易的是违约之间的相关性。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>用指数对冲个别公司债组合，会留下基差风险：组合里的公司和指数成分不一样，行业和评级分布也不同。风险报告会分开列出“对冲后剩余的 CS01”和按发行人、行业的集中度。<\/p>\n<p>指数也是信用市场的“温度计”：CDX IG 和 iTraxx Main 的利差每天被大量引用，用来判断市场的风险偏好。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2012 年伦敦鲸。<\/strong>摩根大通的首席投资办公室在 CDX IG 第 9 系列等指数和指数分层上建立了巨大的仓位，规模大到足以影响市场价格，被对冲基金称为“伦敦鲸”。当市场走势不利时，这个仓位因为太大而无法平仓，对手方也知道它必须平仓，最终亏损约 62 亿美元。这个案例说明：再流动的市场，单一参与者的仓位一旦太大，也会失去流动性。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>信用指数是一篮子 CDS 的标准化合约，主要有北美的 CDX 和欧洲的 iTraxx。<\/li>\n<li>它流动性最好，用来对冲整个组合的利差风险或表达对信用市场的看法。<\/li>\n<li>在指数之上还有指数期权和分层；用指数对冲个别公司会留下基差风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个公司债组合全是欧洲的汽车和化工公司，用 iTraxx Main 买入保护来对冲。市场整体走好、但汽车行业单独出事时，会发生什么？<\/summary>\n<div><p>组合会亏钱，对冲却帮不上忙，甚至可能也亏钱：汽车公司债利差走阔，组合下跌；而指数里汽车只占一小部分，整体市场走好，指数利差收窄，买保护的一方反而亏损。这就是指数对冲的基差风险和行业集中风险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-24\"><\/a><\/li>\n<li><a href=\"#L16-37\"><\/a><\/li>\n<li><a href=\"#L9-38\"><\/a><\/li>\n<li><a href=\"#L24-20\"><\/a><\/li>\n<\/ul><\/div>\n","16.26":"<div class=\"scene\">\n<p>同样是利率衍生品，一份 SOFR 期货在芝加哥商品交易所交易，人人看得到价格，几秒钟成交；一份为某个企业量身定制的 7 年期利率互换，则是银行和企业一对一谈出来的。前者叫<strong>场内衍生品（exchange-traded）<\/strong>，后者叫<strong>场外衍生品（over-the-counter，OTC）<\/strong>。<\/p>\n<\/div>\n\n<h2>两种市场的区别<\/h2>\n<div class=\"tbl\"><table>\n<tr><th><\/th><th>场内<\/th><th>场外<\/th><\/tr>\n<tr><td>在哪交易<\/td><td>交易所<\/td><td>双方直接交易，或在电子平台上<\/td><\/tr>\n<tr><td>合约条款<\/td><td>标准化<\/td><td>可以定制<\/td><\/tr>\n<tr><td>交易对手<\/td><td>清算所<\/td><td>具体的对手方（或集中清算后的清算所）<\/td><\/tr>\n<tr><td>保证金<\/td><td>每天强制结算<\/td><td>按双边协议（CSA）或清算所规则<\/td><\/tr>\n<tr><td>透明度<\/td><td>价格公开<\/td><td>过去不透明，现在需向交易报告库报告<\/td><\/tr>\n<tr><td>典型产品<\/td><td>期货、上市期权<\/td><td>利率互换、外汇远期、CDS、结构性产品<\/td><\/tr>\n<\/table><\/div>\n<p>按名义本金算，场外市场比场内大得多，大部分利率和外汇衍生品都是场外的。<\/p>\n\n<h2>2008 年之后：场外市场被“搬进”清算所<\/h2>\n<p>2008 年金融危机暴露了场外市场的问题：没人知道谁欠谁多少，一家大机构倒下，可能拖垮一串对手方。2009 年 G20 匹兹堡峰会后，主要国家推动了几项改革：<\/p>\n<ul>\n<li><strong>强制集中清算<\/strong>：标准化的利率互换和信用指数，必须通过中央清算所（CCP）清算，比如 LCH、CME、Eurex。<\/li>\n<li><strong>交易报告<\/strong>：所有衍生品交易都要报告给交易报告库（trade repository）。<\/li>\n<li><strong>电子化交易<\/strong>：部分标准产品要在交易平台上交易（美国的 SEF）。<\/li>\n<li><strong>非清算衍生品的保证金<\/strong>：没有集中清算的双边合约，也要交换初始保证金和变动保证金。<\/li>\n<\/ul>\n<p>美国的多德-弗兰克法案和欧盟的 EMIR，就是这些改革的法律依据。<\/p>\n\n<h2>代价：风险集中在清算所<\/h2>\n<p>集中清算让交易对手风险大大降低，也让风险集中到了少数几家清算所身上。清算所本身如果出问题，影响巨大，所以它们被视为金融体系的关键基础设施，受到严格监管，有多层的违约资源保护。<\/p>\n\n<div class=\"desk\">\n<p>风控对场外衍生品要额外管理交易对手风险：对每个对手方的当前敞口和潜在未来敞口（PFE）、抵押品是否足够，以及信用估值调整（CVA）。场内和已清算的交易，主要关注的是保证金带来的流动性需求。<\/p>\n<p>双边场外衍生品的法律框架是 ISDA 主协议加上信用支持附件（CSA），规定了抵押品、净额结算和违约处理。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>雷曼兄弟 2008 年倒闭时，它在 LCH 清算的利率互换组合约有 66,000 笔交易、名义本金约 9 万亿美元。清算所只用了雷曼存入的部分保证金，就在几周内通过对冲和拍卖把这些仓位处理完毕，没有动用其他会员的资金。而双边的场外合约，有的花了好几年才通过法律程序清理完毕。这次对比，是推动后来强制集中清算的重要理由之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>场内衍生品标准化、在交易所交易、由清算所担保；场外衍生品可定制、双方直接交易。<\/li>\n<li>2008 年后，标准化场外衍生品被强制集中清算、交易报告，并要求交换保证金。<\/li>\n<li>集中清算降低了交易对手风险，但把风险集中到了清算所。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家企业想对冲一笔非常特殊的贷款利率（摊还计划不规则、利率基准少见）。它更可能用场内还是场外工具？要付出什么代价？<\/summary>\n<div><p>场外工具：只有场外互换可以完全按贷款的摊还计划和利率基准定制。代价包括：银行报价里会包含更高的利润和资本成本；企业要和银行签 ISDA 协议，可能需要提供抵押品；而且合约难以转让，提前终止时价格可能不理想。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-1\"><\/a><\/li>\n<li><a href=\"#L17-12\"><\/a><\/li>\n<li><a href=\"#L17-21\"><\/a><\/li>\n<li><a href=\"#L17-26\"><\/a><\/li>\n<\/ul><\/div>\n","16.27":"<div class=\"scene\">\n<p>一家银行的期权系统里，有一只股票的 3,000 个期权，执行价和到期日各不相同。每一个都需要一个隐含波动率才能估值。市场上直接有报价的只有几十个。剩下的从哪来？从一张事先“画”好的表上读出来。这张表，就是<strong>波动率曲面（volatility surface）<\/strong>；在利率市场，它还要多一个维度，变成<strong>波动率立方（volatility cube）<\/strong>。<\/p>\n<\/div>\n\n<h2>股票和外汇：两个维度的曲面<\/h2>\n<p>同一个标的，不同执行价、不同到期日的期权，隐含波动率各不相同。把它们排成一张二维的表，就是波动率曲面：<\/p>\n<ul>\n<li><strong>横着看（不同执行价）<\/strong>：股票指数通常是“偏斜”（skew）：执行价越低，波动率越高，因为大家愿意为下跌保护多付钱。外汇和很多商品常是“微笑”（smile）：两边都高。<\/li>\n<li><strong>竖着看（不同到期日）<\/strong>：叫期限结构（term structure）。平静时短期波动率较低，恐慌时短期波动率会高于长期。<\/li>\n<\/ul>\n<p>外汇期权市场按 Delta 报价：每个到期日报平值波动率（ATM）、25 Delta 风险反转（risk reversal，看涨和看跌的波动率差，表示偏向）和 25 Delta 蝶式（butterfly，两翼相对平值的溢价，表示弯度）。<\/p>\n\n<h2>利率：三个维度的立方<\/h2>\n<p>互换期权有两个期限：期权什么时候到期、到期后进入的互换有多长。只看平值，就已经是一张二维的“到期 × 标的期限”矩阵（vol matrix），比如“1y10y 平值 90bp”。再加上不同执行价，就变成三维的波动率立方。<\/p>\n<p>立方里大部分格子没有直接报价，要用模型填补。利率市场最常用 SABR 模型，用几个参数描述每一条微笑：整体水平、偏斜方向、两翼弯度，再在到期和期限之间插值。<\/p>\n\n<h2>为什么这张表这么重要<\/h2>\n<ul>\n<li>所有期权和含权产品的估值都要从它读出波动率。<\/li>\n<li>Vega 风险要按格子分桶，每个格子的波动率变化带来不同的损益。<\/li>\n<li>插值和外推的方法、模型参数，直接影响远期限、远价外期权的价格，是模型风险的重点。<\/li>\n<li>曲面必须没有套利：比如同一执行价，期限越长，总方差不能越小；否则模型会给出不合理的价格。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>交易台每天标记曲面，产品控制用经纪商报价和共识报价服务（比如 Totem）独立核对，偏差超过阈值要调整。风险报告里，Vega 按“到期 × 执行价”（股票外汇）或“到期 × 标的期限 × 执行价”（利率）分桶。缺乏报价的格子，常常还要计提额外的估值调整。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1987 年 10 月 19 日美国股市单日暴跌超过 20% 之前，股票期权的隐含波动率曲线基本是平的。股灾之后，价外看跌期权的波动率明显高于平值，偏斜从此长期存在。市场用价格记住了这次教训：大跌比正态分布假设的更常见。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>波动率曲面是执行价 × 到期日的隐含波动率表；股票多为偏斜，外汇常为微笑。<\/li>\n<li>利率互换期权多了标的期限这一维，形成波动率矩阵和立方，常用 SABR 填补和插值。<\/li>\n<li>它是所有期权估值和 Vega 风险的基础，插值、外推和无套利是模型风险的重点。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行的期权组合，总 Vega 接近零。风险经理还要看什么？<\/summary>\n<div><p>要看 Vega 在曲面或立方上的分布：短期和长期、价内和价外、不同标的期限上是否有大的反向仓位。总 Vega 为零只说明整个曲面平行移动时没有损益；如果曲面变陡、偏斜变大或者某个区域单独移动，仍然可能有大额损益。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-19\"><\/a><\/li>\n<li><a href=\"#L24-26\"><\/a><\/li>\n<li><a href=\"#L16-42\"><\/a><\/li>\n<li><a href=\"#L16-23\"><\/a><\/li>\n<\/ul><\/div>\n","16.28":"<div class=\"scene\">\n<p>一个期权做市商一天卖出了 5,000 份某股票的看涨期权。他不想赌股票的方向，只想赚期权的买卖价差。于是他买入一定数量的股票对冲。股价涨了，他再买一些；跌了，再卖一些。一整天都在调整。这就是<strong>动态对冲（dynamic hedging）<\/strong>。<\/p>\n<\/div>\n\n<h2>Delta 对冲：随时保持中性<\/h2>\n<p>做市商卖出期权后，按 Delta 买入相应数量的标的，让整个仓位对小幅价格变动不敏感。但 Delta 会随着价格、时间和波动率变化，所以要不断调整，叫再平衡（rebalancing）。<\/p>\n<ul>\n<li>卖出看涨期权（Gamma 空头）：股价涨了，Delta 变大，要买更多股票；跌了要卖出。追涨杀跌。<\/li>\n<li>买入期权（Gamma 多头）：正好相反，低买高卖。<\/li>\n<\/ul>\n<p>调整得越频繁，对冲越精确，但交易成本越高。做市商要在两者之间平衡。<\/p>\n\n<h2>对冲的成本就是期权的价值<\/h2>\n<p>理论上，如果市场的实际波动正好等于期权定价时的隐含波动率，卖期权收到的钱，正好等于整个期间动态对冲的成本。所以：<\/p>\n<ul>\n<li>实际波动低于隐含波动：卖期权、动态对冲的人赚钱。<\/li>\n<li>实际波动高于隐含波动：卖期权的人亏钱。<\/li>\n<\/ul>\n<p>做市商赚的，是隐含波动和实际波动之差，加上买卖价差。<\/p>\n\n<h2>Gamma 挤压：对冲影响市场<\/h2>\n<p>当大量期权集中在某些执行价，做市商的对冲买卖本身会推动市场：<\/p>\n<ul>\n<li>做市商整体是 Gamma 空头时：价格上涨，要追着买；下跌，要追着卖，放大了波动。价格朝某个方向一冲，可能形成“Gamma 挤压”（gamma squeeze）。<\/li>\n<li>做市商整体是 Gamma 多头时：价格上涨就卖、下跌就买，起到稳定作用，价格可能被“钉”在大额期权的执行价附近，尤其是到期日。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>期权台的风险管理重点：Gamma 和 Vega 的大小，调整对冲的频率和成本，以及标的价格大幅跳空（比如财报、隔夜新闻）时 Delta 对冲来不及调整的风险。很多市场参与者会估算整个市场的做市商 Gamma 头寸（“dealer gamma”），作为判断短期波动可能放大还是被压制的参考。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年 1 月，GameStop 的短期价外看涨期权被散户大量买入。卖出这些期权的做市商需要买入股票对冲，股价上涨又让它们的 Delta 空头扩大，只能继续买入，股价一周内涨了数倍。同期这只股票的空头也在被迫平仓，两种力量叠加，形成了历史上最著名的逼空之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>动态对冲是按 Delta 持续调整标的仓位，让期权组合对小幅变动保持中性。<\/li>\n<li>卖期权并对冲的人，赚的是隐含波动和实际波动之差；实际波动更大就亏钱。<\/li>\n<li>做市商的集中对冲会影响市场：Gamma 空头放大波动，Gamma 多头压制波动。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个做市商卖出了期权，隐含波动率 20%，并每天做 Delta 对冲。期权存续期间，股票的实际波动率是 30%。他最后大概是赚还是亏？<\/summary>\n<div><p>大概率亏钱。实际波动比他卖出时的隐含波动高，动态对冲中“追涨杀跌”的成本超过了他收到的期权费。这就是卖期权的风险：赚的是平静的钱，亏的是动荡的钱。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<li><a href=\"#L24-25\"><\/a><\/li>\n<li><a href=\"#L16-14\"><\/a><\/li>\n<\/ul><\/div>\n","16.29":"<div class=\"scene\">\n<p>一家私人银行向客户推荐一款产品：“投资三年，如果股市不跌超过 30%，每年拿 8% 的收益；如果涨了，可能提前结束，钱和收益一起还你。”听起来很诱人。这款产品背后，是一只债券加上几个期权。它叫<strong>结构性产品（structured product）<\/strong>。<\/p>\n<\/div>\n\n<h2>结构性产品是什么<\/h2>\n<p>结构性产品把一只债券（或存款）和一个或多个衍生品打包在一起，设计出特定的收益形状。发行人通常是银行，卖给个人投资者、私人银行客户或机构。<\/p>\n<p>拆开来看，几乎所有结构性产品都由两部分组成：<\/p>\n<ul>\n<li><strong>债券部分<\/strong>：保证（或部分保证）本金的那一块。<\/li>\n<li><strong>衍生品部分<\/strong>：带来额外收益或决定收益形状的那一块，通常是买入或卖出期权。<\/li>\n<\/ul>\n\n<h2>三种常见类型<\/h2>\n<p><strong>保本型（capital protected）<\/strong>：大部分钱买零息债，保证到期拿回本金；剩下的钱买看涨期权，分享上涨。利率越高，零息债越便宜，剩下买期权的钱越多，产品越有吸引力。<\/p>\n<p><strong>反向可转换（reverse convertible）<\/strong>：投资者收到很高的票息，代价是卖出了一个看跌期权：到期时股价跌破某个水平，就拿回股票而不是现金，可能亏损很多。<\/p>\n<p><strong>自动赎回（autocallable）<\/strong>：每个观察日，如果股价高于某个水平，产品提前结束，投资者拿回本金和约定收益；如果一直没触发、到期时股价又跌破“敲入”水平，投资者承担股票的损失。它是全球最流行的结构性产品之一，在亚洲和欧洲尤其多。<\/p>\n\n<h2>投资者要知道的<\/h2>\n<ul>\n<li>高票息几乎总是来自卖出期权：投资者在承担下跌风险，换取收益。<\/li>\n<li>产品的信用风险是发行银行的信用：银行倒闭，产品可能血本无归。<\/li>\n<li>流动性差：到期前想卖，只能卖回给发行人，价格不一定公道。<\/li>\n<li>费用常常隐藏在定价里，不容易看出来。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>发行结构性产品的银行，会在内部把产品里的期权“拆”出来，交给股票衍生品台对冲。大量发行自动赎回产品，会让银行累积大量的“长 Vega、长相关性”或“短下跌保护”等特殊风险，叫结构性产品风险的“集中”。风控需要监控这些风险在市场急跌时的表现。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年雷曼兄弟破产时，香港有数万名个人投资者持有雷曼发行或担保的“迷你债券”。这些产品被当作稳健投资销售，很多投资者不知道它们依赖雷曼的信用，也不清楚其中的信用衍生品结构。雷曼倒闭后，产品价值大跌，引发大规模投诉。香港监管机构介入，多家分销银行最终同意按一定比例回购，此后对复杂产品的销售规则大幅收紧。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>结构性产品是债券加衍生品的组合，用来设计特定的收益形状。<\/li>\n<li>保本型买期权；反向可转换和自动赎回的高票息来自卖出期权，投资者承担下跌风险。<\/li>\n<li>还要注意发行人信用、流动性和隐性费用。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一款三年期保本产品，在利率接近零的时候很难设计得有吸引力。为什么？<\/summary>\n<div><p>保本靠零息债：利率接近零时，三年期零息债几乎要花接近 100 元才能保证到期拿回 100 元，剩下买看涨期权的钱很少，产品能提供的上涨参与比例就很低。利率越高，零息债越便宜，留给期权的预算越多，保本产品越有吸引力。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-30\"><\/a><\/li>\n<li><a href=\"#L16-31\"><\/a><\/li>\n<li><a href=\"#L16-35\"><\/a><\/li>\n<\/ul><\/div>\n","16.30":"<div class=\"scene\">\n<p>在德国或瑞士，一个普通投资者打开券商 App，能看到成千上万只名字奇怪的产品：Turbo、Knock-out、Mini-Future、Faktor-Zertifikat。它们在交易所上市，像股票一样买卖，却都是银行发行的衍生品。欧洲的散户衍生品市场，规模和花样都远超美国。<\/p>\n<\/div>\n\n<h2>权证（warrants）<\/h2>\n<p>权证是银行发行、在交易所上市的期权，有看涨权证（call warrant）和看跌权证（put warrant）。和交易所的标准期权不同，权证由银行发行和做市，每一只的标的、执行价、到期日由银行设计，散户可以小额买入。<\/p>\n\n<h2>涡轮和敲出产品（turbos / knock-outs）<\/h2>\n<p>涡轮证（Turbo，也叫 Knock-out）提供杠杆的方向性敞口：<\/p>\n<ul>\n<li>多头涡轮：标的涨，产品按杠杆涨；标的跌到某个“敲出价”，产品立即终止，可能几乎归零。<\/li>\n<li>空头涡轮：反过来。<\/li>\n<\/ul>\n<p>它的价格大约等于“标的价格 − 融资水平”，几乎不受波动率影响，所以比普通权证更容易理解。迷你期货（Mini-Future）类似，只是敲出后通常还会退还一部分剩余价值。<\/p>\n\n<h2>杠杆证书（factor certificates）<\/h2>\n<p>杠杆证书提供每天固定倍数的收益，比如每天 5 倍于标的的涨跌。因为每天重新调整杠杆，持有时间长了，收益会偏离“标的涨跌 × 5”，在震荡市中会持续损耗，和杠杆 ETF 的原理相同。<\/p>\n\n<h2>为什么在欧洲这么流行<\/h2>\n<p>德国、瑞士、荷兰、北欧等地有专门的交易所板块（比如斯图加特证券交易所、法兰克福的相应市场、瑞士的 SIX Structured Products），发行银行竞争激烈，产品数量动辄几十万只。投资者可以用很小的金额获得杠杆、做空或押注特定事件。美国对散户使用这类产品限制较多，所以没有形成类似的市场。<\/p>\n\n<div class=\"desk\">\n<p>发行银行要对冲所有卖出的产品，并承担敲出时的跳空风险：价格可能跳过敲出价，银行无法按敲出价平掉对冲。风控会监控每个标的上所有产品的敲出价分布，以及跳空时的潜在损失。散户投资者则要注意：这些产品的对手方都是发行银行，存在发行人信用风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2015 年 1 月 15 日瑞士央行放弃欧元兑瑞郎汇率下限时，瑞郎在几分钟内大幅升值。大量挂钩欧元兑瑞郎的涡轮产品被瞬间敲出，持有者损失惨重；同时，一些发行银行因价格跳空过快、无法按敲出价平掉对冲，也蒙受了损失。这个事件被反复用作散户杠杆产品跳空风险的例子。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>权证是银行发行的上市期权；涡轮和敲出产品提供杠杆方向敞口，触及敲出价立即终止。<\/li>\n<li>杠杆证书提供每日固定倍数收益，长期持有会因再平衡产生损耗。<\/li>\n<li>欧洲散户衍生品市场规模大、品种多；风险包括杠杆、跳空和发行人信用。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个投资者买了一只 5 倍杠杆的每日杠杆证书，标的指数一周内先跌 10% 再涨回原位。他的证书会回到原价吗？<\/summary>\n<div><p>不会，会亏钱。粗略看，指数跌 10% 时证书跌约 50%；之后指数从 90 涨回 100，约涨 11.1%，证书按 5 倍涨约 55.6%。50 × 1.556 ≈ 78，证书从 100 变成了约 78。每天再平衡的杠杆产品在震荡市里会持续损耗。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-29\"><\/a><\/li>\n<li><a href=\"#L16-39\"><\/a><\/li>\n<li><a href=\"#L16-31\"><\/a><\/li>\n<\/ul><\/div>\n","16.31":"<div class=\"scene\">\n<p>一家出口企业想对冲汇率，但觉得普通期权太贵。银行给它设计了一个“只要汇率在未来三个月里从没跌破 1.05，期权就有效；一旦跌破，期权作废”的产品，价格便宜了一半。这类在普通期权上加了特殊条件的期权，叫<strong>奇异期权（exotic options）<\/strong>。<\/p>\n<\/div>\n\n<h2>几种常见的奇异期权<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>类型<\/th><th>特点<\/th><th>用途<\/th><\/tr>\n<tr><td>障碍期权（barrier）<\/td><td>标的触及某个价格时，期权生效（敲入，knock-in）或作废（敲出，knock-out）<\/td><td>比普通期权便宜，常嵌在结构性产品里<\/td><\/tr>\n<tr><td>数字期权（digital / binary）<\/td><td>到期时满足条件就支付固定金额，否则为零<\/td><td>押注“是否超过某个价格”<\/td><\/tr>\n<tr><td>亚式期权（Asian）<\/td><td>按一段时间的平均价格结算<\/td><td>商品和外汇对冲，降低操纵和单日波动的影响<\/td><\/tr>\n<tr><td>回望期权（lookback）<\/td><td>按期间最有利的价格结算<\/td><td>很贵，较少见<\/td><\/tr>\n<tr><td>篮子期权（basket）<\/td><td>标的是一篮子资产<\/td><td>对冲多个资产的组合风险，价格取决于相关性<\/td><\/tr>\n<tr><td>最差/最好表现期权（worst-of / best-of）<\/td><td>按篮子里表现最差或最好的资产结算<\/td><td>常嵌在自动赎回产品里<\/td><\/tr>\n<\/table><\/div>\n\n<h2>为什么风险更难管<\/h2>\n<ul>\n<li><strong>Greeks 会跳<\/strong>：障碍期权在障碍附近，Delta 和 Gamma 会突然变得很大或改变方向，对冲非常困难。<\/li>\n<li><strong>依赖更多参数<\/strong>：相关性、波动率曲面的形状、波动率的波动率，都会影响价格。<\/li>\n<li><strong>模型风险大<\/strong>：不同模型给出的价格差异明显，需要更多的估值调整。<\/li>\n<li><strong>流动性差<\/strong>：几乎都是场外定制，难以平仓。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>奇异期权台的风险报告除了常规 Greeks，还会列出对相关性、波动率偏斜、障碍附近的敏感度，以及大量情景分析。FRTB 标准法对奇异产品专门计提“残余风险附加”。产品控制会要求对难以对冲的风险计提模型和流动性储备。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年，中国和亚洲多家企业因为与银行签订的累计期权（accumulator）合约亏损巨大。这种产品让企业在价格高于某个水平时，按折扣价持续买入外汇或股票，但一旦价格下跌，买入数量要翻倍，而价格上涨到敲出价时合约就终止。上涨时收益有限，下跌时损失被放大，被市场戏称为“I'll kill you later”。中信泰富等公司因相关外汇合约亏损上百亿港元。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>奇异期权在普通期权上加入障碍、平均、回望、篮子等特殊条件。<\/li>\n<li>它们常常更便宜或更贴合需求，但 Greeks 不稳定、依赖更多参数、模型风险大。<\/li>\n<li>复杂产品对买方和卖方都有风险，累计期权是典型的教训。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个敲出看涨期权（标的涨到某个价格就作废）比普通看涨期权便宜。买方放弃了什么？<\/summary>\n<div><p>放弃了标的大涨时的收益：如果价格涨过敲出价，期权直接作废，买方什么都拿不到，而普通看涨期权在这种情况下收益最大。所以敲出期权适合预期“温和上涨、不会大涨”的人。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-29\"><\/a><\/li>\n<li><a href=\"#L16-32\"><\/a><\/li>\n<li><a href=\"#L16-35\"><\/a><\/li>\n<li><a href=\"#L16-45\"><\/a><\/li>\n<\/ul><\/div>\n","16.32":"<div class=\"scene\">\n<p>一个瑞士投资者看好日本股市，但不想承担日元汇率的风险。银行给了他一个产品：按日经指数的涨跌计算收益，但直接用瑞郎支付，汇率固定为 1。日经涨 10%，他就拿 10% 的瑞郎收益，日元怎么变都和他无关。这叫 <strong>Quanto<\/strong> 产品，是外汇奇异衍生品的一个代表。<\/p>\n<\/div>\n\n<h2>Quanto：把汇率风险“拿掉”<\/h2>\n<p>Quanto（quantity-adjusting option）是以一种货币计价的资产，收益用另一种货币按固定汇率支付。投资者只承担标的资产本身的风险，不承担汇率风险。<\/p>\n<p>汇率风险没有消失，而是转给了发行银行。银行对冲时会发现：标的资产和汇率之间的相关性，会影响对冲的成本。所以 Quanto 产品的价格里，有一项和这个相关性有关的调整，叫 Quanto 调整。相关性难以观察，也会变化，这是这类产品的核心风险。<\/p>\n\n<h2>外汇市场的其他奇异期权<\/h2>\n<ul>\n<li><strong>障碍期权<\/strong>：外汇市场是障碍期权最活跃的市场之一，企业对冲时常用敲出或敲入结构来降低成本。<\/li>\n<li><strong>数字期权<\/strong>：押注汇率在某天高于或低于某个水平。<\/li>\n<li><strong>目标累计远期（TARF，target redemption forward）<\/strong>：企业按优惠汇率定期买卖外汇，累计收益达到目标就提前终止；汇率不利时，往往要按双倍金额交易。它和累计期权类似，对企业而言上涨有限、下跌放大。<\/li>\n<li><strong>平均汇率期权<\/strong>：按一段时间的平均汇率结算，适合有持续外汇收付的企业。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>外汇奇异期权台的风险报告会列出对汇率、两种货币利率、波动率曲面（包括风险反转和蝶式）以及相关性的敏感度。企业客户的复杂外汇产品，还需要评估客户适当性和交易对手风险：汇率大幅变动时，企业可能面临远超预期的支付义务。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2015 年 8 月人民币汇率改革后，人民币对美元出现较大幅度贬值。此前几年，不少亚洲企业和高净值客户买入了与人民币汇率挂钩的目标累计远期（TARF），押注人民币持续升值。汇率反向变动后，这些产品要求按更多倍数、更不利的汇率交易，部分投资者损失惨重，也引发了对复杂外汇产品销售的监管关注。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>Quanto 产品让投资者获得外国资产的收益、但按固定汇率用本币支付，汇率风险转给发行银行。<\/li>\n<li>Quanto 的价格取决于标的与汇率的相关性，这是它的核心风险。<\/li>\n<li>外汇奇异期权包括障碍、数字、平均汇率和 TARF 等，企业客户要警惕下跌放大的结构。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行发行了大量挂钩日经指数、用美元支付的 Quanto 产品。如果日经指数和日元汇率之间的相关性突然改变，银行会受到什么影响？<\/summary>\n<div><p>银行对冲这些产品时，需要根据相关性调整对冲的方式和数量。相关性变化后，原来的对冲不再准确，银行会出现对冲误差带来的损益；产品的估值也会变化。因为相关性很难对冲，这部分风险通常只能通过限额、情景分析和估值调整来管理。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-31\"><\/a><\/li>\n<li><a href=\"#L16-46\"><\/a><\/li>\n<li><a href=\"#L18-26\"><\/a><\/li>\n<\/ul><\/div>\n","16.33":"<div class=\"scene\">\n<p>一家保险公司想要一个比普通债券收益更高的投资。银行给它设计了一个 10 年期票据：“只要 3 个月利率每天都在 0% 到 4% 之间，你每天都能拿到 5% 的年化利息；哪一天超出这个区间，那一天就没有利息。”这是一个<strong>区间累计（range accrual）<\/strong>产品，属于利率奇异产品。<\/p>\n<\/div>\n\n<h2>几种常见的利率奇异产品<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>产品<\/th><th>特点<\/th><\/tr>\n<tr><td>CMS 产品<\/td><td>票息挂钩某个期限的互换利率（比如 10 年期），而不是短期利率。CMS 价差产品挂钩两个期限之差，押注曲线形状<\/td><\/tr>\n<tr><td>区间累计（range accrual）<\/td><td>参考利率在区间内的天数越多，利息越多<\/td><\/tr>\n<tr><td>目标赎回票据（TARN）<\/td><td>累计利息达到目标就提前终止，期限不确定<\/td><\/tr>\n<tr><td>雪球（snowball）<\/td><td>每期票息 = 上期票息 + 固定数 − 参考利率，票息会累积变化<\/td><\/tr>\n<tr><td>反向浮动（inverse floater）<\/td><td>利率越高，票息越低<\/td><\/tr>\n<tr><td>可赎回结构（callable）<\/td><td>银行可以提前赎回，几乎所有上述产品都附带这个权利<\/td><\/tr>\n<\/table><\/div>\n\n<h2>为什么投资者会买<\/h2>\n<p>在低利率环境里，投资者想要更高的票息。这些产品之所以能提供高票息，是因为投资者卖出了某种期权：比如押注利率维持在区间内、曲线不会倒挂、利率不会大涨，同时让银行拥有提前赎回的权利。收益来自承担风险。<\/p>\n\n<h2>为什么银行难管<\/h2>\n<ul>\n<li>价格依赖整条曲线、波动率立方的远期限和远价外部分，以及不同期限利率之间的相关性。<\/li>\n<li>可赎回结构让产品成为百慕大式期权，需要复杂的利率模型。<\/li>\n<li>大量类似产品让银行累积同方向的风险，比如对曲线形状或相关性的单边敞口，难以在市场上对冲。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>利率奇异台的风险报告除了 DV01 和 Vega 矩阵，还会列出对 CMS 凸性、利率相关性、均值回归等模型参数的敏感度。模型验证特别关注这类产品，因为不同模型的价差可能很大。银行之间也常常发现彼此“站在同一边”，市场变化时一起调整对冲，推动利率曲线的某一段异常变动。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2000 年代中期，意大利、西班牙等地的很多地方政府买入了与利率挂钩的复杂互换和结构性产品，希望降低融资成本。利率和曲线形状朝不利方向变化后，这些合约出现大额亏损，部分地方政府起诉银行未充分披露风险，一些案件以银行赔偿或和解告终。复杂利率产品的销售对象和适当性，此后受到更严格的监管。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>利率奇异产品包括 CMS、区间累计、TARN、雪球、反向浮动等，常附带可赎回条款。<\/li>\n<li>投资者获得高票息，是因为卖出了对利率水平、区间或曲线形状的期权。<\/li>\n<li>银行面临相关性、波动率立方和模型风险，且容易累积同方向敞口。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个区间累计票据，区间是 0% 到 3%。如果央行开始快速加息，投资者和发行银行分别会怎样？<\/summary>\n<div><p>投资者的利息会大幅减少：参考利率一超过 3%，那一天就没有利息，票据实际上变成了一只低息或零息的长期债券，价格也会因利率上升而下跌。发行银行支付的利息减少，而且通常不会行使赎回权（因为产品对它变得便宜了），投资者被困在里面。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-23\"><\/a><\/li>\n<li><a href=\"#L16-27\"><\/a><\/li>\n<li><a href=\"#L16-43\"><\/a><\/li>\n<li><a href=\"#L16-46\"><\/a><\/li>\n<\/ul><\/div>\n","16.34":"<div class=\"scene\">\n<p>一个对冲基金经理认为：市场接下来三个月会比现在预期的更动荡，但他不知道是涨还是跌。买期权可以表达这个观点，但期权的盈亏还受股价方向影响，需要不停做 Delta 对冲。有没有更直接的工具，只赌“波动有多大”？有，这就是<strong>方差互换（variance swap）<\/strong>。<\/p>\n<\/div>\n\n<h2>方差互换：直接交易波动<\/h2>\n<p>方差互换在到期时交换：<\/p>\n<ul>\n<li>实际发生的方差（realized variance）：用这段时间每天的实际涨跌算出来。<\/li>\n<li>约定的方差水平（variance strike）：签约时定下，大致对应当时的隐含波动率。<\/li>\n<\/ul>\n<p>买方（做多波动）在实际波动高于约定水平时赚钱。它的盈亏只取决于波动的大小，和标的涨跌方向无关，也不需要 Delta 对冲。方差是波动率的平方，所以大幅波动时，买方的收益增长得比波动率本身更快。<\/p>\n<p>还有波动率互换（volatility swap），直接按波动率结算，收益线性，但定价和对冲更难，交易量较少。<\/p>\n\n<h2>谁在用<\/h2>\n<ul>\n<li>对冲基金：交易实际波动和隐含波动之间的差异。<\/li>\n<li>养老金和资管：用做空方差赚取“波动率风险溢价”（隐含通常高于实际）。<\/li>\n<li>银行：对冲结构性产品带来的波动率风险。<\/li>\n<\/ul>\n\n<h2>做空方差的风险<\/h2>\n<p>因为隐含波动率平均高于实际波动率，长期做空方差平时能赚钱。但方差是平方：一次大崩盘，实际波动暴增，做空方的损失会成倍放大，可能把多年的收益一次吞没。所以方差互换的卖方通常会设上限（cap），比如实际波动最多按约定水平的 2.5 倍计算。<\/p>\n\n<div class=\"desk\">\n<p>方差互换的风险报告看的是 Vega 和“方差 Vega”（每单位方差的敏感度），以及大幅波动情景下的损益。交易商用一篮子不同执行价的期权来复制和对冲方差互换，所以它的定价依赖整个波动率偏斜，而不仅是平值波动率。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机期间，股票指数的实际波动率暴涨到 80% 以上，远远超过之前约定的方差水平。很多卖出方差互换的对冲基金和机构损失惨重，一些交易商也因此缩减了单一股票方差互换的业务。此后，带上限的方差互换成为市场标准，卖方的最大损失被限制在一定范围内。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>方差互换交换实际方差和约定方差，只赌波动大小，不需要 Delta 对冲。<\/li>\n<li>方差是波动率的平方，大幅波动时买方收益放大、卖方损失放大。<\/li>\n<li>做空方差平时赚取波动率风险溢价，危机时损失巨大，所以常设上限。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一笔方差互换的约定波动率是 20%（方差 400）。到期时实际波动率是 30%（方差 900）。买方赚的是 10 个波动率点的钱，还是更多？<\/summary>\n<div><p>按方差结算，差额是 900 − 400 = 500 个方差点，比按波动率算的“10 个点”放大得多。如果名义金额按方差点计算，买方的收益会显著高于同等规模的波动率互换。这就是方差互换“凸性”的体现：大幅波动时买方受益更多。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-19\"><\/a><\/li>\n<li><a href=\"#L16-20\"><\/a><\/li>\n<li><a href=\"#L16-35\"><\/a><\/li>\n<\/ul><\/div>\n","16.35":"<div class=\"scene\">\n<p>标普 500 指数的隐含波动率是 18%，而指数里的 500 只股票，平均每只的隐含波动率是 30%。为什么指数的波动比单只股票小这么多？因为股票之间不完全同步：有的涨、有的跌，互相抵消。抵消得多少，取决于股票之间的<strong>相关性（correlation）<\/strong>。交易这个相关性，就是相关性交易。<\/p>\n<\/div>\n\n<h2>指数波动、个股波动和相关性<\/h2>\n<p>指数的波动率大约由两个因素决定：成分股各自的波动率，以及它们之间的平均相关性。如果所有股票完全同步（相关性为 1），指数波动率就等于个股的加权平均波动率；相关性越低，指数波动率越小。<\/p>\n<p>所以，从指数期权和个股期权的隐含波动率，可以反推出市场隐含的平均相关性（implied correlation）。CBOE 就编制了标普 500 的隐含相关性指数。<\/p>\n\n<h2>离散交易：卖指数波动、买个股波动<\/h2>\n<p>离散交易（dispersion trade）的典型做法是：<\/p>\n<ul>\n<li>卖出指数的期权（或方差互换）。<\/li>\n<li>买入成分股的期权（或方差互换）。<\/li>\n<\/ul>\n<p>如果股票之间的实际相关性低于隐含相关性，个股各自大幅波动、指数却比较平稳，这笔交易就赚钱。因为指数期权常被大量买来做下跌保护，隐含相关性通常偏高，做空相关性长期来看有正收益。<\/p>\n\n<h2>风险：危机中相关性会飙升<\/h2>\n<p>市场恐慌时，所有股票一起下跌，相关性迅速接近 1，指数波动暴增。做空相关性的离散交易会在这时遭受大额损失。这和做空波动率一样，是“平时赚小钱、危机亏大钱”的结构。<\/p>\n\n<div class=\"desk\">\n<p>银行的股票衍生品台常常天然累积相关性敞口：大量卖出的多资产结构性产品（比如“最差表现”自动赎回产品）让银行成为相关性的多头或空头。离散交易是管理这类敞口的工具之一。风险报告会单独列出对相关性的敏感度，并在危机情景下假设相关性大幅上升。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月疫情冲击时，美国股市几乎所有股票同步大跌，隐含相关性指数和实际相关性都升到了历史高位。卖出指数波动、买入个股波动的离散交易出现明显亏损。2023 年至 2024 年，少数大型科技股主导市场涨跌，个股之间的走势分化很大，指数波动率相对偏低，离散交易又表现较好。相关性本身会随着市场结构变化。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>指数波动率取决于成分股波动率和它们之间的相关性，可以反推出隐含相关性。<\/li>\n<li>离散交易卖指数波动、买个股波动，押注实际相关性低于隐含相关性。<\/li>\n<li>危机中相关性会急升，做空相关性的交易会遭受大额损失。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行卖出了大量“三只股票中表现最差的那只”挂钩的自动赎回产品。它对三只股票之间的相关性是多头还是空头？<\/summary>\n<div><p>先看最简单的结构：投资者拿高票息，代价是承担“三只里最差那只”的下跌风险，相当于把一个“最差表现看跌期权”卖给了银行。相关性越低，三只股票越可能分化，最差那只越差，这个看跌期权就越值钱。银行持有它，所以相关性下降时银行受益、相关性上升时银行受损，也就是对相关性做空。实际产品还有自动赎回、敲入等条款，方向和大小要用模型逐一计算，银行会把这类敞口汇总后用离散交易等工具管理。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-34\"><\/a><\/li>\n<li><a href=\"#L16-29\"><\/a><\/li>\n<li><a href=\"#L24-28\"><\/a><\/li>\n<\/ul><\/div>\n","16.36":"<div class=\"scene\">\n<p>一家欧洲银行发行了大量与欧洲斯托克 50 指数挂钩的结构性产品。为了对冲，它持有指数成分股。产品的价值不包括分红，而银行持有的股票会收到分红。结果，银行实际上押注了未来的分红水平：分红比预期高，它赚钱；分红被削减，它亏钱。为了把这个风险卖出去，市场上有了专门交易分红的工具：<strong>股息衍生品（dividend derivatives）<\/strong>。<\/p>\n<\/div>\n\n<h2>股息期货和股息互换<\/h2>\n<ul>\n<li><strong>股息期货（dividend futures）<\/strong>：在交易所交易，标的是某个指数（比如欧洲斯托克 50、日经 225、标普 500）在某一年里成分股支付的分红总额。到期时按当年实际分红结算。<\/li>\n<li><strong>股息互换（dividend swap）<\/strong>：场外交易，一方支付固定的分红金额，另一方支付实际分红。<\/li>\n<\/ul>\n<p>它们把“未来分红”从股票里单独拿出来，可以单独买卖。<\/p>\n\n<h2>谁在两边<\/h2>\n<ul>\n<li><strong>卖方（卖出未来分红）<\/strong>：主要是发行结构性产品的银行。它们在对冲中天然持有分红多头，需要卖出去。<\/li>\n<li><strong>买方<\/strong>：养老金、保险公司、对冲基金。它们认为市场定价的分红偏低，或者想获得和分红挂钩的、相对稳定的收益。<\/li>\n<\/ul>\n<p>因为银行的卖出需求持续存在，长期限的分红往往被定价得偏低，这是买方的主要收益来源。<\/p>\n\n<h2>风险<\/h2>\n<p>分红比股价稳定，但在危机中可能被大幅削减：公司为了保存现金，或者被监管要求停止分红。股息衍生品的价格会在这种时候大跌。<\/p>\n\n<div class=\"desk\">\n<p>股票衍生品台的风险报告里会单独列出“分红敏感度”：预期分红变动 1% 时的损益，并按年份分桶。远期分红的不确定性是长期结构性产品的重要风险之一。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月至 4 月，欧洲央行和英格兰银行要求银行暂停分红，许多公司也削减或取消分红。欧洲斯托克 50 指数当年的股息期货价格从年初的约 120 多点跌到 70 点上下，跌幅远超指数本身。持有分红多头的投资者损失惨重，而银行由于原本卖出了分红，在这一轮中部分受益。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>股息期货和股息互换把未来的分红单独拿出来交易，常以指数为标的。<\/li>\n<li>发行结构性产品的银行是天然卖方，长期分红常被低估，买方以此获利。<\/li>\n<li>危机中分红可能被大幅削减，股息衍生品的跌幅可能远超股价。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么银行发行结构性产品后，会持有“分红多头”？<\/summary>\n<div><p>结构性产品通常挂钩指数的价格表现，不包括分红。银行为了对冲产品，会持有指数成分股（或等价的仓位），这些股票会收到分红，而产品不需要把分红付给投资者。所以分红越多，银行越赚；分红越少，银行越亏。银行就成了分红的多头，需要通过卖出股息衍生品来对冲。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-29\"><\/a><\/li>\n<li><a href=\"#L16-2\"><\/a><\/li>\n<li><a href=\"#L13-17\"><\/a><\/li>\n<\/ul><\/div>\n","16.37":"<div class=\"scene\">\n<p>一个信用指数包含 125 家公司。有的投资者只想承担“最先违约的几家”带来的损失，换取很高的收益；有的只想承担“除非一大半公司都违约才会亏”的风险，收益很低但非常安全。把同一篮子信用风险按损失顺序切开，分给不同的人，这就是<strong>信用分层（tranching）<\/strong>。<\/p>\n<\/div>\n\n<h2>分层：按损失顺序切开<\/h2>\n<p>以一篮子信用为基础，损失按顺序分配给不同的层（tranche）：<\/p>\n<ul>\n<li><strong>权益层（equity tranche）<\/strong>：比如 0–3%，最先承担损失。篮子里前 3% 的损失全部由它承担，风险最高、收益最高。<\/li>\n<li><strong>夹层（mezzanine tranche）<\/strong>：比如 3–7%，损失超过 3% 后开始承担。<\/li>\n<li><strong>高级层（senior tranche）<\/strong>：比如 15–100%，只有损失非常大时才受影响，风险最低。<\/li>\n<\/ul>\n<p>以 CDS 篮子为基础的分层叫合成 CDO（synthetic CDO）；以信用指数（CDX、iTraxx）为基础、条款标准化的，叫指数分层（index tranches）。<\/p>\n\n<h2>相关性决定各层的价值<\/h2>\n<p>各层风险的大小，关键取决于违约之间的相关性：<\/p>\n<ul>\n<li>相关性低：违约是零散的，几乎每年都有几家，权益层很可能被吃掉，高级层很安全。<\/li>\n<li>相关性高：要么大家都没事，要么一起出事。权益层反而有机会毫发无损，高级层则面临“一起出事”的风险。<\/li>\n<\/ul>\n<p>所以权益层是相关性的多头（相关性上升时价值上升），高级层是相关性的空头。市场用一种叫“基础相关性”（base correlation）的方式报价和定价。<\/p>\n\n<h2>信用联结票据：把信用风险装进债券<\/h2>\n<p>信用联结票据（credit linked note，CLN）是一只债券，内嵌了一份 CDS：投资者买入票据，获得高于普通债券的票息；如果参考实体发生信用事件，票据本金按损失减记。对发行银行来说，CLN 是把信用风险卖给投资者、并提前收到现金的方式；银行也常用 CLN 做重大风险转移（SRT），转出贷款组合的部分信用风险。<\/p>\n\n<div class=\"desk\">\n<p>信用分层的风险报告需要单独列出相关性敏感度，以及每一层对单个公司违约（JTD）和整体利差（CS01）的敏感度。各层的这些敏感度和指数本身差别很大：权益层对单一违约极其敏感，高级层对整体利差和相关性更敏感。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年金融危机中，很多以抵押贷款相关证券为基础的 CDO 高级层，原本被评为 AAA，被认为几乎没有风险。房价全国性下跌后，违约高度相关，损失大到穿透了下面所有的层，部分高级层也遭受了重大损失。持有这些高级层的银行和保险公司（例如通过 CDS 为它们提供保护的 AIG）损失惨重。这是“低估相关性”带来的系统性教训。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>信用分层把一篮子信用风险按损失顺序切开：权益层先亏，高级层最后亏。<\/li>\n<li>违约相关性决定各层价值：权益层是相关性多头，高级层是相关性空头。<\/li>\n<li>CLN 把 CDS 嵌入债券，银行用它出售信用风险，也用于重大风险转移。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>市场突然担心经济衰退会导致很多公司同时违约（相关性上升）。指数的权益层和高级层分别会怎样？<\/summary>\n<div><p>整体违约风险上升，各层都会受到利差走阔的冲击。但相关性上升本身，对权益层相对有利（损失更可能集中在“都没事”或“一起出事”两种情况），对高级层不利（一起出事时损失会穿透到高级层）。所以高级层的利差往往走阔得相对更多，2008 年就是这样。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-25\"><\/a><\/li>\n<li><a href=\"#L11-12\"><\/a><\/li>\n<li><a href=\"#L11-22\"><\/a><\/li>\n<\/ul><\/div>\n","16.38":"<div class=\"scene\">\n<p>一家滑雪场最怕暖冬：雪少，客人就少。一家电力公司最怕夏天突然一周高温：用电量飙升，现货电价可能涨几十倍。一家航运公司担心运费暴跌。这些风险和股票、利率无关，却真实影响着企业的利润。它们也有自己的衍生品：<strong>天气、运费和电力衍生品<\/strong>。<\/p>\n<\/div>\n\n<h2>天气衍生品<\/h2>\n<p>天气衍生品的标的不是价格，而是天气指标，最常见的是温度：<\/p>\n<ul>\n<li><strong>采暖度日（HDD）<\/strong>：每天平均气温低于 18°C（65°F）的度数累计，衡量冬天有多冷。<\/li>\n<li><strong>制冷度日（CDD）<\/strong>：高于这个温度的度数累计，衡量夏天有多热。<\/li>\n<\/ul>\n<p>能源公司、农业、零售、旅游业用它对冲天气对销量的影响。芝加哥商品交易所（CME）有挂钩多个城市温度的天气期货和期权，还有降雨、降雪等场外产品。<\/p>\n\n<h2>运费衍生品<\/h2>\n<p>运费远期协议（forward freight agreement，FFA）是对未来航运运费的约定，标的是波罗的海交易所（Baltic Exchange）公布的航线运费指数，比如干散货的波罗的海指数。船东卖出 FFA 锁定未来收入，货主买入锁定运输成本。运费波动极大，FFA 是这个行业重要的风险管理工具。<\/p>\n\n<h2>电力衍生品<\/h2>\n<p>电力有一个和其他商品完全不同的特点：几乎无法储存，发出来就要用掉。所以现货电价可能在几小时内暴涨或暴跌，甚至出现负电价（风电、光伏发电过多时）。电力期货和远期通常按交付的时段（基荷、峰荷）和地区交易，欧洲的 EEX、北欧的 Nord Pool 是主要市场。<\/p>\n\n<div class=\"desk\">\n<p>这些衍生品的风险管理有一些特殊挑战：标的难以对冲（天气无法“持有”），价格分布有极端尖峰，模型需要考虑季节性和地域性，流动性也较差。银行和交易公司常常需要用情景分析和极端值测试，而不是简单的正态假设来衡量风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年 2 月，美国得克萨斯州遭遇罕见寒潮，大量发电设施停运，而用电需求激增。得州电力市场的批发电价在几天内被推到每兆瓦时 9,000 美元的上限，持续了数十个小时，而平时只有几十美元。一些电力零售商和交易者因无法履行合约或承受巨额成本而破产，其中包括当地一家大型电力合作社。这一事件展示了电力和天气风险的极端尾部。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>天气衍生品以温度等天气指标为标的，常用采暖度日和制冷度日。<\/li>\n<li>运费远期协议（FFA）以波罗的海运费指数为标的，帮助船东和货主锁定运费。<\/li>\n<li>电力几乎无法储存，价格可能出现极端尖峰甚至负值，风险管理要重视尾部。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家燃气公司的销量和冬天的寒冷程度高度相关。暖冬会让它的利润大减。它可以怎样用天气衍生品对冲？<\/summary>\n<div><p>买入一个基于采暖度日（HDD）的看跌期权或卖出 HDD 期货：如果冬天比预期暖、HDD 偏低，衍生品赔付，弥补销量减少带来的损失；如果冬天很冷，销量好，衍生品的损失由更高的利润覆盖。这样它的利润对天气变得不那么敏感。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L18-10\"><\/a><\/li>\n<li><a href=\"#L18-14\"><\/a><\/li>\n<li><a href=\"#L16-2\"><\/a><\/li>\n<\/ul><\/div>\n","16.39":"<div class=\"scene\">\n<p>一个投资者买了一只“3 倍做多纳斯达克 100”的 ETF。指数一年涨了 20%，他以为自己能赚 60%。结果一年下来，他只赚了 30% 多一点。另一年，指数先跌后涨、最终持平，他的 ETF 却亏了 20%。这不是 ETF 出了问题，而是<strong>杠杆和反向 ETF（leveraged and inverse ETFs）<\/strong>的结构决定的。<\/p>\n<\/div>\n\n<h2>每天重新设定杠杆<\/h2>\n<p>杠杆 ETF 的目标是：每天提供标的指数当天收益的固定倍数，比如 2 倍或 3 倍；反向 ETF 提供 −1 倍、−2 倍或 −3 倍。注意关键词：<strong>每天<\/strong>。为了实现这个目标，基金每天收盘前都要调整仓位：<\/p>\n<ul>\n<li>指数涨了，基金资产增加，要买入更多来维持杠杆。<\/li>\n<li>指数跌了，基金资产减少，要卖出来维持杠杆。<\/li>\n<\/ul>\n<p>这就是“追涨杀跌”，和卖出期权的 Gamma 空头类似。<\/p>\n\n<h2>长期持有为什么会偏离<\/h2>\n<p>因为每天复利，长期收益不等于“指数收益 × 倍数”：<\/p>\n<ul>\n<li>单边趋势市：复利效应可能让收益超过倍数。<\/li>\n<li>来回震荡市：每次下跌后的上涨都是在更小的基数上，资产会持续损耗，叫波动率损耗（volatility decay）。<\/li>\n<\/ul>\n<p>波动越大、持有越久，偏离越明显。所以这类产品主要适合短期交易，而不是长期持有。<\/p>\n\n<h2>对市场的影响<\/h2>\n<p>杠杆 ETF 的再平衡集中在每天收盘前进行，方向和当天的市场涨跌一致：大涨的日子要买，大跌的日子要卖。规模足够大时，可能在收盘前放大当天的走势。<\/p>\n\n<div class=\"desk\">\n<p>交易商和做市商要关注杠杆 ETF 在收盘时的再平衡需求，提前估算方向和规模。风控评估散户产品时，也会关注这类产品的规模和集中度，尤其是挂钩单只股票的杠杆 ETF，近年数量增长很快，波动和损耗都更大。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2018 年 2 月 5 日“波动率末日”中，反向 VIX 产品 XIV 一天内暴跌九成以上并被终止。另一个例子是 2020 年 3 月，部分 3 倍杠杆的原油和股票 ETF 在几天内跌去了绝大部分价值，一些产品被迫清盘或调整杠杆。这些产品在短时间内的极端下跌，提醒投资者：杠杆产品的风险远不止“倍数”。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>杠杆和反向 ETF 每天重新设定杠杆，目标是当天收益的固定倍数。<\/li>\n<li>长期收益不等于指数收益乘倍数，震荡市中会因波动率损耗而持续缩水。<\/li>\n<li>收盘前的再平衡方向和市场一致，规模大时会放大当天走势。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>指数第一天涨 10%，第二天跌 10%。一只 2 倍杠杆 ETF 两天后是什么结果？<\/summary>\n<div><p>指数：100 → 110 → 99，跌了 1%。2 倍杠杆 ETF：100 → 120（涨 20%）→ 96（跌 20%），跌了 4%，远多于“指数跌幅 × 2 = 2%”。这就是波动率损耗。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-30\"><\/a><\/li>\n<li><a href=\"#L16-20\"><\/a><\/li>\n<li><a href=\"#L19-3\"><\/a><\/li>\n<\/ul><\/div>\n","16.40":"<div class=\"scene\">\n<p>你认为一只股票明年有 70% 的可能上涨。但在给它的期权定价时，模型并不使用你认为的 70%，甚至不使用任何人真实相信的概率。它使用的是一种“假想”的概率，叫<strong>风险中性概率（risk-neutral probability）<\/strong>。这听起来很奇怪，却是衍生品定价最核心的思想。<\/p>\n<\/div>\n\n<h2>为什么不用真实概率<\/h2>\n<p>在真实世界里，投资者讨厌风险，持有股票会要求一个高于无风险利率的预期回报（风险溢价）。如果用真实概率给期权定价，还得知道每个人对风险的厌恶程度，几乎不可能做到。<\/p>\n<p>但我们知道一件事：期权可以用标的和借贷复制。复制的成本，和投资者是否厌恶风险、怎么看涨跌都无关。所以，期权的价格只取决于复制成本。<\/p>\n\n<h2>风险中性：一个方便计算的世界<\/h2>\n<p>既然价格和风险偏好无关，就可以假设一个“所有人都不在乎风险”的世界来计算：在这个世界里，所有资产的预期回报都等于无风险利率。在这个假想世界里算出期权的预期收益，再用无风险利率折现，得到的价格和复制成本完全一致。<\/p>\n<p>这个假想世界里的概率，就是风险中性概率，学术上叫 Q 测度；真实世界的概率叫 P 测度。<\/p>\n\n<h2>两种概率，两种用途<\/h2>\n<div class=\"tbl\"><table>\n<tr><th><\/th><th>风险中性（Q）<\/th><th>真实世界（P）<\/th><\/tr>\n<tr><td>用途<\/td><td>给衍生品定价<\/td><td>估计真实的损失和收益<\/td><\/tr>\n<tr><td>来源<\/td><td>从市场价格中推出<\/td><td>从历史数据和判断中估计<\/td><\/tr>\n<tr><td>典型使用者<\/td><td>交易台、估值<\/td><td>风控（VaR、压力测试）、投资决策、信用拨备<\/td><\/tr>\n<\/table><\/div>\n<p>例如，从 CDS 价格推出的违约概率是风险中性的，通常高于历史上实际发生的违约率；用它来估计真实损失会高估，用历史违约率来给 CDS 定价则会低估价格。<\/p>\n\n<div class=\"desk\">\n<p>交易台的估值和敏感度（Greeks）都基于风险中性模型；风控的 VaR 和压力测试则关心真实世界中市场会怎么动。两者用的模型和参数不同，但在报告中经常放在一起。风险分析师需要清楚每个数字背后是哪一种概率。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1973 年，布莱克、斯科尔斯和默顿的期权定价理论，核心就是“用复制消除风险偏好”。1997 年，斯科尔斯和默顿因此获得诺贝尔经济学奖（布莱克已于 1995 年去世）。风险中性定价让衍生品市场有了统一的定价语言，也让银行可以对几乎任何可以对冲的风险定价。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>衍生品的价格等于复制成本，和投资者的风险偏好、对方向的看法无关。<\/li>\n<li>因此可以在假想的风险中性世界里计算：所有资产预期回报都等于无风险利率。<\/li>\n<li>定价用风险中性概率（Q），估计真实损失用真实概率（P），两者不能混用。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个看涨期权的价格隐含了股价明年上涨超过 20% 的概率是 25%。这是否意味着市场“认为”股价有 25% 的可能涨这么多？<\/summary>\n<div><p>不完全是。这是风险中性概率，包含了风险溢价的影响，不等于市场参与者真实相信的概率。真实概率可能更高或更低。期权价格可以告诉你“市场为这种结果付出了多少”，但不能直接当作对未来的预测。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-14\"><\/a><\/li>\n<li><a href=\"#L16-41\"><\/a><\/li>\n<li><a href=\"#L9-47\"><\/a><\/li>\n<\/ul><\/div>\n","16.41":"<div class=\"scene\">\n<p>想象股价每一步只能做两件事：涨一点，或者跌一点。走一步，有两种可能；走两步，有三种可能；走一百步，就是一张巨大的“树”。在这棵树的每一个末端，算出期权值多少，再一步一步往回推，就能得到期权今天的价格。这就是<strong>二叉树模型（binomial tree）<\/strong>，期权定价最直观的方法。<\/p>\n<\/div>\n\n<h2>二叉树：一步一步往回算<\/h2>\n<ol>\n<li><strong>画树<\/strong>：从今天的股价出发，每一步按一定幅度上涨或下跌，幅度由波动率决定。<\/li>\n<li><strong>算末端<\/strong>：到期时，每个节点上期权的价值很简单：看涨期权就是“股价减执行价”与零的较大者。<\/li>\n<li><strong>往回推<\/strong>：每个节点的价值 = 下一步两种情况价值的风险中性加权平均，再用无风险利率折现一步。<\/li>\n<li><strong>处理提前行权<\/strong>：如果是美式期权，在每个节点比较“继续持有”和“立即行权”的价值，取较大者。<\/li>\n<\/ol>\n<p>步数越多，结果越精确。二叉树的优点是直观，能处理美式期权和简单的路径条件。<\/p>\n\n<h2>Black-Scholes：步数无限多的极限<\/h2>\n<p>当二叉树的步数趋向无限、每一步变得无限小，股价的变动就变成连续的随机过程（几何布朗运动）。在这个假设下，欧式期权有一个精确的公式，就是 Black-Scholes 公式。它只需要五个输入：股价、执行价、到期时间、无风险利率、波动率。<\/p>\n<p>它的关键假设包括：波动率恒定、价格连续变动没有跳跃、可以随时无成本地交易和对冲。这些假设在现实中都不完全成立，这正是波动率微笑和偏斜存在的原因。<\/p>\n\n<h2>今天怎么用<\/h2>\n<ul>\n<li>Black-Scholes 主要被当作“报价语言”：市场用它把期权价格换算成隐含波动率。<\/li>\n<li>二叉树和它的扩展（三叉树）用于美式期权、可赎回债券等需要处理提前行权的产品。<\/li>\n<li>更复杂的产品用局部波动率、随机波动率模型和蒙特卡洛模拟。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>风险系统里，大多数普通期权的 Greeks 都是用 Black-Scholes 类公式（或它在利率、外汇上的变体，如 Black 模型、Garman-Kohlhagen 模型）计算的。模型验证要检查：输入数据是否正确，公式的适用条件是否满足，比如美式期权是否被错误地用欧式公式估值。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>二叉树模型由考克斯、罗斯和鲁宾斯坦在 1979 年系统提出，比 Black-Scholes 公式晚六年。它的价值在于让人不用高深数学也能理解期权定价：每一步都是简单的复制和无套利。直到今天，很多大学和交易员培训仍从二叉树讲起，再过渡到 Black-Scholes。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>二叉树把股价变动简化为每步涨跌，从到期往回推算期权价格，能处理美式期权。<\/li>\n<li>步数无限时得到 Black-Scholes 公式，适用于欧式期权，但假设波动率恒定、价格连续。<\/li>\n<li>今天 Black-Scholes 多被当作把价格换算成隐含波动率的报价语言。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>Black-Scholes 假设波动率恒定。如果这个假设成立，不同执行价的期权，隐含波动率应该是什么样？现实中为什么不是这样？<\/summary>\n<div><p>如果假设成立，所有执行价的隐含波动率应该相同，曲线是平的。现实中存在偏斜和微笑，因为真实市场里波动率会变化、价格会跳跃、大跌比正态分布预期的更常见，投资者愿意为价外保护多付钱。隐含波动率曲线的形状，就是市场对模型假设的“修正”。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-40\"><\/a><\/li>\n<li><a href=\"#L16-42\"><\/a><\/li>\n<li><a href=\"#L16-45\"><\/a><\/li>\n<\/ul><\/div>\n","16.42":"<div class=\"scene\">\n<p>Black-Scholes 假设波动率是一个固定的数。但交易员每天看到的是一整张波动率曲面：不同执行价、不同期限，隐含波动率都不一样，而且每天都在变。要给一个障碍期权或自动赎回产品定价，模型必须同时符合整张曲面，还要合理描述“波动率本身怎么变”。这就是<strong>局部波动率（local volatility）<\/strong>和<strong>随机波动率（stochastic volatility）<\/strong>模型要解决的问题。<\/p>\n<\/div>\n\n<h2>局部波动率：让波动率取决于价格和时间<\/h2>\n<p>局部波动率模型的思路是：波动率不是常数，而是“当时的股价”和“当时的时间”的函数。股价跌到某个位置时，波动率就变成某个值。杜皮尔（Dupire）在 1994 年证明，只要有一张完整、无套利的期权价格曲面，就能唯一地推出这张“局部波动率表”。<\/p>\n<ul>\n<li><strong>优点<\/strong>：能完全复现今天市场上所有普通期权的价格。<\/li>\n<li><strong>缺点<\/strong>：它对“未来的曲面会怎样变化”的描述不太符合现实。比如它预测的未来偏斜会变得比实际平坦，这会影响依赖未来偏斜的产品（如远期起始期权、某些障碍期权）的定价。<\/li>\n<\/ul>\n\n<h2>随机波动率：让波动率自己也随机变动<\/h2>\n<p>随机波动率模型认为波动率本身是一个随机变量，有自己的走势，并且和价格相关（股价下跌时波动率往往上升）。常见的有：<\/p>\n<ul>\n<li><strong>Heston 模型<\/strong>：波动率会向长期水平回归，常用于股票和外汇。<\/li>\n<li><strong>SABR 模型<\/strong>：利率期权市场的标准，用几个参数描述某个期限的整条微笑，交易员常用它做插值和报价。<\/li>\n<\/ul>\n<p>随机波动率模型对未来曲面的变化描述更真实，但很难精确拟合今天整张曲面。<\/p>\n\n<h2>两者结合：局部随机波动率<\/h2>\n<p>实务中常用局部随机波动率模型（LSV），把两者结合：用随机波动率部分描述动态，用局部波动率部分修正，确保拟合今天的价格。很多银行用它给外汇和股票的奇异期权定价。<\/p>\n\n<div class=\"desk\">\n<p>同一个奇异期权，用局部波动率和随机波动率模型定价，结果可能差很多。这种差别就是模型风险。银行通常会计算不同模型之间的差异，计提模型储备（model reserve），并在产品审批时规定使用哪种模型。不同模型算出的 Vega 也不同，交易台还会单独监控 Vanna（Delta 对波动率的敏感度）和 Volga（Vega 对波动率的敏感度）这类二阶风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1987 年 10 月的股灾之后，股票期权市场出现了明显而持久的偏斜：价外看跌期权的隐含波动率明显高于平值期权。在此之前，曲面相对平坦，Black-Scholes 的“波动率恒定”看起来问题不大。偏斜的出现，推动了 1990 年代局部波动率（Dupire、Derman-Kani）和随机波动率（Heston 1993）模型的发展。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>局部波动率让波动率取决于价格和时间，能完全拟合今天的期权价格，但对未来曲面的描述不够真实。<\/li>\n<li>随机波动率让波动率自己随机变动，动态更真实，常见的有 Heston 和 SABR。<\/li>\n<li>实务常把两者结合（LSV），不同模型的定价差异是模型风险的重要来源。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两个模型都能完美拟合今天所有普通期权的价格，为什么给同一个障碍期权定价时还会不同？<\/summary>\n<div><p>普通期权只取决于到期时价格的分布，而障碍期权取决于价格走过的路径，也取决于未来某个时刻的波动率曲面。两个模型对“到期分布”的描述可以相同，但对“路径”和“未来曲面怎样变”的描述不同，所以对路径依赖产品的定价会不同。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-27\"><\/a><\/li>\n<li><a href=\"#L16-31\"><\/a><\/li>\n<li><a href=\"#L24-10\"><\/a><\/li>\n<\/ul><\/div>\n","16.43":"<div class=\"scene\">\n<p>股票期权只需要描述一个价格怎么动。利率衍生品要麻烦得多：利率不是一个数，而是一整条收益率曲线，从隔夜到 30 年。一个 10 年期的可赎回互换，价值取决于未来每一年这条曲线可能的形状。描述“整条曲线怎样随机变动”的模型，就是<strong>利率模型（interest rate models）<\/strong>。<\/p>\n<\/div>\n\n<h2>短利率模型：从一个利率出发<\/h2>\n<p>短利率模型（short-rate models）只描述一个变量：极短期的利率（瞬时利率）。只要知道它未来所有可能的走势，就能推出所有期限的债券价格和整条曲线。<\/p>\n<ul>\n<li><strong>Vasicek<\/strong>：利率围绕一个长期水平波动并向它回归，但可能出现负利率。<\/li>\n<li><strong>CIR<\/strong>：类似，但保证利率为正。<\/li>\n<li><strong>Hull-White<\/strong>：在 Vasicek 的基础上，让长期水平随时间变化，从而完全拟合今天的收益率曲线。这是银行用得最多的短利率模型之一，常用于百慕大互换期权、可赎回债券和 XVA 计算。<\/li>\n<\/ul>\n<p>短利率模型的局限：单因子模型下，曲线上各期限的利率高度相关，很难描述“短端涨、长端跌”这样的扭曲。可以加更多因子来改善。<\/p>\n\n<h2>LMM：直接描述市场能看到的利率<\/h2>\n<p>LIBOR 市场模型（LIBOR market model，LMM，也叫 BGM 模型）不描述看不见的瞬时利率，而是直接描述市场上报价的远期利率，比如未来每 3 个月或 6 个月一段的远期利率。每段远期利率都有自己的波动率，彼此之间有相关性。<\/p>\n<ul>\n<li><strong>优点<\/strong>：和利率上限、互换期权的市场报价（Black 模型）天然一致，容易校准；能描述曲线的复杂变动。<\/li>\n<li><strong>缺点<\/strong>：变量很多，通常只能用蒙特卡洛计算，速度较慢。<\/li>\n<\/ul>\n<p>LIBOR 退出后，模型改为以 SOFR 等无风险利率为基础的远期利率，思路基本相同。<\/p>\n\n<div class=\"desk\">\n<p>利率模型的校准是日常工作：每天用当天的互换期权和上限价格，调整模型的波动率和均值回归参数。校准选择哪些工具，会影响奇异产品的价格和 Vega。风险报告中，可赎回结构的 Vega 往往按互换期权矩阵（期权期限 × 标的互换期限）列示，这和波动率立方直接相关。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2000 年代中期，欧洲银行向企业和地方政府出售了不少挂钩“10 年期减 2 年期互换利率”的利差产品，例如德意志银行在德国销售的“利差阶梯互换”（spread ladder swap）。2007–2008 年欧元收益率曲线大幅变平，很多客户亏损严重。2011 年德国联邦最高法院在一宗案件中判决银行未充分说明风险，须赔偿客户。这类产品的价值高度依赖不同期限利率之间的相关性，正是单因子模型最难描述的部分。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>利率模型要描述整条收益率曲线怎样随机变动，比股票模型复杂。<\/li>\n<li>短利率模型（如 Hull-White）从瞬时利率出发，简单常用，但单因子难以描述曲线扭曲。<\/li>\n<li>LMM 直接描述市场报价的远期利率，与市场工具一致，但计算较慢。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个产品的收益取决于 10 年期和 2 年期利率之差。用单因子短利率模型给它定价，可能有什么问题？<\/summary>\n<div><p>单因子模型里，所有期限的利率都由同一个随机因子驱动，彼此几乎完全相关，10 年和 2 年利率之差的波动会被严重低估。这样会低估产品中期权部分的价值，定价和对冲都可能出错。这类产品需要多因子模型或明确的相关性参数。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-45\"><\/a><\/li>\n<li><a href=\"#L16-23\"><\/a><\/li>\n<li><a href=\"#L16-33\"><\/a><\/li>\n<\/ul><\/div>\n","16.44":"<div class=\"scene\">\n<p>2007 年以前，给一笔利率互换估值很简单：用一条 LIBOR 曲线，既推算未来的浮动利息，也用它来折现。大家默认“LIBOR 就是无风险利率”。金融危机中，LIBOR 和隔夜利率之间的利差突然从几个基点扩大到几百个基点，这个默认失效了。从此，互换估值进入了<strong>多曲线（multi-curve）<\/strong>时代。<\/p>\n<\/div>\n\n<h2>互换估值的两个步骤<\/h2>\n<p>给一笔利率互换估值，本质上做两件事：<\/p>\n<ol>\n<li><strong>预测（forecasting）<\/strong>：估计未来每一期浮动利率是多少，用远期曲线（forward curve）。<\/li>\n<li><strong>折现（discounting）<\/strong>：把未来每一笔现金流折回今天，用折现曲线（discount curve）。<\/li>\n<\/ol>\n<p>危机前两步用同一条曲线；危机后发现它们应该分开。<\/p>\n\n<h2>为什么要分开<\/h2>\n<ul>\n<li><strong>预测曲线<\/strong>：每个浮动利率指数有自己的曲线。3 个月 LIBOR、6 个月 EURIBOR、隔夜利率的水平不同，因为期限越长，银行间借贷的信用和流动性风险越大。<\/li>\n<li><strong>折现曲线<\/strong>：对有抵押品的交易，现金流的真实资金成本是抵押品所付的利率，通常是隔夜利率。所以要用 OIS 曲线折现，这叫 OIS 折现（OIS discounting）或 CSA 折现。<\/li>\n<\/ul>\n<p>LIBOR 退出后，主要货币的互换已经转为直接参考 SOFR、€STR、SONIA 等隔夜利率，预测和折现在很多情况下又可以用同一类曲线，但不同指数之间、不同抵押品条款之间的区别仍然存在。<\/p>\n\n<h2>抵押品条款影响价值<\/h2>\n<p>同样的互换，如果抵押协议（CSA）允许用不同货币的现金或债券做抵押，抵押品利率不同，折现曲线就不同，价值也会不同。抵押方有选择权时，还会产生“最便宜抵押品”期权（cheapest-to-deliver collateral option）。没有抵押的交易，则需要通过 XVA 反映信用和资金成本。<\/p>\n\n<div class=\"desk\">\n<p>多曲线下，DV01 不再只有一个：风险报告会分别给出对预测曲线和折现曲线的敏感度，以及不同指数之间的基差敏感度（basis risk）。2020 年前后，美元和欧元的清算所先后把折现从 EFFR、EONIA 切换到 SOFR、€STR，导致全市场头寸的估值和 DV01 一次性重算，并通过补偿安排处理价值转移。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年以前，3 个月 LIBOR 与同期限 OIS 的利差通常只有约 10 个基点，几乎可以忽略。2008 年 10 月雷曼破产后，美元这一利差一度超过 350 个基点。这一利差的暴涨让市场意识到：不同期限的浮动利率不能用同一条曲线描述，用 LIBOR 折现有抵押交易也不再合理。几年之内，主要交易商和清算所都改为 OIS 折现。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>互换估值分两步：用远期曲线预测浮动利率，用折现曲线把现金流折回今天。<\/li>\n<li>危机后两者分开：每个浮动指数有自己的预测曲线，有抵押交易用 OIS 曲线折现。<\/li>\n<li>抵押品条款会影响折现曲线和价值，风险报告也要分开预测、折现与基差敏感度。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两家银行对同一笔有抵押互换的估值不同，一家用 OIS 折现，另一家仍用 LIBOR 折现。差别主要在哪里？什么样的交易差别最大？<\/summary>\n<div><p>差别来自折现率不同：LIBOR 高于 OIS，用 LIBOR 折现会让未来现金流的现值更低。互换的价值越偏离零（深度价内或价外）、期限越长，差别越大；对价值接近零的新做平价互换，差别很小。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-7\"><\/a><\/li>\n<li><a href=\"#L9-40\"><\/a><\/li>\n<li><a href=\"#L10-8\"><\/a><\/li>\n<\/ul><\/div>\n","16.45":"<div class=\"scene\">\n<p>有些产品没有现成的公式，也很难用二叉树处理：比如收益取决于三只股票中表现最差那一只、每季度观察是否自动赎回的结构性产品。怎么定价？办法很朴素：让电脑模拟未来市场的几万甚至几十万种可能走势，在每一条路径上算出产品赔付多少，再取平均、折现。这就是<strong>蒙特卡洛定价（Monte Carlo pricing）<\/strong>。<\/p>\n<\/div>\n\n<h2>基本步骤<\/h2>\n<ol>\n<li><strong>选模型<\/strong>：确定标的价格在风险中性世界里怎样随机变动，比如几何布朗运动、局部波动率或随机波动率模型。<\/li>\n<li><strong>生成路径<\/strong>：用随机数模拟大量价格路径，多个标的时还要考虑它们之间的相关性。<\/li>\n<li><strong>算赔付<\/strong>：在每条路径上，按产品条款算出现金流，比如是否触碰障碍、是否提前赎回。<\/li>\n<li><strong>平均并折现<\/strong>：所有路径赔付的平均值，用无风险利率折现，就是价格。<\/li>\n<\/ol>\n\n<h2>优点与难点<\/h2>\n<ul>\n<li><strong>灵活<\/strong>：几乎能处理任何路径依赖、多标的的产品，条款怎么写都能模拟。<\/li>\n<li><strong>慢<\/strong>：误差随路径数的平方根缩小，精度提高 10 倍需要 100 倍的路径。常用方差缩减（variance reduction）技巧提速。<\/li>\n<li><strong>Greeks 不稳定<\/strong>：用“改一点输入、重算一次”的方法算敏感度，随机噪声会被放大，尤其是数字期权、障碍附近。需要用相同随机数或专门的方法（如伴随算法微分，AAD）。<\/li>\n<li><strong>提前行权难<\/strong>：模拟是从今天往未来走，而行权决策要从未来往回推。常用最小二乘蒙特卡洛（Longstaff-Schwartz 方法）估计继续持有的价值。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>蒙特卡洛不只用于定价。风险管理里，XVA、潜在未来敞口（PFE）、经济资本和部分 VaR 计算都靠大规模模拟：模拟未来市场情景，再在每个情景下给整个组合估值。这类计算量非常大，银行投入大量计算资源，AAD 和 GPU 计算已经成为大型银行的标配。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>蒙特卡洛方法起源于 1940 年代美国核武器研究，乌拉姆和冯·诺依曼等人用它模拟中子扩散，名字取自摩纳哥的蒙特卡洛赌场。1977 年，博伊尔（Phelim Boyle）首次把它用于期权定价。2001 年，Longstaff 和 Schwartz 发表最小二乘方法，让蒙特卡洛也能处理美式期权，之后成为业界标准。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>蒙特卡洛定价通过模拟大量风险中性路径、平均赔付再折现，能处理几乎任何复杂产品。<\/li>\n<li>主要难点是速度慢、Greeks 噪声大和提前行权，常用方差缩减、AAD 和 Longstaff-Schwartz 方法。<\/li>\n<li>它也是 XVA、PFE 和经济资本等风险计算的核心工具。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个数字期权用蒙特卡洛定价，每次运行价格都差不多，但 Delta 每次都差很多。为什么？<\/summary>\n<div><p>数字期权的赔付在执行价处是跳跃的：价格稍微高一点就赔，低一点就不赔。用“标的价格改动一点、重算一次”求 Delta 时，只有少数靠近执行价的路径会改变结果，随机噪声在差值中被放大。常见的解决办法是两次计算用同样的随机数、对赔付做平滑处理，或用似然比、AAD 等方法直接计算敏感度。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L24-30\"><\/a><\/li>\n<li><a href=\"#L16-31\"><\/a><\/li>\n<li><a href=\"#L24-38\"><\/a><\/li>\n<\/ul><\/div>\n","16.46":"<div class=\"scene\">\n<p>一个产品每年支付一次“当时的 10 年期互换利率”，但每次只付一年，而不是像真正的 10 年期互换那样连续付 10 年。另一个产品挂钩日经指数，但用美元按固定汇率支付。直觉上，它们的价格就是“预期利率”或“预期指数”折现。但实际上必须加一点修正。这些修正叫<strong>凸性调整（convexity adjustment）<\/strong>、<strong>时间调整（timing adjustment）<\/strong>和 <strong>Quanto 调整（quanto adjustment）<\/strong>。<\/p>\n<\/div>\n\n<h2>为什么需要调整<\/h2>\n<p>远期利率、远期价格，是在某种“自然”的支付方式下才等于风险中性的预期值。一旦产品改变了支付时间、支付货币或支付方式，这种对应关系就被打破，需要调整。调整的大小通常和波动率、相关性、期限有关。<\/p>\n\n<h2>几种常见调整<\/h2>\n<ul>\n<li><strong>期货与远期的凸性调整<\/strong>：利率期货每天结算保证金，远期到期才结算。利率上升时期货空头收到保证金，能以更高利率再投资；利率下降时付出保证金，融资成本较低。这种不对称让期货隐含利率高于对应的远期利率，期限越长、波动越大，差别越大。用期货构建收益率曲线时必须扣除这个调整。<\/li>\n<li><strong>CMS 凸性调整<\/strong>：CMS（固定期限互换利率）产品每期支付一次长期互换利率。长期互换的价值和利率之间是非线性的（凸性），所以 CMS 利率的预期值高于远期互换利率。调整的大小通常用不同执行价的互换期权来复制计算，因此依赖波动率微笑。<\/li>\n<li><strong>时间调整<\/strong>：利率在“不自然”的时间支付时需要调整，比如利率在期末才确定、并在同一时间支付（in-arrears），而不是通常的期初确定、期末支付。<\/li>\n<li><strong>Quanto 调整<\/strong>：标的以一种货币计价，赔付用另一种货币按固定汇率支付。如果标的和汇率相关，远期价格需要调整：比如日经指数上涨时日元往往贬值，用美元固定汇率支付的产品，预期价值会不同。调整大小取决于标的波动率、汇率波动率和两者的相关性。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>这些调整让本来“线性”的产品带上了波动率和相关性风险。CMS 产品会有 Vega 和微笑风险，Quanto 产品会有相关性风险。风险报告中，这类风险常被归入“二阶风险”或“其他风险”，需要单独监控，也常在独立价格验证中被检查。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2000 年代中期，欧洲市场大量发行 CMS 挂钩和 CMS 利差产品，交易商卖出这些产品后，持有大量 CMS 凸性风险，需要买入长期限互换期权来对冲。这一集中需求被认为推高了长期互换期权的波动率。在利率处于低位、波动率变化剧烈的时期，CMS 凸性调整的估计也随之大幅变化。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>当产品改变了支付时间、货币或方式，远期值就不再等于风险中性预期，需要调整。<\/li>\n<li>常见的有期货与远期的凸性调整、CMS 凸性调整、时间调整和 Quanto 调整。<\/li>\n<li>这些调整让线性产品带上波动率和相关性风险，需要在风险报告中单独监控。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个美元结算的产品挂钩日经指数，按固定汇率支付。如果日经上涨时日元通常贬值，和直接持有日元结算的版本相比，这对美元投资者的预期收益有何影响？<\/summary>\n<div><p>持有日元结算版本的美元投资者，日经上涨时赚到的日元会因日元贬值而缩水，所以那个版本对美元投资者不利。Quanto 版本按固定汇率支付，消除了这种不利影响。但 Quanto 的远期价格本身也要按相关性调整：标的与汇率的相关性越强、波动越大，调整越大。所以两者的价格不同，差别来自相关性和波动率，而不是对未来方向的看法。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-32\"><\/a><\/li>\n<li><a href=\"#L16-33\"><\/a><\/li>\n<li><a href=\"#L24-28\"><\/a><\/li>\n<\/ul><\/div>\n","24.20":"<div class=\"scene\">\n<p>第一天上班，风控同事发给你一份市场风险日报。每个交易台一行，后面跟着一排列名：DV01、CS01、CR1%、Rec01、JTD、Inf01、FX Delta、EQ Delta、Gamma、Vega、Theta……<\/p>\n<p>看起来像一串密码。其实它们都在回答同一个问题：<strong>某一个市场变量动一点点，我们会赚多少、亏多少？<\/strong>这一类数字统称敏感度（sensitivities），期权世界里常叫希腊字母（Greeks）。<\/p>\n<\/div>\n\n<h2>一个思路，一排数字<\/h2>\n<p>一本交易账的价值，取决于很多市场变量：利率、信用利差、汇率、股价、波动率、通胀、时间。每个变量叫一个风险因子（risk factor）。敏感度就是：其他都不动，只让一个风险因子动一个标准的小单位，看账的价值变了多少。<\/p>\n<p>所以读风险报告，只要问两件事：<strong>动的是哪个变量？动的是多大一个单位？<\/strong><\/p>\n\n<div class=\"tbl\"><table>\n<tr><th>名字<\/th><th>动的是什么<\/th><th>常见单位<\/th><th>主要出现在<\/th><\/tr>\n<tr><td>DV01 / PV01<\/td><td>利率<\/td><td>1bp<\/td><td>债券、互换、利率期货<\/td><\/tr>\n<tr><td>CS01 / CR01<\/td><td>信用利差<\/td><td>1bp<\/td><td>公司债、CDS<\/td><\/tr>\n<tr><td>CR1% 等相对敏感度<\/td><td>信用利差，按比例动<\/td><td>利差的 1%<\/td><td>高收益债、CDS<\/td><\/tr>\n<tr><td>Rec01<\/td><td>违约后的回收率<\/td><td>1%<\/td><td>CDS、违约边缘的债券<\/td><\/tr>\n<tr><td>JTD<\/td><td>发行人突然违约<\/td><td>违约一次<\/td><td>所有信用产品<\/td><\/tr>\n<tr><td>Inf01<\/td><td>通胀预期<\/td><td>1bp<\/td><td>通胀挂钩债、通胀互换<\/td><\/tr>\n<tr><td>FX Delta<\/td><td>汇率<\/td><td>1% 或 1 个单位<\/td><td>外币资产、外汇衍生品<\/td><\/tr>\n<tr><td>EQ Delta<\/td><td>股价<\/td><td>1% 或 1 个单位<\/td><td>股票、可转债、股票衍生品<\/td><\/tr>\n<tr><td>Gamma<\/td><td>Delta 本身怎么变<\/td><td>标的再动一单位<\/td><td>期权、含权债券<\/td><\/tr>\n<tr><td>Vega<\/td><td>隐含波动率<\/td><td>1 个波动率点<\/td><td>所有期权和含权产品<\/td><\/tr>\n<tr><td>Theta<\/td><td>时间过去一天<\/td><td>1 天<\/td><td>期权、有持有收益的仓位<\/td><\/tr>\n<\/table><\/div>\n\n<h2>一阶和二阶<\/h2>\n<p>DV01、CS01、Delta、Vega 这些叫一阶敏感度（first-order），说的是“变量动一点，价值动多少”，是一条直线的斜率。<\/p>\n<p>Gamma 和凸性（convexity）叫二阶敏感度（second-order），说的是“这条线本身弯不弯”。变量小幅变动时，一阶敏感度就够用；大幅变动时，二阶的影响会冒出来。期权仓位的二阶风险往往很大，所以期权台的报告里 Gamma 是重点。<\/p>\n\n<h2>希腊字母不只属于股票<\/h2>\n<p>只要有期权，就有 Gamma 和 Vega。利率台的互换期权（swaption）和利率上限（cap），外汇台的外汇期权，信用台的 CDS 期权，都有。没有明着写“期权”的产品也可能藏着期权：可赎回债券、MBS（借款人可以提前还款）、可转债。持有可赎回债券的投资者，其实卖出了一个期权给发行人，所以他是 Vega 的空头。<\/p>\n\n<h2>为什么风险管理离不开敏感度<\/h2>\n<ul>\n<li><strong>能加总、能比较<\/strong>：不同产品换算成同一个单位。<\/li>\n<li><strong>能设限额<\/strong>：每个交易台都有 DV01、CS01、Vega 等限额。<\/li>\n<li><strong>能解释损益<\/strong>：今天赚的钱 ≈ 每个敏感度 × 对应变量今天的变动，加起来就是“解释得了的损益”，剩下的叫“未解释损益”（unexplained P&amp;L）。<\/li>\n<li><strong>是风险模型的原料<\/strong>：VaR 和监管资本（FRTB 标准法）都以敏感度为输入。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>同一个名字，不同银行定义可能不同：正负号怎么定、按什么曲线移动、移动绝对量还是相对比例、以哪种货币报告。拿到一份新报表，先找它的说明文档（methodology），把每一列的定义弄清楚。这一步省不得，对冲方向做反、单位差一百倍，都是这样来的。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2012 年摩根大通“伦敦鲸”事件。<\/strong>摩根大通首席投资办公室在信用衍生品上建立了巨大的仓位，最终亏损约 62 亿美元。美国参议院的调查报告指出，这个组合的多项风险限额，包括信用利差敏感度的限额，在亏损扩大期间被反复突破；同年年初，团队还改用了一个新的 VaR 模型，算出来的风险几乎减半。敏感度和限额在那里报了警，但没有人真正停下来。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>每个敏感度都在回答：某一个市场变量动一个标准单位，账的价值变多少。<\/li>\n<li>一阶敏感度看斜率，Gamma 和凸性看弯曲；期权和含权产品要特别看二阶。<\/li>\n<li>敏感度用来加总、设限额、解释损益、喂给 VaR；用之前先弄清每一列的定义。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个交易台今天赚了 50 万美元，但按敏感度和市场变动算出来只应该赚 10 万。剩下的 40 万可能来自哪里？<\/summary>\n<div><p>可能来自没有被敏感度捕捉到的东西：大幅变动下的二阶效应（Gamma、凸性）、报表里没有的风险因子（比如基差、相关性）、当天的新交易、估值模型或市场数据的更正，也可能是数据错误。未解释损益偏大，是风控要追问的信号。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-13\"><\/a><\/li>\n<li><a href=\"#L24-21\"><\/a><\/li>\n<li><a href=\"#L24-26\"><\/a><\/li>\n<li><a href=\"#L24-29\"><\/a><\/li>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<\/ul><\/div>\n","24.21":"<div class=\"scene\">\n<p>风险报告上有两只债券，信用利差敏感度一模一样，都是“利差走阔 1bp，亏 1 万美元”。<\/p>\n<p>A 是一家评级 AA 的大公司，利差 80bp。B 是一家评级 B 的高杠杆公司，利差 600bp。市场一恐慌，A 的利差多半走阔十几个 bp，B 却可能走阔一两百个 bp。同样的 CS01，风险显然不一样。这就是为什么风险报告里除了 CS01，往往还有一列 CR1% 之类的<strong>相对利差敏感度<\/strong>。<\/p>\n<\/div>\n\n<h2>CS01 和 CR01：利差动 1 个基点<\/h2>\n<p>CS01（credit spread 01）是信用利差上升 1bp，仓位赚亏多少钱。它是 DV01 在信用世界里的孪生兄弟。<\/p>\n<p>CR01（credit risk 01）在很多银行里和 CS01 是同一个意思，只是叫法不同。也有银行做细分：CS01 指债券利差（比如 Z-spread）移动 1bp，CR01 指 CDS 报价利差移动 1bp，或者指移动后重新构建整条信用曲线。看定义，别看名字。<\/p>\n<p>方向上要记住：持有公司债，或者卖出 CDS 保护（sell protection），都是“做多信用风险”，利差走阔就亏钱；买入 CDS 保护（buy protection）是做空信用风险，利差走阔赚钱。<\/p>\n\n<h2>CR1%：利差按比例动 1%<\/h2>\n<p>相对敏感度假设每只债券的利差按自身水平同比例变动。“利差走阔 1%”的意思是：80bp 变成 80.8bp，600bp 变成 606bp。<\/p>\n<p>用开头的例子：<\/p>\n<ul>\n<li>A：利差动 0.8bp，乘以每 bp 1 万美元，约亏 8,000 美元。<\/li>\n<li>B：利差动 6bp，约亏 60,000 美元。<\/li>\n<\/ul>\n<p>CS01 一样，CR1% 相差七倍多。相对敏感度把“利差越宽、波动越大”这个经验规律放进了风险数字里。有的银行用 10% 而不是 1%，叫 CR10% 或类似的名字，道理一样。<\/p>\n<p>注意，“CR1%”也有银行用来表示利差<strong>绝对<\/strong>走阔 1 个百分点（100bp）的大冲击。同一个名字两种含义，这正是要先查定义的原因。<\/p>\n\n<h2>为什么要用相对冲击<\/h2>\n<p>信用市场的经验是：利差的变动幅度，大致和利差本身的水平成比例。投资级公司的利差每天动几个 bp，高收益公司动几十个 bp，濒临违约的公司一天可能动几百个 bp。只用 1bp 的绝对冲击，会低估高收益和困境债券的风险，高估投资级的风险。<\/p>\n<p>所以风险报告里通常两个都看：CS01 用来做对冲、算损益解释；相对敏感度用来比较不同信用质量仓位的真实风险，也常用在压力测试里。<\/p>\n\n<div class=\"desk\">\n<p>信用台的风险报告一般按发行人（issuer）、行业、评级、期限分别列出 CS01，用来管集中度：同一家公司的 CS01 不能超过多少，同一个行业不能超过多少。<\/p>\n<p>大幅走阔时，CS01 线性估算会不准：一是凸性，二是利差大到一定程度后，债券价格开始跟着预期回收率走，而不再跟着利差走。这时要看违约跳跃风险（JTD）和回收率敏感度（Rec01），下一课讲。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月，美国投资级公司债的平均利差从年初约 1 个百分点升到约 4 个百分点，高收益债从约 3.5 个百分点升到 10 个百分点以上。按基点算，高收益多走阔了好几百个 bp；按比例算，两者都扩大了大约三到四倍。这正是相对冲击背后的逻辑：危机中，利差更像是按比例放大，而不是每只债都多加同样的基点。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>CS01 和 CR01 都是信用利差动 1bp 的损益，不同银行对两个名字的划分可能不同。<\/li>\n<li>CR1% 这类相对敏感度按利差自身水平同比例冲击，更能反映高收益仓位的真实风险。<\/li>\n<li>做对冲和损益解释看 CS01，比较风险和做压力测试同时看相对敏感度；用之前先查定义。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>你的信用账簿总 CS01 是 −5 万美元，经理说“和上个月一样，风险没变”。但你发现组合里投资级的仓位换成了同样 CS01 的高收益债。风险真的没变吗？<\/summary>\n<div><p>变大了。CS01 相同，但高收益债的利差水平高得多，波动也大得多，相对敏感度（比如 CR1%）会明显上升。违约跳跃风险也更高。只看 CS01 会漏掉这次换仓带来的风险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-14\"><\/a><\/li>\n<li><a href=\"#L9-37\"><\/a><\/li>\n<li><a href=\"#L9-38\"><\/a><\/li>\n<li><a href=\"#L24-22\"><\/a><\/li>\n<li><a href=\"#L16-24\"><\/a><\/li>\n<\/ul><\/div>\n","24.22":"<div class=\"scene\">\n<p>一个信用交易台卖出了 1 亿美元某公司的 CDS 保护。CS01 显示：利差走阔 1bp，亏 4 万美元。如果这家公司明天突然违约呢？利差不是一点一点走阔，而是一夜之间“跳”到违约。损失不再是几万，而可能是 6,000 万。衡量这种跳跃的指标，叫<strong>违约跳跃风险（jump-to-default，JTD）<\/strong>。<\/p>\n<\/div>\n\n<h2>JTD：如果明天违约，亏多少<\/h2>\n<p>JTD 回答的问题是：假设某个发行人立刻违约，其他一切不变，我的仓位赚亏多少？<\/p>\n<ul>\n<li>持有一只债券：JTD ≈ 现在的市值 − 违约后能回收的价值。<\/li>\n<li>卖出 CDS 保护：JTD ≈ 名义本金 ×（1 − 回收率）− 已经计入的市值损失。<\/li>\n<li>买入 CDS 保护：违约时赚钱，JTD 为正。<\/li>\n<\/ul>\n<p>CS01 衡量的是利差的小幅、连续变动；JTD 衡量的是突然的、离散的违约事件。对高收益和困境公司，JTD 常常比 CS01 更重要。<\/p>\n\n<h2>回收率敏感度：回收多少决定亏多少<\/h2>\n<p>违约后的损失取决于回收率（recovery rate）。模型里通常假设一个回收率，比如高级无担保债务 40%。回收率敏感度（Rec01 或 Recovery01）衡量：假设的回收率变动 1 个百分点，仓位价值变化多少。<\/p>\n<p>对离违约还远的公司，回收率的影响很小；对接近违约、价格已经很低的公司，回收率几乎决定了一切。买卖双方对回收率的看法不同，是困境债和 CDS 交易的核心。<\/p>\n\n<h2>为什么要单独看<\/h2>\n<ul>\n<li>CS01 小的仓位，JTD 可能很大：比如一个“多一家公司、空另一家公司”的利差交易，CS01 接近零，但任何一家违约都会带来大额损益。<\/li>\n<li>监管资本也单独计算违约风险：FRTB 标准法里有专门的“违约风险资本”（default risk charge），就是基于 JTD 计算的。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>信用台的风险报告通常按发行人列出 JTD，并设定单一发行人的 JTD 限额，控制集中度。风控还会看“最大的几个 JTD”：如果前十大发行人中任何一家违约，损失多大，账户能否承受。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2001 年安然破产、2008 年雷曼兄弟破产时，很多持有这两家公司债券或卖出了它们 CDS 保护的机构，在极短时间内遭受了接近全部名义本金的损失。雷曼 CDS 的结算拍卖确定回收率只有约 8.6%，远低于模型常用的 40% 假设，卖出保护的一方要赔付超过 90% 的名义本金。这说明 JTD 和回收率假设在极端情况下有多重要。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>JTD 衡量发行人突然违约时的损益，是 CS01 之外的跳跃风险。<\/li>\n<li>回收率敏感度衡量回收率假设变动的影响，越接近违约越重要。<\/li>\n<li>JTD 按发行人设限，也是 FRTB 违约风险资本的基础。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个交易员买入 A 公司债券、同时买入同等金额的 B 公司 CDS 保护，两家公司同行业，CS01 基本抵消。他说“没有信用风险”。对吗？<\/summary>\n<div><p>不对。如果 A 违约，他持有的债券损失很大，B 的 CDS 保护不会赔付，JTD 是大额负数；如果 B 违约，他赚一大笔。CS01 抵消只说明行业整体利差平行变动时没影响，个别公司违约的跳跃风险仍然很大。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L24-21\"><\/a><\/li>\n<li><a href=\"#L9-16\"><\/a><\/li>\n<li><a href=\"#L16-24\"><\/a><\/li>\n<li><a href=\"#L24-18\"><\/a><\/li>\n<\/ul><\/div>\n","24.23":"<div class=\"scene\">\n<p>一家英国养老金用通胀挂钩国债和通胀互换来匹配它的养老金负债。风险报告上有一列“Inf01：−25 万英镑”。意思是：如果市场对未来通胀的预期上升 1 个基点，组合（扣除负债后）亏 25 万英镑。这就是<strong>通胀敏感度（inflation sensitivity）<\/strong>。<\/p>\n<\/div>\n\n<h2>Inf01：通胀预期动 1 个基点<\/h2>\n<p>通胀敏感度衡量：盈亏平衡通胀率（breakeven inflation）上升 1bp，而实际利率不变时，仓位价值的变化。<\/p>\n<ul>\n<li>持有通胀挂钩债、或在通胀互换里收实际通胀：通胀预期上升时赚钱。<\/li>\n<li>持有普通固定利率债券：通胀预期上升会推高名义利率，价格下跌（这部分通常已经体现在 DV01 里）。<\/li>\n<li>养老金的负债：随通胀上调的养老金支付，通胀预期上升时负债变大。<\/li>\n<\/ul>\n\n<h2>名义利率 = 实际利率 + 通胀预期<\/h2>\n<p>风险系统通常把名义利率拆成两部分来管理：实际利率风险和通胀风险。一个组合可能名义 DV01 接近零，却有很大的通胀风险和反向的实际利率风险。比如买入通胀挂钩债、卖出普通国债，就是押注通胀预期上升，名义利率风险基本抵消。<\/p>\n\n<h2>和 DV01 一样要分桶<\/h2>\n<p>通胀预期在不同期限上的变化不同：短期通胀预期受油价、近期数据影响大，长期通胀预期更多反映对央行信誉的看法。所以 Inf01 也按期限分桶列出。<\/p>\n<p>还有一些通胀特有的细节：通胀指数有公布滞后、季节性，不同国家用不同的指数（美国 CPI、英国 RPI、欧元区 HICP），它们之间的差异也是风险。<\/p>\n\n<div class=\"desk\">\n<p>通胀交易台和养老金的负债管理团队是通胀敏感度的主要使用者。银行的风险报告里，通胀风险通常单独列示、单独设限额，FRTB 标准法也把通胀作为利率风险里的一个单独风险因子。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年到 2022 年，全球通胀快速上升。在此之前，很多养老金的通胀对冲比例不足，负债随着通胀预期上升而增加。英国养老金由于负债大量和 RPI 挂钩，通胀敏感度很高，那些对冲比例高的养老金受到了保护；而用通胀挂钩债对冲的投资者，也遇到了另一面：实际利率大幅上升，通胀挂钩债的价格一样大跌。拆开看通胀和实际利率两种风险，才能看清楚到底是哪一部分在亏钱。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>Inf01 衡量通胀预期上升 1bp 时的损益，实际利率保持不变。<\/li>\n<li>名义利率 = 实际利率 + 通胀预期，风险系统把两者分开管理。<\/li>\n<li>通胀风险也要按期限分桶，并注意不同指数、公布滞后和季节性。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个组合买入 10 年期通胀挂钩国债、卖出同等 DV01 的 10 年期普通国债。如果名义利率不变、实际利率下降 20bp，会发生什么？<\/summary>\n<div><p>名义利率不变、实际利率下降，意味着通胀预期上升了 20bp。通胀挂钩债价格上涨（实际利率下降），普通国债价格不变，组合赚钱。这正是这个组合押注的东西：通胀预期上升。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-22\"><\/a><\/li>\n<li><a href=\"#L16-9\"><\/a><\/li>\n<li><a href=\"#L24-20\"><\/a><\/li>\n<\/ul><\/div>\n","24.24":"<div class=\"scene\">\n<p>一家瑞士银行的交易台持有 5,000 万美元的美国股票。风险报告上有两行：“EQ Delta：+5,000 万美元”“FX Delta（USD/CHF）：+5,000 万美元”。一笔投资，两种风险：股价跌了要亏，美元贬值也要亏。这两个数字都叫 <strong>Delta<\/strong>。<\/p>\n<\/div>\n\n<h2>Delta 在风险报告里的意思<\/h2>\n<p>在期权里，Delta 是期权价格对标的价格的敏感度。在风险报告里，Delta 的意思更宽：<strong>仓位相当于持有多少标的<\/strong>，通常用金额表示，或者表示为“标的变动 1% 时的损益”。<\/p>\n<ul>\n<li>直接持有股票：Delta 就是市值。<\/li>\n<li>期权：Delta = 期权的 Delta × 合约对应的标的数量 × 标的价格。<\/li>\n<li>期货、远期、互换：按相当于多少标的来算。<\/li>\n<\/ul>\n<p>把一个交易台所有工具的 Delta 加起来，就知道这个台对某个标的整体是多头还是空头、有多大。<\/p>\n\n<h2>股票 Delta<\/h2>\n<p>股票 Delta 按单只股票、行业、国家、指数分别汇总。很多银行还会把个股 Delta 乘以它的贝塔（beta），换算成“相当于多少指数”，叫贝塔调整后的 Delta（beta-adjusted delta），用来看整个组合对大盘的敞口。<\/p>\n\n<h2>汇率 Delta<\/h2>\n<p>任何以外币计价的资产、负债、衍生品，都有汇率风险。FX Delta 衡量的是：以报告货币计算，外币对本币升值或贬值 1%，仓位价值的变化。<\/p>\n<p>容易被忽略的地方：一只美元债券，除了利率和信用风险，对瑞士银行来说还有美元汇率风险；外币计价的未来收入、外币的保证金，也都是 FX 敞口。<\/p>\n\n<div class=\"desk\">\n<p>风控常用“1% 冲击”来呈现 Delta：股价下跌 1%、某货币贬值 1% 时，各交易台分别亏多少。这样不同市场的风险可以放在同一张表上比较。Delta 也是设限额最常用的指标：单一股票、单一货币的 Delta 不能超过多少。<\/p>\n<p>注意期权的 Delta 会随标的变化，所以大幅变动时只看 Delta 不够，还要看 Gamma。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2015 年 1 月 15 日，瑞士央行突然宣布放弃欧元兑瑞郎 1.20 的汇率下限，瑞郎在几分钟内对欧元升值了约 20% 以上。很多持有欧元多头、瑞郎空头的交易者（FX Delta 很大）一下子亏损巨大，一些外汇经纪商因客户亏损超过保证金而倒闭。在汇率被钉住的几年里，这类仓位的波动很小，Delta 看起来“安全”，但一次政策变化就造成了跳跃式损失。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>风险报告里的 Delta 表示仓位相当于持有多少标的，常用金额或“1% 冲击”的损益表示。<\/li>\n<li>股票 Delta 按股票、行业、指数汇总，可以按贝塔调整；FX Delta 覆盖所有外币资产和负债。<\/li>\n<li>Delta 是最常用的限额指标，但大幅变动时还要看 Gamma 和跳跃风险。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家欧洲银行持有一只美元计价的美国公司债，并用利率互换对冲了美元利率风险。它还剩下哪些风险？<\/summary>\n<div><p>还剩信用利差风险（CS01）、违约跳跃风险（JTD），以及美元对欧元的汇率风险（FX Delta）：即使债券的美元价格不变，美元贬值也会让它在欧元报告下亏钱。要对冲汇率风险，可以用外汇远期或交叉货币互换。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<li><a href=\"#L24-25\"><\/a><\/li>\n<li><a href=\"#L24-13\"><\/a><\/li>\n<\/ul><\/div>\n","24.25":"<div class=\"scene\">\n<p>早上风险报告显示，期权台的股票 Delta 是零，完全对冲。中午市场急跌 3%，交易台却亏了 200 万美元。Delta 是零，怎么还会亏钱？因为股价一动，Delta 就不再是零了。衡量“Delta 本身怎么变”的指标，叫 <strong>Gamma<\/strong>。<\/p>\n<\/div>\n\n<h2>Gamma：敏感度的敏感度<\/h2>\n<p>Gamma 衡量标的价格变动时，Delta 的变化有多大。在风险报告里，常表示为“标的变动 1% 时，Delta 变动多少”。<\/p>\n<ul>\n<li><strong>Gamma 为正（long gamma）<\/strong>：价格上涨时 Delta 变大，下跌时 Delta 变小。大幅变动对你有利：涨时赚得越来越多，跌时亏得越来越少。买入期权就是 Gamma 多头。<\/li>\n<li><strong>Gamma 为负（short gamma）<\/strong>：正好相反，大幅变动对你不利，两个方向都会吃亏。卖出期权就是 Gamma 空头。<\/li>\n<\/ul>\n<p>在固定收益里，Gamma 对应的是凸性：普通债券是正凸性，可赎回债券和 MBS 是负凸性。<\/p>\n\n<h2>Gamma 决定对冲的难度<\/h2>\n<p>Delta 对冲只在价格小幅变动时有效。Gamma 越大，价格一动 Delta 就变得越多，需要越频繁地调整对冲：<\/p>\n<ul>\n<li>Gamma 多头的交易员：价格涨了卖出、跌了买入，低买高卖，调整对冲本身在赚钱，代价是每天付出时间价值（Theta）。<\/li>\n<li>Gamma 空头的交易员：价格涨了要买入、跌了要卖出，追涨杀跌，调整对冲在亏钱，补偿是每天收到时间价值。<\/li>\n<\/ul>\n\n<h2>Gamma 在哪里最大<\/h2>\n<p>平值、临近到期的期权 Gamma 最大。所以期权到期日附近，如果有大量期权集中在某个执行价，做市商的对冲买卖可能会影响标的价格：Gamma 多头的做市商会“钉住”价格，Gamma 空头的做市商会放大波动。<\/p>\n\n<div class=\"desk\">\n<p>风险报告里，Gamma 通常和 Delta 一起列出，并配合“大幅冲击情景”看：标的上下变动 5%、10%、20% 时，整个账户的损益是多少。因为 Gamma 是二阶的，只用 Delta 和 Gamma 估算大幅变动也不够准，最好直接重新估值（full revaluation）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年初，美国散户大量买入 GameStop 等股票的短期价外看涨期权。卖出这些期权的做市商是 Gamma 空头：股价每上涨一点，它们的 Delta 空头就变大，需要买入更多股票对冲，而这些买入又推高了股价，形成正反馈，被称为“Gamma 挤压”（gamma squeeze）。这是 Gamma 风险从单个交易台扩散到整个市场的例子。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>Gamma 衡量 Delta 随标的变化的程度，是二阶敏感度，债券里对应凸性。<\/li>\n<li>Gamma 多头喜欢大波动、付 Theta；Gamma 空头怕大波动、收 Theta。<\/li>\n<li>平值、临近到期的期权 Gamma 最大；大幅变动要用情景和完全重估来看。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个交易员的账户 Delta 为零，Gamma 为大额负数。股价先涨 5% 再跌回原位，他会赚还是亏？<\/summary>\n<div><p>大概率亏。股价上涨时，负 Gamma 让他的 Delta 变成空头，他要买入股票对冲（在高位买）；股价回落时，Delta 又变成多头，他要卖出（在低位卖）。一来一回追涨杀跌，即使价格回到原位，也亏了对冲的钱，只能靠收到的 Theta 来弥补。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<li><a href=\"#L16-28\"><\/a><\/li>\n<li><a href=\"#L9-35\"><\/a><\/li>\n<li><a href=\"#L24-27\"><\/a><\/li>\n<\/ul><\/div>\n","24.26":"<div class=\"scene\">\n<p>一个期权交易员早上到岗，标的资产的价格和昨天一模一样，可她的账上却赚了 30 万美元。原因是昨晚有一则地缘政治新闻，市场紧张，期权变贵了。她手里买入的期权多、卖出的少，期权一变贵就赚钱。<\/p>\n<p>让她赚钱的风险，叫 <strong>Vega<\/strong>：波动率变动带来的损益。<\/p>\n<\/div>\n\n<h2>Vega：隐含波动率动 1 个点，赚亏多少<\/h2>\n<p>期权的价格取决于标的价格、执行价、到期时间、利率，以及市场认为未来会“晃”多大，也就是隐含波动率（implied volatility）。前几个都能直接看到，只有隐含波动率是市场情绪的产物：大家越紧张，越愿意为保护多付钱，隐含波动率越高，期权越贵。<\/p>\n<p>Vega 衡量的是：隐含波动率上升 1 个点，仓位的价值变化多少。股票和外汇期权的“1 个点”通常是 1%，比如从 20% 到 21%；利率期权常用正态波动率，1 个点是 1bp。<\/p>\n<ul>\n<li>买入期权（long option）：Vega 为正，波动率上升就赚钱。<\/li>\n<li>卖出期权（short option）：Vega 为负，波动率上升就亏钱。<\/li>\n<\/ul>\n\n<h2>哪些仓位有 Vega<\/h2>\n<ul>\n<li>所有明面上的期权：股票期权、外汇期权、利率上限和下限、互换期权、CDS 期权。<\/li>\n<li>藏着期权的产品：可赎回债券（持有人卖出了赎回权，Vega 为负）、MBS（借款人可以提前还款，持有人同样是 Vega 空头）、可转债（持有人买入了转股权，Vega 为正）、结构性产品。<\/li>\n<\/ul>\n<p>所以固定收益组合也有 Vega。一个大量持有 MBS 的组合，利率波动加剧时会吃亏。<\/p>\n\n<h2>Vega 也要分桶<\/h2>\n<p>不同到期日、不同执行价的期权，隐含波动率各不相同，也不会一起变动。所以风险报告会把 Vega 拆开：按到期日分桶；利率期权还要按标的互换的期限分桶，排成一张矩阵；再细一点，按执行价分，看波动率“微笑”（smile）的风险。总 Vega 接近零的账，也可能在某几个格子里有很大风险。<\/p>\n\n<h2>Vega 和时间的关系<\/h2>\n<p>期限越长的期权，Vega 越大：未来还有很长时间，波动率的影响积累得多。快到期的期权，Vega 很小，主要的风险变成了 Gamma。<\/p>\n<p>买期权赚 Vega 是有代价的：每过一天，期权的时间价值都在流失，叫 Theta。买期权的人每天“付租金”，等着波动率上升或者价格大幅变动；卖期权的人每天“收租金”，承担波动率突然飙升的风险。<\/p>\n\n<div class=\"desk\">\n<p>期权台的日报里，Vega 一般按到期日和执行价列出。损益解释里会有一行“Vega 损益”：每个桶的 Vega × 该桶隐含波动率当天的变动。<\/p>\n<p>波动率的市场数据不像股价那样随处可见，尤其是远期、远价外的期权。所以产品控制（product control）要定期用经纪商报价、共识报价等独立数据核对交易台标的波动率，偏差太大就要调整估值。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2018 年 2 月 5 日，“波动率末日”（Volmageddon）。<\/strong>此前多年市场平稳，很多投资者通过一类做空波动率的交易所产品，赚取“卖期权收租金”的稳定收入。那天美股下跌，衡量标普 500 隐含波动率的 VIX 指数一天之内翻了一倍多，从 17 左右升到 37 左右。规模最大的做空波动率产品之一 XIV 盘后暴跌超过 90%，第二天发行商就宣布将其提前终止。持有大量负 Vega 的仓位，在平静时期每天赚小钱，一次波动率飙升就把多年收益全部吐回。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>Vega 是隐含波动率动 1 个点的损益；买期权 Vega 为正，卖期权 Vega 为负。<\/li>\n<li>Vega 不只属于股票：利率、外汇、信用期权和可赎回债券、MBS、可转债都有。<\/li>\n<li>Vega 要按到期日、期限和执行价分桶看；负 Vega 仓位平时赚小钱，波动率飙升时会亏大钱。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行的资产负债表上有大量住房按揭贷款，借款人可以随时提前还款且没有罚金。这家银行是 Vega 的多头还是空头？利率波动变大时，它会怎样？<\/summary>\n<div><p>是 Vega 的空头。借款人拥有提前还款的权利，相当于银行卖给了借款人一个期权：利率下跌时借款人会提前还款再贷便宜的钱，银行只能把钱以更低的利率重新借出去。利率波动越大，这个期权对借款人越值钱，对银行越不利。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<li><a href=\"#L16-19\"><\/a><\/li>\n<li><a href=\"#L16-27\"><\/a><\/li>\n<li><a href=\"#L16-34\"><\/a><\/li>\n<li><a href=\"#L24-27\"><\/a><\/li>\n<\/ul><\/div>\n","24.27":"<div class=\"scene\">\n<p>周五收盘后，市场什么都没发生。周一早上，期权台的账户少了 60 万美元。不是交易员做错了什么，而是过了一个周末，手里的期权都“老”了三天。时间本身让期权贬值，这部分损益叫 <strong>Theta<\/strong>。<\/p>\n<\/div>\n\n<h2>Theta：时间过去一天，价值变多少<\/h2>\n<p>Theta 衡量的是：其他一切不变，时间过去一天，仓位价值的变化。<\/p>\n<ul>\n<li><strong>买入期权<\/strong>：Theta 为负。期权的时间价值每天都在流失，到期时归零。<\/li>\n<li><strong>卖出期权<\/strong>：Theta 为正，每天“收租”。<\/li>\n<li><strong>平值、临近到期<\/strong>：Theta 最大，到期前最后几天流失最快。<\/li>\n<\/ul>\n\n<h2>不只是期权：持有收益也算时间效应<\/h2>\n<p>风险报告里，“时间过去一天”的损益还包括其他东西：<\/p>\n<ul>\n<li>债券的票息累积和融资成本（carry）。<\/li>\n<li>债券沿着收益率曲线滑下来的骑乘效应（roll-down）。<\/li>\n<li>互换的利息累积。<\/li>\n<\/ul>\n<p>很多银行在损益解释里把这些统称为“时间效应”或“carry”，单独列出来，和市场变动带来的损益分开。<\/p>\n\n<h2>Theta 和 Gamma 是一枚硬币的两面<\/h2>\n<p>卖期权的人每天收 Theta，代价是承担 Gamma 风险：大行情来了会亏；买期权的人每天付 Theta，换来大行情时的收益。如果市场的实际波动恰好等于期权定价时隐含的波动，两者大致抵消。交易员赚钱还是亏钱，取决于实际波动是大于还是小于隐含波动。<\/p>\n\n<div class=\"desk\">\n<p>处理周末和假日是 Theta 的一个实际问题：很多系统在周五就计算三天的时间流逝，有的按日历日、有的按交易日。损益解释时要确认系统的约定，否则周一的“未解释损益”可能就是周末 Theta 处理不一致造成的。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2017 年美国股市异常平静，标普 500 全年最大回撤不到 3%，VIX 多次跌破 10。在这样的环境里，系统性卖出期权、收取 Theta 的策略连续获得稳定收益，吸引了大量资金。2018 年 2 月市场突然大跌，这些策略的 Gamma 和 Vega 空头一次性带来巨额损失，把前一年积累的 Theta 收入全部吞没。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>Theta 是时间过去一天、其他不变时的损益；买期权付 Theta，卖期权收 Theta。<\/li>\n<li>风险报告的“时间效应”还包括票息、融资和骑乘效应。<\/li>\n<li>Theta 和 Gamma 是交换：赚不赚钱取决于实际波动和隐含波动的比较。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个交易员说：“我的账户 Theta 每天赚 5 万，一年就是 1,250 万，稳赚。”你怎么看？<\/summary>\n<div><p>Theta 收入是承担 Gamma 和 Vega 风险的补偿，不是白拿的。平静时期确实每天赚钱，但一旦出现大行情或波动率飙升，损失可能远超全年的 Theta。要看他的 Gamma、Vega 有多大，压力情景下会亏多少，才能判断这 1,250 万是否值得。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-18\"><\/a><\/li>\n<li><a href=\"#L24-25\"><\/a><\/li>\n<li><a href=\"#L9-10\"><\/a><\/li>\n<\/ul><\/div>\n","24.28":"<div class=\"scene\">\n<p>一个交易台买入了一只公司债，同时买入这家公司的 CDS 保护，CS01 正好抵消。风险报告显示信用风险几乎为零。几周后，市场紧张，公司债利差走阔了 80bp，CDS 利差只走阔了 30bp，交易台亏了一大笔。两个“抵消”的东西，并没有一起动。这就是<strong>基差风险（basis risk）<\/strong>。<\/p>\n<\/div>\n\n<h2>基差风险：两个相似的东西动得不一样<\/h2>\n<p>只要对冲工具和被对冲的东西不完全一样，就有基差风险。常见的有：<\/p>\n<ul>\n<li><strong>债券和 CDS<\/strong>：CDS-债券基差。<\/li>\n<li><strong>国债现货和期货<\/strong>：期现基差。<\/li>\n<li><strong>国债和互换<\/strong>：互换利差（swap spread）。<\/li>\n<li><strong>不同的浮动利率<\/strong>：比如 3 个月利率和隔夜利率之间的基差。<\/li>\n<li><strong>不同货币的融资<\/strong>：交叉货币基差。<\/li>\n<li><strong>个股和指数<\/strong>：用指数期货对冲个股组合。<\/li>\n<\/ul>\n<p>只看 DV01、CS01 这些一阶敏感度，看不出基差风险。风险报告需要单独列出“基差敏感度”。<\/p>\n\n<h2>相关性风险：东西之间的关系会变<\/h2>\n<p>很多产品的价值，直接取决于两个或多个资产之间的相关性（correlation）：<\/p>\n<ul>\n<li>一篮子期权：篮子里的股票一起涨跌（相关性高）时，篮子的波动更大。<\/li>\n<li>信用分层（CDO 分层）：违约之间的相关性决定了各层的损失分布。<\/li>\n<li>Quanto 产品：标的和汇率之间的相关性影响定价。<\/li>\n<\/ul>\n<p>相关性很难观察，也不稳定。最大的问题是：在危机中，原本不相关的资产常常突然一起下跌，相关性急剧上升，叫“相关性崩溃”（correlation breakdown）。分散化的好处在最需要的时候消失了。<\/p>\n\n<h2>其他二阶风险<\/h2>\n<ul>\n<li><strong>交叉 Gamma（cross gamma）<\/strong>：一个变量变化，改变了你对另一个变量的敏感度。比如股价下跌时 Vega 变大。<\/li>\n<li><strong>Vanna、Volga<\/strong>：Delta 对波动率的敏感度、Vega 对波动率的敏感度，在期权台较常见。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>这类风险常被称为“非一阶风险”或“残余风险”。很多银行用压力测试和情景分析来捕捉它们，比如“利差走阔 100bp，同时 CDS 只走阔 50bp”。FRTB 标准法也专门设了“残余风险附加”（residual risk add-on），对奇异期权等难以用一阶敏感度覆盖的产品额外计提资本。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2005 年 5 月，通用汽车和福特被降为垃圾级，信用指数分层市场出现剧烈波动：权益层（最先承担损失）的价格下跌，而夹层的价格却上涨，和很多交易员“按相关性对冲”的预期相反。不少对冲基金和银行在“做多权益层、做空夹层”的交易上遭受了大额损失。这次事件被称为“相关性危机”，说明相关性本身就是一种会突然变化的风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>对冲工具和被对冲的东西不完全一样，就有基差风险，一阶敏感度看不出来。<\/li>\n<li>相关性风险来自资产之间关系的变化，危机中相关性常常突然上升。<\/li>\n<li>交叉 Gamma 等二阶风险，用压力测试、情景分析和残余风险附加来管理。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个投资组合由十个不同国家的股票组成，平
