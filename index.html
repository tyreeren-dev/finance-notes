<style>
/* Layout: a quiet reading room. Sticky bar, outline on the left, a 66ch reading column. Ledger-green accent, ochre for real-world cases. */
:root {
  --bg: #F4F6F4; --surface: #FFFFFF; --sunk: #EAEEEB; --ink: #15212B; --muted: #5B6871; --line: #D6DDD8;
  --accent: #0E6B66; --accent-soft: #DCEDEA; --ochre: #9A5B17; --ochre-soft: #F6ECDD; --blue: #2B4C7E; --blue-soft: #E3EAF5;
  --font-body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bar-h: 56px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1417; --surface: #151D21; --sunk: #1B252A; --ink: #E3EAEC; --muted: #98A6AD; --line: #27343A;
  --accent: #55B8AF; --accent-soft: #173431; --ochre: #D99A52; --ochre-soft: #2E2416; --blue: #86A6DA; --blue-soft: #1A2433; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1417; --surface: #151D21; --sunk: #1B252A; --ink: #E3EAEC; --muted: #98A6AD; --line: #27343A;
  --accent: #55B8AF; --accent-soft: #173431; --ochre: #D99A52; --ochre-soft: #2E2416; --blue: #86A6DA; --blue-soft: #1A2433; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16.5px; line-height: 1.85; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { height: var(--bar-h); display: flex; align-items: center; gap: 12px; max-width: 1320px; margin: 0 auto; }
.brand { text-decoration: none; color: var(--ink); white-space: nowrap; display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: 0.02em; }
.brand span { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.more { margin: 30px 0 10px; padding: 14px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.more::before { content: "继续深入"; display: block; font-size: 12px; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.more ul { margin: 0; padding-left: 1.1em; }
.more li { margin: 3px 0; font-size: 15px; }
.more .todo-tag { color: var(--muted); font-size: 12.5px; }
.foot { max-width: 1320px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }
@media (max-width: 560px) { .brand span { display: none; } }
.search { flex: 1; min-width: 0; position: relative; max-width: 440px; margin-left: auto; }
.search input { width: 100%; height: 36px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 0 12px; font: inherit; font-size: 14px; }
.results { position: absolute; top: 42px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.14); max-height: 70vh; overflow: auto; }
.results a { display: block; padding: 9px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.results a:last-child { border-bottom: 0; }
.results a:hover, .results a.sel { background: var(--accent-soft); }
.results .r-s { font-size: 12.5px; color: var(--muted); }
.results .empty { padding: 12px 14px; color: var(--muted); font-size: 14px; }
.tbtn { height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-size: 13px; }
.navbtn { display: none; }

.frame { display: grid; grid-template-columns: 300px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; gap: 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.side { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - var(--bar-h)); overflow: auto; padding-block: 20px 48px; font-size: 13.5px; line-height: 1.5; }
.side details { margin: 0 0 6px; }
.side summary { cursor: pointer; font-weight: 600; padding: 6px 0; list-style: none; }
.side summary::-webkit-details-marker { display: none; }
.side summary::before { content: "▸"; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
.side details[open] > summary::before { transform: rotate(90deg); }
.side .grp { font-size: 11.5px; letter-spacing: 0.08em; color: var(--accent); margin: 10px 0 2px 14px; }
.side a { display: flex; gap: 8px; padding: 3px 8px; margin-left: 6px; border-radius: 6px; text-decoration: none; color: var(--muted); }
.side a:hover { background: var(--sunk); color: var(--ink); }
.side a.cur { background: var(--accent-soft); color: var(--accent); }
.side a.has { color: var(--ink); }
.side a .n { font-family: var(--font-mono); font-size: 11px; color: var(--accent); margin-left: auto; padding-left: 6px; }
.side .lessons { margin: 2px 0 6px 18px; border-left: 1px solid var(--line); }
.side .lessons a { font-size: 13px; }
.side .lessons a.w::after { content: "●"; font-size: 8px; color: var(--accent); margin-left: auto; align-self: center; }
main { min-width: 0; padding-block: 34px 110px; }

/* home */
.hero h1 { font-family: var(--font-display); font-size: clamp(30px, 4.4vw, 46px); line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
.lede { font-size: 18px; color: var(--muted); max-width: 60ch; margin: 0; }
.stats { display: flex; gap: 30px; flex-wrap: wrap; margin: 22px 0 0; font-size: 14px; color: var(--muted); }
.stats b { font-family: var(--font-mono); font-size: 24px; color: var(--ink); display: block; line-height: 1.2; font-weight: 500; }
.sec-h { margin: 46px 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.sec-h span { color: var(--muted); font-size: 14px; }
.ready { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.ready a { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; line-height: 1.5; }
.ready a:hover { border-color: var(--accent); }
.ready .c { font-family: var(--font-mono); font-size: 12px; color: var(--accent); display: block; margin-bottom: 2px; }
.vols { display: grid; gap: 14px; }
.vol { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.vol h3 { margin: 0 0 4px; font-size: 18px; }
.vol .grp { font-size: 12px; color: var(--accent); letter-spacing: 0.06em; margin: 12px 0 4px; }
.vol ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px 20px; }
.vol li a { text-decoration: none; color: var(--ink); display: flex; gap: 8px; font-size: 14.5px; line-height: 1.6; padding: 2px 0; }
.vol li a:hover { color: var(--accent); }
.vol li .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.vol li .n.w { color: var(--accent); }

/* part + lesson */
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumb a { color: var(--muted); }
.head h1 { font-family: var(--font-display); font-size: clamp(25px, 3.4vw, 34px); line-height: 1.35; margin: 10px 0 8px; text-wrap: balance; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.tag.adv { border-color: var(--ochre); color: var(--ochre); }
.partq { font-size: 18px; margin: 14px 0 4px; }
.partmeta { color: var(--muted); font-size: 14px; }
.plist { list-style: none; padding: 0; margin: 14px 0 0; max-width: 72ch; }
.plist .sub { font-size: 13px; color: var(--ochre); margin: 22px 0 6px; font-weight: 600; }
.plist .sub.plain { color: var(--accent); }
.plist a { display: flex; gap: 12px; text-decoration: none; color: var(--muted); padding: 7px 10px; border-radius: 8px; line-height: 1.5; }
.plist a.w { color: var(--ink); }
.plist a:hover { background: var(--sunk); }
.plist .c { font-family: var(--font-mono); font-size: 12px; min-width: 46px; padding-top: 2px; }
.plist a.w .c { color: var(--accent); }
.plist .st { margin-left: auto; font-size: 12px; white-space: nowrap; }
.branch { margin-top: 26px; padding-top: 14px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 14px; max-width: 72ch; }

.content { max-width: 66ch; margin-top: 26px; }
.content h2 { font-family: var(--font-display); font-size: 22px; line-height: 1.45; margin: 40px 0 10px; text-wrap: balance; }
.content p { margin: 0 0 16px; }
.content ul, .content ol { padding-left: 1.3em; margin: 0 0 16px; }
.content li { margin: 4px 0; }
.content strong { font-weight: 600; }
.scene { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin: 0 0 26px; font-size: 17px; }
.scene p:last-child, .desk p:last-child, .case p:last-child, .takeaway p:last-child { margin-bottom: 0; }
.desk { background: var(--blue-soft); border-radius: 14px; padding: 16px 22px; margin: 22px 0; }
.desk::before { content: "在交易台上"; display: block; font-size: 12px; letter-spacing: 0.1em; color: var(--blue); font-weight: 600; margin-bottom: 6px; }
.case { background: var(--ochre-soft); border-radius: 14px; padding: 16px 22px; margin: 22px 0; }
.case::before { content: "真实发生过"; display: block; font-size: 12px; letter-spacing: 0.1em; color: var(--ochre); font-weight: 600; margin-bottom: 6px; }
.takeaway { border-left: 3px solid var(--accent); padding: 4px 0 4px 20px; margin: 36px 0 22px; }
.takeaway::before { content: "三句话记住"; display: block; font-size: 12px; letter-spacing: 0.1em; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
.takeaway ol { margin: 0; }
details.think { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 18px 0; }
details.think summary { cursor: pointer; padding: 14px 18px; font-weight: 500; }
details.think summary::before { content: "想一想　"; color: var(--accent); font-weight: 600; }
details.think > div { padding: 12px 18px 16px; border-top: 1px dashed var(--line); }
.tbl { overflow-x: auto; margin: 16px 0 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.6; }
.tbl th, .tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--sunk); font-weight: 600; font-size: 13.5px; }
.tbl tr:last-child td { border-bottom: 0; }
.todo { margin-top: 26px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 20px 22px; color: var(--muted); max-width: 66ch; }
.pager { display: flex; justify-content: space-between; gap: 14px; margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; font-size: 14px; }
.pager a { text-decoration: none; max-width: 48%; }

@media (max-width: 980px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 0; }

  body.navopen nav.side { display: block; }
  .navbtn { display: inline-flex; align-items: center; }
}
@media (max-width: 520px) { body { font-size: 16px; } .pager a { max-width: 100%; } }
</style>

l,"adv":false},{"code":"H8.4","title":"马克思与政治经济学批判","sub":null,"adv":false},{"code":"H8.5","title":"边际革命：门格尔、杰文斯与瓦尔拉斯","sub":null,"adv":false},{"code":"H8.6","title":"马歇尔与新古典经济学","sub":null,"adv":false},{"code":"H8.7","title":"凯恩斯与大萧条","sub":null,"adv":false},{"code":"H8.8","title":"奥地利学派：米塞斯与哈耶克","sub":null,"adv":false},{"code":"H8.9","title":"熊彼特与创造性破坏","sub":null,"adv":false},{"code":"H8.10","title":"萨缪尔森与新古典综合","sub":null,"adv":false},{"code":"H8.11","title":"本杰明·格雷厄姆与价值投资","sub":null,"adv":false},{"code":"H8.12","title":"弗里德曼、芝加哥学派与货币主义","sub":null,"adv":false},{"code":"H8.13","title":"新凯恩斯主义","sub":null,"adv":false},{"code":"H8.14","title":"公共选择学派","sub":null,"adv":false},{"code":"H8.15","title":"制度经济学：科斯与诺斯","sub":null,"adv":false},{"code":"H8.16","title":"现代货币理论（MMT）","sub":null,"adv":false},{"code":"H8.17","title":"马科维茨与现代投资组合理论","sub":null,"adv":false},{"code":"H8.18","title":"布莱克、斯科尔斯与默顿","sub":null,"adv":false},{"code":"H8.19","title":"法玛、席勒与市场有没有效率","sub":null,"adv":false},{"code":"H8.20","title":"卡尼曼、特沃斯基与行为金融","sub":null,"adv":false},{"code":"H8.21","title":"明斯基与“明斯基时刻”","sub":null,"adv":false},{"code":"H8.22","title":"伯南克与金融危机研究","sub":null,"adv":false}]}]},{"id":"v6","name":"卷六 词条：全部术语中英对照","parts":[{"id":"v6p1","name":"词条分类","group":null,"q":"","role":"","branch":"","lessons":[{"code":"T1","title":"股票类工具（ISO 10962 E 类）","sub":null,"adv":false},{"code":"T2","title":"债务类工具（D 类）","sub":null,"adv":false},{"code":"T3","title":"集合投资工具（C 类）","sub":null,"adv":false},{"code":"T4","title":"权利、权证与杠杆证书（R 类）","sub":null,"adv":false},{"code":"T5","title":"场内期权与期货（O、F 类）","sub":null,"adv":false},{"code":"T6","title":"互换（S 类）","sub":null,"adv":false},{"code":"T7","title":"场外与复杂期权（H 类）","sub":null,"adv":false},{"code":"T8","title":"即期与远期（I、J 类）","sub":null,"adv":false},{"code":"T9","title":"组合策略（K 类）","sub":null,"adv":false},{"code":"T10","title":"融资类：贷款、回购与证券借贷（L 类）","sub":null,"adv":false},{"code":"T11","title":"参照物：货币、商品与利率（T 类）","sub":null,"adv":false},{"code":"T12","title":"数字资产","sub":null,"adv":false},{"code":"T13","title":"市场与交易机制","sub":null,"adv":false},{"code":"T14","title":"机构与参与者","sub":null,"adv":false},{"code":"T15","title":"风险与度量","sub":null,"adv":false},{"code":"T16","title":"监管与合规","sub":null,"adv":false},{"code":"T17","title":"会计与税务","sub":null,"adv":false},{"code":"T18","title":"宏观指标","sub":null,"adv":false},{"code":"T19","title":"微观经济学概念","sub":null,"adv":false},{"code":"T20","title":"国际经济、增长与发展","sub":null,"adv":false},{"code":"T21","title":"商业、管理与行业","sub":null,"adv":false},{"code":"T22","title":"法律","sub":null,"adv":false},{"code":"T23","title":"模型与数学","sub":null,"adv":false},{"code":"T24","title":"投资策略与风格","sub":null,"adv":false},{"code":"T25","title":"人物与事件","sub":null,"adv":false}]}]}],"content":{"9.1":"<div class=\"scene\">\n<p>你借给朋友一万块，让他写了张借条：每年付你 300 块利息，五年后还一万。一年后你突然要买房，急需这一万块。朋友还没钱还你。怎么办？<\/p>\n<p>你想到一个办法：把这张借条卖给另一个人。他付你一万块左右，以后的利息和本金都归他。如果这张借条可以这样一手一手转卖下去，它就是一张<strong>债券（bond）<\/strong>。<\/p>\n<\/div>\n\n<h2>一张借条，四个要素<\/h2>\n<p>债券就是标准化、可以转卖的借条。每一张债券都写明了四件事：<\/p>\n<ul>\n<li><strong>谁借的钱<\/strong>：发行人（issuer），可能是政府、公司或银行。<\/li>\n<li><strong>借了多少<\/strong>：面值（face value，也叫 par），到期时要还的本金，通常按每 100 元报价。<\/li>\n<li><strong>每年付多少利息<\/strong>：票息（coupon），比如 3%，就是每 100 元面值每年付 3 元。<\/li>\n<li><strong>什么时候还<\/strong>：到期日（maturity）。<\/li>\n<\/ul>\n<p>买债券的人叫持有人（bondholder）。持有人拿到的，就是发行人未来按约定付钱的一串承诺。<\/p>\n\n<h2>为什么要做成能转卖的<\/h2>\n<p>能转卖，借钱的人和出钱的人都轻松很多。<\/p>\n<p>对出钱的人来说，钱没有被锁死。今天买了十年期国债，明天想用钱，在市场上卖掉就行。这种“随时能变现”的能力，叫流动性（liquidity）。正因为能随时卖，大家才愿意把钱借出去更长时间，利息也可以要得低一点。<\/p>\n<p>对借钱的人来说，可以一次向成千上万的投资者借钱，而不用挨家挨户去谈。一家大公司发一笔 10 亿美元的债，可能有几百家基金、保险公司和银行一起买。<\/p>\n<p>债券第一次卖出去，叫发行，发生在一级市场（primary market）。之后投资者之间互相买卖，发生在二级市场（secondary market）。发行人只在一级市场拿到钱，二级市场上的买卖和它没有直接关系，但二级市场的价格会告诉它：下次借钱要付多少利息。<\/p>\n\n<h2>债券和银行贷款有什么区别<\/h2>\n<p>两者都是借钱，区别在于钱从谁那里来、能不能转手。<\/p>\n<div class=\"tbl\"><table>\n<tr><th><\/th><th>银行贷款<\/th><th>债券<\/th><\/tr>\n<tr><td>谁出钱<\/td><td>一家或几家银行<\/td><td>很多投资者<\/td><\/tr>\n<tr><td>能不能转卖<\/td><td>通常留在银行账上<\/td><td>天天在市场上交易<\/td><\/tr>\n<tr><td>价格公开吗<\/td><td>基本不公开<\/td><td>每天都有报价<\/td><\/tr>\n<tr><td>条款<\/td><td>可以一对一谈，比较灵活<\/td><td>标准化，人人一样<\/td><\/tr>\n<\/table><\/div>\n<p>所以小公司多半找银行借，大公司和政府更多发债。一家公司越大、越有名，越容易直接向市场借钱。<\/p>\n\n<div class=\"desk\">\n<p>交易员不会说“那张三年后到期的苹果公司债”，而是用一串简称：发行人、票息、到期日。比如“UST 4.25 11/34”，意思是美国国债（US Treasury），票息 4.25%，2034 年 11 月到期。系统里每只债券还有一个全球唯一的编号 ISIN，就像债券的身份证。<\/p>\n<p>报价时说的是“每 100 元面值值多少钱”。报 98.5，就是一张面值 100 的债券现在卖 98.5。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>债券的历史比股票还早。12 世纪的威尼斯，政府向市民强制借款，发给他们可以转让的凭证。到了 1693 年，英国政府为筹集对法战争的军费开始系统发债，第二年成立了英格兰银行，专门帮政府管理这些债务。今天全球债券市场的规模比股票市场还大，其中政府债占了很大一块。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>债券就是标准化、可以转卖的借条。<\/li>\n<li>每张债券都写明四件事：谁借的、借多少、每年付多少利息、什么时候还。<\/li>\n<li>能转卖带来流动性，所以大公司和政府更多向市场发债，而不只找银行。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同一家公司，银行贷款可以几年都没有公开价格，它发的债券却每天都有报价。为什么？<\/summary>\n<div><p>因为债券在二级市场上有人天天买卖，每一笔成交、每一个报价都会形成价格。银行贷款通常留在银行账上，不怎么转手，也就没有市场价格。这也是为什么银行要靠内部模型给贷款估值，而债券可以直接按市场价计价。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-2\"><\/a><\/li>\n<li><a href=\"#L9-3\"><\/a><\/li>\n<li><a href=\"#L9-30\"><\/a><\/li>\n<li><a href=\"#L9-33\"><\/a><\/li>\n<\/ul><\/div>\n","9.2":"<div class=\"scene\">\n<p>一个国家的政府每年要花的钱，常常比收上来的税多。差额怎么办？借。向谁借？向全世界的投资者借：养老金、保险公司、银行、外国央行，还有你买的货币基金。政府借钱的借条，就是<strong>国债（government bond）<\/strong>。<\/p>\n<\/div>\n\n<h2>国债为什么特别<\/h2>\n<p>国债是一个国家里最安全的债券，原因是政府有两样别人没有的东西：征税的权力，以及（对用本国货币借的债来说）通过央行创造货币的能力。所以用本币发行的国债，几乎不会因为“没钱”而违约。<\/p>\n<p>正因为安全，国债的收益率被当作这个国家的“无风险利率”（risk-free rate）。公司债、房贷、股票估值，都以它为起点再往上加。所以第 9 部里说“利差”，一般就是相对国债的利差。<\/p>\n<p>需要提醒的是，“安全”指的是按时付钱，价格并不稳定。长期国债的价格会随利率大起大落，2022 年就是例子。<\/p>\n\n<h2>一个国家的国债，各有各的名字<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>国家<\/th><th>常用名称<\/th><th>说明<\/th><\/tr>\n<tr><td>美国<\/td><td>Treasuries（UST）<\/td><td>1 年以内叫 T-bill，2 到 10 年叫 T-note，20 和 30 年叫 T-bond<\/td><\/tr>\n<tr><td>英国<\/td><td>Gilts（金边债）<\/td><td>还有大量通胀挂钩的 index-linked gilts<\/td><\/tr>\n<tr><td>德国<\/td><td>Bunds<\/td><td>欧元区的利率基准<\/td><\/tr>\n<tr><td>日本<\/td><td>JGBs<\/td><td>日本央行长期大量持有<\/td><\/tr>\n<tr><td>中国<\/td><td>国债、政策性金融债<\/td><td>政策性银行发的债规模也很大<\/td><\/tr>\n<tr><td>瑞士<\/td><td>Confederation bonds（Eidgenossen）<\/td><td>收益率长期是全球最低的之一<\/td><\/tr>\n<\/table><\/div>\n\n<h2>本币和外币，差别很大<\/h2>\n<p>用本国货币借钱的政府，最坏可以让央行“印钱”还债，代价是通胀和本币贬值。用外币（比如美元）借钱就没有这条退路：美元印不出来，只能靠出口、外汇储备或者再借钱。所以历史上政府违约，大多发生在外币债务上，比如 1998 年俄罗斯和 2001 年阿根廷。欧元区国家是特殊情况：它们用欧元借钱，但欧元由欧洲央行管，各国自己印不了。这也是 2010–2012 年希腊债务危机的根源之一。<\/p>\n\n<div class=\"desk\">\n<p>交易台说的“基准券”（benchmark）或“新券”（on-the-run），指最近一次发行的各期限国债，比如最新的 10 年期。它们交易最活跃，报价最紧。之前发行、期限相近的叫“老券”（off-the-run），流动性稍差，收益率通常略高一点。<\/p>\n<p>国债也是回购市场最重要的抵押品，是整个金融体系的“现金替代品”。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2011 年 8 月，美国国债被降级。<\/strong>国会迟迟不提高债务上限，标普在 8 月 5 日把美国的长期信用评级从 AAA 降到 AA+，这是历史上第一次。结果出人意料：消息出来后，全球投资者反而涌入美国国债避险，美债价格上涨、收益率下降。在危机中，大家需要的是一个足够大、足够容易买卖的“安全资产”，美国国债仍然是唯一的选择。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>国债是政府的借条，用本币发行的国债几乎没有违约风险，它的收益率被当作无风险利率。<\/li>\n<li>安全指的是按时付钱，长期国债的价格仍然会随利率大幅波动。<\/li>\n<li>政府违约大多发生在外币债务上；欧元区国家用一种自己印不了的货币借钱，处境介于两者之间。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么市场恐慌时，人们去买美国国债，即使恐慌的源头就在美国？<\/summary>\n<div><p>因为恐慌时大家要的是“随时能卖、规模足够大、几乎不会违约”的资产。美国国债市场是全世界最大、流动性最好的债券市场，又以美元计价，而美元是全球的储备货币。别的安全资产（比如德国国债、瑞士国债）规模太小，装不下全球的避险资金。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-32\"><\/a><\/li>\n<li><a href=\"#L9-22\"><\/a><\/li>\n<li><a href=\"#L8-4\"><\/a><\/li>\n<li><a href=\"#L10-4\"><\/a><\/li>\n<\/ul><\/div>\n","9.3":"<div class=\"scene\">\n<p>一家汽车公司要建新工厂，需要 30 亿美元。它可以找几家银行借，也可以在市场上发债，向几百家基金一起借。为什么大公司越来越多地选择发债？<\/p>\n<\/div>\n\n<h2>发债和找银行借，各有什么好处<\/h2>\n<p>发行公司债（corporate bond），等于绕开银行，直接向投资者借钱。好处有几条：<\/p>\n<ul>\n<li><strong>借得多<\/strong>：一次可以借几十亿，一家银行未必愿意承担这么大的单一风险。<\/li>\n<li><strong>借得久<\/strong>：公司债常见 5 年、10 年，甚至 30 年；银行贷款一般更短。<\/li>\n<li><strong>条款宽松<\/strong>：投资级公司发债，限制条款很少；银行贷款常常附带一堆财务约束。<\/li>\n<li><strong>利率固定<\/strong>：多数公司债票息固定，公司可以锁定很多年的融资成本。<\/li>\n<\/ul>\n<p>代价也有：发债要公开披露大量信息，要有评级，要付投行承销费，而且一旦发出去，条款很难改。小公司、或者需要灵活性的公司，还是找银行更方便。<\/p>\n\n<h2>公司债和国债的区别<\/h2>\n<p>最大的区别是违约风险。公司可能经营失败，所以公司债要比同期限国债多付一些利息，这就是信用利差。另外，公司债的交易远没有国债活跃，同一家公司可能有几十只不同的债券，每只每天的成交都不多。<\/p>\n\n<h2>公司债的几个常见类别<\/h2>\n<ul>\n<li><strong>投资级（investment grade）<\/strong>：评级 BBB− 及以上，大多是大型、稳健的公司。<\/li>\n<li><strong>高收益（high yield）<\/strong>：BB+ 及以下，杠杆高、风险大，利息也高。<\/li>\n<li><strong>金融机构债<\/strong>：银行和保险公司发的债，按偿付顺序又分成好几层。<\/li>\n<li><strong>按币种和市场<\/strong>：在美国发的美元债、在欧洲发的欧元债，以及在离岸市场发的各种外币债。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>公司债一般通过投资银行的债务资本市场部（DCM）发行。发行前几天，发行人和投行会做路演或者电话会议，问一问大投资者的兴趣。发行当天早上公布初步价格指引（initial price talk，IPT），比如“国债 +150bp 左右”。订单进来后，如果认购踊跃，利差会往下收，最后定价可能是“+125bp”。整个过程叫簿记建档（bookbuilding）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年疫情期间，美国企业发行了创纪录规模的投资级公司债，超过 1.7 万亿美元。原因是美联储宣布直接购买公司债后，市场迅速恢复，公司们趁利率极低时大举借钱，囤积现金应付不确定的未来。例如苹果、亚马逊这些现金充裕的公司，也在低利率时发行了大额长期债券。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>大公司发债，是为了借得多、借得久、条款宽松、利率固定。<\/li>\n<li>代价是信息公开、要有评级、发行后条款难改。<\/li>\n<li>公司债要比国债多付利差，因为公司可能违约，而且公司债流动性更差。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家现金很多的科技公司，为什么还要发债借钱？<\/summary>\n<div><p>常见原因有：借钱比动用现金便宜，尤其利率很低的时候；现金可能存放在海外，调回国内要交税；用借来的钱回购股票或分红，可以提高股东回报；也可以趁市场条件好，提前锁定很多年的低利率。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-14\"><\/a><\/li>\n<li><a href=\"#L9-15\"><\/a><\/li>\n<li><a href=\"#L9-30\"><\/a><\/li>\n<li><a href=\"#L13-32\"><\/a><\/li>\n<\/ul><\/div>\n","9.4":"<div class=\"scene\">\n<p>你上周花 100 元买了一张五年期债券，每年付 3 元利息。今天，同一家公司又发了一批新债，条件一模一样，只是每年付 4 元。<\/p>\n<p>你想把手里的旧债卖掉。买家会问：我花 100 元能买到每年 4 元的新债，凭什么花 100 元买你每年 3 元的？想卖出去，你只能降价。<\/p>\n<\/div>\n\n<h2>价格和利率是跷跷板的两头<\/h2>\n<p>这就是债券最重要的一条规律：<strong>市场利率上升，已经发行的债券价格下跌；市场利率下降，价格上涨。<\/strong>两者反方向变动（inverse relationship）。<\/p>\n<p>原因很简单。旧债券的票息是写死的，不会跟着市场变。市场利率涨了，旧债的票息显得寒酸，只能靠降价来弥补。降多少？降到新买家买入后，算上票息和到期时收回 100 元的差价，整体回报刚好和新债一样。<\/p>\n<p>反过来，如果市场利率跌到 2%，你手里每年付 3 元的旧债就成了香饽饽，别人愿意多花钱买，价格就会涨过 100。<\/p>\n\n<h2>期限越长，跌得越厉害<\/h2>\n<p>同样是利率涨 1 个百分点，一年后到期的债和三十年后到期的债，受伤程度差很多。<\/p>\n<p>一年期的债，你只是少拿一年的利息，很快就到期拿回本金了，价格只需要降一点点。三十年期的债，你要连续三十年少拿利息，这个损失要一次性体现在今天的价格里，所以价格要降很多。<\/p>\n<p>可以把期限想成跷跷板的长度：板子越长，另一头被压下去时，这一头翘得越高。衡量这块板子有多长的指标，叫久期（duration），我们后面专门讲。<\/p>\n\n<h2>跌了就是亏了吗<\/h2>\n<p>要分两种情况。<\/p>\n<p>如果你一直拿到到期，发行人也没有违约，你最后还是能拿回 100 元，每年的利息也一分不少。中间的价格下跌，对你来说只是账面上的亏损，叫未实现亏损（unrealized loss）。真正的代价是机会成本：别人买新债每年拿 4 元，你只拿 3 元。<\/p>\n<p>但如果你中途被迫卖出，比如急需现金，账面亏损就变成了真金白银的亏损（realized loss）。很多金融机构的麻烦，恰恰出在“被迫卖出”这一步。<\/p>\n\n<div class=\"desk\">\n<p>交易台上的债券每天都按当天的市场价格重新估值，叫按市值计价（mark-to-market）。利率一动，整本账（book）的价值马上跟着动。所以交易员和风控每天早上第一件事，就是看利率昨晚怎么走的。<\/p>\n<p>说法上，“债券涨了”和“收益率跌了”是同一件事。交易员常说“债市走强”（rally），指价格上涨、收益率下降；“债市抛售”（sell-off）则相反。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2022 年，债券投资者的噩梦。<\/strong>为了对付高通胀，美联储一年内把政策利率从接近 0 加到 4% 以上。美国 10 年期国债收益率从年初约 1.5% 升到年底约 3.9%。结果，衡量美国债券市场整体表现的彭博美国综合债券指数全年下跌约 13%，是有记录以来最差的一年。长期国债跌得更惨，跟踪 20 年以上美国国债的基金全年跌了约 30%。<\/p>\n<p>一年后，硅谷银行（SVB）倒闭。它在低利率时期买了大量长期债券，利率上升后这些债券出现巨额账面亏损。储户开始挤兑，银行被迫卖债筹钱，账面亏损变成了真亏损，最终在 2023 年 3 月倒下。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>市场利率上升，旧债券价格下跌，因为旧债的票息是写死的。<\/li>\n<li>期限越长，价格对利率越敏感。<\/li>\n<li>拿到到期不会亏本金，被迫中途卖出才会把账面亏损变成真亏损。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家养老金几十年后才需要付钱给退休的人，它为什么反而喜欢买长期债券，不太担心利率上涨带来的价格下跌？<\/summary>\n<div><p>因为养老金的负债（未来要付的养老金）也很长，利率上升时，负债的现值同样会下降。资产和负债一起变小，净值受的影响就小。而且养老金一般不需要中途卖债，可以拿到到期。对它来说，更大的风险是利率下降：负债变大，而如果手里都是短期债，到期后只能以更低的利率再投资。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-12\"><\/a><\/li>\n<li><a href=\"#L9-35\"><\/a><\/li>\n<li><a href=\"#L9-41\"><\/a><\/li>\n<\/ul><\/div>\n","9.5":"<div class=\"scene\">\n<p>有两张债券摆在你面前，都是一年后到期。<\/p>\n<p>A：票息 5%，价格 105。<br>B：票息 3%，价格 95。<\/p>\n<p>A 的利息高，看起来更划算。但 A 到期只还你 100，你花了 105，要倒亏 5 块；B 到期还你 100，你只花了 95，白赚 5 块。到底哪张好？光看票息回答不了。我们需要一个能把“利息”和“买入价与到期价的差距”放在一起算的数字。这个数字就是<strong>收益率（yield）<\/strong>。<\/p>\n<\/div>\n\n<h2>到期收益率：持有到期，平均每年赚多少<\/h2>\n<p>最常用的收益率叫到期收益率（yield to maturity，YTM）。它回答的问题是：如果我今天按这个价格买入，一直拿到到期，期间所有的利息加上最后收回的本金，折合下来平均每年回报多少？<\/p>\n<p>用开头的例子粗略算一下：<\/p>\n<ul>\n<li>A：拿 5 块利息，到期少拿回 5 块，一年下来基本白忙，收益率接近 0。<\/li>\n<li>B：拿 3 块利息，到期多拿回 5 块，一共 8 块，相对 95 的成本，收益率约 8.4%。<\/li>\n<\/ul>\n<p>所以 B 好得多。票息只告诉你每年付多少利息，收益率才告诉你这笔投资整体值不值。<\/p>\n\n<h2>交易员报的是收益率，不是价格<\/h2>\n<p>债券的票息五花八门，到期日也各不相同，直接比价格没有意义。所以债券市场习惯直接报收益率。“十年期美债 4.2%”，说的就是十年期美国国债的到期收益率是 4.2%。<\/p>\n<p>上一课讲过，价格和收益率是跷跷板的两头。价格跌，收益率就涨；价格涨，收益率就跌。新闻里说“美债收益率飙升”，意思就是美债在被抛售、价格在跌。<\/p>\n\n<h2>还有两种收益率你会经常听到<\/h2>\n<p><strong>当期收益率（current yield）<\/strong>：票息除以价格。B 是 3 ÷ 95 ≈ 3.2%。它只看今年拿到的利息，不管到期时的差价，算起来简单，但会误导人。高票息、高价格的债券，当期收益率看起来很漂亮，实际回报可能很差。<\/p>\n<p><strong>最差收益率（yield to worst）<\/strong>：有些债券允许发行人提前还钱，叫可赎回债券（callable bond）。利率下跌时，发行人会提前还掉高息旧债，再借便宜的新钱。对投资者来说，这意味着高利息可能拿不满。最差收益率就是在所有可能的提前赎回日里，挑出对你最不利的那个收益率。买可赎回债，看的就是它。<\/p>\n\n<h2>收益率背后的假设<\/h2>\n<p>到期收益率是一个“如果一切按计划”的数字。它默认三件事：你一直拿到到期；发行人不违约；你拿到的每一笔利息，都能按同样的收益率再投资出去。现实中这三件事都可能不成立。所以一张高收益率的公司债，往往不是“更赚钱”，而是“市场觉得它更可能出问题”。这一点我们在讲信用利差时再展开。<\/p>\n\n<div class=\"desk\">\n<p>在交易台和风险报告里，收益率的变化用基点（basis point，bp）衡量，1bp = 0.01%。“十年期涨了 8 个 bp”，意思是收益率从 4.20% 变成了 4.28%。<\/p>\n<p>债券临近到期时，价格会慢慢向 100 靠拢，因为到期那天无论如何都按 100 还钱。这个现象叫向面值回归（pull to par）。高于 100 买入的债券，这段时间会慢慢“掉价”；低于 100 买入的，会慢慢“涨价”。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年疫情期间，欧洲有大量债券的收益率是负数。德国 10 年期国债收益率在 2019 年到 2021 年的大部分时间里都低于 0，2019 年 8 月一度跌到约 −0.7%。负收益率意味着：如果你今天买入并持有到期，你收回的钱会比付出去的还少。投资者仍然愿意买，因为把大笔现金存在银行也要付费，而德国国债被认为几乎没有违约风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>票息只说明每年付多少利息，收益率才说明这笔投资整体值多少。<\/li>\n<li>债券市场直接报收益率；收益率涨就是价格跌。<\/li>\n<li>到期收益率假设一切按计划进行，收益率特别高的债券，往往风险也特别高。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两只可赎回债券，到期收益率都是 6%，但 A 的最差收益率是 5.9%，B 的是 3%。你更愿意买哪只？为什么？<\/summary>\n<div><p>A。B 的最差收益率远低于到期收益率，说明它很可能被发行人提前赎回：价格明显高于赎回价，一旦被赎回，你的实际回报只有 3% 左右。A 的两个数字差不多，说明提前赎回对你影响不大。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-6\"><\/a><\/li>\n<li><a href=\"#L9-20\"><\/a><\/li>\n<li><a href=\"#L9-37\"><\/a><\/li>\n<\/ul><\/div>\n","9.6":"<div class=\"scene\">\n<p>你在 3 月 1 日买了一张债券，屏幕上的报价是 99.50。结算时却发现要付 100.75。多出来的 1.25 是什么？是你要替卖家补上的利息。<\/p>\n<\/div>\n\n<h2>净价和全价<\/h2>\n<p>债券的利息通常每半年或每年付一次，但债券每天都在交易。假设一只债券每年 9 月 1 日付一次 3 元利息。你在 3 月 1 日买入，到 9 月 1 日会拿到全年 3 元利息，可是前半年你并没有持有它。所以买的时候，你要先把前半年的利息（约 1.5 元）付给卖家。这部分叫应计利息（accrued interest）。<\/p>\n<ul>\n<li><strong>净价（clean price）<\/strong>：屏幕上的报价，不含应计利息。<\/li>\n<li><strong>全价（dirty price，也叫 full price）<\/strong>：实际要付的钱，等于净价加应计利息。<\/li>\n<\/ul>\n<p>市场报净价，是因为全价每天都会因为利息累积而上涨，到付息日又突然下跌，看起来像价格在剧烈波动。用净价，价格的变化只反映市场利率和信用的变化，更容易比较。<\/p>\n\n<h2>利息按什么规则算：计息惯例<\/h2>\n<p>“前半年的利息”具体是多少天、怎么算，取决于计息惯例（day count convention）。不同市场规定不同：<\/p>\n<div class=\"tbl\"><table>\n<tr><th>惯例<\/th><th>怎么算<\/th><th>常见于<\/th><\/tr>\n<tr><td>Actual/Actual<\/td><td>按实际天数，除以实际一个付息期的天数<\/td><td>美国国债、很多政府债<\/td><\/tr>\n<tr><td>30/360<\/td><td>每月按 30 天、每年按 360 天算<\/td><td>美国公司债、部分欧洲债券<\/td><\/tr>\n<tr><td>Actual/360<\/td><td>按实际天数，一年按 360 天<\/td><td>货币市场、浮息债<\/td><\/tr>\n<tr><td>Actual/365<\/td><td>按实际天数，一年按 365 天<\/td><td>英镑市场<\/td><\/tr>\n<\/table><\/div>\n<p>差别看起来很小，但交易金额动辄上亿，几天的利息差就是几万美元。<\/p>\n\n<h2>结算日和交易日<\/h2>\n<p>应计利息算到结算日（settlement date），不是交易日（trade date）。美国国债一般是交易后第一个工作日结算（T+1），不同市场、不同产品规定不一样。<\/p>\n\n<div class=\"desk\">\n<p>交易员报价有几种方式：报净价（“99-16”，美国国债用 1/32 计价，99-16 就是 99.5）；报收益率（“4.25%”）；公司债常报利差（“+125”）。系统会根据你报的数字，自动算出全价和要付的现金。<\/p>\n<p>后台最常见的差错之一，就是计息惯例或结算日设错，导致应计利息算错、现金对不上。核对时，先看这两项。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美国国债的价格一直按 1/32 美元报价，这是从早年的分数报价传统沿袭下来的；而美国股票直到 2001 年才完成从分数报价到小数报价的转换。所以今天你还会在交易台上听到“99 和 16”这样的说法，意思是 99 又 16/32。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>净价是报价，全价是实际付的钱，差额是应计利息。<\/li>\n<li>应计利息按计息惯例算到结算日，不同市场规则不同。<\/li>\n<li>美国国债按 1/32 报价；交易员也常直接报收益率或利差。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只债券在付息日的前一天和后一天，净价都是 100。全价会怎样变化？<\/summary>\n<div><p>付息前一天，全价接近 100 加上将近半年（或一年）的应计利息；付息后一天，应计利息归零，全价回到 100 左右。全价“跳水”，是因为利息已经付出去了，并不代表亏钱。这正是市场用净价报价的原因。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-5\"><\/a><\/li>\n<li><a href=\"#L17-13\"><\/a><\/li>\n<li><a href=\"#L17-15\"><\/a><\/li>\n<\/ul><\/div>\n","9.7":"<div class=\"scene\">\n<p>你去银行存定期。一年期利率 2%，五年期 2.8%，三十年期 3.5%（假设数字）。同一家银行、同一个人，存得越久，利息越高。<\/p>\n<p>把美国政府借 1 个月、1 年、2 年、5 年、10 年、30 年的利率都画在一张图上，横轴是期限，纵轴是收益率，连起来的这条线，就是<strong>收益率曲线（yield curve）<\/strong>。它可能是整个金融市场被看得最多的一张图。<\/p>\n<\/div>\n\n<h2>正常情况下，曲线向上倾斜<\/h2>\n<p>多数时候，借得越久利率越高，曲线从左下往右上走，叫向上倾斜（upward sloping）。原因有两个：<\/p>\n<ul>\n<li><strong>时间越长，不确定性越大。<\/strong>十年里通胀、经济、政策都可能变，把钱借出去这么久，投资者要多拿一点补偿。这部分额外补偿叫期限溢价（term premium）。<\/li>\n<li><strong>市场预期未来利率会上升。<\/strong>如果大家觉得央行以后会加息，长期利率现在就会先涨上去。<\/li>\n<\/ul>\n\n<h2>短端听央行的，长端听经济的<\/h2>\n<p>这是看懂收益率曲线最有用的一句话。<\/p>\n<p><strong>短端（front end）<\/strong>，也就是 2 年以内的利率，主要跟着央行的政策利率走。央行一加息，短端几乎马上跟着涨。<\/p>\n<p><strong>长端（long end）<\/strong>，也就是 10 年、30 年的利率，取决于市场对未来十几年增长和通胀的判断，以及政府要发多少长期国债。央行能直接管住的，主要是短端。<\/p>\n<p>所以同一天里，短端和长端可能朝不同方向走。央行加息，短端上涨；但如果市场担心加息会把经济压垮，长端反而可能下跌。<\/p>\n\n<h2>曲线的几种形状<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>形状<\/th><th>长什么样<\/th><th>市场在想什么<\/th><\/tr>\n<tr><td>正常（normal）<\/td><td>长端高于短端<\/td><td>经济平稳，未来利率可能上升<\/td><\/tr>\n<tr><td>平坦（flat）<\/td><td>长短端差不多<\/td><td>处在转折点，方向不明<\/td><\/tr>\n<tr><td>倒挂（inverted）<\/td><td>短端高于长端<\/td><td>央行利率很高，但市场预计以后要降息，经济可能放缓<\/td><\/tr>\n<\/table><\/div>\n<p>曲线形状的变化也有专门的说法。长短端利差扩大叫变陡（steepen），缩小叫变平（flatten）。再加上利率整体是涨还是跌，就有了交易员常说的四个组合：牛陡（bull steepening，短端跌得更多）、熊陡（bear steepening，长端涨得更多）、牛平（bull flattening，长端跌得更多）、熊平（bear flattening，短端涨得更多）。“牛”指债券价格上涨，也就是利率下降。<\/p>\n\n<div class=\"desk\">\n<p>交易员习惯用两个期限的利差来代表曲线形状，最常见的是“2s10s”：10 年期收益率减 2 年期收益率。2s10s 是正数，曲线正常；是负数，曲线倒挂。<\/p>\n<p>很多交易不赌利率整体涨跌，只赌曲线的形状，叫曲线交易（curve trade）。比如认为曲线会变陡，就买入 2 年期、卖出 10 年期，两边的利率风险大致抵消，只留下对“陡还是平”的判断。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美国的 2s10s 从 2022 年 7 月开始倒挂，一直持续到 2024 年下半年，前后两年多，是有记录以来最长的一次倒挂。过去几十年，美国几乎每次衰退前曲线都会倒挂，所以倒挂常被称为“衰退信号”。这一次倒挂之后，美国经济并没有马上陷入衰退。这说明曲线反映的是市场的预期和担心，它是一个重要信号，但不是预言。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>收益率曲线把不同期限的利率画在一起，正常情况下向上倾斜。<\/li>\n<li>短端跟着央行走，长端跟着增长、通胀预期和国债供给走。<\/li>\n<li>倒挂说明市场预计未来要降息、经济可能放缓，是信号而不是预言。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>央行宣布加息，当天 2 年期国债收益率涨了 15bp，10 年期只涨了 3bp。曲线发生了什么变化？市场可能在想什么？<\/summary>\n<div><p>短端涨得比长端多，2s10s 缩小，曲线变平，而且是在利率上升中变平，叫熊平。短端涨，是直接跟着加息走；长端涨得少，说明市场认为加息会压低未来的增长和通胀，长期利率不需要涨那么多。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-8\"><\/a><\/li>\n<li><a href=\"#L9-9\"><\/a><\/li>\n<li><a href=\"#L9-10\"><\/a><\/li>\n<li><a href=\"#L9-42\"><\/a><\/li>\n<li><a href=\"#L9-44\"><\/a><\/li>\n<\/ul><\/div>\n","9.8":"<div class=\"scene\">\n<p>你要算一张 3 年期债券值多少钱。它第 1 年、第 2 年各付 4 元利息，第 3 年付 104 元。用同一个利率把三笔钱折回今天，可以吗？<\/p>\n<p>严格说不行。1 年后的钱、2 年后的钱、3 年后的钱，各自应该用对应期限的利率折现。这就引出三种看起来相似、用途不同的利率：<strong>即期利率、平价利率和远期利率<\/strong>。<\/p>\n<\/div>\n\n<h2>即期利率：今天借、某天一次还清<\/h2>\n<p>即期利率（spot rate），也叫零息利率（zero rate），是“今天借钱、到某一天连本带利一次还清、中间不付利息”的利率。它对应的就是零息债券的收益率。<\/p>\n<p>每个期限都有自己的即期利率：1 年期即期利率、2 年期即期利率……连起来是一条即期曲线（spot curve / zero curve）。给债券估值时，第 1 年的现金流用 1 年期即期利率折现，第 2 年的用 2 年期，以此类推。这是最“干净”的估值方法。<\/p>\n\n<h2>平价利率：让债券刚好卖 100 的票息<\/h2>\n<p>平价利率（par rate）是：要让一张某期限的债券正好按面值 100 发行，票息应该定多少。新发行的国债和利率互换的报价，本质上都是平价利率。所以市场上直接看到的，多半是平价曲线（par curve）。<\/p>\n<p>即期曲线通常不能直接观察，而是从平价利率一步步倒推出来，这个过程叫“剥离”（bootstrapping）。<\/p>\n\n<h2>远期利率：今天约定未来的利率<\/h2>\n<p>远期利率（forward rate）是隐含在今天的曲线里、对未来某段时间的利率。比如 1 年期利率 3%，2 年期即期利率 4%，那么市场隐含的“1 年后开始、为期 1 年”的利率大约是 5%。原因是：先借 1 年 3%、再借 1 年 5%，平均下来和直接借 2 年 4% 差不多，两种做法的回报应该一样，否则就有套利。<\/p>\n<p>远期利率常被解读为“市场对未来利率的预期”，但它里面还混着期限溢价，不能完全当作预测。<\/p>\n\n<div class=\"desk\">\n<p>交易台的估值和风险系统，几乎都是先建一条（或几条）即期曲线，再用它给所有产品估值。远期利率则直接用在远期利率协议（FRA）、利率期货和互换的定价上。<\/p>\n<p>交易员常说“市场在价格里计入了几次降息”，就是从短端的远期利率反推出来的：比如 6 个月后的远期利率比现在低 50bp，说明市场预期半年内大约降息两次（每次 25bp）。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美联储每次议息会议前后，新闻里都会说“市场预期年内降息几次”。这个数字通常来自联邦基金利率期货和隔夜指数互换（OIS）的价格，本质上就是一组短期远期利率。2024 年初，市场一度预期美联储当年会降息六次左右，而实际全年降息三次（合计 100bp，从 9 月开始）。远期利率反映的是当时的预期，预期本身会随着数据不断修正。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>即期利率是某个期限一次还本付息的利率，是给现金流折现最干净的工具。<\/li>\n<li>平价利率是让债券按面值发行的票息，市场上直接看到的多半是它。<\/li>\n<li>远期利率隐含在今天的曲线里，常被当作市场对未来利率的预期，但混有期限溢价。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>如果收益率曲线是倒挂的（短期利率高于长期利率），远期利率大概是什么样？说明市场在预期什么？<\/summary>\n<div><p>远期利率会低于今天的短期利率，而且越往后越低。这说明市场预期未来短期利率会下降，也就是央行会降息，常常对应着对经济放缓的担心。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-9\"><\/a><\/li>\n<li><a href=\"#L9-11\"><\/a><\/li>\n<li><a href=\"#L9-40\"><\/a><\/li>\n<li><a href=\"#L16-5\"><\/a><\/li>\n<\/ul><\/div>\n","9.9":"<div class=\"scene\">\n<p>收益率曲线为什么大多数时候向上倾斜，有时又会倒挂？经济学家给出了三种解释。它们各自说对了一部分，合在一起，就是交易员脑子里理解曲线的方式。<\/p>\n<\/div>\n\n<h2>解释一：预期假说<\/h2>\n<p>预期假说（expectations hypothesis）认为：长期利率就是未来一连串短期利率预期的平均。如果大家预期央行未来会加息，长期利率现在就会高于短期利率，曲线向上倾斜；预期会降息，曲线就会倒挂。<\/p>\n<p>道理很简单：借 2 年，和先借 1 年、到期再借 1 年，结果应该差不多，否则大家都会选更划算的那条路。<\/p>\n<p>这个解释抓住了核心，但有一个问题：如果它完全正确，曲线向上和向下的时间应该差不多。现实中，曲线向上的时候多得多。<\/p>\n\n<h2>解释二：流动性溢价（期限溢价）<\/h2>\n<p>流动性溢价理论（liquidity premium theory）补上了这个缺口：把钱借出去越久，风险越大（通胀、利率可能大变），投资者要多拿一点补偿。所以长期利率 = 未来短期利率的预期平均 + 一块额外的溢价。这块溢价今天一般叫期限溢价（term premium）。<\/p>\n<p>有了期限溢价，即使市场预期利率不变，曲线也会略微向上。只有当市场预期大幅降息、降息的影响盖过期限溢价时，曲线才会倒挂。<\/p>\n\n<h2>解释三：市场分割<\/h2>\n<p>市场分割理论（market segmentation）认为：不同期限的债券由不同的投资者在买。银行和货币基金买短期，养老金和保险公司买长期，各自有固定的偏好，很少跨区。所以每个期限的利率由那一段的供求决定。<\/p>\n<p>它的温和版本叫优先栖息地理论（preferred habitat）：投资者有偏好的期限，但如果另一段的收益足够诱人，也会过去。<\/p>\n<p>这个解释在现实里很有用。例如英国养老金对超长期国债需求很大，曾经把 50 年期国债的收益率压得很低；央行大规模购买长期国债（QE），也是通过改变长端供求来压低长期利率。<\/p>\n\n<div class=\"desk\">\n<p>交易员看曲线，基本就是三条一起用：短端看市场预期的央行路径（预期）；长端还要看期限溢价，它会随通胀不确定性、政府发债规模而变；某些期限出现异常时，往往是特定投资者的需求或供给（分割）。比如政府宣布要多发长期国债，长端收益率往往上升，曲线变陡，这就是供给推高了期限溢价。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2023 年夏秋，美国 10 年期国债收益率从约 3.8% 快速升到 10 月的约 5%，是 2007 年以来最高。这期间美联储加息已经接近尾声，市场对未来短期利率的预期变化并不大。很多分析认为，这次上涨主要来自期限溢价回升：美国财政部宣布扩大长期国债发行，投资者担心财政赤字，要求更多补偿。这是一个“预期假说解释不了，期限溢价解释得了”的例子。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>预期假说：长期利率 ≈ 未来短期利率预期的平均。<\/li>\n<li>期限溢价：借得越久要多拿补偿，所以曲线通常向上倾斜。<\/li>\n<li>市场分割：不同期限有不同的买家，供求变化会单独推动某一段曲线。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>央行已经明确表示接下来一年不会加息，但 10 年期国债收益率却上升了 50bp。可以用哪种理论解释？<\/summary>\n<div><p>预期假说很难解释，因为短期利率预期没变。更可能是期限溢价上升：通胀不确定性增加、政府发债增多，或者大买家（比如外国央行、央行自己的 QE）减少购买。这就是期限溢价和市场分割在起作用。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-7\"><\/a><\/li>\n<li><a href=\"#L9-8\"><\/a><\/li>\n<li><a href=\"#L9-44\"><\/a><\/li>\n<\/ul><\/div>\n","9.10":"<div class=\"scene\">\n<p>你买了一张 5 年期国债，收益率 4%。一年过去了，市场利率一点没变。这一年你赚了多少？<\/p>\n<p>直觉上是 4%。但如果收益率曲线向上倾斜，你很可能赚得比 4% 多。多出来的那部分，来自债券沿着曲线“滑下来”。<\/p>\n<\/div>\n\n<h2>持有收益：什么都不变，你也在赚钱<\/h2>\n<p>持有收益（carry）是指：如果市场什么都不变，持有这个仓位一段时间能赚多少。对债券来说，最直接的就是票息收入，减去为买债借钱的融资成本（比如回购利率）。<\/p>\n<ul>\n<li>票息 4%，回购融资 3%，持有收益为正，叫正持有（positive carry）。<\/li>\n<li>票息 4%，融资成本 5%，持有收益为负，每天都在“付钱”等待。<\/li>\n<\/ul>\n\n<h2>骑乘效应：债券沿着曲线往下滑<\/h2>\n<p>一年后，你手里的 5 年期债券变成了 4 年期债券。如果曲线向上倾斜，4 年期的收益率本来就比 5 年期低，比如 3.8%。你的债券现在要按 3.8% 来定价，收益率下降，价格就上涨。这部分额外的收益叫骑乘效应（roll-down）。<\/p>\n<p>曲线越陡，骑乘效应越大。所以在曲线陡峭的时候，买入期限在“陡坡上方”的债券，即使利率不变也能多赚一些。<\/p>\n\n<h2>两者合起来，是“不变情景”下的回报<\/h2>\n<p>交易员和投资经理评估一笔债券仓位，常说“carry 加 roll-down 是多少”。这是假设整条曲线不动时的预期回报，相当于一个基准：如果利率真的不变，你能赚这么多；如果利率上升，要先吃掉这部分缓冲，才开始亏钱。<\/p>\n\n<div class=\"desk\">\n<p>交易员常把 carry 加 roll-down 换算成“盈亏平衡”的利率变动：比如一个仓位三个月的 carry 加 roll-down 是 15bp，那么只要三个月内收益率上升不超过 15bp，这笔仓位就不亏。这个数字帮助判断：为了这点收益，值不值得承担利率风险。<\/p>\n<p>曲线倒挂时情况相反：短期利率高于长期，持有长期债券的融资成本可能高于票息，carry 为负，roll-down 也可能为负。2022 到 2024 年，很多长债仓位就处在这种“每天倒贴”的状态。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2010 年代，日本和欧洲利率极低、曲线却仍有一定坡度，很多投资者借入短期资金、买入中长期国债，主要就是赚 carry 加 roll-down。这类策略在利率稳定时收益平稳，但一旦利率快速上升，几年积累的收益可能几个月就被吃掉。2022 年全球利率急升，这类仓位普遍遭受重创。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>持有收益（carry）是市场不变时持有仓位的收入，债券主要是票息减融资成本。<\/li>\n<li>骑乘效应（roll-down）是债券变短后沿着向上的曲线滑下来、价格上涨带来的收益。<\/li>\n<li>carry 加 roll-down 是“利率不变”时的回报，也是利率上升前的缓冲垫。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>收益率曲线在 2 年到 5 年之间很陡，5 年到 10 年之间很平。只考虑骑乘效应，买 5 年期还是 10 年期更划算？<\/summary>\n<div><p>买 5 年期。一年后它变成 4 年期，落在陡峭的那一段，收益率下降得多，价格涨得多。10 年期变成 9 年期，那一段曲线很平，收益率几乎不变，骑乘效应很小。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-7\"><\/a><\/li>\n<li><a href=\"#L10-4\"><\/a><\/li>\n<li><a href=\"#L9-42\"><\/a><\/li>\n<\/ul><\/div>\n","9.11":"<div class=\"scene\">\n<p>有一种债券，中间一分钱利息都不付。你今天花 70 元买入，10 年后拿回 100 元。那 30 元的差价，就是你的全部回报。这就是<strong>零息债（zero-coupon bond）<\/strong>。<\/p>\n<\/div>\n\n<h2>零息债：折价买入，到期按面值收回<\/h2>\n<p>零息债没有票息，靠折价发行给投资者回报。期限越长、利率越高，折价越多。<\/p>\n<p>它有三个鲜明的特点：<\/p>\n<ul>\n<li><strong>没有再投资风险<\/strong>：普通债券每年付利息，利息要拿去再投资，未来的利率不确定。零息债只有一笔到期现金流，买入时的收益率就是持有到期的确定回报。<\/li>\n<li><strong>久期最长<\/strong>：所有的钱都在最后才回来，所以零息债的久期就等于它的期限，对利率最敏感。<\/li>\n<li><strong>最适合匹配未来某一天的支出<\/strong>：10 年后要付一笔钱，买一张 10 年后到期的零息债，正好对上。<\/li>\n<\/ul>\n\n<h2>本息分离：把一张债拆成一串零息债<\/h2>\n<p>一张 10 年期、每半年付息的国债，其实是 21 笔未来的现金流：20 笔利息加 1 笔本金。如果把每一笔都拆开单独卖，每一笔就是一张零息债。<\/p>\n<p>美国财政部允许把国债这样拆分，拆出来的零息债叫 STRIPS（Separate Trading of Registered Interest and Principal of Securities）。只来自利息的叫利息本息分离（coupon strips），来自本金的叫本金本息分离（principal strips）。拆开后还可以重新组合回原来的债券。<\/p>\n\n<h2>为什么市场需要它<\/h2>\n<ul>\n<li><strong>养老金和保险公司<\/strong>：用来精确匹配几十年后的支付，管理利率风险。<\/li>\n<li><strong>想要高久期的投资者<\/strong>：同样的钱，买 30 年期零息债，得到的利率敏感度远高于普通 30 年期国债。<\/li>\n<li><strong>估值的基础<\/strong>：零息债的收益率就是即期利率，是给所有现金流折现的出发点。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>零息债价格对利率极其敏感，所以交易时要特别注意 DV01。投入同样多的钱，30 年期零息债的 DV01 大约是普通 30 年期国债的 1.7 倍（利率 4% 左右时）。按面值比则相反：30 年期零息债的价格只有面值的三成左右，同样面值下它的 DV01 反而更小。所以比较时一定要说清是“同样投入”还是“同样面值”。<\/p>\n<p>税务上也要留意：很多国家规定，零息债虽然中间不付钱，投资者仍要每年按“应计的折价摊销”交税，叫“影子利息”（phantom income）。所以零息债常被放在免税账户或养老金里持有。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美国 STRIPS 项目始于 1985 年。在此之前，华尔街的投行已经自己动手：买入国债、存放在托管行，再发行代表各笔现金流的凭证，起了各种动物名字，比如美林的 TIGRs 和所罗门兄弟的 CATS。财政部看到需求巨大，干脆推出官方的 STRIPS，让拆分更简单透明。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>零息债没有票息，折价买入、到期按面值收回，没有再投资风险。<\/li>\n<li>零息债的久期等于期限，对利率最敏感。<\/li>\n<li>本息分离把一张附息国债拆成一串零息债，养老金和保险公司用它精确匹配未来的支出。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家保险公司 20 年后要赔付一大笔钱。买 20 年期零息国债，和买 20 年期普通国债，哪个更能锁定结果？<\/summary>\n<div><p>零息国债。它在 20 年后正好一次性支付，金额确定，中间没有利息需要再投资。普通国债每年付利息，这些利息未来能按什么利率再投资是不确定的，最终能攒下多少钱也就不确定。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-8\"><\/a><\/li>\n<li><a href=\"#L9-12\"><\/a><\/li>\n<li><a href=\"#L9-48\"><\/a><\/li>\n<\/ul><\/div>\n","9.12":"<div class=\"scene\">\n<p>你的老板问你：“我们这个债券组合，利率再涨 1%，会亏多少？”<\/p>\n<p>组合里有两百只债券，期限从三个月到三十年都有，票息也各不相同。一只一只算太慢。你需要一个数字，一眼就能说清楚整个组合对利率有多敏感。这个数字就是<strong>久期（duration）<\/strong>。<\/p>\n<\/div>\n\n<h2>久期就是跷跷板的长度<\/h2>\n<p>我们说过，利率和债券价格像跷跷板的两头。久期衡量的就是这块板子有多长。<\/p>\n<p>用一句话记住它的用法：<strong>利率变动 1 个百分点，债券价格大约反向变动“久期”个百分点。<\/strong><\/p>\n<p>一只久期为 7 的债券，利率涨 1%，价格大约跌 7%；利率跌 0.5%，价格大约涨 3.5%。一个组合的久期是 5，利率涨 1%，整个组合大约跌 5%。老板的问题，一句话就答完了。<\/p>\n\n<h2>什么让久期变长或变短<\/h2>\n<ul>\n<li><strong>期限越长，久期越长。<\/strong>钱要很久以后才回来，受利率影响的时间就长。<\/li>\n<li><strong>票息越低，久期越长。<\/strong>票息低，意味着大部分的钱要等到最后还本金时才拿到，等得更久。<\/li>\n<li><strong>零息债的久期就等于它的期限。<\/strong>十年期零息债，中间一分钱利息都没有，所有的钱都在第十年才回来，久期就是 10。<\/li>\n<li><strong>利率越高，久期越短。<\/strong>高利率下，近期的现金流在价值里占比更大，远期的钱被打折得更厉害。<\/li>\n<\/ul>\n<p>你会听到两个名字：麦考利久期（Macaulay duration），可以理解为“平均要等几年才能拿回钱”；修正久期（modified duration），就是上面“利率动 1%，价格动百分之几”的那个用法。日常工作里说“久期”，多数时候指修正久期。<\/p>\n\n<h2>久期是怎么用来表达观点的<\/h2>\n<p>对投资经理来说，久期不只是风险指标，也是表达观点的工具。<\/p>\n<ul>\n<li>看好债券、认为利率要下降：<strong>拉长久期（extend duration）<\/strong>，多买长期债，利率下降时赚得更多。<\/li>\n<li>担心利率上升：<strong>缩短久期（shorten duration）<\/strong>，换成短期债，或者用国债期货对冲掉一部分久期。<\/li>\n<\/ul>\n<p>基金的业绩基准（benchmark）通常有一个久期，比如 6。基金经理会说“我们比基准长 0.5 年”，意思是组合久期是 6.5，比基准多押了一点利率下降。<\/p>\n\n<div class=\"desk\">\n<p>风险报告里，久期常常和另一个指标 DV01 一起出现。久期说的是百分比（跌 7%），DV01 说的是金额（亏多少钱）。管一个组合的投资经理常用久期，管一本交易账的交易员和风控更常用 DV01。下一课专门讲 DV01。<\/p>\n<p>久期是一个近似。利率小幅变动时很准，大幅变动时会有偏差，因为价格和利率的关系是一条曲线，而不是直线。这条曲线的弯曲程度叫凸性（convexity），放在进阶课里讲。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年英国养老金危机。很多英国养老金用一种叫负债驱动投资（LDI）的策略，借钱加杠杆持有超长期英国国债，久期非常长。9 月 23 日英国政府公布大规模减税计划，市场担心政府要大量借钱，30 年期国债收益率在几天内上涨了超过 1 个百分点。久期极长的持仓价格暴跌，养老金被要求追加大量抵押品，只能卖出更多国债筹钱，又进一步压低了价格。9 月 28 日，英格兰银行宣布临时买入长期国债，才止住了这轮螺旋。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>久期衡量债券对利率的敏感程度：利率动 1%，价格大约反向动“久期”个百分点。<\/li>\n<li>期限越长、票息越低，久期越长；零息债的久期就是它的期限。<\/li>\n<li>投资经理用拉长或缩短久期，来表达对利率走向的判断。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只 10 年期、票息 6% 的债券，和一只 10 年期零息债，哪个久期更长？如果你预计利率会大幅下降，应该买哪个？<\/summary>\n<div><p>零息债的久期更长，就是 10；6% 票息的债券每年都有利息回来，久期明显短于 10。预计利率大幅下降，应该买零息债，因为久期更长，价格涨得更多。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-13\"><\/a><\/li>\n<li><a href=\"#L9-35\"><\/a><\/li>\n<li><a href=\"#L9-41\"><\/a><\/li>\n<li><a href=\"#L9-48\"><\/a><\/li>\n<\/ul><\/div>\n","9.13":"<div class=\"scene\">\n<p>早上 7 点半，风险报告出来了。你看到一行：“利率账簿 DV01：−52,000 美元”。<\/p>\n<p>交易员走过来问：“昨晚美债收益率涨了 6 个 bp，我们大概亏了多少？”你心里一算：大约 31 万美元。你是怎么这么快算出来的？靠的就是 <strong>DV01<\/strong>。<\/p>\n<\/div>\n\n<h2>DV01：利率动 1 个基点，赚亏多少钱<\/h2>\n<p>DV01 是 dollar value of 01 的缩写，意思是“利率每变动 1 个基点（0.01%），这个仓位的价值变动多少钱”。<\/p>\n<p>它和久期是一回事，只是换了单位。久期说的是百分比，DV01 说的是金额。一只久期为 8 的债券，持有 1 亿美元，利率涨 1bp，价格大约跌 0.08%，也就是亏 8 万美元。这 8 万美元就是它的 DV01。<\/p>\n<p>有了 DV01，估算损益就是一个乘法：<strong>损益 ≈ DV01 × 利率变动了几个基点<\/strong>。开头那份报告按“利率上升 1bp 的损益”来定义 DV01，所以持有债券的多头是负数。DV01 是 −52,000，利率涨了 6bp，损益约 −31 万美元。<\/p>\n\n<h2>交易台为什么离不开它<\/h2>\n<p><strong>第一，能相加。<\/strong>一个交易台上可能同时有国债、公司债、利率互换、期货，面值、期限、币种各不相同。把它们都换算成“利率动 1bp 赚亏多少钱”，就能直接加总，知道整本账的利率风险有多大。<\/p>\n<p><strong>第二，好对冲。<\/strong>想把利率风险对冲掉，就找一个 DV01 大小相等、方向相反的工具。手里的债券 DV01 是 8 万美元，就卖出 DV01 也是 8 万美元的国债期货或利率互换。利率再怎么动，两边大致抵消。<\/p>\n<p><strong>第三，好设限额。<\/strong>风控给交易员定的限额，常常就写成 DV01：“这本账的 DV01 不能超过 10 万美元”。<\/p>\n\n<h2>一个数不够：按期限拆开看<\/h2>\n<p>只看一个总的 DV01，默认整条收益率曲线一起平移。现实中，2 年期和 10 年期经常朝不同方向走。所以风险报告会把 DV01 拆到各个期限上，叫分桶 DV01（bucketed DV01）或关键期限 DV01（key rate DV01）：2 年桶多少、5 年桶多少、10 年桶多少。<\/p>\n<p>一本账的总 DV01 可以是零，但 2 年桶是正的、10 年桶是负的。这样的仓位不怕利率整体平移，却很怕曲线变陡或变平。这种风险叫曲线风险（curve risk），只看总数是看不出来的。<\/p>\n\n<div class=\"desk\">\n<p>拿到别人给的 DV01，先问清楚三件事，这是工作中最容易出错的地方：<\/p>\n<ul>\n<li><strong>正负号怎么定义<\/strong>：有的系统报的是“利率上升 1bp 的损益”，多头债券是负数；有的报绝对值，多头是正数。方向搞反，对冲就会把风险加倍。<\/li>\n<li><strong>单位是什么<\/strong>：整个仓位，还是每 100 万面值；哪种货币。<\/li>\n<li><strong>移动的是什么<\/strong>：到期收益率、零息曲线，还是市场报价的曲线。分桶结果会不同，总数一般接近。<\/li>\n<\/ul>\n<p>名字也不统一：DV01、PV01、BPV 常常混着用。看定义，不看名字。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月，美国国债市场出现罕见的混乱。很多对冲基金做了一种叫“基差交易”（basis trade）的策略：买入国债现货、卖出国债期货，两边的 DV01 基本对冲，只赚两者之间的小价差，再用回购借钱放大很多倍。疫情冲击下，现货和期货的价格关系突然拉开，保证金要求上升，这些基金被迫同时平仓，把大量国债抛向市场。DV01 对冲掉了利率风险，却没有对冲掉流动性和融资的风险。美联储随后大规模买入国债，市场才恢复正常。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>DV01 是利率每动 1 个基点，仓位赚亏多少钱。<\/li>\n<li>它能加总、能用来对冲、能用来设限额，是交易台上最常用的利率风险数字。<\/li>\n<li>只看总 DV01 会漏掉曲线风险；用别人的 DV01 之前，先问清正负号、单位和移动方式。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一本账的总 DV01 接近零，交易员说“我们没有利率风险”。你同意吗？<\/summary>\n<div><p>不一定。总 DV01 接近零，只说明整条曲线平行移动时损益接近零。要看分桶：如果 2 年桶是大额正数、10 年桶是大额负数，曲线一变陡或变平，就会有明显损益。还要看凸性和基差风险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-36\"><\/a><\/li>\n<li><a href=\"#L9-39\"><\/a><\/li>\n<li><a href=\"#L9-43\"><\/a><\/li>\n<li><a href=\"#L24-20\"><\/a><\/li>\n<li><a href=\"#L24-29\"><\/a><\/li>\n<\/ul><\/div>\n","9.14":"<div class=\"scene\">\n<p>你手里有一笔钱，可以借给美国政府十年，也可以借给一家刚起步的航空公司十年。两边都给你 4% 的利息，你会选哪个？<\/p>\n<p>当然借给政府。航空公司要想借到钱，必须多给一点，比如 6.5%。这多出来的 2.5 个百分点，就是<strong>信用利差（credit spread）<\/strong>：借钱的人越让人不放心，利差越大。<\/p>\n<\/div>\n\n<h2>利差 = 公司债收益率 − 同期限国债收益率<\/h2>\n<p>市场通常把本国政府债当作“没有违约风险”的基准。一只公司债的收益率，可以拆成两部分：<\/p>\n<ul>\n<li><strong>无风险利率<\/strong>：同期限国债的收益率，由央行、通胀、经济决定。<\/li>\n<li><strong>信用利差<\/strong>：投资者因为承担这家公司的风险而多要的部分。<\/li>\n<\/ul>\n<p>利差用基点报。“这只债 +250”，意思是比同期限国债高 250bp，也就是 2.5 个百分点。<\/p>\n\n<h2>利差里装着什么<\/h2>\n<p>利差主要补偿三件事：<\/p>\n<ul>\n<li><strong>违约风险（default risk）<\/strong>：公司可能还不上钱。这是最主要的部分。<\/li>\n<li><strong>流动性（liquidity）<\/strong>：公司债的交易远不如国债活跃，想卖的时候不一定能马上按好价钱卖出去。<\/li>\n<li><strong>市场情绪<\/strong>：经济好的时候，大家敢冒险，利差收窄；一有风吹草动，大家抢着买国债、卖公司债，利差马上拉大。<\/li>\n<\/ul>\n<p>所以利差常常比公司本身的经营变化得快。一家公司什么都没变，市场恐慌时它的利差也会走阔。<\/p>\n\n<h2>投资级和高收益<\/h2>\n<p>评级机构给公司打分，从 AAA 往下排。BBB−（穆迪是 Baa3）及以上叫投资级（investment grade，IG），以下叫高收益（high yield，HY），也叫垃圾债（junk bond）。很多保险公司、养老金的规定只能买投资级。所以一家公司从 BBB− 被降到 BB+，会遭遇一大批投资者被迫卖出，利差可能一下子跳很多。这种从投资级跌落的公司，被叫作“堕落天使”（fallen angel）。<\/p>\n\n<div class=\"desk\">\n<p>信用交易员说话用利差，不用价格，也不用总收益率。“这只债收窄了 15”，意思是利差缩小了 15bp，债券变贵了。利差变大叫走阔（widen），变小叫收窄（tighten）。<\/p>\n<p>因为公司债收益率 = 国债收益率 + 利差，持有公司债同时承担两种风险：利率风险和利差风险。风险报告里两者分开报，利率风险看 DV01，利差风险看 CS01（利差每动 1bp 赚亏多少钱）。很多投资者只想要利差风险，会用国债期货或利率互换把利率那部分对冲掉。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年 3 月疫情爆发，市场陷入恐慌。美国高收益债的平均利差从年初的约 3.5 个百分点，在几周内跳到 10 个百分点以上，投资级债券的利差也翻了一倍多。很多公司的业务还没受到实际影响，债券就已经大跌。3 月 23 日，美联储宣布将直接购买公司债，这是它历史上第一次这样做。消息一出，利差迅速收窄，很多公司赶紧趁机发债借钱。2020 年也因此成了美国公司债发行量创纪录的一年。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>信用利差是公司债比同期限国债多给的收益，用来补偿违约风险、流动性和市场情绪。<\/li>\n<li>评级从投资级跌到高收益，会引发被迫卖出，利差可能突然大幅走阔。<\/li>\n<li>公司债同时有利率风险和利差风险，分别用 DV01 和 CS01 来管。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司的经营没有任何变化，但它的债券价格一周跌了 5%。可能是什么原因？<\/summary>\n<div><p>可能是利率风险：国债收益率整体上升。也可能是利差风险：市场情绪转差，整个信用市场的利差走阔；或者同行业有公司出事，市场担心整个行业；或者它被评级机构列入降级观察，投资者担心它跌出投资级。要判断是哪一种，先拆开看：国债收益率动了多少，这只债的利差动了多少。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-15\"><\/a><\/li>\n<li><a href=\"#L9-37\"><\/a><\/li>\n<li><a href=\"#L9-38\"><\/a><\/li>\n<li><a href=\"#L24-21\"><\/a><\/li>\n<\/ul><\/div>\n","9.15":"<div class=\"scene\">\n<p>你想把钱借给一家远在巴西的电力公司。你没时间研究它的财报、管理层和当地监管。有没有人已经帮你研究过，给它打了个分？有，这就是<strong>信用评级（credit rating）<\/strong>。<\/p>\n<\/div>\n\n<h2>三家评级机构，一套字母<\/h2>\n<p>全球市场主要看三家评级机构：标普（S&amp;P）、穆迪（Moody's）、惠誉（Fitch）。它们用一套字母表示借款人按时还钱的能力：<\/p>\n<div class=\"tbl\"><table>\n<tr><th>标普 / 惠誉<\/th><th>穆迪<\/th><th>含义<\/th><\/tr>\n<tr><td>AAA<\/td><td>Aaa<\/td><td>最高，几乎不可能违约<\/td><\/tr>\n<tr><td>AA<\/td><td>Aa<\/td><td>很强<\/td><\/tr>\n<tr><td>A<\/td><td>A<\/td><td>强，但对经济变化更敏感<\/td><\/tr>\n<tr><td>BBB<\/td><td>Baa<\/td><td>足够，投资级的最低一档<\/td><\/tr>\n<tr><td>BB<\/td><td>Ba<\/td><td>投机级开始，面临较大不确定性<\/td><\/tr>\n<tr><td>B<\/td><td>B<\/td><td>目前能还，但很脆弱<\/td><\/tr>\n<tr><td>CCC 及以下<\/td><td>Caa 及以下<\/td><td>违约可能性很高<\/td><\/tr>\n<tr><td>D<\/td><td>—<\/td><td>已经违约<\/td><\/tr>\n<\/table><\/div>\n<p>每一档里还用“+、−”（穆迪用“1、2、3”）细分，比如 BBB+、BBB、BBB−。<\/p>\n\n<h2>投资级的分界线<\/h2>\n<p>BBB−（Baa3）及以上是投资级（investment grade），以下是投机级，也叫高收益（high yield）。这条线极其重要：很多保险公司、养老金、银行的规定只允许持有投资级债券，很多指数也按这条线划分。一家公司从 BBB− 被降到 BB+，大批投资者必须卖出，债券价格可能骤跌。<\/p>\n\n<h2>评级怎么来的，怎么变<\/h2>\n<p>评级机构由发行人付费，分析师研究公司的财务（杠杆、利息覆盖率、现金流）、行业、竞争地位和管理层，由评级委员会投票决定。评级之外，还有展望（outlook，正面、稳定、负面），以及更紧迫的观察名单（watch），提示未来可能调整。<\/p>\n<p>评级反映的是长期判断，变化很慢。市场价格（利差）变化快得多，常常在评级调整之前就已经反映了风险。<\/p>\n\n<div class=\"desk\">\n<p>风险报告和投资限制里到处是评级：按评级分组的敞口、投资级与高收益的比例、单一评级以下的限额。很多机构用“三家中间的那个”或“最低的那个”评级作为内部标准，具体规则要看各家的政策。<\/p>\n<p>评级也直接进入监管资本：在巴塞尔标准法下，银行持有的债券评级越低，风险权重越高，需要的资本越多。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2008 年金融危机中的评级。<\/strong>危机前，大量由次级房贷打包而成的证券拿到了 AAA 评级。房价下跌后，这些证券在短时间内被大幅降级，许多最终出现严重损失。事后的调查指出，“发行人付费”的模式带来利益冲突，模型也低估了房价全国性下跌的可能。这之后，美国和欧盟都加强了对评级机构的监管。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>标普、穆迪、惠誉用字母评级衡量借款人按时还钱的能力。<\/li>\n<li>BBB−（Baa3）是投资级的分界线，跌破它会引发大批被迫卖出。<\/li>\n<li>评级变化慢，市场利差变化快；评级是重要参考，但不能代替自己的判断。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司评级还是 BBB，但它的债券利差已经和 BB 级公司差不多了。这说明什么？<\/summary>\n<div><p>说明市场认为它的信用实际上已经变差，评级机构还没跟上。市场可能在预期它会被降级，或者看到了评级没有反映的风险。这时候按评级管理风险会低估它，按利差看更接近现实。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-14\"><\/a><\/li>\n<li><a href=\"#L9-16\"><\/a><\/li>\n<li><a href=\"#L9-24\"><\/a><\/li>\n<\/ul><\/div>\n","9.16":"<div class=\"scene\">\n<p>你持有的一家零售公司的债券，今天没有按时付利息。新闻标题：“XX 公司违约”。你的债券是不是一文不值了？<\/p>\n<p>通常不是。违约之后，债权人往往还能拿回一部分钱。拿回多少、怎么拿回，取决于公司还剩下什么，以及你排在第几位。<\/p>\n<\/div>\n\n<h2>什么算违约<\/h2>\n<p>违约（default）最常见的是没有按时付利息或本金。但还有其他情形：公司申请破产保护；或者公司和债权人谈成一个比原来差得多的方案，比如延期、减本，评级机构称之为“困境交换”（distressed exchange），也算违约。<\/p>\n<p>多数债券有一个宽限期（grace period），比如 30 天。错过付息日不会立刻构成违约，宽限期过了还没付，才是正式违约。<\/p>\n\n<h2>回收率：违约后能拿回多少<\/h2>\n<p>回收率（recovery rate）是违约后债权人最终拿回的金额占面值的比例。它差别很大：<\/p>\n<ul>\n<li>有担保的银行贷款，回收率常常在 60% 以上。<\/li>\n<li>高级无担保债券，长期平均大约 40% 左右，这也是很多模型的默认假设。<\/li>\n<li>次级债券更低，有时接近零。<\/li>\n<\/ul>\n<p>回收率还取决于行业和时机：资产实在（工厂、土地）的公司回收得多，靠品牌和人才的公司回收得少；整个经济不景气时，资产卖不上价，回收率也低。<\/p>\n\n<h2>重组还是清算<\/h2>\n<p>违约之后有两条路。<strong>重组（restructuring）<\/strong>：公司继续经营，债权人用部分债权换成新债、股权或现金，原来的股东通常被大幅稀释甚至清零。<strong>清算（liquidation）<\/strong>：公司停业，资产变卖，按偿付顺序分钱。多数大公司走的是重组，因为一家还在经营的企业，通常比拆开卖更值钱。<\/p>\n<p>美国的重组主要在《破产法》第 11 章（Chapter 11）下进行，公司可以在法院保护下继续经营，同时和债权人谈判。<\/p>\n\n<div class=\"desk\">\n<p>公司接近违约时，债券价格不再跟着利差走，而是跟着“预计能拿回多少”走。一只债券交易价格 35，基本就是市场对回收率的估计。这时候看 CS01 意义不大，要看违约跳跃风险（JTD）和回收率敏感度。<\/p>\n<p>专门买入这类债券的投资者叫不良债权投资者（distressed investor），他们研究公司的资产、债务结构和法律程序，赌最终回收比价格高。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2008 年雷曼兄弟破产。<\/strong>雷曼申请破产后，债券一度跌到面值的 10% 左右，CDS 结算拍卖确定的回收率约为 8.6%。但破产程序持续了十多年，资产被逐步变卖，高级无担保债权人最终拿回的比例远高于当初的市场价格。这个例子说明：违约后的价格反映的是当时的恐慌和不确定性，最终回收取决于资产处置和漫长的法律程序。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>违约包括不付息、破产、困境交换等情形，通常有一段宽限期。<\/li>\n<li>违约后能拿回多少叫回收率，取决于偿付顺序、担保、行业和时机。<\/li>\n<li>大公司违约多走重组；临近违约时，债券价格跟着预期回收率走。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两家公司同时违约：一家是钢铁厂，有大量厂房设备；一家是软件公司，主要资产是员工和代码。哪家的债权人回收率可能更高？<\/summary>\n<div><p>通常是钢铁厂。它的资产有形、可以变卖或继续使用，有担保的债权人还能直接拿到抵押物。软件公司的价值主要在人和持续经营上，一旦违约，员工离开，价值会迅速消失，能卖的东西很少。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-17\"><\/a><\/li>\n<li><a href=\"#L24-22\"><\/a><\/li>\n<li><a href=\"#L16-24\"><\/a><\/li>\n<\/ul><\/div>\n","9.17":"<div class=\"scene\">\n<p>一家公司破产了，剩下的资产卖了 5 亿。可它欠了银行 3 亿、欠债券投资者 6 亿、欠供应商 1 亿，还有股东。5 亿怎么分？<\/p>\n<p>不是按比例平分，而是排队。排在前面的先拿，拿够了才轮到下一个。这个队伍的顺序，叫<strong>偿付顺序（priority of claims）<\/strong>，也叫资本结构的层级（capital structure）。<\/p>\n<\/div>\n\n<h2>从上到下的队伍<\/h2>\n<div class=\"tbl\"><table>\n<tr><th>层级<\/th><th>典型例子<\/th><th>违约后<\/th><\/tr>\n<tr><td>有担保（secured）<\/td><td>以厂房、存货、应收账款作抵押的银行贷款、有担保债券<\/td><td>先从抵押物里拿钱<\/td><\/tr>\n<tr><td>高级无担保（senior unsecured）<\/td><td>大部分公司债、供应商欠款<\/td><td>抵押物之外的资产，按比例分<\/td><\/tr>\n<tr><td>次级（subordinated）<\/td><td>次级债、银行的二级资本债<\/td><td>高级债权人拿够了才轮到<\/td><\/tr>\n<tr><td>优先股<\/td><td>—<\/td><td>更后<\/td><\/tr>\n<tr><td>普通股<\/td><td>股东<\/td><td>最后，通常一无所获<\/td><\/tr>\n<\/table><\/div>\n<p>越靠上越安全，回收率越高，利息也越低；越靠下风险越大，利息越高。同一家公司的不同债券，利差可以差好几百个基点，原因就在这里。<\/p>\n\n<h2>“结构性次级”：控股公司和子公司<\/h2>\n<p>还有一种不写在债券名字里的排队。大集团往往由一个控股公司（holding company）持有很多子公司（operating company）。子公司的债权人直接对子公司的资产有求偿权；控股公司的债权人只能等子公司还完自己的债、剩下的钱以股东身份分上来。所以即使都叫“高级无担保”，控股公司的债实际上排在子公司的债后面，这叫结构性次级（structural subordination）。<\/p>\n<p>银行业把这一点用到了监管上：大银行的控股公司发债，出事时先由控股公司的债权人吸收损失，以保护子公司里的存款人。<\/p>\n\n<h2>绝对优先，现实里会打折扣<\/h2>\n<p>理论上应该严格按顺序：上一层没拿够，下一层一分不给，叫绝对优先原则（absolute priority rule）。实际重组中，为了尽快达成协议，下层债权人甚至股东有时也能分到一点，作为不捣乱的“好处费”。<\/p>\n\n<div class=\"desk\">\n<p>分析一只公司债，先画出这家公司的资本结构表：每一层有多少债、谁欠谁、有没有担保、在哪个法律实体。然后看自己的债排在哪里、前面有多少，再估计违约后能拿回多少。信用研究报告里常有这样一张表。<\/p>\n<p>风险系统里，同一发行人的不同层级债券会用不同的回收率假设，比如高级 40%、次级 20%，这直接影响违约跳跃风险（JTD）的计算。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2023 年瑞信 AT1 债券被清零。<\/strong>瑞信被瑞银收购时，瑞士监管机构决定将约 160 亿瑞士法郎的 AT1 债券全部减记为零，而股东仍拿到了一部分瑞银股票。这和通常“股东先亏光、债权人后亏”的顺序相反，引起巨大争议。依据是 AT1 债券条款里写明的减记条件。这件事提醒投资者：除了一般的偿付顺序，还要读懂具体债券的合同条款。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>违约后按偿付顺序分钱：有担保、高级无担保、次级、优先股、普通股。<\/li>\n<li>控股公司的债实际上排在子公司的债后面，叫结构性次级。<\/li>\n<li>偿付顺序决定了回收率和利差；但具体合同条款可能改变结果，比如 AT1。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同一家公司有两只 5 年期债券：一只高级无担保，利差 150bp；一只次级，利差 400bp。如果你认为公司不会违约，买哪只？如果你担心它会违约呢？<\/summary>\n<div><p>如果确信不会违约，买次级债，利息高得多，最后同样拿回本金。如果担心违约，买高级债，它排在前面，违约后回收率高得多，次级债可能所剩无几。两者利差的差距，就是市场对这种风险的定价。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-16\"><\/a><\/li>\n<li><a href=\"#L9-29\"><\/a><\/li>\n<li><a href=\"#L24-22\"><\/a><\/li>\n<\/ul><\/div>\n","9.18":"<div class=\"scene\">\n<p>你借钱给朋友开店，除了约好每年付利息，你还会提几个条件：“你不能再找别人借太多钱”“你不能把店里值钱的设备卖了还别人”。债券也一样。这些写在债券合同里的条件，叫<strong>契约条款（covenants）<\/strong>。<\/p>\n<\/div>\n\n<h2>债券合同：契约书<\/h2>\n<p>每只债券都有一份法律合同，美国叫 indenture，英国和欧洲叫 trust deed，规定发行人的义务和投资者的权利。因为债券持有人有成百上千个，合同会指定一个受托人（trustee）代表他们监督发行人、在违约时采取行动。<\/p>\n\n<h2>两类条款：要做的和不能做的<\/h2>\n<p><strong>肯定性条款（affirmative covenants）<\/strong>：发行人必须做的事，比如按时付息、按时提交财报、维持公司存续、给资产上保险。<\/p>\n<p><strong>限制性条款（negative / restrictive covenants）<\/strong>：发行人不能做的事，常见的有：<\/p>\n<ul>\n<li><strong>限制再借债<\/strong>：除非某些财务指标达标（比如利息覆盖率高于 2 倍），否则不能新增债务。<\/li>\n<li><strong>消极担保（negative pledge）<\/strong>：不能把资产抵押给新的债权人，否则现有债权人也要享受同等担保。<\/li>\n<li><strong>限制分红和回购<\/strong>：防止公司把钱分给股东，掏空还债能力。<\/li>\n<li><strong>限制出售资产<\/strong>：卖掉重要资产的钱，要用来还债或再投资。<\/li>\n<li><strong>控制权变更（change of control）<\/strong>：公司被收购时，债券持有人有权要求按 101 赎回。<\/li>\n<\/ul>\n\n<h2>投资级和高收益，条款松紧不同<\/h2>\n<p>投资级公司的债券条款很少，通常只有消极担保等几条，因为市场信任它的信用。高收益债的条款多得多，限制再借债、分红、投资等一整套。银行贷款的条款更严，常包括维持性条款（maintenance covenants）：每个季度都要检查杠杆率等指标，不达标就算违约。债券多是触发性条款（incurrence covenants）：只有在公司要做某件事（比如新借钱）时才检查。<\/p>\n\n<div class=\"desk\">\n<p>2010 年代以来，高收益债和杠杆贷款的条款越来越宽松，出现了大量“轻条款”（covenant-lite，简称 cov-lite）的贷款。条款越松，发行人越容易在困难时把资产转移到债权人够不着的地方，现有债权人的保护就越弱。信用分析师读条款，主要就是在找这些“漏洞”。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>J.Crew 的“抽资产”操作。<\/strong>2016 年，服装零售商 J.Crew 利用贷款合同中允许向“非受限子公司”投资的条款，把价值数亿美元的品牌知识产权转移到了一家不受原贷款条款约束的子公司，再以这些资产为抵押借新钱。原来的贷款人眼看抵押品被拿走却无能为力。此后，市场把专门堵这个漏洞的条款称为“J.Crew 条款”，这类操作也成了负债管理交易（LME）的先例之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>契约条款是写在债券合同里的条件，分为必须做的和不能做的。<\/li>\n<li>常见的限制包括：再借债、抵押资产、分红回购、出售资产、控制权变更。<\/li>\n<li>投资级条款少、高收益条款多；条款越松，债权人的保护越弱。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家高收益公司被私募基金收购，收购资金大部分是借来的，压在这家公司身上。原来的债券持有人可能会担心什么？哪个条款能保护他们？<\/summary>\n<div><p>担心公司杠杆大增、信用变差，原来的债券价格下跌。控制权变更条款可以保护他们：公司被收购时，债券持有人有权要求按 101 赎回，拿回本金后离场。如果没有这个条款，他们只能承受损失。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-17\"><\/a><\/li>\n<li><a href=\"#L9-24\"><\/a><\/li>\n<li><a href=\"#L14-17\"><\/a><\/li>\n<\/ul><\/div>\n","9.19":"<div class=\"scene\">\n<p>借钱有好几种还法。房贷是每个月还一点本金，还完就清；很多公司债是平时只付利息，最后一天一次还清本金；还有一种，连利息都先不付，记在账上，等以后一起还。不同的还法，债券的风险和价值都不一样。<\/p>\n<\/div>\n\n<h2>一次还本：子弹型<\/h2>\n<p>最常见的债券是子弹型（bullet）：中间只付利息，本金在到期日一次还清。国债和大多数公司债都是这样。好处是简单；风险在于，借款人到期那天要一次拿出全部本金，常常要靠借新还旧，叫再融资风险（refinancing risk）。<\/p>\n\n<h2>分期摊还：一边付息一边还本<\/h2>\n<p>摊还型（amortizing）债券每次付款都包含一部分本金，本金逐年减少，到期时已经还得差不多。房贷、汽车贷款以及用它们打包成的证券，基本都是这种结构。<\/p>\n<p>还有一种折中的做法叫偿债基金（sinking fund）：发行人每年按约定赎回一部分债券，相当于分批还本。对投资者来说，违约风险降低了，但手里的债券可能被提前赎回。<\/p>\n<p>因为钱回来得早，同样期限下，摊还型债券的久期比子弹型短，对利率没那么敏感。描述这类债券时，常用加权平均期限（weighted average life，WAL）代替到期日，表示本金平均多少年回来。<\/p>\n\n<h2>实物付息：用新债付利息<\/h2>\n<p>实物付息（payment-in-kind，PIK）的债券，利息不付现金，而是增加债务本金：今年该付 10 元利息，就把欠的本金从 100 变成 110。也有可选的 PIK toggle：公司可以每期自己选择付现金还是加本金。<\/p>\n<p>PIK 主要出现在高杠杆的公司和私募信贷里。它让公司在现金紧张时少付现金，但债务会像滚雪球一样增长。投资者为此要求更高的利率。<\/p>\n\n<h2>还有几种付息方式<\/h2>\n<ul>\n<li><strong>递增票息（step-up）<\/strong>：票息按约定逐步提高，或者在评级下降、未达到某个可持续发展目标时提高。<\/li>\n<li><strong>浮动票息<\/strong>：跟着市场利率重置，下一课专门讲。<\/li>\n<li><strong>延期付息<\/strong>：部分银行资本工具和混合债，发行人可以在一定条件下暂停付息。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>风险系统建模时，最重要的是把每只债券的现金流时间表（cash flow schedule）弄对：哪天付多少利息、哪天还多少本金。摊还表、偿债基金安排、PIK 的累积规则一旦录错，估值和 DV01 都会错。新产品上线前，中台通常会逐条核对现金流。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年以后，私募信贷规模迅速扩大，PIK 条款也越来越常见。监管机构和评级机构多次提示：部分借款人收入不足以支付现金利息，靠 PIK 把利息转成本金，账面上看不出违约，但债务在悄悄变大。这类“隐性困境”是近年观察私募信贷风险的重点之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>子弹型到期一次还本，摊还型边付息边还本，偿债基金是分批赎回。<\/li>\n<li>钱回来得越早，久期越短；摊还型债券常用加权平均期限（WAL）描述。<\/li>\n<li>PIK 用加本金代替付现金利息，缓解现金压力，但债务会滚雪球。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两只 10 年期债券，票息和收益率相同，一只是子弹型，一只是每年等额摊还本金。利率上升时，哪只价格跌得多？<\/summary>\n<div><p>子弹型跌得多。它的本金要等到第 10 年才回来，久期长；摊还型每年都在回收本金，平均回收时间短，久期短，对利率没那么敏感。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-20\"><\/a><\/li>\n<li><a href=\"#L9-21\"><\/a><\/li>\n<li><a href=\"#L11-15\"><\/a><\/li>\n<\/ul><\/div>\n","9.20":"<div class=\"scene\">\n<p>你五年前贷款买房，利率 6%。现在利率跌到 3%，你会怎么做？提前还掉旧贷款，再借一笔 3% 的新贷款。<\/p>\n<p>公司也会这样做。如果债券合同允许公司提前还钱，这只债券就是<strong>可赎回债券（callable bond）<\/strong>。对投资者来说，这意味着：利率下跌时，高息的好日子可能被提前结束。<\/p>\n<\/div>\n\n<h2>可赎回：发行人手里有一个期权<\/h2>\n<p>可赎回债券允许发行人在约定的日期之后，按约定的价格（赎回价，比如 100 或 101）把债券买回来。常见的写法是“10NC5”：10 年期，前 5 年不可赎回（non-call 5），之后可以赎回。<\/p>\n<p>发行人什么时候会赎回？市场利率下降、能借到更便宜的钱时。这正是投资者最不想被赎回的时候：拿回的钱只能以更低的利率再投资。所以可赎回债券对投资者不利，必须多付一些利息作补偿。<\/p>\n<p>它还有一个特点：利率下降时，价格涨不太上去，因为大家知道它随时可能被按 100 左右赎回。这种“涨不动、跌得动”的性质叫负凸性（negative convexity）。<\/p>\n\n<h2>可回售：投资者手里有一个期权<\/h2>\n<p>可回售债券（puttable bond）正好相反：投资者有权在约定日期按约定价格把债券卖回给发行人。利率上升或者公司信用变差时，投资者可以拿回本金离开。这对投资者有利，所以票息会低一些。<\/p>\n\n<h2>偿债基金条款<\/h2>\n<p>偿债基金（sinking fund）要求发行人每年赎回一部分债券，比如每年 10%。赎回方式通常有两种：按面值抽签赎回，或者从市场上买回。如果债券价格低于面值，发行人会从市场上买；高于面值，就抽签按面值赎回。对投资者来说，违约风险降低了，但手里的债券可能被抽中提前收回。<\/p>\n\n<h2>含权债要用不同的指标<\/h2>\n<p>因为现金流会随利率变化，含权债券（bond with embedded options）不能用普通的到期收益率和久期来衡量：<\/p>\n<ul>\n<li>收益率看最差收益率（yield to worst）。<\/li>\n<li>利率敏感度看有效久期（effective duration）：用模型在利率上下变动时重新估值，把“可能被赎回”考虑进去。<\/li>\n<li>利差看期权调整利差（option-adjusted spread，OAS）：扣掉期权价值之后，剩下的纯信用补偿。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>交易台上说一只可赎回债券“交易在赎回价附近”（trading to call），意思是市场认为它很可能被赎回，价格被压在赎回价附近，久期也应按到赎回日来算，而不是到期日。<\/p>\n<p>持有可赎回债券，相当于“买了一只普通债券，同时卖给发行人一个看涨期权”。所以投资者是 Vega 的空头：利率波动越大，这个期权越值钱，对投资者越不利。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020–2021 年利率处在历史低位，大量公司把几年前发行的高息可赎回债券提前赎回，换成低息新债。高收益债市场尤其明显，投资者手里的高票息债券被大批收回，只能在低利率环境下重新找资产投资。这正是可赎回条款对投资者的代价。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>可赎回债券让发行人在利率下降时提前还钱，对投资者不利，所以票息更高。<\/li>\n<li>可回售债券让投资者可以提前拿回本金，对投资者有利，所以票息更低。<\/li>\n<li>含权债要看最差收益率、有效久期和期权调整利差，普通指标会误导。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只可赎回债券和一只同样条件的普通债券，利率大幅下降时，哪只涨得多？为什么？<\/summary>\n<div><p>普通债券涨得多。可赎回债券的价格会被压在赎回价附近：利率越低，发行人越可能赎回，投资者越不愿意花远高于赎回价的钱去买。这就是负凸性。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-5\"><\/a><\/li>\n<li><a href=\"#L9-37\"><\/a><\/li>\n<li><a href=\"#L9-41\"><\/a><\/li>\n<li><a href=\"#L24-26\"><\/a><\/li>\n<\/ul><\/div>\n","9.21":"<div class=\"scene\">\n<p>你担心利率会上升，不想买固定利率的债券，怕价格跌。有没有一种债券，利息会跟着市场利率一起涨？有，这就是<strong>浮息债（floating-rate note，FRN）<\/strong>。<\/p>\n<\/div>\n\n<h2>利息跟着基准利率走<\/h2>\n<p>浮息债的票息 = 基准利率 + 固定利差。比如“SOFR + 120bp”：每个付息期开始时，按当时的 SOFR 重新设定这一期的利息。基准利率涨了，下一期的利息就跟着涨。<\/p>\n<p>常用的基准利率：美元用 SOFR，欧元用 €STR 或 EURIBOR，英镑用 SONIA。LIBOR 已在 2023 年前后基本停用。<\/p>\n\n<h2>为什么浮息债几乎没有利率风险<\/h2>\n<p>固定利率债券跌价，是因为票息写死了，市场利率上升后它显得寒酸。浮息债的利息会在下一次重置时追上市场利率，所以价格不需要大幅调整。它的利率风险只到下一个重置日为止：如果三个月重置一次，利率风险就和一张三个月期的债差不多。<\/p>\n<p>所以浮息债的 DV01 很小，价格通常在面值附近波动。这也是银行、货币基金这些不想承担利率风险的机构喜欢它的原因。<\/p>\n\n<h2>真正的风险：利差<\/h2>\n<p>浮息债的利差在发行时就固定了，比如一直是 +120bp。如果这家公司的信用变差，市场要求的利差变成 +250bp，而你的债券只付 +120bp，价格就要下跌来弥补。这部分风险和固定利率债券一样大，期限有多长，风险就有多长。<\/p>\n<p>所以浮息债“利率风险小，利差风险大”：DV01 很小，CS01 和同期限的固定利率债券差不多。<\/p>\n\n<h2>贴现利差：浮息债的“收益率”<\/h2>\n<p>固定利率债券用到期收益率比较，浮息债用贴现利差（discount margin，DM）。它回答的问题是：按现在的价格买入，相当于基准利率之上每年多赚多少？<\/p>\n<ul>\n<li>价格等于 100，贴现利差就等于票面利差（quoted margin）。<\/li>\n<li>价格低于 100，贴现利差高于票面利差，说明市场现在要求更多补偿。<\/li>\n<li>价格高于 100，贴现利差低于票面利差。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>风险报告里，浮息债组合常常“看起来没什么风险”，因为 DV01 很小。一定要同时看 CS01：一个 5 年期浮息债组合，DV01 可能只相当于三个月期的债，CS01 却相当于 5 年期的债。<\/p>\n<p>浮息债的估值还会用到两条曲线：一条预测未来的基准利率，一条用来折现。两条曲线之间的差异叫基差风险（basis risk），在风险报告里单独列。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美国的银行贷款和杠杆贷款绝大多数是浮动利率。2022–2023 年美联储快速加息后，这些贷款的利息负担迅速上升。对投资者来说，收益跟着涨；对借款的高杠杆公司来说，利息支出在一两年内几乎翻倍，部分公司因此陷入困境，违约率上升。浮息把利率风险从投资者转到了借款人身上，最后变成了信用风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>浮息债的票息 = 基准利率 + 固定利差，按期重置。<\/li>\n<li>利率风险只到下一个重置日，DV01 很小；利差固定，CS01 和同期限固定利率债差不多。<\/li>\n<li>浮息债用贴现利差衡量回报；风险报告里要同时看 DV01 和 CS01。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行说“我们的资产都是浮息债，利率风险很低”。作为风控，你会追问什么？<\/summary>\n<div><p>追问利差风险：这些浮息债的 CS01 有多大、集中在哪些发行人和行业、评级分布如何。还要问基差风险（基准利率和融资成本是否匹配），以及流动性：浮息债的二级市场往往不如国债活跃，需要卖出时可能卖不上价。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-14\"><\/a><\/li>\n<li><a href=\"#L9-38\"><\/a><\/li>\n<li><a href=\"#L10-8\"><\/a><\/li>\n<li><a href=\"#L24-21\"><\/a><\/li>\n<\/ul><\/div>\n","9.22":"<div class=\"scene\">\n<p>你买了一张 10 年期国债，每年 3% 利息。结果这十年通胀平均 5%。名义上你赚了钱，实际上你的购买力每年都在缩水。有没有一种债券，能保证你跑赢通胀？有，这就是<strong>通胀挂钩债（inflation-linked bond）<\/strong>。<\/p>\n<\/div>\n\n<h2>本金跟着通胀涨<\/h2>\n<p>通胀挂钩债的本金按消费者价格指数（CPI）调整。通胀 5%，本金就从 100 调到 105，票息按调整后的本金计算，到期也按调整后的本金还。这样，投资者拿到的是一个“实际收益率”（real yield），通胀多少都被补上了。<\/p>\n<p>各国的名字：美国叫 TIPS（Treasury Inflation-Protected Securities），英国叫 index-linked gilts，欧元区有挂钩欧元区通胀的 OATi、BTP€i 等。<\/p>\n\n<h2>盈亏平衡通胀：市场在预期多少通胀<\/h2>\n<p>同期限的普通国债收益率，减去通胀挂钩债的实际收益率，叫盈亏平衡通胀率（breakeven inflation）。比如 10 年期国债收益率 4.2%，10 年期 TIPS 实际收益率 1.9%，盈亏平衡通胀就是 2.3%。<\/p>\n<p>意思是：如果未来十年平均通胀高于 2.3%，买 TIPS 更划算；低于 2.3%，买普通国债更划算。所以它常被当作市场对未来通胀的预期，央行也会盯着它看。不过它里面还混着通胀风险溢价和流动性差异，不完全是纯粹的预期。<\/p>\n\n<h2>它不是完全没有风险<\/h2>\n<ul>\n<li><strong>实际利率风险<\/strong>：实际收益率上升，通胀挂钩债的价格照样下跌。<\/li>\n<li><strong>通缩风险<\/strong>：通缩时本金会被下调（美国 TIPS 到期时保证至少还面值，但中途的调整会让价格下跌）。<\/li>\n<li><strong>流动性<\/strong>：市场比普通国债小，交易没那么活跃。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>通胀挂钩债的风险报告里，除了利率 DV01，还有一列通胀敏感度（Inflation01）：通胀预期上升 1bp，仓位赚亏多少。交易员会把普通国债和通胀挂钩债配对交易，只赌盈亏平衡通胀的变化。<\/p>\n<p>英国养老金是通胀挂钩债最大的买家之一，因为很多养老金的支付本身就和通胀挂钩。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年起全球通胀上升，美国 10 年期盈亏平衡通胀一度升到 3% 左右。但同期美国 10 年期 TIPS 的实际收益率从 2021 年约 −1% 升到 2023 年的 2% 以上，涨了 3 个多百分点。结果在 2022 年，很多以为“买 TIPS 就能对冲通胀”的投资者仍然亏了钱：通胀补偿抵不过实际利率上升带来的价格下跌。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>通胀挂钩债的本金随通胀调整，保证的是实际收益率。<\/li>\n<li>普通国债收益率减通胀挂钩债收益率，是盈亏平衡通胀，常被当作市场的通胀预期。<\/li>\n<li>它仍有实际利率风险，实际利率上升时价格照样下跌。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>10 年期盈亏平衡通胀是 2.5%。你认为未来十年平均通胀会是 3.5%。应该买普通国债还是通胀挂钩债？<\/summary>\n<div><p>买通胀挂钩债。如果通胀真的平均 3.5%，通胀挂钩债的总回报会比普通国债高大约 1 个百分点。你的判断和市场的定价之差，就是这笔交易的潜在收益。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-2\"><\/a><\/li>\n<li><a href=\"#L16-9\"><\/a><\/li>\n<li><a href=\"#L24-23\"><\/a><\/li>\n<\/ul><\/div>\n","9.23":"<div class=\"scene\">\n<p>一家成长很快的公司想借钱，但它的信用还不够好，正常发债要付 7% 的利息。它想了个办法：“我只付你 2%，但如果以后我的股价涨上去，你可以把债券换成我的股票。”愿意接受的投资者，买的就是<strong>可转债（convertible bond）<\/strong>。<\/p>\n<\/div>\n\n<h2>债券加一份看涨期权<\/h2>\n<p>可转债是普通债券加上一个“按约定价格换成股票”的权利。约定的价格叫转股价（conversion price），能换多少股叫转股比例（conversion ratio）。<\/p>\n<ul>\n<li>股价涨很多：把债券换成股票，分享上涨。<\/li>\n<li>股价不涨或下跌：继续当债券持有，拿利息，到期拿回本金。<\/li>\n<\/ul>\n<p>所以可转债“下有保底、上不封顶”：跌的时候像债，涨的时候像股。代价是票息比普通债券低得多。<\/p>\n\n<h2>它像债还是像股，看股价离转股价多远<\/h2>\n<ul>\n<li><strong>股价远低于转股价<\/strong>：转股希望渺茫，可转债主要按债券来估值，叫“债性”强。<\/li>\n<li><strong>股价在转股价附近<\/strong>：两种性质都有，对股价、利率、波动率都敏感。<\/li>\n<li><strong>股价远高于转股价<\/strong>：几乎一定会转股，价格跟着股价走，叫“股性”强。<\/li>\n<\/ul>\n<p>当然，“保底”的前提是公司不违约。发行可转债的多是信用一般的成长型公司，一旦出事，债底也保不住。<\/p>\n\n<h2>谁发、谁买<\/h2>\n<p>发行人多是科技、生物医药等成长型公司：利息低，而且只有股价大涨时才稀释股东，比直接增发股票温和。买家除了长期投资者，很大一部分是对冲基金，做可转债套利（convertible arbitrage）：买入可转债、卖空对应的股票，赚可转债定价偏低的钱。<\/p>\n<p>附认股权证债券（bond with warrants）思路相近：债券和换股的权利分开，认股权证可以单独交易。<\/p>\n\n<div class=\"desk\">\n<p>可转债的风险是“全家桶”：利率 DV01、信用 CS01、股票 Delta、波动率 Vega 都有。可转债交易台和风控要同时看这几项。持有可转债是 Vega 的多头：股价波动越大，转股的权利越值钱。<\/p>\n<p>很多可转债还附带赎回条款：股价长期高于转股价一定比例时，发行人可以强制赎回，逼投资者转股。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2005 年通用汽车与可转债套利。<\/strong>2005 年 5 月，通用汽车的信用评级被降为垃圾级，它的债券和可转债大跌；几乎同时，亿万富翁柯克·科克里安宣布要收购通用汽车股票，股价反而上涨。很多做可转债套利的对冲基金同时买着可转债、卖空着股票，两头一起亏损，整个策略在那段时间遭受重创。这说明可转债套利对冲掉了股价风险，却仍然暴露在信用风险之下。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>可转债是债券加上换成股票的权利，跌的时候像债，涨的时候像股。<\/li>\n<li>股价离转股价越近，可转债对股价、利率、波动率都越敏感。<\/li>\n<li>它同时有利率、信用、股票和波动率风险；对冲了股价，仍然要担心信用。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司的股价远低于可转债的转股价，同时公司信用快速变差。这只可转债的价格主要会跟着什么走？<\/summary>\n<div><p>主要跟着信用走。转股的权利几乎不值钱，可转债基本就是一只普通的、信用正在变差的公司债，价格会随利差走阔而下跌。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L16-11\"><\/a><\/li>\n<li><a href=\"#L24-26\"><\/a><\/li>\n<li><a href=\"#L20-7\"><\/a><\/li>\n<\/ul><\/div>\n","9.24":"<div class=\"scene\">\n<p>一家被私募基金收购的连锁健身房，负债是利润的六倍。它要借钱，银行嫌风险太大。它还是能在债券市场借到钱，只是要付 9% 的利息。愿意买这种债的投资者，在高收益债市场（high-yield market）。<\/p>\n<\/div>\n\n<h2>高收益债是什么<\/h2>\n<p>评级低于 BBB−（穆迪 Baa3）的债券叫高收益债，也叫投机级（speculative grade）或垃圾债（junk bond）。发行人通常是：<\/p>\n<ul>\n<li>被私募基金杠杆收购（LBO）的公司，债务被故意加得很高。<\/li>\n<li>处在困难行业或者正在转型的公司。<\/li>\n<li>从投资级被降级下来的“堕落天使”（fallen angels）。<\/li>\n<li>还在成长、现金流不稳定的公司。<\/li>\n<\/ul>\n\n<h2>它更像股票，而不是国债<\/h2>\n<p>投资级债券的价格主要跟着利率走。高收益债的价格主要跟着公司的经营和经济周期走：经济好，违约少，利差收窄，价格上涨；经济差，违约上升，利差大幅走阔。所以高收益债和股市的相关性很高，在危机里常常和股票一起跌。<\/p>\n<p>它的违约率也确实高得多。投资级每年的违约率接近零，高收益平均每年在 3%–4% 左右，衰退时可以超过 10%。<\/p>\n\n<h2>为什么还有人买<\/h2>\n<p>高利息可以覆盖相当一部分违约损失。如果年违约率 4%、回收率 40%，每年的预期损失大约 2.4%；只要利差明显高于这个数，长期来看投资者仍有回报。专业的高收益基金靠的是挑选：避开会违约的那几家。<\/p>\n\n<div class=\"desk\">\n<p>高收益债常用“价格”而不是收益率来描述困境程度：价格 90 以上算正常，70–80 说明市场开始担心，50 以下通常意味着市场在为违约定价。<\/p>\n<p>高收益债大多是可赎回的，而且条款比投资级复杂得多，分析时要看最差收益率和契约条款。它的流动性也差，危机中可能几天都没有像样的成交。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>1980 年代与迈克尔·米尔肯。<\/strong>现代高收益债市场是在 1980 年代由德崇证券（Drexel Burnham Lambert）的迈克尔·米尔肯一手推起来的：他说服投资者，一篮子垃圾债的高利息足以弥补违约损失，并用高收益债为一大批杠杆收购融资。1990 年德崇破产，米尔肯因证券违法入狱，但高收益债市场保留了下来，如今是公司融资的重要渠道。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>高收益债是评级低于 BBB− 的债券，发行人多是高杠杆、困境或成长型公司。<\/li>\n<li>它的价格主要跟着经营和经济周期走，和股市相关性高，违约率也高得多。<\/li>\n<li>高利息可以补偿违约损失，关键在于避开会违约的那些公司。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>经济开始衰退，央行大幅降息。投资级债券和高收益债，哪一个更可能上涨？<\/summary>\n<div><p>投资级债券更可能上涨：它主要受利率影响，降息直接推高价格。高收益债则面临两股相反的力量：利率下降是好事，但衰退会推高违约预期、拉大利差。衰退初期，利差走阔往往占上风，高收益债可能下跌。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-15\"><\/a><\/li>\n<li><a href=\"#L9-18\"><\/a><\/li>\n<li><a href=\"#L14-9\"><\/a><\/li>\n<li><a href=\"#L24-21\"><\/a><\/li>\n<\/ul><\/div>\n","9.25":"<div class=\"scene\">\n<p>土耳其政府要借 20 亿美元。它可以借美元，也可以借里拉。借美元，全世界的投资者都愿意参与，但将来要用美元还；借里拉，汇率风险留给了投资者。不同的选择，背后是完全不同的风险。这就是<strong>新兴市场债（emerging market debt）<\/strong>。<\/p>\n<\/div>\n\n<h2>硬货币债和本币债<\/h2>\n<p>新兴市场债分两大类：<\/p>\n<ul>\n<li><strong>硬货币债（hard currency）<\/strong>：以美元、欧元发行。投资者没有汇率风险，主要承担这个国家或公司的信用风险。代价是发行国要用外汇还钱，本币一贬值，还债压力就急剧上升。<\/li>\n<li><strong>本币债（local currency）<\/strong>：以本国货币发行。投资者同时承担利率、信用和汇率风险，收益很大一部分取决于这种货币的走势。<\/li>\n<\/ul>\n<p>发行人有政府（主权债）、国有企业（准主权债）和民营公司。<\/p>\n\n<h2>收益高，风险也多<\/h2>\n<p>新兴市场债的收益率通常明显高于发达国家，因为风险更多：政治变化、资本管制、通胀失控、外汇储备不足、法律和债权人保护较弱。很多国家的债券在危机中会和本国货币一起大跌。<\/p>\n<p>它还对全球环境非常敏感。美元走强、美国加息时，资金倾向于从新兴市场流出，这些国家借美元的成本和压力同时上升。<\/p>\n\n<h2>常用的基准<\/h2>\n<p>摩根大通的 EMBI 系列指数（硬货币主权债）和 GBI-EM 系列指数（本币政府债）是行业最常用的基准。一个国家被纳入或调出这些指数，会引发大规模的被动资金流入或流出。<\/p>\n\n<div class=\"desk\">\n<p>新兴市场债的风险报告要分开看：利率风险（DV01，按美元曲线和本币曲线分别列）、信用风险（主权利差）、汇率风险（FX Delta）。还有一项很重要的“转移和兑换风险”：即使公司愿意还钱，政府的资本管制也可能让它没法把钱换成外币汇出去。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2001 年阿根廷违约。<\/strong>阿根廷在 2001 年底宣布停止偿付约 1,000 亿美元的外债，是当时规模最大的主权违约。此后多年，多数债权人接受了大幅打折的重组方案，一部分对冲基金拒绝接受，在纽约法院起诉，诉讼持续了十几年，直到 2016 年才基本和解。这件事推动了主权债合同的改革，例如加入“集体行动条款”（collective action clauses），让多数债权人同意的重组方案也能约束少数反对者。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>新兴市场债分硬货币债和本币债，前者主要是信用风险，后者还有利率和汇率风险。<\/li>\n<li>收益更高，因为政治、通胀、外汇储备、法律保护等风险更多。<\/li>\n<li>美元走强、美国加息时，新兴市场债常常承压。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个新兴市场国家大量借了美元债。如果它的货币对美元贬值 30%，会发生什么？<\/summary>\n<div><p>以本币计算的美元债务一下子增加了约 43%（1 ÷ 0.7）。政府和企业要用更多本币才能还同样的美元，偿债压力急剧上升，可能引发信用评级下调、利差走阔，严重时导致违约。这就是“货币错配”的风险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-2\"><\/a><\/li>\n<li><a href=\"#L8-4\"><\/a><\/li>\n<li><a href=\"#L8-8\"><\/a><\/li>\n<\/ul><\/div>\n","9.26":"<div class=\"scene\">\n<p>你所在的城市要修一座新医院、一条地铁线。钱从哪来？除了财政拨款，很多时候是市政府发债借来的。美国有一个规模约 4 万亿美元的市场，专门买卖这种债券。此外，还有介于政府和公司之间的“半官方”借款人，以及由多个国家共同拥有的国际机构。<\/p>\n<\/div>\n\n<h2>市政债：地方政府的借条<\/h2>\n<p>美国的州、市、学区、医院、机场等发行的债券叫市政债（municipal bonds，munis）。分两种：<\/p>\n<ul>\n<li><strong>一般责任债（general obligation）<\/strong>：以地方政府的征税能力作保证。<\/li>\n<li><strong>收益债（revenue bond）<\/strong>：只靠某个项目的收入偿还，比如收费公路的过路费、机场的收入。<\/li>\n<\/ul>\n<p>市政债最大的特点是利息通常免美国联邦所得税。所以它的收益率常常比同期限国债还低，主要买家是高收入的个人投资者。在其他国家，地方政府债也有，例如中国的地方政府专项债，但制度和美国很不一样。<\/p>\n\n<h2>机构债：政府背景的公司<\/h2>\n<p>机构债（agency bonds）由政府支持的机构发行。美国最典型的是房利美（Fannie Mae）、房地美（Freddie Mac）和联邦住房贷款银行（FHLB）。它们没有法律上的政府担保，但市场普遍相信政府不会让它们倒下，所以利差很小。2008 年房利美和房地美被政府接管，印证了这种“隐性担保”。<\/p>\n<p>德国复兴信贷银行（KfW）、中国国家开发银行等政策性银行发的债，也属于这一类。<\/p>\n\n<h2>超主权债：多个国家共同的借款人<\/h2>\n<p>超主权机构（supranationals）是由多个国家共同拥有的国际机构，比如世界银行、欧洲投资银行（EIB）、亚洲开发银行。它们评级很高，常为 AAA，发债规模大，币种多样。这一类和主权、机构债一起，常被统称为 SSA（sovereigns, supranationals and agencies）。<\/p>\n\n<div class=\"desk\">\n<p>银行的利率交易台和流动性管理部门经常持有 SSA 债券：信用风险很低，收益比国债略高，很多还能计入监管要求的高质量流动性资产（HQLA）。在风险报告里，它们通常和国债放在一起，但会单独列出相对国债的利差风险。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2013 年底特律破产。<\/strong>2013 年 7 月，底特律申请破产，债务约 180 亿美元，是美国历史上规模最大的市政破产。部分一般责任债的持有人只拿回了一部分本金，打破了“市政债几乎不会违约”的印象，也让投资者开始更认真地分析地方政府的财政，特别是养老金负担。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>市政债是地方政府的借条，美国的市政债利息通常免联邦税，收益率因此偏低。<\/li>\n<li>机构债由政府背景的机构发行，靠隐性的政府支持，利差很小。<\/li>\n<li>超主权债由多国共同拥有的国际机构发行，评级很高；三者常合称 SSA。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一只免税的市政债收益率 3%，同期限国债（利息要交税）收益率 4%。对一个税率 40% 的投资者来说，哪个更划算？<\/summary>\n<div><p>市政债更划算。国债 4% 的利息交 40% 的税后只剩 2.4%，低于市政债的 3%。市政债的“税后等值收益率”是 3% ÷（1 − 40%）= 5%，比国债高。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-2\"><\/a><\/li>\n<li><a href=\"#L11-6\"><\/a><\/li>\n<li><a href=\"#L6-41\"><\/a><\/li>\n<\/ul><\/div>\n","9.27":"<div class=\"scene\">\n<p>一家德国汽车公司在伦敦发行了一笔美元债券，卖给瑞士、新加坡和中东的投资者。这笔债既不在美国发行，也不在德国发行，用的却是美元。它属于哪个国家的市场？它属于“欧洲债券”（Eurobond）市场，这个名字和欧元没有关系。<\/p>\n<\/div>\n\n<h2>欧洲债券：在货币发行国之外发行的债<\/h2>\n<p>欧洲债券指在某种货币的发行国之外发行的、以该货币计价的债券。欧洲美元债就是在美国以外发行的美元债。“欧洲”是历史原因：这个市场 1960 年代在伦敦兴起，当时很多美元留在欧洲，不受美国监管。<\/p>\n<p>欧洲债券的特点：<\/p>\n<ul>\n<li>面向国际投资者，常在卢森堡或伦敦上市，通过 Euroclear、Clearstream 结算。<\/li>\n<li>监管和披露要求比在美国本土公开发行宽松，发行快、成本低。<\/li>\n<li>大多不记名、免预提税，对国际投资者友好。<\/li>\n<\/ul>\n<p>今天全球很大一部分国际债券都在这个市场发行，发行人包括各国政府、超主权机构、银行和大公司。<\/p>\n\n<h2>外国债券：在别国本土发行的本币债<\/h2>\n<p>和欧洲债券相对的是外国债券（foreign bond）：外国发行人到某个国家本土，按当地规则发行当地货币的债。它们有各种绰号：<\/p>\n<ul>\n<li>扬基债（Yankee bond）：外国发行人在美国发的美元债。<\/li>\n<li>武士债（Samurai bond）：在日本发的日元债。<\/li>\n<li>斗牛犬债（Bulldog bond）：在英国发的英镑债。<\/li>\n<li>熊猫债（Panda bond）：外国发行人在中国内地发的人民币债。<\/li>\n<\/ul>\n\n<h2>点心债：离岸人民币债<\/h2>\n<p>点心债（Dim Sum bond）是在中国内地以外、主要在香港发行的人民币债券，用的是离岸人民币（CNH）。它是人民币国际化的一部分：海外投资者可以持有人民币资产，又不需要进入内地市场。熊猫债则是外国发行人进入内地市场，用的是在岸人民币（CNY）。两者合起来，是观察人民币跨境资金流动的一扇窗。<\/p>\n\n<div class=\"desk\">\n<p>同一个发行人在不同市场发的债，条款、税务、结算方式可能都不一样。风险系统里要准确记录每只债的发行市场、适用法律（英国法、纽约法、本地法）、结算系统和币种，否则估值、税务和交割都会出问题。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1963 年，意大利高速公路公司（Autostrade）在伦敦发行了一笔 1,500 万美元的债券，被普遍视为第一笔现代欧洲债券。推动这个市场的是美国当年开征的“利息平衡税”：美国投资者买外国债券要额外交税，外国发行人在美国借美元变贵了，于是转到伦敦，向持有美元的欧洲投资者借。一项监管措施，催生了一个全球最大的国际债券市场。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>欧洲债券是在货币发行国之外发行的该货币债券，和欧元无关。<\/li>\n<li>外国债券是外国发行人到别国本土发行的当地货币债，有扬基、武士、熊猫等绰号。<\/li>\n<li>点心债是离岸人民币债，熊猫债是外国发行人在内地发的人民币债。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家中国公司要借美元，可以在美国公开发行扬基债，也可以在香港发行欧洲美元债。为什么很多公司选后者？<\/summary>\n<div><p>在美国公开发行需要在美国证监会注册，披露要求高、时间长、法律成本高。欧洲美元债的发行程序更简单、更快，投资者群体又足够国际化，所以多数亚洲公司借美元时选择这条路，通常同时用 Reg S 规则面向美国以外的投资者。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-31\"><\/a><\/li>\n<li><a href=\"#L8-12\"><\/a><\/li>\n<li><a href=\"#L8-10\"><\/a><\/li>\n<\/ul><\/div>\n","9.28":"<div class=\"scene\">\n<p>一家年营收 10 亿欧元的德国中型机械公司，想借 2 亿欧元。公开发债太麻烦：要评级、要写厚厚的说明书、要一次借够 5 亿才划算。找一家银行借，又太依赖这一家。它的选择是：直接卖给几家保险公司和储蓄银行，签一份简单的合同。这就是<strong>私募债（private placement）<\/strong>。<\/p>\n<\/div>\n\n<h2>不公开发行的债券<\/h2>\n<p>私募债不向公众发售，而是直接卖给少数大型机构投资者，通常是保险公司、养老金和银行。好处是：<\/p>\n<ul>\n<li>不需要公开注册，披露少，速度快。<\/li>\n<li>常常不需要信用评级。<\/li>\n<li>规模可以小，期限可以长，条款可以量身定制。<\/li>\n<li>投资者少，以后要修改条款，谈判也容易。<\/li>\n<\/ul>\n<p>代价是流动性差：投资者基本要持有到期，所以会要求比公开债券高一点的收益，叫流动性溢价。<\/p>\n\n<h2>美国私募市场（USPP）<\/h2>\n<p>美国私募市场（US private placement，USPP）历史悠久，主要买家是美国的大型寿险公司。它们的负债期限很长，正好需要 10 年、15 年甚至更长的固定利率资产，而且不在乎流动性。很多欧洲、澳洲的中型企业也来这里借美元，期限长、条款稳定，常带有财务维持条款。<\/p>\n\n<h2>德国 Schuldschein<\/h2>\n<p>Schuldschein（全称 Schuldscheindarlehen，德文意为“借据贷款”）是德国特有的工具，法律上是贷款，不是证券，但交易方式很像债券：<\/p>\n<ul>\n<li>由一家牵头银行安排，分成多份卖给多家投资者，常见的有储蓄银行、合作银行和保险公司。<\/li>\n<li>合同简单，依据德国法，不需要说明书，通常不需要评级。<\/li>\n<li>常常同时发行多个期限（比如 3、5、7、10 年），固定利率和浮动利率搭配。<\/li>\n<li>可以转让，但几乎没有二级市场。<\/li>\n<\/ul>\n<p>它是德国和欧洲中型企业（Mittelstand）的重要融资渠道，近年来也吸引了亚洲和美国的发行人。<\/p>\n\n<div class=\"desk\">\n<p>私募债和 Schuldschein 几乎没有市场报价，估值主要靠模型：用可比公开债券的利差，加上一个流动性溢价。这类资产属于公允价值层级里的第二或第三层，产品控制要定期检查估值假设。风险报告里，它们的利差风险可能被低估，因为价格“看起来”从不变动。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>Schuldschein 市场在 2017 年前后迎来一个高峰，年发行量达到约 270 亿欧元，规模可与一个中等国家的公司债市场相比。也是在这段时间，几笔发行人违约事件（例如 2017 年的家具零售商 Steinhoff）让市场意识到：合同简单、没有评级，也意味着投资者要自己做好信用分析。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>私募债直接卖给少数机构投资者，不公开发行，灵活、快捷，但流动性差。<\/li>\n<li>美国私募市场的主要买家是寿险公司，适合需要长期固定利率资金的中型企业。<\/li>\n<li>Schuldschein 是德国法下的借据贷款，像债券一样分给多家投资者，是欧洲中型企业的重要融资渠道。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家保险公司为什么愿意买流动性很差的私募债，而不是更容易卖的公开债券？<\/summary>\n<div><p>保险公司的负债很长，资产本来就打算持有到期，不需要中途卖出。私募债多给的流动性溢价，对它来说几乎是“白拿”的额外收益。私募债的条款常常更严，信息也可以直接向公司要，保护更好。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-3\"><\/a><\/li>\n<li><a href=\"#L9-31\"><\/a><\/li>\n<li><a href=\"#L20-14\"><\/a><\/li>\n<\/ul><\/div>\n","9.29":"<div class=\"scene\">\n<p>一家银行要满足监管的资本要求，最简单的办法是增发股票。但股票很贵，股东也不愿被稀释。有没有一种工具，平时像债券一样付利息，银行出事时又能像股票一样吸收损失？有，这就是银行的<strong>资本工具（capital instruments）<\/strong>，其中最受关注的是 AT1。<\/p>\n<\/div>\n\n<h2>银行资本的三层<\/h2>\n<p>巴塞尔协议把银行资本分成几层，越上面越能吸收损失：<\/p>\n<div class=\"tbl\"><table>\n<tr><th>层级<\/th><th>主要构成<\/th><th>特点<\/th><\/tr>\n<tr><td>核心一级资本（CET1）<\/td><td>普通股、留存利润<\/td><td>最先吸收损失<\/td><\/tr>\n<tr><td>额外一级资本（AT1）<\/td><td>永续、可减记或可转股的债券<\/td><td>银行持续经营时就可能吸收损失<\/td><\/tr>\n<tr><td>二级资本（Tier 2）<\/td><td>次级债<\/td><td>银行倒闭时才吸收损失<\/td><\/tr>\n<\/table><\/div>\n<p>再往下，还有专门用于银行处置时“自救”（bail-in）的高级非优先债（senior non-preferred）等工具，用来满足 TLAC 和 MREL 的要求。<\/p>\n\n<h2>AT1：最像股票的债券<\/h2>\n<p>AT1 债券，也常被叫作应急可转债（contingent convertible，CoCo），有几个特点：<\/p>\n<ul>\n<li><strong>永续<\/strong>：没有到期日，银行可以在第一个赎回日（常见 5 年）之后赎回，但没有义务。<\/li>\n<li><strong>利息可以取消<\/strong>：银行有权不付息，而且不付息不算违约，也不累积。<\/li>\n<li><strong>触发机制<\/strong>：银行的 CET1 比率跌破某个水平（常见 5.125% 或 7%），或者监管机构认定银行“无法持续经营”时，债券会被减记（write-down）或转换成股票。<\/li>\n<\/ul>\n<p>因为风险高，AT1 的票息也高，常常比同一家银行的高级债高好几个百分点。<\/p>\n\n<h2>投资者要关注什么<\/h2>\n<p>AT1 的风险不只是银行倒闭。银行利润下滑可能停发利息；赎回日不赎回（叫 extension risk）会让价格大跌；监管机构的判断也可能在触发条件达到之前就让债券吸收损失。所以 AT1 更像一只有特殊条款的股票，而不是一只债券。<\/p>\n\n<div class=\"desk\">\n<p>风险系统里，AT1 很难建模：它同时有利率风险、信用利差风险、股票相关性、不赎回的期权，以及减记的跳跃风险。很多机构对 AT1 设单独限额，并在压力测试里假设它会被全额减记。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p><strong>2023 年瑞信 AT1 被清零。<\/strong>2023 年 3 月 19 日，瑞士政府促成瑞银收购瑞信，瑞士金融市场监管局（FINMA）同时决定将瑞信约 160 亿瑞士法郎的 AT1 债券全部减记为零，而瑞信股东仍获得了价值约 30 亿瑞士法郎的瑞银股票。这颠覆了“股东先亏完、债权人才亏”的常识。依据是这批 AT1 合同里允许在获得政府特别支持时减记的条款。第二天，欧洲央行和英格兰银行都发表声明：在它们的辖区内，普通股会先于 AT1 吸收损失。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>银行资本分为 CET1、AT1、二级资本，越上面越先吸收损失。<\/li>\n<li>AT1 永续、利息可取消、触发条件下会减记或转股，是最像股票的债券。<\/li>\n<li>投资 AT1 要读懂合同条款，瑞信事件说明条款可以改变一般的偿付顺序。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家银行的 AT1 到了第一个赎回日，银行没有赎回。为什么 AT1 价格会因此下跌？<\/summary>\n<div><p>市场原本按“5 年后赎回”来定价，不赎回意味着债券可能永远存续，期限和风险都大大增加。同时，不赎回往往说明银行再融资的成本更高或者资本紧张，传递了负面信号。所以投资者会要求更高的收益率，价格下跌。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-17\"><\/a><\/li>\n<li><a href=\"#L6-7\"><\/a><\/li>\n<li><a href=\"#L6-46\"><\/a><\/li>\n<\/ul><\/div>\n","9.30":"<div class=\"scene\">\n<p>周二早上 8 点，一家大型药企宣布要发行一笔 30 亿美元的公司债。中午之前，订单已经超过 100 亿美元。下午 3 点，债券定价；第二天，开始在二级市场交易；一周后，钱打进公司账户。这一天里，投资银行的债务资本市场部（DCM）在做什么？<\/p>\n<\/div>\n\n<h2>簿记建档：一天之内完成定价<\/h2>\n<p>大型公司债的发行通常用簿记建档（bookbuilding），由几家投行担任簿记行（bookrunners）：<\/p>\n<ol>\n<li><strong>准备<\/strong>：发行人和投行确定期限、规模和时间窗口，准备文件。<\/li>\n<li><strong>公布初步价格指引（IPT）<\/strong>：早上开盘时宣布，比如“10 年期，国债 +140bp 左右”。<\/li>\n<li><strong>收集订单<\/strong>：投资者报出想买的金额和能接受的价格。簿记行实时更新订单簿（order book）。<\/li>\n<li><strong>收紧价格<\/strong>：订单越多，发行人越有底气，利差往下收，比如收到 +120bp。<\/li>\n<li><strong>定价和分配<\/strong>：确定最终利差和规模，按订单质量把债券分给投资者。长期持有的大机构通常比短线投资者分得多。<\/li>\n<\/ol>\n<p>新发行的债券通常要比已有的同类债券略高一点收益，吸引投资者参与，这部分叫新发溢价（new issue concession）。<\/p>\n\n<h2>中期票据计划：随时可以发<\/h2>\n<p>经常发债的发行人（大银行、大公司、超主权机构）会提前设立一个中期票据计划（medium-term note programme，MTN programme）。先准备好一份总的基础说明书，以后每次发行只需要补一份简短的定价补充文件。这样随时可以发行，金额、币种、期限都很灵活，甚至可以根据某一个投资者的需求“反向询价”（reverse inquiry）定制发行。<\/p>\n\n<h2>谁在这个过程里<\/h2>\n<ul>\n<li><strong>发行人<\/strong>：决定借多少、借多久、能接受什么价格。<\/li>\n<li><strong>DCM 银行家<\/strong>：给发行人建议发行窗口和定价，跑整个流程。<\/li>\n<li><strong>银团部（syndicate）<\/strong>：连接 DCM 和销售，管理订单簿和定价。<\/li>\n<li><strong>销售<\/strong>：向投资者推介，收集订单。<\/li>\n<li><strong>律师、评级机构、受托人、结算代理<\/strong>：处理文件、评级和交割。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>发行日早上，交易员和风控要留意：大笔新债发行时，投资者常常先卖出类似的老债，或者用利率互换、国债对冲，同类债券的利差和利率可能短暂波动。新发行的高评级债券还常常在第一天交易时价格上涨，叫“上市表现”（performance），是衡量发行定价是否合理的指标。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2013 年 9 月，美国电信公司 Verizon 为收购 Vodafone 持有的 Verizon Wireless 股权，一次发行了 490 亿美元的公司债，分成多个期限和币种，是当时规模最大的公司债发行。订单超过 1,000 亿美元。为了确保发得出去，Verizon 给出了相当可观的新发溢价，很多投资者在上市首日就获利。这笔交易常被拿来说明：发行规模越大，发行人越需要用价格让步来换取确定性。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>大型公司债用簿记建档发行：公布价格指引、收集订单、收紧价格、定价分配。<\/li>\n<li>新发债券通常要给一点新发溢价，吸引投资者参与。<\/li>\n<li>经常发债的机构用中期票据计划，准备一次文件，随时可以发行。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一笔债券发行，订单是发行规模的 5 倍，最终利差比初步指引收窄了 30bp。上市第一天价格却下跌了。可能说明什么？<\/summary>\n<div><p>可能定价收得太紧了：很多订单是“虚胖”的，投资者知道会被削减配售，故意多报；价格收到太紧后，部分投资者拿到债券就卖出，二级市场需求跟不上。发行人省了钱，但投资者体验差，下次发行可能更难。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L9-31\"><\/a><\/li>\n<li><a href=\"#L9-32\"><\/a><\/li>\n<li><a href=\"#L9-33\"><\/a><\/li>\n<\/ul><\/div>\n","9.31":"<div class=\"scene\">\n<p>一家巴西公司要借 10 亿美元，最想卖给美国的大基金，因为那里钱最多。但如果在美国公开发行，就要在美国证监会（SEC）注册，花几个月准备，还要承担美国证券法下很重的披露责任。有没有办法既卖给美国大机构，又不用注册？有：<strong>144A 规则<\/strong>。<\/p>\n<\/div>\n\n<h2>美国证券法的基本规则：要卖就要注册<\/h2>\n<p>美国 1933 年《证券法》规定，在美国向公众发售证券，原则上必须向 SEC 注册，提交详细的说明书，并对其中的错误承担严格的法律责任。注册发行叫公开发行（registered offering），美国大公司的大部分债券都是这样发的。<\/p>\n\n<h2>144A：只卖给大机构，可以不注册<\/h2>\n<p>144A 规则允许发行人不注册，只要把证券卖给“合格机构买家”（qualified institutional buyers，QIBs）。QIB 大致是管理 1 亿美元以上证券资产的机构，比如大基金、保险公司、银行。理由是：这些机构有能力自己做研究，不需要 SEC 来保护。<\/p>\n<p>144A 债券可以在 QIB 之间自由转让，所以形成了一个规模很大、流动性不错的市场。高收益债和外国发行人的美元债，很大一部分是通过 144A 发行的。<\/p>\n\n<h2>Reg S：在美国以外发行<\/h2>\n<p>Regulation S（Reg S）规定：完全在美国境外、卖给非美国投资者的证券，不需要在 SEC 注册。欧洲债券和亚洲公司的美元债大多走 Reg S。<\/p>\n<p>很多国际发行会同时用两条路：“144A/Reg S”，一份文件，同时卖给美国的大机构（144A 部分）和美国以外的投资者（Reg S 部分）。两部分有不同的证券编号（CUSIP 或 ISIN），转让限制也不同。<\/p>\n\n<div class=\"desk\">\n<p>交易和合规部门必须清楚每只债券是注册的、144A 的还是 Reg S 的，因为能卖给谁不一样：144A 债券不能卖给美国的散户；Reg S 债券在发行后的一段“限售期”内不能卖回美国。系统里通常有专门的字段标注，交易员下单前会检查客户是否合格。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>144A 规则在 1990 年推出，初衷是吸引外国公司进入美国资本市场：很多外国公司不愿接受美国严格的注册和披露要求，干脆不来美国融资。144A 推出后，外国发行人只需面对美国的大机构，就能借到美元。今天，美国的高收益债市场和新兴市场美元债市场，都在很大程度上建立在 144A 之上。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>在美国向公众发售证券要在 SEC 注册，披露和法律责任都很重。<\/li>\n<li>144A 允许只卖给合格机构买家（QIB）而不注册；Reg S 覆盖完全在美国境外的发行。<\/li>\n<li>国际发行常同时用 144A/Reg S，两部分的买家和转让限制不同，交易时要分清。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家亚洲公司的美元债只按 Reg S 发行。一家美国的对冲基金能不能在发行时买入？为什么？<\/summary>\n<div><p>原则上不能。Reg S 部分只能卖给美国以外的投资者，美国的机构要买，需要有 144A 部分。限售期过后，Reg
