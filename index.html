e）<\/strong>：所有生产要素获得的收入总和：工资、利润、利息、租金。<\/li>\n<li><strong>人均 GDP 或人均 GNI<\/strong>：除以人口，用于国际比较生活水平。国际比较时常用购买力平价（PPP）换算，以消除各国物价水平的差异。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>分析一个国家的主权信用或货币时，要注意 GDP 和 GNI 的差别。债务率通常以 GDP 为分母，但如果大量 GDP 实际流向外国，这个国家真正能用来还债的收入就少得多。评级机构和 IMF 分析爱尔兰、卢森堡等国时，会使用经过调整的指标。对外资依赖高的新兴市场，利润汇出也是国际收支的重要压力来源。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>爱尔兰中央统计局在 2016 年公布，2015 年 GDP 增长约 26%。增长主要来自跨国公司把知识产权、飞机租赁资产等转移到爱尔兰。由于这些数字严重扭曲了对真实经济的判断，爱尔兰在 2017 年推出了一个专门的指标“修正国民总收入”（GNI*），剔除跨国公司知识产权折旧、飞机租赁和迁入企业的留存利润等影响。今天，爱尔兰的政策讨论和债务比率常以 GNI* 为基准。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>GDP 算的是境内生产，GNI 算的是本国居民的收入，差别是来自国外的净要素收入。<\/li>\n<li>外资利润大量汇出的国家 GNI 低于 GDP，海外收入多的国家 GNI 可能高于 GDP。<\/li>\n<li>国际比较常用人均 GDP 和购买力平价；分析外资依赖高的国家要注意 GDP 可能夸大实际收入。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家外国公司在你的国家建了一座大工厂，所有利润都汇回母国。这座工厂对你国家的 GDP 和 GNI 分别有什么影响？对你的国家有没有好处？<\/summary>\n<div><p>GDP 会增加工厂的全部增加值。GNI 只增加留在本国的部分，主要是本地员工的工资、缴纳的税收和本地采购，汇回的利润不计入。即使利润汇出，工厂仍然带来了就业、工资、税收、技术和本地供应商的业务，所以仍然有好处，只是比 GDP 显示的要小。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-1\"><\/a><\/li>\n<li><a href=\"#L8-6\"><\/a><\/li>\n<li><a href=\"#L8-3\"><\/a><\/li>\n<\/ul><\/div>\n","2.3":"<div class=\"scene\">\n<p>一个国家今年的 GDP 比去年增长了 10%。听起来很好，但如果物价同时也上涨了 10%，生产出来的东西其实一点也没有多。只看用当年价格计算的数字，你分不清是产量增加了，还是价格上涨了。所以经济学家区分<strong>名义 GDP（nominal GDP）<\/strong>和<strong>实际 GDP（real GDP）<\/strong>，连接两者的是 <strong>GDP 平减指数（GDP deflator）<\/strong>。<\/p>\n<\/div>\n\n<h2>名义和实际<\/h2>\n<ul>\n<li><strong>名义 GDP<\/strong>：用当年的价格计算，同时反映产量和价格的变化。<\/li>\n<li><strong>实际 GDP<\/strong>：用某个固定基准年的价格计算，只反映产量的变化。新闻里说的“经济增长率”，一般指实际 GDP 的增长率。<\/li>\n<\/ul>\n<p>大致来说：名义 GDP 增长率 ≈ 实际 GDP 增长率 + 通胀率。<\/p>\n\n<h2>GDP 平减指数<\/h2>\n<p>GDP 平减指数 = 名义 GDP ÷ 实际 GDP × 100。它衡量的是一个经济体生产的所有产品和服务的整体价格水平。它和消费者物价指数（CPI）都是衡量通胀的指标，但有区别：<\/p>\n<ul>\n<li><strong>范围不同<\/strong>：平减指数涵盖所有国内生产的东西，包括投资品和出口品；CPI 只看居民消费的一篮子商品。<\/li>\n<li><strong>进口品<\/strong>：CPI 包含进口消费品（如进口汽油），平减指数不包含进口品。<\/li>\n<li><strong>权重<\/strong>：平减指数的权重随生产结构自动变化，CPI 使用相对固定的消费篮子。<\/li>\n<\/ul>\n\n<h2>为什么名义值也很重要<\/h2>\n<p>虽然实际 GDP 衡量真实产出，但很多金融问题和名义值直接相关：企业收入和利润是名义的，税收是名义的，债务也是名义的。名义 GDP 增长越快，政府和企业的债务负担相对越轻；名义增长停滞，即使实际增长尚可，债务负担也会显得沉重。<\/p>\n\n<div class=\"desk\">\n<p>分析股票市场时，企业盈利增长更接近名义 GDP 增长。分析主权债务可持续性时，关键指标是名义增长率和利率的比较：名义增长高于利率，债务率可以自然下降。在通缩环境中，平减指数为负，名义 GDP 增长可能低于实际 GDP 增长，这对债务人非常不利。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>日本在 1990 年代泡沫破裂后长期面临通缩。GDP 平减指数从 1990 年代后期起连续多年下降。日本名义 GDP 在 1997 年前后达到约 530 万亿日元，此后近二十年基本没有增长，而同期实际 GDP 仍有小幅增长。名义收入不增长、债务却在累积，日本政府债务占 GDP 的比率因此持续攀升，成为发达国家中最高的之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>名义 GDP 用当年价格计算，实际 GDP 用固定价格计算，只反映产量变化。<\/li>\n<li>GDP 平减指数等于名义 GDP 除以实际 GDP，涵盖所有国内生产，和 CPI 的范围与权重不同。<\/li>\n<li>企业盈利、税收和债务都是名义的，名义增长对债务负担和股市都很重要。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家实际 GDP 增长 1%，GDP 平减指数下降 2%。它的名义 GDP 怎样变化？对政府债务比率意味着什么？<\/summary>\n<div><p>名义 GDP 大约下降 1%（1% + (−2%)）。如果政府债务的名义金额不变，债务占 GDP 的比率反而上升，即使经济在实际增长。如果政府还有赤字，债务增加而名义 GDP 下降，比率会上升得更快。这就是通缩对高负债国家特别危险的原因。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-1\"><\/a><\/li>\n<li><a href=\"#L5-6\"><\/a><\/li>\n<li><a href=\"#L2-13\"><\/a><\/li>\n<\/ul><\/div>\n","2.4":"<div class=\"scene\">\n<p>2020 年 4 月，美国家庭的储蓄率突然跳到 30% 以上，是平时的四五倍。人们并不是一夜之间变得节俭：餐馆、商场、电影院都关了门，想花钱也花不出去；同时政府发放了大量补贴，收入并没有下降多少。收入、消费和储蓄之间的关系，是理解一个经济体的起点。其中最关键的概念是<strong>可支配收入（disposable income）<\/strong>。<\/p>\n<\/div>\n\n<h2>可支配收入：真正能花的钱<\/h2>\n<p>可支配收入 = 个人收入 − 个人所得税等直接税 + 政府转移支付（比如养老金、失业救济、补贴）。它是家庭真正可以用来消费或储蓄的钱。<\/p>\n<p>可支配收入只有两个去处：消费（consumption）或储蓄（saving）。储蓄率 = 储蓄 ÷ 可支配收入。<\/p>\n\n<h2>人们怎样决定花多少、存多少<\/h2>\n<ul>\n<li><strong>边际消费倾向（MPC）<\/strong>：收入每多 1 元，多花多少。低收入家庭的边际消费倾向通常更高，多拿到的钱大部分会花掉；高收入家庭会存起更多。<\/li>\n<li><strong>持久收入假说<\/strong>：经济学家弗里德曼认为，人们的消费主要取决于对长期平均收入的预期，而不是当期收入。一次性的奖金对消费的影响，小于一次永久性的加薪。<\/li>\n<li><strong>生命周期假说<\/strong>：莫迪利安尼认为，人们会在一生中平滑消费：工作时储蓄，退休后花掉积蓄。所以人口结构影响全社会的储蓄率。<\/li>\n<li><strong>预防性储蓄<\/strong>：对未来越不确定，比如担心失业、医疗、养老，储蓄越多。<\/li>\n<\/ul>\n<p>此外，财富增加（比如房价、股价上涨）也会让人们多消费，这叫财富效应（wealth effect）。<\/p>\n\n<div class=\"desk\">\n<p>在大多数发达经济体中，居民消费占 GDP 的一半到七成，美国接近七成。所以市场非常关注零售销售、个人消费支出和消费者信心等数据。储蓄率的变化也很重要：储蓄率下降意味着消费在“透支”积蓄，可能难以持续；储蓄率高企则意味着有潜在的消费力量。在中国，较高的家庭储蓄率是讨论经济再平衡的核心问题。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>据美国经济分析局的数据，美国个人储蓄率在 2020 年 4 月升至约 32%，创下有记录以来的最高值，此前多年一般在 7% 左右。疫情限制了消费，而失业救济和直接补贴支撑了收入。2020–2021 年，美国家庭积累了约 2 万亿美元的“超额储蓄”。这些储蓄在之后两年被逐渐花掉，支撑了消费，也被认为是 2021–2022 年通胀上升的原因之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>可支配收入是税后加转移支付的收入，只能用于消费或储蓄。<\/li>\n<li>消费取决于边际消费倾向、对长期收入的预期、生命周期阶段、不确定性和财富。<\/li>\n<li>消费是 GDP 最大的组成部分，储蓄率的变化反映了消费的潜力和可持续性。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>政府想刺激消费，有两种方案：给所有家庭发一次性的现金补贴，或者永久降低低收入家庭的所得税。哪种对消费的刺激更大？为什么？<\/summary>\n<div><p>按持久收入假说，永久性减税对消费的刺激更大，因为它提高了家庭对长期收入的预期，家庭会持续增加消费。一次性补贴有相当一部分可能被存起来。另外，低收入家庭的边际消费倾向更高，把钱集中给他们，也比平均发放给所有家庭刺激效果更好。但一次性补贴见效更快，在紧急情况下也有它的价值。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-5\"><\/a><\/li>\n<li><a href=\"#L2-19\"><\/a><\/li>\n<li><a href=\"#L23-7\"><\/a><\/li>\n<\/ul><\/div>\n","2.5":"<div class=\"scene\">\n<p>在经济学家说的“投资”里，你买股票不算投资。你买新房子算投资，一家公司买新机器算投资，商店仓库里多出来的货也算投资。经济学的<strong>投资（investment）<\/strong>，指的是增加社会生产能力的支出，也叫<strong>资本形成（capital formation）<\/strong>。它在 GDP 里所占比例不如消费大，却是经济周期中波动最大、最值得关注的部分。<\/p>\n<\/div>\n\n<h2>投资包括什么<\/h2>\n<ul>\n<li><strong>企业固定投资<\/strong>：厂房、机器设备、软件、研发。<\/li>\n<li><strong>住宅投资<\/strong>：新建住房。买二手房只是资产转手，不算。<\/li>\n<li><strong>存货变化（inventory change）<\/strong>：企业库存的增加或减少。生产出来还没卖掉的东西，先计入存货投资。<\/li>\n<li><strong>政府投资<\/strong>：道路、桥梁等公共设施，统计上有时单独列入政府支出。<\/li>\n<\/ul>\n<p>买股票、债券或二手资产属于金融投资，是资产所有权的转移，不创造新的生产能力，所以不计入 GDP 中的投资。<\/p>\n\n<h2>投资由什么决定<\/h2>\n<ul>\n<li><strong>利率和融资成本<\/strong>：借钱越贵，越少项目值得投资。这是货币政策影响经济的主要渠道之一。<\/li>\n<li><strong>预期需求<\/strong>：企业预计未来销售增长，才会扩大产能。需求增长加快会带来投资更大幅度的增加，这叫加速器效应（accelerator effect）。<\/li>\n<li><strong>利润和现金流<\/strong>：利润好的企业更有能力和信心投资。<\/li>\n<li><strong>不确定性<\/strong>：前景越不确定，企业越倾向于观望，因为投资往往难以撤回。<\/li>\n<li><strong>技术和政策<\/strong>：新技术（如人工智能、新能源）和税收优惠会引发投资浪潮。<\/li>\n<\/ul>\n\n<h2>为什么投资波动大<\/h2>\n<p>消费比较平稳，因为人总要吃饭穿衣。投资则可以推迟：经济前景一变差，企业就暂停扩张计划，存货迅速调整。所以衰退时投资往往下降最多，复苏时又反弹最快。<\/p>\n\n<div class=\"desk\">\n<p>分析师常看的投资相关指标包括：企业资本支出（capex）计划、耐用品订单、工业产能利用率、新屋开工和建筑许可、库存与销售比。行业层面，半导体、工程机械、工业自动化等公司的业绩和资本支出周期高度相关。金融条件收紧时，投资通常最先受到影响。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>中国是投资占 GDP 比重最高的大型经济体之一。根据世界银行的数据，中国的资本形成总额占 GDP 的比重自 2000 年代后期以来长期在 40% 以上，远高于美国约 20% 的水平。高投资推动了基础设施和工业的快速发展，但也带来了部分行业产能过剩、地方政府和房地产债务累积等问题。近年来如何从投资驱动转向消费驱动，是中国经济讨论的核心议题之一。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>经济学的投资是增加生产能力的支出，包括企业固定投资、住宅投资和存货变化，不包括买股票。<\/li>\n<li>投资取决于利率、预期需求、利润、不确定性和技术政策，需求变化会被加速器效应放大。<\/li>\n<li>投资是 GDP 中波动最大的部分，衰退时下降最多、复苏时反弹最快。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个季度 GDP 增长很强，但细看发现主要来自存货增加。为什么经济学家会对这个增长有所保留？<\/summary>\n<div><p>存货增加可能是企业主动备货，预期需求会上升；但也可能是东西卖不出去、被动积压。如果是后者，企业接下来会减少生产来消化库存，未来几个季度的 GDP 增长就会被拖累。所以存货推动的增长通常被认为质量较低、难以持续，要看最终需求（消费、固定投资、净出口）是否强劲。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-4\"><\/a><\/li>\n<li><a href=\"#L2-7\"><\/a><\/li>\n<li><a href=\"#L7-4\"><\/a><\/li>\n<\/ul><\/div>\n","2.6":"<div class=\"scene\">\n<p>一辆车的发动机设计时速是 120 公里。你可以短时间开到 140 公里，但发动机会过热，油耗飙升，迟早出问题；如果长期只开 60 公里，又浪费了它的能力。经济也有一个类似的“设计时速”：在不引发通胀加速的情况下，经济能持续生产多少。它叫<strong>潜在产出（potential output）<\/strong>。实际产出和潜在产出之间的差距，叫<strong>产出缺口（output gap）<\/strong>。<\/p>\n<\/div>\n\n<h2>潜在产出：经济的可持续速度<\/h2>\n<p>潜在产出取决于经济的供给能力：有多少劳动力、多少资本、技术水平多高。它反映的是充分利用资源时，经济能持续生产的水平，通常增长比较平稳。潜在产出的增长率，常被称为潜在增长率。<\/p>\n\n<h2>产出缺口：经济是过热还是偏冷<\/h2>\n<ul>\n<li><strong>负产出缺口<\/strong>：实际产出低于潜在产出。经济偏冷，有失业的工人和闲置的产能，通胀压力较小，甚至下降。<\/li>\n<li><strong>正产出缺口<\/strong>：实际产出高于潜在产出。经济过热，工人和工厂都在超负荷运转，工资和价格上涨压力增大，通胀容易上升。<\/li>\n<\/ul>\n<p>央行和政府根据产出缺口判断政策方向：负缺口时宽松，正缺口时收紧。<\/p>\n\n<h2>最大的难题：看不见<\/h2>\n<p>潜在产出无法直接观察，只能估算。不同的方法（统计滤波、生产函数模型、调查数据）可能得出差别很大的结果，而且事后经常被大幅修订。危机过后，潜在产出本身也可能受损：长期失业让工人技能退化，投资不足让资本积累放缓，这种现象叫“滞后效应”（hysteresis）。所以政策制定者常常在不确定中做判断。<\/p>\n\n<div class=\"desk\">\n<p>产出缺口是宏观分析和利率预测的核心变量之一。泰勒规则等利率规则把它和通胀缺口作为输入。美国国会预算办公室、IMF、欧盟委员会和各国央行都会公布自己的潜在产出估计。宏观交易员关注的是：市场是否低估了经济过热的风险，或者高估了闲置资源的规模。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年初，美国经济正从疫情中恢复，政府又推出了 1.9 万亿美元的刺激计划。前财长萨默斯等经济学家警告，刺激规模远大于估计的产出缺口，可能导致经济过热和通胀。美联储当时认为通胀上升是暂时的。2022 年 6 月，美国 CPI 同比上涨 9.1%，创 1981 年以来新高，美联储随后以几十年来最快的速度加息。事后看，产出缺口被高估了，经济比政策制定者以为的更接近满负荷。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>潜在产出是经济在不引发通胀加速的情况下能持续生产的水平，由劳动力、资本和技术决定。<\/li>\n<li>实际产出低于潜在产出是负缺口，经济偏冷；高于潜在产出是正缺口，经济过热、通胀压力上升。<\/li>\n<li>潜在产出无法直接观察，估计误差大，是政策判断失误的重要来源。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家人口老龄化，劳动力每年减少 0.5%，生产率每年提高 1%。它的潜在增长率大约是多少？这对它的利率和股市长期回报意味着什么？<\/summary>\n<div><p>粗略地说，潜在增长率约等于劳动力增长加生产率增长，即大约 0.5%。潜在增长率低，意味着投资需求较弱，中性利率可能较低；企业整体盈利的长期增长也会较慢，股市的长期回报可能低于高增长经济体。日本和部分欧洲国家就面临这种情况。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-7\"><\/a><\/li>\n<li><a href=\"#L7-7\"><\/a><\/li>\n<li><a href=\"#L2-22\"><\/a><\/li>\n<\/ul><\/div>\n","2.7":"<div class=\"scene\">\n<p>2020 年 2 月，美国失业率只有 3.5%，是半个世纪以来的最低水平之一。两个月后，失业率跳到接近 15%，几千万人失去工作。又过了不到两年，失业率回到 4% 以下。经济总是在起起落落，只是这一次快得惊人。这种起落有一个名字：<strong>经济周期（business cycle）<\/strong>。<\/p>\n<\/div>\n\n<h2>周期的四个阶段<\/h2>\n<ul>\n<li><strong>扩张（expansion）<\/strong>：产出、就业和收入增长，企业投资增加，信心上升。<\/li>\n<li><strong>见顶（peak）<\/strong>：增长达到高点，常伴随产能紧张、通胀上升、利率走高。<\/li>\n<li><strong>衰退（recession）<\/strong>：产出和就业普遍下降，企业削减投资和招聘，违约增加。<\/li>\n<li><strong>复苏（recovery）或谷底（trough）<\/strong>：下降停止，经济开始回升，进入新一轮扩张。<\/li>\n<\/ul>\n<p>“周期”这个词容易让人以为它很规律，其实每轮周期的长度和幅度差别很大。战后美国的扩张期从一年多到十年以上不等，衰退通常持续几个月到一年半左右。<\/p>\n\n<h2>周期由什么驱动<\/h2>\n<ul>\n<li><strong>需求冲击<\/strong>：消费者和企业信心变化、政府支出变化、出口需求变化。<\/li>\n<li><strong>供给冲击<\/strong>：油价暴涨、疫情、自然灾害。<\/li>\n<li><strong>货币和信用<\/strong>：央行加息、银行收紧放贷、资产价格下跌。很多衰退前都出现过央行收紧。<\/li>\n<li><strong>投资和库存<\/strong>：企业在乐观时过度投资和备货，悲观时集中削减。<\/li>\n<\/ul>\n\n<h2>谁来判定周期<\/h2>\n<p>在美国，经济周期的高点和低点由美国国家经济研究局（NBER）的一个委员会判定。他们综合看就业、收入、消费、工业生产等多项指标，而不只看 GDP，并且通常在事后几个月甚至一年以后才正式宣布。欧洲有类似的机构（CEPR）。<\/p>\n\n<div class=\"desk\">\n<p>投资者把指标分成三类：领先指标（leading）在经济转折前变化，比如 PMI 新订单、收益率曲线、初请失业金人数、股市；同步指标（coincident）和经济同时变化，比如工业生产、就业；滞后指标（lagging）在转折后才变化，比如失业率、核心通胀。资产配置会随周期阶段调整：扩张早期偏好股票和周期股，衰退期偏好国债和防御性资产。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>NBER 后来判定，美国经济在 2020 年 2 月见顶，4 月见底。这次衰退只持续了两个月，是美国有记录以来最短的一次，但下降幅度极大：2020 年第二季度美国实际 GDP 按年率计算下降约 30%。此前的扩张期从 2009 年 6 月持续到 2020 年 2 月，长达 128 个月，是美国有记录以来最长的扩张期。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>经济周期分为扩张、见顶、衰退和复苏四个阶段，长度和幅度很不规律。<\/li>\n<li>周期由需求冲击、供给冲击、货币信用和投资库存的变化驱动。<\/li>\n<li>美国的周期由 NBER 事后判定；投资者用领先、同步和滞后指标判断所处阶段。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么失业率是滞后指标？为什么股市常被认为是领先指标？<\/summary>\n<div><p>企业在经济开始下滑时，通常先削减加班和招聘，确定前景变差后才裁员；复苏时也要等订单稳定才敢招人，所以失业率的变化落后于经济本身。股市反映的是投资者对未来盈利的预期，会提前对经济转折做出反应，所以常常在衰退结束前就开始上涨，在衰退开始前就开始下跌。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-8\"><\/a><\/li>\n<li><a href=\"#L23-2\"><\/a><\/li>\n<li><a href=\"#L23-6\"><\/a><\/li>\n<\/ul><\/div>\n","2.8":"<div class=\"scene\">\n<p>2022 年上半年，美国实际 GDP 连续两个季度下降。按一个流行的说法，这就是“技术性衰退”。但当时美国每个月新增几十万个就业岗位，失业率接近历史低点。NBER 最终没有把这段时间判定为衰退。那么，什么才算<strong>衰退（recession）<\/strong>？比衰退更严重的<strong>萧条（depression）<\/strong>又是什么？<\/p>\n<\/div>\n\n<h2>衰退：广泛而明显的下降<\/h2>\n<p>常见的简便定义是：实际 GDP 连续两个季度下降，叫技术性衰退（technical recession）。这个定义简单，但可能误判：<\/p>\n<ul>\n<li>GDP 下降可能是库存或净出口的波动造成的，其他方面依然强劲。<\/li>\n<li>一次严重但短暂的下跌，可能只有一个季度为负，却是真正的衰退。<\/li>\n<\/ul>\n<p>NBER 的定义更全面：衰退是经济活动在整个经济中显著下降，持续超过几个月。它看三个维度：深度（下降多少）、广度（是否扩散到多个行业）、持续时间。<\/p>\n\n<h2>萧条：长期而严重的衰退<\/h2>\n<p>萧条没有严格的定义，一般指持续多年、产出大幅下降、失业率极高的严重衰退。经济学家常开玩笑说：邻居失业是衰退，自己失业是萧条。<\/p>\n<p>大萧条（Great Depression）是最典型的例子。此外，一些国家在危机后也经历过类似萧条的时期，比如 2010 年代的希腊。<\/p>\n\n<h2>衰退的代价<\/h2>\n<ul>\n<li>失业上升，收入下降，部分人长期失去工作技能和机会。<\/li>\n<li>企业利润下降，违约和破产增加，银行坏账上升。<\/li>\n<li>政府税收减少、支出增加，赤字扩大。<\/li>\n<li>深度衰退可能永久性地降低潜在产出。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>在信贷和风险管理中，衰退是最重要的压力情景之一。银行的压力测试会设定“严重衰退”情景：GDP 下降几个百分点、失业率上升到 10% 左右、房价和股价大跌，再计算贷款损失和资本消耗。信用利差、违约率和评级下调在衰退中会大幅上升，高收益债和杠杆贷款受影响最大。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1929 年到 1933 年，美国实际 GDP 下降约四分之一，失业率在 1933 年达到约 25%，物价下跌约四分之一，约 9,000 家银行倒闭。直到 1930 年代中后期，美国实际产出才恢复到 1929 年的水平，失业率则到二战时才真正降下来。相比之下，2022 年上半年美国 GDP 两个季度小幅下降，主要受库存和贸易波动影响，就业持续强劲，NBER 未判定为衰退。两者都有“GDP 下降”，含义却天差地别。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>技术性衰退指 GDP 连续两个季度下降，但 NBER 看的是深度、广度和持续时间。<\/li>\n<li>萧条是长期而严重的衰退，大萧条是最典型的例子。<\/li>\n<li>衰退带来失业、违约、赤字和潜在产出损失，是风险管理中最重要的压力情景。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家 GDP 连续两个季度各下降 0.1%，但失业率持续下降、消费和就业增长强劲。你会认为它处于衰退吗？还需要看什么？<\/summary>\n<div><p>大概率不是真正的衰退，因为下降幅度很小，且没有扩散到就业和消费。需要看 GDP 下降的来源：如果来自库存调整或进口激增等波动，意义有限；还要看实际收入、工业生产、企业利润和领先指标是否走弱。如果它们都稳健，只是技术性的数字，不必过度担心。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-7\"><\/a><\/li>\n<li><a href=\"#L2-24\"><\/a><\/li>\n<li><a href=\"#LH3-2\"><\/a><\/li>\n<\/ul><\/div>\n","2.9":"<div class=\"scene\">\n<p>小张辞职后在找更好的工作，两个月后入职；老李在一家煤矿工作了二十年，煤矿关了，他会的技能在当地已经没有用武之地；小王所在的餐厅因为经济不景气生意太差，裁掉了一半员工。三个人都失业了，但原因完全不同，需要的政策也不同。经济学把失业分成三种：<strong>摩擦性失业（frictional）<\/strong>、<strong>结构性失业（structural）<\/strong>和<strong>周期性失业（cyclical）<\/strong>。<\/p>\n<\/div>\n\n<h2>失业率怎么算<\/h2>\n<p>失业率 = 失业人数 ÷ 劳动力。失业者指没有工作、正在找工作、并且可以马上上班的人。不找工作的人（学生、退休人员、全职照顾家庭的人、放弃找工作的人）不算劳动力，也不算失业。<\/p>\n<p>所以失业率下降不一定是好事：如果很多人因为找不到工作而放弃，失业率也会下降。因此还要看劳动参与率（labor force participation rate）和就业人口比。美国还公布范围更广的 U-6 失业率，把兼职但想要全职的人和放弃找工作的人也算进去。<\/p>\n\n<h2>三种失业<\/h2>\n<ul>\n<li><strong>摩擦性失业<\/strong>：人们在换工作、刚毕业找工作时的短暂失业。它在一个流动的劳动力市场中总会存在，甚至是健康的：说明人们在寻找更合适的岗位。<\/li>\n<li><strong>结构性失业<\/strong>：工人的技能、地点和岗位需求不匹配。行业衰落、技术变革、产业转移都会造成结构性失业。它往往持续较长，需要培训、迁移等政策。<\/li>\n<li><strong>周期性失业<\/strong>：经济衰退、需求不足造成的失业。经济复苏后会减少，主要靠货币和财政政策应对。<\/li>\n<\/ul>\n<p>摩擦性失业和结构性失业加起来，大致对应“自然失业率”（natural rate of unemployment）：经济处于潜在产出时仍会存在的失业水平。<\/p>\n\n<div class=\"desk\">\n<p>就业数据是市场最关注的宏观数据之一。美国每月第一个星期五公布非农就业报告，包括新增就业人数、失业率、平均时薪和劳动参与率。交易员关注的是数字和市场预期的差距，以及工资增长对通胀的影响。每周的初请失业金人数是观察劳动力市场变化的高频指标。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2000 年代初，德国失业率居高不下，被称为“欧洲病夫”。2003 年到 2005 年，德国推行“哈茨改革”，改革失业救济、加强就业服务、放宽临时工和“迷你工作”的限制。按国际劳工组织口径，德国失业率从 2005 年的约 11% 降到 2010 年代后期的 4% 以下。改革降低了结构性失业，但也引发了关于低薪工作增多、收入差距扩大的争议。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>失业率等于失业人数除以劳动力，还要结合劳动参与率和更广口径的失业率来看。<\/li>\n<li>失业分为摩擦性、结构性和周期性三种，原因和对策各不相同。<\/li>\n<li>摩擦性和结构性失业大致构成自然失业率，周期性失业主要靠宏观政策应对。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家的失业率从 6% 降到 5%，但同期劳动参与率也从 63% 降到 61%。这是好消息吗？<\/summary>\n<div><p>不一定。失业率下降，可能部分是因为一些人放弃找工作、退出了劳动力，他们不再被算作失业者。劳动参与率下降两个百分点，意味着就业人口占比可能并没有改善，甚至恶化。还要看原因：如果是人口老龄化导致退休增加，属于结构性变化；如果是找不到工作的人灰心退出，则说明劳动力市场其实较弱。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-11\"><\/a><\/li>\n<li><a href=\"#L23-3\"><\/a><\/li>\n<li><a href=\"#L2-12\"><\/a><\/li>\n<\/ul><\/div>\n","2.10":"<div class=\"scene\">\n<p>2022 年秋天，欧元区的通胀率超过 10%，是欧元诞生以来的最高水平。和美国不同，欧洲的通胀主要不是因为大家抢着买东西，而是因为俄乌冲突后天然气和电力价格暴涨，企业成本飙升，只好提价。同样是通胀，原因可能完全不同。经济学把通胀的来源分为两大类：<strong>需求拉动（demand-pull）<\/strong>和<strong>成本推动（cost-push）<\/strong>。<\/p>\n<\/div>\n\n<h2>需求拉动：钱太多，东西太少<\/h2>\n<p>当整个经济的需求超过供给能力时，企业发现东西好卖，就会提价。常见原因：<\/p>\n<ul>\n<li>宽松的货币政策，信贷快速增长；<\/li>\n<li>大规模的财政刺激；<\/li>\n<li>资产价格上涨带来的财富效应；<\/li>\n<li>出口需求激增。<\/li>\n<\/ul>\n<p>需求拉动的通胀通常伴随产出和就业上升，经济处于正产出缺口。<\/p>\n\n<h2>成本推动：生产变贵了<\/h2>\n<p>当生产成本上升时，即使需求没有变，企业也会提价：<\/p>\n<ul>\n<li>能源和原材料价格上涨，比如石油危机；<\/li>\n<li>供应链中断，比如疫情期间的芯片和航运短缺；<\/li>\n<li>工资快速上涨超过生产率增长；<\/li>\n<li>本币贬值，进口商品变贵。<\/li>\n<\/ul>\n<p>成本推动的通胀往往伴随产出下降，央行面临两难：加息能抑制通胀，但会让经济更弱。<\/p>\n\n<h2>预期：让通胀自我延续<\/h2>\n<p>还有一个关键因素：通胀预期（inflation expectations）。如果人们相信通胀会持续，工人会要求更高的工资，企业会更早、更多地提价，通胀就会自我实现。工资和价格互相推高的过程叫“工资-价格螺旋”（wage-price spiral）。央行最担心的，就是一次性的价格冲击变成持续的高通胀预期。<\/p>\n\n<div class=\"desk\">\n<p>分析通胀时，交易员和经济学家会把 CPI 拆开看：能源和食品波动大，常被剔除后看核心通胀（core inflation）；商品通胀和服务通胀的驱动因素不同，服务通胀更多反映工资；租金和住房成本变化较慢但影响持久。判断通胀是需求拉动还是成本推动，直接影响对央行政策路径的预测。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年俄乌冲突爆发后，欧洲天然气价格一度涨到冲突前的数倍。欧元区调和消费者物价指数（HICP）同比涨幅在 2022 年 10 月达到 10.6% 的峰值，其中能源价格同比上涨超过 40%。欧洲央行从 2022 年 7 月开始加息，结束了长达八年的负利率。随着能源价格回落，欧元区通胀在 2023 年底回落到 3% 以下。这是一次典型的成本推动通胀，但随后也通过工资和服务价格扩散开来。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>需求拉动通胀来自需求超过供给能力，通常伴随经济过热。<\/li>\n<li>成本推动通胀来自能源、原材料、工资或进口成本上升，常伴随产出下降，让央行两难。<\/li>\n<li>通胀预期能让通胀自我延续，防止预期失控是央行的核心任务。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>油价突然大涨，导致通胀上升。央行该不该加息？需要考虑哪些因素？<\/summary>\n<div><p>如果油价上涨是一次性的，通胀会在一年后自然回落，加息反而会让本已受油价冲击的经济更弱，所以央行可以“看穿”这次冲击。但如果通胀预期开始上升、工资开始追赶物价、通胀扩散到其他商品和服务，就需要加息防止通胀持续。还要看经济原本是否已经过热：如果需求本来就强，加息的理由更充分。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L5-6\"><\/a><\/li>\n<li><a href=\"#L23-4\"><\/a><\/li>\n<li><a href=\"#L2-15\"><\/a><\/li>\n<\/ul><\/div>\n","2.11":"<div class=\"scene\">\n<p>1958 年，新西兰经济学家菲利普斯研究了英国近一百年的数据，发现一个规律：失业率低的年份，工资涨得快；失业率高的年份，工资涨得慢。后来人们把它推广到通胀，得出一个诱人的结论：政府可以在通胀和失业之间做选择，多一点通胀，换少一点失业。这条曲线叫<strong>菲利普斯曲线（Phillips curve）<\/strong>。十几年后，现实给了这个结论沉重的一击。<\/p>\n<\/div>\n\n<h2>菲利普斯曲线：通胀和失业的取舍<\/h2>\n<p>直觉很简单：失业率低时，企业抢人，工人议价能力强，工资上涨，企业把成本转嫁到价格上，通胀上升。失业率高时，反之。画在图上，通胀和失业呈反向关系。<\/p>\n<p>1960 年代，很多政策制定者相信可以利用这个取舍：接受稍高的通胀，换取更低的失业。<\/p>\n\n<h2>预期加入后：长期没有取舍<\/h2>\n<p>1968 年前后，经济学家弗里德曼和菲尔普斯指出：这个取舍只在短期存在。如果政府长期用通胀压低失业，人们会逐渐预期到更高的通胀，要求更高的工资，最终失业率回到原来的水平，通胀却更高了。<\/p>\n<ul>\n<li>短期菲利普斯曲线：在通胀预期给定时，通胀和失业有取舍。<\/li>\n<li>长期菲利普斯曲线：是一条垂直线，位于自然失业率处。长期内，通胀高低不影响失业率。<\/li>\n<\/ul>\n<p>这个自然失业率，也叫“非加速通胀失业率”（NAIRU）：失业率低于它，通胀会不断上升；高于它，通胀会下降。1970 年代出现的高通胀加高失业（滞胀）证实了这个观点。<\/p>\n\n<h2>曲线为什么变“平”了<\/h2>\n<p>2010 年代，很多发达国家的失业率降到很低，通胀却一直不高，菲利普斯曲线看起来几乎是平的。可能的原因包括：央行可信度提高、通胀预期被牢牢锚定；全球化和技术抑制了价格；工会力量减弱。但 2021–2022 年通胀飙升，又说明曲线在某些情况下可能重新变陡。<\/p>\n\n<div class=\"desk\">\n<p>央行的政策讨论中，菲利普斯曲线和 NAIRU 依然是核心框架。市场会关注央行对自然失业率的估计：如果央行认为失业率已经低于 NAIRU，就更可能加息。交易员会把工资增长、职位空缺和失业率的比率等数据，作为判断劳动力市场紧张程度和未来通胀的依据。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2019 年，美国失业率降到约 3.5%，是半个世纪以来的低点，而美联储关注的核心 PCE 通胀率仍在 2% 以下。很多人认为菲利普斯曲线已经“死了”。2021 年起，在大规模刺激和供应冲击下，美国职位空缺与失业人数之比一度达到约 2 比 1，工资和通胀同时快速上升。经济学家认为，当劳动力市场极度紧张时，菲利普斯曲线可能是非线性的，会突然变陡。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>菲利普斯曲线描述了短期内通胀和失业的反向关系。<\/li>\n<li>加入通胀预期后，长期内没有取舍：长期曲线垂直于自然失业率（NAIRU）。<\/li>\n<li>2010 年代曲线变平，2021–2022 年又显示极度紧张时可能突然变陡。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>如果央行有很高的可信度，大家都相信通胀会回到 2%，这会怎样影响菲利普斯曲线的形状？<\/summary>\n<div><p>通胀预期被锚定在 2%，即使失业率暂时偏低，工人和企业也不会大幅提高对未来通胀的预期，工资和价格不容易螺旋上升，所以短期内失业率变化对通胀的影响较小，曲线显得更平。这对央行是好事：经济波动时通胀更稳定。但也意味着从通胀数据很难判断经济是否过热，可能延误政策。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-9\"><\/a><\/li>\n<li><a href=\"#L2-15\"><\/a><\/li>\n<li><a href=\"#L2-28\"><\/a><\/li>\n<\/ul><\/div>\n","2.12":"<div class=\"scene\">\n<p>2009 年，德国经济萎缩了约 5.7%，是战后最严重的衰退之一。按照一般规律，失业率应该大幅上升。可德国的失业率几乎没怎么动。同一时期，美国 GDP 下降幅度小得多，失业率却翻了一倍。产出和就业之间的关系，有一个经验法则，叫<strong>奥肯定律（Okun's law）<\/strong>。但德国的例子说明，这个“定律”并不是物理定律。<\/p>\n<\/div>\n\n<h2>奥肯定律：产出和失业的经验关系<\/h2>\n<p>1962 年，美国经济学家阿瑟·奥肯发现：实际 GDP 增长率每高于潜在增长率一个百分点，失业率就会下降一部分；反之亦然。常见的经验数字是：产出缺口每扩大约 2 个百分点，失业率大约上升 1 个百分点。<\/p>\n<p>直觉是：产出下降，企业需要的劳动力减少，会裁员或减少招聘。但企业不会一比一地调整员工，还会调整工作时间、加班和生产率，所以失业率的变化小于产出的变化。<\/p>\n\n<h2>为什么各国不一样<\/h2>\n<p>奥肯系数在不同国家、不同时期差别很大：<\/p>\n<ul>\n<li><strong>劳动力市场灵活的国家<\/strong>（如美国）：雇主可以快速裁员和招聘，失业率对产出变化反应大。<\/li>\n<li><strong>就业保护强的国家<\/strong>（如德国、日本）：裁员成本高、程序复杂，企业更多通过减少工时、动用工时账户来调整，失业率反应小。<\/li>\n<li>政策工具也会改变这个关系，比如政府补贴的短时工作制度。<\/li>\n<\/ul>\n\n<h2>用处和局限<\/h2>\n<p>奥肯定律常被用来快速估算：GDP 增长放缓会让失业率上升多少，或者要降低失业率需要多快的增长。但它只是平均的经验关系，在危机、结构变化和政策干预下可能大幅偏离。<\/p>\n\n<div class=\"desk\">\n<p>宏观分析师用奥肯定律检验数据是否“对得上”：如果 GDP 增长放缓而就业依然强劲，可能说明生产率下降，或者某个数据会被修正。在构建压力测试情景时，经济学家也会用奥肯关系确定 GDP 下降和失业率上升的组合是否合理。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2009 年，德国 GDP 下降约 5.7%，但失业率只小幅上升，2010 年起就开始下降。关键在于“短时工作”（Kurzarbeit）制度：企业减少员工工时而不裁员，政府补贴员工损失的大部分收入。2009 年峰值时，约 140 万德国工人参与了这一计划。经济复苏后，企业可以迅速恢复生产，不用重新招聘和培训。新冠疫情期间，德国和很多欧洲国家再次大规模使用类似制度。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>奥肯定律是产出和失业的经验关系：产出缺口扩大约 2 个百分点，失业率约上升 1 个百分点。<\/li>\n<li>它在不同国家差别很大，劳动力市场越灵活，失业率对产出的反应越大。<\/li>\n<li>短时工作等政策可以大幅改变这一关系，德国 2009 年是典型例子。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>短时工作制度能在衰退中保住就业。它有什么潜在的缺点？<\/summary>\n<div><p>如果衰退只是暂时的，它能保住技能和雇佣关系，复苏更快。但如果某些企业或行业是因为结构性原因衰落，补贴会让本该消失的岗位维持下去，延缓劳动力向更有前景的行业转移，这叫“僵尸岗位”问题。它还需要大量财政支出。所以这类制度通常有时间限制，并要求企业证明困难是暂时的。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-6\"><\/a><\/li>\n<li><a href=\"#L2-9\"><\/a><\/li>\n<li><a href=\"#L2-20\"><\/a><\/li>\n<\/ul><\/div>\n","2.13":"<div class=\"scene\">\n<p>物价下跌听起来是好事：东西越来越便宜，钱越来越值钱。可是央行最害怕的恰恰是物价持续下跌。2015 年初，欧元区的物价同比下降，欧洲央行随即推出大规模购债计划，拼命想把通胀拉回来。为什么？要理解这一点，先要分清几个相似的词：<strong>通缩（deflation）<\/strong>、<strong>通胀回落（disinflation）<\/strong>和<strong>再通胀（reflation）<\/strong>。<\/p>\n<\/div>\n\n<h2>三个容易混淆的词<\/h2>\n<ul>\n<li><strong>通缩<\/strong>：整体物价水平下降，通胀率为负。比如通胀率从 1% 变成 −1%。<\/li>\n<li><strong>通胀回落<\/strong>：通胀率下降，但仍为正，物价仍在上涨，只是涨得慢了。比如从 8% 降到 3%。<\/li>\n<li><strong>再通胀<\/strong>：在低通胀或通缩之后，通胀重新回升，通常伴随经济复苏和政策刺激。<\/li>\n<\/ul>\n<p>新闻里常把“通胀回落”误说成“通缩”，两者差别很大。<\/p>\n\n<h2>为什么通缩很危险<\/h2>\n<ul>\n<li><strong>推迟消费<\/strong>：如果人们预期东西明年更便宜，就会推迟购买，需求下降，物价进一步下跌。<\/li>\n<li><strong>债务负担加重<\/strong>：债务的金额是固定的，物价和收入下降后，还债更难。这叫“债务通缩”，会导致违约和银行危机。<\/li>\n<li><strong>实际利率上升<\/strong>：名义利率最低只能降到零附近，物价下跌时，实际利率（名义利率减通胀）反而上升，货币政策失去作用。<\/li>\n<li><strong>工资难降<\/strong>：名义工资很难下调，物价下跌时企业实际用工成本上升，可能裁员。<\/li>\n<\/ul>\n<p>当然，并非所有物价下跌都是坏事。如果是技术进步、生产率提高带来的“好的通缩”，比如电子产品不断降价，对经济影响不大。危险的是需求不足带来的普遍、持续的物价下跌。<\/p>\n\n<div class=\"desk\">\n<p>通胀的方向是资产配置的重要依据。通缩环境中，国债往往表现最好，现金的实际价值上升；股票和大宗商品承压。再通胀阶段，市场常做“再通胀交易”：卖出长期国债（收益率上升）、买入周期股、银行股和大宗商品，收益率曲线变陡。通胀回落阶段，如果经济没有衰退，往往对股票和债券都有利。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2014 年下半年，油价暴跌，欧元区通胀率快速下降。2015 年 1 月，欧元区调和消费者物价指数同比下降 0.6%，进入通缩。欧洲央行在当月宣布大规模资产购买计划，从 3 月起每月购买 600 亿欧元的债券，同时维持负利率。欧元区通胀在之后几年回升，但长期低于 2% 的目标，直到 2021 年才出现明显的再通胀。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>通缩是物价下跌，通胀回落是通胀变慢但仍为正，再通胀是低通胀后通胀回升。<\/li>\n<li>需求不足导致的通缩会让人推迟消费、债务负担加重、实际利率上升，形成恶性循环。<\/li>\n<li>通胀的方向影响资产表现：通缩利好国债，再通胀利好周期股和大宗商品。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个家庭有一笔 100 万元的房贷，年利率 3%。如果每年通胀 3%，和每年通缩 2% 相比，这个家庭的实际负担有什么不同？<\/summary>\n<div><p>通胀 3% 时，工资和物价大致每年上涨 3%，房贷的实际利率约为零，名义债务金额相对收入越来越小，负担在减轻。通缩 2% 时，工资可能停滞或下降，而房贷金额不变，实际利率约为 5%，债务相对收入越来越重。同样一笔房贷，通缩下的负担远大于通胀下。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-24\"><\/a><\/li>\n<li><a href=\"#L2-23\"><\/a><\/li>\n<li><a href=\"#L5-7\"><\/a><\/li>\n<\/ul><\/div>\n","2.14":"<div class=\"scene\">\n<p>2008 年的津巴布韦，一个人早上去买面包的钱，到了下午可能只够买半个。商店一天调好几次价，人们拿到工资第一件事就是马上花掉，或者换成美元、换成任何能保值的东西。第二年初，央行发行了面值 100 万亿津元的钞票，却连一张公交车票都买不起。这就是<strong>恶性通胀（hyperinflation）<\/strong>：货币几乎完全失去价值。<\/p>\n<\/div>\n\n<h2>什么是恶性通胀<\/h2>\n<p>经济学家卡根给出的一个常用定义是：月通胀率超过 50%。这相当于一年物价上涨约 130 倍。历史上著名的恶性通胀包括：<\/p>\n<ul>\n<li>1923 年的德国魏玛共和国；<\/li>\n<li>1946 年的匈牙利，是有记录以来最严重的一次；<\/li>\n<li>1980 年代末到 1990 年代初的阿根廷、巴西、秘鲁；<\/li>\n<li>2000 年代后期的津巴布韦；<\/li>\n<li>2010 年代后期的委内瑞拉。<\/li>\n<\/ul>\n\n<h2>恶性通胀是怎样发生的<\/h2>\n<p>几乎所有恶性通胀都有一个共同点：政府用印钞来弥补巨额财政赤字。常见的背景是战争、政治动荡、生产崩溃或巨额外债。过程通常是这样的：<\/p>\n<ol>\n<li>政府支出远大于收入，无法借到钱，只好让央行印钞。<\/li>\n<li>货币增加而商品没有增加，物价上涨。<\/li>\n<li>人们预期物价会继续上涨，尽快把钱花掉，货币流通速度加快，物价涨得更快。<\/li>\n<li>物价上涨让税收的实际价值缩水，赤字更大，需要印更多钱。<\/li>\n<\/ol>\n\n<h2>怎样结束<\/h2>\n<p>结束恶性通胀需要恢复对货币的信任，通常要同时做到：停止用印钞弥补赤字、进行财政改革、发行新货币或钉住外币，有时直接采用外国货币（美元化）。成功的稳定计划往往能在几个月内让通胀骤降。<\/p>\n\n<div class=\"desk\">\n<p>在新兴市场投资中，恶性通胀风险意味着本币资产可能在短期内几乎归零。投资者会关注财政赤字的融资方式、央行独立性、外汇储备和黑市汇率与官方汇率的差距。很多高通胀国家会出现“美元化”：存款、贷款和定价都改用美元，央行和本币逐渐失去作用。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>津巴布韦在 2000 年代因土地改革、农业产出崩溃和财政失控陷入危机。据估计，2008 年 11 月的月通胀率高达约 796 亿个百分点，物价大约每 25 小时翻一番。2009 年 1 月，央行发行了 100 万亿津元面值的钞票。2009 年，津巴布韦放弃本国货币，改用美元和南非兰特等外币，通胀迅速消失。那张 100 万亿津元的钞票后来成了收藏品。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>恶性通胀通常指月通胀率超过 50%，货币几乎完全失去价值。<\/li>\n<li>它几乎都源于政府用印钞弥补巨额赤字，并被货币流通加快和税收缩水不断放大。<\/li>\n<li>结束它需要停止印钞融资、财政改革和恢复信任，常见手段包括新货币、钉住汇率或美元化。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>在恶性通胀中，有房子的人、有存款的人、欠了大额本币债务的人，分别是受益还是受损？<\/summary>\n<div><p>有存款的人损失惨重，本币存款的价值几乎归零。欠了大额本币固定利率债务的人受益，债务的实际价值被通胀抹去。有房子等实物资产的人相对受保护，因为实物资产的本币价格会随通胀上涨。所以恶性通胀是一次巨大的财富再分配：从储蓄者转向债务人和实物资产持有者。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-17\"><\/a><\/li>\n<li><a href=\"#L7-18\"><\/a><\/li>\n<li><a href=\"#L8-8\"><\/a><\/li>\n<\/ul><\/div>\n","2.15":"<div class=\"scene\">\n<p>1970 年代，美国的通胀率一度超过 10%，失业率也在 7% 以上。按照当时流行的理论，这两件事不应该同时发生：高通胀意味着经济过热，失业率应该很低。但现实是物价飞涨的同时，经济停滞不前。人们给这种状态起了一个新名字：<strong>滞胀（stagflation）<\/strong>，即停滞（stagnation）加通胀（inflation）。<\/p>\n<\/div>\n\n<h2>滞胀是怎样产生的<\/h2>\n<ul>\n<li><strong>供给冲击<\/strong>：最常见的原因。油价或其他关键原材料价格暴涨，企业成本上升，一边提价，一边减产裁员。<\/li>\n<li><strong>通胀预期失控<\/strong>：长期宽松让人们习惯了高通胀，工资和价格不断互相推高，即使经济放缓，通胀也降不下来。<\/li>\n<li><strong>生产率放缓<\/strong>：潜在增长下降，但政策仍按过去的高增长目标刺激需求，结果只带来通胀。<\/li>\n<\/ul>\n\n<h2>为什么滞胀让政策很难办<\/h2>\n<p>需求冲击时，产出和通胀往同一方向变化，政策方向很清楚：经济冷就刺激，热就收紧。滞胀时，两者往相反方向变化：<\/p>\n<ul>\n<li>刺激经济会让通胀更高；<\/li>\n<li>收紧政策压通胀会让失业更多。<\/li>\n<\/ul>\n<p>1970 年代很多国家选择容忍通胀，结果通胀预期越来越高。最终，美联储主席沃尔克在 1979 年后大幅加息，以严重衰退为代价才压下通胀。<\/p>\n\n<div class=\"desk\">\n<p>滞胀是对传统股债组合最不利的环境之一：股票受经济停滞和利润下降拖累，债券受通胀和加息打击，两者可能同时下跌，股债分散的效果失灵。这种环境中，大宗商品、通胀挂钩债券和部分实物资产表现相对较好。每当油价暴涨、增长放缓同时出现，市场就会讨论“滞胀风险”。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1973 年 10 月，阿拉伯产油国对支持以色列的国家实施石油禁运，油价在几个月内涨到原来的约四倍。1979 年伊朗革命后又出现第二次石油危机。美国 CPI 通胀在 1980 年 3 月达到约 14.8% 的峰值，同期失业率在 6% 到 8% 之间。人们用“痛苦指数”（misery index，通胀率加失业率）衡量痛苦程度，1980 年它超过了 20。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>滞胀是经济停滞和高通胀同时出现，通常由供给冲击、失控的通胀预期或生产率放缓引起。<\/li>\n<li>它让政策两难：刺激加剧通胀，收紧加剧失业。<\/li>\n<li>滞胀环境中股票和债券可能同时下跌，大宗商品和通胀挂钩资产相对受益。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么 1970 年代的滞胀让经济学家对菲利普斯曲线的看法发生了根本改变？<\/summary>\n<div><p>按照简单的菲利普斯曲线，高通胀应该伴随低失业。1970 年代通胀和失业同时上升，说明这条曲线不稳定。弗里德曼和菲尔普斯的解释得到验证：当人们预期通胀上升时，短期曲线整体上移，同样的失业率对应更高的通胀。政策不能长期用通胀换取低失业，通胀预期成为宏观经济学的核心变量。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-11\"><\/a><\/li>\n<li><a href=\"#LH4-3\"><\/a><\/li>\n<li><a href=\"#LH4-4\"><\/a><\/li>\n<\/ul><\/div>\n","2.16":"<div class=\"scene\">\n<p>你可能以为，世界上的钱都是央行印出来的。实际上，你银行账户里的大部分钱，是商业银行在发放贷款时“凭空”创造的：银行批准一笔 100 万元的房贷，并不是把别人的存款搬给你，而是在你的账户上直接记上 100 万元。这笔新存款就是新创造的钱。要理解这一点，先要分清几种不同的<strong>货币供应（money supply）<\/strong>口径。<\/p>\n<\/div>\n\n<h2>M0、M1、M2：钱的不同口径<\/h2>\n<ul>\n<li><strong>基础货币（monetary base）<\/strong>：流通中的现金加上商业银行在央行的准备金。这部分由央行直接控制。<\/li>\n<li><strong>M0<\/strong>：流通中的现金。很多国家把 M0 定义为现金，但口径各有差异。<\/li>\n<li><strong>M1（狭义货币）<\/strong>：现金加上活期存款等可以随时用于支付的钱。<\/li>\n<li><strong>M2（广义货币）<\/strong>：M1 加上定期存款、储蓄存款等不太能随时支付、但很容易转换成现金的资产。<\/li>\n<\/ul>\n<p>不同国家的定义有差别，比如欧元区用 M3，中国的 M1 和 M2 也有自己的口径。分析时要看具体的定义。<\/p>\n\n<h2>货币乘数：课本里的说法<\/h2>\n<p>传统课本这样描述：央行增加 100 元基础货币，银行只需保留一部分作为准备金（比如 10%），其余贷出去；贷出去的钱又存回银行，银行再贷出 90%……最终广义货币可以增加约 1,000 元。这个倍数叫货币乘数（money multiplier）。<\/p>\n\n<h2>现实中更接近的说法<\/h2>\n<p>今天大多数央行认为，因果关系往往是反过来的：<\/p>\n<ul>\n<li>商业银行先根据贷款需求和盈利机会发放贷款，同时创造存款。<\/li>\n<li>银行再根据需要去获取准备金，央行通过调节利率来满足这些需要。<\/li>\n<li>真正限制银行创造货币的，是贷款需求、银行资本、监管要求和利率，而不是准备金的多少。<\/li>\n<\/ul>\n<p>所以央行主要通过利率而不是直接控制货币数量来影响经济。<\/p>\n\n<div class=\"desk\">\n<p>市场仍然关注货币和信贷数据，因为它们反映了银行放贷和经济活动的强弱。在中国，M1、M2 和社会融资规模是判断货币政策和经济走势的重要指标，M1 与 M2 增速之差常被视为企业活力的信号。在欧美，市场更关注银行信贷增长和央行资产负债表的变化。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2014 年，英格兰银行在季刊中发表文章《现代经济中的货币创造》，明确指出：商业银行在发放贷款时创造存款，教科书中“银行把存款贷出去”和“货币乘数”的描述并不准确。这篇文章被广泛引用，改变了很多人对货币的理解。另一个例子是 2008 年后的量化宽松：美联储让基础货币增加了数倍，但广义货币 M2 增长远没有那么快，因为银行并没有把多出来的准备金全部变成贷款。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>货币有不同口径：基础货币由央行控制，M1 是可以随时支付的钱，M2 范围更广。<\/li>\n<li>课本里的货币乘数认为准备金决定货币数量，现实中银行放贷时创造存款，准备金通常随后满足。<\/li>\n<li>真正限制货币创造的是贷款需求、资本、监管和利率，央行主要通过利率影响经济。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>央行通过量化宽松把银行的准备金增加了好几倍，为什么广义货币和通胀并没有同比例上升？<\/summary>\n<div><p>因为广义货币主要由银行贷款创造，而贷款取决于企业和家庭的借款需求、银行的风险偏好和资本状况。危机后需求疲弱、银行谨慎，增加的准备金大多留在央行账户上，没有转化为贷款和存款。只有当钱真正流向消费和投资，才会推动通胀。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L7-3\"><\/a><\/li>\n<li><a href=\"#L7-2\"><\/a><\/li>\n<li><a href=\"#L2-17\"><\/a><\/li>\n<\/ul><\/div>\n","2.17":"<div class=\"scene\">\n<p>一张 100 元的钞票，一年里被花了 5 次：先在超市，再到供应商，再到工人，再到餐馆，最后回到银行。这 100 元支撑了 500 元的交易。如果大家花钱更快，一年转 10 次，同样的钱就支撑了 1,000 元的交易。钱的数量、钱转手的速度，和整个经济的交易规模之间，有一个古老的关系式：<strong>货币数量论（quantity theory of money）<\/strong>。<\/p>\n<\/div>\n\n<h2>交易方程式：MV = PY<\/h2>\n<p>这个关系式写成：M × V = P × Y。<\/p>\n<ul>\n<li><strong>M<\/strong>：货币数量。<\/li>\n<li><strong>V<\/strong>：货币流通速度（velocity），一单位货币一年内平均被用来购买最终产品的次数。<\/li>\n<li><strong>P<\/strong>：物价水平。<\/li>\n<li><strong>Y<\/strong>：实际产出。P × Y 就是名义 GDP。<\/li>\n<\/ul>\n<p>这个式子本身是一个恒等式：流通速度就是用名义 GDP 除以货币数量算出来的。它的意义在于加上假设之后。<\/p>\n\n<h2>货币数量论：钱多了，物价就涨<\/h2>\n<p>如果假设流通速度 V 比较稳定、实际产出 Y 由生产能力决定，那么货币数量 M 增加，就只能体现为物价 P 上涨。这就是货币数量论的核心观点。弗里德曼的名言是：“通胀在任何时候、任何地方都是一种货币现象。”<\/p>\n<p>在长期和极端情况下，这个观点很有解释力：恶性通胀几乎都伴随货币供应的爆炸式增长。<\/p>\n\n<h2>为什么短期内不太灵<\/h2>\n<p>问题在于流通速度并不稳定。经济不景气、利率很低时，人们和企业更愿意持有现金和存款，钱转得慢，V 下降。这时即使 M 大幅增加，P × Y 也不一定上升。所以在 1980 年代以后，很多央行放弃了以货币供应量为目标的做法，转而以利率和通胀为目标。<\/p>\n\n<div class=\"desk\">\n<p>今天的央行和市场很少直接用货币数量论预测通胀，但货币数据并没有被完全忽视。当广义货币和信贷突然快速增长、同时经济已接近满负荷时，经济学家会警惕通胀风险。分析新兴市场时，货币供应和央行为财政融资的规模，仍是判断通胀和汇率风险的重要指标。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2008 年后，美国 M2 的流通速度持续下降，即使货币大幅增加，2010 年代的通胀依然很低，货币数量论似乎失灵了。但 2020–2021 年，在大规模财政补贴和量化宽松下，美国 M2 在 2021 年初的同比增速超过 25%，是二战以来最快的。随后 2021–2022 年通胀大幅上升。很多经济学家认为，这次货币直接进入了家庭账户，被用于消费，和 2008 年后主要停留在银行准备金的情况不同。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>交易方程式 MV = PY 把货币数量、流通速度、物价和实际产出联系在一起。<\/li>\n<li>如果流通速度稳定、产出由供给决定，货币增加就会推高物价，这在长期和极端情况下很有解释力。<\/li>\n<li>短期内流通速度并不稳定，所以央行大多以利率和通胀而非货币数量为目标。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么 2008 年后的量化宽松没有带来高通胀，而 2020–2021 年的政策却带来了？<\/summary>\n<div><p>2008 年后的量化宽松主要增加了银行准备金，银行放贷谨慎，家庭在去杠杆，钱没有大量流入消费，流通速度下降抵消了货币增加。2020–2021 年，政府直接给家庭发钱、发放补贴，央行同时购债为财政融资，广义货币直接进入家庭账户，随后被用于消费；再加上供应链受阻，需求远超供给，通胀随之上升。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-16\"><\/a><\/li>\n<li><a href=\"#L2-14\"><\/a><\/li>\n<li><a href=\"#L7-10\"><\/a><\/li>\n<\/ul><\/div>\n","2.18":"<div class=\"scene\">\n<p>2020 年春天，疫情让工厂停工、商店关门：一方面，人们不能出门消费，需求骤降；另一方面，工人不能上班、供应链中断，供给也骤降。一年后，在大规模刺激下需求迅速恢复，但芯片、集装箱和劳动力仍然短缺，结果价格大涨。要看清这一连串变化，经济学家用一个基本框架：<strong>总需求（aggregate demand，AD）<\/strong>和<strong>总供给（aggregate supply，AS）<\/strong>。<\/p>\n<\/div>\n\n<h2>总需求：整个经济想买多少<\/h2>\n<p>总需求是在每一个物价水平下，整个经济对产品和服务的总需求量，也就是消费、投资、政府购买和净出口之和。总需求曲线向下倾斜：物价越高，实际财富和购买力越低，需求越少。<\/p>\n<p>会让总需求曲线整体移动的因素：消费者和企业信心、利率和信贷条件、财政政策、资产价格、外国需求和汇率。<\/p>\n\n<h2>总供给：整个经济能生产多少<\/h2>\n<ul>\n<li><strong>短期总供给（SRAS）<\/strong>：向上倾斜。短期内工资和部分价格调整较慢，物价上涨时企业利润增加，愿意多生产。<\/li>\n<li><strong>长期总供给（LRAS）<\/strong>：垂直于潜在产出。长期内所有价格和工资都会调整，产出由劳动力、资本和技术决定，与物价水平无关。<\/li>\n<\/ul>\n<p>让短期总供给移动的因素：能源和原材料价格、工资、供应链状况、生产率。<\/p>\n\n<h2>两种冲击<\/h2>\n<div class=\"tbl\"><table>\n<tr><th><\/th><th>需求冲击<\/th><th>供给冲击<\/th><\/tr>\n<tr><td>例子<\/td><td>信心下降、加息、财政刺激<\/td><td>油价暴涨、疫情停工、自然灾害<\/td><\/tr>\n<tr><td>产出和物价<\/td><td>同方向变化<\/td><td>反方向变化<\/td><\/tr>\n<tr><td>政策难度<\/td><td>较小，方向清楚<\/td><td>较大，面临取舍<\/td><\/tr>\n<\/table><\/div>\n<p>负的需求冲击让产出和物价同时下降，正的需求冲击让两者同时上升。负的供给冲击让产出下降、物价上升，就是滞胀。<\/p>\n\n<div class=\"desk\">\n<p>宏观交易员解读数据时，常先问一个问题：这是需求冲击还是供给冲击？比如通胀意外上升，如果伴随强劲的消费和就业，是需求过热，央行可能更快加息；如果伴随产出下降，是供给冲击，央行可能更犹豫。资产价格的反应也不同：需求驱动的通胀往往伴随股市上涨，供给冲击带来的通胀则常让股债同时承压。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年疫情初期，需求和供给同时受到负面冲击，产出暴跌，通胀短暂下降，说明需求冲击占主导。2021 年起，在大规模财政和货币刺激下，需求快速恢复，商品需求尤其旺盛；但芯片短缺、港口拥堵和劳动力不足让供给恢复缓慢。总需求曲线大幅右移，短期总供给曲线却左移，结果美国和欧洲的通胀都创下几十年来的新高。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>总需求是各物价水平下的总支出，向下倾斜；短期总供给向上倾斜，长期总供给垂直于潜在产出。<\/li>\n<li>需求冲击让产出和物价同向变化，供给冲击让两者反向变化。<\/li>\n<li>判断冲击来自需求还是供给，是预测政策和资产价格反应的关键。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家的本币突然大幅贬值。用总需求和总供给的框架，它会怎样影响产出和物价？<\/summary>\n<div><p>需求方面：出口更有竞争力，净出口增加，总需求右移。供给方面：进口原材料和能源变贵，企业成本上升，短期总供给左移。两者都推高物价，所以通胀上升比较确定；产出的方向取决于哪个效应更大：出口导向、进口依赖低的经济体产出可能增加，依赖进口原材料的经济体产出可能下降。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-15\"><\/a><\/li>\n<li><a href=\"#L2-27\"><\/a><\/li>\n<li><a href=\"#L23-17\"><\/a><\/li>\n<\/ul><\/div>\n","2.19":"<div class=\"scene\">\n<p>政府花 100 亿元修一条路。建筑公司拿到钱，给工人发工资、向供应商采购；工人拿到工资去餐馆吃饭、买衣服；餐馆老板和服装店老板的收入增加了，又去消费……最初的 100 亿元，在经济中一轮一轮传下去，最终带来的 GDP 增加可能超过 100 亿元。这种放大作用叫<strong>乘数效应（multiplier effect）<\/strong>。但它到底有多大，经济学家争论了几十年。<\/p>\n<\/div>\n\n<h2>乘数怎么来的<\/h2>\n<p>乘数的大小取决于每一轮收入中有多少被花掉，也就是边际消费倾向。如果人们每多 1 元收入就花掉 0.8 元，那么最初的 100 元支出会带来 100 + 80 + 64 + ……，最终约 500 元的总支出。简单的乘数 = 1 ÷（1 − 边际消费倾向）。<\/p>\n<p>现实中会有很多“漏出”，让乘数变小：<\/p>\n<ul>\n<li><strong>储蓄<\/strong>：收入中存起来的部分不会进入下一轮。<\/li>\n<li><strong>税收<\/strong>：收入的一部分交给了政府。<\/li>\n<li><strong>进口<\/strong>：花在进口商品上的钱，增加的是外国的 GDP。开放的小国乘数较小。<\/li>\n<\/ul>\n\n<h2>乘数大小取决于环境<\/h2>\n<ul>\n<li><strong>经济有闲置资源时<\/strong>：失业多、产能闲置，政府支出主要增加产出，乘数较大。<\/li>\n<li><strong>经济接近满负荷时<\/strong>：政府支出更多推高物价和利率，挤出私人支出，乘数较小。<\/li>\n<li><strong>货币政策的反应<\/strong>：如果央行加息抵消财政刺激，乘数变小；如果利率处于零下限、央行不加息，乘数可能更大。<\/li>\n<li><strong>支出的类型<\/strong>：直接给低收入家庭的转移支付和基础设施投资，通常比给高收入群体减税的乘数更大。<\/li>\n<\/ul>\n<p>大多数研究估计，财政乘数在 0.5 到 2 之间，差别很大。<\/p>\n\n<div class=\"desk\">\n<p>财政乘数是宏观预测和政策辩论的关键参数。经济学家估算一项刺激计划或紧缩计划对 GDP 的影响时，要先假设乘数。投资者分析一国大规模财政刺激的影响，也要判断乘数的大小，以及它对通胀、利率和国债供给的影响。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2010 年代初，欧洲多国在欧债危机中实施财政紧缩。2013 年初，IMF 首席经济学家布兰查德和同事发表研究，发现危机期间的预测普遍低估了紧缩对经济的伤害：预测时大多假设乘数约为 0.5，而实际乘数可能在 0.9 到 1.7 之间。这意味着削减支出导致 GDP 下降得更多，债务率的改善比预期的小得多。这项研究在当时引发了对紧缩政策的广泛反思。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>乘数效应是政府支出通过一轮轮消费放大对 GDP 的影响，大小取决于边际消费倾向。<\/li>\n<li>储蓄、税收和进口是漏出，会让乘数变小。<\/li>\n<li>乘数在经济低迷、利率处于零下限时较大，在经济满负荷、央行加息抵消时较小。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>同样是增加 1,000 亿元财政支出，在一个失业率 10%、利率为零的国家，和一个失业率 3%、央行正在加息的国家，效果会有什么不同？<\/summary>\n<div><p>在第一个国家，有大量闲置的工人和产能，央行不会加息，支出主要转化为实际产出和就业增加，乘数较大，甚至可能超过 1。在第二个国家，经济已接近满负荷，增加的支出主要推高物价和工资，央行会加息更多，私人投资和消费被挤出，乘数较小，还可能加剧通胀。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-4\"><\/a><\/li>\n<li><a href=\"#L2-20\"><\/a><\/li>\n<li><a href=\"#L8-1\"><\/a><\/li>\n<\/ul><\/div>\n","2.20":"<div class=\"scene\">\n<p>经济进入衰退，你还没反应过来，政府的预算其实已经开始“救市”了：失业的人少交了税，还领到了失业救济；企业利润下降，所得税也少交了。没有任何新法律通过，政府的赤字就自动扩大，给经济注入了需求。这种不需要决策就会自动发挥作用的机制，叫<strong>自动稳定器（automatic stabilizers）<\/strong>。它是<strong>财政政策（fiscal policy）<\/strong>的一部分。<\/p>\n<\/div>\n\n<h2>财政政策：政府怎样花钱和收税<\/h2>\n<p>财政政策是政府通过支出、税收和转移支付影响经济。<\/p>\n<ul>\n<li><strong>扩张性财政政策<\/strong>：增加支出、减税，刺激需求，常用于衰退时期。<\/li>\n<li><strong>紧缩性财政政策<\/strong>：削减支出、加税，减少赤字，抑制过热。<\/li>\n<\/ul>\n<p>财政政策分为两种：一种是自动稳定器，另一种是相机抉择（discretionary）的政策，比如政府专门推出的刺激计划。<\/p>\n\n<h2>自动稳定器<\/h2>\n<ul>\n<li><strong>累进所得税<\/strong>：收入下降时，税负下降得更多。<\/li>\n<li><strong>失业救济和社会保障<\/strong>：失业增加时，支出自动增加。<\/li>\n<li><strong>企业所得税<\/strong>：利润下降时，税收自动减少。<\/li>\n<\/ul>\n<p>它们的优点是反应快、不需要政治决策。欧洲国家的税收和福利体系规模较大，自动稳定器的作用一般比美国更强。<\/p>\n\n<h2>挤出效应<\/h2>\n<p>政府扩大赤字需要借钱。如果经济接近满负荷、资金有限，政府借钱会推高利率，让企业和家庭借钱变贵，私人投资和消费减少。这叫挤出效应（crowding out）。挤出效应在衰退、利率很低时较小，在经济繁荣、利率较高时较大。<\/p>\n<p>相机抉择的财政政策还有时滞问题：从意识到问题、到通过法律、再到资金真正花出去，可能需要一两年，等政策见效时经济可能已经变了。<\/p>\n\n<div class=\"desk\">\n<p>财政政策对债券市场影响很大。大规模刺激意味着更多国债发行，可能推高长期收益率。交易员会关注政府预算、发债计划和财政规则（比如欧盟的赤字规则、德国的“债务刹车”），评估国债供给的变化。财政扩张还会影响经济增长和通胀预期，进而影响央行的政策路径。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2009 年 2 月，美国国会通过《美国复苏与再投资法案》，规模约 7,870 亿美元，包括减税、基础设施投资、对州政府的援助和失业救济扩展。与此同时，美国联邦赤字在 2009 财年升至约 1.4 万亿美元，占 GDP 的近 10%，其中相当大的一部分来自自动稳定器：税收收入随衰退大幅下降，失业救济支出激增。对这次刺激的效果，经济学家至今仍有争论：有人认为它规模太小，有人认为它效率不高。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>财政政策通过支出、税收和转移支付影响经济，分为自动稳定器和相机抉择两种。<\/li>\n<li>自动稳定器在衰退时自动扩大赤字、支撑需求，反应快、不需要决策。<\/li>\n<li>政府借钱可能推高利率、挤出私人支出；相机抉择的政策还面临时滞问题。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家规定政府每年必须实现预算平衡，不允许赤字。这在经济衰退时会产生什么问题？<\/summary>\n<div><p>衰退时税收自动下降、福利支出自动上升，赤字扩大。如果必须平衡预算，政府只能在衰退中削减支出或加税，这会进一步减少需求，让衰退更严重。这相当于把自动稳定器变成了“自动放大器”。所以大多数财政规则会允许周期性赤字，只要求“结构性”预算平衡。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-19\"><\/a><\/li>\n<li><a href=\"#L8-2\"><\/a><\/li>\n<li><a href=\"#L23-8\"><\/a><\/li>\n<\/ul><\/div>\n","2.21":"<div class=\"scene\">\n<p>2022 年 9 月，英国新政府宣布大规模减税，却没有说明钱从哪里来。而当时英格兰银行正在加息对抗 10% 的通胀。财政在踩油门，央行在踩刹车。市场的反应极其剧烈：英镑跌到历史低点，长期国债收益率几天内飙升，大量养老金被迫抛售国债，英格兰银行不得不紧急入市。这是一次<strong>政策组合（policy mix）<\/strong>失调的典型案例。<\/p>\n<\/div>\n\n<h2>两只手：货币政策和财政政策<\/h2>\n<ul>\n<li><strong>货币政策<\/strong>：由央行负责，主要工具是利率和资产负债表，影响借贷成本和金融条件。反应快、调整灵活，但对经济影响有时滞。<\/li>\n<li><strong>财政政策<\/strong>：由政府和议会负责，通过支出和税收直接影响需求，可以针对特定人群和行业，但决策慢、受政治影响大。<\/li>\n<\/ul>\n<p>两者的组合决定了经济的整体方向，以及利率和汇率的水平。<\/p>\n\n<h2>四种组合<\/h2>\n<div class=\"tbl\"><table>\n<tr><th><\/th><th>宽松货币<\/th><th>紧缩货币<\/th><\/tr>\n<tr><td>宽松财政<\/td><td>强力刺激，可能推高通胀（2020–2021 年）<\/td><td>利率上升、本币可能走强，但也可能引发担忧（1980 年代初美国）<\/td><\/tr>\n<tr><td>紧缩财政<\/td><td>央行用低利率抵消财政紧缩（2010 年代欧洲）<\/td><td>经济明显降温，压低通胀<\/td><\/tr>\n<\/table><\/div>\n\n<h2>配合与冲突<\/h2>\n<p>在危机中，两者配合往往效果最好：财政直接支持家庭和企业，央行保持低利率、为国债提供需求。但长期过度依赖央行为财政融资，可能导致“财政主导”（fiscal dominance）：央行为了让政府能继续借钱，不敢加息对抗通胀，独立性受到威胁。另一方面，如果两者方向相反，政策效果会互相抵消，甚至引发市场对政策可信度的担忧。<\/p>\n\n<div class=\"desk\">\n<p>宏观交易员判断一个国家的利率和汇率时，会同时看央行和财政部。政府扩大赤字而央行紧缩，往往推高短期和长期利率；如果市场开始怀疑财政可持续性，可能出现国债和本币同时下跌的“新兴市场式”反应，这在发达国家很少见，一旦出现就是严重警告。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年 9 月 23 日，英国政府公布“小型预算”，包括约 450 亿英镑的无资金来源减税。之后几天，30 年期英国国债收益率上升超过 1 个百分点，英镑兑美元一度跌到约 1.035 的历史低点。很多使用负债驱动投资策略（LDI）的养老金被追加保证金，只能抛售国债，进一步推高收益率。9 月 28 日，英格兰银行宣布临时购买长期国债，以稳定市场。不久后财政大臣被撤换，大部分减税被撤回，首相特拉斯在 10 月辞职。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>货币政策由央行负责、反应灵活；财政政策由政府负责、可以精准定向但决策慢。<\/li>\n<li>两者的组合决定经济方向和利率、汇率水平，配合时效果最好。<\/li>\n<li>长期依赖央行为财政融资可能导致财政主导；方向冲突则可能引发市场对可信度的担忧。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么英国 2022 年的减税计划导致英镑和国债同时下跌？一般情况下，加息预期上升不是会让本币走强吗？<\/summary>\n<div><p>一般情况下，加息预期上升会吸引资金流入、本币走强。但当市场担心的是政府财政的可信度时，投资者会要求更高的风险溢价，同时卖出本币资产，国债和本币一起下跌。这通常是新兴市场的特征，说明市场对英国政策组合的信心严重受损，这比单纯的利率变化更危险。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-20\"><\/a><\/li>\n<li><a href=\"#L7-18\"><\/a><\/li>\n<li><a href=\"#L21-20\"><\/a><\/li>\n<\/ul><\/div>\n","2.22":"<div class=\"scene\">\n<p>开车时，油门踩多深算“不加速也不减速”？这取决于路况：上坡要踩深一点，下坡要松一点。利率也一样：在什么利率下，货币政策既不刺激经济、也不抑制经济？这个利率叫<strong>中性利率（neutral rate of interest）<\/strong>，经济学家常写作 <strong>r*<\/strong>（读作 r-star）。它看不见、会变化，却是判断货币政策松紧的关键。<\/p>\n<\/div>\n\n<h2>什么是中性利率<\/h2>\n<p>中性利率是这样一种实际利率（扣除通胀后的利率）：在这个水平上，经济处于潜在产出、通胀稳定。政策利率高于中性利率，货币政策偏紧；低于中性利率，偏松。<\/p>\n<p>名义中性利率 ≈ 实际中性利率 r* + 通胀目标。比如 r* 为 0.5%、通胀目标 2%，名义中性利率约为 2.5%。<\/p>\n\n<h2>什么决定 r*<\/h2>\n<p>r* 由经济中储蓄和投资的长期平衡决定：<\/p>\n<ul>\n<li><strong>压低 r* 的因素<\/strong>：潜在增长放缓、人口老龄化（储蓄多、投资需求少）、收入差距扩大（富人储蓄更多）、全球对安全资产的需求增加。<\/li>\n<li><strong>推高 r* 的因素<\/strong>：生产率加速、投资热潮（如能源转型、人工智能）、政府长期大规模赤字、全球储蓄减少。<\/li>\n<\/ul>\n<p>2008 年后很多人认为，发达国家的 r* 已经降到接近零，这与“长期停滞”（secular stagnation）假说有关。<\/p>\n\n<h2>为什么很难用<\/h2>\n<p>r* 无法直接观察，只能用模型估算，误差很大。不同模型的结果可能相差一两个百分点，而且会被大幅修订。央行常常只能通过观察经济对利率的反应来“摸索”：加息后经济仍然强劲，说明 r* 可能比想象的高。<\/p>\n\n<div class=\"desk\">\n<p>r* 直接关系到利率的“终点”在哪里。市场判断一轮加息或降息周期会走到多远时，会参考央行对长期利率的估计（比如美联储点阵图中的“长期利率”中位数）。如果市场认为 r* 上升了，长期国债收益率也会上升。资产估值同样依赖它：r* 越高，长期贴现率越高，成长股和长久期资产的估值越低。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>美联储每季度公布的点阵图中，委员们对长期政策利率的估计中位数在 2012 年约为 4.25%，此后逐年下调，2019 年降到 2.5%，反映出对 r* 下降的判断。经济学家劳巴赫和威廉姆斯的模型估计，美国 r* 从 2008 年前的约 2% 降到 2010 年代后期的 0.5% 左右。2022–2023 年大幅加息后美国经济依然强劲，美联储在 2024 年后逐步把长期利率的估计上调到约 3%，市场也开始讨论 r* 是否已经回升。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>中性利率 r* 是既不刺激也不抑制经济的实际利率，用来判断货币政策的松紧。<\/li>\n<li>它由储蓄和投资的长期平衡决定，受增长、人口、收入分配和全球资金需求影响。<\/li>\n<li>r* 无法直接观察、估计误差大，但直接影响利率终点和资产估值。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>央行把政策利率从 0 加到 5%，经济却依然强劲、通胀下降缓慢。这可能说明了 r* 的什么？<\/summary>\n<div><p>可能说明 r* 比央行和市场原本估计的要高：5% 的利率也许并没有那么“紧”。也可能是其他因素抵消了加息的效果，比如政府财政赤字很大、家庭和企业此前锁定了低利率的长期贷款、资产价格上涨。央行需要判断是哪种原因，才能决定是否继续加息或维持更久。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-6\"><\/a><\/li>\n<li><a href=\"#L7-7\"><\/a><\/li>\n<li><a href=\"#L2-23\"><\/a><\/li>\n<\/ul><\/div>\n","2.23":"<div class=\"scene\">\n<p>经济陷入衰退，央行把利率降到了零。可是企业还是不投资，家庭还是不消费。央行还能怎么办？如果继续降息到负数，人们可能干脆把钱取出来放在保险柜里，因为现金至少不会“扣钱”。利率降不下去了，货币政策的常规武器失灵了。这种处境叫<strong>零利率下限（zero lower bound）<\/strong>，凯恩斯更早称之为<strong>流动性陷阱（liquidity trap）<\/strong>。<\/p>\n<\/div>\n\n<h2>为什么利率很难降到零以下<\/h2>\n<p>现金的名义回报是零。如果存款利率明显低于零，人们和企业可以把存款换成现金，避免损失。所以央行的利率很难大幅低于零。实际上，存放和运输大量现金也有成本，所以利率可以稍微低于零，这就是一些国家实施负利率的空间，但空间有限。<\/p>\n\n<h2>流动性陷阱：钱多了也没用<\/h2>\n<p>凯恩斯描述的流动性陷阱是：利率已经很低，人们宁愿持有现金和存款，也不愿投资或消费。央行增加货币，钱只是被持有，不会流向经济。经济需求不足，物价下跌，实际利率反而上升，进一步打击需求。<\/p>\n\n<h2>零利率下限时的工具<\/h2>\n<ul>\n<li><strong>负利率<\/strong>：把央行存款利率降到零以下，比如欧元区、日本、瑞士、丹麦、瑞典。<\/li>\n<li><strong>量化宽松<\/strong>：央行大规模购买国债和其他资产，压低长期利率。<\/li>\n<li><strong>前瞻指引<\/strong>：承诺长期保持低利率，影响市场对未来利率的预期。<\/li>\n<li><strong>收益率曲线控制<\/strong>：直接设定某个期限国债收益率的目标，比如日本把 10 年期国债收益率控制在零附近。<\/li>\n<li><strong>财政政策<\/strong>：在零利率下限时，财政刺激的效果往往更大，因为央行不会通过加息来抵消它。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>零利率和负利率对银行影响很大：贷款利率随利率下降，但存款利率很难降到零以下，银行的净息差被压缩，盈利下降。负利率时期，大量国债收益率为负，投资者持有到期也会亏钱，全球负收益率债券一度超过 18 万亿美元。养老金和保险公司也面临难以达到目标回报的压力。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>日本是最早面对零利率下限的大型经济体。1999 年 2 月，日本银行实施零利率政策，2001 年开始量化宽松。2016 年 1 月，日本银行引入 −0.1% 的负利率，同年 9 月推出收益率曲线控制。在超过二十年的超宽松政策后，日本银行在 2024 年 3 月结束负利率，这是 17 年来的首次加息。欧洲央行在 2014 年 6 月把存款利率降到 −0.1%，直到 2022 年 7 月才重新回到零以上。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>因为现金回报为零，利率很难大幅低于零，这就是零利率下限。<\/li>\n<li>流动性陷阱中，利率已经很低，增加的货币被持有而不是用于消费投资，货币政策效果减弱。<\/li>\n<li>央行在零利率下限时使用负利率、量化宽松、前瞻指引和收益率曲线控制，财政政策的作用也更大。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>负利率能刺激经济吗？它对银行和储户有什么副作用？<\/summary>\n<div><p>负利率能压低整个利率曲线，鼓励借贷，推动本币贬值，在一定程度上刺激经济。但银行很难把负利率转嫁给普通储户，否则会引发存款外流，结果银行的利差被压缩，利润下降，可能反而减少放贷。储户和养老金难以获得回报，可能被迫增加储蓄或转向高风险资产。所以负利率的效果和副作用一直存在争议。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L7-10\"><\/a><\/li>\n<li><a href=\"#L7-9\"><\/a><\/li>\n<li><a href=\"#LH5-15\"><\/a><\/li>\n<\/ul><\/div>\n","2.24":"<div class=\"scene\">\n<p>1990 年，日本股市和房地产泡沫破裂。很多企业发现，自己用借来的钱买的土地和股票已经大幅贬值，资产远不够还债。日本央行把利率降到接近零，钱变得极其便宜，可企业不仅不借钱投资，反而拼命还债。每家企业都在做正确的事：修复自己的资产负债表。但所有企业一起这样做，整个经济的需求就消失了。这叫<strong>资产负债表衰退（balance sheet recession）<\/strong>，它和一个更古老的概念相关：<strong>债务通缩（debt deflation）<\/strong>。<\/p>\n<\/div>\n\n<h2>债务通缩：费雪的警告<\/h2>\n<p>1933 年，经济学家欧文·费雪在大萧条中总结了一个恶性循环：<\/p>\n<ol>\n<li>经济中积累了过多的债务。<\/li>\n<li>某个冲击让债务人开始被迫卖出资产还债。<\/li>\n<li>大家同时卖出，资产价格下跌，物价下跌。<\/li>\n<li>物价下跌让债务的实际价值上升，债务负担更重。<\/li>\n<li>更多人被迫卖出，违约和破产增加，银行收缩信贷，经济进一步萎缩。<\/li>\n<\/ol>\n<p>费雪的结论是：越还越欠。债务人越努力还债，债务的实际负担反而越重。<\/p>\n\n<h2>资产负债表衰退：辜朝明的解释<\/h2>\n<p>经济学家辜朝明研究日本后提出：当企业和家庭的资产大幅缩水、资不抵债时，他们的首要目标从“利润最大化”变成“债务最小化”。即使利率为零，也没有人想借钱。货币政策因此失效，因为问题在于没有人想借，而不是借不到。<\/p>\n<p>在这种情况下，辜朝明认为政府应该通过财政支出来弥补私人部门减少的需求，直到私人部门完成去杠杆，否则经济会陷入长期萧条。<\/p>\n\n<div class=\"desk\">\n<p>分析一个经济体的风险时，债务水平和结构很重要：家庭、企业、政府各自欠了多少？是以什么资产为抵押？如果资产价格大幅下跌，谁会被迫卖出？信贷周期研究中，私人部门信贷占 GDP 比率的快速上升常被视为未来危机的预警信号。危机后，私人部门去杠杆的速度，决定了复苏的快慢。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>日本泡沫破裂后，土地和股票价格在十几年间大幅下跌，主要城市商业地价下跌超过八成。辜朝明的研究指出，1990 年代末以后，日本企业部门整体由借款者变为储蓄者，即使在零利率下仍持续还债。日本政府持续财政赤字，填补了私人需求的缺口，避免了类似大萧条的崩溃，但经济长期低迷，被称为“失去的二十年”。2008 年后的美国和欧洲，家庭部门也经历了类似的去杠杆过程。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>债务通缩是债务人被迫卖资产、物价下跌、实际债务负担上升的恶性循环。<\/li>\n<li>资产负债表衰退中，企业和家庭优先还债，即使利率为零也不借钱，货币政策失效。<\/li>\n<li>这时财政支出需要弥补私人部门减少的需求，直到去杠杆完成。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家的家庭普遍背负高额房贷，房价下跌了 30%。为什么央行降息可能不足以刺激消费？<\/summary>\n<div><p>房价下跌后，很多家庭的房子价值低于贷款，资产负债表受损。他们会优先还债、增加储蓄，即使利率降低，也不愿意多借钱或多消费。降息减轻了一部分利息负担，但无法恢复他们损失的财富。这种情况下，消费恢复要等到家庭完成去杠杆，或者通过财政政策、债务重组等方式直接修复资产负债表。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-13\"><\/a><\/li>\n<li><a href=\"#L2-23\"><\/a><\/li>\n<li><a href=\"#LH4-9\"><\/a><\/li>\n<\/ul><\/div>\n","2.25":"<div class=\"scene\">\n<p>一个国家的政府决定大幅削减赤字。同时，家庭也在拼命存钱，企业也在减少投资、增加储蓄，而这个国家又没有什么出口。它能做到吗？会计上，它几乎做不到。因为一个部门的盈余，必然是另一个部门的赤字。整个经济的收支加起来必须平衡。这个看似简单的会计关系，叫<strong>部门收支平衡（sectoral balances）<\/strong>。<\/p>\n<\/div>\n\n<h2>四个部门，加起来为零<\/h2>\n<p>把一个经济体分为几个部门：家庭、企业（两者合称私人部门）、政府和外国。每个部门的收支差额：<\/p>\n<ul>\n<li><strong>私人部门<\/strong>：储蓄减去投资（S − I）。<\/li>\n<li><strong>政府部门<\/strong>：税收减去支出（T − G），也就是财政盈余。<\/li>\n<li><strong>外国部门<\/strong>：从本国角度，是进口减出口（M − X），即本国经常账户逆差。<\/li>\n<\/ul>\n<p>会计恒等式是：（S − I）+（T − G）+（M − X）= 0。换句话说：私人部门盈余 + 政府盈余 = 经常账户盈余。<\/p>\n\n<h2>这意味着什么<\/h2>\n<ul>\n<li>如果私人部门想多储蓄（盈余增加），又没有更多出口，那么政府必然出现赤字。<\/li>\n<li>如果政府想削减赤字，那么要么私人部门减少储蓄、增加借贷，要么经常账户盈余增加。<\/li>\n<li>一个国家只有在经常账户盈余足够大时，才能同时实现政府和私人部门的盈余，比如德国。<\/li>\n<\/ul>\n<p>这是会计关系，不说明因果。但它能帮你检验政策和预测是否自相矛盾。<\/p>\n\n<div class=\"desk\">\n<p>宏观分析师和策略师用部门收支检验经济是否可持续：如果私人部门长期赤字（借钱消费和投资），可能意味着信贷泡沫；如果政府大幅削减赤字而私人部门已经在去杠杆、出口又疲软，经济很可能衰退。主权信用分析中，经常账户赤字和政府赤字同时很大（“双赤字”），常被视为汇率和融资风险的信号。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>英国经济学家韦恩·戈德利长期使用部门收支框架分析美国经济。1990 年代末，美国经济繁荣、政府预算出现盈余，很多人欢呼。戈德利指出，政府盈余和巨大的经常账户逆差，意味着美国私人部门正在大规模借钱、出现前所未有的赤字，这种状态不可持续。他在 2000 年代多次警告家庭债务过度累积将带来衰退。2001 年和 2008 年的衰退，都伴随着私人部门从赤字迅速转为盈余。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>私人部门盈余、政府盈余和外国部门盈余（本国经常账户逆差）之和恒为零。<\/li>\n<li>一个部门的盈余必然对应另一个部门的赤字，政府削减赤字需要私人部门或外国部门配合。<\/li>\n<li>这个框架能检验政策和预测是否自洽，私人部门持续赤字可能是信贷泡沫的信号。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>欧元区要求所有成员国都削减财政赤字、同时私人部门也在去杠杆。如果整个欧元区都想这样做，需要什么条件？<\/summary>\n<div><p>根据部门收支，欧元区整体需要出现更大的经常账户盈余，也就是向世界其他地区大量出口，让外国部门成为赤字方。2010 年代欧元区确实转向了较大的经常账户盈余。但如果全世界的主要经济体都想这样做，在全球层面是不可能的，因为全球的经常账户加起来为零。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L8-6\"><\/a><\/li>\n<li><a href=\"#L2-24\"><\/a><\/li>\n<li><a href=\"#L2-20\"><\/a><\/li>\n<\/ul><\/div>\n","2.26":"<div class=\"scene\">\n<p>2022 年，美国通过了两部法律：一部拿出约 527 亿美元补贴本土芯片制造，另一部用大量税收抵免支持电动车、电池和清洁能源。很快，欧洲、日本、韩国也推出了类似的计划。各国政府不再只是通过利率和总需求管理经济，而是直接决定要发展哪些产业。这类政策叫<strong>产业政策（industrial policy）<\/strong>，它和另一类改善经济供给能力的<strong>供给侧政策（supply-side policy）<\/strong>密切相关。<\/p>\n<\/div>\n\n<h2>供给侧政策：提高经济的生产能力<\/h2>\n<p>前面讲的货币和财政政策主要管理需求。供给侧政策的目标是提高潜在产出，也就是让经济长期能生产更多：<\/p>\n<ul>\n<li><strong>税收改革<\/strong>：降低对工作、储蓄和投资的扭曲。<\/li>\n<li><strong>劳动力市场改革<\/strong>：提高就业灵活性、加强职业培训、鼓励劳动参与。<\/li>\n<li><strong>放松管制<\/strong>：减少不必要的审批和准入限制，鼓励竞争。<\/li>\n<li><strong>教育、研发和基础设施投资<\/strong>：提高人力资本和技术水平。<\/li>\n<\/ul>\n<p>1980 年代美国的里根改革和英国的撒切尔改革，常被视为供给侧政策的代表。中国在 2015 年后推行的“供给侧结构性改革”，重点则是去产能、去库存、去杠杆。<\/p>\n\n<h2>产业政策：政府选择重点产业<\/h2>\n<p>产业政策是政府有选择地支持特定产业或技术，常见工具包括补贴、税收优惠、低息贷款、政府采购、关税保护和本地化要求。<\/p>\n<ul>\n<li><strong>支持者的理由<\/strong>：一些产业有很强的正外部性（如技术溢出），或关系到国家安全和供应链安全，市场自己投资不足。东亚经济体的快速发展常被作为例子。<\/li>\n<li><strong>反对者的理由<\/strong>：政府未必比市场更会“挑赢家”，补贴可能被浪费或被利益集团捕获，还可能引发各国之间的补贴竞赛和贸易摩擦。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>产业政策对投资影响很直接：受补贴的行业（半导体、新能源、电动车、国防）往往吸引大量资本和投资者关注，相关公司的估值和资本支出计划也随之变化。分析师要评估补贴能持续多久、会不会引发产能过剩和价格战，以及贸易报复的风险。银行和基金也会因为政策导向调整信贷和投资方向。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2022 年 8 月，美国通过《芯片与科学法案》，为半导体制造和研发提供约 527 亿美元的资金支持；同月通过《通胀削减法案》，以税收抵免等方式为清洁能源和电动车提供大量支持，官方最初估计约 3,700 亿美元，后来的估计更高。台积电、三星、英特尔等公司随后宣布在美国大规模建厂。欧盟在 2023 年推出《欧洲芯片法案》作为回应。这标志着发达国家重新大规模使用产业政策。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>供给侧政策通过税收、劳动市场、放松管制和投资教育研发，提高经济的长期生产能力。<\/li>\n<li>产业政策是政府有选择地支持特定产业，工具包括补贴、税收优惠、关税和采购。<\/li>\n<li>产业政策可能纠正市场失灵、保障供应链安全，也可能浪费资源、引发补贴竞赛。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>政府大规模补贴某个产业，几年后全国冒出了几百家相关企业，产品价格暴跌。从投资者的角度，这说明了什么？<\/summary>\n<div><p>说明补贴吸引了过多的资本进入，供给增长远超需求，导致产能过剩和价格战，行业整体利润下降，很多企业会亏损甚至倒闭。对投资者来说，“政策支持的行业”不等于“能赚钱的行业”，要看竞争格局、进入壁垒和补贴退出后的盈利能力。光伏、电动车等行业都出现过类似的周期。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-6\"><\/a><\/li>\n<li><a href=\"#L1-14\"><\/a><\/li>\n<li><a href=\"#L12-22\"><\/a><\/li>\n<\/ul><\/div>\n","2.27":"<div class=\"scene\">\n<p>1937 年，凯恩斯的《通论》出版一年后，英国经济学家希克斯写了一篇短文，把凯恩斯厚重而晦涩的思想，浓缩成两条曲线：一条代表商品市场，一条代表货币市场。两条线的交点，决定了利率和产出。这个模型叫 <strong>IS-LM 模型<\/strong>。几十年来，它和后来的 <strong>AD-AS 模型<\/strong>一起，成为宏观经济学课堂和政策讨论中最常用的“草图”。<\/p>\n<\/div>\n\n<h2>IS 曲线：商品市场的平衡<\/h2>\n<p>IS 代表投资（investment）等于储蓄（saving）。它描述的是：在每一个利率水平上，商品市场平衡时的产出是多少。利率越低，投资和消费越多，产出越高，所以 IS 曲线向下倾斜。<\/p>\n<p>财政扩张、信心上升、出口增加，会让 IS 曲线向右移动。<\/p>\n\n<h2>LM 曲线：货币市场的平衡<\/h2>\n<p>LM 代表流动性偏好（liquidity preference）等于货币供给（money supply）。产出越高，交易需要的货币越多，在货币供给不变时，利率必须上升才能让人们愿意少持有货币，所以 LM 曲线向上倾斜。<\/p>\n<p>央行增加货币供给，会让 LM 曲线向右移动，利率下降。今天的央行多直接设定利率，所以很多教科书把 LM 曲线换成一条在央行设定的利率处的水平线。<\/p>\n\n<h2>从 IS-LM 到 AD-AS<\/h2>\n<p>IS-LM 假设物价不变，只看产出和利率。把物价变化加进来：物价越高，实际货币越少，利率越高，产出越低，就得到一条向下倾斜的总需求曲线（AD）。再加上总供给曲线（AS），就得到 AD-AS 模型，可以同时分析产出和物价。<\/p>\n\n<div class=\"desk\">\n<p>这些模型很简化，但在快速思考政策影响时很有用。比如：政府扩大赤字（IS 右移），如果央行不调整利率，产出上升；如果央行加息抵消，产出变化不大但利率上升。利率处于零下限时，LM 曲线在低利率处是平的，财政扩张不会推高利率，所以挤出效应很小。很多宏观策略师在写报告时，背后的逻辑仍是这几条曲线。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2009 年，美国政府赤字大幅扩大，一些人警告国债收益率将飙升。经济学家克鲁格曼用 IS-LM 模型反驳：经济处于流动性陷阱，LM 曲线在零利率附近是平的，财政扩张不会推高利率。此后几年，尽管美国国债发行大增，10 年期国债收益率在 2012 年降到 1.5% 左右的历史低点。这次争论常被用来说明简单模型在特定环境下的解释力。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>IS 曲线描述商品市场平衡，向下倾斜；LM 曲线描述货币市场平衡，向上倾斜，交点决定利率和产出。<\/li>\n<li>把物价变化加进来，就得到 AD-AS 模型，可以同时分析产出和物价。<\/li>\n<li>它们很简化，但能快速分析财政和货币政策的组合效果，尤其是零利率下限时。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>用 IS-LM 的思路：政府大幅增加支出，同时央行把利率固定在原来的水平不动。产出和利率会怎样？如果央行选择加息呢？<\/summary>\n<div><p>IS 曲线右移。如果央行把利率固定（LM 曲线是水平线），利率不变，产出增加最多，没有挤出效应。如果央行选择加息，利率上升，私人投资和消费减少，产出增加较少，部分财政刺激被挤出。这说明财政政策的效果取决于央行的反应。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-18\"><\/a><\/li>\n<li><a href=\"#L2-23\"><\/a><\/li>\n<li><a href=\"#L2-29\"><\/a><\/li>\n<\/ul><\/div>\n","2.28":"<div class=\"scene\">\n<p>一个工人去年经历了 5% 的通胀，今年谈工资时，他会预期通胀还是 5%，所以要求涨 5%。这是根据过去推测未来。另一个工人看到央行刚换了一位强硬的行长、宣布要坚决把通胀压到 2%，他会想：明年通胀可能降下来，涨 3% 就够了。两种不同的思考方式，对通胀和政策效果的影响截然不同。这就是<strong>适应性预期（adaptive expectations）<\/strong>和<strong>理性预期（rational expectations）<\/strong>的区别。<\/p>\n<\/div>\n\n<h2>适应性预期：看后视镜开车<\/h2>\n<p>适应性预期认为，人们根据过去的经验形成对未来的预期，并且根据新的误差逐步调整。比如今年通胀比预期高，明年就把预期调高一点。<\/p>\n<p>它的问题是：人们会犯系统性的错误。如果政府持续提高通胀，人们总是“慢半拍”，政府就可以一直用意外的通胀暂时降低失业。<\/p>\n\n<h2>理性预期：用所有能得到的信息<\/h2>\n<p>理性预期由经济学家穆斯在 1961 年提出，后来被卢卡斯等人引入宏观经济学。它认为人们会利用所有可得的信息，包括对政策规则的理解，来形成预期。人们会犯错，但不会系统性地犯同样的错。<\/p>\n<p>理性预期带来几个重要结论：<\/p>\n<ul>\n<li><strong>可预期的政策效果有限<\/strong>：如果人们预料到央行会扩张，就会提前提高工资和价格，政策只会带来通胀，不会降低失业。<\/li>\n<li><strong>可信度至关重要<\/strong>：如果央行可信，宣布降低通胀就能直接降低预期，以较小的衰退代价完成反通胀。<\/li>\n<li><strong>卢卡斯批判（Lucas critique）<\/strong>：1976 年，卢卡斯指出，用历史数据估计的经济关系，在政策改变后可能失效，因为人们的预期和行为会随政策改变。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>今天的央行把管理预期作为核心任务：通过通胀目标、前瞻指引、讲话和会议纪要影响市场和公众的预期。市场同样密切跟踪各种预期指标：调查中的家庭和企业通胀预期、从通胀挂钩国债中推算的盈亏平衡通胀率、利率期货隐含的政策利率路径。预期偏离目标，往往比当期数据更让央行担心。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1979 年沃尔克出任美联储主席后大幅加息。按理性预期的乐观看法，如果公众相信美联储决心坚定，通胀预期会迅速下降，反通胀的代价会很小。现实中，经过 1970 年代的反复，公众起初并不相信，美国在 1980 年和 1981–1982 年经历了两次衰退，失业率一度接近 11%。直到通胀真的降下来，美联储的可信度才建立起来。这说明预期的形成介于两种理论之间：可信度需要用行动慢慢赢得。卢卡斯因理性预期的研究在 1995 年获得诺贝尔经济学奖。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>适应性预期根据过去推测未来，会导致系统性错误。<\/li>\n<li>理性预期认为人们利用所有信息、包括对政策的理解来形成预期，可预期的政策效果有限，可信度至关重要。<\/li>\n<li>卢卡斯批判指出，政策改变时，基于历史数据的经济关系可能失效。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家的央行多次宣布要压低通胀，却每次都在经济放缓时让步降息。下一次它再宣布收紧，市场会怎样反应？<\/summary>\n<div><p>市场很可能不相信：根据过去的经验，央行一遇到困难就会让步。通胀预期不会下降，工资和价格谈判仍然按高通胀来定。结果央行要么需要加息更多、造成更深的衰退才能让人信服，要么再次让步、通胀继续。可信度一旦失去，重建的代价很高。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-11\"><\/a><\/li>\n<li><a href=\"#L2-31\"><\/a><\/li>\n<li><a href=\"#L23-5\"><\/a><\/li>\n<\/ul><\/div>\n","2.29":"<div class=\"scene\">\n<p>经济为什么会有周期？一派经济学家说：周期主要来自技术和生产率的真实冲击，比如新技术出现、油价变化，经济只是在理性地调整，政府不必过度干预。另一派说：价格和工资调整很慢，需求变化会让经济偏离潜在产出，造成不必要的失业，政策应该积极应对。这两派分别发展出了<strong>真实经济周期理论（real business cycle，RBC）<\/strong>和<strong>新凯恩斯模型（New Keynesian model）<\/strong>。<\/p>\n<\/div>\n\n<h2>真实经济周期理论<\/h2>\n<p>1982 年，基德兰德和普雷斯科特提出真实经济周期理论。核心观点：<\/p>\n<ul>\n<li>经济波动主要来自“真实”冲击，尤其是生产率的变化，而不是货币或需求。<\/li>\n<li>价格和工资可以灵活调整，市场总是出清，衰退时失业主要是人们对暂时较低工资的理性反应。<\/li>\n<li>周期是经济对冲击的有效率反应，政府干预反而可能有害。<\/li>\n<\/ul>\n<p>它的方法影响深远：从个人和企业的最优选择出发、用严格的数学模型来解释宏观现象。但它很难解释大萧条或 2008 年那样的深度衰退，也很难解释货币政策为什么对经济有明显的影响。<\/p>\n\n<h2>新凯恩斯模型<\/h2>\n<p>新凯恩斯模型接受了 RBC 的方法：从个体最优选择出发、使用理性预期。但它加入了一个关键的现实特征：价格和工资是粘性的（sticky prices），企业不能随时调整价格。<\/p>\n<p>粘性价格带来几个结论：<\/p>\n<ul>\n<li>需求冲击会影响产出和就业，而不仅仅是物价。<\/li>\n<li>货币政策在短期内有实际效果：央行调整利率能影响需求。<\/li>\n<li>央行应该通过调整利率稳定通胀和产出缺口。<\/li>\n<\/ul>\n<p>今天，新凯恩斯框架是大多数央行思考货币政策的基础。<\/p>\n\n<div class=\"desk\">\n<p>两派的分歧影响对政策的判断。如果你认为衰退主要来自供给和生产率变化，就会对大规模刺激持怀疑态度；如果你认为需求不足和价格粘性是主要原因，就会支持积极的货币和财政政策。市场分析中，“需求冲击还是供给冲击”的讨论，背后正是这两种视角。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2004 年，基德兰德和普雷斯科特因“动态宏观经济学的贡献：经济政策的时间一致性和经济周期背后的驱动力”获得诺贝尔经济学奖。新凯恩斯模型则在 1980–1990 年代由泰勒、卡尔沃等人发展起来，卡尔沃在 1983 年提出了一种描述企业随机调整价格的简便方法，被广泛采用。2008 年危机后，两类模型都因缺少金融部门而受到批评，此后的研究开始把银行、信贷和资产价格加入模型。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>真实经济周期理论认为周期主要来自生产率等真实冲击，是经济的有效率调整，政府不必过度干预。<\/li>\n<li>新凯恩斯模型在同样的方法上加入价格粘性，需求冲击和货币政策在短期内会影响产出。<\/li>\n<li>新凯恩斯框架是今天大多数央行的思考基础，2008 年后两类模型都在补充金融部门。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>如果价格和工资可以完全灵活地调整，央行降息还能刺激经济吗？为什么价格粘性让货币政策有效？<\/summary>\n<div><p>如果价格和工资完全灵活，央行增加货币或降息，物价会立刻同比例上升，实际利率和实际产出几乎不变，货币政策只影响物价。价格粘性意味着名义利率变化时，物价调整较慢，实际利率会随之变化，从而影响消费和投资，所以货币政策在短期内能改变产出和就业。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-27\"><\/a><\/li>\n<li><a href=\"#L2-30\"><\/a><\/li>\n<li><a href=\"#L2-31\"><\/a><\/li>\n<\/ul><\/div>\n","2.30":"<div class=\"scene\">\n<p>2008 年 11 月，英国女王访问伦敦政治经济学院，问了经济学家一个问题：“为什么没有人预见到危机？”这个问题刺痛了很多宏观经济学家。当时各大央行用来预测经济、评估政策的主力模型，几乎都没有银行和金融危机的位置。这类模型叫<strong>动态随机一般均衡模型（dynamic stochastic general equilibrium，DSGE）<\/strong>。<\/p>\n<\/div>\n\n<h2>DSGE 是什么<\/h2>\n<p>名字里的每个词都有含义：<\/p>\n<ul>\n<li><strong>动态<\/strong>：考虑时间，人们今天的决定会考虑未来。<\/li>\n<li><strong>随机<\/strong>：经济会受到各种随机冲击，比如技术、需求、政策冲击。<\/li>\n<li><strong>一般均衡<\/strong>：所有市场同时考虑，家庭、企业、政府和央行的行为互相影响。<\/li>\n<\/ul>\n<p>DSGE 模型从家庭和企业的最优选择出发，加入价格粘性等现实摩擦（也就是新凯恩斯模型），再用数据估计参数，用来预测经济和模拟政策效果。<\/p>\n\n<h2>央行怎样用它<\/h2>\n<ul>\n<li><strong>讲故事<\/strong>：把经济变化分解为不同冲击的贡献，比如这次通胀有多少来自需求、多少来自能源价格。<\/li>\n<li><strong>模拟政策<\/strong>：如果加息 0.5 个百分点，未来两年的产出和通胀会怎样。<\/li>\n<li><strong>保持一致性<\/strong>：迫使经济学家把对经济的看法写成一套内在一致的假设。<\/li>\n<\/ul>\n<p>很多央行同时使用多个模型：DSGE、半结构化模型、统计模型和专家判断，DSGE 只是其中之一。<\/p>\n\n<h2>批评与改进<\/h2>\n<p>2008 年后，DSGE 受到大量批评：缺少金融部门、假设代表性个体（忽视收入差异）、假设冲击是小幅的而非剧烈的、对危机的预测能力差。此后研究者加入了银行、抵押品约束、异质家庭等特征，但模型变得更复杂，也更难估计。DSGE 的价值更多在于提供分析框架，而不是精确预测。<\/p>\n\n<div class=\"desk\">\n<p>市场参与者很少直接使用 DSGE，但会关注央行的模型结论，比如央行的经济预测、对中性利率和产出缺口的估计，这些往往部分来自模型。读懂央行的预测报告时，知道它背后是什么样的模型和假设，有助于判断它可能在哪些地方出错。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2003 年，欧洲央行的经济学家斯梅茨和沃特斯发表了一个估计欧元区经济的中型 DSGE 模型，此后被许多央行作为模板，成为央行模型的代表作之一。英格兰银行在 2011 年推出了以 DSGE 为核心的预测平台 COMPASS。2008 年 11 月英女王的问题之后，英国学术院组织经济学家回信，承认未能预见危机主要是“集体想象力的失败”，未能理解整个体系的风险。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>DSGE 模型从个体最优选择出发，考虑时间、随机冲击和所有市场的互动，是央行的主力模型之一。<\/li>\n<li>央行用它分解冲击、模拟政策和保持分析的一致性，通常与其他模型和判断一起使用。<\/li>\n<li>2008 年后它因缺少金融部门等问题受到批评，后来不断加入银行和异质家庭等特征。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个模型在过去二十年的平稳时期预测得很好，但没能预测到一次严重的金融危机。这说明了模型的什么局限？<\/summary>\n<div><p>模型的参数和结构是根据平稳时期的数据估计的，主要描述的是小幅、正常的波动。金融危机往往来自模型中没有的机制，比如杠杆、挤兑、甩卖和信用紧缩，这些在平稳时期很少表现出来。所以模型在平稳时期表现好，不代表它能应对极端情况。这也是风险管理需要压力测试和情景分析、而不只依赖统计模型的原因。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L2-29\"><\/a><\/li>\n<li><a href=\"#L1-24\"><\/a><\/li>\n<li><a href=\"#L24-10\"><\/a><\/li>\n<\/ul><\/div>\n","2.31":"<div class=\"scene\">\n<p>一位老师告诉学生：“期末会有一场很难的考试。”学生因此认真复习。到了考试前一天，老师想：大家都已经学会了，考试只会让大家紧张，不如取消。如果老师真的取消了，下次再说要考试，学生还会认真复习吗？今天看似最好的选择，会破坏明天的可信度。经济学把这个问题叫作<strong>时间不一致（time inconsistency）<\/strong>，它是理解<strong>政策可信度（credibility）<\/strong>的关键。<\/p>\n<\/div>\n\n<h2>时间不一致：当初的承诺，后来不想遵守<\/h2>\n<p>1977 年，基德兰德和普雷斯科特指出：一项政策在宣布时是最优的，但等到执行时，决策者可能有动机改变它。如果公众预料到这一点，就不会相信最初的承诺，政策效果就会打折扣。<\/p>\n<p>在货币政策中，这个问题特别明显：<\/p>\n<ol>\n<li>央行宣布将保持低通胀，工人和企业据此签订工资和价格合同。<\/li>\n<li>合同签订后，央行如果制造一点意外通胀，就能暂时降低失业，看起来很诱人。<\/li>\n<li>公众预料到央行会这样做，一开始就预期更高的通胀。<\/li>\n<li>结果通胀更高，失业却没有降低。<\/li>\n<\/ol>\n<p>巴罗和戈登在 1983 年进一步发展了这个分析，称之为“通胀偏差”（inflation bias）。<\/p>\n\n<h2>怎样建立可信度<\/h2>\n<ul>\n<li><strong>央行独立<\/strong>：把货币政策交给不受选举压力影响的独立央行。<\/li>\n<li><strong>保守的央行行长<\/strong>：任命比社会更厌恶通胀的人。<\/li>\n<li><strong>明确的目标和规则<\/strong>：公开的通胀目标、透明的决策过程。<\/li>\n<li><strong>声誉<\/strong>：长期言行一致积累的可信度。<\/li>\n<li><strong>制度约束<\/strong>：固定汇率、货币局或加入货币联盟，把政策“绑”在外部规则上。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>可信度直接体现在市场价格中：可信的央行宣布收紧，长期通胀预期和长期利率会很快下降；不可信的央行即使加息，市场也可能继续卖出本币和长期债券。新兴市场投资者特别关注央行独立性和政府对央行的干预，央行行长被突然撤换常常引发汇率大跌。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2021 年，土耳其通胀率已经接近 20%，但在总统的压力下，土耳其央行反而多次降息，几年内多次撤换央行行长。土耳其里拉在 2021 年对美元贬值约 45%，2022 年 10 月通胀率达到约 85%。2023 年大选后，新的经济团队转向大幅加息，政策利率最终提高到 50%，才逐步稳定局面。这是一次典型的可信度丧失和重建的过程。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>时间不一致是指宣布时最优的政策，执行时决策者有动机改变，公众预料到这一点就不会相信承诺。<\/li>\n<li>在货币政策中，它导致通胀偏差：通胀更高，失业却没有降低。<\/li>\n<li>央行独立、明确目标、透明决策、声誉和制度约束是建立可信度的主要方式。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个政府宣布“永远不会救助陷入困境的银行”。为什么市场常常不相信这样的承诺？<\/summary>\n<div><p>因为在危机真正发生时，大型银行倒闭可能引发金融体系崩溃、大规模失业，政府届时救助的动机会非常强，这就是时间不一致。市场预料到这一点，就会认为大银行实际上有隐性担保，愿意以更低的利率借钱给它们，银行也因此更敢冒险。所以危机后各国通过“自救”（bail-in）规则、处置计划等制度安排，试图让“不救助”的承诺变得可信。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L7-18\"><\/a><\/li>\n<li><a href=\"#L2-28\"><\/a><\/li>\n<li><a href=\"#L2-33\"><\/a><\/li>\n<\/ul><\/div>\n","2.32":"<div class=\"scene\">\n<p>1974 年，经济学家拉弗在华盛顿一家餐馆里，在一张餐巾纸上画了一条曲线：税率为零时，政府收不到税；税率为 100% 时，没有人愿意工作，政府也收不到税；中间某个地方，税收最多。如果当前税率太高，减税反而能增加税收。这条曲线叫<strong>拉弗曲线（Laffer curve）<\/strong>。它在逻辑上很简单，却成为了几十年税收政策辩论的焦点。<\/p>\n<\/div>\n\n<h2>拉弗曲线的逻辑<\/h2>\n<p>税收收入 = 税率 × 税基。提高税率有两个效果：<\/p>\n<ul>\n<li><strong>直接效果<\/strong>：每一单位税基收更多的税，收入增加。<\/li>\n<li><strong>行为效果<\/strong>：人们减少工作、投资，或者把收入转移、隐藏，税基缩小，收入减少。<\/li>\n<\/ul>\n<p>税率较低时，直接效果占主导；税率很高时，行为效果可能占主导。所以存在一个让税收最大的税率。超过它，减税能增加收入；低于它，减税会减少收入。<\/p>\n\n<h2>争议在哪里<\/h2>\n<p>拉弗曲线的存在几乎没有争议，争议在于：当前的税率在曲线的哪一边？<\/p>\n<ul>\n<li>大多数研究认为，对大多数国家的大部分税种来说，当前税率低于让收入最大的税率，减税通常会减少收入，只是减少的幅度因行为反应而小于静态计算。<\/li>\n<li>对一些容易转移的税基，比如高收入者的收入、跨国公司利润、资本利得，行为反应较大，税率过高时减税可能接近“自我融资”。<\/li>\n<li>行为反应在短期和长期不同，在不同国家也不同。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>税收政策变化会影响企业利润、资本流动和国债供给。减税如果不能自我融资，就意味着更大的赤字和更多国债发行。分析师评估一项减税时，常看官方机构（如美国国会预算办公室、英国预算责任办公室）的“动态评分”：在考虑经济增长和行为反应后，减税会让赤字增加多少。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2012 年，美国堪萨斯州推行大规模减税，包括大幅降低个人所得税率，并对很多“穿透型”企业的收入免税，州长称这是对经济的“一针强心剂”。结果，州税收大幅下降，经济增长并未明显超过周边州，州政府出现严重的预算缺口，被迫削减教育和基础设施支出。2017 年，州议会推翻州长的否决，撤销了大部分减税措施。这个案例常被用来说明：减税未必能通过增长“自我融资”。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>拉弗曲线说明税率过高时，提高税率可能减少税收，存在一个让税收最大的税率。<\/li>\n<li>争议在于当前税率位于曲线的哪一边；大多数研究认为多数税种的税率低于该水平。<\/li>\n<li>对容易转移的税基，行为反应较大；评估减税要看动态评分和对赤字的影响。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家的企业所得税率是 35%，周边国家都是 15%。大量企业把利润转移到周边国家。如果把税率降到 20%，税收可能增加吗？<\/summary>\n<div><p>有可能。企业利润的流动性很强，税率差距大时，大量利润被转移出去，税基很小。降低税率后，一部分利润可能回流、新的企业投资可能进入，税基扩大的幅度如果足够大，可能抵消税率下降的影响。这正是拉弗曲线对流动性高的税基更可能成立的原因，也是近年来全球推行 15% 最低企业税的背景之一。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-22\"><\/a><\/li>\n<li><a href=\"#L8-1\"><\/a><\/li>\n<li><a href=\"#L2-26\"><\/a><\/li>\n<\/ul><\/div>\n","2.33":"<div class=\"scene\">\n<p>2020 年 8 月，美联储宣布了一个重要改变：如果通胀长期低于 2%，它将允许通胀在一段时间内适度高于 2%，以弥补过去的不足。一年后，通胀开始大幅上升。五年后的 2025 年 8 月，美联储又修改了框架，取消了这种“弥补”的做法。宏观政策该怎样制定，经济学家和政策制定者一直在争论。最主要的有三个：<strong>规则还是相机抉择<\/strong>、<strong>平衡预算<\/strong>和<strong>通胀目标<\/strong>。<\/p>\n<\/div>\n\n<h2>争论一：规则还是相机抉择<\/h2>\n<ul>\n<li><strong>规则派<\/strong>：政策应该遵循明确的规则，比如泰勒规则，或者固定的货币增长率。理由是：规则更可预期，能避免时间不一致问题，减少政治干预和决策错误。<\/li>\n<li><strong>相机抉择派<\/strong>：经济太复杂，规则无法预料所有情况，比如 2008 年危机和 2020 年疫情。政策需要根据具体情况灵活应对。<\/li>\n<\/ul>\n<p>现实中，大多数央行采取“受约束的相机抉择”：有明确的目标和框架，但具体操作保留判断空间。<\/p>\n\n<h2>争论二：政府是否应该平衡预算<\/h2>\n<ul>\n<li><strong>支持平衡预算<\/strong>：长期赤字会累积债务，推高利率，挤出私人投资，加重后代负担，并可能失去市场信任。<\/li>\n<li><strong>反对严格平衡<\/strong>：在衰退时强行平衡预算会加剧衰退；政府借钱投资于基础设施、教育等能提高未来增长的项目，可能是合理的；当利率低于增长率时，适度的债务是可持续的。<\/li>\n<\/ul>\n<p>很多国家采用财政规则，比如欧盟的赤字和债务上限、德国的“债务刹车”，但在危机中往往被暂停。<\/p>\n\n<h2>争论三：通胀目标怎样定<\/h2>\n<ul>\n<li><strong>目标数字<\/strong>：大多数发达国家的目标是 2%。有人主张提高到 3% 或 4%，给降息留下更多空间，避免碰到零利率下限。<\/li>\n<li><strong>目标形式<\/strong>：严格的通胀目标、灵活的通胀目标（同时关注就业）、平均通胀目标、价格水平目标、名义 GDP 目标。<\/li>\n<li><strong>双重使命<\/strong>：美联储有就业最大化和物价稳定两个目标，欧洲央行以物价稳定为首要目标。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>这些争论的结果直接影响市场。政策框架的改变会改变市场对未来利率路径的判断：更重视就业的框架意味着利率可能更长时间保持较低；更严格的财政规则意味着国债供给更少。每隔几年，各大央行都会对自己的政策框架进行评估，市场会密切关注这些评估的结论。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1990 年，新西兰成为第一个正式采用通胀目标制的国家，此后很多国家效仿，2% 逐渐成为发达国家的通行目标。2020 年 8 月，美联储采用“灵活的平均通胀目标”，允许通胀在低于目标一段时间后适度超调。2021–2022 年通胀大幅上升后，这一框架被批评让美联储加息太晚。2025 年 8 月，美联储公布新的框架声明，取消了弥补过去不足的做法，回到更传统的灵活通胀目标制。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>规则提高可预期性和可信度，相机抉择提供灵活性，现实中多采用受约束的相机抉择。<\/li>\n<li>平衡预算的争论在于债务风险和逆周期、投资需要之间的权衡，财政规则在危机中常被暂停。<\/li>\n<li>通胀目标的数字和形式都有争论，央行框架的改变会直接影响市场对利率路径的判断。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>如果把通胀目标从 2% 提高到 4%，有什么好处和坏处？<\/summary>\n<div><p>好处：平时的名义利率会更高，衰退时央行有更多降息空间，碰到零利率下限的可能性降低；实际工资和价格的调整也更容易。坏处：更高的通胀会侵蚀储蓄和固定收入，加大价格信号的扭曲；更重要的是，央行改变目标可能损害可信度，人们会担心未来还会继续提高，通胀预期可能失去锚定。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L7-6\"><\/a><\/li>\n<li><a href=\"#L7-7\"><\/a><\/li>\n<li><a href=\"#L2-31\"><\/a><\/li>\n<\/ul><\/div>\n","3.1":"<div class=\"scene\">\n<p>一位顶尖律师打字也比她的秘书快。她该自己打字吗？不该。她每小时做法律工作能赚 3,000 元，而秘书打字每小时只要 100 元。即使她在两件事上都更强，把打字交给秘书、自己专心做法律，两个人加起来都会更好。这个道理放大到国家之间，就是国际贸易最核心的思想：<strong>比较优势（comparative advantage）<\/strong>。<\/p>\n<\/div>\n\n<h2>绝对优势：谁做得更好<\/h2>\n<p>绝对优势（absolute advantage）是指用更少的资源生产同样的东西。亚当·斯密认为，各国应该生产自己有绝对优势的产品，再相互交换。但这留下一个问题：如果一个国家在所有产品上都没有绝对优势，它还能从贸易中获益吗？<\/p>\n\n<h2>比较优势：谁的机会成本更低<\/h2>\n<p>1817 年，大卫·李嘉图给出了答案：重要的是比较优势，也就是机会成本更低。李嘉图的例子是这样的：<\/p>\n<ul>\n<li>葡萄牙生产葡萄酒和布料都比英国更有效率（两种都有绝对优势）。<\/li>\n<li>但葡萄牙在葡萄酒上的优势更大，英国在布料上的劣势相对较小。<\/li>\n<li>所以葡萄牙专门生产葡萄酒、英国专门生产布料，再进行交换，两国都能消费到比自给自足时更多的东西。<\/li>\n<\/ul>\n<p>关键在于：每个国家都一定在某些产品上有比较优势，即使它在所有产品上都没有绝对优势。所以贸易几乎总能给双方带来好处。<\/p>\n\n<h2>比较优势从哪里来<\/h2>\n<ul>\n<li><strong>技术和生产率<\/strong>：某些国家在某些行业的技术更先进。<\/li>\n<li><strong>资源禀赋<\/strong>：土地、矿产、气候、劳动力和资本的多少。<\/li>\n<li><strong>积累的经验和产业集群<\/strong>：长期专注于某个行业，形成供应链和技能。<\/li>\n<\/ul>\n<p>比较优势并不是固定的，会随着投资、教育和技术变化而改变。<\/p>\n\n<div class=\"desk\">\n<p>理解比较优势有助于分析国家和行业的长期竞争力。一个国家的出口结构，反映了它当前的比较优势；出口结构的变化，常常预示着经济转型。投资者看新兴市场时，会关注它在全球分工中的位置：是做低附加值的组装，还是在研发、设计、关键零部件上有优势。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>孟加拉国是一个典型的例子。它在资本和技术上并不占优，但劳动力丰富、成本低，在服装制造上具有很强的比较优势。服装出口约占孟加拉国商品出口总额的八成以上，孟加拉国是全球最大的服装出口国之一，仅次于中国。服装业创造了数百万个就业岗位，尤其是女性就业，对减贫起了重要作用。但这种高度集中也意味着，一旦全球需求下降或成本优势消失，经济会很脆弱。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>绝对优势是用更少资源生产，比较优势是机会成本更低。<\/li>\n<li>每个国家都一定在某些产品上有比较优势，按比较优势分工和交换，双方都能获益。<\/li>\n<li>比较优势来自技术、资源禀赋和积累的经验，会随时间改变。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家在所有产品上都比另一个国家生产效率低。它和效率更高的国家做贸易，会不会吃亏？<\/summary>\n<div><p>整体上不会吃亏。它在效率差距最小的产品上有比较优势，专门生产这些产品出口，换取自己生产起来特别不划算的产品，消费可能性会增加。它的工资会比效率更高的国家低，这反映的是生产率差距，而不是贸易造成的损失。当然，贸易会让国内一部分行业萎缩，受影响的人可能受损。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-1\"><\/a><\/li>\n<li><a href=\"#L3-2\"><\/a><\/li>\n<li><a href=\"#L3-16\"><\/a><\/li>\n<\/ul><\/div>\n","3.2":"<div class=\"scene\">\n<p>2000 年代，美国北卡罗来纳州一个小镇的家具厂接连关门。几千名工人失业，很多人再也没有找到同样收入的工作。同一时期，全美国的消费者却以更低的价格买到了家具、衣服和电子产品。贸易让整个国家受益，但受益和受损的往往不是同一批人。<strong>贸易的收益是分散的，损失却是集中的<\/strong>，这是理解贸易政治的关键。<\/p>\n<\/div>\n\n<h2>贸易让整体受益<\/h2>\n<ul>\n<li><strong>更低的价格和更多选择<\/strong>：消费者能买到更便宜、更多样的商品。<\/li>\n<li><strong>专业化和规模经济<\/strong>：企业可以面向更大的市场，降低成本。<\/li>\n<li><strong>竞争和创新<\/strong>：外国竞争迫使本国企业提高效率。<\/li>\n<li><strong>技术和知识传播<\/strong>：通过进口设备、外商投资学习新技术。<\/li>\n<\/ul>\n\n<h2>但有人受损<\/h2>\n<ul>\n<li><strong>和进口竞争的行业<\/strong>：工人可能失业，企业可能倒闭。<\/li>\n<li><strong>地区集中<\/strong>：受冲击的行业往往集中在少数地区，当地经济整体衰退，影响学校、医院和税收。<\/li>\n<li><strong>调整很难<\/strong>：理论上工人会转到其他行业，现实中换行业、换城市的成本很高，很多人长期失业或收入下降。<\/li>\n<\/ul>\n\n<h2>怎样让受益者补偿受损者<\/h2>\n<p>理论上，贸易的总收益大于总损失，受益者可以补偿受损者后仍有剩余。但补偿往往不会自动发生。各国的做法包括：失业救济、职业培训、贸易调整援助、对受冲击地区的投资。如果这些政策不足，反对贸易的政治力量就会增强。<\/p>\n\n<div class=\"desk\">\n<p>贸易政策的政治风险越来越受市场关注。分析一个国家的关税和贸易政策走向时，要看受贸易冲击的地区和行业在政治上有多大影响力。投资上，贸易开放的赢家通常是出口行业和依赖进口原材料的行业，输家是和进口直接竞争的行业。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>经济学家奥托、多恩和汉森研究了中国 2001 年加入世贸组织后对美国的影响，称之为“中国冲击”（China shock）。他们发现，受进口冲击较大的美国地区，制造业就业大幅下降，失业率和领取救济的人数长期上升，工资下降，而且调整持续了十年以上。相关研究估计，1999 年到 2011 年间，来自中国的进口竞争使美国减少了约 200 万到 240 万个就业岗位。这项研究改变了很多经济学家对贸易调整成本的看法。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>贸易通过更低价格、专业化、竞争和技术传播让整个国家受益。<\/li>\n<li>与进口竞争的行业和地区会受损，损失集中而且调整很慢。<\/li>\n<li>受益者补偿受损者不会自动发生，补偿不足会让反贸易的政治力量增强。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家取消了对进口汽车的关税。哪些人受益，哪些人受损？为什么受损的一方通常更积极地反对？<\/summary>\n<div><p>受益者是买车的消费者（价格下降、选择更多）和使用汽车的企业，以及出口行业（如果其他国家也相应开放）。受损者是本国汽车厂商、工人和零部件供应商。受益分散在几百万消费者身上，每人可能只省一点钱；受损集中在少数企业和地区，对他们来说影响巨大，所以他们更有动力组织起来游说反对。这正是公共选择理论描述的情况。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L3-1\"><\/a><\/li>\n<li><a href=\"#L1-28\"><\/a><\/li>\n<li><a href=\"#L3-4\"><\/a><\/li>\n<\/ul><\/div>\n","3.3":"<div class=\"scene\">\n<p>2000 年代，中国的钢铁需求爆发，铁矿石价格从每吨十几美元涨到 100 多美元。澳大利亚出口的铁矿石数量增加不多，但每吨卖出的价格涨了好几倍，而从国外进口的手机、电脑、汽车价格却没怎么变。用同样多的铁矿石，澳大利亚能换回的进口商品多了好几倍。衡量这种变化的指标叫<strong>贸易条件（terms of trade）<\/strong>。它和人们更熟悉的<strong>贸易差额（trade balance）<\/strong>一起，描述一个国家和世界的买卖关系。<\/p>\n<\/div>\n\n<h2>贸易差额：卖得多还是买得多<\/h2>\n<p>贸易差额 = 出口 − 进口。<\/p>\n<ul>\n<li><strong>贸易顺差（surplus）<\/strong>：出口大于进口。<\/li>\n<li><strong>贸易逆差（deficit）<\/strong>：进口大于出口。<\/li>\n<\/ul>\n<p>贸易差额本身不说明好坏。逆差可能是因为国内投资旺盛、需要进口设备；也可能是因为过度消费、靠借钱维持。顺差可能是因为竞争力强，也可能是因为国内需求太弱。根据部门收支关系，贸易差额最终反映的是一国储蓄和投资之间的差距。<\/p>\n<p>贸易差额是经常账户的主要部分，经常账户还包括服务贸易、海外投资收益和转移支付。<\/p>\n\n<h2>贸易条件：一单位出口能换多少进口<\/h2>\n<p>贸易条件 = 出口价格指数 ÷ 进口价格指数。<\/p>\n<ul>\n<li><strong>贸易条件改善<\/strong>：出口价格相对进口价格上涨，同样的出口能换更多进口，国家实际收入增加。<\/li>\n<li><strong>贸易条件恶化<\/strong>：出口价格相对下跌，需要出口更多才能换回同样的进口。<\/li>\n<\/ul>\n<p>大宗商品出口国的贸易条件随商品价格大幅波动；制造业出口国在原材料价格上涨时贸易条件恶化。<\/p>\n\n<div class=\"desk\">\n<p>贸易条件是分析商品货币（澳元、加元、挪威克朗、巴西雷亚尔等）的重要指标：贸易条件改善，出口收入增加，本币往往走强。分析新兴市场时，贸易条件的大幅恶化（比如油价暴跌对产油国）常常是国际收支危机的先兆。贸易数据公布时，市场还会关注出口和进口的结构变化，判断内外需的强弱。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>受中国需求推动，澳大利亚的贸易条件从 2000 年代初开始大幅改善，在 2011 年前后达到有统计以来的最高水平，比 2000 年代初高出约八成。这次“矿业繁荣”带来了收入增长、矿业投资热潮和澳元走强，澳元兑美元在 2011 年一度高于 1.1。随后商品价格回落，贸易条件下降，矿业投资减少，澳大利亚经历了一段调整期。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>贸易差额是出口减进口，它本身不说明好坏，最终反映储蓄和投资的差距。<\/li>\n<li>贸易条件是出口价格相对进口价格的比率，改善意味着同样的出口能换更多进口。<\/li>\n<li>贸易条件对商品出口国和商品货币影响很大，大幅恶化常是国际收支压力的信号。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>油价暴涨对日本和沙特阿拉伯的贸易条件分别有什么影响？对两国货币可能有什么影响？<\/summary>\n<div><p>日本大量进口石油，油价上涨让进口价格上升，贸易条件恶化，需要出口更多才能换回同样的能源，贸易差额可能转为逆差，日元面临贬值压力。沙特出口石油，油价上涨让出口价格上升，贸易条件大幅改善，收入增加。沙特里亚尔钉住美元，汇率不变，但外汇储备和主权财富基金会增加。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L8-6\"><\/a><\/li>\n<li><a href=\"#L2-25\"><\/a><\/li>\n<li><a href=\"#L18-7\"><\/a><\/li>\n<\/ul><\/div>\n","3.4":"<div class=\"scene\">\n<p>2018 年，美国对数千亿美元的中国商品加征关税。官方的说法是“让中国付钱”。几年后，多项研究得出了一致的结论：关税的成本几乎全部由美国的进口商和消费者承担了。关税看起来是向外国征税，实际上常常是向自己征税。<strong>关税（tariff）<\/strong>、<strong>配额（quota）<\/strong>和<strong>贸易战（trade war）<\/strong>的效果，往往和人们直觉的不一样。<\/p>\n<\/div>\n\n<h2>关税和配额<\/h2>\n<ul>\n<li><strong>关税<\/strong>：对进口商品征收的税。它提高了进口商品在国内的价格，保护国内生产者，同时为政府带来收入。<\/li>\n<li><strong>配额<\/strong>：直接限制进口的数量。效果类似关税，但收入不归政府，而是归获得进口许可的人。<\/li>\n<li><strong>非关税壁垒<\/strong>：技术标准、卫生检疫、本地化要求、复杂的审批程序等，也能限制进口。<\/li>\n<\/ul>\n\n<h2>关税由谁承担<\/h2>\n<p>和税收归宿一样，关税的负担取决于弹性。如果进口国是大买家、外国出口商没有其他市场，出口商可能被迫降价，承担一部分关税。如果外国出口商有很多其他市场，进口国的消费者和企业就要承担大部分关税。关税还会：<\/p>\n<ul>\n<li>提高使用进口原材料的国内企业的成本，削弱它们的竞争力；<\/li>\n<li>保护的行业缺少竞争压力，可能效率下降；<\/li>\n<li>引发对方报复，打击本国出口行业。<\/li>\n<\/ul>\n\n<h2>贸易战：互相报复<\/h2>\n<p>一个国家加征关税，对方报复，再加征，再报复，就形成贸易战。这是一种典型的囚徒困境：每个国家单独加关税似乎有利，但大家都加，所有国家都受损。这也是世界贸易组织（WTO）等多边规则存在的原因：通过互相承诺，避免陷入贸易战。<\/p>\n\n<div class=\"desk\">\n<p>关税和贸易战对市场的影响很直接：受影响行业的股价、相关国家的货币、大宗商品价格都会波动。分析师要评估：关税涉及哪些商品？企业能否转嫁成本或转移供应链？对方会怎样报复？央行会怎样应对关税对通胀和增长的影响？关税同时推高通胀、压低增长，给央行带来两难。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1930 年，美国通过《斯穆特-霍利关税法》，大幅提高两万多种进口商品的关税，其他国家纷纷报复，全球贸易在大萧条期间萎缩了约三分之二。2018–2019 年美国对中国商品加征关税后，经济学家阿米蒂、雷丁和温斯坦等人的研究发现，关税几乎全部转嫁给了美国的进口商和消费者。2025 年 4 月，美国宣布对几乎所有贸易伙伴加征关税，全球股市大幅下跌，此后关税水平在多轮谈判中反复调整。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>关税提高进口商品价格，配额直接限制数量，非关税壁垒也能限制进口。<\/li>\n<li>关税的负担取决于弹性，很多时候主要由进口国的企业和消费者承担。<\/li>\n<li>贸易战是互相报复的囚徒困境，多边规则的作用是帮助各国避免陷入其中。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家对进口钢材加征 25% 的关税。国内钢铁企业、国内汽车制造商、外国钢铁企业、国内消费者，分别会受到什么影响？<\/summary>\n<div><p>国内钢铁企业受益：竞争减少，可以提价、扩产。国内汽车制造商受损：钢材成本上升，竞争力下降，可能提价或减少利润。外国钢铁企业受损：失去部分市场，可能降价或转向其他国家。国内消费者受损：汽车、家电等含钢产品价格上升。如果对方报复，本国的出口行业也会受损。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L1-22\"><\/a><\/li>\n<li><a href=\"#L1-13\"><\/a><\/li>\n<li><a href=\"#LH6-10\"><\/a><\/li>\n<\/ul><\/div>\n","3.5":"<div class=\"scene\">\n<p>2021 年 1 月 1 日，英国正式离开欧盟的单一市场和关税同盟。第二天起，从英国运往法国的货车需要报关、提交原产地证明，部分食品还要兽医检疫。尽管两国签了自由贸易协定，大部分商品不用交关税，但手续和检查让很多小企业的对欧出口大幅减少。<strong>自由贸易协定（free trade agreement）<\/strong>和更深层次的<strong>贸易集团（trade bloc）<\/strong>之间，差别比想象的大得多。<\/p>\n<\/div>\n\n<h2>经济一体化的几个层次<\/h2>\n<ol>\n<li><strong>自由贸易区<\/strong>：成员之间取消关税，但各自保留对外关税。需要原产地规则，防止商品从低关税成员转运。<\/li>\n<li><strong>关税同盟<\/strong>：成员之间取消关税，并对外采用统一关税。不再需要原产地规则。<\/li>\n<li><strong>共同市场或单一市场<\/strong>：再加上劳动力、资本和服务的自由流动，以及统一的标准和规则。<\/li>\n<li><strong>经济与货币联盟<\/strong>：再加上统一货币和协调的经济政策，比如欧元区。<\/li>\n<\/ol>\n<p>层次越深，贸易越顺畅，但成员需要让渡的主权也越多。<\/p>\n\n<h2>贸易创造与贸易转移<\/h2>\n<ul>\n<li><strong>贸易创造（trade creation）<\/strong>：成员之间取消关税后，从效率低的本国生产转向效率高的成员国进口，提高效率。<\/li>\n<li><strong>贸易转移（trade diversion）<\/strong>：从效率更高的非成员国进口，转向因为免税而变得便宜的成员国进口，可能降低效率。<\/li>\n<\/ul>\n<p>区域贸易协定是否有利，取决于两者哪个更大。<\/p>\n\n<h2>主要的贸易协定<\/h2>\n<ul>\n<li><strong>欧盟单一市场<\/strong>：1993 年建成，是最深的区域一体化。<\/li>\n<li><strong>美墨加协定（USMCA）<\/strong>：2020 年取代北美自由贸易协定（NAFTA）。<\/li>\n<li><strong>《区域全面经济伙伴关系协定》（RCEP）<\/strong>：2022 年生效，包括中国、日本、韩国、东盟和澳新，约占全球 GDP 的三成。<\/li>\n<li><strong>《全面与进步跨太平洋伙伴关系协定》（CPTPP）<\/strong>：2018 年生效，英国在 2024 年加入。<\/li>\n<\/ul>\n\n<div class=\"desk\">\n<p>企业和投资者关注贸易协定的原产地规则：在哪里生产、使用多少本地零部件才能享受免税。这直接影响供应链布局。比如美墨加协定提高了汽车的北美零部件比例要求，影响了汽车厂商的采购决策。分析跨境企业时，还要看它所在的贸易集团是否可能扩大、收缩或改变规则。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>英国脱欧后与欧盟签订的《贸易与合作协定》于 2021 年起实施，商品贸易基本免关税，但英国离开了单一市场和关税同盟，海关申报、原产地证明和监管检查重新出现。英国预算责任办公室估计，脱欧将使英国的长期贸易强度下降约 15%、长期生产率下降约 4%。同期，RCEP 于 2022 年 1 月生效，成为按经济规模计算全球最大的自由贸易区。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>经济一体化从自由贸易区、关税同盟、单一市场到货币联盟，层次越深，贸易越顺畅，让渡的主权越多。<\/li>\n<li>区域协定会带来贸易创造和贸易转移，是否有利取决于两者的大小。<\/li>\n<li>原产地规则和非关税壁垒对企业的影响，往往和关税本身一样重要。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>英国和欧盟之间的大部分商品贸易仍然零关税，为什么对英欧贸易的影响还这么大？<\/summary>\n<div><p>因为单一市场的价值不只是零关税，还包括统一的标准、无需海关申报和边境检查、服务和资本的自由流动。离开后，企业需要报关、证明原产地、满足双重监管要求，这些手续对小企业的成本尤其高。服务贸易（如金融服务）失去了通行权，影响更大。贸易壁垒很大一部分是非关税的。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L3-4\"><\/a><\/li>\n<li><a href=\"#L3-7\"><\/a><\/li>\n<li><a href=\"#L3-18\"><\/a><\/li>\n<\/ul><\/div>\n","3.6":"<div class=\"scene\">\n<p>1960 年代初，韩国和许多拉美国家的人均收入差不多，有的拉美国家甚至更高。几十年后，韩国成了发达国家，拥有三星、现代这样的全球企业；很多拉美国家却长期徘徊在中等收入水平。这背后有很多原因，其中一个常被提到的，是两种截然不同的发展策略：<strong>进口替代（import substitution）<\/strong>和<strong>出口导向（export orientation）<\/strong>。<\/p>\n<\/div>\n\n<h2>进口替代：自己造，少进口<\/h2>\n<p>进口替代工业化的思路是：用高关税、配额和补贴保护国内产业，让本国企业生产原本需要进口的工业品，减少对外国的依赖。<\/p>\n<ul>\n<li><strong>流行时期<\/strong>：二战后到 1970 年代，在拉美、印度和部分非洲国家广泛采用。<\/li>\n<li><strong>理由<\/strong>：保护“幼稚产业”成长，避免依赖初级产品出口，加快工业化。<\/li>\n<li><strong>问题<\/strong>：国内市场小，企业难以形成规模；缺少竞争，效率低下、质量较差；依赖进口设备和原材料，外汇短缺；保护形成既得利益，很难取消。<\/li>\n<\/ul>\n\n<h2>出口导向：面向世界市场<\/h2>\n<p>出口导向的思路是：鼓励企业生产面向国际市场的产品，用出口赚取外汇，在国际竞争中提高效率。<\/p>\n<ul>\n<li><strong>代表<\/strong>：日本、韩国、中国台湾、新加坡、中国香港，后来的中国大陆和越南。<\/li>\n<li><strong>手段<\/strong>：出口补贴、低息贷款、汇率保持竞争力、建设出口加工区、吸引外资。<\/li>\n<li><strong>优势<\/strong>：面向巨大的世界市场，企业可以达到规模经济；国际竞争迫使企业提高效率、学习技术；外汇收入可以进口设备。<\/li>\n<\/ul>\n<p>值得注意的是，东亚的出口导向也伴随着大量政府干预，并非纯粹的自由市场，关键在于用出口业绩作为考核和支持企业的标准。<\/p>\n\n<div class=\"desk\">\n<p>今天分析新兴市场时，发展策略仍然重要。出口导向型经济对全球需求和汇率高度敏感，全球经济放缓时受冲击较大；内需驱动、进口替代倾向较强的经济体受外部影响较小，但可能面临效率和外汇问题。近年来，供应链安全的考虑让一些发达国家也开始推行某种形式的进口替代和本地化政策。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>1960 年代起，韩国政府推行出口导向战略，对出口企业提供优惠贷款和税收支持，并定期考核出口目标。韩国出口在 1964 年首次突破 1 亿美元，1977 年突破 100 亿美元，此后又从轻工业逐步升级到钢铁、造船、汽车和半导体。同一时期，阿根廷、巴西等国的进口替代策略在 1980 年代遭遇债务危机和高通胀，此后纷纷转向贸易自由化。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>进口替代用保护措施发展国内产业，减少进口，但常面临市场小、效率低、外汇短缺的问题。<\/li>\n<li>出口导向鼓励面向世界市场生产，利用规模经济和国际竞争提高效率。<\/li>\n<li>东亚的成功也伴随着政府干预，关键在于用出口业绩作为支持企业的标准。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>为什么“用出口业绩考核企业”对产业政策的成功如此重要？<\/summary>\n<div><p>因为国际市场提供了一个政府难以操纵的客观标准：企业的产品能否在国外卖出去、卖得多少，反映了它真实的竞争力。政府可以据此决定继续支持还是停止支持某家企业，避免把资源浪费在只能靠保护生存的低效企业上。而在进口替代中，企业只在受保护的国内市场销售，很难判断它到底是否有竞争力。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L3-4\"><\/a><\/li>\n<li><a href=\"#L2-26\"><\/a><\/li>\n<li><a href=\"#LH4-5\"><\/a><\/li>\n<\/ul><\/div>\n","3.7":"<div class=\"scene\">\n<p>2021 年，全球汽车厂商突然发现，工厂里停着成千上万辆几乎造好的汽车，只因为缺几块价值几美元的芯片。这些芯片可能在台湾地区制造，在马来西亚封装测试，原材料来自日本，设计软件来自美国。一辆汽车的生产，横跨了几十个国家。这就是<strong>全球价值链（global value chains）<\/strong>：<strong>全球化（globalization）<\/strong>最深刻的形态。<\/p>\n<\/div>\n\n<h2>全球化的几个维度<\/h2>\n<ul>\n<li><strong>贸易<\/strong>：商品和服务跨境买卖。<\/li>\n<li><strong>资本<\/strong>：跨境投资、借贷和金融交易。<\/li>\n<li><strong>人员<\/strong>：移民、留学和跨国工作。<\/li>\n<li><strong>信息和技术<\/strong>：知识、数据和技术的传播。<\/li>\n<\/ul>\n<p>历史上有过两次全球化浪潮：第一次在 19 世纪后期到一战前，第二次从二战后开始，在 1990 年代到 2000 年代达到高峰。<\/p>\n\n<h2>全球价值链：把生产拆开<\/h2>\n<p>运输和通信成本下降后，企业可以把一件产品的不同环节放到最适合的地方：研发和设计在发达国家，零部件在技术较强的地区，组装在劳动力成本低的地区。<\/p>\n<ul>\n<li><strong>中间品贸易<\/strong>：今天全球贸易中有很大一部分是零部件和半成品，而不是最终产品。<\/li>\n<li><strong>“微笑曲线”<\/strong>：研发、设计、品牌和售后服务附加值高，组装制造附加值低。<\/li>\n<li><strong>贸易统计的误导<\/strong>：一部在中国组装的手机，出口时按全额计入中国出口，但中国创造的增加值可能只占一小部分。用“增加值贸易”统计，各国的贸易差额会有很大不同。<\/li>\n<\/ul>\n\n<h2>效率与韧性<\/h2>\n<p>全球价值链极大地提高了效率，降低了成本。但它也让生产变得脆弱：一个环节出问题，整条链条都可能停摆。疫情、地缘政治冲突和贸易摩擦后，企业和政府开始强调“韧性”：增加库存、多元化供应商、把部分生产搬回本国或友好国家（近岸外包、友岸外包）。<\/p>\n\n<div class=\"desk\">\n<p>分析一家制造业公司，要了解它的供应链：关键零部件来自哪里、有多少供应商、有没有替代方案。供应链中断会直接影响收入和利润。宏观层面，全球价值链的调整会影响各国的投资、就业和贸易流向，越南、墨西哥、印度等国家近年来吸引了大量转移出来的生产。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2020 年疫情初期，汽车厂商预期需求下降，削减了芯片订单；芯片厂把产能转向需求激增的电脑和手机。2021 年汽车需求快速恢复，芯片却供应不上，加上日本一家芯片工厂火灾和美国得州寒潮停产，短缺进一步加剧。咨询公司 AlixPartners 估计，芯片短缺让全球汽车业在 2021 年损失约 2,100 亿美元收入。此后各国纷纷出台补贴，推动芯片本地化生产。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>全球化包括贸易、资本、人员和信息的跨境流动，历史上有过两次浪潮。<\/li>\n<li>全球价值链把生产拆分到不同国家，提高了效率，中间品贸易占很大比例。<\/li>\n<li>价值链也带来脆弱性，疫情和地缘冲突后企业开始在效率和韧性之间重新权衡。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家公司把所有零部件都从一个最便宜的供应商采购，另一家公司从三个国家的供应商采购，成本高 5%。哪种做法更好？<\/summary>\n<div><p>取决于中断风险的大小和代价。平时，单一供应商的成本更低、利润更高。但如果这个供应商因为灾害、冲突或政策而中断，第一家公司可能整个停产，损失远超过省下的 5%。第二家公司相当于付了一笔“保险费”换取供应链韧性。疫情后很多公司认为，过去低估了中断风险，开始愿意支付这笔保险费。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L3-8\"><\/a><\/li>\n<li><a href=\"#L3-5\"><\/a><\/li>\n<li><a href=\"#L12-22\"><\/a><\/li>\n<\/ul><\/div>\n","3.8":"<div class=\"scene\">\n<p>2019 年 1 月，特斯拉在上海郊区的一片农田上开工建厂。不到一年，第一批国产车就交付了。这是中国第一家外资独资的汽车工厂。特斯拉带来了资金、技术和品牌，也带动了一大批本地供应商。这种外国企业在另一个国家直接建厂、收购企业并参与经营的投资，叫<strong>外商直接投资（foreign direct investment，FDI）<\/strong>。<\/p>\n<\/div>\n\n<h2>FDI 和证券投资的区别<\/h2>\n<ul>\n<li><strong>直接投资<\/strong>：取得企业的控制权或重大影响，通常持股 10% 以上，参与经营管理，期限长。<\/li>\n<li><strong>证券投资（portfolio investment）<\/strong>：买入股票和债券，不参与经营，可以随时买卖，流动性高、波动大。<\/li>\n<\/ul>\n<p>FDI 通常被认为更稳定：工厂建好了很难迅速撤走。证券投资在危机中可能大规模外流，即“热钱”（hot money）。<\/p>\n\n<h2>FDI 的形式和动机<\/h2>\n<p>形式：<\/p>\n<ul>\n<li><strong>绿地投资（greenfield）<\/strong>：新建工厂、设施。<\/li>\n<li><strong>跨国并购（cross-border M&A）<\/strong>：收购当地已有的企业。<\/li>\n<\/ul>\n<p>动机：<\/p>\n<ul>\n<li><strong>市场寻求型<\/strong>：进入当地市场，靠近客户，绕开关税。<\/li>\n<li><strong>效率寻求型<\/strong>：利用当地低成本的劳动力或其他要素。<\/li>\n<li><strong>资源寻求型<\/strong>：获取矿产、能源等资源。<\/li>\n<li><strong>战略资产寻求型<\/strong>：获取技术、品牌、人才和销售网络。<\/li>\n<\/ul>\n\n<h2>东道国的得与失<\/h2>\n<p>好处：资金、就业、技术和管理经验的溢出、带动本地供应商、增加出口和税收。风险：利润汇出、对本地企业的竞争压力、对关键行业和国家安全的担忧、税收优惠竞争。很多国家近年来加强了对外资的国家安全审查，尤其是在科技、基础设施和关键资源领域。<\/p>\n\n<div class=\"desk\">\n<p>分析新兴市场的国际收支时，FDI 是最受欢迎的融资来源：如果一个国家的经常账户逆差主要由 FDI 弥补，风险较低；如果主要靠短期证券投资和外债弥补，风险较高。投资银行的跨境并购业务，也需要处理东道国的外资审查和反垄断审批。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2018 年，中国放开新能源汽车领域的外资股比限制，特斯拉随即成为第一家在中国独资建厂的外国车企。上海超级工厂 2019 年 1 月动工，同年年底开始交付，此后成为特斯拉产量最大的工厂之一，并大量出口到欧洲和亚洲。它的本地化采购带动了大量中国零部件企业进入全球电动车供应链。此后几年，中国本土电动车企业迅速崛起，与特斯拉展开激烈竞争。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>FDI 是取得企业控制权或重大影响的长期投资，比证券投资更稳定。<\/li>\n<li>FDI 包括绿地投资和跨国并购，动机有寻求市场、效率、资源和战略资产。<\/li>\n<li>它带来资金、就业和技术溢出，也引发利润汇出和国家安全方面的担忧。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>两个新兴市场国家的经常账户逆差都是 GDP 的 4%。一个主要靠 FDI 弥补，另一个主要靠外国投资者购买本国国债弥补。哪个风险更大？<\/summary>\n<div><p>靠外国投资者购买国债弥补的国家风险更大。国债投资可以随时卖出，一旦全球风险偏好下降或本国出现问题，资金可能迅速流出，导致本币大幅贬值和利率飙升，难以继续为逆差融资。FDI 是工厂和企业，很难短期撤出，而且通常能提高出口能力，有助于未来减少逆差。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L3-7\"><\/a><\/li>\n<li><a href=\"#L8-7\"><\/a><\/li>\n<li><a href=\"#L15-26\"><\/a><\/li>\n<\/ul><\/div>\n","3.9":"<div class=\"scene\">\n<p>一个巨无霸汉堡，在美国卖 5.7 美元左右，在瑞士要贵得多，在一些新兴市场却便宜得多。同样的汉堡，原料、做法几乎一样，为什么价格差这么多？1986 年，英国《经济学人》杂志用这个问题做了一个半开玩笑的指数：<strong>巨无霸指数（Big Mac index）<\/strong>。它背后的理论叫<strong>购买力平价（purchasing power parity，PPP）<\/strong>，是理解汇率长期走势的起点。<\/p>\n<\/div>\n\n<h2>一价定律<\/h2>\n<p>一价定律（law of one price）认为：如果没有运输成本和贸易壁垒，同样的商品在不同国家，换算成同一种货币后价格应该相同。否则，人们会在便宜的地方买、到贵的地方卖，直到价差消失。<\/p>\n\n<h2>购买力平价<\/h2>\n<p>把一价定律推广到一篮子商品，就是购买力平价：<\/p>\n<ul>\n<li><strong>绝对购买力平价<\/strong>：两国货币的汇率，应该等于两国物价水平之比。<\/li>\n<li><strong>相对购买力平价<\/strong>：汇率的变化，应该等于两国通胀率之差。通胀率高的国家，货币会贬值。<\/li>\n<\/ul>\n<p>巨无霸指数就是一个简化版的绝对购买力平价：如果巨无霸在某国换算成美元后比美国贵，这个国家的货币就被认为“高估”；更便宜，就被认为“低估”。<\/p>\n\n<h2>为什么现实中会偏离<\/h2>\n<ul>\n<li><strong>不可贸易的商品和服务<\/strong>：房租、理发、餐馆服务无法跨境套利。巨无霸的价格里很大一部分是租金和人工。<\/li>\n<li><strong>贸易成本和壁垒<\/strong>：运输、关税、税收。<\/li>\n<li><strong>巴拉萨-萨缪尔森效应<\/strong>：富裕国家生产率高、工资高，服务业价格也高，所以富裕国家的物价普遍更高，货币看起来“高估”。<\/li>\n<li><strong>资本流动<\/strong>：短期内，汇率主要受利率、资金流动和风险偏好影响，可以长期偏离购买力平价。<\/li>\n<\/ul>\n<p>所以购买力平价更多被视为长期的“引力”，而不是短期预测工具。研究发现，汇率偏离购买力平价后，回归的速度很慢，半衰期常常需要几年。<\/p>\n\n<div class=\"desk\">\n<p>外汇策略师常用购买力平价估计货币的长期“合理价值”，判断一种货币是否明显高估或低估。国际比较 GDP 和生活水平时，世界银行和 IMF 用购买力平价汇率换算，因为按市场汇率换算会低估低收入国家的实际生活水平。分析新兴市场时，相对购买力平价也提醒我们：长期高通胀的货币，几乎必然会持续贬值。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>《经济学人》在 1986 年推出巨无霸指数，本来是一个轻松的玩笑，后来却成为最广为人知的汇率指标之一。在大部分年份的指数中，瑞士、挪威等国的巨无霸价格最贵，货币显得高估；而很多新兴市场的巨无霸便宜得多，货币显得低估。杂志后来还推出了“调整后”的版本，把人均收入的差异考虑进去，以部分修正巴拉萨-萨缪尔森效应的影响。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>一价定律认为同样商品在不同国家应该同价，推广到一篮子商品就是购买力平价。<\/li>\n<li>相对购买力平价认为汇率变化等于通胀率之差，高通胀国家的货币会贬值。<\/li>\n<li>不可贸易商品、贸易成本、生产率差异和资本流动让汇率长期偏离购买力平价，回归很慢。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一个国家的通胀率长期比美国高 8 个百分点。按相对购买力平价，它的货币兑美元应该怎样变化？如果它的央行把汇率固定不变，会发生什么？<\/summary>\n<div><p>按相对购买力平价，它的货币应该每年对美元贬值约 8%。如果央行强行把汇率固定，本国商品在国际上会越来越贵，出口竞争力下降、进口增加，经常账户恶化，外汇储备逐渐消耗，最终可能难以维持固定汇率，被迫大幅贬值，引发货币危机。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L7-14\"><\/a><\/li>\n<li><a href=\"#L3-10\"><\/a><\/li>\n<li><a href=\"#L2-2\"><\/a><\/li>\n<\/ul><\/div>\n","3.10":"<div class=\"scene\">\n<p>日本的利率接近零，美国的利率是 5%。一个投资者想：借日元，换成美元，存在美国，每年白赚 5%。这么简单的赚钱机会，为什么不是人人都在做？其实很多人在做，这叫套息交易。但它有一个巨大的风险：如果日元突然升值 10%，一年的利差收益就全没了，还要倒贴。不同货币之间的利率和汇率，被一个重要的关系联系在一起：<strong>利率平价（interest rate parity）<\/strong>。<\/p>\n<\/div>\n\n<h2>抛补利率平价：锁定汇率后不能白赚<\/h2>\n<p>抛补利率平价（covered interest parity，CIP）说的是：如果你用远期合约锁定未来换回的汇率，那么投资于高利率货币和低利率货币，收益应该相同。<\/p>\n<p>原因是套利：如果锁定汇率后还能多赚，大家都会这样做，直到远期汇率调整到消除这个机会。所以：<\/p>\n<ul>\n<li>高利率货币的远期汇率，会比即期汇率更弱（远期贴水）；<\/li>\n<li>远期汇率和即期汇率之差，大致等于两种货币的利差。<\/li>\n<\/ul>\n<p>这正是外汇远期点和外汇掉期定价的基础。<\/p>\n\n<h2>非抛补利率平价：不锁定汇率时<\/h2>\n<p>非抛补利率平价（uncovered interest parity，UIP）说的是：如果不锁定汇率，高利率货币预期会贬值，贬值幅度正好抵消利差，所以投资哪种货币的预期收益相同。<\/p>\n<p>但现实中，非抛补利率平价经常不成立：高利率货币往往并没有按利差贬值，甚至还会升值。这叫“远期溢价之谜”（forward premium puzzle）。所以套息交易平均来看能赚钱，但会周期性地遭遇暴跌：平时慢慢赚利差，危机时高利率货币突然大跌，一次亏掉多年的收益。<\/p>\n\n<h2>2008 年后抛补平价也出了偏差<\/h2>\n<p>理论上抛补利率平价是无风险套利，应该几乎完全成立。但 2008 年后，美元和其他货币之间出现了持续的偏差，表现为交叉货币基差（cross-currency basis）。原因包括银行资本和杠杆限制提高了套利成本，以及全球对美元融资的需求。<\/p>\n\n<div class=\"desk\">\n<p>外汇和利率交易员每天都在用利率平价：给外汇远期和掉期定价、计算对冲成本、判断交叉货币基差是否异常。投资者持有外币债券并对冲汇率风险时，对冲后的收益等于外币收益率加上对冲成本或收益，这个成本主要由利差和交叉货币基差决定。日本和欧洲投资者买美债是否划算，很大程度取决于对冲成本。<\/p>\n<\/div>\n\n<div class=\"case\">\n<p>2024 年 7 月 31 日，日本银行意外加息并暗示继续收紧，美国随后公布的就业数据又弱于预期，市场预期美日利差收窄。大量借日元、买高收益资产的套息交易被迫平仓，日元在几天内大幅升值。8 月 5 日，日经 225 指数单日下跌约 12%，是 1987 年以来最大的单日跌幅，全球股市和高收益货币也随之大跌。这次波动展示了非抛补利率平价不成立时，套息交易“平时赚小钱、出事亏大钱”的特点。<\/p>\n<\/div>\n\n<div class=\"takeaway\"><ol>\n<li>抛补利率平价：锁定远期汇率后，投资不同货币的收益相同，远期点大致等于利差。<\/li>\n<li>非抛补利率平价：不锁定汇率时，高利率货币预期会贬值抵消利差，但现实中常常不成立。<\/li>\n<li>套息交易利用非抛补平价的偏离，平时赚利差，危机时可能突然大幅亏损。<\/li>\n<\/ol><\/div>\n\n<details class=\"think\"><summary>一家日本保险公司买入收益率 4.5% 的美国国债，并用外汇远期把汇率风险全部对冲掉。如果美日短期利差是 4%，它对冲后的收益大概是多少？<\/summary>\n<div><p>按抛补利率平价，对冲成本大约等于两国短期利差，也就是约 4%（再加上交叉货币基差的影响）。对冲后的收益大约是 4.5% − 4% = 0.5%，和直接买日本国债相差不大。所以当美日利差很大时，日本投资者对冲后买美债并不划算，要么接受汇率风险，要么转而投资本国债券。<\/p><\/div><\/details>\n\n<div class=\"more\"><ul>\n<li><a href=\"#L18-2\"><\/a><\/li>\n<li><a href=\"#L18-5\"><\/a><\/li>\n<li><a href=\"#L18-25\"><\/a><\/li>\n<\/ul><\/div>\n","3.11":"<div class=\"scene\">\n<p>2015 年 8 月 11 日，中国人民银行宣布调整人民币汇率中间价的形成机制，人民币对美元一天贬值近 2%，此后几天继续走弱。全球市场震动。随后一年多，为了稳定汇率，中国的外汇储备从约 4 万亿美元的高点减少了近 1 万亿美元，并收紧了资本外流管理。一个国家不能同时拥有三样东西：固定汇率、自由的资本流动和独立的货币政策。这个规律叫<strong>不可能三角（impossible trinity）<\/strong>，也叫“三元悖论”（trilemma）。<\/p>\n<\/div>\n\n<h2>三个目标，只能选两个<\/h2>\n<ul>\n<li><strong>固定汇率<\/strong>：汇率稳定，有利于贸易和投资，减少汇率风险。<\/li>\n<li><strong>资本自由流动<\/strong>：资金可以自由进出，有利于融资和投资效率。<\/li>\n<li><strong>独立的货币政策<\/strong>：央行可以根据本国
